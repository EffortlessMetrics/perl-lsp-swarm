name: Rebuild #11983 on current main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/discover-11983-current-main.yml
      - scripts/maintenance/rebuild_11983_current_main.sh

permissions:
  contents: write

concurrency:
  group: rebuild-11983-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rebuild:
    if: >-
      github.repository == 'EffortlessMetrics/perl-lsp-swarm' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'repair/11983-current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout current-main repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repair/11983-current-main
          fetch-depth: 0

      - name: Reconstruct, strengthen, verify, and publish containment candidate
        run: bash scripts/maintenance/rebuild_11983_current_main.sh
