name: Discover #11983 current-main conflicts

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/discover-11983-current-main.yml

permissions:
  contents: read

concurrency:
  group: discover-11983-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  discover:
    if: >-
      github.repository == 'EffortlessMetrics/perl-lsp-swarm' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'repair/11983-current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout current-main repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repair/11983-current-main
          fetch-depth: 0

      - name: Replay conflicted patches and expose rejected hunks
        shell: bash
        run: |
          set -uo pipefail
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git fetch origin main fix/11955-withdraw-secondary-format-routes
          git merge --no-edit origin/main

          source_commit=d174ec1e9845056b8e1a193001ce88a2ea9eaebe
          parent_commit=470277161c18cd5cfa00e31ea6545e2e7baee461
          if ! git cherry-pick "$source_commit"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=(
              crates/perl-lsp-rs/src/runtime/language/formatting_policy/tests.rs
              crates/perl-lsp-rs/src/runtime/text_sync.rs
              crates/perl-lsp-rs/src/runtime/text_sync/lifecycle.rs
              crates/perl-lsp-rs/tests/lsp_batteries_e2e_workflow_test.rs
            )
            mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
            diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${conflicts[@]}")

            for path in "${conflicts[@]}"; do
              git checkout --ours -- "$path"
              patch="/tmp/$(printf '%s' "$path" | tr '/' '_').patch"
              git diff --binary "$parent_commit" "$source_commit" -- "$path" > "$patch"
              git apply --reject --recount --whitespace=nowarn "$patch" || true
            done

            if find . -name '*.rej' -print -quit | grep -q .; then
              echo "REJECTED_HUNKS"
              find . -name '*.rej' -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
              exit 1
            fi

            git add -- "${conflicts[@]}"
            git cherry-pick --continue
          fi

          second_commit=0f6a4334eb5a53df54a5ed40103659a63578b6f5
          if ! git cherry-pick "$second_commit"; then
            echo "SECOND_COMMIT_CONFLICT $second_commit"
            git diff --name-only --diff-filter=U | sort | sed 's/^/CONFLICT_FILE /'
            exit 1
          fi

          echo "RECONSTRUCTION_APPLIES_CLEANLY"
