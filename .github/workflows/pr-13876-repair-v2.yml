name: PR 13876 bounded repair v2

on:
  push:
    branches:
      - 'claude/gifted-edison-rbuhfr'
    paths:
      - '.github/workflows/pr-13876-repair-v2.yml'

permissions:
  contents: write

concurrency:
  group: pr-13876-bounded-repair-active
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'EffortlessMetrics/perl-lsp-swarm'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout selected PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: 'claude/gifted-edison-rbuhfr'

      - name: Merge current main without discarding either additive module
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git fetch --no-tags origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'conflicts:\n'
            printf '  %s\n' "${conflicts[@]}"
            for path in "${conflicts[@]}"; do
              case "$path" in
                docs/policy/NON_RUST_INVENTORY.md|xtask/src/lib.rs|xtask/src/compiler_profile_observation.rs)
                  git checkout --theirs -- "$path"
                  ;;
                *)
                  echo "unexpected conflict: $path" >&2
                  exit 1
                  ;;
              esac
            done

            python3 - <<'PY'
          from pathlib import Path

          lib = Path('xtask/src/lib.rs')
          text = lib.read_text()
          module = 'pub mod compiler_profile_oracle_adapter;\n'
          if module not in text:
              needle = 'pub mod compiler_profile_observation;\n'
              if needle not in text:
                  raise SystemExit('compiler profile observation module anchor missing')
              text = text.replace(needle, needle + module, 1)
          if 'pub mod parser_accuracy_legacy_population;\n' not in text:
              raise SystemExit('current-main parser accuracy module was not preserved')
          lib.write_text(text)

          observation = Path('xtask/src/compiler_profile_observation.rs')
          text = observation.read_text()
          if 'pub fn ensure_private_safe_text' not in text:
              needle = '/// Validate that a free-text field is non-empty and private-safe.\nfn ensure_private_safe'
              wrapper = '''/// The envelope's private-safety predicate, for adapters that must reject a
          /// source value before it reaches envelope text.
          ///
          /// Every free-text field in the envelope is already checked on construction,
          /// but a receipt-family adapter (#12302 and its E02–E06 siblings) builds that
          /// text out of source identifiers, and a deep failure inside a subject
          /// dimension or a disposition reason is a poor account of what is wrong with
          /// the receipt. Exposing the predicate lets an adapter fail closed early and
          /// name the offending source field instead.
          pub fn ensure_private_safe_text(field: &str, value: &str) -> Result<()> {
              ensure_private_safe(field, value)
          }

          /// Validate that a free-text field is non-empty and private-safe.
          fn ensure_private_safe'''
              if needle not in text:
                  raise SystemExit('private-safety helper anchor missing')
              text = text.replace(needle, wrapper, 1)
          observation.write_text(text)
          PY

            git add docs/policy/NON_RUST_INVENTORY.md xtask/src/lib.rs xtask/src/compiler_profile_observation.rs
            if git diff --name-only --diff-filter=U | grep -q .; then
              git diff --name-only --diff-filter=U
              exit 1
            fi
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m 'Merge current main into compiler-profile oracle adapter'
          fi
          echo "MERGED_MAIN_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Apply the reviewed API and privacy repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/pr-13876-repair.yml').read_text()
          match = re.search(
              r"^\s*REPAIR_SCRIPT_GZIP_BASE64:\s*'([^']+)'\s*$",
              workflow,
              re.MULTILINE,
          )
          if match is None:
              raise SystemExit('repair payload missing from v1 workflow')
          Path('/tmp/pr-13876-repair.py').write_bytes(
              gzip.decompress(base64.b64decode(match.group(1)))
          )
          PY
          python3 /tmp/pr-13876-repair.py
          cargo fmt -p xtask

          git rm -q \
            .github/workflows/pr-13876-repair.yml \
            .github/workflows/pr-13876-repair-v2.yml
          cargo xtask non-rust inventory --write
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          printf 'repair diff:\n'
          printf '  %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/pr-13876-repair.yml|.github/workflows/pr-13876-repair-v2.yml|docs/policy/NON_RUST_INVENTORY.md|xtask/src/compiler_profile_oracle_adapter.rs|xtask/tests/compiler_operating_profile_oracle_adapter.rs)
                ;;
              *)
                echo "repair changed an unowned path: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Run focused combined-tree proof
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p xtask --locked compiler_operating_profile_oracle_adapter
          cargo test -p xtask --locked oracle_receipt_schema
          cargo test -p xtask --locked compiler_profile_observation
          cargo test -p xtask --locked --lib
          cargo clippy -p xtask --lib --locked -- -D warnings -A missing_docs
          cargo fmt -p xtask -- --check
          cargo xtask non-rust inventory --check
          git diff --check

      - name: Commit and push the reviewed repair
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'refactor(compiler-profile): narrow oracle adapter API'
          git status --short
          git push origin HEAD:'claude/gifted-edison-rbuhfr'
          echo "REPAIRED_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Emit repair receipt
        shell: bash
        run: |
          printf 'merged_main=%s\nrepaired_head=%s\n' "$MERGED_MAIN_SHA" "$REPAIRED_HEAD_SHA"
