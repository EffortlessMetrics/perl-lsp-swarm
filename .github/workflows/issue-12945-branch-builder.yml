name: Build issue 12945 candidate

on:
  push:
    branches:
      - fix/12945-system-inc-timeout-retry
    paths:
      - .github/workflows/issue-12945-branch-builder.yml

permissions:
  contents: write

concurrency:
  group: issue-12945-branch-builder
  cancel-in-progress: false

jobs:
  build:
    name: Apply, prove, and commit bounded @INC retry
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: a9664af790888333efbe50a042fa060f3cc2d171
      SOURCE: crates/perl-lsp-rs-core/src/config/mod.rs
      SCRIPT: .github/issue-12945-apply.py
      BUILDER: .github/workflows/issue-12945-branch-builder.yml
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: fix/12945-system-inc-timeout-retry

      - name: Verify accepted base and scaffold
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(git diff --name-only "$BASE_SHA"...HEAD | sort)" = "$(printf '%s\n%s' "$BUILDER" "$SCRIPT" | sort)"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Apply the bounded retry change
        shell: bash
        run: |
          set -euo pipefail
          cp "$SCRIPT" /tmp/issue-12945-apply.py
          python3 /tmp/issue-12945-apply.py
          rm "$SCRIPT" "$BUILDER"
          cargo fmt --all
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n%s\n%s' "$BUILDER" "$SCRIPT" "$SOURCE" | sort)"

      - name: Run focused retry proof
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p perl-lsp-rs-core --lib --locked system_inc_
          cargo test -p perl-lsp-rs-core --lib --locked output_with_timeout_kills_long_running_subprocess

      - name: Run core regression and lint proof
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p perl-lsp-rs-core --lib --locked
          cargo clippy -p perl-lsp-rs-core --all-targets --locked -- -D warnings

      - name: Prove retry, cache, and invalidation tests discriminate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path("crates/perl-lsp-rs-core/src/config/mod.rs")
          baseline = source.read_text(encoding="utf-8")
          mutations = [
              (
                  "retry cap",
                  "const SYSTEM_INC_PROBE_MAX_ATTEMPTS: u8 = 2;",
                  "const SYSTEM_INC_PROBE_MAX_ATTEMPTS: u8 = 3;",
                  "system_inc_timeout_stops_after_two_attempts",
              ),
              (
                  "settled cache gate",
                  "            Some(_) => return,",
                  "            Some(_) => {}",
                  "system_inc_non_timeout_outcome_is_memoized",
              ),
              (
                  "invalidation budget reset",
                  "        self.system_inc_probe_attempts = 0;",
                  "        // mutation: leave the retry budget exhausted",
                  "system_inc_config_invalidation_restores_full_retry_budget",
              ),
          ]

          try:
              for label, old, new, test_name in mutations:
                  if baseline.count(old) != 1:
                      raise SystemExit(
                          f"{label}: expected exactly one mutation target, found {baseline.count(old)}"
                      )
                  source.write_text(baseline.replace(old, new, 1), encoding="utf-8")
                  result = subprocess.run(
                      [
                          "cargo",
                          "test",
                          "-p",
                          "perl-lsp-rs-core",
                          "--lib",
                          "--locked",
                          test_name,
                          "--",
                          "--nocapture",
                      ],
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      check=False,
                  )
                  output = result.stdout
                  if result.returncode == 0:
                      raise SystemExit(f"{label}: mutation survived {test_name}\n{output[-4000:]}")
                  if test_name not in output or "FAILED" not in output:
                      raise SystemExit(
                          f"{label}: failure was not behavioral proof from {test_name}\n{output[-4000:]}"
                      )
                  print(f"mutation rejected: {label} -> {test_name}")
                  source.write_text(baseline, encoding="utf-8")
          finally:
              source.write_text(baseline, encoding="utf-8")
          PY
          cargo fmt --all -- --check
          git diff --check

      - name: Commit only the accepted source claim
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n%s\n%s' "$BUILDER" "$SCRIPT" "$SOURCE" | sort)"
          git commit -m "fix(lsp): retry transient system @INC timeout once (#12945)"
          test "$(git diff --name-only "$BASE_SHA"...HEAD)" = "$SOURCE"
          git push origin "HEAD:${GITHUB_REF_NAME}"
