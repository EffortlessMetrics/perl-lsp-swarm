name: Agent finalize compiler concepts

# Durable closeout trigger: remove this workflow and its repair helpers after validation.
on:
  push:
    branches:
      - agent/compiler-concepts-ledger-6657
    paths:
      - .github/workflows/agent-finalize-compiler-concepts.yml

permissions:
  contents: write

concurrency:
  group: agent-finalize-compiler-concepts
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout triggering candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Correct repair helper idempotence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/repair_compiler_concepts.py")
          text = path.read_text()
          old = '''def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement, found {count}")
              file.write_text(text.replace(old, new, 1))
          '''
          new = '''def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count == 1:
                  file.write_text(text.replace(old, new, 1))
                  return
              if count == 0 and new in text:
                  return
              raise SystemExit(f"{path}: expected one exact replacement, found {count}")
          '''
          if new not in text:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"repair helper definition mismatch: found {count}")
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply reviewed repairs
        run: |
          python3 .github/scripts/repair_compiler_concepts.py
          python3 .github/scripts/repair_compiler_concepts_closeout.py
          python3 .github/scripts/fix_compiler_concept_ast_test.py

      - name: Validate schema syntax
        run: python3 -m json.tool schemas/perl_compiler_concepts.v1.schema.json >/dev/null

      - name: Format candidate
        run: rustfmt --edition 2024 xtask/src/bin/compiler-concepts.rs

      - name: Regenerate status
        run: cargo run -p xtask --bin compiler-concepts -- --write-status

      - name: Verify formatting
        run: rustfmt --edition 2024 --check xtask/src/bin/compiler-concepts.rs

      - name: Verify unit tests
        run: cargo test -p xtask --bin compiler-concepts -- --nocapture

      - name: Verify Clippy
        run: cargo clippy -p xtask --bin compiler-concepts -- -D warnings

      - name: Verify generated status
        run: cargo run -p xtask --bin compiler-concepts -- --check

      - name: Commit production repair
        run: |
          remote_sha="$(git ls-remote origin refs/heads/agent/compiler-concepts-ledger-6657 | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm -f --ignore-unmatch \
            .github/workflows/agent-finalize-compiler-concepts.yml \
            .github/workflows/agent-diagnose-compiler-concepts.yml \
            .github/workflows/agent-repair-compiler-concepts-v3.yml \
            .github/scripts/repair_compiler_concepts.py \
            .github/scripts/repair_compiler_concepts_closeout.py \
            .github/scripts/fix_compiler_concept_ast_test.py
          git add contracts/compiler/perl_compiler_concepts.v1.toml
          git add docs/project/status/perl_compiler_concepts.md
          git add schemas/perl_compiler_concepts.v1.schema.json
          git add xtask/src/bin/compiler-concepts.rs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(compiler): close concept ledger admission gaps"
          git push origin HEAD:refs/heads/agent/compiler-concepts-ledger-6657
