# Authority Transfer Review (#11795) — advisory exact-head review-context check.
#
# Connects the #11793 review-surface denominator (policy/review-surfaces.toml +
# its checked projection docs/policy/REVIEW_SURFACES.md) to one stable advisory
# GitHub check context named exactly `Authority Transfer Review`. For every PR
# targeting main the evaluator reports either the cheap deterministic
# PASS_NOT_APPLICABLE route or per-row typed verdicts for governed surfaces.
#
# Executes ONLY trusted validator code
# (scripts/ci/authority_transfer_review.py + scripts/ci/validate_review_surfaces.py,
# both stdlib-only). The tool/source split below is explicit (#16174):
#
#   TOOL SOURCE — the evaluator scripts are read from a separate checkout of
#   the default branch at its live tip, the same ref `pull_request_target`
#   already trusts to supply this workflow file. They were previously read
#   from the PR's recorded base SHA, which froze the tooling at PR-open time
#   and exited 2 on every PR whose base predates decd96de6 (the commit that
#   added workflow and script together) — the script was simply not in that
#   tree, and `base.sha` never advances, so those PRs could not self-clear.
#
#   EVALUATION SUBJECT — unchanged. The judged base view is still the PR's
#   exact recorded base SHA (proved below), the head is still the exact event
#   head SHA, and candidate material is consumed strictly as bounded data.
#   The candidate head is fetched solely to prove its inert identity against
#   the event payload and to extract its tree with `git archive`; no candidate
#   code is ever executed, so the candidate cannot weaken the evaluator
#   judging it. The extracted candidate tree is additionally walked by the
#   same trusted #11793 invariant set as data, so a denominator-invalidated
#   candidate input can never publish a valid-looking context.
#
# Exit contract: 0 = pass (PASS_NOT_APPLICABLE / PASS_CURRENT_REVIEW),
# 1 = typed review failure (FAIL_*), 3 = NOT_PROVEN/instrument failure. Every
# missing/stale/broken evidence state stays non-green; API or instrument failure
# is never a pass for applicable governed work. A pass means only that the review
# evidence required by the governed surface is current and internally consistent;
# merge readiness and live policy remain separate. Advisory / non-required:
# intentionally absent from required enforcement; promotion belongs to #11796.
# Reviewer packets are supplied by the #11701/#11703 machinery as they land;
# until then governed rows whose required_evidence is current_head_reviewer_packet
# report NOT_PROVEN_GITHUB (no packet source configured at this run), not a
# typed FAIL_REVIEW_MISSING — see issue #16100.
#
# The dogfood receipt uploaded here carries one bounded advisory packet (verdict
# counts, bounded-input state, denominator digests) for the #11796 promotion
# successor.

name: Authority Transfer Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: authority-transfer-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  authority-transfer-review:
    # The display name below IS the published check context name; keep it
    # byte-stable across edits.
    name: Authority Transfer Review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact trusted base authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false
          # Explicit: the trusted-base view the evaluator judges against
          # never pulls linked repositories, even if a future PR adds them.
          submodules: false

      - name: Prove exact base execution
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid base SHA identity"
            exit 1
          fi
          resolved="$(git rev-parse 'HEAD^{commit}')"
          if [ "$resolved" != "$BASE_SHA" ]; then
            printf '::error::Checked-out base %s does not match event base %s\n' \
              "$resolved" "$BASE_SHA"
            exit 1
          fi

      - name: Checkout current tooling authority
        # TOOL SOURCE, not evaluation subject (#16174): the evaluator must be
        # the version that ships alongside this workflow file on the default
        # branch. `pull_request_target` already executes THIS file from that
        # branch, so its tip is exactly as trusted as `base.sha` — only
        # newer — and this keeps the tooling self-consistent with the
        # workflow invoking it. The subject stays bound below: the exact
        # base SHA is checked out and proved, the exact head is fetched and
        # proved, and the candidate tree is extracted as bounded data.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
          path: tooling
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Prove tooling presence (neutral when absent)
        env:
          TOOLING_SCRIPT: tooling/scripts/ci/authority_transfer_review.py
        run: |
          set -euo pipefail
          tool_sha="$(git -C tooling rev-parse HEAD)"
          printf 'Evaluator tooling source: default-branch tip %s (subject base/head binding below is unaffected)\n' "$tool_sha"
          if [ ! -f "$TOOLING_SCRIPT" ]; then
            # #16174 shape 2: a workflow that cannot locate its own
            # evaluator has established nothing about the PR. Report the
            # neutral instrument verdict (exit 3 = NOT_PROVEN), never a
            # pass and never a typed review finding.
            cat > "$GITHUB_STEP_SUMMARY" <<'EOF'
          # Authority Transfer Review (advisory)

          - Result: `NOT_PROVEN_TOOLING`
          - Reason: the evaluator script is absent from the trusted tooling ref; nothing was judged about this run's subject.
          EOF
            echo "::notice::Evaluator absent from tooling ref; NOT_PROVEN instrument failure, no claim about the subject."
            exit 3
          fi

      - name: Prove inert PR head identity
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid PR head SHA identity"
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid PR number identity"
            exit 1
          fi
          # Full history of the head ref (not --depth=1): the changed-file
          # step needs real ancestry to compute the merge base.
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          fetched="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [ "$fetched" != "$HEAD_SHA" ]; then
            printf '::error::Fetched PR head %s does not match event head %s\n' \
              "$fetched" "$HEAD_SHA"
            exit 1
          fi

      - name: Extract candidate tree as bounded data
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_TREE: ${{ runner.temp }}/authority-review-candidate-tree
        run: |
          set -euo pipefail
          mkdir -p "$CANDIDATE_TREE"
          # Fail closed BEFORE extracting a single byte: list every tree
          # entry and reject an absolute path, a `..` traversal component,
          # or a submodule gitlink mode. Symlinks (120000) are deliberately
          # NOT rejected here — the repository tracks one, so rejecting
          # them fails every run; they are deleted after extraction,
          # before anything reads the tree. `git archive | tar -x`
          # writes to disk first and a post-hoc `find -type l` only reports
          # a symlink that already landed, so a crafted candidate head could
          # otherwise write outside CANDIDATE_TREE on this trusted runner.
          git ls-tree -r -z --full-tree "$HEAD_SHA" \
            | python3 tooling/scripts/ci/authority_transfer_review.py --validate-tree-entries
          git archive "$HEAD_SHA" | tar -x -C "$CANDIDATE_TREE"
          # `git archive | tar` preserves symlink entries, and the trusted
          # validator's read calls would follow them out of the extracted
          # tree into the predictable base checkout. Remove every link so
          # the verdict can only reflect the candidate's own regular files.
          #
          # Removal, not rejection: this repository legitimately tracks a
          # symlink (crates/tree-sitter-perl/test/corpus), so every archive
          # of every head contains one. Aborting on its presence failed the
          # job on every pull request and the evaluator never ran at all.
          # Deleting is also the stronger guarantee — nothing is left to
          # follow — and the denominator this walk reads
          # (policy/review-surfaces.toml and its projection) are regular
          # files that no link participates in.
          removed="$(find "$CANDIDATE_TREE" -type l -print -delete | wc -l)"
          printf 'removed %s symlink entries from the bounded candidate tree\n' "$removed"
          if find "$CANDIDATE_TREE" -type l -print -quit | grep -q .; then
            echo "::error::Candidate tree still contains symlink entries after removal"
            exit 3
          fi

      - name: Instrument self-test (broken evidence never masquerades as pass)
        run: |
          set -euo pipefail
          python3 tooling/scripts/ci/authority_transfer_review.py --self-test

      - name: Build bounded changed-file list
        id: changed
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_LIST: ${{ runner.temp }}/authority-review-changed-files.txt
        run: |
          set -euo pipefail
          # Diff from the merge base, not the two-commit form: the event
          # base SHA tracks the moving main tip, so a plain `git diff base
          # head` attributes unrelated main movement to the PR and churns
          # governed-row verdicts.
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          # `-z` is load-bearing, not cosmetic: without it, git C-quotes any
          # path containing a tab, newline, double quote, backslash, or
          # non-ASCII byte (e.g. `a\tb` becomes the literal string
          # `"a\tb"`), and that quoted string never matches the real path
          # against policy/review-surfaces.toml bindings, silently letting a
          # governed change bypass matching. `-z` emits raw NUL-terminated
          # bytes with no quoting; the evaluator parses those directly.
          # `--no-renames` is equally load-bearing: with rename detection
          # on (Git's default), moving a governed file out of its surface
          # emits only the destination path, so the governed row never
          # appears and the run reports PASS_NOT_APPLICABLE for a change
          # that removed governed authority. `--no-renames` emits both sides.
          git diff --no-renames --name-only -z "$MERGE_BASE" "$HEAD_SHA" > "$CHANGED_LIST"
          # Trusted merge-subject identities the evaluator binds packets to
          # (#11795 exact base/head/tree): computed here from the verified
          # fetch, never read from candidate-controlled content.
          HEAD_TREE="$(git rev-parse "${HEAD_SHA}^{tree}")"
          if [[ ! "$MERGE_BASE" =~ ^[0-9a-f]{40}$ || ! "$HEAD_TREE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not derive exact merge-base or head-tree identity"
            exit 3
          fi
          echo "merge_base=${MERGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "head_tree=${HEAD_TREE}" >> "$GITHUB_OUTPUT"

      - name: Publish advisory Authority Transfer Review context
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          CHANGED_LIST: ${{ runner.temp }}/authority-review-changed-files.txt
          CANDIDATE_TREE: ${{ runner.temp }}/authority-review-candidate-tree
          MERGE_BASE_SHA: ${{ steps.changed.outputs.merge_base }}
          HEAD_TREE_SHA: ${{ steps.changed.outputs.head_tree }}
          RECEIPT: target/receipts/authority-transfer-review.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RECEIPT")"
          # Tooling comes from the default-branch checkout (see TOOL SOURCE
          # above); `--root .` keeps the judged denominator on the exact
          # subject base view.
          python3 tooling/scripts/ci/authority_transfer_review.py \
            --root . \
            --candidate-root "$CANDIDATE_TREE" \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --merge-base-sha "$MERGE_BASE_SHA" \
            --head-tree-sha "$HEAD_TREE_SHA" \
            --changed-list "$CHANGED_LIST" \
            --receipt "$RECEIPT" \
            --summary "$GITHUB_STEP_SUMMARY"
          # A missing receipt must never look like a clean advisory pass.
          test -s "$RECEIPT"

      - name: Dispatch summary (no PR context to evaluate)
        if: github.event_name != 'pull_request_target'
        run: |
          set -euo pipefail
          cat > "$GITHUB_STEP_SUMMARY" <<'EOF'
          # Authority Transfer Review (advisory)

          - Result: `PASS_NOT_APPLICABLE`
          - Reason: dispatched without a pull-request context; nothing evaluated.

          Advisory only; result vocabulary and evidence contract live in issue
          #11795 over the #11793 denominator.
          EOF

      - name: Upload advisory dogfood receipt
        # Only a pull-request evaluation writes a receipt; a dispatch run has
        # nothing to upload. A PR run with no receipt has already failed
        # closed at the evaluator step (`test -s`), so a missing file here is
        # a warn, not a second error obscuring the first (#16174 shape 3):
        # one instrument failure, one red.
        if: always() && github.event_name == 'pull_request_target'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authority-transfer-review-receipt
          path: target/receipts/authority-transfer-review.json
          if-no-files-found: warn
