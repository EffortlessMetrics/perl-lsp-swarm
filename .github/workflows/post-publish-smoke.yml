name: Post-publish smoke test

# Verifies that published crates are actually installable and functional.
# "Indexed on crates.io" != "installable and runnable" — this workflow closes
# that gap by installing each binary crate and exercising library crates in a
# fresh downstream project.
#
# Triggers:
#   workflow_dispatch   — manual run, supply a version string
#   workflow_run        — automatic after publish-crates.yml completes

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to verify (e.g. 0.12.2)'
        required: true
        type: string

  workflow_run:
    workflows: ["Publish to crates.io"]
    types: [completed]

concurrency:
  group: post-publish-smoke-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  # Reading the upstream publish run's receipt artifact (#9593).
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolve the version to test. For workflow_run triggers the publish workflow
  # outputs the version it published; for workflow_dispatch the user supplies it.
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_run: ${{ steps.version.outputs.should_run }}

    steps:
      # The publish workflow writes this only after verifying the crates are
      # present in the crates.io sparse index, and never for a dry run, so its
      # presence is evidence of a real publication. Missing artifact is not an
      # error here: the run block below turns its absence into a refusal with a
      # diagnostic, rather than falling back to guessing from the ref.
      - name: Download publication receipt
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publication-receipt
          path: receipt
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RECEIPT_PATH: receipt/publication-receipt.json
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
            SHOULD_RUN="true"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            # Only run when the upstream publish workflow succeeded
            if [ "$WORKFLOW_RUN_CONCLUSION" != "success" ]; then
              echo "Upstream publish workflow did not succeed (conclusion: $WORKFLOW_RUN_CONCLUSION). Skipping smoke test."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "version=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Take the version from the upstream run's publication receipt.
            # Deriving it from the ref name proved only that something
            # release-shaped ran: a branch named v9.9.9 produced a smoke result
            # that read as publication proof for a version nobody published
            # (#9593). The receipt is written by the publish workflow after it
            # verifies the crates on the sparse index.
            if [ ! -f "$RECEIPT_PATH" ]; then
              echo "::warning::Upstream run published no receipt; refusing to guess a version from the ref. Re-run this workflow by dispatch with an explicit version."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "version=unknown" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            VERSION="$(python3 -c '
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  print(json.load(handle).get("version", ""))
          except Exception:
              print("")
          ' "$RECEIPT_PATH")"
            if [ -z "$VERSION" ]; then
              echo "::error::Publication receipt at $RECEIPT_PATH carries no usable version."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "version=unknown" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            SHOULD_RUN="true"
          else
            echo "Unrecognised event: $EVENT_NAME"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "version=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "should_run=${SHOULD_RUN}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

  smoke:
    name: Smoke test v${{ needs.resolve-version.outputs.version }}
    needs: resolve-version
    if: needs.resolve-version.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: stable

      # Warm the registry cache for the exact version we're testing so that
      # `cargo add` and `cargo install` don't have to fetch the full index.
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true

      - name: Run post-publish smoke test
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        run: |
          chmod +x scripts/post-publish-smoke.sh
          bash scripts/post-publish-smoke.sh "$VERSION" 2>&1 | tee /tmp/smoke-output.txt
          EXIT_CODE=${PIPESTATUS[0]}

          # Write to step summary (the script also writes a structured summary
          # via GITHUB_STEP_SUMMARY, but we also append the raw output for
          # easier debugging).
          {
            echo ""
            echo "### Raw output"
            echo '```'
            cat /tmp/smoke-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $EXIT_CODE

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: smoke-test-results-v${{ needs.resolve-version.outputs.version }}
          path: /tmp/smoke-output.txt
          retention-days: 30

      - name: Annotate on failure
        if: failure()
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          echo "::error::Post-publish smoke test failed for v${VERSION}. Check the job summary for details."
          echo ""
          echo "Common causes:"
          echo "  - cargo install failure: crate not yet fully propagated through crates.io CDN (wait ~5 min, re-run)"
          echo "  - Version mismatch: binary reports wrong version (stale cache in CI — clear runner cache)"
          echo "  - cargo add / cargo test failure: public API changed or a dependency was not published"
          echo "  - tree-sitter-perl-c parse failure: C grammar FFI broke between versions"
