# Workflow Security Ratchet — candidate self-test (advisory)

name: Workflow Security Ratchet Selftest

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.ci/workflow-security-baseline.json'
      - 'scripts/ci/workflow_security_ratchet.py'
      - 'scripts/ci/test_workflow_security_ratchet.py'
  push:
    branches:
      - 'agent/action-pin-provenance-6888'
    paths:
      - '.github/workflows/workflow-security-ratchet-selftest.yml'

concurrency:
  group: workflow-security-ratchet-selftest-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate-selftest:
    if: github.event_name == 'pull_request'
    name: Candidate scanner self-test (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate as read-only source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run candidate scanner unit tests
        run: python3 -m unittest scripts/ci/test_workflow_security_ratchet.py

      - name: Validate candidate baseline and control digests
        run: |
          mkdir -p target/receipts
          python3 scripts/ci/workflow_security_ratchet.py validate-baseline \
            --root . \
            --baseline .ci/workflow-security-baseline.json \
            --baseline-root . \
            --report target/receipts/workflow-security-candidate.json

      - name: Upload candidate self-test receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-security-candidate-${{ github.event.pull_request.head.sha }}
          path: target/receipts/workflow-security-candidate.json
          if-no-files-found: warn
          retention-days: 14

  refresh-candidate-baseline:
    if: github.event_name == 'push'
    name: Refresh exact candidate baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Regenerate and prove exact baseline
        run: |
          python3 scripts/ci/workflow_security_ratchet.py baseline \
            --root . \
            --output .ci/workflow-security-baseline.json
          python3 scripts/ci/workflow_security_ratchet.py validate-baseline \
            --root . \
            --baseline .ci/workflow-security-baseline.json \
            --baseline-root . \
            --report target-workflow-security-candidate.json
          git diff --check

      - name: Commit candidate-owned baseline repair
        run: |
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add .ci/workflow-security-baseline.json
          git commit -m 'test(ci): refresh workflow-security baseline for exact action pins'
          git push origin 'HEAD:agent/action-pin-provenance-6888'
