name: Agent rustfmt export

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/agent-rustfmt-export.yml'
      - 'xtask/tests/editor_client_compat_contract.rs'
      - 'xtask/tests/support/agent_client_compat.rs'
      - 'xtask/tests/support/client_compat_fixture.rs'
      - 'xtask/tests/support/editor_client_compat.rs'

permissions:
  contents: write

jobs:
  rustfmt-export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Install exact Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Format candidate Rust
        shell: bash
        run: rustup run 1.95.0 cargo fmt --all

      - name: Commit exact formatted sources
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          paths=(
            xtask/tests/editor_client_compat_contract.rs
            xtask/tests/support/agent_client_compat.rs
            xtask/tests/support/client_compat_fixture.rs
            xtask/tests/support/editor_client_compat.rs
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Exact Rust 1.95 rustfmt output is already committed."
            exit 0
          fi
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add -- "${paths[@]}"
          git commit -m 'style(editor-clients): apply rustfmt to #7777'
          git push origin "HEAD:${HEAD_REF}"

      - name: Upload exact formatted sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: agent-rustfmt-export-${{ github.sha }}
          path: |
            xtask/tests/editor_client_compat_contract.rs
            xtask/tests/support/agent_client_compat.rs
            xtask/tests/support/client_compat_fixture.rs
            xtask/tests/support/editor_client_compat.rs
          if-no-files-found: error
          retention-days: 1
