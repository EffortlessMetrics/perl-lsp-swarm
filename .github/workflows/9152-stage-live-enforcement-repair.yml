name: 9152 stage live-enforcement repair

on:
  push:
    branches: [codex/p2-live-enforcement-model]

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout construction candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: codex/p2-live-enforcement-model
          path: construction
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout accepted static-contract stack parent
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: codex/10124-static-app-bindings
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize stacked production candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/issue-9152
          git rev-parse HEAD > target/issue-9152/base-sha.txt
          for path in \
            scripts/ci/reconcile_github_enforcement_snapshot.py \
            scripts/ci/test_reconcile_github_enforcement_snapshot.py \
            docs/ci/github-enforcement-snapshot.md
          do
            mkdir -p "$(dirname "$path")"
            cp "../construction/$path" "$path"
          done
          python3 ../construction/scripts/ci/stage_issue_9152_repair.py
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/gate-enforcement-contract.yml")
          text = workflow.read_text(encoding="utf-8")
          old = "            scripts/ci/test_gate_enforcement_app_bindings.py\n"
          new = (
              "            scripts/ci/test_gate_enforcement_app_bindings.py \\\n"
              "            scripts/ci/test_reconcile_github_enforcement_snapshot.py\n"
          )
          if text.count(old) != 1:
              raise SystemExit("gate-enforcement test wiring marker did not match exactly once")
          workflow.write_text(text.replace(old, new, 1), encoding="utf-8")

          docs = Path("docs/ci/github-enforcement-snapshot.md")
          text = docs.read_text(encoding="utf-8")
          old_claim = (
              "Repository-owned static producers imply the GitHub Actions app identity (`15368`) already represented by the existing static producer contract. "
              "Live checks that are unbound or bound to another app are therefore visible as app-identity drift rather than being flattened away."
          )
          new_claim = (
              "Producer identity supplies no enforcement binding. The static contract may declare `classic_app_id` and `ruleset_integration_id` independently; "
              "an absent binding remains unconstrained rather than being synthesized from a repository-owned job."
          )
          if text.count(old_claim) != 1:
              raise SystemExit("outdated producer-binding claim did not match exactly once")
          text = text.replace(old_claim, new_claim, 1)
          old_cli = (
              "  --snapshot snapshot.json \\\n"
              "  --static-receipt target/receipts/gate-enforcement-contract.json \\\n"
              "  --receipt target/receipts/github-enforcement-union.json"
          )
          new_cli = (
              "  --snapshot snapshot.json \\\n"
              "  --static-receipt target/receipts/gate-enforcement-contract.json \\\n"
              "  --authority reconciliation-authority.json \\\n"
              "  --receipt target/receipts/github-enforcement-union.json"
          )
          if text.count(old_cli) != 1:
              raise SystemExit("reconcile CLI example did not match exactly once")
          docs.write_text(text.replace(old_cli, new_cli, 1), encoding="utf-8")
          PY

      - name: Verify stacked offline model
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/issue-9152
          exec > >(tee target/issue-9152/proof.log) 2>&1
          git diff --check
          python3 -m py_compile \
            scripts/ci/reconcile_github_enforcement_snapshot.py \
            scripts/ci/test_reconcile_github_enforcement_snapshot.py
          python3 -m unittest -v scripts/ci/test_reconcile_github_enforcement_snapshot.py
          python3 -m unittest -v \
            scripts/ci/test_validate_gate_enforcement_contract.py \
            scripts/ci/test_gate_enforcement_app_bindings.py
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            .github/workflows/gate-enforcement-contract.yml \
            docs/ci/github-enforcement-snapshot.md \
            scripts/ci/reconcile_github_enforcement_snapshot.py \
            scripts/ci/test_reconcile_github_enforcement_snapshot.py
          git commit -m "feat(ci): reconcile source-specific live enforcement"
          python3 scripts/ci/validate_gate_enforcement_contract.py \
            --root . \
            --receipt target/issue-9152/gate-enforcement-contract.json

      - name: Capture verified stack candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(cat target/issue-9152/base-sha.txt)"
          git diff --binary "$base_sha"..HEAD > target/issue-9152/candidate.patch
          tar -czf target/issue-9152/candidate-files.tar.gz \
            .github/workflows/gate-enforcement-contract.yml \
            docs/ci/github-enforcement-snapshot.md \
            scripts/ci/reconcile_github_enforcement_snapshot.py \
            scripts/ci/test_reconcile_github_enforcement_snapshot.py
          sha256sum target/issue-9152/candidate.patch \
            target/issue-9152/candidate-files.tar.gz \
            > target/issue-9152/SHA256SUMS

      - name: Upload verified stack receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: issue-9152-verified-stack
          path: candidate/target/issue-9152
          if-no-files-found: error
          retention-days: 1
