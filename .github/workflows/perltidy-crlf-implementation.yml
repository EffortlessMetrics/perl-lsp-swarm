name: Temporary PerlTidy CRLF implementation proof

# Branch-local transport revision 3; removed before review.
on:
  push:
    branches:
      - fix/perltidy-preserve-crlf-layout
    paths:
      - .github/workflows/perltidy-crlf-implementation.yml

permissions:
  contents: write

concurrency:
  group: perltidy-crlf-implementation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  implement-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0

      - name: Apply count-checked native formatter repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/perl-lsp-perltidy/src/native/implementation.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  """        for line in source.split_inclusive('\\n') {
                      let (body, line_ending) = split_line_ending(line);
                      formatted
                          .push_str(&format_simple_line(body, config).unwrap_or_else(|| body.to_string()));
                      formatted.push_str(line_ending);
                  }
          """,
                  """        for line in source.split_inclusive('\\n') {
                      let (body, line_ending) = split_line_ending(line);
                      let formatted_body =
                          format_simple_line(body, config).unwrap_or_else(|| body.to_string());
                      formatted.push_str(&preserve_generated_line_endings(formatted_body, line_ending));
                      formatted.push_str(line_ending);
                  }
          """,
                  "document formatting loop",
              ),
              (
                  """            if let Some(formatted_line) = formatted_body {
                      if formatted_line != body {
          """,
                  """            if let Some(formatted_line) = formatted_body {
                      let formatted_line =
                          preserve_generated_line_endings(formatted_line, line_ending);
                      if formatted_line != body {
          """,
                  "range formatting loop",
              ),
              (
                  """fn split_line_ending(line: &str) -> (&str, &str) {
              if let Some(body) = line.strip_suffix("\\r\\n") {
                  (body, "\\r\\n")
              } else if let Some(body) = line.strip_suffix('\\n') {
                  (body, "\\n")
              } else {
                  (line, "")
              }
          }

          pub(super) fn range_includes_line""",
                  """fn split_line_ending(line: &str) -> (&str, &str) {
              if let Some(body) = line.strip_suffix("\\r\\n") {
                  (body, "\\r\\n")
              } else if let Some(body) = line.strip_suffix('\\n') {
                  (body, "\\n")
              } else {
                  (line, "")
              }
          }

          fn preserve_generated_line_endings(formatted: String, source_line_ending: &str) -> String {
              if source_line_ending != "\\r\\n" || !formatted.contains('\\n') {
                  return formatted;
              }

              let mut normalized = String::with_capacity(formatted.len());
              let mut remaining = formatted.as_str();
              while let Some((line, tail)) = remaining.split_once('\\n') {
                  normalized.push_str(line.strip_suffix('\\r').unwrap_or(line));
                  normalized.push_str("\\r\\n");
                  remaining = tail;
              }
              normalized.push_str(remaining);
              normalized
          }

          pub(super) fn range_includes_line""",
                  "line-ending helper seam",
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one {label}; found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Format candidate
        run: cargo fmt -p perl-lsp-perltidy

      - name: Reject whitespace damage
        run: git diff --check

      - name: Focused line-ending proof
        run: cargo test -p perl-lsp-perltidy --test native_formatter_line_ending_tests --locked

      - name: Crate Clippy proof
        run: cargo clippy -p perl-lsp-perltidy --all-targets --locked -- -D warnings

      - name: Crate all-targets proof
        run: cargo test -p perl-lsp-perltidy --all-targets --locked

      - name: Commit proven candidate
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          actual=$(git status --porcelain=v1 | sed -E 's/^.. //' | sort)
          if [ -z "$actual" ]; then
            echo "::error::Proof produced no implementation diff"
            exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              crates/perl-lsp-perltidy/src/native/implementation.rs|crates/perl-lsp-perltidy/tests/native_formatter_line_ending_tests.rs) ;;
              *) printf '::error::Unexpected candidate path: %s\n' "$path"; exit 1 ;;
            esac
          done <<< "$actual"

          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            crates/perl-lsp-perltidy/src/native/implementation.rs \
            crates/perl-lsp-perltidy/tests/native_formatter_line_ending_tests.rs
          git commit -m "fix(perltidy): preserve CRLF in generated layout"
          gh auth setup-git
          git push origin "HEAD:${BRANCH_NAME}"
