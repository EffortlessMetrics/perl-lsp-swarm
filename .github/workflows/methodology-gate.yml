name: Methodology Gate

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  methodology-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable (master)
        with:
          toolchain: stable

      - name: Run methodology gate (advisory)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Event-payload body/labels are an immutable snapshot replayed on
            # reruns (issue #15759); prefer the binary's existing live `--pr`
            # snapshot. A failed `gh` lookup fails the step (fail-closed) —
            # never fall back to the stale fixture.
            pr_number="${{ github.event.pull_request.number }}"
            echo "methodology-gate: live PR snapshot via gh pr view (pr=${pr_number})"
            cargo xtask methodology-gate \
              --pr "${pr_number}" \
              --receipt target/receipts/methodology-gate.json
          else
            # push/merge_group: no PR to fetch; the fixture remains the
            # locator input for non-PR events and offline self-tests.
            cargo xtask methodology-gate \
              --fixture "${GITHUB_EVENT_PATH}" \
              --receipt target/receipts/methodology-gate.json
          fi

      - name: Upload methodology receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: methodology-gate-receipt
          path: target/receipts/methodology-gate.json
          if-no-files-found: ignore
