name: Zed Integration Candidate

on:
  pull_request:
    paths:
      - '.ci/fixtures/zed-perl-upstream/**'
      - '.ci/schemas/zed-*.json'
      - '.github/workflows/zed-integration-candidate.yml'
      - 'scripts/check-zed-*.sh'
      - 'xtask/tests/zed_*.rs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zed-integration-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Format stacked Zed programme contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout head branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply exact rustfmt output to Zed contract tests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          shopt -s nullglob
          tests=(xtask/tests/zed_*.rs)
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo 'error: no Zed contract tests found' >&2
            exit 1
          fi
          rustfmt --edition 2024 "${tests[@]}"
          mapfile -t changed < <(git diff --name-only -- 'xtask/tests/zed_*.rs')
          if [[ ${#changed[@]} -eq 0 ]]; then
            exit 0
          fi
          mapfile -t unexpected < <(git diff --name-only | grep -v '^xtask/tests/zed_.*\.rs$' || true)
          if [[ ${#unexpected[@]} -ne 0 ]]; then
            printf 'error: formatter changed unexpected files:\n%s\n' "${unexpected[*]}" >&2
            exit 1
          fi
          git diff --check
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add -- "${changed[@]}"
          git commit -m 'style(zed): apply rustfmt to programme contracts'
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Stop after bounded formatting pass
        run: exit 0
