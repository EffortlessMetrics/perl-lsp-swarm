name: Zed Integration Candidate

on:
  pull_request:
    paths:
      - '.ci/fixtures/zed-perl-upstream/**'
      - '.github/workflows/zed-integration-candidate.yml'
      - '.kiro/steering/product.md'
      - 'book/src/reference/editor-setup-canonical.md'
      - 'README.md'
      - 'docs/EDITORS/ZED_SETUP.md'
      - 'docs/how-to/EDITOR_SETUP.md'
      - 'docs/how-to/TROUBLESHOOTING.md'
      - 'docs/integrations/ZED_UPSTREAM_SUBMISSION.md'
      - 'docs/reference/FAQ.md'
      - 'scripts/apply-zed-perl-upstream.sh'
      - 'scripts/check-zed-upstream-candidate.sh'
      - 'xtask/tests/zed_support_claims.rs'
  push:
    branches: [main]
    paths:
      - '.ci/fixtures/zed-perl-upstream/**'
      - '.github/workflows/zed-integration-candidate.yml'
      - '.kiro/steering/product.md'
      - 'book/src/reference/editor-setup-canonical.md'
      - 'README.md'
      - 'docs/EDITORS/ZED_SETUP.md'
      - 'docs/how-to/EDITOR_SETUP.md'
      - 'docs/how-to/TROUBLESHOOTING.md'
      - 'docs/integrations/ZED_UPSTREAM_SUBMISSION.md'
      - 'docs/reference/FAQ.md'
      - 'scripts/apply-zed-perl-upstream.sh'
      - 'scripts/check-zed-upstream-candidate.sh'
      - 'xtask/tests/zed_support_claims.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-integration-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build staged Zed extension candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Check staged identities and claims
        run: bash scripts/check-zed-upstream-candidate.sh

      - name: Generate isolated candidate lockfile
        run: cargo generate-lockfile --manifest-path .ci/fixtures/zed-perl-upstream/zed-perl/Cargo.toml

      - name: Format
        run: cargo fmt --manifest-path .ci/fixtures/zed-perl-upstream/zed-perl/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path .ci/fixtures/zed-perl-upstream/zed-perl/Cargo.toml --all-targets --locked -- -D warnings

      - name: Host helper tests
        run: cargo test --manifest-path .ci/fixtures/zed-perl-upstream/zed-perl/Cargo.toml --locked

      - name: Build Zed WASM extension
        run: cargo build --manifest-path .ci/fixtures/zed-perl-upstream/zed-perl/Cargo.toml --locked --target wasm32-wasip2 --release

      - name: Run repository claim guards
        run: cargo test -p xtask --test zed_support_claims --locked
