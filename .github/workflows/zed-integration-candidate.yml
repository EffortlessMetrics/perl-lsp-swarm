name: Zed Integration Candidate

on:
  pull_request:
    paths:
      - '.ci/fixtures/zed-perl-upstream/**'
      - '.github/workflows/zed-integration-candidate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zed-integration-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Preserve known-good managed perllsp versions
    if: github.head_ref == 'agent/zed-integration-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Remove eager perllsp cleanup
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          source='.ci/fixtures/zed-perl-upstream/zed-perl/src/perl.rs'
          python3 - "$source" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old = '            remove_old_downloads("perllsp-", &version_dir);\n'
          new = (
              '            // Retain older perllsp versions: the extension API does not report\n'
              '            // successful server startup, so deleting them here would discard the\n'
              '            // known-good fallback before Zed observes launch success.\n'
          )
          if text.count(old) != 1:
              raise SystemExit('error: expected one eager perllsp cleanup call')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add "$source"
          git commit -m 'fix(zed): preserve known-good managed perllsp versions'
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Stop after bounded safety repair
        run: exit 0
