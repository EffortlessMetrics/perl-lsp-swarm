name: Zed Integration Candidate

on:
  pull_request:
    paths:
      - '.ci/fixtures/zed-perl-upstream/**'
      - '.ci/schemas/zed-*.json'
      - '.github/workflows/zed-integration-candidate.yml'
      - 'scripts/check-zed-*.sh'
      - 'xtask/tests/zed_*.rs'
      - 'xtask/tests/support/zed_host_compat.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-integration-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Format stacked Zed programme contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout head branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Report rustfmt ratchet for Zed contract tests
        shell: bash
        run: |
          shopt -s nullglob
          tests=(xtask/tests/zed_*.rs xtask/tests/support/zed_host_compat.rs)
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo 'error: no Zed contract tests found' >&2
            exit 1
          fi
          rustfmt --edition 2024 --check "${tests[@]}"

      - name: Run Zed programme contracts selected by path filters
        shell: bash
        run: |
          bash scripts/check-zed-programme-contracts.sh
          bash scripts/check-zed-upstream-candidate.sh
          cargo test -p xtask --locked \
            --test zed_host_receipt \
            --test zed_public_registry_receipt \
            --test zed_support_claims
