name: Zed Integration Candidate

on:
  pull_request:
    paths:
      - '.ci/fixtures/zed-perl-upstream/**'
      - '.github/workflows/zed-integration-candidate.yml'
      - '.kiro/steering/product.md'
      - 'book/src/reference/editor-setup-canonical.md'
      - 'README.md'
      - 'docs/EDITORS/ZED_SETUP.md'
      - 'docs/how-to/EDITOR_SETUP.md'
      - 'docs/how-to/TROUBLESHOOTING.md'
      - 'docs/integrations/ZED_UPSTREAM_SUBMISSION.md'
      - 'docs/reference/FAQ.md'
      - 'scripts/apply-zed-perl-upstream.sh'
      - 'scripts/check-zed-upstream-candidate.sh'
      - 'xtask/tests/zed_support_claims.rs'
  push:
    branches: [main]
    paths:
      - '.ci/fixtures/zed-perl-upstream/**'
      - '.github/workflows/zed-integration-candidate.yml'
      - '.kiro/steering/product.md'
      - 'book/src/reference/editor-setup-canonical.md'
      - 'README.md'
      - 'docs/EDITORS/ZED_SETUP.md'
      - 'docs/how-to/EDITOR_SETUP.md'
      - 'docs/how-to/TROUBLESHOOTING.md'
      - 'docs/integrations/ZED_UPSTREAM_SUBMISSION.md'
      - 'docs/reference/FAQ.md'
      - 'scripts/apply-zed-perl-upstream.sh'
      - 'scripts/check-zed-upstream-candidate.sh'
      - 'xtask/tests/zed_support_claims.rs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zed-integration-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build staged Zed extension candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply and commit exact workspace rustfmt output
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          cargo fmt --all
          mapfile -t changed < <(git diff --name-only -- '*.rs')
          if [[ ${#changed[@]} -eq 0 ]]; then
            exit 0
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              xtask/tests/zed_support_claims.rs|.ci/fixtures/zed-perl-upstream/zed-perl/src/perl.rs) ;;
              *) echo "error: rustfmt changed unexpected file $path" >&2; exit 1 ;;
            esac
          done
          git diff --check
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add -- "${changed[@]}"
          git commit -m 'style(zed): apply workspace rustfmt'
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Stop after bounded formatting repair
        run: exit 0
