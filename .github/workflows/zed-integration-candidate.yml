name: Zed Integration Candidate

on:
  pull_request:
    paths:
      - '.ci/fixtures/zed-perl-upstream/**'
      - '.github/workflows/zed-integration-candidate.yml'
      - '.kiro/steering/product.md'
      - 'book/src/reference/editor-setup-canonical.md'
      - 'README.md'
      - 'docs/EDITORS/ZED_SETUP.md'
      - 'docs/how-to/EDITOR_SETUP.md'
      - 'docs/how-to/TROUBLESHOOTING.md'
      - 'docs/integrations/ZED_UPSTREAM_SUBMISSION.md'
      - 'docs/reference/FAQ.md'
      - 'scripts/apply-zed-perl-upstream.sh'
      - 'scripts/check-zed-upstream-candidate.sh'
      - 'xtask/tests/zed_support_claims.rs'
  push:
    branches: [main]
    paths:
      - '.ci/fixtures/zed-perl-upstream/**'
      - '.github/workflows/zed-integration-candidate.yml'
      - '.kiro/steering/product.md'
      - 'book/src/reference/editor-setup-canonical.md'
      - 'README.md'
      - 'docs/EDITORS/ZED_SETUP.md'
      - 'docs/how-to/EDITOR_SETUP.md'
      - 'docs/how-to/TROUBLESHOOTING.md'
      - 'docs/integrations/ZED_UPSTREAM_SUBMISSION.md'
      - 'docs/reference/FAQ.md'
      - 'scripts/apply-zed-perl-upstream.sh'
      - 'scripts/check-zed-upstream-candidate.sh'
      - 'xtask/tests/zed_support_claims.rs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zed-integration-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build staged Zed extension candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Apply exact Zed command environment type repair
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          source='.ci/fixtures/zed-perl-upstream/zed-perl/src/perl.rs'
          python3 - "$source" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          before = text
          text = text.replace('use std::collections::HashMap;\n', '', 1)
          text = text.replace(
              '    env: HashMap<String, String>,\n',
              '    env: Vec<(String, String)>,\n',
              1,
          )
          if text == before:
              raise SystemExit('error: expected environment type repair did not apply')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add "$source"
          git commit -m 'fix(zed): use extension API command environment type'
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Stop after bounded repair
        run: exit 0
