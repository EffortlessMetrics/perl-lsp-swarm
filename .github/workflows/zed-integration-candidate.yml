name: Zed Integration Candidate

on:
  pull_request:
    paths:
      - '.ci/fixtures/zed-perl-upstream/**'
      - '.github/workflows/zed-integration-candidate.yml'
      - '.kiro/steering/product.md'
      - 'book/src/reference/editor-setup-canonical.md'
      - 'README.md'
      - 'docs/EDITORS/ZED_SETUP.md'
      - 'docs/how-to/EDITOR_SETUP.md'
      - 'docs/how-to/TROUBLESHOOTING.md'
      - 'docs/integrations/ZED_UPSTREAM_SUBMISSION.md'
      - 'docs/reference/FAQ.md'
      - 'scripts/apply-zed-perl-upstream.sh'
      - 'scripts/check-zed-upstream-candidate.sh'
      - 'xtask/tests/zed_support_claims.rs'
  push:
    branches: [main]
    paths:
      - '.ci/fixtures/zed-perl-upstream/**'
      - '.github/workflows/zed-integration-candidate.yml'
      - '.kiro/steering/product.md'
      - 'book/src/reference/editor-setup-canonical.md'
      - 'README.md'
      - 'docs/EDITORS/ZED_SETUP.md'
      - 'docs/how-to/EDITOR_SETUP.md'
      - 'docs/how-to/TROUBLESHOOTING.md'
      - 'docs/integrations/ZED_UPSTREAM_SUBMISSION.md'
      - 'docs/reference/FAQ.md'
      - 'scripts/apply-zed-perl-upstream.sh'
      - 'scripts/check-zed-upstream-candidate.sh'
      - 'xtask/tests/zed_support_claims.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-integration-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build staged Zed extension candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Report workspace rustfmt change set
        shell: bash
        run: |
          cargo fmt --all
          mapfile -t changed < <(git diff --name-only -- '*.rs')
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo '::notice title=workspace rustfmt::no Rust changes required'
            exit 0
          fi
          for path in "${changed[@]}"; do
            echo "::error file=$path,title=workspace rustfmt changed file::$path"
          done
          diff="$(git diff -- '*.rs')"
          chunk=0
          while [[ -n "$diff" ]]; do
            piece="${diff:0:2800}"
            diff="${diff:2800}"
            escaped="${piece//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            printf -v title 'workspace rustfmt diff %03d' "$chunk"
            echo "::error title=$title::$escaped"
            chunk=$((chunk + 1))
          done
          exit 1
