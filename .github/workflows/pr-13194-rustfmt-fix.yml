name: One-shot rustfmt repair for PR 13194

on:
  push:
    branches:
      - chatgpt/path-tiny-api-completion
    paths:
      - .github/workflows/pr-13194-rustfmt-fix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'EffortlessMetrics/perl-lsp-swarm'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/path-tiny-api-completion
          fetch-depth: 0

      - name: Install the repository formatter
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format the bounded change and remove this workflow
        shell: bash
        run: |
          set -euo pipefail

          target='crates/perl-lsp-rs-core/src/providers/completion/completion/methods.rs'
          workflow='.github/workflows/pr-13194-rustfmt-fix.yml'

          cargo fmt --manifest-path crates/perl-lsp-rs-core/Cargo.toml

          changed="$(git diff --name-only)"
          if [[ "$changed" != "$target" ]]; then
            printf 'rustfmt changed an unexpected file set:\n%s\n' "$changed" >&2
            exit 1
          fi

          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add "$target"
          git rm "$workflow"
          git commit -m 'style(lsp): apply rustfmt to Path::Tiny completion'
          git push origin HEAD:chatgpt/path-tiny-api-completion
