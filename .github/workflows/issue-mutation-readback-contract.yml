name: Issue Mutation Readback Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.agents/skills/prepare-issue/SKILL.md'
      - '.claude/skills/prepare-issue/SKILL.md'
      - 'tests/test_issue_mutation_readback_contract.py'
      - '.github/workflows/issue-mutation-readback-contract.yml'
  push:
    branches: [main]
    paths:
      - '.agents/skills/prepare-issue/SKILL.md'
      - '.claude/skills/prepare-issue/SKILL.md'
      - 'tests/test_issue_mutation_readback_contract.py'
      - '.github/workflows/issue-mutation-readback-contract.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: issue-mutation-readback-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check canonical mutation readback
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify issue mutation readback contract
        run: python3 -m unittest tests/test_issue_mutation_readback_contract.py
