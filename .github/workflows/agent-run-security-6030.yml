name: Agent run security 6030

on:
  push:
    branches:
      - agent/security-pod-preview-6030

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/security-pod-preview-6030
          fetch-depth: 0
          persist-credentials: false

      - name: Reuse branch-owned transformation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/agent-build-security-6030.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          Path('/tmp/security-6030-apply.py').write_text(
              textwrap.dedent('\n'.join(source[start:end])) + '\n',
              encoding='utf-8',
          )
          PY
          python3 /tmp/security-6030-apply.py

      - name: Setup locked extension toolchain
        uses: ./.github/actions/setup-vscode-toolchain
        with:
          working-directory: vscode-extension

      - name: Format and run focused proof
        id: proof
        working-directory: vscode-extension
        shell: bash
        run: |
          set -o pipefail
          {
            npm exec --offline --no -- oxfmt --write src/podPreview.ts src/test/podPreview.test.ts
            npm run fmt:check
            npm run typecheck
            npm run lint
            npm test -- --runInBand src/test/podPreview.test.ts
          } 2>&1 | tee ../target/security-6030-proof.log

      - name: Create immutable blobs and post receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          paths = [
              'vscode-extension/src/podPreview.ts',
              'vscode-extension/src/test/podPreview.test.ts',
          ]
          blobs = {}
          for relative in paths:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  data=json.dumps({
                      'content': base64.b64encode(Path(relative).read_bytes()).decode('ascii'),
                      'encoding': 'base64',
                  }).encode('utf-8'),
                  method='POST',
                  headers=headers,
              )
              with urllib.request.urlopen(request) as response:
                  blobs[relative] = json.load(response)['sha']
          receipt = {'paths': blobs, 'source_sha': os.environ['GITHUB_SHA']}
          comment = '<!-- security-6030-blob -->\nFocused format, typecheck, lint, and Jest proof passed. Verified product blobs:\n```json\n' + json.dumps(receipt, indent=2, sort_keys=True) + '\n```'
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/6047/comments',
              data=json.dumps({'body': comment}).encode('utf-8'),
              method='POST',
              headers=headers,
          )
          with urllib.request.urlopen(request):
              pass
          PY

      - name: Post failure receipt
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          log = Path('target/security-6030-proof.log')
          tail = log.read_text(encoding='utf-8', errors='replace')[-12000:] if log.exists() else 'proof log unavailable'
          body = '<!-- security-6030-failure -->\nPOD security builder failed:\n```text\n' + tail + '\n```'
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/6047/comments",
              data=json.dumps({'body': body}).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request):
              pass
          PY
