name: Temporary inspect indexed mapper patch 7881

on:
  push:
    branches:
      - agent/indexed-strict-position-mapper-7881

permissions:
  contents: read

jobs:
  inspect-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Reconstruct and inspect patch
        shell: bash
        run: |
          cat .github/tmp/7881/part* > indexed-7881.patch.b64
          sha256sum indexed-7881.patch.b64 > patch-integrity.txt
          base64 --decode indexed-7881.patch.b64 > indexed-7881.patch
          sha256sum indexed-7881.patch >> patch-integrity.txt
          git apply --check indexed-7881.patch > apply-check.txt 2>&1 || true
          cat apply-check.txt

      - name: Upload patch diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: indexed-patch-diagnostics-7881-${{ github.sha }}
          path: |
            indexed-7881.patch.b64
            indexed-7881.patch
            patch-integrity.txt
            apply-check.txt
          if-no-files-found: error
          retention-days: 1
