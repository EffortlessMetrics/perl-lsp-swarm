name: Temporary inspect indexed mapper chunks 7881

on:
  push:
    branches:
      - agent/indexed-strict-position-mapper-7881

permissions:
  contents: read

jobs:
  inspect-chunks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Record chunk integrity
        shell: bash
        run: |
          sha256sum .github/tmp/7881/part* > part-integrity.txt
          wc -c .github/tmp/7881/part* >> part-integrity.txt

      - name: Upload chunk diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: indexed-chunk-diagnostics-7881-${{ github.sha }}
          path: part-integrity.txt
          if-no-files-found: error
          retention-days: 1
