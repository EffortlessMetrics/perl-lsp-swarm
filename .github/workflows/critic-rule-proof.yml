name: Critic Rule Proof

on:
  workflow_dispatch: {}

concurrency:
  group: critic-rule-proof-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate critic rule-proof manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Discriminating tests
        run: cargo test -p xtask --locked --test critic_rule_proof

      - name: Check manifest, live critic cases, and generated status
        run: cargo xtask critic-rule-proof check
