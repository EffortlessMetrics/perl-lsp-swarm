            assets.push(asset_from_path(paths, &file.path, file.layer.into())?);
        }

        for path in collect_additional_fuzz_assets(&paths.fuzz)? {
            assets.push(asset_from_path(paths, &path, CorpusAssetLayer::Fuzz)?);
        }
'''
