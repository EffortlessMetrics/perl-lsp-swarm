name: Corpus PR improvement helper

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: topology
            ref: agent/corpus-topology-6699-current
          - lane: snapshot
            ref: agent/hir-snapshot-exact-set-6725
          - lane: expectations
            ref: agent/shared-expectation-mode-6703
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

