      - name: Format
        run: cargo fmt --all

      - name: Verify candidate
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.lane }}" in
            topology)
              cargo test -p perl-corpus topology --locked
              cargo clippy -p perl-corpus --lib --locked -- -D warnings -A missing_docs
              ;;
            snapshot)
              cargo test -p perl-corpus snapshot --locked
              cargo test -p xtask generate_semantic_snapshot --locked
              cargo check -p xtask --locked
              ;;
            expectations)
              cargo test -p perl-corpus fixture_expectations --locked
              cargo test -p perl-corpus sidecar --locked
              cargo check -p perl-corpus --all-targets --locked
              ;;
          esac

      - name: Commit and push candidate
        shell: bash
        env:
          TARGET_REF: ${{ matrix.ref }}
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No improvement diff produced."
            exit 0
          fi
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add -A
          git commit -m "fix(corpus): address ${LANE} review findings"
          git push origin "HEAD:refs/heads/${TARGET_REF}"
