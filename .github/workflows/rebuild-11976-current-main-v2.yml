name: Rebuild PR #11976 on current main v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/rebuild-11976-current-main-v2.yml

permissions:
  contents: write

concurrency:
  group: rebuild-11976-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rebuild:
    if: >-
      github.repository == 'EffortlessMetrics/perl-lsp-swarm' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'repair/11976-current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repair/11976-current-main
          fetch-depth: 0

      - name: Reconstruct, verify, and publish current-main candidate
        run: bash scripts/maintenance/rebuild_11976_current_main.sh
