name: Apply publication drift authority patch v2

on:
  push:
    branches:
      - agent/publication-drift-classifier-6743

permissions:
  contents: write

concurrency:
  group: apply-publication-drift-authority-patch-v2
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: agent/publication-drift-classifier-6743

      - name: Reuse the reviewed authority patch
        shell: bash
        run: |
          script_b64="$(sed -n 's/^          PATCH_SCRIPT_B64: //p' .github/workflows/apply-publication-drift-authority-patch.yml)"
          test -n "$script_b64"
          printf '%s' "$script_b64" | base64 --decode > /tmp/patch-publication-drift.py
          python3 /tmp/patch-publication-drift.py

      - name: Format and verify focused behavior
        shell: bash
        run: |
          cargo fmt -p xtask
          git diff --check
          cargo test -p xtask --lib --locked publication_drift
          cargo test -p xtask --test publication_drift_cli --locked

      - name: Commit the verified repair and remove executors
        shell: bash
        run: |
          git rm .github/workflows/apply-publication-drift-authority-patch.yml
          git rm .github/workflows/apply-publication-drift-authority-patch-v2.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git commit -m "fix(release): bind publication drift command authority (#6743)"
          git push origin HEAD:agent/publication-drift-classifier-6743
