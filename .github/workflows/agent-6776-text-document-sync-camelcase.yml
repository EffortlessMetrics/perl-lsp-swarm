name: Agent 6776 textDocumentSync camelCase repair

on:
  push:
    branches:
      - agent/6776-text-document-sync-camelcase

permissions:
  contents: write

concurrency:
  group: agent-6776-text-document-sync-camelcase
  cancel-in-progress: false

jobs:
  patch-and-prove:
    name: Apply bounded wire-contract repair
    if: github.ref == 'refs/heads/agent/6776-text-document-sync-camelcase'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exactly two camelCase serialization attributes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          path = Path("crates/perl-lsp-rs/src/runtime/lifecycle/capabilities.rs")
          data = path.read_bytes()
          blob_sha = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          expected_blob = "fcc73c2e8796d99a3397217884093e72179af33c"
          if blob_sha != expected_blob:
              raise SystemExit(
                  f"refusing to patch unexpected source blob: expected {expected_blob}, got {blob_sha}"
              )

          text = data.decode("utf-8")
          replacements = (
              (
                  "#[derive(Debug, Clone, serde::Serialize)]\nstruct TextDocumentSyncOptions {",
                  "#[derive(Debug, Clone, serde::Serialize)]\n#[serde(rename_all = \"camelCase\")]\nstruct TextDocumentSyncOptions {",
              ),
              (
                  "#[derive(Debug, Clone, serde::Serialize)]\nstruct SaveOptions {",
                  "#[derive(Debug, Clone, serde::Serialize)]\n#[serde(rename_all = \"camelCase\")]\nstruct SaveOptions {",
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one target block, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          test "$(git diff --name-only)" = "crates/perl-lsp-rs/src/runtime/lifecycle/capabilities.rs"
          test "$(git diff --numstat | awk '{ print $1 ":" $2 }')" = "2:0"
          git diff --check

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Prove formatting and initialize wire shape
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p perl-lsp-rs -- --check
          cargo test -p perl-lsp-rs --locked --test lsp_cap_snap
          cargo test -p perl-lsp-rs --locked --test lsp_registration_tests

      - name: Commit only the repair and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/agent-6776-text-document-sync-camelcase.yml
          git add -- crates/perl-lsp-rs/src/runtime/lifecycle/capabilities.rs
          mapfile -t changed < <(git diff --cached --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/agent-6776-text-document-sync-camelcase.yml"
          test "${changed[1]}" = "crates/perl-lsp-rs/src/runtime/lifecycle/capabilities.rs"
          git diff --cached --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "fix(lsp): restore camelCase textDocumentSync fields (#6776)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
