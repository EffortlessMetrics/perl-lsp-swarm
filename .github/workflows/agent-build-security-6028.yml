name: Agent build security 6028

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/security-nightly-pr-authority-6028'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/security-nightly-pr-authority-6028
          fetch-depth: 0
          persist-credentials: false
      - name: Apply read-only PR execution contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('.github/workflows/ci-nightly.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('permissions:\n  contents: read\n  issues: write\n  pull-requests: write\n', 'permissions:\n  contents: read\n')
          text, count = re.subn(r'\n    - name: Comment on PR \(performance alerts\)\n.*?(?=\n    - name: Upload benchmark artifacts)', '', text, flags=re.S)
          if count != 1:
              raise SystemExit(f'comment writer count: {count}')
          lines = text.splitlines(); out = []; index = 0
          while index < len(lines):
              line = lines[index]
              if 'uses: actions/checkout@v7' not in line:
                  out.append(line); index += 1; continue
              line = line.replace('actions/checkout@v7', 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7')
              out.append(line); use_indent = len(line) - len(line.lstrip()); index += 1
              if index < len(lines) and lines[index].strip() == 'with:':
                  out.append(lines[index]); index += 1; inserted = False
                  while index < len(lines):
                      candidate = lines[index]; indent = len(candidate) - len(candidate.lstrip())
                      if candidate.strip() and indent <= use_indent: break
                      if 'persist-credentials:' in candidate:
                          candidate = ' ' * (use_indent + 4) + 'persist-credentials: false'; inserted = True
                      out.append(candidate); index += 1
                  if not inserted: out.append(' ' * (use_indent + 4) + 'persist-credentials: false')
              else:
                  out.append(' ' * (use_indent + 2) + 'with:')
                  out.append(' ' * (use_indent + 4) + 'persist-credentials: false')
          text = '\n'.join(out) + '\n'
          text = text.replace('actions/upload-artifact@v7', 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1')
          path.write_text(text, encoding='utf-8')
          PY
          file=.github/workflows/ci-nightly.yml
          ! grep -Eq '(issues|pull-requests|statuses|contents): write' "$file"
          ! grep -q 'actions/github-script' "$file"
          ! grep -q 'actions/checkout@v7' "$file"
          ! grep -q 'actions/upload-artifact@v7' "$file"
          checkout_count="$(grep -c 'uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' "$file")"
          persist_count="$(grep -c 'persist-credentials: false' "$file")"
          test "$persist_count" -ge "$checkout_count"
          git diff --check
      - name: Create unreferenced verified commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: 'security(ci): make nightly PR lanes read-only (#6028)'
        run: |
          rm .github/workflows/agent-build-security-6028.yml .agent-trigger-6028
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']
          parent=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); api=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def call(method,url,payload=None):
              req=urllib.request.Request(url,data=None if payload is None else json.dumps(payload).encode(),method=method,headers=headers)
              with urllib.request.urlopen(req) as response: return json.load(response)
          base_tree=call('GET',f'{api}/git/commits/{parent}')['tree']['sha']
          content=Path('.github/workflows/ci-nightly.yml').read_text(encoding='utf-8')
          blob=call('POST',f'{api}/git/blobs',{'content':content,'encoding':'utf-8'})['sha']
          entries=[{'path':'.github/workflows/ci-nightly.yml','mode':'100644','type':'blob','sha':blob}]
          for relative in ('.github/workflows/agent-build-security-6028.yml','.agent-trigger-6028'):
              entries.append({'path':relative,'mode':'100644','type':'blob','sha':None})
          tree=call('POST',f'{api}/git/trees',{'base_tree':base_tree,'tree':entries})['sha']
          commit=call('POST',f'{api}/git/commits',{'message':os.environ['COMMIT_MESSAGE'],'tree':tree,'parents':[parent]})['sha']
          Path('target/security-6028-commit.txt').parent.mkdir(parents=True,exist_ok=True)
          Path('target/security-6028-commit.txt').write_text(commit+'\n',encoding='utf-8')
          print(commit)
          PY
      - name: Upload verified commit identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-6028-commit-${{ github.run_id }}
          path: target/security-6028-commit.txt
          if-no-files-found: error
          retention-days: 3
