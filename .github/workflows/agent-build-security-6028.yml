name: Agent build security 6028

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/security-nightly-pr-authority-6028'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/security-nightly-pr-authority-6028
          fetch-depth: 0
          persist-credentials: false

      - name: Apply read-only PR execution contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/ci-nightly.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'permissions:\n  contents: read\n  issues: write\n  pull-requests: write\n',
              'permissions:\n  contents: read\n',
          )
          text, count = re.subn(
              r'\n    - name: Comment on PR \(performance alerts\)\n.*?(?=\n    - name: Upload benchmark artifacts)',
              '',
              text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'performance comment writer count: {count}')

          lines = text.splitlines()
          output = []
          index = 0
          while index < len(lines):
              line = lines[index]
              if 'uses: actions/checkout@v7' not in line:
                  output.append(line)
                  index += 1
                  continue

              line = line.replace(
                  'actions/checkout@v7',
                  'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7',
              )
              output.append(line)
              use_indent = len(line) - len(line.lstrip())
              index += 1

              if index < len(lines) and lines[index].strip() == 'with:':
                  output.append(lines[index])
                  index += 1
                  inserted = False
                  while index < len(lines):
                      candidate = lines[index]
                      indent = len(candidate) - len(candidate.lstrip())
                      if candidate.strip() and indent <= use_indent:
                          break
                      if 'persist-credentials:' in candidate:
                          candidate = ' ' * (use_indent + 4) + 'persist-credentials: false'
                          inserted = True
                      output.append(candidate)
                      index += 1
                  if not inserted:
                      output.append(' ' * (use_indent + 4) + 'persist-credentials: false')
              else:
                  output.append(' ' * (use_indent + 2) + 'with:')
                  output.append(' ' * (use_indent + 4) + 'persist-credentials: false')

          text = '\n'.join(output) + '\n'
          text = text.replace(
              'actions/upload-artifact@v7',
              'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1',
          )
          path.write_text(text, encoding='utf-8')
          PY

          file=.github/workflows/ci-nightly.yml
          ! grep -Eq '(issues|pull-requests|statuses|contents): write' "$file"
          ! grep -q 'actions/github-script' "$file"
          ! grep -q 'actions/checkout@v7' "$file"
          ! grep -q 'actions/upload-artifact@v7' "$file"
          checkout_count="$(grep -c 'uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' "$file")"
          persist_count="$(grep -c 'persist-credentials: false' "$file")"
          test "$persist_count" -ge "$checkout_count"
          git diff --check

      - name: Create immutable product blob
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          relative = '.github/workflows/ci-nightly.yml'
          payload = {
              'content': base64.b64encode(Path(relative).read_bytes()).decode('ascii'),
              'encoding': 'base64',
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
              data=json.dumps(payload).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              sha = json.load(response)['sha']
          output = Path('target/security-6028-blobs.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({'paths': {relative: sha}}, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(output.read_text(encoding='utf-8'))
          PY

      - name: Upload verified blob receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-6028-blobs-${{ github.run_id }}
          path: target/security-6028-blobs.json
          if-no-files-found: error
          retention-days: 3
