name: 9611 stage duplicate gate retirement

on:
  push:
    branches: [codex/9611-retire-duplicate-crate-count]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: codex/9611-retire-duplicate-crate-count
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: 1.95.0

      - name: Patch only the obsolete duplicate surfaces
        run: python3 scripts/ci/stage_issue_9611.py patch

      - name: Verify mapping, active gate, and current ratchet
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m py_compile \
            scripts/ci/validate_gate_lane_mapping.py \
            scripts/ci/stage_issue_9611.py
          python3 scripts/ci/validate_gate_lane_mapping.py --strict
          cargo test -p xtask --test published_crate_count_gate_integration --locked
          cargo run -p xtask --locked -- published-crate-count

      - name: Create exact candidate blobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/stage_issue_9611.py create-blobs

      - name: Upload candidate blob receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: issue-9611-candidate-blobs
          path: target/9611/blobs.json
          if-no-files-found: error
          retention-days: 1
