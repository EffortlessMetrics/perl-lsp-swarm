name: Corpus PR improvement launcher

on:
  push:
    branches: [agent/corpus-pr-improvement-helper-20260811]

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout helper
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/corpus-pr-improvement-helper-20260811
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Execute bounded candidate improvements
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/corpus-pr-improvement-helper.yml /tmp/corpus-helper.yml
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com

          extract_step() {
            local step_name="$1"
            local output="$2"
            python3 - "$step_name" "$output" <<'PY'
          import sys
          from pathlib import Path
          step_name, output = sys.argv[1:]
          lines = Path('/tmp/corpus-helper.yml').read_text().splitlines()
          marker = f'      - name: {step_name}'
          start = lines.index(marker)
          run = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          body = []
          for line in lines[run + 1:]:
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              else:
                  body.append(line)
          Path(output).write_text('\n'.join(body) + '\n')
          PY
          }

          run_lane() {
            local lane="$1"
            local ref="$2"
            local step="$3"
            git fetch origin "refs/heads/${ref}:refs/remotes/origin/${ref}"
            git checkout -B "helper-${lane}" "origin/${ref}"
            extract_step "$step" "/tmp/${lane}.sh"
            bash "/tmp/${lane}.sh"
            cargo fmt --all
            case "$lane" in
              topology)
                cargo test -p perl-corpus topology --locked
                cargo clippy -p perl-corpus --lib --locked -- -D warnings -A missing_docs
                ;;
              snapshot)
                cargo test -p perl-corpus snapshot --locked
                cargo test -p xtask generate_semantic_snapshot --locked
                cargo check -p xtask --locked
                ;;
              expectations)
                cargo test -p perl-corpus fixture_expectations --locked
                cargo test -p perl-corpus sidecar --locked
                cargo check -p perl-corpus --all-targets --locked
                ;;
            esac
            if git diff --quiet; then
              echo "No ${lane} diff produced"
            else
              git add -A
              git commit -m "fix(corpus): address ${lane} review findings"
              git push origin "HEAD:refs/heads/${ref}"
            fi
          }

          run_lane topology agent/corpus-topology-6699-current "Apply topology improvement"
          run_lane snapshot agent/hir-snapshot-exact-set-6725 "Apply snapshot improvement"
          run_lane expectations agent/shared-expectation-mode-6703 "Apply expectation improvement"
