name: Corpus PR improvement launcher

on:
  push:
    branches: [agent/corpus-pr-improvement-helper-20260811]
    paths:
      - .github/workflows/corpus-pr-improvement-launcher.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: topology
            ref: agent/corpus-topology-6699-current
            files: crates/perl-corpus/src/api/topology.rs
            verify: >-
              cargo test -p perl-corpus topology --locked &&
              cargo clippy -p perl-corpus --lib --locked -- -D warnings -A missing_docs
          - lane: snapshot
            ref: agent/hir-snapshot-exact-set-6725
            files: >-
              crates/perl-corpus/src/snapshot.rs
              xtask/src/tasks/generate_semantic_snapshot.rs
            verify: >-
              cargo test -p perl-corpus snapshot --locked &&
              cargo test -p xtask generate_semantic_snapshot --locked &&
              cargo check -p xtask --locked
          - lane: expectations
            ref: agent/shared-expectation-mode-6703
            files: >-
              crates/perl-corpus/src/sidecar.rs
              crates/perl-corpus/src/fixture_expectations.rs
            verify: >-
              cargo test -p perl-corpus fixture_expectations --locked &&
              cargo test -p perl-corpus sidecar --locked &&
              cargo check -p perl-corpus --all-targets --locked
    steps:
      - name: Checkout helper
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/corpus-pr-improvement-helper-20260811
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Format and verify candidate
        shell: bash
        env:
          CANDIDATE_REF: ${{ matrix.ref }}
          FILES: ${{ matrix.files }}
          VERIFY: ${{ matrix.verify }}
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git fetch origin "refs/heads/${CANDIDATE_REF}:refs/remotes/origin/${CANDIDATE_REF}"
          git checkout -B "helper-${LANE}" "origin/${CANDIDATE_REF}"

          read -r -a files <<< "${FILES}"
          rustfmt --edition 2024 "${files[@]}"
          git diff --check
          eval "${VERIFY}"

          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "${LANE}: candidate files already formatted"
          else
            git commit -m "style(corpus): format ${LANE} improvement"
            git push origin "HEAD:refs/heads/${CANDIDATE_REF}"
          fi
