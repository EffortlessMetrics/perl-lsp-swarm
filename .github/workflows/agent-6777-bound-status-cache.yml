name: Agent 6777 bound status cache

on:
  push:
    branches:
      - agent/6777-bound-status-cache

permissions:
  contents: write

concurrency:
  group: agent-6777-bound-status-cache
  cancel-in-progress: false

jobs:
  patch-and-prove:
    name: Apply bounded status cache repair
    if: github.ref == 'refs/heads/agent/6777-bound-status-cache'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Disable target artifact caching only for status generation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          path = Path(".github/workflows/post-merge-status.yml")
          data = path.read_bytes()
          blob_sha = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          expected_blob = "504e2224153262851af26f650f24ed213300962e"
          if blob_sha != expected_blob:
              raise SystemExit(
                  f"refusing to patch unexpected workflow blob: expected {expected_blob}, got {blob_sha}"
              )

          text = data.decode("utf-8")
          old = """        with:
          cache-on-failure: true
          shared-key: post-merge-status-${{ hashFiles('Cargo.lock') }}
"""
          new = """        with:
          cache-on-failure: true
          cache-targets: false
          shared-key: post-merge-status-${{ hashFiles('Cargo.lock') }}
"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one status cache block, found {count}")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          test "$(git diff --name-only)" = ".github/workflows/post-merge-status.yml"
          test "$(git diff --numstat | awk '{ print $1 ":" $2 }')" = "1:0"
          test "$(grep -c '^          cache-targets: false$' .github/workflows/post-merge-status.yml)" -eq 1
          test "$(grep -c '^        run: cargo run -p xtask -- update-status --write$' .github/workflows/post-merge-status.yml)" -eq 1
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/post-merge-status.yml")'
          git diff --check

      - name: Commit only the cache-boundary repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/agent-6777-bound-status-cache.yml
          git add -- .github/workflows/post-merge-status.yml
          mapfile -t changed < <(git diff --cached --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/agent-6777-bound-status-cache.yml"
          test "${changed[1]}" = ".github/workflows/post-merge-status.yml"
          git diff --cached --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "fix(ci): stop caching status-generation targets (#6777)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
