name: Deploy Documentation

# Deploy documentation to GitHub Pages
# Cost: ~$0.02 per deployment

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'book/**'
      - 'scripts/populate-book.sh'
      - 'scripts/tests/test-populate-book-roadmap-links.sh'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

# The build is read-only. Deployment authority is confined to this non-PR
# workflow's deploy job; pull-request proof lives in docs-pr-build.yml.
permissions:
  contents: read

# Serialize production deployments independently of pull-request builds.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: stable

      - name: Cache mdBook
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-mdbook-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mdbook-

      - name: Install mdBook
        run: |
          cargo install mdbook --version 0.4.40 --locked || true
          mdbook --version

      - name: Populate documentation
        run: |
          bash scripts/tests/test-populate-book-roadmap-links.sh
          bash scripts/populate-book.sh

      - name: Build mdBook
        run: |
          mdbook build book

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: ./book/book

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          status_code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")"

          if [ "${status_code}" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled (HTTP ${status_code}); skipping deployment."
          fi

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
