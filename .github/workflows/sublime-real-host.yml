name: Sublime real-host exact-source

on:
  pull_request:
    paths:
      - "clients/sublime/**"
      - "crates/perl-lsp-rs/**"
      - "crates/perllsp/**"
      - "crates/perl-lsp-rs-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/sublime-real-host.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sublime-real-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  host-journey:
    name: Sublime host / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # The runner context is not available to a job-level env block. Naming it
      # here is rejected during workflow validation: the run fails before any
      # job starts and no receipt is ever produced. Per-host receipt paths are
      # bound in the first step instead, where $RUNNER_OS is real.
      PERLLSP_SUBLIME_FIXTURE: ${{ github.workspace }}/clients/sublime/host-fixture
      PERLLSP_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # The UnitTesting setup action resolves `extra-packages` refs through
      # `gitResolvePrefixToTag`, which matches only tags and branches and then
      # clones with `git clone --branch`. A raw commit SHA can never resolve, so
      # the package is installed by its tag and the tag is asserted to still
      # point at the exact reviewed commit below.
      PERLLSP_LSP_TAG: 4070-2.13.0
      PERLLSP_LSP_REF: cc9f5201d9f053d9ab67aa0ea575b494fd133803
      # UnitTesting declares sublime_aio as a Package Control dependency for
      # ST4 (dependencies.json), but this workflow disables Package Control,
      # so the dependency is installed explicitly and pinned the same way.
      PERLLSP_AIO_TAG: v0.2.3
      PERLLSP_AIO_REF: b3d1d559ec223f276c9693e17476768257951266
    steps:
      - uses: actions/checkout@v4

      - name: Build the exact current-source server candidate
        run: cargo build --locked --release -p perllsp

      - name: Bind the current-source binary and receipt identity
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            printf 'PERLLSP_TEST_BINARY=%s\n' "$GITHUB_WORKSPACE/target/release/perllsp.exe" >> "$GITHUB_ENV"
          else
            printf 'PERLLSP_TEST_BINARY=%s\n' "$GITHUB_WORKSPACE/target/release/perllsp" >> "$GITHUB_ENV"
          fi
          printf 'PERLLSP_SUBLIME_RECEIPT=%s\n' \
            "$GITHUB_WORKSPACE/target/sublime-host/$RUNNER_OS.json" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/target/sublime-host"

      - name: Reject sublimelsp/LSP tag drift from the reviewed commit
        shell: bash
        run: |
          resolved=$(git ls-remote https://github.com/sublimelsp/LSP \
            "refs/tags/$PERLLSP_LSP_TAG^{}" | cut -f1)
          if [[ "$resolved" != "$PERLLSP_LSP_REF" ]]; then
            echo "sublimelsp/LSP tag $PERLLSP_LSP_TAG resolves to ${resolved:-<none>}," >&2
            echo "but the reviewed exact-source commit is $PERLLSP_LSP_REF." >&2
            exit 1
          fi
          echo "sublimelsp/LSP $PERLLSP_LSP_TAG is $PERLLSP_LSP_REF"

      - name: Reject sublime_aio tag drift from the pinned commit
        shell: bash
        run: |
          resolved=$(git ls-remote https://github.com/packagecontrol/sublime_aio             "refs/tags/$PERLLSP_AIO_TAG^{}" | cut -f1)
          if [[ -z "$resolved" ]]; then
            # Lightweight tags have no peeled ref; the tag ref is the commit.
            resolved=$(git ls-remote https://github.com/packagecontrol/sublime_aio               "refs/tags/$PERLLSP_AIO_TAG" | cut -f1)
          fi
          if [[ "$resolved" != "$PERLLSP_AIO_REF" ]]; then
            echo "packagecontrol/sublime_aio tag $PERLLSP_AIO_TAG resolves to ${resolved:-<none>}," >&2
            echo "but the pinned commit is $PERLLSP_AIO_REF." >&2
            exit 1
          fi
          echo "packagecontrol/sublime_aio $PERLLSP_AIO_TAG is $PERLLSP_AIO_REF"

      - name: Stage the exact helper-package source
        shell: bash
        run: |
          rm -rf target/LSP-perllsp-package
          mkdir -p target/LSP-perllsp-package
          cp -R clients/sublime/LSP-perllsp/. target/LSP-perllsp-package/
          git -C target/LSP-perllsp-package init -q
          git -C target/LSP-perllsp-package remote add origin \
            https://github.com/EffortlessMetrics/perl-lsp-swarm.git

      - name: Install Sublime Text, UnitTesting, and exact LSP 2.13.0 source
        uses: SublimeText/UnitTesting/actions/setup@b8abedefd5fbc0f64a8c6082506ebd1e24203164
        with:
          package-name: LSP-perllsp
          package-path: target/LSP-perllsp-package
          sublime-text-version: 4
          install-package-control: false
          extra-packages: |
            LSP:sublimelsp/LSP@${{ env.PERLLSP_LSP_TAG }}
            sublime_aio:packagecontrol/sublime_aio@${{ env.PERLLSP_AIO_TAG }}

      - name: Vendor the pinned typing_extensions dependency
        # The pinned LSP 2.13.0 declares typing_extensions as a Package
        # Control dependency; with Package Control disabled it never installs
        # and LSP's plugin.core.typing fails to import. Sublime places every
        # Packages/<dir> root on the plugin sys.path, so the official single
        # module, pinned by tag and digest, is vendored into a directory.
        shell: bash
        run: >
          mkdir -p "$SUBLIME_TEXT_PACKAGES/LSP-perllsp-pydeps"
          && curl -fsSL
          "https://raw.githubusercontent.com/python/typing_extensions/4.16.0/src/typing_extensions.py"
          -o "$SUBLIME_TEXT_PACKAGES/LSP-perllsp-pydeps/typing_extensions.py"
          && printf '%s  %s\n'
          "4040ca1a1ecbee00d1385c12a93084d1c5bd46f0b774f07e5ae7e91c4f55e696"
          "$SUBLIME_TEXT_PACKAGES/LSP-perllsp-pydeps/typing_extensions.py" | sha256sum -c -

      - name: Run the real Sublime interoperability journey
        # The upstream run-tests action waits 30 s per attempt and restarts
        # Sublime three times; this package's deferred host journey legitimately
        # needs minutes (cold Sublime + pinned LSP load + current-source server
        # spawn + LSP round trips, each condition bounded by condition_timeout
        # in unittesting.json).  The self-owned runner keeps the upstream
        # schedule mechanics but polls once with an honest wall and dumps the
        # recorded Sublime log on failure.
        run: python scripts/sublime/run_unit_tests.py LSP-perllsp
        shell: bash

      - name: Reject an orphaned perllsp process
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if pgrep -f '[p]erllsp([[:space:]]|$)' >/dev/null; then
            echo "perllsp remained alive after Sublime/UnitTesting shutdown" >&2
            pgrep -af '[p]erllsp([[:space:]]|$)' >&2 || true
            exit 1
          fi

      - name: Reject an orphaned perllsp process
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $processes = Get-Process perllsp -ErrorAction SilentlyContinue
          if ($processes) {
            $processes | Format-Table -AutoSize | Out-String | Write-Error
            throw "perllsp remained alive after Sublime/UnitTesting shutdown"
          }

      - name: Validate the exact-source receipt
        shell: bash
        run: python clients/sublime/validate_sublime_host_receipt.py "$PERLLSP_SUBLIME_RECEIPT"

      - name: Publish the host receipt
        uses: actions/upload-artifact@v4
        with:
          name: sublime-real-host-${{ runner.os }}
          path: target/sublime-host/*.json
          if-no-files-found: error
          retention-days: 30
