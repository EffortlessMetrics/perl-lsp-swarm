      - name: Format the changed Rust surfaces
        run: cargo fmt --all

      - name: Verify the focused behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p perl-ci-hygiene git_hooks
          cargo test --locked -p xtask file_policy
          cargo test --locked -p xtask --test file_policy
          cargo test --locked -p xtask --test non_rust_inventory_conflict_topology
          cargo clippy --locked -p xtask --all-targets -- -D warnings
          cargo clippy --locked -p perl-ci-hygiene --all-targets -- -D warnings
          cargo fmt --all -- --check

      - name: Verify the bounded diff
        shell: bash
        run: |
          set -euo pipefail

          for protected in docs/policy/NON_RUST_INVENTORY.md policy/non-rust-allowlist.toml .gitattributes
          do
            git diff --quiet origin/main...HEAD -- "$protected" || {
              echo "::error::$protected changed in the committed branch diff"
              exit 1
            }
            git diff --quiet -- "$protected" || {
              echo "::error::$protected changed in the working tree"
              exit 1
            }
          done

          {
            git diff --name-only origin/main...HEAD
            git diff --name-only
          } | sort -u > /tmp/repair-14688-paths

          while IFS= read -r path
          do
            case "$path" in
              .ci/gate-policy.yaml|.github/workflows/ci.yml|.github/workflows/post-merge-status.yml|.github/workflows/repair-14688.yml|crates/perl-ci-hygiene/src/git_hooks.rs|docs/FILE_POLICY.md|docs/development/FILE_POLICY_RAIL.md|docs/policy/NON_RUST_POLICY.md|xtask/src/main.rs|xtask/src/tasks/file_policy.rs|xtask/tests/file_policy.rs|xtask/tests/non_rust_inventory_conflict_topology.rs)
                ;;
              "")
                ;;
              *)
                echo "::error::unexpected repair path: $path"
                exit 1
                ;;
            esac
          done < /tmp/repair-14688-paths

          git diff --check

      - name: Commit and push the verified repair
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): make non-Rust inventory check current-tree authoritative"
          git push origin HEAD:fix/14688-retire-non-rust-snapshot
