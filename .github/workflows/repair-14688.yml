name: Repair non-Rust inventory authority

on:
  push:
    branches:
      - fix/14688-retire-non-rust-snapshot
    paths:
      - .github/workflows/repair-14688.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  repair:
    name: "Complete #14688 current-tree cutover"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/14688-retire-non-rust-snapshot
          fetch-depth: 0

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
          shared-key: repair-14688-${{ hashFiles('Cargo.lock') }}

      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git fetch origin main
          git merge --no-edit origin/main

