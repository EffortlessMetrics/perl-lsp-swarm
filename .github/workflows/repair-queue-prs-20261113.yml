name: Repair current queue PR findings

on:
  push:
    branches: [codex/repair-queue-prs-20261113]

permissions:
  contents: write

jobs:
  repair-19332:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: openbot/18255-merge-group-head-ref
          fetch-depth: 0
          persist-credentials: true

      - name: Repair scoped pull_request_target law
        shell: bash
        env:
          EXPECTED_HEAD: 0a5d8d0e13d92d76d6ec889223b6a7169631df71
          OLD_CODE_B64: ICAgICAgICAgICAgbGV0IHB1bGxfcmVxdWVzdF90YXJnZXQgPQogICAgICAgICAgICAgICAgZXZlbnRzLmlzX3NvbWVfYW5kKHxldmVudHN8IGV2ZW50X2lzX3JlcXVpcmVkKGV2ZW50cywgInB1bGxfcmVxdWVzdF90YXJnZXQiKSk7Cg==
          NEW_CODE_B64: ICAgICAgICAgICAgbGV0IHB1bGxfcmVxdWVzdF90YXJnZXQgPSBldmVudHMuaXNfc29tZV9hbmQofGV2ZW50c3wgewogICAgICAgICAgICAgICAgZXZlbnRzLml0ZXIoKS5hbnkofGNhbmRpZGF0ZXwgY2FuZGlkYXRlID09ICJwdWxsX3JlcXVlc3RfdGFyZ2V0IikKICAgICAgICAgICAgfSk7Cg==
          ANCHOR_B64: ICAgICNbdGVzdF0KICAgIGZuIHB1bGxfcmVxdWVzdF90YXJnZXRfcmVnaXN0cmF0aW9uX2FjY2VwdHNfaXRzX2FjdHVhbF9ldmVudCgpIC0+IFJlc3VsdDwoKT4gewo=
          REGRESSION_B64: 
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" ]
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('xtask/src/tasks/workflow_trigger_lint.rs')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_CODE_B64']).decode()
          new = base64.b64decode(os.environ['NEW_CODE_B64']).decode()
          anchor = base64.b64decode(os.environ['ANCHOR_B64']).decode()
          regression = base64.b64decode(os.environ['REGRESSION_B64']).decode()
          if text.count(old) != 1:
              raise SystemExit(f'expected one pull_request_target law, found {text.count(old)}')
          text = text.replace(old, new)
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one test anchor, found {text.count(anchor)}')
          path.write_text(text.replace(anchor, regression), encoding='utf-8')
          PY
          cargo fmt --all
          git diff --check

      - name: Qualify focused trigger contracts
        run: cargo test --locked -p xtask --bin xtask workflow_trigger_lint -- --nocapture

      - name: Publish reviewed repair
        shell: bash
        env:
          EXPECTED_HEAD: 0a5d8d0e13d92d76d6ec889223b6a7169631df71
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" ]
          [ "$(git diff --name-only)" = "xtask/src/tasks/workflow_trigger_lint.rs" ]
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add xtask/src/tasks/workflow_trigger_lint.rs
          git commit -m 'fix(ci): require pull_request_target only when declared (#18255)'
          git push origin HEAD:refs/heads/openbot/18255-merge-group-head-ref

  repair-19349:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/17903-staged-fixture-rebase
          fetch-depth: 0
          persist-credentials: true

      - name: Make the projected metadata set explicit
        shell: bash
        env:
          EXPECTED_HEAD: 86daa3a33b3f06726c44d56a26c3412f948831e9
          OLD_PATCH_B64: 
          NEW_PATCH_B64: QEAgLTQyNSArNDAwIEBAIGZuIHRlc3RfcG9zdF9tZXJnZV93b3JrZmxvd19kaXNwYXRjaGVzX2FsbF9yZXF1aXJlZF9jaGVja3MoKQotICAgIGxldCByZXF1aXJlZF93b3JrZmxvd3MgPSByZXF1aXJlZF93b3JrZmxvd3MoJnBvbGljeSk/OworICAgIGxldCByZXF1aXJlZF93b3JrZmxvd3MgPSBCVHJlZVNldDo6ZnJvbShbInByLXRpdGxlLWNoZWNrLnltbCIudG9fc3RyaW5nKCldKTsK
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" ]
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('.ci/staged/17903-root-triggers.patch')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_PATCH_B64']).decode()
          new = base64.b64decode(os.environ['NEW_PATCH_B64']).decode()
          if text.count(old) != 1:
              raise SystemExit(f'expected one inconsistent projected set, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git apply --unidiff-zero --check .ci/staged/17903-root-triggers.patch

      - name: Qualify staged cutover fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest \
            scripts.ci.test_staged_qualification_workflow_cutover \
            scripts.ci.test_generated_pr_metadata_dispatch
          git apply --unidiff-zero .ci/staged/17903-root-triggers.patch
          cargo test --locked -p xtask --test post_merge_status_regen_tests \
            test_post_merge_workflow_dispatches_metadata_only -- --exact --nocapture
          git reset --hard HEAD

      - name: Publish reviewed fixture repair
        shell: bash
        env:
          EXPECTED_HEAD: 86daa3a33b3f06726c44d56a26c3412f948831e9
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" ]
          [ "$(git diff --name-only)" = ".ci/staged/17903-root-triggers.patch" ]
          git diff --check
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add .ci/staged/17903-root-triggers.patch
          git commit -m 'fix(ci): bind staged metadata dispatch set (#17903)'
          git push origin HEAD:refs/heads/fix/17903-staged-fixture-rebase
