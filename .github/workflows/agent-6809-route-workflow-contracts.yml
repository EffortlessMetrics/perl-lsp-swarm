name: Agent 6809 route workflow contracts

on:
  push:
    branches:
      - codex/6777-post-merge-cache-contract

permissions:
  contents: write

concurrency:
  group: agent-6809-route-workflow-contracts
  cancel-in-progress: false

jobs:
  route-contracts:
    if: github.ref == 'refs/heads/codex/6777-post-merge-cache-contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply routing repair and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/ci/agent_6809_route_workflow_contracts.py
          git rm -- .github/workflows/agent-6809-route-workflow-contracts.yml
          git rm -- scripts/ci/agent_6809_route_workflow_contracts.py
          git diff --check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format and verify routed contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p xtask
          git diff --check
          cargo test -p xtask --locked workflow_contract_inputs_select_xtask
          cargo test -p xtask --locked --test post_merge_status_cache_contract

      - name: Commit the reviewed improvement
        shell: bash
        run: |
          set -euo pipefail
          git add -- xtask/src/tasks/ci_scope.rs
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 3
          test "${staged[0]}" = ".github/workflows/agent-6809-route-workflow-contracts.yml"
          test "${staged[1]}" = "scripts/ci/agent_6809_route_workflow_contracts.py"
          test "${staged[2]}" = "xtask/src/tasks/ci_scope.rs"
          git diff --cached --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "test(ci): route workflow contracts through xtask (#6777)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
