name: Sublime package contract

on:
  pull_request:
    paths:
      - "clients/sublime/**"
      - "policy/non-rust-allowlist.toml"
      - ".github/workflows/sublime-package-contract.yml"
  push:
    branches: [main]
    paths:
      - "clients/sublime/**"
      - "policy/non-rust-allowlist.toml"
      - ".github/workflows/sublime-package-contract.yml"

permissions:
  contents: read

concurrency:
  group: sublime-package-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  package-contract:
    name: Sublime package contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.8"
      - name: Run helper-package contract tests
        run: python -m unittest discover -s clients/sublime/LSP-perllsp/tests -p 'test_*.py'
      - name: Validate package metadata
        run: |
          python -m json.tool clients/sublime/LSP-perllsp/LSP-perllsp.sublime-settings >/dev/null
          python -m json.tool clients/sublime/LSP-perllsp/server-manifest.json >/dev/null
          python -m json.tool clients/sublime/LSP-perllsp/sublime-package.json >/dev/null
      - name: Prove deterministic package export
        run: |
          mkdir -p target/sublime
          python clients/sublime/export_lsp_perllsp.py --output target/sublime/LSP-perllsp-a.sublime-package
          python clients/sublime/export_lsp_perllsp.py --output target/sublime/LSP-perllsp-b.sublime-package
          cmp target/sublime/LSP-perllsp-a.sublime-package target/sublime/LSP-perllsp-b.sublime-package
          sha256sum target/sublime/LSP-perllsp-a.sublime-package
      - name: Check non-Rust file policy
        run: cargo xtask check-file-policy
