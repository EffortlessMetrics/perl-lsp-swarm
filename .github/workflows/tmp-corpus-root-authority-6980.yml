name: Materialize current corpus root authority stack

on:
  push:
    branches:
      - agent/corpus-root-authority-6980
    paths:
      - .github/workflows/tmp-corpus-root-authority-6980.yml

permissions:
  contents: write

concurrency:
  group: corpus-root-authority-6980
  cancel-in-progress: false

jobs:
  restack-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact stacked candidate
        uses: actions/checkout@v5
        with:
          ref: agent/corpus-root-authority-6980
          fetch-depth: 1

      - name: Reconcile strict and compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/tmp-corpus-root-authority-6980.py
          test -f "$script"
          test -f crates/perl-corpus/src/api/root.rs
          python3 "$script"
          cargo fmt -p perl-corpus

      - name: Check formatting
        shell: bash
        run: cargo fmt -p perl-corpus -- --check

      - name: Check all perl-corpus targets
        shell: bash
        run: |
          set +e
          cargo check -p perl-corpus --all-targets --locked --message-format=short \
            2>&1 | tee /tmp/perl-corpus-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^error|: error\[|: error:)' /tmp/perl-corpus-check.log \
              | head -n 10 \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          fi
          exit "$status"

      - name: Test root authority
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test -p perl-corpus --lib root --locked

      - name: Test compatibility discovery and layout
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test -p perl-corpus --lib files --locked

      - name: Test package distribution contract
        shell: bash
        run: cargo test -p perl-corpus --test distribution_contract --locked

      - name: Test compatibility public surface
        shell: bash
        run: cargo test -p perl-corpus --test files_compatibility_contract --locked

      - name: Test public root path authority
        shell: bash
        run: cargo test -p perl-corpus --test root_path_authority --locked

      - name: Run focused Clippy
        shell: bash
        run: cargo clippy -p perl-corpus --all-targets --locked -- -D warnings -A missing_docs

      - name: Check patch hygiene
        shell: bash
        run: git diff --check

      - name: Publish verified stacked candidate
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/tmp-corpus-root-authority-6980.yml
          script=.github/scripts/tmp-corpus-root-authority-6980.py
          rm "$workflow" "$script"
          git add -A -- \
            "$workflow" \
            "$script" \
            crates/perl-corpus/CLAUDE.md \
            crates/perl-corpus/Cargo.toml \
            crates/perl-corpus/README.md \
            crates/perl-corpus/src/api.rs \
            crates/perl-corpus/src/api/root.rs \
            crates/perl-corpus/src/files.rs \
            crates/perl-corpus/src/prelude.rs \
            crates/perl-corpus/tests/distribution_contract.rs \
            crates/perl-corpus/tests/files_compatibility_contract.rs \
            crates/perl-corpus/tests/root_path_authority.rs

          allowed=$(mktemp)
          actual=$(mktemp)
          printf '%s\n' \
            .github/scripts/tmp-corpus-root-authority-6980.py \
            .github/workflows/tmp-corpus-root-authority-6980.yml \
            crates/perl-corpus/CLAUDE.md \
            crates/perl-corpus/Cargo.toml \
            crates/perl-corpus/README.md \
            crates/perl-corpus/src/api.rs \
            crates/perl-corpus/src/api/root.rs \
            crates/perl-corpus/src/files.rs \
            crates/perl-corpus/src/prelude.rs \
            crates/perl-corpus/tests/distribution_contract.rs \
            crates/perl-corpus/tests/files_compatibility_contract.rs \
            crates/perl-corpus/tests/root_path_authority.rs \
            | sort > "$allowed"
          git diff --cached --name-only | sort > "$actual"
          test -s "$actual"
          test ! -s <(comm -23 "$actual" "$allowed")
          grep -qx 'crates/perl-corpus/src/api/root.rs' "$actual"
          grep -qx 'crates/perl-corpus/src/files.rs' "$actual"

          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "refactor(corpus): add explicit external root authority (#6980)"
          git push origin HEAD:agent/corpus-root-authority-6980
