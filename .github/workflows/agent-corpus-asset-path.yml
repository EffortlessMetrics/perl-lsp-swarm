name: Agent corpus asset path build

on:
  push:
    branches:
      - agent/corpus-asset-path-authority

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/corpus-asset-path-authority

      - name: Apply bounded corpus member-identity change
        run: python3 .agent/apply-corpus-asset-path.py

      - name: Format and run focused proof
        run: |
          cargo fmt -p perl-corpus
          git diff --check
          cargo test -p perl-corpus --test corpus_asset_path --locked
          cargo test -p perl-corpus --lib api::topology --locked
          cargo check -p perl-corpus --all-targets --locked

      - name: Commit exact candidate and remove temporary builder
        run: |
          rm .agent/apply-corpus-asset-path.py
          rmdir .agent 2>/dev/null || true
          rm .github/workflows/agent-corpus-asset-path.yml
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add -A
          git commit -m 'refactor(corpus): add portable asset path authority (#10555)'
          git push origin HEAD:agent/corpus-asset-path-authority
