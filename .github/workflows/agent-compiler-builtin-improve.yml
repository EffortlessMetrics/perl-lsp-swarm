name: Agent compiler builtin improvement

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: agent-compiler-builtin-improve-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  improve:
    if: github.event.pull_request.head.ref == 'agent/compiler-builtin-stack-ci'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply reviewed admission fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch(path: str, marker: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if marker in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new))

          patch(
              "xtask/src/bin/compiler-builtin-catalog.rs",
              "Review fix: executable EIR requires an implemented lowering seam.",
              '''        if (self.hir_pir_lowering != HirPirLowering::CatalogOnly
                      || self.eir_profile == EirProfile::Executable)
                      && self.proof != ProofState::Proven
                  {
          ''',
              '''        // Review fix: executable EIR requires an implemented lowering seam.
                  if self.eir_profile == EirProfile::Executable
                      && !matches!(
                          self.hir_pir_lowering,
                          HirPirLowering::ClassifiedCall | HirPirLowering::DedicatedOperation
                      )
                  {
                      bail!(
                          "builtin {} cannot be executable without classified or dedicated HIR/PIR lowering",
                          self.builtin_id
                      );
                  }
                  if (self.hir_pir_lowering != HirPirLowering::CatalogOnly
                      || self.eir_profile == EirProfile::Executable)
                      && self.proof != ProofState::Proven
                  {
          ''',
          )

          patch(
              "xtask/src/bin/compiler-builtin-catalog.rs",
              "fn executable_eir_rejects_catalog_only_lowering",
              '''    #[test]
                  fn rendering_is_independent_of_row_order() -> Result<()> {
          ''',
              '''    #[test]
                  fn executable_eir_rejects_catalog_only_lowering() -> Result<()> {
                      let mut catalog = BuiltinCatalog::from_str(CATALOG)?;
                      let builtin = catalog
                          .builtins
                          .first_mut()
                          .ok_or_else(|| anyhow!("committed catalog unexpectedly empty"))?;
                      builtin.proof = ProofState::Proven;
                      builtin.evidence.push("implementation:fixture".to_string());
                      builtin.eir_profile = EirProfile::Executable;
                      builtin.hir_pir_lowering = HirPirLowering::CatalogOnly;
                      let error = catalog
                          .validate()
                          .expect_err("catalog-only lowering must not authorize executable EIR")
                          .to_string();
                      assert!(error.contains("classified or dedicated"));
                      Ok(())
                  }

                  #[test]
                  fn rendering_is_independent_of_row_order() -> Result<()> {
          ''',
          )

          Path("xtask/tests/compiler_builtin_catalog_cli.rs").write_text('''//! End-to-end check for the committed builtin semantic catalog and status.\n\nuse assert_cmd::Command;\nuse color_eyre::eyre::{Result, eyre};\nuse std::path::Path;\n\n#[test]\nfn committed_builtin_status_is_current_through_cli() -> Result<()> {\n    let repo_root = Path::new(env!("CARGO_MANIFEST_DIR"))\n        .parent()\n        .ok_or_else(|| eyre!("xtask manifest must have a repository parent"))?;\n    Command::cargo_bin("compiler-builtin-catalog")?\n        .current_dir(repo_root)\n        .arg("--check")\n        .assert()\n        .success();\n    Ok(())\n}\n''')
          PY

      - name: Format and regenerate status
        shell: bash
        run: |
          cargo fmt --all
          cargo run -p xtask --bin compiler-builtin-catalog -- --write-status
          cargo fmt --all
          git diff --check

      - name: Run targeted tests and lints
        shell: bash
        run: |
          cargo test -p xtask \
            --bin compiler-builtin-catalog \
            --test compiler_builtin_catalog_cli
          cargo clippy -p xtask \
            --bin compiler-builtin-catalog \
            --test compiler_builtin_catalog_cli \
            -- -D warnings

      - name: Commit improvement pass
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            xtask/src/bin/compiler-builtin-catalog.rs \
            xtask/tests/compiler_builtin_catalog_cli.rs \
            docs/project/status/perl_builtin_semantics.md
          if git diff --cached --quiet; then
            echo "No improvement changes to commit"
            exit 0
          fi
          git commit -m "fix(compiler): require implemented builtin execution seams"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
