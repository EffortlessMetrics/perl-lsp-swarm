name: PR 6921 transfer receipt

on:
  pull_request:
    paths:
      - '.github/workflows/pr6921-transfer.yml'

permissions:
  contents: read
  issues: read

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch and verify transfer archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request

          url = 'https://api.github.com/repos/EffortlessMetrics/perl-lsp-swarm/issues/comments/5261932621'
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'perl-lsp-swarm-pr6921-transfer',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              body = json.load(response)['body']

          begin = 'BEGIN PR6921 TAR.GZ BASE64\n'
          end = '\nEND PR6921 TAR.GZ BASE64'
          if begin not in body or end not in body:
              raise SystemExit('transfer markers missing')
          encoded = body.split(begin, 1)[1].split(end, 1)[0]
          archive = base64.b64decode(''.join(encoded.split()), validate=True)
          expected_size = 5367
          expected_sha = '20e774c365cec7a4704bce0e22290ffca42e033baf78c95633a4f647d322bac7'
          actual_sha = hashlib.sha256(archive).hexdigest()
          if len(archive) != expected_size or actual_sha != expected_sha:
              raise SystemExit(
                  f'transfer mismatch: bytes={len(archive)} sha256={actual_sha}'
              )
          with open('pr6921.tar.gz', 'wb') as destination:
              destination.write(archive)
          PY

      - name: Upload verified transfer archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: pr6921-transfer-${{ github.event.pull_request.head.sha }}
          path: pr6921.tar.gz
          if-no-files-found: error
          retention-days: 1
