# ripr liveness — report a ripr run that has scheduled no jobs.
#
# `ripr.yml` serialises per pull request (`concurrency: ripr-<pr>` with
# `cancel-in-progress: false`, deliberately, so a newer head queues behind an
# active analysis rather than cancelling it). A queued run schedules no jobs at
# all, and GitHub posts a check run only for a scheduled job, so the required
# context `ripr+ New Gap Gate` is not red and not pending on that head: it is
# absent. Branch protection renders that the same way it renders a check that
# is still running.
#
# Measured 2026-09-20: run 35487554523 (PR #16083) sat `pending` with zero jobs
# for 47 minutes while 74 other check runs reported on that head.
#
# This workflow posts an advisory `ripr+ liveness` check so the silence is
# visible. It deliberately does NOT post under the required context's own name:
# writing that name from here could change whether a pull request is mergeable,
# and a check run this workflow left behind could outlive the real one. The
# classifier can never emit a `success` conclusion.
#
# It also carries state between fires, by reading back the check runs it has
# already written, which buys the two transitions a check run is supposed to
# support and this reporter previously could not make:
#
# * a stall that clears is *withdrawn*, by updating the check run that carries
#   the red rather than adding a contradicting one beside it;
# * a run that is working says so, naming the step currently running, because
#   the run object is no evidence either way -- GitHub advances `updated_at`
#   only on run- and job-level transitions, not while a step executes.
#
# Neither transition can red anything: `infra-no-proof` is the only `failure`
# this reporter can write, and no path reaches it from a run that has jobs.

name: ripr liveness

on:
  schedule:
    # Every 15 minutes. The floor below is 10, so a run that crosses it is
    # reported within one further interval.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      floor_minutes:
        description: 'Minutes with no scheduled job before a run is reported'
        required: false
        default: '10'
        type: string

concurrency:
  group: ripr-liveness
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    name: ripr liveness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      # Posting the advisory check run. Never under a required context's name.
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Snapshot ripr runs
        id: snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FLOOR_MINUTES: ${{ inputs.floor_minutes || '10' }}
        run: |
          set -euo pipefail
          mkdir -p target/ripr/liveness

          # One page is ample: ripr runs are serialised per PR and the floor is
          # minutes, so anything older than this page has long since resolved.
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ripr.yml/runs?per_page=100" \
            --jq '[.workflow_runs[] | {id, status, event, created_at, head_sha, head_branch,
                   head_repository: .head_repository.full_name,
                   pull_requests: [.pull_requests[]?.number]}]' \
            > target/ripr/liveness/runs.json

          # Only a run that has scheduled nothing needs its job count read, so
          # the per-run call is bounded to the candidates.
          python3 - <<'PY'
          import json, os, subprocess, datetime, importlib.util, pathlib

          # The count coercion is the one piece of this step that decides a
          # posted check run, so it lives in the tested module rather than here.
          spec = importlib.util.spec_from_file_location(
              "ripr_liveness", pathlib.Path("scripts/ci/ripr_liveness.py"))
          liveness = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(liveness)

          repo = os.environ["GITHUB_REPOSITORY"]
          runs = json.load(open("target/ripr/liveness/runs.json"))
          for run in runs:
              if run.get("status") in liveness.UNSTARTED_STATUSES:
                  out = subprocess.run(
                      ["gh", "api", f"repos/{repo}/actions/runs/{run['id']}/jobs",
                       "--jq", ".total_count"],
                      capture_output=True, text=True, check=False,
                  )
                  run["job_count"] = liveness.job_count_from_api(out.returncode, out.stdout)
              else:
                  run["job_count"] = 1

              # An in-flight run also gets its step detail read. This is the
              # only evidence of progress that exists: GitHub advances a run's
              # `updated_at` on run- and job-level transitions, not while a
              # step executes, and a measured healthy run sat ~40 minutes
              # inside one step. So the run object is motionless for most of a
              # working run's life and equally motionless for a dead one.
              #
              # `job_count` deliberately stays 1 rather than the real count.
              # It feeds the predecessor test, and that test is already proven
              # against `queued`-with-jobs; re-deriving it from a second shape
              # would change a classification this change is not about. The
              # detail is carried separately.
              if run.get("status") in liveness.IN_FLIGHT_STATUSES:
                  out = subprocess.run(
                      ["gh", "api", f"repos/{repo}/actions/runs/{run['id']}/jobs",
                       "--jq", '{total_count: .total_count, completed_count: ([.jobs[]? | select(.status == "completed")] | length), in_progress_steps: [.jobs[]?.steps[]? | select(.status == "in_progress") | .name]}'],
                      capture_output=True, text=True, check=False,
                  )
                  run["progress"] = liveness.progress_from_api(out.returncode, out.stdout)

              # A completed run can neither be a candidate nor hold a group,
              # so it needs no identity and no call spent on one.
              if run.get("status") == "completed":
                  continue

              # The API withholds `pull_requests` for a fork pull request, and
              # `ripr.yml` groups on the number. Resolve it from the head
              # commit rather than inferring identity from head repository and
              # branch: one fork branch can carry two open pull requests at
              # once, one onto `main` and one onto `master`, and those are two
              # numbers and so two concurrency groups (#16109 review).
              #
              # What the endpoint answers and what the snapshot needs are not
              # the same question -- it reports every pull request containing
              # the commit, not the one that triggered this run -- so reading
              # its payload into an identity is a decision, and it lives in
              # the tested module rather than here.
              if not run.get("pull_requests"):
                  out = subprocess.run(
                      ["gh", "api", f"repos/{repo}/commits/{run['head_sha']}/pulls",
                       "--jq", "[.[] | {number, base: .base.ref}]"],
                      capture_output=True, text=True, check=False,
                  )
                  liveness.apply_resolved_identity(
                      run, liveness.resolved_pulls_from_api(out.returncode, out.stdout)
                  )

          # The reporter's memory across cron fires. It is the API's own record
          # rather than a persisted state file: the check runs this workflow
          # wrote are already on the head, so there is nothing to go stale, be
          # evicted, or be written by a run that then failed before posting.
          # Reading it back is what lets a later fire *update* a check run --
          # to withdraw a stall that cleared, to refresh a heartbeat -- instead
          # of adding a second, contradicting one.
          #
          # `filter=all` and `--paginate` are both load-bearing, and the first
          # is the one that bites at two entries rather than at a hundred. The
          # endpoint's `filter` defaults to `latest`, which returns only the
          # most recent check run *per name* -- and every post here carries the
          # single name `ripr+ liveness`, so the default answers "is this the
          # newest liveness id" when the question is "has this id been posted
          # at all". A run that flips between `infra-no-proof` and
          # `serialised_behind_predecessor` as its predecessor starts and
          # finishes alternates between two ids, and under the default each
          # flip looks unposted and re-posts, forever. `--paginate` then
          # matters past 100 distinct check names, which this repository's heads
          # do reach -- 74 names, but 83 rows on one head measured.
          # `--paginate` with `--jq` emits one value per line across all pages
          # rather than one JSON document.
          #
          # Read per head rather than once globally: a check run lives on the
          # head it was posted against, and this reporter only ever updates one
          # it finds there. A run whose head has moved on is not this run's
          # check run to touch.
          #
          # Bounded to the heads still worth a read, which is the runs that are
          # going plus the ones that only just finished. The runs page carries
          # 92 distinct heads over its last 100 entries, and this read is
          # paginated; spending one call on each of those every 15 minutes would
          # make this advisory reporter the expensive thing it exists to make
          # cheap. The decision of which heads qualify is the module's, so it
          # is testable rather than a number typed into YAML.
          as_of = datetime.datetime.now(datetime.timezone.utc)
          heads = liveness.posted_memory_heads(
              runs, as_of.replace(microsecond=0))
          posted = {}
          for head in sorted(heads):
              out = subprocess.run(
                  ["gh", "api", "--paginate",
                   f"repos/{repo}/commits/{head}/check-runs?filter=all&per_page=100",
                   "--jq", '.check_runs[] | select(.external_id != null) | {external_id, id} | @json'],
                  capture_output=True, text=True, check=False,
              )
              # An unreadable head is recorded as absent, not as empty: absent
              # re-posts, which is visible and correctable, while empty would
              # silently stop updating a live signal.
              rows = liveness.posted_checks_from_api(out.returncode, out.stdout)
              if rows:
                  posted[head] = rows
          json.dump(posted, open("target/ripr/liveness/posted.json", "w"), indent=2)

          snapshot = {
              # One clock for both the memory bound and the snapshot it feeds.
              # Two reads of the wall clock would let a run age across the
              # boundary between them, so a head could be read and then judged
              # by a different age than the one that selected it.
              "as_of": as_of.isoformat().replace("+00:00", "Z"),
              "floor_minutes": int(os.environ["FLOOR_MINUTES"]),
              "runs": runs,
          }
          json.dump(snapshot, open("target/ripr/liveness/snapshot.json", "w"), indent=2)
          PY

      - name: Classify
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/ripr_liveness.py \
            --snapshot target/ripr/liveness/snapshot.json \
            --posted target/ripr/liveness/posted.json \
            --out target/ripr/liveness/report.md \
            --json target/ripr/liveness/report.json \
            --print
          cat target/ripr/liveness/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post advisory check runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys

          repo = os.environ["GITHUB_REPOSITORY"]
          report = json.load(open("target/ripr/liveness/report.json"))

          REQUIRED_CONTEXT = "ripr+ New Gap Gate"

          def write(entry, verb):
              """POST a claim this reporter has not made, or PATCH the one it has.

              A check run is GitHub's current state, so a second POST under a
              new id would add a contradicting statement rather than replace
              the old one. That is why the entry carries the id of the run to
              update: the external_id is the same across fires, so recovery and
              progress are updates to the check run that already carries the
              claim (#16567).

              The two verbs take different bodies. An update addresses an
              existing check run by its own numeric id and must not resend the
              identity fields, because a check run's name and head are fixed at
              creation; resending them invites a rejection on a head that is
              not even wrong. Only the mutable parts -- status, conclusion, and
              the output a reader sees -- are sent back.
              """
              external_id = entry.get("external_id")
              if not external_id:
                  # No stable address means no way to write or withdraw this
                  # later, so it is refused rather than posted blind.
                  print(f"run {entry.get('run_id')}: no external id, skipped")
                  return
              output = {"title": entry["check_title"], "summary": entry["check_summary"]}
              check_run_id = entry.get("check_run_id")
              if verb == "PATCH" and isinstance(check_run_id, int):
                  path = f"repos/{repo}/check-runs/{check_run_id}"
                  payload = {
                      "status": "completed",
                      "conclusion": entry["conclusion"],
                      "output": output,
                  }
              else:
                  path = f"repos/{repo}/check-runs"
                  payload = {
                      "name": entry["check_name"],
                      "head_sha": entry["head_sha"],
                      "external_id": external_id,
                      "status": "completed",
                      "conclusion": entry["conclusion"],
                      "output": output,
                  }
              result = subprocess.run(
                  ["gh", "api", "--method", verb, path, "--input", "-"],
                  input=json.dumps(payload), capture_output=True, text=True, check=False,
              )
              status = "ok" if result.returncode == 0 else f"failed: {result.stderr.strip()}"
              print(f"{entry['head_sha']} {entry.get('classification', entry.get('now_classification'))}: {verb} {status}")

          # Every entry carries the decision -- post or patch -- already made
          # by the tested module. This step translates and does not decide: the
          # one defect this workflow shipped lived exactly in a decision that
          # had no test seam (#16152).
          entries = []
          for finding in report.get("findings", []):
              entries.append((finding, "PATCH" if finding.get("check_run_id") else "POST"))
          for alive in report.get("alive", []):
              entries.append((alive, "PATCH" if alive.get("check_run_id") else "POST"))
          for resolution in report.get("resolutions", []):
              entries.append((resolution, "PATCH"))

          if not entries:
              print("no ripr run is waiting past the floor, running, or newly recovered")
              sys.exit(0)

          for entry, verb in entries:
              conclusion = entry["conclusion"]
              name = entry["check_name"]
              # The classifier can never say success and never offers the
              # required context's name; refuse both here anyway rather than
              # trust an upstream change not to. A retraction is the case this
              # matters most: it is the one write that replaces a `failure`
              # with something else on a live head, and `success` there would
              # be this reporter claiming a candidate is proven.
              if conclusion == "success":
                  raise SystemExit("refusing to post a success conclusion from the liveness reporter")
              if name == REQUIRED_CONTEXT:
                  raise SystemExit(f"refusing to post under the required context {name!r}")
              write(entry, verb)
          PY
