name: Temporary stage Scenario 14 oracle repairs

on:
  push:
    branches: [chatgpt/editor-scorecard-rustfmt-probe]
    paths: [.github/workflows/editor-scorecard-stage-harness.yml]

permissions:
  contents: write

jobs:
  stage:
    name: Apply reviewed harness transformation
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/editor-scorecard-rustfmt-probe
          fetch-depth: 0

      - name: Install pinned formatter toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply deterministic source transformation
        run: |
          set -euo pipefail
          python3 .agent/editor-scorecard/apply_scenario14_harness.py
          cargo fmt --manifest-path crates/perl-lsp-ux-tests/Cargo.toml
          git diff --check
          test "$(grep -c '^fn scenario_14_' crates/perl-lsp-ux-tests/tests/ux_scenario_14_inc_conformance.rs)" -eq 13
          ! grep -q 'fn scenario_14_include_path_missing_module_completion_consistency' \
            crates/perl-lsp-ux-tests/tests/ux_scenario_14_inc_conformance.rs

      - name: Commit staging candidate
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add crates/perl-lsp-ux-tests/tests/ux_scenario_14_inc_conformance.rs
          git commit -m "test(ux): strengthen Scenario 14 terminal oracles"
          git push origin HEAD:chatgpt/editor-scorecard-rustfmt-probe
