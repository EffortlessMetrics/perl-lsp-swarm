name: Temporary regenerate #14181 non-Rust inventory

on:
  push:
    branches:
      - fix/8161-workspace-folder-capability

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Remove temporary workflow and regenerate final-tree inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm -- .github/workflows/_temporary-regenerate-non-rust-14181.yml
          cargo xtask non-rust inventory --write
          git add -- docs/policy/NON_RUST_INVENTORY.md
          git diff --cached --check
          git commit -m "chore(policy): regenerate non-Rust inventory after main merge"
          git push origin HEAD:fix/8161-workspace-folder-capability
