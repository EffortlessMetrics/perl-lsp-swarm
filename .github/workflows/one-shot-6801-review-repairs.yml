name: One-shot PR 6801 review repairs

on:
  push:
    branches:
      - codex/6713-slash-ambiguity-edit-current

permissions:
  contents: write

jobs:
  repair:
    name: Repair incremental review findings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/6713-slash-ambiguity-edit-current
          fetch-depth: 1
          persist-credentials: true

      - name: Apply bounded review repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine_path = Path("crates/perl-parser/src/incremental/incremental_advanced_reuse.rs")
          engine = engine_path.read_text(encoding="utf-8")

          content_start = engine.index("    fn find_content_updated_matches(")
          content_end = engine.index("    /// Find aggressive structural matches", content_start)
          content = engine[content_start:content_end]
          opening = (
              "    ) {\n"
              "        for (old_pos, old_info) in &old_analysis.node_info {\n"
          )
          replacement = (
              "    ) {\n"
              "        let mut used_target_positions: HashSet<usize> = reuse_map\n"
              "            .values()\n"
              "            .map(|strategy| strategy.target_position)\n"
              "            .collect();\n"
              "\n"
              "        for (old_pos, old_info) in &old_analysis.node_info {\n"
          )
          if content.count(opening) != 1:
              raise SystemExit("content-update opening anchor drifted")
          content = content.replace(opening, replacement, 1)

          scan = (
              "                for (new_pos, new_info) in &new_analysis.node_info {\n"
              "                    if old_info.structural_hash == new_info.structural_hash\n"
          )
          scan_replacement = (
              "                for (new_pos, new_info) in &new_analysis.node_info {\n"
              "                    if used_target_positions.contains(new_pos) {\n"
              "                        continue;\n"
              "                    }\n"
              "\n"
              "                    if old_info.structural_hash == new_info.structural_hash\n"
          )
          if content.count(scan) != 1:
              raise SystemExit("content-update scan anchor drifted")
          content = content.replace(scan, scan_replacement, 1)

          registration = (
              "                        if confidence >= config.min_confidence\n"
              "                            && self.try_register_match(\n"
              "                                reuse_map,\n"
              "                                *old_pos,\n"
              "                                *new_pos,\n"
              "                                ReuseType::ContentUpdate,\n"
              "                                confidence,\n"
              "                            )\n"
              "                        {\n"
              "                            self.analysis_stats.content_matches += 1;\n"
              "                            break;\n"
              "                        }\n"
          )
          registration_replacement = (
              "                        if confidence >= config.min_confidence {\n"
              "                            reuse_map.insert(\n"
              "                                *old_pos,\n"
              "                                ReuseStrategy {\n"
              "                                    target_position: *new_pos,\n"
              "                                    reuse_type: ReuseType::ContentUpdate,\n"
              "                                    confidence_score: confidence,\n"
              "                                    position_adjustment: (*new_pos as isize)\n"
              "                                        - (*old_pos as isize),\n"
              "                                },\n"
              "                            );\n"
              "                            used_target_positions.insert(*new_pos);\n"
              "                            self.analysis_stats.content_matches += 1;\n"
              "                            break;\n"
              "                        }\n"
          )
          if content.count(registration) != 1:
              raise SystemExit("content-update registration anchor drifted")
          content = content.replace(registration, registration_replacement, 1)
          engine = engine[:content_start] + content + engine[content_end:]

          aggressive_start = engine.index("    fn find_aggressive_structural_matches(")
          aggressive_end = engine.index("    /// Validate reuse candidates", aggressive_start)
          aggressive = engine[aggressive_start:aggressive_end]
          aggressive_opening = (
              "    ) {\n"
              "        // This is the most sophisticated matching - look for structural patterns\n"
          )
          aggressive_opening_replacement = (
              "    ) {\n"
              "        let mut used_target_positions: HashSet<usize> = reuse_map\n"
              "            .values()\n"
              "            .map(|strategy| strategy.target_position)\n"
              "            .collect();\n"
              "\n"
              "        // This is the most sophisticated matching - look for structural patterns\n"
          )
          if aggressive.count(aggressive_opening) != 1:
              raise SystemExit("aggressive opening anchor drifted")
          aggressive = aggressive.replace(
              aggressive_opening,
              aggressive_opening_replacement,
              1,
          )

          occupancy = (
              "                if reuse_map\n"
              "                    .values()\n"
              "                    .any(|strategy| strategy.target_position == *new_pos)\n"
              "                {\n"
              "                    continue;\n"
              "                }\n"
          )
          occupancy_replacement = (
              "                if used_target_positions.contains(new_pos) {\n"
              "                    continue;\n"
              "                }\n"
          )
          if aggressive.count(occupancy) != 1:
              raise SystemExit("aggressive occupancy anchor drifted")
          aggressive = aggressive.replace(occupancy, occupancy_replacement, 1)

          best_registration = (
              "                if confidence >= config.min_confidence * 0.7\n"
              "                    && self.try_register_match(\n"
              "                        reuse_map,\n"
              "                        *old_pos,\n"
              "                        best_pos,\n"
              "                        ReuseType::StructuralEquivalent,\n"
              "                        confidence,\n"
              "                    )\n"
              "                {\n"
              "                    // Final threshold check\n"
              "                    self.analysis_stats.reuse_candidates_found += 1;\n"
              "                }\n"
          )
          best_registration_replacement = (
              "                if confidence >= config.min_confidence * 0.7 {\n"
              "                    // Final threshold check\n"
              "                    reuse_map.insert(\n"
              "                        *old_pos,\n"
              "                        ReuseStrategy {\n"
              "                            target_position: best_pos,\n"
              "                            reuse_type: ReuseType::StructuralEquivalent,\n"
              "                            confidence_score: confidence,\n"
              "                            position_adjustment: (best_pos as isize)\n"
              "                                - (*old_pos as isize),\n"
              "                        },\n"
              "                    );\n"
              "                    used_target_positions.insert(best_pos);\n"
              "                    self.analysis_stats.reuse_candidates_found += 1;\n"
              "                }\n"
          )
          if aggressive.count(best_registration) != 1:
              raise SystemExit("aggressive registration anchor drifted")
          aggressive = aggressive.replace(
              best_registration,
              best_registration_replacement,
              1,
          )
          engine = engine[:aggressive_start] + aggressive + engine[aggressive_end:]
          engine_path.write_text(engine, encoding="utf-8")

          parser_path = Path("crates/perl-parser/src/incremental/incremental_v2.rs")
          parser = parser_path.read_text(encoding="utf-8")
          analysis_start = parser.index("        // Store analysis results for inspection")
          analysis_end = parser.index("\n        None\n", analysis_start) + len("\n        None\n")
          old_analysis = parser[analysis_start:analysis_end]
          new_analysis = (
              "        // Expose only the analysis selected for the produced tree.\n"
              "        if analysis_result.reused_nodes <= analysis_result.total_new_nodes\n"
              "            && analysis_result\n"
              "                .meets_efficiency_target(self.reuse_config.min_confidence * 100.0)\n"
              "        {\n"
              "            self.reused_nodes = analysis_result.reused_nodes;\n"
              "            self.reparsed_nodes =\n"
              "                analysis_result.total_new_nodes - analysis_result.reused_nodes;\n"
              "            self.advanced_reuse_selected = true;\n"
              "            self.last_reuse_analysis = Some(analysis_result);\n"
              "            return Some(new_tree);\n"
              "        }\n"
              "\n"
              "        None\n"
          )
          if old_analysis.count("self.last_reuse_analysis = Some(analysis_result);") != 1:
              raise SystemExit("advanced-analysis assignment anchor drifted")
          parser = parser[:analysis_start] + new_analysis + parser[analysis_end:]
          parser_path.write_text(parser, encoding="utf-8")

          test_path = Path("crates/perl-parser/tests/incremental_parser_accuracy.rs")
          tests = test_path.read_text(encoding="utf-8")
          import_anchor = "use perl_parser::edit::Edit;\n"
          import_replacement = (
              "use perl_parser::edit::Edit;\n"
              "use perl_parser::incremental_advanced_reuse::ReuseConfig;\n"
          )
          if tests.count(import_anchor) != 1:
              raise SystemExit("reuse-config import anchor drifted")
          tests = tests.replace(import_anchor, import_replacement, 1)

          test_name = "fn rejected_advanced_analysis_is_not_exposed_as_last_parse()"
          if test_name in tests:
              raise SystemExit("rejected-analysis regression already exists")
          regression = (
              "\n\n#[test]\n"
              "fn rejected_advanced_analysis_is_not_exposed_as_last_parse() -> TestResult {\n"
              "    let config = ReuseConfig { min_confidence: 1.1, ..ReuseConfig::default() };\n"
              "    let mut incremental = IncrementalParserV2::with_reuse_config(config);\n"
              "    let source = \"my $x = 1;\";\n"
              "    incremental.parse(source)?;\n"
              "\n"
              "    let edited =\n"
              "        apply_incremental_edit(&mut incremental, source, \"1\", \"2\", \"rejected-analysis\")?;\n"
              "    incremental.parse(&edited)?;\n"
              "\n"
              "    if !incremental.used_incremental_path() {\n"
              "        return Err(\"the simple fallback must accept the queued value edit\".into());\n"
              "    }\n"
              "    if incremental.used_advanced_reuse() {\n"
              "        return Err(\"the over-threshold advanced analysis must be rejected\".into());\n"
              "    }\n"
              "    if incremental.get_last_reuse_analysis().is_some() {\n"
              "        return Err(\"a rejected advanced analysis must not remain public\".into());\n"
              "    }\n"
              "    if !incremental\n"
              "        .get_reuse_efficiency_report()\n"
              "        .starts_with(\"Basic Incremental Analysis:\")\n"
              "    {\n"
              "        return Err(\"the efficiency report must describe the accepted simple path\".into());\n"
              "    }\n"
              "    Ok(())\n"
              "}\n"
          )
          tests = tests.rstrip() + regression
          test_path.write_text(tests, encoding="utf-8")

          Path(".github/workflows/one-shot-6801-review-repairs.yml").unlink()
          PY

          cargo fmt --all
          git diff --check

          expected=$(printf '%s\n' \
            .github/workflows/one-shot-6801-review-repairs.yml \
            crates/perl-parser/src/incremental/incremental_advanced_reuse.rs \
            crates/perl-parser/src/incremental/incremental_v2.rs \
            crates/perl-parser/tests/incremental_parser_accuracy.rs | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"

      - name: Commit repairs and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            .github/workflows/one-shot-6801-review-repairs.yml \
            crates/perl-parser/src/incremental/incremental_advanced_reuse.rs \
            crates/perl-parser/src/incremental/incremental_v2.rs \
            crates/perl-parser/tests/incremental_parser_accuracy.rs
          git commit -m "fix(parser): close incremental reuse review gaps"
          git push origin HEAD:codex/6713-slash-ambiguity-edit-current
