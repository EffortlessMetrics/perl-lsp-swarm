name: One-shot PR 6801 review repairs

on:
  push:
    branches:
      - codex/6713-slash-ambiguity-edit-current

permissions:
  contents: write

jobs:
  repair:
    name: Repair incremental review findings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/6713-slash-ambiguity-edit-current
          fetch-depth: 1
          persist-credentials: true

      - name: Apply bounded review repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/one_shot_6801_review_repairs.py
          git diff --check

          expected=$(printf '%s\n' \
            .github/scripts/one_shot_6801_review_repairs.py \
            crates/perl-parser/src/incremental/incremental_advanced_reuse.rs \
            crates/perl-parser/src/incremental/incremental_v2.rs \
            crates/perl-parser/tests/incremental_parser_accuracy.rs | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"

      - name: Commit repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            .github/scripts/one_shot_6801_review_repairs.py \
            crates/perl-parser/src/incremental/incremental_advanced_reuse.rs \
            crates/perl-parser/src/incremental/incremental_v2.rs \
            crates/perl-parser/tests/incremental_parser_accuracy.rs
          git commit -m "fix(parser): close incremental reuse review gaps"
          git push origin HEAD:codex/6713-slash-ambiguity-edit-current
