name: 9611 v2 clean-candidate builder

on:
  push:
    branches: [codex/9611-stage-v2]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout construction branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Patch exact bounded surfaces
        run: python3 scripts/ci/stage_issue_9611_v2.py patch

      - name: Normalize the replacement Rust contract
        run: cargo fmt --all

      - name: Recheck the candidate boundary after formatting
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          expected = {
              ".ci/gate-policy.yaml",
              ".github/workflows/ci.yml",
              "docs/ci/gate-policy-economics.md",
              "docs/reference/CI_ARCHITECTURE.md",
              "scripts/ci/validate_gate_lane_mapping.py",
              "xtask/tests/published_crate_count_gate_integration.rs",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
          )
          if changed != expected:
              raise SystemExit(
                  "candidate path set drifted after rustfmt: "
                  f"missing={sorted(expected - changed)} extra={sorted(changed - expected)}"
              )

          rows = {}
          for line in subprocess.check_output(
              ["git", "diff", "--numstat"], text=True
          ).splitlines():
              added, deleted, path = line.split("\t", 2)
              rows[path] = (int(added), int(deleted))
          gate_add, gate_delete = rows[".ci/gate-policy.yaml"]
          if gate_add != 0 or not 12 <= gate_delete <= 20:
              raise SystemExit(
                  "gate-policy edit exceeded bounded row retirement: "
                  f"additions={gate_add} deletions={gate_delete}"
              )
          print(f"bounded candidate: six paths; gate-policy -{gate_delete}")
          PY

      - name: Verify diff hygiene
        run: git diff --check

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Verify gate and lane mapping
        run: python3 scripts/ci/validate_gate_lane_mapping.py --strict

      - name: Verify gate-policy contract
        run: cargo xtask gate-policy check

      - name: Verify policy_checks inventory remains synchronized
        run: python3 scripts/ci/validate_policy_checks_inventory.py --check

      - name: Verify active crate-count integration contract
        run: cargo test -p xtask --test published_crate_count_gate_integration --locked

      - name: Verify current crate-count ratchet
        run: cargo run -p xtask --locked -- published-crate-count

      - name: Publish clean six-file branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/stage_issue_9611_v2.py publish

      - name: Upload construction receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: issue-9611-v2-clean-branch
          path: target/9611-v2/result.json
          if-no-files-found: error
          retention-days: 1
