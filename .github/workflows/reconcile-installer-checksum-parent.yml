name: Reconcile installer checksum with parent

on:
  push:
    branches: [agent/installer-checksum-required-6097]
    paths: ['.github/workflows/reconcile-installer-checksum-parent.yml']

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact child branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: agent/installer-checksum-required-6097
          fetch-depth: 0
          persist-credentials: false

      - name: Merge exact parent and regenerate inventory
        env:
          EXPECTED_PARENT_SHA: b95633c3a62ff1bc0541682a601077fa7fc1abe9
        run: |
          set -euo pipefail
          git fetch origin "$EXPECTED_PARENT_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_PARENT_SHA"

          set +e
          git merge --no-commit --no-ff "$EXPECTED_PARENT_SHA"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "docs/policy/NON_RUST_INVENTORY.md"
            git checkout --theirs docs/policy/NON_RUST_INVENTORY.md
            git add docs/policy/NON_RUST_INVENTORY.md
          fi

          git rm .github/workflows/reconcile-installer-checksum-parent.yml
          cargo run -p xtask -- non-rust inventory
          git checkout HEAD -- .github/workflows/reconcile-installer-checksum-parent.yml
          git add docs/policy/NON_RUST_INVENTORY.md

          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check

      - name: Commit reconciled stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git commit -m 'merge: reconcile installer checksum with parent (#6097)'
          gh auth setup-git
          git push origin HEAD:agent/installer-checksum-required-6097
