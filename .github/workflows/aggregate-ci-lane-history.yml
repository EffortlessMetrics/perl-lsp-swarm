name: Aggregate CI lane history

# Daily aggregation of trusted ci-actuals artifacts into
# `.ci/metrics/ci-lane-history.json`. Pull-request artifacts are deliberately
# excluded: only successful default-branch push and merge-group runs may teach
# the planner. Once enough samples exist (>=5 per lane), estimates can become
# learned rather than falling back to policy/ci-lanes.toml.

on:
  schedule:
    # 05:07 UTC daily — off-minute to avoid cron-fleet pile-up at :00.
    - cron: '7 5 * * *'
  workflow_dispatch:

concurrency:
  group: aggregate-ci-lane-history
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  aggregate:
    name: Aggregate trusted ci-actuals into lane history
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify aggregation security contract
        run: python3 scripts/ci/aggregate_lane_history.py --self-test

      - name: Download trusted ci-actuals artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          actuals_root="target/ci/actuals"
          manifest="target/ci/trusted-runs.tsv"
          mkdir -p "$actuals_root"
          printf 'run_id\trepository\tevent\thead_branch\thead_sha\tconclusion\tcreated_at\n' > "$manifest"

          cutoff="$(date -u -d '14 days ago' +'%Y-%m-%dT%H:%M:%SZ')"
          run_candidates="$(mktemp)"

          # The endpoint itself is repository-scoped. Filter again on recorded
          # repository identity, success, event, branch, and age before any
          # artifact is downloaded. Pull-request events are never candidates.
          gh api -X GET "repos/${REPOSITORY}/actions/workflows/ci.yml/runs" \
            -F per_page=100 \
            -F status=completed \
            --jq ".workflow_runs[]
              | select(.repository.full_name == \"${REPOSITORY}\")
              | select(.conclusion == \"success\")
              | select(.created_at >= \"${cutoff}\")
              | select((.event == \"push\" and .head_branch == \"${DEFAULT_BRANCH}\") or .event == \"merge_group\")
              | [.id, .repository.full_name, .event, (.head_branch // \"\"), .head_sha, .conclusion, .created_at]
              | @tsv" \
            > "$run_candidates"

          candidate_count="$(wc -l < "$run_candidates" | tr -d ' ')"
          printf 'Found %s trusted ci.yml run candidates.\n' "$candidate_count"

          downloaded=0
          while IFS=$'\t' read -r run_id repository event head_branch head_sha conclusion created_at; do
            [ -z "$run_id" ] && continue
            run_dir="${actuals_root}/run-${run_id}"
            artifact_dir="${run_dir}/artifacts"
            mkdir -p "$artifact_dir"

            if ! gh run download "$run_id" \
              --repo "$REPOSITORY" \
              --pattern 'ci-actuals-*' \
              --dir "$artifact_dir" \
              2>/dev/null
            then
              rm -rf "$run_dir"
              continue
            fi

            # Write provenance only after extraction, outside the artifact
            # subtree, so downloaded content cannot create or replace it.
            python3 - \
              "$run_dir/trusted-run.json" \
              "$run_id" \
              "$repository" \
              "$event" \
              "$head_branch" \
              "$head_sha" \
              "$conclusion" \
              "$created_at" <<'PY'
          import json
          from pathlib import Path
          import sys

          output = Path(sys.argv[1])
          output.write_text(
              json.dumps(
                  {
                      "run_id": int(sys.argv[2]),
                      "repository": sys.argv[3],
                      "event": sys.argv[4],
                      "head_branch": sys.argv[5],
                      "head_sha": sys.argv[6],
                      "conclusion": sys.argv[7],
                      "created_at": sys.argv[8],
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$run_id" "$repository" "$event" "$head_branch" \
              "$head_sha" "$conclusion" "$created_at" >> "$manifest"
            downloaded=$((downloaded + 1))
          done < "$run_candidates"

          printf 'Downloaded ci-actuals artifacts from %s trusted runs.\n' "$downloaded"

      - name: Aggregate lane history
        run: |
          set -euo pipefail
          python3 scripts/ci/aggregate_lane_history.py \
            --actuals-dir target/ci/actuals \
            --window-days 14 \
            --output .ci/metrics/ci-lane-history.json \
            --static-lanes policy/ci-lanes.toml \
            --require-trusted-markers \
            --repository "$REPOSITORY" \
            --default-branch "$DEFAULT_BRANCH"

      - name: Summarize accepted and rejected evidence
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          history = json.loads(
              Path(".ci/metrics/ci-lane-history.json").read_text(encoding="utf-8")
          )
          validation = history.get("validation", {})
          rejected = validation.get("rejected", {})
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          lines = [
              "## Trusted CI lane-history aggregation",
              "",
              f"- Source runs: {validation.get('source_run_count', 0)}",
              f"- Receipt files seen: {validation.get('files_seen', 0)}",
              f"- Receipt files accepted: {validation.get('files_accepted', 0)}",
              f"- Samples accepted: {validation.get('accepted_samples', 0)}",
              f"- Samples/files rejected: {sum(rejected.values())}",
              "",
              "| Rejection reason | Count |",
              "| --- | ---: |",
          ]
          if rejected:
              for reason, count in sorted(rejected.items()):
                  lines.append(f"| `{reason}` | {count} |")
          else:
              lines.append("| None | 0 |")

          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Open lane-history refresh PR
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/ci-lane-history
          title: "chore(ci): refresh trusted lane history (#5995)"
          commit-message: "chore(ci): refresh trusted lane history (#5995)"
          body: |
            Refresh `.ci/metrics/ci-lane-history.json` from successful, same-repository `ci.yml` evidence produced by:

            - default-branch `push` runs, or
            - `merge_group` runs.

            Pull-request artifacts, failed runs, unknown lanes, non-finite values, and out-of-range samples are excluded. The workflow artifact contains the source-run manifest and validation counts.

            Refs #5995.
          add-paths: .ci/metrics/ci-lane-history.json
          labels: |
            automated-pr
            ci
          signoff: false
          delete-branch: true

      - name: Upload aggregation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-lane-history-${{ github.run_id }}
          path: |
            .ci/metrics/ci-lane-history.json
            target/ci/trusted-runs.tsv
          if-no-files-found: warn
          retention-days: 30
