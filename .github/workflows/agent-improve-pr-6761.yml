name: Agent improve PR 6761

on:
  push:
    branches:
      - agent/dap-watchpoint-context-2374
    paths:
      - .github/workflows/agent-improve-pr-6761.yml

permissions:
  contents: write

concurrency:
  group: agent-improve-pr-6761
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/dap-watchpoint-context-2374
          fetch-depth: 0

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply reviewed protocol correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          protocol = Path('crates/perl-dap/src/protocol.rs')
          text = protocol.read_text(encoding='utf-8')
          old = '''    /// Identifier for the data (null/None means not available)
              #[serde(skip_serializing_if = "Option::is_none")]
              pub data_id: Option<String>,
          '''
          new = '''    /// Identifier for the data (`null` means not available).
              ///
              /// DAP requires this property even when no breakpoint target exists,
              /// so `None` must serialize as an explicit JSON `null`.
              pub data_id: Option<String>,
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one data_id serialization seam, found {text.count(old)}')
          protocol.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('crates/perl-dap/tests/dap_watchpoint_context_honesty_tests.rs')
          text = tests.read_text(encoding='utf-8')
          helper = '''fn data_id_is_absent(body: &Value) -> bool {
              body.get("dataId").is_none_or(Value::is_null)
          }

          '''
          if text.count(helper) != 1:
              raise SystemExit('expected obsolete data_id_is_absent helper once')
          text = text.replace(helper, '')
          old_call = 'data_id_is_absent(&body)'
          replacement = 'body.get("dataId").is_some_and(Value::is_null)'
          if text.count(old_call) != 5:
              raise SystemExit(f'expected five refusal assertions, found {text.count(old_call)}')
          tests.write_text(text.replace(old_call, replacement), encoding='utf-8')
          PY

      - name: Verify focused behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p perl-dap --all-targets -- -D warnings
          cargo test -p perl-dap --test dap_watchpoint_context_honesty_tests
          cargo test -p perl-dap --test dap_watchpoints_tests
          git diff --check

      - name: Commit improvement and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-improve-pr-6761.yml
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add crates/perl-dap/src/protocol.rs \
                  crates/perl-dap/tests/dap_watchpoint_context_honesty_tests.rs \
                  .github/workflows/agent-improve-pr-6761.yml
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(dap): serialize unavailable dataId as null'
          git push origin HEAD:agent/dap-watchpoint-context-2374
