name: Agent Move Release Readiness 7166

on:
  push:
    branches:
      - agent/move-perl-release-readiness-7166

permissions:
  contents: write

concurrency:
  group: agent-move-release-readiness-7166
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/move-perl-release-readiness-7166
          fetch-depth: 0

      - name: Repair generated xtask namespace routing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/agent_move_release_readiness_7166.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one occurrence, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '''    text = text.replace(
                  "perl_kwalitee::PerlKwaliteeProfile",
                  "release_readiness::ReleaseReadinessProfile",
              )
          ''',
              '''    text = text.replace(
                  "perl_kwalitee::PerlKwaliteeProfile",
                  "release_readiness::ReleaseReadinessProfile",
              )
              text = text.replace(
                  "perl_release_readiness::PerlKwaliteeProfile",
                  "release_readiness::ReleaseReadinessProfile",
              )
          ''',
              "migrated profile namespace",
          )

          replace_once(
              '''    alias_body = match.group("body")
              canonical_body = alias_body.replace("perl_kwalitee::", "release_readiness::")
          ''',
              '''    migrated_body = match.group("body")
              canonical_body = migrated_body.replace(
                  "perl_release_readiness::", "release_readiness::"
              )
              alias_body = migrated_body.replace(
                  "perl_release_readiness::", "perl_kwalitee::"
              )
          ''',
              "dispatch namespace routing",
          )

          replace_once(
              '''    if "enum PerlKwaliteeCommand" in main:
                  raise RuntimeError("old xtask subcommand enum still exists")
          ''',
              '''    if "enum PerlKwaliteeCommand" in main:
                  raise RuntimeError("old xtask subcommand enum still exists")
              if "perl_release_readiness::PerlKwaliteeProfile" in main:
                  raise RuntimeError("library namespace leaked into the xtask profile surface")
              for stale_call in [
                  "perl_release_readiness::check(",
                  "perl_release_readiness::report(",
                  "perl_release_readiness::explain(",
                  "perl_release_readiness::default_json_path(",
                  "perl_release_readiness::default_markdown_path(",
              ]:
                  if stale_call in main:
                      raise RuntimeError(f"library namespace leaked into xtask dispatch: {stale_call}")
              for alias_call in [
                  "perl_kwalitee::check(",
                  "perl_kwalitee::report(",
                  "perl_kwalitee::explain(",
                  "perl_kwalitee::default_json_path(",
                  "perl_kwalitee::default_markdown_path(",
              ]:
                  if main.count(alias_call) != 1:
                      raise RuntimeError(f"compatibility alias dispatch missing or duplicated: {alias_call}")
          ''',
              "xtask namespace verifier",
          )

          replace_once(
              '''    for path in ROOT.rglob("*.rs"):
                  if path in {SELF}:
                      continue
          ''',
              '''    for path in ROOT.rglob("*.rs"):
                  if path in {SELF, ROOT / "xtask/src/main.rs"}:
                      continue
          ''',
              "intentional compatibility-module exemption",
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply mechanical namespace migration
        run: python3 scripts/agent_move_release_readiness_7166.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Validate locked workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Clippy moved crate
        run: cargo clippy -p perl-release-readiness --tests -- -D warnings

      - name: Compile canonical release-readiness CLI test
        run: cargo test -p xtask --test release_readiness_cli --locked --no-run

      - name: Compile deprecated perl-kwalitee alias test
        run: cargo test -p xtask --test perl_kwalitee_alias_cli --locked --no-run

      - name: Test moved crate
        run: cargo test -p perl-release-readiness --locked

      - name: Test canonical release-readiness CLI
        run: cargo test -p xtask --test release_readiness_cli --locked

      - name: Test deprecated perl-kwalitee alias
        run: cargo test -p xtask --test perl_kwalitee_alias_cli --locked

      - name: Commit verified migration and remove agent scaffolding
        env:
          BRANCH: agent/move-perl-release-readiness-7166
        run: |
          rm scripts/agent_move_release_readiness_7166.py
          rm .github/workflows/agent-move-release-readiness-7166.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(release-readiness): move mixed evaluator namespace (#7166)"
          git push origin "HEAD:${BRANCH}"
