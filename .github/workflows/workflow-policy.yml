name: Workflow Policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'xtask/src/tasks/workflow_policy_lint.rs'
      - 'xtask/src/main.rs'
      - 'xtask/src/tasks/mod.rs'
      - '.ci/receipts/schemas/workflow-policy.schema.json'
      - 'xtask/tests/fixtures/workflow-policy/**'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - 'xtask/src/tasks/workflow_policy_lint.rs'
      - 'xtask/src/main.rs'
      - 'xtask/src/tasks/mod.rs'
      - '.ci/receipts/schemas/workflow-policy.schema.json'
      - 'xtask/tests/fixtures/workflow-policy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-policy-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Run workflow policy lint
        run: cargo xtask workflow-policy-lint --check-lane-whitelist --receipt target/receipts/workflow-policy.json
      - name: Upload workflow policy receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-policy-receipt
          path: target/receipts/workflow-policy.json

  agent-export-6030:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/security-pod-preview-6030'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Run branch-owned transform
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/agent-build-security-6030.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          Path('/tmp/apply.py').write_text(body + '\n', encoding='utf-8')
          PY
          python3 /tmp/apply.py
      - name: Setup locked extension toolchain
        uses: ./.github/actions/setup-vscode-toolchain
        with:
          working-directory: vscode-extension
      - name: Run focused proof
        working-directory: vscode-extension
        run: |
          npm exec --offline --no -- oxfmt --write src/podPreview.ts src/test/podPreview.test.ts
          npm run fmt:check
          npm run typecheck
          npm run lint
          npm test -- --runInBand podPreview.test.js
      - name: Upload verified POD files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-6030-product-${{ github.run_id }}
          path: |
            vscode-extension/src/podPreview.ts
            vscode-extension/src/test/podPreview.test.ts
          if-no-files-found: error
          retention-days: 3
