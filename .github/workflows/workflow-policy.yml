name: Workflow Policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'xtask/src/tasks/workflow_policy_lint.rs'
      - 'xtask/src/tasks/ux_regression_receipt.rs'
      - 'xtask/src/main.rs'
      - 'xtask/src/tasks/mod.rs'
      - 'xtask/tests/ux_regression_gate_workflow_policy.rs'
      - 'xtask/tests/public_api_pr_gating_workflow.rs'
      - 'xtask/tests/perl_version_matrix_cache_contract.rs'
      - 'xtask/tests/corpus_windows_reparse_cache_contract.rs'
      - 'xtask/tests/ci_nightly_cache_contract.rs'
      - '.github/ci-config.yml'
      - 'scripts/gh/ensure-labels.sh'
      - 'scripts/tests/test-public-api-ratchet.sh'
      - 'scripts/tests/test-public-api-label.sh'
      - 'docs/ci/labels.md'
      - 'justfile'
      - '.ci/receipts/schemas/workflow-policy.schema.json'
      - 'xtask/tests/fixtures/workflow-policy/**'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - 'xtask/src/tasks/workflow_policy_lint.rs'
      - 'xtask/src/tasks/ux_regression_receipt.rs'
      - 'xtask/src/main.rs'
      - 'xtask/src/tasks/mod.rs'
      - 'xtask/tests/ux_regression_gate_workflow_policy.rs'
      - 'xtask/tests/public_api_pr_gating_workflow.rs'
      - 'xtask/tests/perl_version_matrix_cache_contract.rs'
      - 'xtask/tests/corpus_windows_reparse_cache_contract.rs'
      - 'xtask/tests/ci_nightly_cache_contract.rs'
      - '.github/ci-config.yml'
      - 'scripts/gh/ensure-labels.sh'
      - 'scripts/tests/test-public-api-ratchet.sh'
      - 'scripts/tests/test-public-api-label.sh'
      - 'docs/ci/labels.md'
      - 'justfile'
      - '.ci/receipts/schemas/workflow-policy.schema.json'
      - 'xtask/tests/fixtures/workflow-policy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-policy-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Install just for executable recipe proofs
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b  # v2.87.4
        with:
          tool: just
      - name: Verify tested candidate identity
        env:
          TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$TESTED_SHA"
      - name: UX receipt workflow policy proof
        run: cargo test -p xtask --test ux_regression_gate_workflow_policy --locked
      - name: Perl matrix cache policy contract
        run: cargo test -p xtask --test perl_version_matrix_cache_contract --locked
      - name: Nightly rust-cache writer contract
        run: cargo test -p xtask --test ci_nightly_cache_contract --locked
      - name: Public API trigger label contract
        run: cargo test -p xtask --test public_api_pr_gating_workflow --locked
      - name: Public API label reconciliation stub proof
        run: bash scripts/tests/test-public-api-label.sh
      - name: Public API ratchet executable proof
        run: bash scripts/tests/test-public-api-ratchet.sh
      - name: Run workflow policy lint
        # `--check-lane-whitelist` enables the policy/ci-lane-whitelist.toml
        # gate (was opt-in per PR #8154). All currently-flagged workflows
        # either have a whitelist entry or an allowlist exemption, so this
        # is a no-op for the existing tree and a guard against future drift.
        # See #8166 ("CI economics rollout: deferred follow-ups").
        run: cargo xtask workflow-policy-lint --check-lane-whitelist --receipt target/receipts/workflow-policy.json
      - name: Run Windows reparse cache contract
        run: cargo test --locked -p xtask --test corpus_windows_reparse_cache_contract
      - name: Upload workflow policy receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: workflow-policy-receipt
          path: target/receipts/workflow-policy.json
