name: Workflow Policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'xtask/src/tasks/workflow_policy_lint.rs'
      - 'xtask/src/main.rs'
      - 'xtask/src/tasks/mod.rs'
      - '.ci/receipts/schemas/workflow-policy.schema.json'
      - 'xtask/tests/fixtures/workflow-policy/**'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - 'xtask/src/tasks/workflow_policy_lint.rs'
      - 'xtask/src/main.rs'
      - 'xtask/src/tasks/mod.rs'
      - '.ci/receipts/schemas/workflow-policy.schema.json'
      - 'xtask/tests/fixtures/workflow-policy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-policy-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Run workflow policy lint
        # `--check-lane-whitelist` enables the policy/ci-lane-whitelist.toml
        # gate (was opt-in per PR #8154). All currently-flagged workflows
        # either have a whitelist entry or an allowlist exemption, so this
        # is a no-op for the existing tree and a guard against future drift.
        # See #8166 ("CI economics rollout: deferred follow-ups").
        run: cargo xtask workflow-policy-lint --check-lane-whitelist --receipt target/receipts/workflow-policy.json
      - name: Upload workflow policy receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: workflow-policy-receipt
          path: target/receipts/workflow-policy.json

  agent-prune-resolved-baseline-6041:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/security-workflow-ratchet-6041'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Remove only the two main-landed workflow-policy findings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path('.ci/workflow-security-baseline.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          targets = {
              ('mutable_action_ref', '.github/workflows/workflow-policy.yml', 'actions/checkout@v7'),
              ('mutable_action_ref', '.github/workflows/workflow-policy.yml', 'actions/upload-artifact@v7'),
          }
          retained = []
          removed = set()
          for finding in payload['findings']:
              key = (finding['rule'], finding['path'], finding['evidence'])
              if key in targets:
                  removed.add(key)
              else:
                  retained.append(finding)
          if removed != targets:
              raise SystemExit(f'expected exactly two resolved findings, removed={sorted(removed)}')
          if len(payload['findings']) - len(retained) != 2:
              raise SystemExit('unexpected baseline removal count')
          payload['findings'] = retained
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git add .ci/workflow-security-baseline.json
          test "$(git diff --cached --name-only)" = ".ci/workflow-security-baseline.json"
      - name: Commit the bounded baseline correction
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "security(ci): drop resolved workflow-policy debt"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin HEAD:agent/security-workflow-ratchet-6041
