name: Agent repair PR 6929

'on':
  push:
    branches:
      - 'agent/6877-agent-flow-route-semantics'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded repair
        run: python .github/agent-repairs/repair-6929.py

      - name: Format
        run: cargo fmt --all

      - name: Focused agent-flow tests
        run: cargo test -p xtask agent_flow -- --nocapture

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add xtask/src/tasks/agent_flow.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix agent-flow labeled route declarations"
          git push origin "HEAD:${GITHUB_REF_NAME}"
