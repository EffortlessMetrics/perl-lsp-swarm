name: Release History

on:
  pull_request:
    paths:
      - ".github/workflows/release-history.yml"
      - "rust-toolchain.toml"
      - "RELEASE_HISTORY.md"
      - "docs/releases/**"
      - "policy/release-tag-provenance.toml"
      - "scripts/check_release_history.sh"
      - "scripts/check_release_tag_provenance.py"
      - "scripts/tests/test_release_channel_actuals.py"
      - "scripts/test_release_build_identity.py"
      - "scripts/test_release_package_evidence.py"
      - "scripts/test_release_tag_authority.py"
      - "scripts/test_release_topology_json.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-history.yml"
      - "rust-toolchain.toml"
      - "RELEASE_HISTORY.md"
      - "docs/releases/**"
      - "policy/release-tag-provenance.toml"
      - "scripts/check_release_history.sh"
      - "scripts/check_release_tag_provenance.py"
      - "scripts/tests/test_release_channel_actuals.py"
      - "scripts/test_release_build_identity.py"
      - "scripts/test_release_package_evidence.py"
      - "scripts/test_release_tag_authority.py"
      - "scripts/test_release_topology_json.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  release-history:
    name: Release history provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch origin --tags --force
      - name: Read repository toolchain requirements
        id: toolchain
        run: |
          printf 'RUSTUP_HOME=%s/release-history-rustup-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]
          channel = toolchain["channel"]
          components = toolchain["components"]
          if not isinstance(channel, str) or not re.fullmatch(r"1\.[0-9]+\.[0-9]+", channel):
              raise ValueError("expected an exact repository Rust version")
          if (not isinstance(components, list) or not components
                  or any(not isinstance(item, str) or not re.fullmatch(r"[a-z][a-z0-9-]*", item)
                         for item in components)
                  or len(set(components)) != len(components)):
              raise ValueError("expected unique repository toolchain components")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"channel={channel}\ncomponents={','.join(components)}\n")
          PY
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable (master)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: ${{ steps.toolchain.outputs.components }}
      - name: Verify checkout toolchain
        env:
          EXPECTED_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
        run: |
          test "$RUSTUP_HOME" = "$RUNNER_TEMP/release-history-rustup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rustup show active-toolchain
          test "$(cargo --version | awk '{print $2}')" = "$EXPECTED_TOOLCHAIN"
          test "$(rustc --version | awk '{print $2}')" = "$EXPECTED_TOOLCHAIN"
          rustup component list --installed
          rustup component list --installed | grep -q '^rustfmt-'
          cargo clippy --version
      - name: Install just
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff  # v2.87.8
        with:
          tool: just
      - name: Install pinned release schema dependencies
        run: python3 -m pip install -r scripts/requirements-release.txt

      - name: Run release-history provenance checks
        run: just ci-release-history
