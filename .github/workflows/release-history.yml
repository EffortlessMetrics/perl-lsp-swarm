name: Release History

on:
  pull_request:
    paths:
      - "RELEASE_HISTORY.md"
      - "docs/releases/**"
      - "policy/release-tag-provenance.toml"
      - "scripts/check_release_history.sh"
      - "scripts/check_release_tag_provenance.py"
  push:
    branches: [main]
    paths:
      - "RELEASE_HISTORY.md"
      - "docs/releases/**"
      - "policy/release-tag-provenance.toml"
      - "scripts/check_release_history.sh"
      - "scripts/check_release_tag_provenance.py"

permissions:
  contents: read

concurrency:
  group: release-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-history:
    name: Release history provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901c5a2d43c2c6fef27b1419d9f35ea8e2
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch origin --tags --force
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
      - name: Install just
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8  # v2.87.5
        with:
          tool: just
      - name: Run release-history provenance checks
        run: just ci-release-history
