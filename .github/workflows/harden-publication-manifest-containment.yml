name: Harden publication manifest containment

on:
  push:
    branches:
      - agent/publication-drift-classifier-6743

permissions:
  contents: write

concurrency:
  group: harden-publication-manifest-containment
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: agent/publication-drift-classifier-6743

      - name: Apply containment hardening
        shell: bash
        env:
          PATCH_SCRIPT_B64: 
        run: |
          printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode > /tmp/harden-publication-manifest.py
          python3 /tmp/harden-publication-manifest.py

      - name: Format and verify containment behavior
        shell: bash
        run: |
          cargo fmt -p xtask
          git diff --check
          cargo test -p xtask --lib --locked publication_drift

      - name: Commit the verified improvement and remove executor
        shell: bash
        run: |
          git rm .github/workflows/harden-publication-manifest-containment.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git commit -m "fix(release): contain publication manifest authority (#6743)"
          git push origin HEAD:agent/publication-drift-classifier-6743
