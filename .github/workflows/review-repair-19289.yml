name: Review repair 19289

on:
  push:
    branches: [fix/agent-build-efficiency-20261109]

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'EffortlessMetrics/perl-lsp-swarm'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/agent-build-efficiency-20261109
          fetch-depth: 1

      - name: Apply reviewed repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/storage_observation.py",
              "        errors = set()\n        seen = {}\n        stack = [(root, 0)]\n",
              "        errors = set()\n        seen = {}\n        directories = []\n        stack = [(root, 0)]\n",
          )
          replace_once(
              "scripts/storage_observation.py",
              "                if stat.S_ISDIR(metadata.st_mode):\n                    if depth >= max_depth:\n",
              "                if stat.S_ISDIR(metadata.st_mode):\n                    directories.append((path, observation[2]))\n                    if depth >= max_depth:\n",
          )
          old_tail = (
              "            except (OSError, Denied, Unknown, ValueError):\n"
              "                errors.add(\"unreadable_linked_or_unsupported_entry\")\n"
              "        allocated_known = all(value[1] is not None for value in seen.values())\n"
          )
          new_tail = (
              "            except (OSError, Denied, Unknown, ValueError):\n"
              "                errors.add(\"unreadable_linked_or_unsupported_entry\")\n"
              "        # A directory can change after its own listing without changing the\n"
              "        # named root. Recheck every traversed directory under the same finite\n"
              "        # budget before treating retained byte totals as complete.\n"
              "        for directory, recorded in directories:\n"
              "            try:\n"
              "                budget.take()\n"
              "            except Unknown:\n"
              "                errors.add(\"traversal_clipped\")\n"
              "                break\n"
              "            try:\n"
              "                native_path(str(directory))\n"
              "                current = directory.lstat()\n"
              "                if (linked(current) or not stat.S_ISDIR(current.st_mode)\n"
              "                        or not current.st_ino):\n"
              "                    raise Unknown(\"directory_recheck_invalid\")\n"
              "                if facts(current) != recorded:\n"
              "                    errors.add(\"entry_changed\")\n"
              "            except FileNotFoundError:\n"
              "                errors.add(\"missing_or_changed_entry\")\n"
              "            except (OSError, Denied, Unknown, ValueError):\n"
              "                errors.add(\"unreadable_linked_or_unsupported_entry\")\n"
              "        allocated_known = all(value[1] is not None for value in seen.values())\n"
          )
          replace_once("scripts/storage_observation.py", old_tail, new_tail)

          replace_once(
              "scripts/tests/test_storage_doctor.py",
              "    def test_empty_is_known_only_when_all_named_roots_are_present(self):\n",
              """    def test_move_between_already_and_not_yet_listed_directories_invalidates_totals(self):
                  root = self.paths["build"]
                  source = root / "src"
                  destination = root / "dst"
                  source.mkdir()
                  destination.mkdir()
                  payload = source / "payload"
                  payload.write_bytes(b"must not disappear from a complete observation")
                  real_scandir, real_lstat = os.scandir, Path.lstat
                  destination_listed = False
                  moved = False

                  @contextmanager
                  def ordered_scandir(path):
                      nonlocal destination_listed
                      with real_scandir(path) as children:
                          entries = list(children)
                          if Path(path) == root:
                              entries.sort(key=lambda child: child.name == "dst")
                          if Path(path) == destination:
                              destination_listed = True
                          yield iter(entries)

                  def lstat(path):
                      nonlocal moved
                      if Path(path) == source and destination_listed and not moved:
                          before = real_lstat(destination)
                          payload.rename(destination / payload.name)
                          os.utime(destination, ns=(before.st_atime_ns,
                                                   before.st_mtime_ns + 1_000_000_000))
                          moved = True
                      return real_lstat(path)

                  with mock.patch.object(self.observer.os, "scandir", ordered_scandir), \
                       mock.patch.object(Path, "lstat", lstat):
                      result = self.observer.inventory_roots(
                          {"build": root}, collect_fingerprints=False)
                  self.assertTrue(moved)
                  build = result["resources"]["build"]
                  self.assertFalse(build["inventory_complete"])
                  self.assertIn("entry_changed", build["reasons"])
                  self.assertIsNone(build["apparent_bytes"])
                  self.assertIsNone(build["allocated_bytes"])
                  self.assertIsNone(result["combined"]["apparent_bytes"])
                  self.assertIsNone(result["combined"]["allocated_bytes"])

              def test_empty_is_known_only_when_all_named_roots_are_present(self):
          """,
          )

          replace_once(
              "scripts/tests/test_cargo_admitted_budget.py",
              '             patch.object(safe.subprocess, "call", side_effect=call, return_value=0) as cargo, \\\n',
              '             patch.object(safe.subprocess, "run", return_value=\n'
              '                          subprocess.CompletedProcess([], 0, b"", b"")), \\\n'
              '             patch.object(safe.subprocess, "call", side_effect=call, return_value=0) as cargo, \\\n',
          )
          replace_once(
              "scripts/tests/test_cargo_admitted_storage.py",
              '             patch.object(safe.subprocess, "call", side_effect=call or (lambda *a, **kw: 0)):\n',
              '             patch.object(safe.subprocess, "run", return_value=\n'
              '                          subprocess.CompletedProcess([], 0, b"", b"")), \\\n'
              '             patch.object(safe.subprocess, "call", side_effect=call or (lambda *a, **kw: 0)):\n',
          )
          replace_once(
              "scripts/tests/test_cargo_admitted_storage.py",
              "    def test_setup_failure_never_launches_product_and_uses_original_owner_settlement(self):\n",
              """    @unittest.skipUnless(
                  sys.platform == "linux",
                  "setup-failure settlement uses the Linux owned-tree path",
              )
              def test_setup_failure_never_launches_product_and_uses_original_owner_settlement(self):
          """,
          )
          PY

      - name: Run focused repair proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/storage_observation.py \
            scripts/tests/test_storage_doctor.py \
            scripts/tests/test_cargo_admitted_budget.py \
            scripts/tests/test_cargo_admitted_storage.py
          python3 -m unittest discover -s scripts/tests -p 'test_storage_doctor.py'
          python3 -m unittest discover -s scripts/tests -p 'test_cargo_admitted_budget.py'
          python3 -m unittest discover -s scripts/tests -p 'test_cargo_admitted_storage.py'
          git diff --check

      - name: Publish repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/review-repair-19289.yml
          printf '%s\n' 'review repairs applied and focused proof passed' > .ci/review-repair-19289.trigger
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add scripts/storage_observation.py \
            scripts/tests/test_storage_doctor.py \
            scripts/tests/test_cargo_admitted_budget.py \
            scripts/tests/test_cargo_admitted_storage.py \
            .ci/review-repair-19289.trigger \
            .github/workflows/review-repair-19289.yml
          git commit -m 'fix(build): close admitted-storage review gaps (#17673)'
          git push origin HEAD:refs/heads/fix/agent-build-efficiency-20261109
