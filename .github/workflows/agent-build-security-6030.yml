name: Agent build security 6030

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/security-pod-preview-6030'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/security-pod-preview-6030
          fetch-depth: 0
          persist-credentials: false
      - name: Replace mixed-string renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('vscode-extension/src/podPreview.ts')
          text = path.read_text(encoding='utf-8')
          start = text.index('function renderInline(text: string): string {')
          end = text.index('\nfunction renderInlineCode(', start)
          render_inline = r'''function renderInline(text: string): string {
            const parts: string[] = [];
            let cursor = 0;
            while (cursor < text.length) {
              const match = /[BICLESFZX]</.exec(text.slice(cursor));
              if (!match || match.index === undefined) {
                parts.push(escapeHtml(text.slice(cursor)));
                break;
              }
              const markerStart = cursor + match.index;
              parts.push(escapeHtml(text.slice(cursor, markerStart)));
              const code = text[markerStart];
              if (code === undefined) break;
              const doubleDelimited = text.startsWith('<<', markerStart + 1);
              const bodyStart = markerStart + (doubleDelimited ? 3 : 2);
              const closeMarker = doubleDelimited ? '>>' : '>';
              const close = text.indexOf(closeMarker, bodyStart);
              if (close === -1) {
                parts.push(escapeHtml(text.slice(markerStart)));
                break;
              }
              const rawInner = text.slice(bodyStart, close);
              parts.push(renderInlineCode(code, doubleDelimited ? rawInner.trim() : rawInner));
              cursor = close + closeMarker.length;
            }
            return parts.join('');
          }
          '''
          text = text[:start] + render_inline + text[end:]
          start = text.index('function renderLinkCode(inner: string): string {')
          end = text.index('\nfunction renderEscapeCode(', start)
          render_link = r'''function renderLinkCode(inner: string): string {
            const pipeIdx = inner.indexOf('|');
            if (pipeIdx !== -1) {
              const label = inner.slice(0, pipeIdx).trim();
              const target = inner.slice(pipeIdx + 1).trim();
              if (/^https?:\/\//i.test(target)) {
                return `<a href="${escapeAttr(target)}">${escapeHtml(label)}</a>`;
              }
              if (/^[a-z][a-z0-9+.-]*:/i.test(target)) return escapeHtml(label);
              return `<a href="#${escapeAttr(target.replace(/\s+/g, '-').toLowerCase())}">${escapeHtml(label)}</a>`;
            }
            if (/^https?:\/\//i.test(inner)) {
              return `<a href="${escapeAttr(inner)}">${escapeHtml(inner)}</a>`;
            }
            if (/^[a-z][a-z0-9+.-]*:/i.test(inner)) return escapeHtml(inner);
            const slashIdx = inner.indexOf('/');
            if (slashIdx !== -1) {
              const mod = inner.slice(0, slashIdx);
              const section = inner.slice(slashIdx + 1);
              return `<a href="https://perldoc.perl.org/${escapeAttr(mod)}">${escapeHtml(mod)}/${escapeHtml(section)}</a>`;
            }
            return `<a href="https://perldoc.perl.org/${escapeAttr(inner)}">${escapeHtml(inner)}</a>`;
          }
          '''
          text = text[:start] + render_link + text[end:]
          text = text.replace('enableScripts: false,\n      retainContextWhenHidden: true,', 'enableScripts: false,\n      localResourceRoots: [],\n      retainContextWhenHidden: true,')
          path.write_text(text, encoding='utf-8')
          tests = Path('vscode-extension/src/test/podPreview.test.ts')
          body = tests.read_text(encoding='utf-8')
          insertion = r'''

            test('escapes raw HTML and CSS from workspace POD prose', () => {
              const pod = '=pod\n\n<style>body{display:none}</style><form><input value="spoof"></form>\n\n=cut\n';
              const html = podToHtml(pod);
              expect(html).toContain('&lt;style&gt;');
              expect(html).toContain('&lt;form&gt;');
              expect(html).not.toContain('<style>');
              expect(html).not.toContain('<form>');
              expect(html).not.toContain('<input');
            });

            test('escapes raw anchors while preserving trusted POD links', () => {
              const pod = '=pod\n\n<a href="https://evil.example">spoof</a> L<safe|https://example.com>.\n\n=cut\n';
              const html = podToHtml(pod);
              expect(html).toContain('&lt;a href=&quot;https://evil.example&quot;&gt;spoof&lt;/a&gt;');
              expect(html).toContain('<a href="https://example.com">safe</a>');
            });

            test('does not emit non-http URI schemes from POD links', () => {
              const html = podToHtml('=pod\n\nL<click|javascript:alert(1)> L<data:text/html,boom>.\n\n=cut\n');
              expect(html).not.toContain('href="javascript:');
              expect(html).not.toContain('href="data:');
            });

            test('escapes malformed POD formatting markers as literal text', () => {
              const html = podToHtml('=pod\n\nB<< <img src=x onerror=boom>\n\n=cut\n');
              expect(html).toContain('&lt;img src=x onerror=boom&gt;');
              expect(html).not.toContain('<img');
            });
          '''
          position = body.rfind('\n});\n')
          if position == -1: raise SystemExit('test suite terminator missing')
          tests.write_text(body[:position] + insertion + body[position:], encoding='utf-8')
          PY
      - name: Setup extension toolchain
        uses: ./.github/actions/setup-vscode-toolchain
        with:
          working-directory: vscode-extension
      - name: Format and test
        working-directory: vscode-extension
        run: |
          npm exec --offline --no -- oxfmt --write src/podPreview.ts src/test/podPreview.test.ts
          npm run fmt:check
          npm run typecheck
          npm run lint
          npm test -- --runInBand src/test/podPreview.test.ts
      - name: Create unreferenced verified commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: 'security(vscode): render POD from trusted tokens (#6030)'
        run: |
          rm .github/workflows/agent-build-security-6030.yml .agent-trigger-6030
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']
          parent=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); api=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def call(method,url,payload=None):
              req=urllib.request.Request(url,data=None if payload is None else json.dumps(payload).encode(),method=method,headers=headers)
              with urllib.request.urlopen(req) as response: return json.load(response)
          base_tree=call('GET',f'{api}/git/commits/{parent}')['tree']['sha']; entries=[]
          for relative in ('vscode-extension/src/podPreview.ts','vscode-extension/src/test/podPreview.test.ts'):
              content=Path(relative).read_text(encoding='utf-8')
              blob=call('POST',f'{api}/git/blobs',{'content':content,'encoding':'utf-8'})['sha']
              entries.append({'path':relative,'mode':'100644','type':'blob','sha':blob})
          for relative in ('.github/workflows/agent-build-security-6030.yml','.agent-trigger-6030'):
              entries.append({'path':relative,'mode':'100644','type':'blob','sha':None})
          tree=call('POST',f'{api}/git/trees',{'base_tree':base_tree,'tree':entries})['sha']
          commit=call('POST',f'{api}/git/commits',{'message':os.environ['COMMIT_MESSAGE'],'tree':tree,'parents':[parent]})['sha']
          Path('target/security-6030-commit.txt').parent.mkdir(parents=True,exist_ok=True)
          Path('target/security-6030-commit.txt').write_text(commit+'\n',encoding='utf-8')
          print(commit)
          PY
      - name: Upload verified commit identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-6030-commit-${{ github.run_id }}
          path: target/security-6030-commit.txt
          if-no-files-found: error
          retention-days: 3
