name: Installer Checksum Contract

on:
  pull_request:
    branches: [main, master, agent/installer-bootstrap-identity-6097]
    paths:
      - 'scripts/install.sh'
      - 'install.ps1'
      - 'scripts/tests/test-installer-checksum-required.sh'
      - 'scripts/tests/test-installer-archive-safety.sh'
      - 'scripts/tests/test-installer-product-unit-promotion.sh'
      - 'scripts/tests/test-installer-verify-install.sh'
      - 'scripts/tests/lib/standalone_archive_fixtures.py'
      - 'policy/standalone-archive-safety.v1.toml'
      - 'docs/how-to/INSTALLATION.md'
      - '.github/workflows/installer-checksum-contract.yml'
  push:
    branches: [main, master]
    paths:
      - 'scripts/install.sh'
      - 'install.ps1'
      - 'scripts/tests/test-installer-checksum-required.sh'
      - 'scripts/tests/test-installer-archive-safety.sh'
      - 'scripts/tests/test-installer-product-unit-promotion.sh'
      - 'scripts/tests/test-installer-verify-install.sh'
      - 'scripts/tests/lib/standalone_archive_fixtures.py'
      - 'policy/standalone-archive-safety.v1.toml'
      - 'docs/how-to/INSTALLATION.md'
      - '.github/workflows/installer-checksum-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-rust-1-100-probe:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'build/rust-1.100-upgrade'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: build/rust-1.100-upgrade
          fetch-depth: 1
          persist-credentials: true

      - name: Scope the requirement probe to need_cmd
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tests/test-installer-archive-safety.sh')
          text = path.read_text(encoding='utf-8')
          old = '''        configure_claude() { :; }
        INSTALL_MODE="$1"
'''
          new = '''        configure_claude() { :; }
        run_cargo_toolchain_guard() { :; }
        INSTALL_MODE="$1"
'''
          if text.count(old) != 1:
              raise SystemExit('installer requirement-probe insertion point changed')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git add scripts/tests/test-installer-archive-safety.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(installer): isolate command-requirement probe"
          git push origin HEAD:build/rust-1.100-upgrade

  validate:
    name: Installer checksum, archive safety, and product-unit promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Parse shell sources
        run: bash -n scripts/install.sh scripts/tests/test-installer-checksum-required.sh scripts/tests/test-installer-archive-safety.sh scripts/tests/test-installer-product-unit-promotion.sh scripts/tests/test-installer-verify-install.sh

      - name: Run checksum negative controls
        run: bash scripts/tests/test-installer-checksum-required.sh

      # Without these the archive-safety run reports the bsdtar and BusyBox
      # profiles NOT PROVEN and only GNU tar is covered. BusyBox tar is the
      # profile whose listing divergence admitted links and absolute-path
      # members (#11508), and bsdtar is the macOS tar family.
      - name: Install additional tar profiles
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools busybox-static

      # These packages are intentionally unversioned: Ubuntu drops superseded
      # versions from the archive, so a pinned install starts 404-ing as soon
      # as a security update lands. Record what actually resolved instead, so
      # the profile evidence names its decoders rather than assuming them. The
      # archive-safety driver separately validates that each profile resolves
      # to the expected implementation family and fails if one is swapped.
      - name: Record resolved tar-profile package versions
        run: |
          set -euo pipefail
          dpkg-query -W -f='${binary:Package} ${Version}\n' libarchive-tools busybox-static \
            | tee -a "$GITHUB_STEP_SUMMARY"
          bsdtar --version | head -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
          busybox tar --help 2>&1 | head -n 1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run archive-safety controls across tar profiles
        # The install step above is the only reason all three profiles exist
        # here, so require them: without this the driver reports NOT PROVEN in
        # the log and still exits 0, and a silently degraded image would look
        # green while covering one profile of three (#11508).
        env:
          PERL_LSP_REQUIRE_TAR_PROFILES: '1'
        run: bash scripts/tests/test-installer-archive-safety.sh

      - name: Run product-unit promotion controls
        run: bash scripts/tests/test-installer-product-unit-promotion.sh

      - name: Run verify-install fail-closed controls
        run: bash scripts/tests/test-installer-verify-install.sh
