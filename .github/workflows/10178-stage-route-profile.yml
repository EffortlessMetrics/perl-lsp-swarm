name: 10178 stage route-profile denominator

on:
  push:
    branches: [codex/10178-stage-route-profile]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact construction branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Materialize bounded production candidate
        run: python3 scripts/ci/stage_issue_10178.py patch

      - name: Format candidate
        run: cargo fmt --all

      - name: Show production wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -n "route_profile" xtask/src/tasks/gates.rs
          git diff -- xtask/src/tasks/gates.rs | sed -n '1,320p'

      - name: Verify focused route-profile contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cargo fmt --all -- --check
          cargo test -p xtask --bin xtask route_profile --locked
          cargo test -p xtask --bin xtask \
            selects_commit_tier_gate_matches_plan_gates_real_tier_composition --locked
          cargo test -p xtask --bin xtask \
            plan_gates_nightly_tier_never_selects_a_commit_tier_gate --locked
          cargo test -p xtask --bin xtask \
            plan_gates_all_tier_selects_the_commit_tier_gate --locked
          cargo clippy -p xtask --bin xtask --locked -- -D warnings

      - name: Publish clean production branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/stage_issue_10178.py publish

      - name: Upload construction receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-10178-clean-branch
          path: target/10178-result.json
          if-no-files-found: error
          retention-days: 1
