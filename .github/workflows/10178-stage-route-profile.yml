name: 10178 stage route-profile denominator

on:
  push:
    branches: [codex/10178-stage-route-profile]

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout construction source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: codex/10178-stage-route-profile
          path: construction
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout current main candidate base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: main
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Materialize bounded production candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 ../construction/scripts/ci/stage_issue_10178.py patch
          python3 - <<'PY'
          from pathlib import Path

          path = Path("xtask/src/tasks/gates/route_profile.rs")
          text = path.read_text(encoding="utf-8")
          old = '    format!("{:x}", Sha256::digest(bytes))\n'
          new = '''    Sha256::digest(bytes)
              .iter()
              .map(|byte| format!("{byte:02x}"))
              .collect()
          '''
          if text.count(old) != 1:
              raise SystemExit("sha256 formatter repair did not match exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Format candidate
        working-directory: candidate
        run: cargo fmt --all

      - name: Show production wiring
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          grep -n "route_profile" xtask/src/tasks/gates.rs
          git diff -- xtask/src/tasks/gates.rs | sed -n '1,320p'

      - name: Verify focused route-profile contract
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/issue-10178
          exec > >(tee target/issue-10178/proof.log) 2>&1
          git diff --check
          cargo fmt --all -- --check
          cargo test -p xtask --bin xtask route_profile --locked
          cargo test -p xtask --bin xtask \
            selects_commit_tier_gate_matches_plan_gates_real_tier_composition --locked
          cargo test -p xtask --bin xtask \
            plan_gates_nightly_tier_never_selects_a_commit_tier_gate --locked
          cargo test -p xtask --bin xtask \
            plan_gates_all_tier_selects_the_commit_tier_gate --locked
          cargo clippy -p xtask --bin xtask --locked -- -D warnings

      - name: Capture production candidate and proof
        if: always()
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/issue-10178
          git rev-parse HEAD > target/issue-10178/base-sha.txt
          git diff --binary > target/issue-10178/candidate.patch
          tar -czf target/issue-10178/candidate-files.tar.gz \
            xtask/src/tasks/gates.rs \
            xtask/src/tasks/gates/route_profile.rs
          sha256sum target/issue-10178/candidate.patch \
            target/issue-10178/candidate-files.tar.gz \
            > target/issue-10178/SHA256SUMS

      - name: Upload candidate and proof receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: issue-10178-candidate-and-proof
          path: candidate/target/issue-10178
          if-no-files-found: error
          retention-days: 1
