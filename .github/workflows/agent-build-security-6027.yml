name: Agent build security 6027

on:
  push:
    branches:
      - agent/security-ux-gate-6027

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/security-ux-gate-6027
          fetch-depth: 0

      - name: Isolate untrusted execution from repository authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/ux-regression-gate.yml')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'permissions:\n  contents: read\n  pull-requests: write\n  statuses: write\n',
              'permissions:\n  contents: read\n',
          )
          text = text.replace(
              'env:\n  CARGO_TERM_COLOR: always\n  RUST_BACKTRACE: 1\n',
              "env:\n  CARGO_TERM_COLOR: always\n  RUST_BACKTRACE: 1\n  TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}\n",
          )
          text = text.replace(
              'actions/checkout@v7',
              'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7',
          )
          text = text.replace(
              'actions/upload-artifact@v7',
              'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1',
          )
          text = re.sub(r'\n\s+token: \$\{\{ secrets\.GITHUB_TOKEN \}\}', '', text)
          text = re.sub(
              r'(uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7\n\s+with:\n(?:\s+[^\n]+\n)*?\s+ref: [^\n]+\n)',
              lambda m: m.group(1) + '          persist-credentials: false\n',
              text,
          )
          text = text.replace('--sha "${{ github.sha }}"', '--sha "$TESTED_SHA"')
          text = text.replace('ux-regression-gate-receipt-${{ github.sha }}', 'ux-regression-gate-receipt-${{ env.TESTED_SHA }}')

          codecov_step = re.compile(
              r'\n      - name: Upload UX regression gate test results to Codecov\n.*?(?=\n      - name: Parse and summarize UX test results)',
              re.S,
          )
          replacement = '''
      - name: Upload UX regression gate test results to Codecov
        if: always() && steps.harness_check.outputs.harness_available == 'true'
        continue-on-error: true
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          files: target/test-results/ux-regression-gate-junit.xml
          fail_ci_if_error: false
'''
          text, count = codecov_step.subn(replacement.rstrip(), text)
          if count != 1:
              raise SystemExit(f'expected one Codecov step, found {count}')

          text, count = re.subn(
              r'\n      - name: Set commit status\n.*?(?=\n      - name: Fail UX regression gate on test failures)',
              '',
              text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one UX status writer, found {count}')

          text, count = re.subn(
              r'\n      - name: Report extension Jest result \(ci/extension-jest\)\n.*\Z',
              '\n',
              text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one extension status writer, found {count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify authority and identity boundaries
        run: |
          set -euo pipefail
          file=.github/workflows/ux-regression-gate.yml
          ! grep -q 'pull-requests: write' "$file"
          ! grep -q 'statuses: write' "$file"
          ! grep -q 'actions/github-script' "$file"
          ! grep -q 'secrets.CODECOV_TOKEN' "$file"
          ! grep -q 'token:.*GITHUB_TOKEN' "$file"
          ! grep -q 'actions/checkout@v7' "$file"
          ! grep -q 'actions/upload-artifact@v7' "$file"
          grep -q 'TESTED_SHA:' "$file"
          grep -q -- '--sha "$TESTED_SHA"' "$file"
          grep -q 'persist-credentials: false' "$file"
          git diff --check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0

      - name: Run workflow contracts
        run: |
          cargo run -p xtask --locked -- workflow-policy-lint
          cargo run -p xtask --locked -- workflow-trigger-lint

      - name: Commit product-only change
        env:
          BRANCH: agent/security-ux-gate-6027
        run: |
          set -euo pipefail
          rm .github/workflows/agent-build-security-6027.yml
          git add .github/workflows/agent-build-security-6027.yml .github/workflows/ux-regression-gate.yml
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git commit -m 'security(ci): isolate UX gate execution authority (#6027)'
          git push origin "HEAD:${BRANCH}"
