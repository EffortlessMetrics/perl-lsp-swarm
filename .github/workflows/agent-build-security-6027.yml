name: Agent build security 6027

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/security-ux-gate-6027'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/security-ux-gate-6027
          fetch-depth: 0
      - name: Apply authority split
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('.github/workflows/ux-regression-gate.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('permissions:\n  contents: read\n  pull-requests: write\n  statuses: write\n', 'permissions:\n  contents: read\n')
          text = text.replace('env:\n  CARGO_TERM_COLOR: always\n  RUST_BACKTRACE: 1\n', "env:\n  CARGO_TERM_COLOR: always\n  RUST_BACKTRACE: 1\n  TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}\n")
          text = text.replace('actions/checkout@v7', 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7')
          text = text.replace('actions/upload-artifact@v7', 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1')
          text = re.sub(r'\n\s+token: \$\{\{ secrets\.GITHUB_TOKEN \}\}', '', text)
          lines = text.splitlines()
          out = []
          for index, line in enumerate(lines):
              out.append(line)
              if 'uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' in line:
                  # Existing checkout steps all have a with block. Insert before the next step if absent.
                  pass
          text = '\n'.join(out) + '\n'
          text = re.sub(r'(uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7\n\s+with:\n(?:\s+[^\n]+\n)*?)(?=\s+- name:|\s+- uses:|\n\s{2}[A-Za-z0-9_-]+:)', lambda m: m.group(1) if 'persist-credentials:' in m.group(1) else m.group(1) + '          persist-credentials: false\n', text)
          text = text.replace('--sha "${{ github.sha }}"', '--sha "$TESTED_SHA"')
          text = text.replace('ux-regression-gate-receipt-${{ github.sha }}', 'ux-regression-gate-receipt-${{ env.TESTED_SHA }}')
          pattern = re.compile(r'\n      - name: Upload UX regression gate test results to Codecov\n.*?(?=\n      - name: Parse and summarize UX test results)', re.S)
          replacement = '''
      - name: Upload UX regression gate test results to Codecov
        if: always() && steps.harness_check.outputs.harness_available == 'true'
        continue-on-error: true
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          files: target/test-results/ux-regression-gate-junit.xml
          fail_ci_if_error: false
'''
          text, count = pattern.subn(replacement.rstrip(), text)
          if count != 1:
              raise SystemExit(f'Codecov step count: {count}')
          text, count = re.subn(r'\n      - name: Set commit status\n.*?(?=\n      - name: Fail UX regression gate on test failures)', '', text, flags=re.S)
          if count != 1:
              raise SystemExit(f'UX writer count: {count}')
          text, count = re.subn(r'\n      - name: Report extension Jest result \(ci/extension-jest\)\n.*\Z', '\n', text, flags=re.S)
          if count != 1:
              raise SystemExit(f'extension writer count: {count}')
          path.write_text(text, encoding='utf-8')
          PY
          file=.github/workflows/ux-regression-gate.yml
          ! grep -Eq '(pull-requests|statuses): write' "$file"
          ! grep -q 'actions/github-script' "$file"
          ! grep -q 'secrets.CODECOV_TOKEN' "$file"
          grep -q 'TESTED_SHA:' "$file"
          git diff --check
      - name: Commit product-only result
        run: |
          rm .github/workflows/agent-build-security-6027.yml .agent-trigger-6027
          git add .github/workflows/agent-build-security-6027.yml .agent-trigger-6027 .github/workflows/ux-regression-gate.yml
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git commit -m 'security(ci): isolate UX gate execution authority (#6027)'
          git push origin HEAD:agent/security-ux-gate-6027
