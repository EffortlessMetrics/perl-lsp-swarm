name: Droid Security Scan

# Automatic and secret-bearing Droid security execution is paused until #6098
# proves immutable CLI/plugin identities, temporary state, read-only execution,
# and a separate trusted publication boundary.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: droid-security-scan-paused-${{ github.repository }}
  cancel-in-progress: false

jobs:
  paused:
    name: Droid security scan paused pending immutable-tool isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Record bounded pause
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Droid security scan is paused

          Automatic and secret-bearing Droid security execution is disabled while
          [#6098](https://github.com/EffortlessMetrics/perl-lsp-swarm/issues/6098)
          establishes immutable CLI/plugin identities, temporary runtime state,
          read-only model execution, exact runner proof, and a separate trusted
          publication boundary.

          This workflow intentionally performs no checkout, package or plugin
          installation, model call, provider-secret access, GitHub mutation,
          OIDC exchange, self-hosted execution, or artifact attestation.

          Explicit interactive Droid work remains a separately classified manual
          path. This paused workflow supplies no review, finding, clean result,
          publication state, or merge authority.
          EOF
