name: Droid Security Scan

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  paused:
    name: Droid security scan paused pending immutable-tool isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record bounded pause
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Droid security scan is paused

          Automatic and secret-bearing Droid security execution is disabled while
          [#6098](https://github.com/EffortlessMetrics/perl-lsp-swarm/issues/6098)
          establishes immutable CLI/plugin identities, temporary runtime state,
          read-only model execution, and a separate trusted publication boundary.

          This workflow intentionally performs no checkout, package/plugin install,
          model call, GitHub mutation, OIDC exchange, or artifact attestation.
          EOF
