name: Stage issue 13228 implementation

on:
  push:
    branches:
      - fix/13228-perl-5-42-logical-xor
    paths:
      - .github/workflows/zz-patch-13228.yml
      - .github/patch-13228.py
      - .github/patch-13228-token-tests.py
      - .github/patch-13228-grammars.py

concurrency:
  group: stage-13228-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Rebase staging branch onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git fetch origin main
          git rebase origin/main

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Apply modern logical XOR support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/patch-13228.py').read_text()
          lines = source.splitlines()
          role_tail_lines = {
              '"            | TokenKind::DefinedOrAssign\\n",',
              '"            | TokenKind::Not\\n",',
          }
          adjusted = 0
          for index, line in enumerate(lines):
              if line.strip() not in role_tail_lines:
                  continue
              for candidate in range(index + 1, min(index + 20, len(lines))):
                  if lines[candidate].strip() == 'expected=2,':
                      lines[candidate] = lines[candidate].replace('expected=2', 'expected=1')
                      adjusted += 1
                      break
          if adjusted != 2:
              raise SystemExit(f'expected to adjust two token role tables, adjusted {adjusted}')
          source = '\n'.join(lines) + '\n'

          token_tests_start = source.index('# Keep exhaustive/manual token test tables')
          token_tests_end = source.index(
              '# ---------------------------------------------------------------------------\n'
              '# Longest-match lexer recognition'
          )
          source = source[:token_tests_start] + source[token_tests_end:]

          grammar_start = source.index(
              '# ---------------------------------------------------------------------------\n'
              '# Secondary parser grammars'
          )
          grammar_end = source.index(
              '# ---------------------------------------------------------------------------\n'
              '# Focused executable contracts'
          )
          source = source[:grammar_start] + source[grammar_end:]
          Path('/tmp/patch-13228-core.py').write_text(source)
          PY
          python3 /tmp/patch-13228-core.py
          python3 .github/patch-13228-token-tests.py
          python3 .github/patch-13228-grammars.py
          cargo fmt --all
          git diff --check

      - name: Refresh and verify token snapshots
        shell: bash
        run: |
          set -euo pipefail
          UPDATE_SNAPSHOTS=1 cargo test --locked -p perl-token --all-targets
          cargo test --locked -p perl-token --all-targets

      - name: Compile touched parser fronts
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets \
            -p perl-token \
            -p perl-lexer \
            -p perl-parser-core \
            -p perl-parser-pest

      - name: Run focused logical XOR proofs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p perl-lexer --test perl_5_40_42_logical_xor
          cargo test --locked -p perl-parser-core --test perl_5_40_42_logical_xor
          cargo test --locked -p perl-parser-pest --all-targets
          cargo xtask ci-hygiene check-v2-bundle-sync

      - name: Run affected lint and formatting gates
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets \
            -p perl-token \
            -p perl-lexer \
            -p perl-parser-core \
            -p perl-parser-pest \
            -- -D warnings
          cargo fmt --all -- --check
          git diff --check

      - name: Inventory explicit operator tables
        shell: bash
        run: |
          set -euo pipefail
          rg -n 'LogicalOrAssign|LogicalXorAssign|DefinedOrAssign|TokenKind::Or|TokenKind::LogicalXor|TokenKind::DefinedOr|\|\|=|\^\^' \
            crates/perl-token \
            crates/perl-lexer \
            crates/perl-parser-core \
            crates/perl-parser-pest \
            crates/perl-lsp-perltidy \
            editors \
            tree-sitter-perl \
            archive/crates/tree-sitter-perl-rs/src/grammar.pest || true

      - name: Commit verified source patch and remove staging machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/patch-13228.py \
            .github/patch-13228-token-tests.py \
            .github/patch-13228-grammars.py \
            .github/workflows/zz-patch-13228.yml
          test ! -e .github/patch-13228.py
          test ! -e .github/patch-13228-token-tests.py
          test ! -e .github/patch-13228-grammars.py
          test ! -e .github/workflows/zz-patch-13228.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "no verified source patch was produced" >&2
            exit 1
          fi
          git commit -m "fix(parser): support modern logical xor (#13228)"
          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"
