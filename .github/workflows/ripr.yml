          cache-on-failure: true
          cache-all-crates: true
          shared-key: ripr-fallback-${{ env.RIPR_VERSION }}-${{ hashFiles('Cargo.lock') }}
          # #12563: same restore-only repair as the primary hosted job above —
          # the fallback key is seeded by the scheduled main-ref seed job.
          save-if: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Install ripr
        run: cargo install ripr --version "$RIPR_VERSION" --locked

      - name: Run ripr doctor
        run: ripr doctor

      - name: Generate PR evidence
        run: cargo xtask ripr-pr --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA"

      - name: Generate repo-wide RIPR+ baseline receipt
        if: always()
        run: cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json

      - name: Generate review guidance
        if: always()
        run: cargo xtask ripr-review-comments --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --timeout-seconds 600

      - name: Generate impacted evidence
        if: always()
        run: cargo xtask impacted-evidence --labels-csv "$PR_LABELS"

      - name: Generate PR evidence summary
        if: always()
        run: cargo xtask ripr-pr-summary

      - name: Generate warning annotations
        if: always()
        run: cargo xtask ripr-annotations

      - name: Validate PR evidence contracts
        if: always()
        run: |
          cargo xtask ripr-pr --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --check
          cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json --check
          cargo xtask ripr-review-comments --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --check
          cargo xtask impacted-evidence --labels-csv "$PR_LABELS" --check
          cargo xtask ripr-pr-summary --check
          cargo xtask ripr-annotations --check

      - name: Enforce new RIPR gap quality gate
        if: always()
        run: |
          cargo xtask quality-gate \
            --mode enforce-new-ripr \
            --ripr-receipt target/receipts/quality/ripr-plus.json \
            --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
            --review-receipt target/ripr/review/comments.json \
            --ripr-base "origin/$BASE_REF" \
            --ripr-head HEAD \
            --receipt target/receipts/quality/quality-gate-ripr.json \
            --summary target/receipts/quality/quality-gate-ripr.md
          cargo xtask quality-gate \
            --mode enforce-new-ripr \
            --ripr-receipt target/receipts/quality/ripr-plus.json \
            --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
            --review-receipt target/ripr/review/comments.json \
            --ripr-base "origin/$BASE_REF" \
            --ripr-head HEAD \
            --receipt target/receipts/quality/quality-gate-ripr.json \
            --summary target/receipts/quality/quality-gate-ripr.md \
            --check

      - name: Append PR evidence summary
        if: always()
        shell: bash
        run: |
          if [ -f target/ripr/pr/summary.md ]; then
            cat target/ripr/pr/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR PR evidence summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/receipts/quality/quality-gate-ripr.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat target/receipts/quality/quality-gate-ripr.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR quality-gate summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/ripr/review/annotations.txt ]; then
            cat target/ripr/review/annotations.txt
          fi

      - name: Upload ripr PR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: ripr-pr-evidence-fallback
          path: |
            target/ripr/pr/**
            target/ripr/review/**
            target/xtask/impacted-evidence/**
            target/receipts/quality/ripr-plus.json
            target/receipts/quality/quality-gate-ripr.json
            target/receipts/quality/quality-gate-ripr.md
          retention-days: 14
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 3. Cache seed (#12563) -- scheduled main-ref run that warms both ripr
  # rust-cache keys so hosted PR runs restore instead of cold-building ~6.5m
  # into the runner-eviction window. Pull_request runs stay restore-only
  # (docs/ci/cache-policy.md); this job is the only writer besides a manual
  # main-ref dispatch. Builds the same artifacts the analysis jobs build
  # (ripr binary + xtask), under both shared keys.
  # -------------------------------------------------------------------------
  seed-cache:
    name: Seed ripr rust cache
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RIPR_VERSION: "0.9.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Toolchain (rust-toolchain.toml pins 1.95.0)
        run: rustc --version

      - name: Cache cargo dependencies (primary key)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ripr-${{ env.RIPR_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Install ripr
        run: cargo install ripr --version "$RIPR_VERSION" --locked

      - name: Build xtask
        run: cargo build -p xtask --locked

      - name: Cache cargo dependencies (fallback key)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ripr-fallback-${{ env.RIPR_VERSION }}-${{ hashFiles('Cargo.lock') }}

  # -------------------------------------------------------------------------
  # 4. Result aggregator -- owns the "ripr+ New Gap Gate" required-check name.
  # -------------------------------------------------------------------------
  ripr:
    name: ripr+ New Gap Gate
    needs:
      - route-ripr
      - ripr-cx53
      - ripr-cx43
      - ripr-github
      - ripr-github-retry-1
      - ripr-github-retry-2
      - ripr-fallback
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate routed result
        shell: bash
        env:
          ROUTE_RESULT: ${{ needs.route-ripr.result }}
          ROUTER_TARGET: ${{ needs.route-ripr.outputs.target }}
          ROUTER_REASON: ${{ needs.route-ripr.outputs.reason }}
          CX53_RESULT: ${{ needs.ripr-cx53.result }}
          CX43_RESULT: ${{ needs.ripr-cx43.result }}
          GITHUB_RESULT: ${{ needs.ripr-github.result }}
          RETRY1_RESULT: ${{ needs.ripr-github-retry-1.result }}
          RETRY2_RESULT: ${{ needs.ripr-github-retry-2.result }}
          FALLBACK_RESULT: ${{ needs.ripr-fallback.result }}
        run: |
          set -euo pipefail

          echo "route_result=${ROUTE_RESULT:-}"
          echo "router_target=${ROUTER_TARGET:-}"
          echo "router_reason=${ROUTER_REASON:-}"
          echo "cx53_result=${CX53_RESULT:-}"
          echo "cx43_result=${CX43_RESULT:-}"
          echo "github_result=${GITHUB_RESULT:-}"
          echo "retry1_result=${RETRY1_RESULT:-}"
          echo "retry2_result=${RETRY2_RESULT:-}"
          echo "fallback_result=${FALLBACK_RESULT:-}"

          {
            echo "### ripr+ New Gap Gate Result"
            echo ""
            echo "- route_result: \`${ROUTE_RESULT:-}\`"
            echo "- router_target: \`${ROUTER_TARGET:-}\`"
            echo "- router_reason: \`${ROUTER_REASON:-}\`"
            echo "- cx53_result: \`${CX53_RESULT:-}\`"
            echo "- cx43_result: \`${CX43_RESULT:-}\`"
            echo "- github_result: \`${GITHUB_RESULT:-}\`"
            echo "- retry1_result: \`${RETRY1_RESULT:-}\`"
            echo "- retry2_result: \`${RETRY2_RESULT:-}\`"
            echo "- fallback_result: \`${FALLBACK_RESULT:-}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # Draft PRs intentionally skip ripr: route-ripr has
          #   if: github.event.pull_request.draft != true || ...
          # which causes ROUTE_RESULT=skipped for draft PRs.  A skipped router
          # is NOT a gate failure — ripr simply does not apply yet.  Report
          # neutral/pass so agents see the true failure class (gate-names-must-
          # match-failure-classes.md, #1492).  When the PR is converted to
          # ready-for-review the workflow re-triggers and ripr runs for real.
          if [ "$ROUTE_RESULT" = "skipped" ]; then
            echo "::notice::ripr router was skipped (draft PR or non-applicable event) — ripr gate is neutral/pass."
            echo "ripr+ New Gap Gate: neutral (router skipped — draft PR or non-applicable event)"
            exit 0
          fi

          if [ "$ROUTE_RESULT" != "success" ]; then
            echo "::error::ripr router did not complete successfully: $ROUTE_RESULT"
            exit 1
          fi

          # A cancelled lane is the ABSENCE of evidence, not negative evidence.
          # The gate stays blocking — no proof was produced for this SHA — but it
          # must not read as a ripr failure. This blanket check now covers only
          # the self-hosted and failover lanes; the GitHub-hosted chain has its
          # own bounded retry-on-cancellation policy (#6807) and is evaluated by
          # the decision table below, which escalates only after every permitted
          # attempt concluded 'cancelled'.
          #
          # The workflow deliberately does not cancel in-progress evidence runs
          # when a newer PR head arrives. A cancelled lane therefore still names
          # an external/manual cancellation or runner failure, not normal head
          # supersession. Keep it blocking because no proof was produced.
          for lane_result in "$CX53_RESULT" "$CX43_RESULT" "$FALLBACK_RESULT"; do
            if [ "$lane_result" = "cancelled" ]; then
              echo "::error::ripr lane cancelled — no proof produced for this SHA. This is NOT a new RIPR gap. Normal PR synchronization does not cancel active RIPR runs; investigate an external, manual, or API cancellation and re-run this head."
              echo "ripr+ New Gap Gate: cancelled (no proof for this SHA)"
              exit 1
            fi
          done

          case "${ROUTER_TARGET:-}" in
            cx53)
              if [ "$CX53_RESULT" = "success" ]; then
                : # Primary succeeded normally.
              elif [ "$FALLBACK_RESULT" = "success" ]; then
                # Disk-full preflight failover: fallback ran on GitHub-hosted.
                # Safe because fallback only triggers when preflight_ok=false.
                echo "::warning::CX53 disk preflight failed; ripr passed via GitHub-hosted fallback. Reclaim CX53 disk."
              else
                # Primary failed and fallback did not succeed (real ripr failure, or
                # fallback skipped because preflight wasn't the failure cause).
                echo "::error::ripr on CX53 failed ($CX53_RESULT); fallback result: $FALLBACK_RESULT"
                exit 1
              fi
              ;;
            cx43)
              if [ "$CX43_RESULT" = "success" ]; then
                : # Primary succeeded normally.
              elif [ "$FALLBACK_RESULT" = "success" ]; then
                echo "::warning::CX43 disk preflight failed; ripr passed via GitHub-hosted fallback. Reclaim CX43 disk."
              else
                echo "::error::ripr on CX43 failed ($CX43_RESULT); fallback result: $FALLBACK_RESULT"
                exit 1
              fi
              ;;
            # >>> ripr github-chain decision table (unit-tested in
            # xtask/tests/ripr_new_gap_gate_workflow.rs; keep this block
            # self-contained: only the github) label, the *_RESULT environment
            # values, echo, and exit are permitted here) (#6807)
            github)
              if [ "${GITHUB_RESULT:-}" = "success" ] || [ "${RETRY1_RESULT:-}" = "success" ] || [ "${RETRY2_RESULT:-}" = "success" ]; then
                : # Some attempt produced terminal proof for this SHA.
              elif [ "${GITHUB_RESULT:-}" = "cancelled" ] && [ "${RETRY1_RESULT:-}" = "cancelled" ] && [ "${RETRY2_RESULT:-}" = "cancelled" ]; then
                echo "::error::RUNNER-SHUTDOWN-CANCELLATION exhausted: ripr+ on GitHub Hosted concluded 'cancelled' on attempt 1, retry 1/2, and retry 2/2 with zero test failures and no proof produced for this SHA. This is a repeat-offender infrastructure failure class (#6807, #12563), NOT a new RIPR gap. Escalate to the runner pool owner and re-run after the pool recovers."
                echo "ripr+ New Gap Gate: failed (RUNNER-SHUTDOWN-CANCELLATION exhausted after 3 attempts — no proof for this SHA)"
                exit 1
              else
                echo "::error::ripr on GitHub-hosted did not succeed: attempt1=${GITHUB_RESULT:-<unset>} retry1=${RETRY1_RESULT:-<unset>} retry2=${RETRY2_RESULT:-<unset>}. Cancellation-class outcomes retry at most twice (#6807); failures and skips stop the chain immediately."
                exit 1
              fi
              # <<< ripr github-chain decision table (unit-tested)
              ;;
            *)
              echo "::error::Unknown router target: ${ROUTER_TARGET:-<empty>}"
              exit 1
              ;;
          esac

          echo "ripr+ New Gap Gate: success (runner: ${ROUTER_TARGET:-unknown}, reason: ${ROUTER_REASON:-unknown})"
