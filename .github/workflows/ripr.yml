# ripr - required receipt gate with advisory static sensor output
#
# Badges are repo-scoped public state. This workflow produces diff-scoped PR
# evidence under target/ripr/ and mutation-routing receipts under target/xtask/.
#
# Runner routing: large diffs (27-PR merge trains, 487-file syncs) OOM on the
# GitHub-hosted ubuntu-24.04 runner (~7 GB). This workflow mirrors the routing
# pattern from em-ci-routed-rust.yml: prefer CX53 (28 GB, 14 cores), fall back
# to CX43 (16 GB, 8 cores), and use GitHub-hosted only for fork PRs or when no
# self-hosted runner is idle.  Evidence: runs 27069450554, 27053186621 (x2),
# killed at 2 m 21 s with exit 143 (SIGTERM / OOM eviction).
#
# The required-check name "ripr+ New Gap Gate" is owned by the result
# aggregator job at the bottom of this file, matching the branch-protection
# entry in .ci/policies/required-checks.toml.
#
# merge_group added in #1232: required for GitHub merge queue.
# In merge_group context:
#   - github.base_ref is absent; BASE_REF resolves via
#     github.event.merge_group.base_ref (the queue target branch).
#   - PR_LABELS is empty (no pull_request event); ripr runs without label routing.
#   - IS_FORK_PR is false — merge queue only admits trusted same-repo SHAs.
#   - ripr diff analysis uses origin/<base_ref>..HEAD; the merge-test commit HEAD
#     is the squash of PR + base, so the diff is semantically equivalent to PR diff.
#   - pull_request runs also record github.event.pull_request.head.sha as
#     PR_HEAD_SHA, separately from the evaluated merge ref. merge_group runs leave
#     PR_HEAD_SHA empty because a queue ref may contain multiple PRs.
#
# RUNNER-SHUTDOWN-CANCELLATION resilience (#6807, #12563, umbrella escalation
# https://github.com/EffortlessMetrics/perl-lsp-swarm/issues/11869#issuecomment-5421241568):
# GitHub-hosted runners are intermittently evicted mid-analysis ("The runner
# has received a shutdown signal", exit 143) with zero test failures in the
# killed logs. The hosted lane therefore retries CANCELLATION-CLASS outcomes
# only: a retry job chains after its predecessor exactly when the predecessor
# concluded 'cancelled' AND did not trip the lane's self-enforced
# TIMEOUT-BUDGET. At most two retries (three attempts total, escalating 120s /
# 180s backoff); a third consecutive cancellation fails the gate while naming
# the RUNNER-SHUTDOWN-CANCELLATION incident class explicitly.
#
# Why timeouts can never enter the retry class: needs.<job>.result exposes no
# timed_out value (docs list only success/failure/cancelled/skipped), so a
# platform timeout could surface as 'cancelled'. Each hosted attempt therefore
# enforces its own 2400s TIMEOUT-BUDGET strictly below the 45m platform
# timeout via GNU timeout wrappers and records a deadline marker; exhaustion
# becomes an explicit non-retried failure. Any 'cancelled' conclusion thus
# predates both budgets and means runner shutdown / external cancellation,
# never timeout-as-cover. Semantic failures (test failures, red gap
# attribution, lint findings) conclude as 'failure' and stop the chain
# immediately with zero retries — a red verdict can never become green by
# retrying. Every retry is visible: attempt counters in job names, step logs,
# ::warning:: annotations, artifact-name rerun identity, and the aggregator
# summary lines.
#
# Known residual: only the cargo xtask analysis commands are budget-guarded;
# a catastrophic hang in pre-analysis steps (checkout/cache/install) can still
# reach the 45m platform timer and be retried. That residual covers a hung
# runner environment (infra recovery), never an analysis that exceeded its
# own measured budget.

name: ripr

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # #12563: seed the ripr rust caches from a main-ref run so hosted PR runs
  # restore warm artifacts instead of cold-building into the runner-eviction
  # window. Pull_request runs stay restore-only (docs/ci/cache-policy.md):
  # PR-created caches are scoped to the PR merge ref and cannot warm other
  # PRs, they only burn the 10 GB quota.
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch: {}

concurrency:
  group: ripr-${{ github.event.pull_request.number || github.ref }}
  # RIPR is evidence production, not a disposable fast-feedback check. A
  # newer PR head must queue behind an active analysis instead of terminating
  # it and turning an infrastructure cancellation into a false red required
  # check. The latest completed head remains authoritative for its own SHA.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # 1. Router -- picks the target runner for this PR run.
  # -------------------------------------------------------------------------
  route-ripr:
    name: Route ripr runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event.pull_request.draft != true || github.event_name != 'pull_request') &&
      github.event_name != 'schedule'
    outputs:
      target: ${{ steps.route.outputs.target }}
      reason: ${{ steps.route.outputs.reason }}
      fallback_allowed: ${{ steps.route.outputs.fallback_allowed }}
    steps:
      - name: Decide target runner
        id: route
        env:
          GH_TOKEN: ${{ secrets.EM_RUNNER_READ_TOKEN }}
          ORG: EffortlessMetrics
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PR_AUTHOR_LOGIN: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login || '' }}
          PR_AUTHOR_TYPE: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.type || '' }}
        shell: bash
        run: |
          set -euo pipefail

          emit() {
            local target="$1" reason="$2" fallback_allowed="$3"
            echo "router_target=$target"
            echo "router_reason=$reason"
            echo "router_fallback_allowed=$fallback_allowed"
            {
              echo "target=$target"
              echo "reason=$reason"
              echo "fallback_allowed=$fallback_allowed"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### ripr Runner Route"
              echo ""
              echo "- router_target: \`$target\`"
              echo "- router_reason: \`$reason\`"
              echo "- router_fallback_allowed: \`$fallback_allowed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Fork PRs cannot access self-hosted runners -- GitHub blocks secrets.
          if [ "$IS_FORK_PR" = "true" ]; then
            emit "github" "fork_pr" "true"
            exit 0
          fi

          # Bot PRs (Dependabot, etc.) run on GitHub-hosted to avoid tying up
          # self-hosted capacity.
          pr_author_login_lc="$(printf '%s' "${PR_AUTHOR_LOGIN:-}" | tr '[:upper:]' '[:lower:]')"
          pr_author_type_lc="$(printf '%s' "${PR_AUTHOR_TYPE:-}" | tr '[:upper:]' '[:lower:]')"
          is_bot_pr="false"
          case "$pr_author_login_lc" in
            dependabot*|app/*|*\[bot\]) is_bot_pr="true" ;;
          esac
          if [ "$pr_author_type_lc" = "bot" ]; then is_bot_pr="true"; fi
          if [ "$is_bot_pr" = "true" ]; then
            emit "github" "bot_pr_github_hosted" "true"
            exit 0
          fi

          # No runner token -- cannot query availability; fall back safely.
          if [ -z "${GH_TOKEN:-}" ]; then
            emit "github" "runner_token_missing" "true"
            exit 0
          fi

          response="$(mktemp)"
          status="$(curl -sS -w '%{http_code}' -o "$response" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/$ORG/actions/runners?per_page=100" || true)"

          if [ "$status" != "200" ]; then
            echo "::warning::runner API returned HTTP $status; falling back to GitHub-hosted"
            emit "github" "runner_api_failed" "true"
            exit 0
          fi

          idle_runner_count() {
            local runner_label="$1"
            jq --arg runner_label "$runner_label" '
              [ .runners[]?
                | select(.status == "online")
                | select(.busy == false)
                | ([.labels[].name | ascii_downcase] // []) as $have
                | select(
                    ($have | index("em-ci")) and
                    ($have | index($runner_label)) and
                    ($have | index("rust-small")) and
                    ($have | index("trusted-pr"))
                  )
              ] | length
            ' "$response"
          }

          idle_cx53="$(idle_runner_count "cx53")"
          idle_cx43="$(idle_runner_count "cx43")"

          echo "idle_cx53=${idle_cx53:-0}"
          echo "idle_cx43=${idle_cx43:-0}"

          # TEMPORARY: CX43 is demoted from routing. The CX43 host has lost its
          # preloaded em-ci-rust:1.95 Docker image (a local-only image, not in any
          # registry), so every CX43 job fails preflight in ~11-14s with
          # "Unable to find image 'em-ci-rust:1.95' locally / pull access denied".
          # The GitHub-hosted disk-full fallback then rescues the required
          # "ripr+ New Gap Gate" aggregate, but this (a) shows a misleading red
          # "ripr+ on CX43" check on every PR and (b) wastes a doomed CX43 start plus
          # a full ~20 min GH-hosted ripr re-run. Evidence: PR #3321 job 85060946907.
          # Route straight to CX53 (or GH-hosted when CX53 is busy) until ops restores
          # the CX43 image. Revert: restore the `elif ... emit cx43` branch (preserved
          # below) once the required Docker image is available on CX43.
          if [ "${idle_cx53:-0}" -gt 0 ]; then
            emit "cx53" "cx53_idle" "false"
          else
            # No self-hosted runner idle (CX43 demoted) -- fall back to GitHub-hosted.
            # ripr analysis on large diffs may OOM, but small/medium PRs pass.
            emit "github" "no_idle_runner" "true"
          fi

          # --- BEGIN temporarily dead code (restore to re-enable CX43) ---
          # elif [ "${idle_cx43:-0}" -gt 0 ]; then
          #   emit "cx43" "cx43_idle" "false"
          # --- END temporarily dead code ---

  # -------------------------------------------------------------------------
  # 2a. ripr on CX53 (28 GB, 14 cores) -- preferred self-hosted lane.
  #
  # All cargo/ripr commands run inside the em-ci-rust:1.95 Docker image,
  # matching em-ci-routed-rust.yml exactly. The host runner does not have
  # the Rust toolchain on PATH -- it is only available inside the container.
  # ripr is installed into /cargo-home/bin (= /mnt/ci-cache/cargo-home/bin
  # on the host) so subsequent runs skip the install if the version matches.
  # -------------------------------------------------------------------------
  ripr-cx53:
    name: ripr+ on CX53
    needs: route-ripr
    if: >-
      needs.route-ripr.result == 'success' &&
      needs.route-ripr.outputs.target == 'cx53'
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx53, rust-small, trusted-pr]
    timeout-minutes: 60
    outputs:
      preflight_ok: ${{ steps.preflight.outputs.preflight_ok }}
    env:
      RIPR_VERSION: "0.9.0"
      BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || github.event.repository.default_branch }}
      PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
      CARGO_HOME: /mnt/ci-cache/cargo-home
      SCCACHE_DIR: /mnt/ci-cache/sccache
      SCCACHE_CACHE_SIZE: 60G
      CARGO_BUILD_JOBS: "12"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /mnt/ci-scratch/perl-lsp-swarm/ripr-${{ github.run_id }}-${{ github.run_attempt }}
      TMPDIR: /mnt/ci-scratch/tmp/ripr-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Fix workspace ownership (pre-checkout)
        shell: bash
        run: |
          # Docker writes workspace files as root. If a previous run left root-owned
          # files behind (e.g. cleanup step missed), actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.0 fails with
          # EACCES when it tries to 'git clean'. Use Docker (running as root) to chown
          # back and then delete the stale workspace target/ so it cannot cause
          # `mkdir target` failures on the next run. Fall back to a host-side rm -rf
          # in case the Docker image is unavailable.
          # Safe on CI: CARGO_TARGET_DIR is set to /mnt/ci-scratch/... so the real
          # build artifacts are NOT in workspace/target/. Only xtask/ripr JSON
          # receipts accumulate there and they must not persist between runs.
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            em-ci-rust:1.95 \
            bash -c "chown -R $(id -u):$(id -g) /workspace/target 2>/dev/null || true; rm -rf /workspace/target 2>/dev/null || true" || true
          # Belt-and-suspenders: host-side rm in case Docker was unavailable above.
          rm -rf "$GITHUB_WORKSPACE/target" || true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Preflight disk
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          # ── Orphan reaper (primary disk hygiene) ─────────────────────────────
          # Invariant: an idle runner is a disk-clean runner.  Killed, OOM-evicted,
          # and timed-out ripr runs leave orphaned ripr-* scratch dirs behind.
          # Reap at >2 h (120 min) — past the 60 min CX53 ripr timeout — rather
          # than the previous 24 h that let disk fill between maintenance cycles.
          find /mnt/ci-scratch -maxdepth 1 -name 'ripr-*' -mmin +120 -exec rm -rf {} + 2>/dev/null || true
          # ── sccache size cap ──────────────────────────────────────────────────
          if [ -d "$SCCACHE_DIR" ]; then
            sccache_gb=$(du -sm "$SCCACHE_DIR" 2>/dev/null | awk '{print int($1/1024)}' || echo 0)
            if [ "${sccache_gb:-0}" -gt 70 ]; then
              echo "::warning::sccache is ${sccache_gb} GB (>70 GB cap); purging"
              rm -rf "${SCCACHE_DIR:?}"/* 2>/dev/null || true
            fi
          fi
          # ── Docker dangling resource prune ────────────────────────────────────
          docker image prune -f --filter "until=2h" 2>/dev/null || true
          docker container prune -f --filter "until=2h" 2>/dev/null || true
          docker volume prune -f 2>/dev/null || true
          disk_ok=true
          # ── Required Docker image guard ───────────────────────────────────────
          # If the self-hosted runner lost the preloaded Rust image, this lane
          # cannot run ripr. Mark preflight failed so the GitHub-hosted fallback
          # runs instead of surfacing as a false new-gap failure.
          if ! docker image inspect em-ci-rust:1.95 >/dev/null 2>&1; then
            echo "::error::Required Docker image em-ci-rust:1.95 is missing on CX53. Failover job will run on GitHub-hosted."
            disk_ok=false
          fi
          # ── Disk guard ────────────────────────────────────────────────────────
          # ripr needs at most an xtask debug build (~5-8 GB) plus small JSON
          # analysis artifacts (<1 GB).  20 GB gives 2-3x headroom on CX53.
          # If the guard still fails, set preflight_ok=false and let the
          # ripr-fallback job run on GitHub-hosted.
          ci-disk-guard /mnt/ci-scratch 20 || disk_ok=false
          ci-disk-guard /mnt/ci-cache 20 || disk_ok=false
          df -h /mnt/ci-scratch /mnt/ci-cache || true
          echo "preflight_ok=${disk_ok}" >> "$GITHUB_OUTPUT"
          if [ "$disk_ok" = "false" ]; then
            echo "::error::Self-hosted preflight failed on CX53 after cleanup. Failover job will run on GitHub-hosted."
            exit 1
          fi
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$SCCACHE_DIR"

      - name: Run ripr evidence and gate (Docker)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --cpus="14" \
            --memory="28g" \
            -e RIPR_VERSION="$RIPR_VERSION" \
            -e BASE_REF="$BASE_REF" \
            -e PR_HEAD_SHA="$PR_HEAD_SHA" \
            -e PR_LABELS="$PR_LABELS" \
            -e CARGO_HOME=/cargo-home \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE="$SCCACHE_CACHE_SIZE" \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e CARGO_INCREMENTAL="$CARGO_INCREMENTAL" \
            -e CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" \
            -e CARGO_TARGET_DIR=/target \
            -e RUST_BACKTRACE=1 \
            -e CARGO_TERM_COLOR=always \
            -e TMPDIR=/tmp/jobtmp \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$CARGO_HOME:/cargo-home" \
            -v "$SCCACHE_DIR:/sccache" \
            -v "$CARGO_TARGET_DIR:/target" \
            -v "$TMPDIR:/tmp/jobtmp" \
            -w /workspace \
            em-ci-rust:1.95 \
            bash -eu -o pipefail -c '
              # The workspace is checked out by the host runner user; the container
              # runs as a different UID. Mark it safe so git commands work.
              git config --global --add safe.directory /workspace

              # merge_group.base_ref is a full ref ("refs/heads/main"); strip prefix
              # so git diff/fetch use just the branch name (e.g. "main").
              BASE_REF="${BASE_REF#refs/heads/}"

              rustc --version
              cargo --version
              sccache --version || true

              # Install ripr into the cached cargo-home so subsequent runs skip this.
              cargo install ripr --version "$RIPR_VERSION" --locked

              /cargo-home/bin/ripr doctor

              # Generation phase: keep going on individual failures so we can
              # still upload whatever artifacts were produced.
              cargo xtask ripr-pr --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" || RIPR_FAILED=1
              cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json || RIPR_FAILED=1
              cargo xtask ripr-review-comments --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --timeout-seconds 210 || RIPR_FAILED=1
              cargo xtask impacted-evidence --labels-csv "$PR_LABELS" || RIPR_FAILED=1
              cargo xtask ripr-pr-summary || RIPR_FAILED=1
              cargo xtask ripr-annotations || RIPR_FAILED=1

              # Validation phase.
              cargo xtask ripr-pr --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --check
              cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json --check
              cargo xtask ripr-review-comments --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --check
              cargo xtask impacted-evidence --labels-csv "$PR_LABELS" --check
              cargo xtask ripr-pr-summary --check
              cargo xtask ripr-annotations --check

              # Quality gate.
              cargo xtask quality-gate \
                --mode enforce-new-ripr \
                --ripr-receipt target/receipts/quality/ripr-plus.json \
                --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
                --review-receipt target/ripr/review/comments.json \
                --ripr-base "origin/$BASE_REF" \
                --ripr-head HEAD \
                --receipt target/receipts/quality/quality-gate-ripr.json \
                --summary target/receipts/quality/quality-gate-ripr.md
              cargo xtask quality-gate \
                --mode enforce-new-ripr \
                --ripr-receipt target/receipts/quality/ripr-plus.json \
                --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
                --review-receipt target/ripr/review/comments.json \
                --ripr-base "origin/$BASE_REF" \
                --ripr-head HEAD \
                --receipt target/receipts/quality/quality-gate-ripr.json \
                --summary target/receipts/quality/quality-gate-ripr.md \
                --check

              sccache --show-stats || true

              # Propagate any generation-phase failure after all steps ran.
              if [ "${RIPR_FAILED:-0}" = "1" ]; then exit 1; fi
            '

      - name: Append PR evidence summary
        if: always()
        shell: bash
        run: |
          if [ -f target/ripr/pr/summary.md ]; then
            cat target/ripr/pr/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR PR evidence summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/receipts/quality/quality-gate-ripr.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat target/receipts/quality/quality-gate-ripr.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR quality-gate summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/ripr/review/annotations.txt ]; then
            cat target/ripr/review/annotations.txt
          fi

      - name: Upload ripr PR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: ripr-pr-evidence
          path: |
            target/ripr/pr/**
            target/ripr/review/**
            target/xtask/impacted-evidence/**
            target/receipts/quality/ripr-plus.json
            target/receipts/quality/quality-gate-ripr.json
            target/receipts/quality/quality-gate-ripr.md
          retention-days: 14
          if-no-files-found: error

      - name: Cleanup scratch
        if: always()
        shell: bash
        run: |
          set +e
          # Fix ownership of workspace target/ dirs written by root inside Docker.
          # Without this the next run's checkout action cannot clean them (EACCES).
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            em-ci-rust:1.95 \
            bash -c "chown -R $(id -u):$(id -g) /workspace/target/ripr /workspace/target/xtask /workspace/target/receipts 2>/dev/null || true" || true
          # Clean the scratch dirs (Docker-owned files removed by Docker).
          docker run --rm \
            -v "$TMPDIR:/tmpdir" \
            -v "$CARGO_TARGET_DIR:/target" \
            em-ci-rust:1.95 \
            bash -c 'find /tmpdir /target -mindepth 1 -delete 2>/dev/null || true' || true
          rmdir "$TMPDIR" "$CARGO_TARGET_DIR" 2>/dev/null || true
          df -h /mnt/ci-scratch /mnt/ci-cache || true

  # -------------------------------------------------------------------------
  # 2b. ripr on CX43 (16 GB, 8 cores) -- secondary self-hosted lane.
  #
  # Same Docker pattern as CX53; --cpus/--memory adjusted for CX43 hardware.
  # -------------------------------------------------------------------------
  ripr-cx43:
    name: ripr+ on CX43
    needs: route-ripr
    if: >-
      needs.route-ripr.result == 'success' &&
      needs.route-ripr.outputs.target == 'cx43'
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-small, trusted-pr]
    timeout-minutes: 75
    outputs:
      preflight_ok: ${{ steps.preflight.outputs.preflight_ok }}
    env:
      RIPR_VERSION: "0.9.0"
      BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || github.event.repository.default_branch }}
      PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
      CARGO_HOME: /mnt/ci-cache/cargo-home
      SCCACHE_DIR: /mnt/ci-cache/sccache
      SCCACHE_CACHE_SIZE: 30G
      CARGO_BUILD_JOBS: "8"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /mnt/ci-scratch/perl-lsp-swarm/ripr-${{ github.run_id }}-${{ github.run_attempt }}
      TMPDIR: /mnt/ci-scratch/tmp/ripr-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Fix workspace ownership (pre-checkout)
        shell: bash
        run: |
          # Docker writes workspace files as root. If a previous run left root-owned
          # files behind (e.g. cleanup step missed), actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.0 fails with
          # EACCES when it tries to 'git clean'. Use Docker (running as root) to chown
          # back and then delete the stale workspace target/ so it cannot cause
          # `mkdir target` failures on the next run. Fall back to a host-side rm -rf
          # in case the Docker image is unavailable.
          # Safe on CI: CARGO_TARGET_DIR is set to /mnt/ci-scratch/... so the real
          # build artifacts are NOT in workspace/target/. Only xtask/ripr JSON
          # receipts accumulate there and they must not persist between runs.
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            em-ci-rust:1.95 \
            bash -c "chown -R $(id -u):$(id -g) /workspace/target 2>/dev/null || true; rm -rf /workspace/target 2>/dev/null || true" || true
          # Belt-and-suspenders: host-side rm in case Docker was unavailable above.
          rm -rf "$GITHUB_WORKSPACE/target" || true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Preflight disk
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          # ── Orphan reaper (primary disk hygiene) ─────────────────────────────
          # Invariant: an idle runner is a disk-clean runner.  Killed, OOM-evicted,
          # and timed-out ripr runs leave orphaned ripr-* scratch dirs behind.
          # Reap at >2 h (120 min) — past the 75 min CX43 ripr timeout — rather
          # than the previous 24 h that let disk fill between maintenance cycles.
          find /mnt/ci-scratch -maxdepth 1 -name 'ripr-*' -mmin +120 -exec rm -rf {} + 2>/dev/null || true
          # ── sccache size cap ──────────────────────────────────────────────────
          # CX43 has a smaller volume. Hard-cap sccache at 35 GB.
          if [ -d "$SCCACHE_DIR" ]; then
            sccache_gb=$(du -sm "$SCCACHE_DIR" 2>/dev/null | awk '{print int($1/1024)}' || echo 0)
            if [ "${sccache_gb:-0}" -gt 35 ]; then
              echo "::warning::sccache is ${sccache_gb} GB (>35 GB cap); purging"
              rm -rf "${SCCACHE_DIR:?}"/* 2>/dev/null || true
            fi
          fi
          # ── Docker dangling resource prune ────────────────────────────────────
          docker image prune -f --filter "until=2h" 2>/dev/null || true
          docker container prune -f --filter "until=2h" 2>/dev/null || true
          docker volume prune -f 2>/dev/null || true
          disk_ok=true
          # ── Required Docker image guard ───────────────────────────────────────
          # If the self-hosted runner lost the preloaded Rust image, this lane
          # cannot run ripr. Mark preflight failed so the GitHub-hosted fallback
          # runs instead of surfacing as a false new-gap failure.
          if ! docker image inspect em-ci-rust:1.95 >/dev/null 2>&1; then
            echo "::error::Required Docker image em-ci-rust:1.95 is missing on CX43. Failover job will run on GitHub-hosted."
            disk_ok=false
          fi
          # ── Disk guard ────────────────────────────────────────────────────────
          # ripr needs at most an xtask debug build (~5-8 GB) plus small JSON
          # analysis artifacts (<1 GB).  20 GB gives 2-3x headroom without
          # requiring the full 80 GB reserved for the complete Rust CI build.
          # CX43 had 32 GB free when the 80 GB guard fired (run 27074596917) --
          # 32 GB > 20 GB, so this guard will pass on a reasonably maintained host.
          # If the guard still fails, set preflight_ok=false and let the
          # ripr-fallback job run on GitHub-hosted.
          ci-disk-guard /mnt/ci-scratch 20 || disk_ok=false
          ci-disk-guard /mnt/ci-cache 15 || disk_ok=false
          df -h /mnt/ci-scratch /mnt/ci-cache || true
          echo "preflight_ok=${disk_ok}" >> "$GITHUB_OUTPUT"
          if [ "$disk_ok" = "false" ]; then
            echo "::error::Self-hosted preflight failed on CX43 after cleanup. Failover job will run on GitHub-hosted."
            exit 1
          fi
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$SCCACHE_DIR"

      - name: Run ripr evidence and gate (Docker)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --cpus="8" \
            --memory="16g" \
            -e RIPR_VERSION="$RIPR_VERSION" \
            -e BASE_REF="$BASE_REF" \
            -e PR_HEAD_SHA="$PR_HEAD_SHA" \
            -e PR_LABELS="$PR_LABELS" \
            -e CARGO_HOME=/cargo-home \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE="$SCCACHE_CACHE_SIZE" \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e CARGO_INCREMENTAL="$CARGO_INCREMENTAL" \
            -e CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" \
            -e CARGO_TARGET_DIR=/target \
            -e RUST_BACKTRACE=1 \
            -e CARGO_TERM_COLOR=always \
            -e TMPDIR=/tmp/jobtmp \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$CARGO_HOME:/cargo-home" \
            -v "$SCCACHE_DIR:/sccache" \
            -v "$CARGO_TARGET_DIR:/target" \
            -v "$TMPDIR:/tmp/jobtmp" \
            -w /workspace \
            em-ci-rust:1.95 \
            bash -eu -o pipefail -c '
              # The workspace is checked out by the host runner user; the container
              # runs as a different UID. Mark it safe so git commands work.
              git config --global --add safe.directory /workspace

              # merge_group.base_ref is a full ref ("refs/heads/main"); strip prefix
              # so git diff/fetch use just the branch name (e.g. "main").
              BASE_REF="${BASE_REF#refs/heads/}"

              rustc --version
              cargo --version
              sccache --version || true

              # Install ripr into the cached cargo-home so subsequent runs skip this.
              cargo install ripr --version "$RIPR_VERSION" --locked

              /cargo-home/bin/ripr doctor

              # Generation phase: keep going on individual failures so we can
              # still upload whatever artifacts were produced.
              cargo xtask ripr-pr --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" || RIPR_FAILED=1
              cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json || RIPR_FAILED=1
              cargo xtask ripr-review-comments --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --timeout-seconds 210 || RIPR_FAILED=1
              cargo xtask impacted-evidence --labels-csv "$PR_LABELS" || RIPR_FAILED=1
              cargo xtask ripr-pr-summary || RIPR_FAILED=1
              cargo xtask ripr-annotations || RIPR_FAILED=1

              # Validation phase.
              cargo xtask ripr-pr --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --check
              cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json --check
              cargo xtask ripr-review-comments --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --check
              cargo xtask impacted-evidence --labels-csv "$PR_LABELS" --check
              cargo xtask ripr-pr-summary --check
              cargo xtask ripr-annotations --check

              # Quality gate.
              cargo xtask quality-gate \
                --mode enforce-new-ripr \
                --ripr-receipt target/receipts/quality/ripr-plus.json \
                --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
                --review-receipt target/ripr/review/comments.json \
                --ripr-base "origin/$BASE_REF" \
                --ripr-head HEAD \
                --receipt target/receipts/quality/quality-gate-ripr.json \
                --summary target/receipts/quality/quality-gate-ripr.md
              cargo xtask quality-gate \
                --mode enforce-new-ripr \
                --ripr-receipt target/receipts/quality/ripr-plus.json \
                --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
                --review-receipt target/ripr/review/comments.json \
                --ripr-base "origin/$BASE_REF" \
                --ripr-head HEAD \
                --receipt target/receipts/quality/quality-gate-ripr.json \
                --summary target/receipts/quality/quality-gate-ripr.md \
                --check

              sccache --show-stats || true

              # Propagate any generation-phase failure after all steps ran.
              if [ "${RIPR_FAILED:-0}" = "1" ]; then exit 1; fi
            '

      - name: Append PR evidence summary
        if: always()
        shell: bash
        run: |
          if [ -f target/ripr/pr/summary.md ]; then
            cat target/ripr/pr/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR PR evidence summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/receipts/quality/quality-gate-ripr.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat target/receipts/quality/quality-gate-ripr.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR quality-gate summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/ripr/review/annotations.txt ]; then
            cat target/ripr/review/annotations.txt
          fi

      - name: Upload ripr PR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: ripr-pr-evidence
          path: |
            target/ripr/pr/**
            target/ripr/review/**
            target/xtask/impacted-evidence/**
            target/receipts/quality/ripr-plus.json
            target/receipts/quality/quality-gate-ripr.json
            target/receipts/quality/quality-gate-ripr.md
          retention-days: 14
          if-no-files-found: error

      - name: Cleanup scratch
        if: always()
        shell: bash
        run: |
          set +e
          # Fix ownership of workspace target/ dirs written by root inside Docker.
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            em-ci-rust:1.95 \
            bash -c "chown -R $(id -u):$(id -g) /workspace/target/ripr /workspace/target/xtask /workspace/target/receipts 2>/dev/null || true" || true
          # Clean the scratch dirs (Docker-owned files removed by Docker).
          docker run --rm \
            -v "$TMPDIR:/tmpdir" \
            -v "$CARGO_TARGET_DIR:/target" \
            em-ci-rust:1.95 \
            bash -c 'find /tmpdir /target -mindepth 1 -delete 2>/dev/null || true' || true
          rmdir "$TMPDIR" "$CARGO_TARGET_DIR" 2>/dev/null || true
          df -h /mnt/ci-scratch /mnt/ci-cache || true

  # -------------------------------------------------------------------------
  # 2c. ripr on GitHub-hosted -- fork PRs, bots, and no-idle-runner fallback.
  # -------------------------------------------------------------------------
  ripr-github:
    name: ripr+ on GitHub Hosted
    needs: route-ripr
    if: >-
      needs.route-ripr.result == 'success' &&
      needs.route-ripr.outputs.target == 'github' &&
      needs.route-ripr.outputs.fallback_allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      lane_started: ${{ steps.lane_start.outputs.lane_started }}
      deadline_exceeded: ${{ steps.classify.outputs.deadline_exceeded }}
    env:
      RIPR_VERSION: "0.9.0"
      BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || github.event.repository.default_branch }}
      PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
    steps:
      - name: Mark hosted lane start
        id: lane_start
        shell: bash
        env:
          RIPR_ATTEMPT: "1"
        run: |
          set -euo pipefail
          # RUNNER-SHUTDOWN-CANCELLATION resilience (#6807). Record when this
          # attempt started, derive its self-enforced TIMEOUT-BUDGET deadline
          # (2400s from lane start, strictly below the 45m platform timeout so
          # a genuine timeout can never surface as an ambiguous 'cancelled'),
          # and install the lane_run guard used by the analysis steps below.
          echo "lane_started=true" >> "$GITHUB_OUTPUT"
          echo "::notice::ripr+ hosted lane attempt ${RIPR_ATTEMPT}/3 starting (RUNNER-SHUTDOWN-CANCELLATION resilience active, #6807)"
          lane_start_epoch="$(date +%s)"
          echo "LANE_START_EPOCH=${lane_start_epoch}" >> "$GITHUB_ENV"
          echo "RIPR_LANE_DEADLINE_EPOCH=$((lane_start_epoch + 2400))" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ripr-hosted-lane"
          cat > "$RUNNER_TEMP/ripr-hosted-lane/deadline.sh" <<'RIPR_DEADLINE_EOF'
          # TIMEOUT-BUDGET discriminator (#6807): run a command under GNU
          # timeout with whatever remains of this attempt's self-enforced
          # budget. Exit classes:
          #   0     command succeeded
          #   124   our budget expired -> deadline marker + rc 90 (never retried)
          #   other passed through untouched (semantic failure or external signal;
          #         runner shutdown lands here as process death, job conclusion
          #         stays 'cancelled', and the retry chain consumes it)
          lane_run() {
            local label="$1"
            shift
            local now remaining rc
            if [ -z "${RIPR_LANE_DEADLINE_EPOCH:-}" ]; then
              echo "::error::[TIMEOUT-BUDGET] ${label}: RIPR_LANE_DEADLINE_EPOCH is unset; refusing to run unguarded"
              return 90
            fi
            now="$(date +%s)"
            remaining=$((RIPR_LANE_DEADLINE_EPOCH - now))
            if [ "$remaining" -le 60 ]; then
              echo "::error::[TIMEOUT-BUDGET] ${label}: hosted-lane budget exhausted before start (${remaining}s left of 2400s); classified TIMEOUT-BUDGET, NOT runner-shutdown-cancellation; not retried"
              : > "$RUNNER_TEMP/ripr-hosted-deadline-exceeded"
              return 90
            fi
            echo "[deadline] ${label}: ${remaining}s of the 2400s hosted-lane budget remain"
            set +e
            timeout --kill-after=30s "${remaining}s" "$@"
            rc=$?
            set -e
            if [ "$rc" -eq 124 ]; then
              echo "::error::[TIMEOUT-BUDGET] ${label}: exceeded the self-enforced 2400s hosted-lane budget; classified TIMEOUT-BUDGET, NOT runner-shutdown-cancellation; not retried"
              : > "$RUNNER_TEMP/ripr-hosted-deadline-exceeded"
              return 90
            fi
            return "$rc"
          }
          RIPR_DEADLINE_EOF

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Toolchain (rust-toolchain.toml pins 1.95.0)
        run: rustc --version

      - name: Normalize base ref
        shell: bash
        run: |
          # merge_group.base_ref is a full ref ("refs/heads/main"); strip prefix
          # so subsequent steps that use $BASE_REF pass just the branch name.
          stripped="${BASE_REF#refs/heads/}"
          echo "BASE_REF=$stripped" >> "$GITHUB_ENV"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ripr-${{ env.RIPR_VERSION }}-${{ hashFiles('Cargo.lock') }}
          # #12563: the old main-only save-if could never fire in this
          # workflow, so every hosted run cold-built ~6.5m into the
          # runner-eviction window. PR runs must stay restore-only
          # (docs/ci/cache-policy.md): PR-created caches are scoped to the PR
          # merge ref, cannot warm other PRs, and burn the 10 GB quota. Saves
          # come from the scheduled main-ref seed job (and a manual main-ref
          # dispatch) instead.
          save-if: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Install ripr
        run: cargo install ripr --version "$RIPR_VERSION" --locked

      - name: Run ripr doctor
        run: ripr doctor

      # Every cargo xtask analysis invocation below runs under the lane_run
      # guard so budget exhaustion becomes an explicit TIMEOUT-BUDGET failure
      # instead of drifting into the platform timeout's ambiguous conclusion.
      - name: Generate PR evidence
        shell: bash
        run: |
          source "$RUNNER_TEMP/ripr-hosted-lane/deadline.sh"
          lane_run "Generate PR evidence" cargo xtask ripr-pr --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA"

      - name: Generate repo-wide RIPR+ baseline receipt
        if: always()
        shell: bash
        run: |
          source "$RUNNER_TEMP/ripr-hosted-lane/deadline.sh"
          lane_run "Generate repo-wide baseline receipt" cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json

      - name: Generate review guidance
        if: always()
        shell: bash
        run: |
          source "$RUNNER_TEMP/ripr-hosted-lane/deadline.sh"
          lane_run "Generate review guidance" cargo xtask ripr-review-comments --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --timeout-seconds 600

      - name: Generate impacted evidence
        if: always()
        shell: bash
        run: |
          source "$RUNNER_TEMP/ripr-hosted-lane/deadline.sh"
          lane_run "Generate impacted evidence" cargo xtask impacted-evidence --labels-csv "$PR_LABELS"

      - name: Generate PR evidence summary
        if: always()
        shell: bash
        run: |
          source "$RUNNER_TEMP/ripr-hosted-lane/deadline.sh"
          lane_run "Generate PR evidence summary" cargo xtask ripr-pr-summary

      - name: Generate warning annotations
        if: always()
        shell: bash
        run: |
          source "$RUNNER_TEMP/ripr-hosted-lane/deadline.sh"
          lane_run "Generate warning annotations" cargo xtask ripr-annotations

      - name: Validate PR evidence contracts
        if: always()
        shell: bash
        run: |
          source "$RUNNER_TEMP/ripr-hosted-lane/deadline.sh"
          lane_run "Validate ripr-pr contract" cargo xtask ripr-pr --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --check
          lane_run "Validate ripr-plus contract" cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json --check
          lane_run "Validate review-comments contract" cargo xtask ripr-review-comments --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --check
          lane_run "Validate impacted-evidence contract" cargo xtask impacted-evidence --labels-csv "$PR_LABELS" --check
          lane_run "Validate pr-summary contract" cargo xtask ripr-pr-summary --check
          lane_run "Validate annotations contract" cargo xtask ripr-annotations --check

      - name: Enforce new RIPR gap quality gate
        if: always()
        shell: bash
        run: |
          source "$RUNNER_TEMP/ripr-hosted-lane/deadline.sh"
          lane_run "Evaluate quality gate" \
            cargo xtask quality-gate \
            --mode enforce-new-ripr \
            --ripr-receipt target/receipts/quality/ripr-plus.json \
            --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
            --review-receipt target/ripr/review/comments.json \
            --ripr-base "origin/$BASE_REF" \
            --ripr-head HEAD \
            --receipt target/receipts/quality/quality-gate-ripr.json \
            --summary target/receipts/quality/quality-gate-ripr.md
          lane_run "Re-check quality gate receipt" \
            cargo xtask quality-gate \
            --mode enforce-new-ripr \
            --ripr-receipt target/receipts/quality/ripr-plus.json \
            --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
            --review-receipt target/ripr/review/comments.json \
            --ripr-base "origin/$BASE_REF" \
            --ripr-head HEAD \
            --receipt target/receipts/quality/quality-gate-ripr.json \
            --summary target/receipts/quality/quality-gate-ripr.md \
            --check

      - name: Append PR evidence summary
        if: always()
        shell: bash
        run: |
          if [ -f target/ripr/pr/summary.md ]; then
            cat target/ripr/pr/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR PR evidence summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/receipts/quality/quality-gate-ripr.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat target/receipts/quality/quality-gate-ripr.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR quality-gate summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/ripr/review/annotations.txt ]; then
            cat target/ripr/review/annotations.txt
          fi

      - name: Upload ripr PR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: ripr-pr-evidence
          path: |
            target/ripr/pr/**
            target/ripr/review/**
            target/xtask/impacted-evidence/**
            target/receipts/quality/ripr-plus.json
            target/receipts/quality/quality-gate-ripr.json
            target/receipts/quality/quality-gate-ripr.md
          retention-days: 14
          if-no-files-found: error

      - name: Classify hosted lane outcome
        id: classify
        if: always()
        shell: bash
        env:
          RIPR_ATTEMPT: "1"
        run: |
          set -euo pipefail
          # Terminal classification for retry gating (#6807). Only a
          # self-enforced TIMEOUT-BUDGET trip sets deadline_exceeded=true;
          # such failures are visible, named, and never retried. Runner
          # shutdowns leave the marker absent and conclude as 'cancelled',
          # which the retry chain consumes.
          if [ -f "$RUNNER_TEMP/ripr-hosted-deadline-exceeded" ]; then
            echo "deadline_exceeded=true" >> "$GITHUB_OUTPUT"
            {
              echo "### ripr+ hosted lane outcome (attempt ${RIPR_ATTEMPT}/3)"
              echo ""
              echo "- Outcome: \`TIMEOUT-BUDGET\` — the self-enforced 2400s lane budget was exceeded."
              echo "- This failure is deliberately NOT retried (timeouts never enter the cancellation-retry class)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::ripr+ hosted lane classified TIMEOUT-BUDGET; no retry will be attempted (#6807)."
          else
            echo "deadline_exceeded=false" >> "$GITHUB_OUTPUT"
          fi

  # Retry chain (#6807): each retry chains ONLY on its predecessor's
  # cancellation-class outcome ('cancelled' with no TIMEOUT-BUDGET marker).
  # Semantic failures conclude as 'failure' and stop the chain with zero
  # retries; a third consecutive cancellation is escalated by the aggregator
  # as an exhausted RUNNER-SHUTDOWN-CANCELLATION incident.
  ripr-github-retry-1:
    name: ripr+ on GitHub Hosted (retry 1/2)
    needs:
      - route-ripr
      - ripr-github
    if: >-
      always() &&
      needs.route-ripr.result == 'success' &&
      needs.route-ripr.outputs.target == 'github' &&
      needs.route-ripr.outputs.fallback_allowed == 'true' &&
      needs.ripr-github.result == 'cancelled' &&
      needs.ripr-github.outputs.deadline_exceeded != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      lane_started: ${{ steps.lane_start.outputs.lane_started }}
      deadline_exceeded: ${{ steps.classify.outputs.deadline_exceeded }}
    env:
      RIPR_VERSION: "0.9.0"
      BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || github.event.repository.default_branch }}
      PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
    steps:
      - name: Backoff before hosted retry
        shell: bash
        env:
          RIPR_ATTEMPT: "2"
          RIPR_BACKOFF_SECONDS: "120"
        run: |
          set -euo pipefail
          # Visible retry receipt (#6807): every attempt must be traceable in
          # logs. The backoff also lets a flapping runner pool settle before
          # the next attempt claims capacity.
          echo "::warning::RUNNER-SHUTDOWN-CANCELLATION recovery: prior ripr+ GitHub-hosted attempt ended 'cancelled' with no proof for this SHA (incident class RUNNER-SHUTDOWN-CANCELLATION). Starting attempt ${RIPR_ATTEMPT}/3 after ${RIPR_BACKOFF_SECONDS}s backoff (#6807)."
          sleep "${RIPR_BACKOFF_SECONDS}"

      - name: Mark hosted lane start
        id: lane_start
        shell: bash
        env:
          RIPR_ATTEMPT: "2"
        run: |
          set -euo pipefail
          # RUNNER-SHUTDOWN-CANCELLATION resilience (#6807). Record when this
          # attempt started, derive its self-enforced TIMEOUT-BUDGET deadline
          # (2400s from lane start, strictly below the 45m platform timeout so
          # a genuine timeout can never surface as an ambiguous 'cancelled'),
          # and install the lane_run guard used by the analysis steps below.
          # The backoff step above runs before this clock starts.
          echo "lane_started=true" >> "$GITHUB_OUTPUT"
          echo "::notice::ripr+ hosted lane attempt ${RIPR_ATTEMPT}/3 starting (RUNNER-SHUTDOWN-CANCELLATION resilience active, #6807)"
          lane_start_epoch="$(date +%s)"
          echo "LANE_START_EPOCH=${lane_start_epoch}" >> "$GITHUB_ENV"
          echo "RIPR_LANE_DEADLINE_EPOCH=$((lane_start_epoch + 2400))" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ripr-hosted-lane"
          cat > "$RUNNER_TEMP/ripr-hosted-lane/deadline.sh" <<'RIPR_DEADLINE_EOF'
