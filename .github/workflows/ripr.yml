# ripr - required receipt gate with advisory static sensor output
#
# Badges are repo-scoped public state. This workflow produces diff-scoped PR
# evidence under target/ripr/ and mutation-routing receipts under target/xtask/.
#
# Runner routing (em-ci capability contract, #15889): the workflow targets the
# `rust-standard` capability pool for non-fork, non-bot PRs and falls back to
# GitHub-hosted when no current capacity satisfies that pool. Large diffs
# (27-PR merge trains, 487-file syncs) have historically OOM'd on the
# GitHub-hosted ubuntu-24.04 runner (~7 GB; evidence: runs 27069450554,
# 27053186621 (x2), killed at 2 m 21 s with exit 143 (SIGTERM / OOM eviction)),
# so the honest capacity surfacing matters: "no rust-standard capacity online"
# is reported as a capacity fact, never as a physical host's power state.
#
# The required-check name "ripr+ New Gap Gate" is owned by the result
# aggregator job at the bottom of this file, matching the branch-protection
# entry in .ci/policies/required-checks.toml.
#
# merge_group added in #1232: required for GitHub merge queue.
# In merge_group context:
#   - github.base_ref is absent; BASE_REF resolves via
#     github.event.merge_group.base_ref (the queue target branch).
#   - PR_LABELS is empty (no pull_request event); ripr runs without label routing.
#   - IS_FORK_PR is false — merge queue only admits trusted same-repo SHAs.
#   - ripr diff analysis uses origin/<base_ref>..HEAD; the merge-test commit HEAD
#     is the squash of PR + base, so the diff is semantically equivalent to PR diff.
#   - pull_request runs also record github.event.pull_request.head.sha as
#     PR_HEAD_SHA, separately from the evaluated merge ref. merge_group runs leave
#     PR_HEAD_SHA empty because a queue ref may contain multiple PRs.

name: ripr

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [master, main]
  # #12563: seed the ripr rust caches from a main-ref run so hosted PR runs
  # restore warm artifacts instead of cold-building into the runner-eviction
  # window. Pull_request runs stay restore-only (docs/ci/cache-policy.md):
  # PR-created caches are scoped to the PR merge ref and cannot warm other
  # PRs, they only burn the 10 GB quota.
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
    inputs:
      seed_cache:
        description: 'Seed the shared RIPR Cargo cache from canonical main/master'
        required: false
        default: false
        type: boolean

concurrency:
  group: ripr-${{ github.event.pull_request.number || github.ref }}
  # RIPR is evidence production, not a disposable fast-feedback check. A
  # newer PR head must queue behind an active analysis instead of terminating
  # it and turning an infrastructure cancellation into a false red required
  # check. The latest completed head remains authoritative for its own SHA.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # 1. Router -- picks the target runner for this PR run.
  # -------------------------------------------------------------------------
  route-ripr:
    name: Route ripr runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event.pull_request.draft != true || github.event_name != 'pull_request') &&
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.seed_cache != true)
    outputs:
      target: ${{ steps.route.outputs.target }}
      reason: ${{ steps.route.outputs.reason }}
      fallback_allowed: ${{ steps.route.outputs.fallback_allowed }}
    steps:
      - name: Decide target runner
        id: route
        env:
          GH_TOKEN: ${{ secrets.EM_RUNNER_READ_TOKEN }}
          ORG: EffortlessMetrics
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PR_AUTHOR_LOGIN: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login || '' }}
          PR_AUTHOR_TYPE: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.type || '' }}
        shell: bash
        run: |
          set -euo pipefail

          emit() {
            local target="$1" reason="$2" fallback_allowed="$3"
            echo "router_target=$target"
            echo "router_reason=$reason"
            echo "router_fallback_allowed=$fallback_allowed"
            {
              echo "target=$target"
              echo "reason=$reason"
              echo "fallback_allowed=$fallback_allowed"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### ripr Runner Route"
              echo ""
              echo "- router_target: \`$target\`"
              echo "- router_reason: \`$reason\`"
              echo "- router_fallback_allowed: \`$fallback_allowed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Fork PRs cannot access self-hosted runners -- GitHub blocks secrets.
          if [ "$IS_FORK_PR" = "true" ]; then
            emit "github" "fork_pr" "true"
            exit 0
          fi

          # Bot PRs (Dependabot, etc.) run on GitHub-hosted to avoid tying up
          # self-hosted capacity.
          pr_author_login_lc="$(printf '%s' "${PR_AUTHOR_LOGIN:-}" | tr '[:upper:]' '[:lower:]')"
          pr_author_type_lc="$(printf '%s' "${PR_AUTHOR_TYPE:-}" | tr '[:upper:]' '[:lower:]')"
          is_bot_pr="false"
          case "$pr_author_login_lc" in
            dependabot*|app/*|*\[bot\]) is_bot_pr="true" ;;
          esac
          if [ "$pr_author_type_lc" = "bot" ]; then is_bot_pr="true"; fi
          if [ "$is_bot_pr" = "true" ]; then
            emit "github" "bot_pr_github_hosted" "true"
            exit 0
          fi

          # No runner token -- cannot query availability; fall back safely.
          if [ -z "${GH_TOKEN:-}" ]; then
            emit "github" "runner_token_missing" "true"
            exit 0
          fi

          response="$(mktemp)"
          status="$(curl -sS -w '%{http_code}' -o "$response" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/$ORG/actions/runners?per_page=100" || true)"

          if [ "$status" != "200" ]; then
            echo "::warning::runner API returned HTTP $status; falling back to GitHub-hosted"
            emit "github" "runner_api_failed" "true"
            exit 0
          fi

          online_capability_count() {
            local capability_label="$1"
            jq --arg capability_label "$capability_label" '
              [ .runners[]?
                | select(.status == "online")
                | ([.labels[].name | ascii_downcase] // []) as $have
                | select(
                    ($have | index("em-ci")) and
                    ($have | index($capability_label)) and
                    ($have | index("trusted-pr"))
                  )
              ] | length
            ' "$response"
          }

          # Capability-pool routing (em-ci contract): the workflow asks whether
          # the CURRENT fleet has rust-standard capacity online. It never names
          # a physical host and never inspects busy state -- GitHub schedules
          # within the capability pool and queues behind busy runners itself.
          # If no rust-standard capacity is online within the probe window, the
          # router says so honestly (no capacity satisfies the pool) and falls
          # back to GitHub-hosted instead of inventing a machine (#15889).
          online_rust_standard="$(online_capability_count "rust-standard")"

          echo "online_rust_standard=${online_rust_standard:-0}"

          # Bounded probe window: give transient runner startups a fair chance
          # without holding the required gate hostage to an absent fleet.
          # RIPR_ROUTER_PROBE_SECONDS is a test override (the contract tests
          # set it to 0 so no-capacity fixtures return immediately); CI uses
          # the default 600s window.
          probe_window="${RIPR_ROUTER_PROBE_SECONDS:-600}"
          probe_deadline=$(( $(date +%s) + probe_window ))
          while [ "${online_rust_standard:-0}" -eq 0 ] && [ "$(date +%s)" -lt "$probe_deadline" ]; do
            sleep 30
            online_rust_standard="$(online_capability_count "rust-standard")"
          done

          if [ "${online_rust_standard:-0}" -gt 0 ]; then
            emit "selfhosted" "rust_standard_capacity_online" "false"
          else
            # Honest capacity fact: no current capacity satisfies rust-standard.
            # Small/medium closures still pass on GitHub-hosted; large closures
            # will surface a genuine capacity gap there instead of a phantom host.
            emit "github" "no_rust_standard_capacity_online" "true"
          fi

  # -------------------------------------------------------------------------
  # 2a. ripr on the self-hosted rust-standard capability pool -- preferred
  # lane. GitHub schedules within the capability pool: this job names a
  # capability, never a physical host, and queues behind busy pool members.
  #
  # All cargo/ripr commands run inside the em-ci-rust:1.95 Docker image,
  # matching em-ci-routed-rust.yml exactly. The host runner does not have
  # the Rust toolchain on PATH -- it is only available inside the container.
  # ripr is installed into /cargo-home/bin (= /mnt/ci-cache/cargo-home/bin
  # on the host) so subsequent runs skip the install if the version matches.
  #
  # Memory note (#15889/#15863): the old cx53/cx43 physical classes are
  # retired. The current fleet is rust-standard (Contabo VPS20, ~10 GiB);
  # whether that envelope survives large closures is measured by Layer-3
  # observation, not assumed from the retired host's size.
  # -------------------------------------------------------------------------
  ripr-selfhosted:
    name: ripr+ on Self-Hosted (rust-standard)
    needs: route-ripr
    if: >-
      needs.route-ripr.result == 'success' &&
      needs.route-ripr.outputs.target == 'selfhosted'
    runs-on:
      labels: [self-hosted, linux, x64, em-ci, rust-standard, trusted-pr]
    timeout-minutes: 60
    outputs:
      preflight_ok: ${{ steps.preflight.outputs.preflight_ok }}
    env:
      RIPR_VERSION: "0.10.0"
      # #15498: pin the admission boundary explicitly on every producer lane.
      # The self-hosted lane holds the measured 2560-file/14g pair with
      # headroom; without the pin it silently inherits the CLI's built-in
      # default (800 in ripr 0.10.0), moving the fail-closed boundary onto the
      # capable lane whenever a large closure routes here.
      RIPR_MAX_DIFF_INDEX_FILES: "2560"
      BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || github.event.repository.default_branch }}
      PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
      CARGO_HOME: /mnt/ci-cache/cargo-home
      SCCACHE_DIR: /mnt/ci-cache/sccache
      SCCACHE_CACHE_SIZE: 60G
      CARGO_BUILD_JOBS: "12"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: /mnt/ci-scratch/perl-lsp-swarm/ripr-${{ github.run_id }}-${{ github.run_attempt }}
      TMPDIR: /mnt/ci-scratch/tmp/ripr-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Fix workspace ownership (pre-checkout)
        shell: bash
        run: |
          # Docker writes workspace files as root. If a previous run left root-owned
          # files behind (e.g. cleanup step missed), actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.0 fails with
          # EACCES when it tries to 'git clean'. Use Docker (running as root) to chown
          # back and then delete the stale workspace target/ so it cannot cause
          # `mkdir target` failures on the next run. Fall back to a host-side rm -rf
          # in case the Docker image is unavailable.
          # Safe on CI: CARGO_TARGET_DIR is set to /mnt/ci-scratch/... so the real
          # build artifacts are NOT in workspace/target/. Only xtask/ripr JSON
          # receipts accumulate there and they must not persist between runs.
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            em-ci-rust:1.95 \
            bash -c "chown -R $(id -u):$(id -g) /workspace/target 2>/dev/null || true; rm -rf /workspace/target 2>/dev/null || true" || true
          # Belt-and-suspenders: host-side rm in case Docker was unavailable above.
          rm -rf "$GITHUB_WORKSPACE/target" || true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare RIPR freshness handoff
        shell: bash
        run: |
          set -euo pipefail
          handoff="$(mktemp -d "$RUNNER_TEMP/ripr-freshness.XXXXXX")"
          token="${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/$$"
          printf "RIPR_FRESHNESS_HANDOFF=%s\nRIPR_FRESHNESS_TOKEN=%s\n" "$handoff" "$token" >> "$GITHUB_ENV"

      - name: Preflight disk
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          # ── Orphan reaper (primary disk hygiene) ─────────────────────────────
          # Invariant: an idle runner is a disk-clean runner.  Killed, OOM-evicted,
          # and timed-out ripr runs leave orphaned ripr-* scratch dirs behind.
          # Reap at >2 h (120 min) — past the primary lane's historical 60 min ripr timeout — rather
          # than the previous 24 h that let disk fill between maintenance cycles.
          find /mnt/ci-scratch -maxdepth 1 -name 'ripr-*' -mmin +120 -exec rm -rf {} + 2>/dev/null || true
          # ── sccache size cap ──────────────────────────────────────────────────
          if [ -d "$SCCACHE_DIR" ]; then
            sccache_gb=$(du -sm "$SCCACHE_DIR" 2>/dev/null | awk '{print int($1/1024)}' || echo 0)
            if [ "${sccache_gb:-0}" -gt 70 ]; then
              echo "::warning::sccache is ${sccache_gb} GB (>70 GB cap); purging"
              rm -rf "${SCCACHE_DIR:?}"/* 2>/dev/null || true
            fi
          fi
          # ── Docker dangling resource prune ────────────────────────────────────
          docker image prune -f --filter "until=2h" 2>/dev/null || true
          docker container prune -f --filter "until=2h" 2>/dev/null || true
          docker volume prune -f 2>/dev/null || true
          disk_ok=true
          # ── Required Docker image guard ───────────────────────────────────────
          # If the self-hosted runner lost the preloaded Rust image, this lane
          # cannot run ripr. Mark preflight failed so the GitHub-hosted fallback
          # runs instead of surfacing as a false new-gap failure.
          if ! docker image inspect em-ci-rust:1.95 >/dev/null 2>&1; then
            echo "::error::Required Docker image em-ci-rust:1.95 is missing on the self-hosted runner. Failover job will run on GitHub-hosted."
            disk_ok=false
          fi
          # ── Disk guard ────────────────────────────────────────────────────────
          # ripr needs at most an xtask debug build (~5-8 GB) plus small JSON
          # analysis artifacts (<1 GB).  20 GB gives headroom over typical lane needs.
          # If the guard still fails, set preflight_ok=false and let the
          # ripr-fallback job run on GitHub-hosted.
          ci-disk-guard /mnt/ci-scratch 20 || disk_ok=false
          ci-disk-guard /mnt/ci-cache 20 || disk_ok=false
          df -h /mnt/ci-scratch /mnt/ci-cache || true
          echo "preflight_ok=${disk_ok}" >> "$GITHUB_OUTPUT"
          if [ "$disk_ok" = "false" ]; then
            echo "::error::Self-hosted preflight failed after cleanup. Failover job will run on GitHub-hosted."
            exit 1
          fi
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$SCCACHE_DIR"

      - name: Run ripr evidence and gate (Docker)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --cpus="14" \
            --memory="28g" \
            -e RIPR_VERSION="$RIPR_VERSION" \
            -e RIPR_MAX_DIFF_INDEX_FILES="$RIPR_MAX_DIFF_INDEX_FILES" \
            -e BASE_REF="$BASE_REF" \
            -e PR_HEAD_SHA="$PR_HEAD_SHA" \
            -e RIPR_FRESHNESS_HANDOFF=/freshness \
            -e RIPR_FRESHNESS_TOKEN="$RIPR_FRESHNESS_TOKEN" \
            -e PR_LABELS="$PR_LABELS" \
            -e CARGO_HOME=/cargo-home \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE="$SCCACHE_CACHE_SIZE" \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e CARGO_INCREMENTAL="$CARGO_INCREMENTAL" \
            -e CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" \
            -e CARGO_TARGET_DIR=/target \
            -e RUST_BACKTRACE=1 \
            -e CARGO_TERM_COLOR=always \
            -e TMPDIR=/tmp/jobtmp \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RIPR_FRESHNESS_HANDOFF:/freshness" \
            -v "$CARGO_HOME:/cargo-home" \
            -v "$SCCACHE_DIR:/sccache" \
            -v "$CARGO_TARGET_DIR:/target" \
            -v "$TMPDIR:/tmp/jobtmp" \
            -w /workspace \
            em-ci-rust:1.95 \
            bash -eu -o pipefail -c '
              # The workspace is checked out by the host runner user; the container
              # runs as a different UID. Mark it safe so git commands work.
              git config --global --add safe.directory /workspace

              # merge_group.base_ref is a full ref ("refs/heads/main"); strip prefix
              # so git diff/fetch use just the branch name (e.g. "main").
              BASE_REF="${BASE_REF#refs/heads/}"

              rustc --version
              cargo --version
              sccache --version || true

              # Install ripr into the cached cargo-home so subsequent runs skip this.
              cargo install ripr --version "$RIPR_VERSION" --locked

              /cargo-home/bin/ripr doctor

              # Generation phase: keep going on individual failures so we can
              # still upload whatever artifacts were produced.
              cargo xtask ripr-pr --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" || RIPR_FAILED=1
              cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json || RIPR_FAILED=1
              mkdir -p target/receipts/quality
              printf '{"schema_version":1,"kind":"ripr_badge_producer","head":"%s","root":".","source_format":"ripr-plus repo-badge-json","ripr_version":"%s"}\n' "$(git rev-parse HEAD)" "$RIPR_VERSION" > target/receipts/quality/ripr-badge-producer.json
              cargo xtask ripr-review-comments --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --timeout-seconds 210 || RIPR_FAILED=1
              cargo xtask impacted-evidence --labels-csv "$PR_LABELS" || RIPR_FAILED=1
              cargo xtask ripr-pr-summary || RIPR_FAILED=1
              cargo xtask ripr-annotations || RIPR_FAILED=1

              # Validation phase.
              cargo xtask ripr-pr --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --check
              cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json --check
              cargo xtask ripr-review-comments --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --check
              cargo xtask impacted-evidence --labels-csv "$PR_LABELS" --check
              cargo xtask ripr-pr-summary --check
              cargo xtask ripr-annotations --check

              # Quality gate.
              cargo xtask quality-gate \
                --mode enforce-new-ripr \
                --ripr-receipt target/receipts/quality/ripr-plus.json \
                --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
                --review-receipt target/ripr/review/comments.json \
                --ripr-base "origin/$BASE_REF" \
                --ripr-head HEAD \
                --receipt target/receipts/quality/quality-gate-ripr.json \
                --summary target/receipts/quality/quality-gate-ripr.md
              cargo xtask quality-gate \
                --mode enforce-new-ripr \
                --ripr-receipt target/receipts/quality/ripr-plus.json \
                --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
                --review-receipt target/ripr/review/comments.json \
                --ripr-base "origin/$BASE_REF" \
                --ripr-head HEAD \
                --receipt target/receipts/quality/quality-gate-ripr.json \
                --summary target/receipts/quality/quality-gate-ripr.md \
                --check

              sccache --show-stats || true

              # Propagate any generation-phase failure after all steps ran.
              if [ "${RIPR_FAILED:-0}" = "1" ]; then exit 1; fi
            '

      - name: Append PR evidence summary
        if: always()
        shell: bash
        run: |
          marker="${RIPR_FRESHNESS_HANDOFF:-}/clear-succeeded"
          if [ ! -f "$marker" ] || [ "$(cat "$marker")" != "${RIPR_FRESHNESS_TOKEN:-}" ]; then
            echo "RIPR freshness handoff unavailable; suppressing stale summary and annotations."
            exit 0
          fi
          if [ -f target/ripr/pr/summary.md ]; then
            cat target/ripr/pr/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR PR evidence summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/receipts/quality/quality-gate-ripr.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat target/receipts/quality/quality-gate-ripr.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR quality-gate summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/ripr/review/annotations.txt ]; then
            cat target/ripr/review/annotations.txt
          fi

      - name: Record RIPR freshness handoff result
        id: ripr-freshness-result
        if: always()
        shell: bash
        run: |
          marker="$RIPR_FRESHNESS_HANDOFF/clear-succeeded"
          if [ -f "$marker" ] && [ "$(cat "$marker")" = "$RIPR_FRESHNESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No successful artifact invalidation handoff; stale RIPR files will not be uploaded."
          fi

      - name: Upload ripr PR evidence
        if: always() && steps.ripr-freshness-result.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: ripr-pr-evidence
          path: |
            target/ripr/pr/**
            target/ripr/review/**
            target/xtask/impacted-evidence/**
            target/receipts/quality/ripr-plus.json
            target/receipts/quality/ripr-badge-producer.json
            target/receipts/quality/quality-gate-ripr.json
            target/receipts/quality/quality-gate-ripr.md
          retention-days: 14
          if-no-files-found: error

      - name: Cleanup scratch
        if: always()
        shell: bash
        run: |
          set +e
          # Fix ownership of workspace target/ dirs written by root inside Docker.
          # Without this the next run's checkout action cannot clean them (EACCES).
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            em-ci-rust:1.95 \
            bash -c "chown -R $(id -u):$(id -g) /workspace/target/ripr /workspace/target/xtask /workspace/target/receipts 2>/dev/null || true" || true
          # Clean the scratch dirs (Docker-owned files removed by Docker).
          docker run --rm \
            -v "$TMPDIR:/tmpdir" \
            -v "$CARGO_TARGET_DIR:/target" \
            em-ci-rust:1.95 \
            bash -c 'find /tmpdir /target -mindepth 1 -delete 2>/dev/null || true' || true
          rmdir "$TMPDIR" "$CARGO_TARGET_DIR" 2>/dev/null || true
          df -h /mnt/ci-scratch /mnt/ci-cache || true

  # -------------------------------------------------------------------------
  # 2c. ripr on GitHub-hosted -- fork PRs, bots, and no-idle-runner fallback.
  # -------------------------------------------------------------------------
  ripr-github:
    name: ripr+ on GitHub Hosted
    needs: route-ripr
    if: >-
      needs.route-ripr.result == 'success' &&
      needs.route-ripr.outputs.target == 'github' &&
      needs.route-ripr.outputs.fallback_allowed == 'true'
    runs-on: ubuntu-24.04
    # 135m (#15498 sequel): the guidance pass measured >30m on a 1600+-file
    # closure after the 40m analysis cap and the baseline receipt — the 75m
    # envelope SIGTERMed the guidance step mid-bound. The budget must hold
    # analysis + receipt + guidance + gate together, not guidance alone.
    timeout-minutes: 135
    env:
      RIPR_VERSION: "0.10.0"
      BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || github.event.repository.default_branch }}
      PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare RIPR freshness handoff
        shell: bash
        run: |
          set -euo pipefail
          handoff="$(mktemp -d "$RUNNER_TEMP/ripr-freshness.XXXXXX")"
          token="${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/$$"
          printf "RIPR_FRESHNESS_HANDOFF=%s\nRIPR_FRESHNESS_TOKEN=%s\n" "$handoff" "$token" >> "$GITHUB_ENV"

      - name: Toolchain (rust-toolchain.toml pins 1.95.0)
        run: rustc --version

      - name: Normalize base ref
        shell: bash
        run: |
          # merge_group.base_ref is a full ref ("refs/heads/main"); strip prefix
          # so subsequent steps that use $BASE_REF pass just the branch name.
          stripped="${BASE_REF#refs/heads/}"
          echo "BASE_REF=$stripped" >> "$GITHUB_ENV"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ripr-${{ env.RIPR_VERSION }}
          cache-workspace-crates: true
          # #12563: the old main-only save-if could never fire in this
          # workflow, so every hosted run cold-built ~6.5m into the
          # runner-eviction window. PR runs must stay restore-only
          # (docs/ci/cache-policy.md): PR-created caches are scoped to the PR
          # merge ref, cannot warm other PRs, and burn the 10 GB quota. Saves
          # come from the scheduled main-ref seed job (and a manual main-ref
          # dispatch) instead.
          # Analysis jobs restore the canonical seed but never publish shared state.
          save-if: ${{ false }}

      - name: Install ripr
        run: cargo install ripr --version "$RIPR_VERSION" --locked

      - name: Build xtask
        run: cargo build -p xtask --locked

      - name: Run ripr doctor
        run: ripr doctor

      - name: Generate PR evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/ripr/pr
          mkdir -p target/ripr/pr
          container_name="ripr-github-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}"
          cleanup_host_state() {
            status=$?
            set +e
            cleanup_failed=0
            container_id="$(timeout --signal=TERM --kill-after=5s 15s docker ps -aq --filter "name=^/${container_name}$" 2>/dev/null)"
            if [ "$?" -ne 0 ]; then
              echo "::error::failed to inspect hosted RIPR container during cleanup" >&2
              cleanup_failed=1
            elif [ -n "$container_id" ] && ! timeout --signal=TERM --kill-after=5s 15s docker rm -f "$container_name" >/dev/null 2>&1; then
              echo "::error::failed to stop hosted RIPR container during cleanup" >&2
              cleanup_failed=1
            fi
            if ! sudo -n chown -R "$(id -u):$(id -g)" target; then
              echo "::error::failed to restore hosted RIPR target ownership" >&2
              cleanup_failed=1
            fi
            if [ "$cleanup_failed" -ne 0 ] && [ "$status" -eq 0 ]; then
              status=1
            fi
            exit "$status"
          }
          trap cleanup_host_state EXIT
          printf "runner=github-hosted\njob_phase=host-start\n" > target/ripr/pr/ripr-measurement-config.txt
          image='rust:1.95-slim-bookworm'
          set +e
          timeout --signal=TERM --kill-after=10s 3m docker pull "$image"
          pull_status=$?
          set -e
          printf "pull_exit=%s\n" "$pull_status" >> target/ripr/pr/ripr-measurement-config.txt
          if [ "$pull_status" -ne 0 ]; then exit "$pull_status"; fi
          set +e
          image_id="$(timeout --signal=TERM --kill-after=5s 15s docker image inspect --format '{{.Id}}' "$image")"
          inspect_id_status=$?
          image_digest="$(timeout --signal=TERM --kill-after=5s 15s docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          inspect_digest_status=$?
          set -e
          printf "inspect_id_exit=%s\ninspect_digest_exit=%s\n" "$inspect_id_status" "$inspect_digest_status" >> target/ripr/pr/ripr-measurement-config.txt
          if [ "$inspect_id_status" -ne 0 ] || [ "$inspect_digest_status" -ne 0 ]; then exit 1; fi
          printf "image_id=%s\nimage_digest=%s\n" "$image_id" "$image_digest" >> target/ripr/pr/ripr-measurement-config.txt
          set +e
          # #15498: the admission boundary must stay explicit and paired with a
          # container budget measured to hold it. 1600-file closures indexed
          # inside 6g, i.e. <=3.75 MB per file; 2560 files therefore needs
          # ~9.6 GB of analysis memory, so the container gets 14g of this
          # 16 GB runner (2 GB stays with the host). 2560 still refuses a
          # whole-tree index (~4080 files, ~15 GB) — the guard stays bounded.
          # Do not lower the container budget without lowering the file cap:
          # an oversized closure must fail closed as diff_scope_oversized,
          # never as an OOM kill.
          timeout --signal=TERM --kill-after=30s 40m docker run --rm --name "$container_name" \
            --cpus=4 --memory=14g --memory-swap=14g \
            -e RIPR_VERSION -e BASE_REF -e PR_HEAD_SHA \
            -e RIPR_MAX_DIFF_INDEX_FILES=2560 \
            -e RIPR_FRESHNESS_HANDOFF=/freshness -e RIPR_FRESHNESS_TOKEN \
            -e MEASUREMENT_IMAGE_ID="$image_id" -e MEASUREMENT_IMAGE_DIGEST="$image_digest" \
            -v "$GITHUB_WORKSPACE:/workspace" -v "$RIPR_FRESHNESS_HANDOFF:/freshness" \
            -w /workspace "$image_id" bash -euo pipefail -c '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev git curl jq time
              git config --global --add safe.directory /workspace
              mkdir -p target/ripr/pr
              printf "job_phase=container-tools-start\n" >> target/ripr/pr/ripr-measurement-config.txt
              base_arg="origin/$BASE_REF"
              cargo install ripr --version "$RIPR_VERSION" --locked
              rustc_version="$(rustc --version)"; cargo_version="$(cargo --version)"
              ripr_version="$(ripr --version)"; ripr_path="$(command -v ripr)"
              ripr_sha256="$(sha256sum "$ripr_path" | cut -d " " -f 1)"
              {
                printf "docker_memory=14g\ndocker_memory_swap=14g\nsource_head_sha=%s\nsource_base_ref=%s\n" "$(git rev-parse HEAD)" "$base_arg"
                printf "head=%s\nbase=%s\nripr_version=%s\nripr_sha256=%s\nindex_limit=%s\n" "$(git rev-parse HEAD)" "$base_arg" "$ripr_version" "$ripr_sha256" "$RIPR_MAX_DIFF_INDEX_FILES"
                printf "%s\n%s\n" "$rustc_version" "$cargo_version"
              } >> target/ripr/pr/ripr-measurement-config.txt
              cargo build -p xtask --locked
              ripr doctor
              set +e
              timeout --signal=TERM --kill-after=30s 25m /usr/bin/time -v -o target/ripr/pr/ripr-measurement-time.txt cargo xtask ripr-pr --base "$base_arg" --head HEAD --pr-head "$PR_HEAD_SHA"
              analysis_status=$?
              set -e
              printf "analysis_exit=%s\n" "$analysis_status" >> target/ripr/pr/ripr-measurement-config.txt
              if [ "$analysis_status" -ne 0 ]; then exit "$analysis_status"; fi
              test -s target/ripr/pr/repo-exposure.json
              cargo xtask ripr-pr --base "$base_arg" --head HEAD --pr-head "$PR_HEAD_SHA" --check
              marker="$RIPR_FRESHNESS_HANDOFF/clear-succeeded"
              test -f "$marker" && test "$(cat "$marker")" = "$RIPR_FRESHNESS_TOKEN"
            '
          container_status=$?
          set -e
          printf "container_exit=%s\n" "$container_status" >> target/ripr/pr/ripr-measurement-config.txt
          exit "$container_status"

      - name: Generate repo-wide RIPR+ baseline receipt
        if: always()
        run: cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json

      - name: Record exact RIPR badge producer
        if: always()
        run: |
          mkdir -p target/receipts/quality
          printf '{"schema_version":1,"kind":"ripr_badge_producer","head":"%s","root":".","source_format":"ripr-plus repo-badge-json","ripr_version":"%s"}\n' "$(git rev-parse HEAD)" "$RIPR_VERSION" > target/receipts/quality/ripr-badge-producer.json

      - name: Generate review guidance
        if: always()
        # 1800s: the guidance pass on a new-crate diff no longer completes in
        # 600s on the hosted lane — #15082 and #15028 both failed the required
        # ripr+ New Gap Gate twice with review_guidance.status=incomplete,
        # turning 64-67 mechanical no_static_path seams into unadjudicated
        # gaps because static-limitation credit is only paid from a completed
        # receipt. 3600s: #14897 then measured the guidance pass itself
        # exceeding 1800s on a 1600+-file closure (xtask SIGTERMed the ripr
        # child at the bound, exit 143), so the bound is raised together with
        # the 135m job envelope — analysis 40m + receipt + guidance 60m fits,
        # and an incomplete receipt keeps failing closed, just later.
        run: cargo xtask ripr-review-comments --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --timeout-seconds 3600

      - name: Generate impacted evidence
        if: always()
        run: cargo xtask impacted-evidence --labels-csv "$PR_LABELS"

      - name: Generate PR evidence summary
        if: always()
        run: cargo xtask ripr-pr-summary

      - name: Generate warning annotations
        if: always()
        run: cargo xtask ripr-annotations

      - name: Validate PR evidence contracts
        if: always()
        run: |
          marker="$RIPR_FRESHNESS_HANDOFF/clear-succeeded"
          if [ ! -f "$marker" ] || [ "$(cat "$marker")" != "$RIPR_FRESHNESS_TOKEN" ]; then
            echo "RIPR artifact invalidation did not complete for this producer invocation" >&2
            exit 1
          fi
          cargo xtask ripr-pr --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --check
          cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json --check
          cargo xtask ripr-review-comments --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --check
          cargo xtask impacted-evidence --labels-csv "$PR_LABELS" --check
          cargo xtask ripr-pr-summary --check
          cargo xtask ripr-annotations --check

      - name: Enforce new RIPR gap quality gate
        if: always()
        run: |
          marker="$RIPR_FRESHNESS_HANDOFF/clear-succeeded"
          if [ ! -f "$marker" ] || [ "$(cat "$marker")" != "$RIPR_FRESHNESS_TOKEN" ]; then
            echo "RIPR artifact invalidation did not complete for this producer invocation" >&2
            exit 1
          fi
          cargo xtask quality-gate \
            --mode enforce-new-ripr \
            --ripr-receipt target/receipts/quality/ripr-plus.json \
            --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
            --review-receipt target/ripr/review/comments.json \
            --ripr-base "origin/$BASE_REF" \
            --ripr-head HEAD \
            --receipt target/receipts/quality/quality-gate-ripr.json \
            --summary target/receipts/quality/quality-gate-ripr.md
          cargo xtask quality-gate \
            --mode enforce-new-ripr \
            --ripr-receipt target/receipts/quality/ripr-plus.json \
            --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
            --review-receipt target/ripr/review/comments.json \
            --ripr-base "origin/$BASE_REF" \
            --ripr-head HEAD \
            --receipt target/receipts/quality/quality-gate-ripr.json \
            --summary target/receipts/quality/quality-gate-ripr.md \
            --check

      - name: Append PR evidence summary
        if: always()
        shell: bash
        run: |
          marker="${RIPR_FRESHNESS_HANDOFF:-}/clear-succeeded"
          if [ ! -f "$marker" ] || [ "$(cat "$marker")" != "${RIPR_FRESHNESS_TOKEN:-}" ]; then
            echo "RIPR freshness handoff unavailable; suppressing stale summary and annotations."
            exit 0
          fi
          if [ -f target/ripr/pr/summary.md ]; then
            cat target/ripr/pr/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR PR evidence summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/receipts/quality/quality-gate-ripr.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat target/receipts/quality/quality-gate-ripr.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR quality-gate summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/ripr/review/annotations.txt ]; then
            cat target/ripr/review/annotations.txt
          fi

      - name: Record RIPR freshness handoff result
        id: ripr-freshness-result
        if: always()
        shell: bash
        run: |
          marker="$RIPR_FRESHNESS_HANDOFF/clear-succeeded"
          if [ -f "$marker" ] && [ "$(cat "$marker")" = "$RIPR_FRESHNESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No successful artifact invalidation handoff; stale RIPR files will not be uploaded."
          fi

      - name: Upload ripr PR evidence
        if: always() && steps.ripr-freshness-result.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: ripr-pr-evidence
          path: |
            target/ripr/pr/**
            target/ripr/review/**
            target/xtask/impacted-evidence/**
            target/receipts/quality/ripr-plus.json
            target/receipts/quality/ripr-badge-producer.json
            target/receipts/quality/quality-gate-ripr.json
            target/receipts/quality/quality-gate-ripr.md
          retention-days: 14
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 2d. ripr disk-full failover -- runs ripr on GitHub-hosted when the primary
  # self-hosted rust-standard lane was routed but its disk preflight still
  # failed after aggressive cleanup (orphan reap + sccache cap + docker prune).
  # Uses the same ripr-github pattern so the quality gate is fully enforced.
  # -------------------------------------------------------------------------
  ripr-fallback:
    name: ripr+ (Disk-Full Fallback)
    needs:
      - route-ripr
      - ripr-selfhosted
    # Trigger ONLY when the primary self-hosted job failed AND the preflight step
    # explicitly recorded preflight_ok=false (written to GITHUB_OUTPUT before exit 1).
    # This prevents a real ripr quality-gate failure from masking under a GitHub-hosted run.
    if: >-
      always() &&
      needs.route-ripr.result == 'success' &&
      needs.route-ripr.outputs.target == 'selfhosted' &&
      needs.ripr-selfhosted.result == 'failure' &&
      needs.ripr-selfhosted.outputs.preflight_ok == 'false'

    runs-on: ubuntu-24.04
    # Same measured budget as the primary hosted lane (#15498 sequel).
    timeout-minutes: 135
    env:
      RIPR_VERSION: "0.10.0"
      # #15498: this lane runs ripr-pr directly on the runner, so without an
      # explicit cap it inherits the CLI's built-in default — which tightened
      # from 1600 (ripr 0.9.0) to 800 (ripr 0.10.0) and would fail closed on
      # ordinary multi-crate closures. Pin the same measured boundary as the
      # primary hosted lane so a CLI version bump cannot silently shrink it.
      RIPR_MAX_DIFF_INDEX_FILES: "2560"
      BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || github.event.repository.default_branch }}
      PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
    steps:
      - name: Annotate failover reason
        shell: bash
        run: |
          echo "::warning::Primary runner (${{ needs.route-ripr.outputs.target }}) failed — falling back to GitHub-hosted for ripr. Reclaim runner disk before next run."
          {
            echo "### ripr Disk-Full Failover"
            echo ""
            echo "Primary runner \`${{ needs.route-ripr.outputs.target }}\` failed its disk"
            echo "preflight even after aggressive cleanup. Running ripr on GitHub-hosted"
            echo "as defense-in-depth. Ops: reclaim disk on the failing runner."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare RIPR freshness handoff
        shell: bash
        run: |
          set -euo pipefail
          handoff="$(mktemp -d "$RUNNER_TEMP/ripr-freshness.XXXXXX")"
          token="${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/$$"
          printf "RIPR_FRESHNESS_HANDOFF=%s\nRIPR_FRESHNESS_TOKEN=%s\n" "$handoff" "$token" >> "$GITHUB_ENV"

      - name: Toolchain (rust-toolchain.toml pins 1.95.0)
        run: rustc --version

      - name: Normalize base ref
        shell: bash
        run: |
          stripped="${BASE_REF#refs/heads/}"
          echo "BASE_REF=$stripped" >> "$GITHUB_ENV"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ripr-${{ env.RIPR_VERSION }}
          cache-workspace-crates: true
          # #12563: same restore-only repair as the primary hosted job above —
          # the shared key is seeded by the scheduled or explicit canonical seed job.
          # Analysis jobs restore the canonical seed but never publish shared state.
          save-if: ${{ false }}

      - name: Install ripr
        run: cargo install ripr --version "$RIPR_VERSION" --locked

      - name: Build xtask
        run: cargo build -p xtask --locked

      - name: Run ripr doctor
        run: ripr doctor

      - name: Generate PR evidence
        run: cargo xtask ripr-pr --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA"

      - name: Generate repo-wide RIPR+ baseline receipt
        if: always()
        run: cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json

      - name: Record exact RIPR badge producer
        if: always()
        run: |
          mkdir -p target/receipts/quality
          printf '{"schema_version":1,"kind":"ripr_badge_producer","head":"%s","root":".","source_format":"ripr-plus repo-badge-json","ripr_version":"%s"}\n' "$(git rev-parse HEAD)" "$RIPR_VERSION" > target/receipts/quality/ripr-badge-producer.json

      - name: Generate review guidance
        if: always()
        # 1800s: the guidance pass on a new-crate diff no longer completes in
        # 600s on the hosted lane — #15082 and #15028 both failed the required
        # ripr+ New Gap Gate twice with review_guidance.status=incomplete,
        # turning 64-67 mechanical no_static_path seams into unadjudicated
        # gaps because static-limitation credit is only paid from a completed
        # receipt. 3600s: #14897 then measured the guidance pass itself
        # exceeding 1800s on a 1600+-file closure (xtask SIGTERMed the ripr
        # child at the bound, exit 143), so the bound is raised together with
        # the 135m job envelope — analysis 40m + receipt + guidance 60m fits,
        # and an incomplete receipt keeps failing closed, just later.
        run: cargo xtask ripr-review-comments --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --timeout-seconds 3600

      - name: Generate impacted evidence
        if: always()
        run: cargo xtask impacted-evidence --labels-csv "$PR_LABELS"

      - name: Generate PR evidence summary
        if: always()
        run: cargo xtask ripr-pr-summary

      - name: Generate warning annotations
        if: always()
        run: cargo xtask ripr-annotations

      - name: Validate PR evidence contracts
        if: always()
        run: |
          marker="$RIPR_FRESHNESS_HANDOFF/clear-succeeded"
          if [ ! -f "$marker" ] || [ "$(cat "$marker")" != "$RIPR_FRESHNESS_TOKEN" ]; then
            echo "RIPR artifact invalidation did not complete for this producer invocation" >&2
            exit 1
          fi
          cargo xtask ripr-pr --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --check
          cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json --check
          cargo xtask ripr-review-comments --base "origin/$BASE_REF" --head HEAD --pr-head "$PR_HEAD_SHA" --check
          cargo xtask impacted-evidence --labels-csv "$PR_LABELS" --check
          cargo xtask ripr-pr-summary --check
          cargo xtask ripr-annotations --check

      - name: Enforce new RIPR gap quality gate
        if: always()
        run: |
          marker="$RIPR_FRESHNESS_HANDOFF/clear-succeeded"
          if [ ! -f "$marker" ] || [ "$(cat "$marker")" != "$RIPR_FRESHNESS_TOKEN" ]; then
            echo "RIPR artifact invalidation did not complete for this producer invocation" >&2
            exit 1
          fi
          cargo xtask quality-gate \
            --mode enforce-new-ripr \
            --ripr-receipt target/receipts/quality/ripr-plus.json \
            --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
            --review-receipt target/ripr/review/comments.json \
            --ripr-base "origin/$BASE_REF" \
            --ripr-head HEAD \
            --receipt target/receipts/quality/quality-gate-ripr.json \
            --summary target/receipts/quality/quality-gate-ripr.md
          cargo xtask quality-gate \
            --mode enforce-new-ripr \
            --ripr-receipt target/receipts/quality/ripr-plus.json \
            --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
            --review-receipt target/ripr/review/comments.json \
            --ripr-base "origin/$BASE_REF" \
            --ripr-head HEAD \
            --receipt target/receipts/quality/quality-gate-ripr.json \
            --summary target/receipts/quality/quality-gate-ripr.md \
            --check

      - name: Append PR evidence summary
        if: always()
        shell: bash
        run: |
          marker="${RIPR_FRESHNESS_HANDOFF:-}/clear-succeeded"
          if [ ! -f "$marker" ] || [ "$(cat "$marker")" != "${RIPR_FRESHNESS_TOKEN:-}" ]; then
            echo "RIPR freshness handoff unavailable; suppressing stale summary and annotations."
            exit 0
          fi
          if [ -f target/ripr/pr/summary.md ]; then
            cat target/ripr/pr/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR PR evidence summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/receipts/quality/quality-gate-ripr.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat target/receipts/quality/quality-gate-ripr.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR quality-gate summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/ripr/review/annotations.txt ]; then
            cat target/ripr/review/annotations.txt
          fi

      - name: Record RIPR freshness handoff result
        id: ripr-freshness-result
        if: always()
        shell: bash
        run: |
          marker="$RIPR_FRESHNESS_HANDOFF/clear-succeeded"
          if [ -f "$marker" ] && [ "$(cat "$marker")" = "$RIPR_FRESHNESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No successful artifact invalidation handoff; stale RIPR files will not be uploaded."
          fi

      - name: Upload ripr PR evidence
        if: always() && steps.ripr-freshness-result.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: ripr-pr-evidence
          path: |
            target/ripr/pr/**
            target/ripr/review/**
            target/xtask/impacted-evidence/**
            target/receipts/quality/ripr-plus.json
            target/receipts/quality/ripr-badge-producer.json
            target/receipts/quality/quality-gate-ripr.json
            target/receipts/quality/quality-gate-ripr.md
          retention-days: 14
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 3. Cache seed (#12563) -- scheduled or explicit canonical main-ref run that
  # warms the shared ripr rust-cache key so hosted PR runs restore instead of cold-building ~6.5m
  # into the runner-eviction window. Pull_request runs stay restore-only
  # (docs/ci/cache-policy.md); this job is the only writer. Builds the same
  # artifacts the analysis jobs build (ripr binary + xtask).
  # -------------------------------------------------------------------------
  seed-cache:
    name: Seed ripr rust cache
    if: >-
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.seed_cache == true)) &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RIPR_VERSION: "0.10.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Toolchain (rust-toolchain.toml pins 1.95.0)
        run: rustc --version

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          cache-workspace-crates: true
          shared-key: ripr-${{ env.RIPR_VERSION }}
          save-if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.seed_cache == true)) && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}

      - name: Install ripr
        run: cargo install ripr --version "$RIPR_VERSION" --locked

      - name: Build xtask
        run: cargo build -p xtask --locked

  # -------------------------------------------------------------------------
  # 4. Result aggregator -- owns the "ripr+ New Gap Gate" required-check name.
  # -------------------------------------------------------------------------
  ripr:
    name: ripr+ New Gap Gate
    needs:
      - route-ripr
      - ripr-selfhosted
      - ripr-github
      - ripr-fallback
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Start the evaluator's clock before checkout/setup so those steps cannot
      # consume the verdict, summary, and artifact-upload reserve.
      RIPR_GATE_TIMEOUT_SECONDS: 300
      RIPR_GATE_FINALIZATION_RESERVE_SECONDS: 60
    permissions:
      contents: read
      # #6807: read the failed lane's job log to classify runner evictions.
      actions: read
      # #16101: read this pull request's live draft state and the conclusions
      # already published for this head, so a stale draft snapshot cannot
      # overwrite the verdict of the run that analyzed it.
      checks: read
      pull-requests: read
    steps:
      - name: Establish gate deadline
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          finalize_setup_failure() {
            echo "RIPR_GATE_VERDICT=ripr-failure"
            echo "::error::ripr gate deadline setup was interrupted; failing closed"
            {
              echo ""
              echo "### ripr+ New Gap Gate Finalization"
              echo "- verdict: ripr-failure"
              echo "- reason: deadline setup was interrupted before evaluation"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          trap 'finalize_setup_failure; exit 1' TERM INT

          started_at="$(date +%s)"
          gate_deadline=$((started_at + RIPR_GATE_TIMEOUT_SECONDS - RIPR_GATE_FINALIZATION_RESERVE_SECONDS))
          if [ "$gate_deadline" -le "$started_at" ]; then
            finalize_setup_failure
            exit 1
          fi
          {
            echo "RIPR_GATE_DEADLINE_EPOCH=$gate_deadline"
            echo "RIPR_GATE_FINALIZATION_RESERVE_SECONDS=$RIPR_GATE_FINALIZATION_RESERVE_SECONDS"
          } >> "$GITHUB_ENV"
          echo "ripr_gate_deadline_epoch=$gate_deadline"
          echo "ripr_gate_finalization_reserve_seconds=$RIPR_GATE_FINALIZATION_RESERVE_SECONDS"

      # The aggregator classifies lane termination through the shared,
      # unit-tested classifier in scripts/ci/ (#6807, #12563, complementing
      # #12771's bounded auto-retry handoff).
      - name: Checkout decision scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate routed result
        shell: bash
        env:
          CHECK_NAME: ripr+ New Gap Gate
          # .ci/policies/required-checks.toml binds this required context to the
          # GitHub Actions integration; only its check runs are proof for it.
          REQUIRED_CHECK_APP_ID: "15368"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_DRAFT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
          ROUTE_RESULT: ${{ needs.route-ripr.result }}
          ROUTER_TARGET: ${{ needs.route-ripr.outputs.target }}
          ROUTER_REASON: ${{ needs.route-ripr.outputs.reason }}
          SELFHOSTED_RESULT: ${{ needs.ripr-selfhosted.result }}
          GITHUB_RESULT: ${{ needs.ripr-github.result }}
          FALLBACK_RESULT: ${{ needs.ripr-fallback.result }}
          # gh authenticates through GH_TOKEN/GITHUB_TOKEN; without this the
          # eviction log inspection below always fails closed to ripr-failure.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gate_finalized=false
          finalize_on_termination() {
            if [ "$gate_finalized" = "true" ]; then
              return
            fi
            gate_finalized=true
            echo "RIPR_GATE_VERDICT=ripr-failure"
            echo "::error::ripr gate evaluator received TERM/INT before a terminal verdict; failing closed"
            {
              echo ""
              echo "### ripr+ New Gap Gate Finalization"
              echo "- verdict: ripr-failure"
              echo "- reason: evaluator termination before verdict completion"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          trap 'finalize_on_termination; exit 1' TERM INT

          gate_deadline="${RIPR_GATE_DEADLINE_EPOCH:-}"
          if ! [[ "$gate_deadline" =~ ^[0-9]+$ ]]; then
            finalize_on_termination
            exit 1
          fi
          now="$(date +%s)"
          if [ "$now" -ge "$gate_deadline" ]; then
            echo "::warning::ripr gate setup consumed the evaluator deadline; no retrieval was attempted"
            finalize_on_termination
            exit 1
          fi

          echo "route_result=${ROUTE_RESULT:-}"
          echo "router_target=${ROUTER_TARGET:-}"
          echo "router_reason=${ROUTER_REASON:-}"
          echo "selfhosted_result=${SELFHOSTED_RESULT:-}"
          echo "github_result=${GITHUB_RESULT:-}"
          echo "fallback_result=${FALLBACK_RESULT:-}"

          {
            echo "### ripr+ New Gap Gate Result"
            echo ""
            echo "- route_result: \`${ROUTE_RESULT:-}\`"
            echo "- router_target: \`${ROUTER_TARGET:-}\`"
            echo "- router_reason: \`${ROUTER_REASON:-}\`"
            echo "- selfhosted_result: \`${SELFHOSTED_RESULT:-}\`"
            echo "- github_result: \`${GITHUB_RESULT:-}\`"
            echo "- fallback_result: \`${FALLBACK_RESULT:-}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # IS_DRAFT_PR is the webhook's snapshot of the pull request, taken
          # when this run was created. `cancel-in-progress` is false here by
          # design, so a run created while the pull request was a draft always
          # finishes, and its gate can land after the gate of the run that
          # actually analyzed the head.
          #
          # Measured on #16094, head c9bf380f4: the run that executed the lane
          # posted `ripr+ New Gap Gate` success at 05:35:59 with
          # RIPR_GATE_VERDICT=success, and the superseded draft run posted
          # draft-no-proof at 05:36:10, eleven seconds later, on a head whose
          # analysis had completed and passed (#16101).
          #
          # Only an authoritative success is mirrored. A failure, a
          # cancellation, or nothing published yet is missing or contradictory
          # evidence, which AGENTS.md makes NOT_PROVEN, so the run stays
          # non-successful and the run that analyzes the head overwrites it.
          live_draft_state() {
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY:-}/pulls/${PR_NUMBER:-}" \
              --jq '.draft'
          }

          # The newest conclusion another run has already published for this
          # check on this head. This job's own check run is still in progress,
          # so the completed filter cannot match it. The check name carries
          # spaces, so it goes through `-f` rather than into the path.
          # Mirror only this required context's own authority. Two things the
          # check name alone does not establish (#16105 review):
          #
          #   1. Any installed GitHub App may publish a check run of any name.
          #      `.ci/policies/required-checks.toml` binds both required
          #      contexts to GitHub Actions integration 15368, so a same-name
          #      success from another app is not proof for this context.
          #   2. Which attempt speaks for the head. Ordering by completion time
          #      lets a slow older attempt outrank a faster newer one, and
          #      pre-filtering to completed runs hides a newer attempt that is
          #      still pending. Either mirrors green over newer contradictory
          #      evidence. Select the way the repository's own resolver does,
          #      max by (started_at, id) across every attempt — see
          #      `latest_check_run` in xtask/src/tasks/github_preflight.rs.
          #
          # This run is excluded from its own denominator: it is the stale
          # snapshot asking whether it was superseded, and its own check run is
          # in progress, so leaving it in would always select it and the answer
          # would always be "no proof". Everything else fails closed — a
          # selection that is absent, pending or non-success prints nothing and
          # the caller treats that as NOT_PROVEN.
          published_conclusion() {
            gh api -X GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY:-}/commits/${HEAD_SHA:-}/check-runs" \
              -f "check_name=${CHECK_NAME:-}" \
              -F per_page=100 \
              --jq '[.check_runs[]
                     | select((.app.id // -1) == (env.REQUIRED_CHECK_APP_ID | tonumber))
                     | select(((.details_url // "")
                               | contains("/actions/runs/" + env.GITHUB_RUN_ID + "/")) | not)]
                    | max_by([(.started_at // ""), .id])
                    | if . == null then empty
                      elif .status != "completed" then empty
                      else (.conclusion // empty) end'
          }

          # Draft routing saves work but produces no required-check proof.
          # Preserve non-draft skipped routing (including RIPR cache seeding).
          if [ "$ROUTE_RESULT" = "skipped" ]; then
            if [ "${IS_DRAFT_PR:-false}" = "true" ]; then
              draft_now="$(live_draft_state || true)"
              if [ "$draft_now" = "false" ]; then
                published="$(published_conclusion || true)"
                if [ "$published" = "success" ]; then
                  echo "RIPR_GATE_VERDICT=superseded-draft-snapshot"
                  echo "- verdict: superseded-draft-snapshot (mirroring published success)" >> "$GITHUB_STEP_SUMMARY"
                  echo "::notice::This run carries a stale draft snapshot for a pull request that is no longer a draft; mirroring the success already published for ${HEAD_SHA:-}."
                  exit 0
                fi
                echo "RIPR_GATE_VERDICT=superseded-no-proof"
                echo "- verdict: superseded-no-proof (NOT_PROVEN; published: \`${published:-none}\`)" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::This run carries a stale draft snapshot and no passing proof has been published for ${HEAD_SHA:-} (published: ${published:-none}); the run that analyzes this head owns the verdict."
                exit 1
              fi
              echo "RIPR_GATE_VERDICT=draft-no-proof"
              echo "::error::ripr draft route skipped: NOT_PROVEN; no analysis was executed."
              echo "- verdict: draft-no-proof (NOT_PROVEN)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::notice::ripr router was skipped (non-draft event) — ripr gate is neutral/pass."
            echo "RIPR_GATE_VERDICT=neutral-router-skipped"
            echo "ripr+ New Gap Gate: neutral (router skipped — non-draft event)"
            exit 0
          fi

          if [ "$ROUTE_RESULT" != "success" ]; then
            echo "RIPR_GATE_VERDICT=router-not-success"
            echo "::error::ripr router did not complete successfully: $ROUTE_RESULT"
            exit 1
          fi

          remaining_until_deadline() {
            local now
            now="$(date +%s)"
            echo $((gate_deadline - now))
          }

          # A cancelled lane is the ABSENCE of evidence, not negative evidence.
          # The gate stays blocking — no proof was produced for this SHA — but it
          # must not read as a ripr failure. The `github)` branch below reported
          # this as "did not succeed: cancelled", which names the outcome but
          # still reads as a gate failure rather than an unevaluated head (#5460).
          #
          # The workflow deliberately does not cancel in-progress evidence runs
          # when a newer PR head arrives. A cancelled lane therefore still names
          # an external/manual cancellation or runner failure, not normal head
          # supersession. Keep it blocking because no proof was produced.
          for lane_result in "${SELFHOSTED_RESULT:-}" "${GITHUB_RESULT:-}" "${FALLBACK_RESULT:-}"; do
            if [ "$lane_result" = "cancelled" ]; then
              echo "RIPR_GATE_VERDICT=cancelled-no-verdict"
              echo "::error::ripr lane cancelled — no proof produced for this SHA. This is NOT a new RIPR gap. Normal PR synchronization does not cancel active RIPR runs; investigate an external, manual, or API cancellation and re-run this head."
              echo "ripr+ New Gap Gate: cancelled (no proof for this SHA)"
              exit 1
            fi
          done

          # #6807: a lane that reports `failure` may have been killed by the
          # platform (runner shutdown signal, SIGTERM/exit 143, API
          # cancellation) instead of failing on ripr findings. That is
          # infra-no-proof, not a source gap — genuine ripr failures exit 101.
          # Classify once from the failed lane's own job log so an eviction
          # never reads as a ripr failure. The gate blocks either way: no
          # terminal receipt exists for this head.
          lane_name=""
          lane_result=""
          case "${ROUTER_TARGET:-}" in
            selfhosted) lane_name="ripr+ on Self-Hosted (rust-standard)"; lane_result="$SELFHOSTED_RESULT" ;;
            github) lane_name="ripr+ on GitHub Hosted"; lane_result="$GITHUB_RESULT" ;;
          esac
          # After a disk-preflight failover the evidence-producing job is the
          # fallback, not the primary CX lane: inspect its log when it ran and
          # failed, or its runner eviction reports as a ripr source failure.
          if [ "$FALLBACK_RESULT" = "failure" ] || [ "$FALLBACK_RESULT" = "cancelled" ]; then
            lane_name="ripr+ (Disk-Full Fallback)"
            lane_result="$FALLBACK_RESULT"
          fi
          lane_class="ripr-failure"
          lane_job_id=""
          # Classification evidence is read only by report_lane_failure. When
          # the primary CX lane failed but the GitHub-hosted fallback
          # succeeded, the verdict path below only warns, so running the
          # bounded lookup/fetch retrieval here would spend real time on
          # every disk-preflight failover without producing evidence anyone
          # reads.
          if [ -n "$lane_name" ] && [ "$lane_result" != "success" ] && [ "$FALLBACK_RESULT" != "success" ]; then
            # Keep both retrieval phases inside the one job-level deadline.
            # The deadline was established before checkout/setup, reserving the
            # finalization interval for the verdict, summary, and artifact upload.
            bounded_gh_api() {
              local remaining
              remaining="$(remaining_until_deadline)"
              if [ "$remaining" -le 0 ]; then
                return 124
              fi
              local request_timeout=$remaining
              if [ "$request_timeout" -gt 30 ]; then
                request_timeout=30
              fi
              timeout --signal=TERM --kill-after=5s "${request_timeout}s" gh api "$@"
            }
            bounded_sleep() {
              local delay="$1"
              local remaining
              remaining="$(remaining_until_deadline)"
              if [ "$remaining" -le 0 ] || [ "$delay" -gt "$remaining" ]; then
                return 124
              fi
              sleep "$delay"
            }
            # The Actions jobs listing can briefly lag the lane result.
            # Keep this lookup bounded rather than silently skipping it.
            lane_lookup_output=$(mktemp)
            for attempt in 1 2 3 4 5; do
              if bounded_gh_api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
                --jq ".jobs[] | select(.name == \"${lane_name}\") | .id" > "$lane_lookup_output"; then
                lane_job_id=$(head -1 "$lane_lookup_output")
              else
                lane_job_id=""
              fi
              if [ -n "$lane_job_id" ]; then
                break
              fi
              if [ "$attempt" -lt 5 ]; then
                if ! bounded_sleep $((attempt * 5)); then
                  break
                fi
              fi
            done
            rm -f "$lane_lookup_output"
            if [ -n "$lane_job_id" ]; then
              # Fetch first and classify only on a complete successful read:
              # a partial log carrying a signature after a failed fetch must
              # never become infra-no-proof; retrieval failure stays
              # ripr-failure (#6807 follow-up).
              #
              # #12563 complement to #12771: the decision itself lives in the
              # unit-tested scripts/ci/classify-ripr-lane-termination so the
              # boundary — a genuine gap receipt ("quality gate failed; see
              # receipt") always outranks teardown markers; infra-no-proof
              # requires positive runner-teardown evidence — is pinned by the
              # fixture suite in ci-gate-self-tests. This block stays the ONE
              # classifier: it runs that script and hands its verdict to
              # ripr-infra-retry.yml strictly as data.
              lane_log=$(mktemp)
              fetched=false
              for attempt in 1 2 3 4 5; do
                if bounded_gh_api "repos/${GITHUB_REPOSITORY}/actions/jobs/${lane_job_id}/logs" > "$lane_log" 2>/dev/null; then
                  fetched=true
                  clf_out=$(bash scripts/ci/classify-ripr-lane-termination "$lane_log") || clf_out=""
                  printf '%s\n' "$clf_out"
                  clf_class=$(printf '%s\n' "$clf_out" | sed -n 's/^classification=//p' | head -1)
                  if [ "${clf_class:-}" = "infra-no-proof" ]; then
                    lane_class="infra-no-proof"
                  fi
                fi
                if [ "$fetched" = "true" ]; then
                  break
                fi
                if [ "$attempt" -lt 5 ]; then
                  if ! bounded_sleep $((attempt * 5)); then
                    break
                  fi
                fi
              done
              if [ "$fetched" != "true" ]; then
                # Retrieval failure is not evidence of an eviction. Preserve
                # the fail-closed class so ripr-infra-retry cannot arm, but
                # emit an explicit machine-readable classification and
                # diagnostic instead of silently skipping the classifier.
                printf '%s\n' "classification=ripr-failure"
                if [ "$(remaining_until_deadline)" -le 0 ]; then
                  echo "::warning::lane log for ${lane_name} (job ${lane_job_id}) reached the job-level retrieval deadline; eviction classification skipped and the gate will fail closed"
                else
                  echo "::warning::lane log for ${lane_name} (job ${lane_job_id}) was not retrievable after 5 attempts; eviction classification skipped and the gate will fail closed"
                fi
              fi
              rm -f "$lane_log"
            else
              printf '%s\n' "classification=ripr-failure"
              if [ "$(remaining_until_deadline)" -le 0 ]; then
                echo "::warning::job id for ${lane_name} reached the job-level retrieval deadline; eviction classification skipped and the gate will fail closed"
              else
                echo "::warning::job id for ${lane_name} was not retrievable after 5 attempts; eviction classification skipped and the gate will fail closed"
              fi
            fi
          fi
          report_lane_failure() {
            if [ "$lane_class" = "infra-no-proof" ]; then
              # Machine-checkable verdicts (#12563): every application of this
              # gate names its outcome class explicitly so reviewers and tooling
              # can audit the infra-no-verdict decision boundary.
              echo "RIPR_GATE_VERDICT=infra-no-proof"
              echo "RIPR_GATE_DECISION boundary=\"infra-no-proof needs positive runner-teardown evidence with no genuine gap receipt; a real red always reds; one automatic same-head retry max via ripr-infra-retry, then the manual path\""
              echo "::error::ripr lane \`${lane_name}\` was killed by the runner (infra-no-proof: shutdown signal / SIGTERM / API cancellation), NOT by a ripr source gap. No proof exists for ${GITHUB_SHA}. Safe same-head recovery: \`gh run rerun ${GITHUB_RUN_ID} --failed\` — the evaluated tree is unchanged by an infra kill, so a rerun re-runs this exact head (#6807, #12563)."
              # #6807 slice 2: hand the verdict to the bounded auto-retry
              # (ripr-infra-retry.yml) as data so there is exactly one
              # eviction classifier. The consumer greps fields; it must
              # never source this file.
              {
                echo "classification=infra-no-proof"
                echo "lane_name=${lane_name}"
                echo "lane_job_id=${lane_job_id:-unknown}"
                echo "head_sha=${GITHUB_SHA}"
                echo "router_target=${ROUTER_TARGET:-unknown}"
                echo "run_id=${GITHUB_RUN_ID}"
              } > ripr-gate-classification.env
              {
                echo "- classification: \`infra-no-proof (runner eviction)\`"
                echo "- lane: \`${lane_name}\` (job \`${lane_job_id:-unknown}\`)"
                echo "- head: \`${GITHUB_SHA}\`"
                echo "- rerun: \`gh run rerun ${GITHUB_RUN_ID} --failed\` (automatic bounded retry armed once; second eviction = manual path)"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "RIPR_GATE_VERDICT=ripr-failure"
              echo "::error::$1"
            fi
            exit 1
          }

          case "${ROUTER_TARGET:-}" in
            selfhosted)
              if [ "$SELFHOSTED_RESULT" = "success" ]; then
                : # Primary succeeded normally.
              elif [ "$FALLBACK_RESULT" = "success" ]; then
                # Disk-full preflight failover: fallback ran on GitHub-hosted.
                # Safe because fallback only triggers when preflight_ok=false.
                echo "::warning::Self-hosted disk preflight failed; ripr passed via GitHub-hosted fallback. Reclaim runner disk."
              else
                # Primary failed and fallback did not succeed (real ripr failure, or
                # fallback skipped because preflight wasn't the failure cause).
                report_lane_failure "ripr on the self-hosted rust-standard lane failed ($SELFHOSTED_RESULT); fallback result: $FALLBACK_RESULT"
              fi
              ;;
            github)
              if [ "$GITHUB_RESULT" != "success" ]; then
                report_lane_failure "ripr on GitHub-hosted did not succeed: $GITHUB_RESULT"
              fi
              ;;
            *)
              echo "::error::Unknown router target: ${ROUTER_TARGET:-<empty>}"
              exit 1
              ;;
          esac

          echo "RIPR_GATE_VERDICT=success"
          echo "ripr+ New Gap Gate: success (runner: ${ROUTER_TARGET:-unknown}, reason: ${ROUTER_REASON:-unknown})"

      # #6807 slice 2: on an infra-no-proof failure the evaluate step leaves
      # ripr-gate-classification.env for the bounded auto-retry workflow
      # (ripr-infra-retry.yml). Genuine ripr failures produce no file, which
      # is why a missing file is not an error here.
      - name: Upload gate classification
        if: failure()
        # New pin uses must carry the reviewed v7.0.1 projection; v7.0.0 is
        # recorded legacy debt and strict mode rejects it on changed lines.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ripr-gate-classification
          path: ripr-gate-classification.env
          retention-days: 1
          if-no-files-found: ignore
