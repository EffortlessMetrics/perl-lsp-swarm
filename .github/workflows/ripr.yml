# One GitHub-hosted RIPR qualification producer on actual native merge-group G.
# B is the immutable comparison operand, never evaluator authority.
# Cache seeding remains a separately governed main-only maintenance route.
# Required proof/guidance/receipt contracts stay on the surviving hosted producer.
name: ripr

on:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
    inputs:
      seed_cache:
        description: 'Seed the shared RIPR Cargo cache from canonical main/master'
        required: false
        default: false
        type: boolean

concurrency:
  group: ripr-${{ github.repository }}-${{ github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ripr-github:
    name: ripr+ on GitHub Hosted
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    # 135m (#15498 sequel): the guidance pass measured >30m on a 1600+-file
    # closure after the 40m analysis cap and the baseline receipt — the 75m
    # envelope SIGTERMed the guidance step mid-bound. The budget must hold
    # analysis + receipt + guidance + gate together, not guidance alone.
    timeout-minutes: 135
    outputs:
      subject_sha: ${{ steps.subject.outputs.subject_sha }}
      run_id: ${{ steps.subject.outputs.run_id }}
      run_attempt: ${{ steps.subject.outputs.run_attempt }}
    env:
      RIPR_VERSION: "0.10.0"
      RIPR_BASE_SHA: ${{ github.event.merge_group.base_sha }}
      RIPR_EVENT_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
      RIPR_EVALUATED_SHA: ${{ github.sha }}
      PR_HEAD_SHA: ''
      PR_LABELS: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.merge_group.head_sha }}

      - name: Verify merge-group source
        id: subject
        shell: bash
        env:
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${MERGE_GROUP_SHA:-}" =~ ^[0-9a-f]{40}$ ]] ||
            [ "$MERGE_GROUP_SHA" != "$GITHUB_SHA" ] ||
            [ "$(git rev-parse HEAD)" != "$MERGE_GROUP_SHA" ]; then
            echo '::error::RIPR checkout is not the exact native merge-group G: NOT_PROVEN.'
            exit 1
          fi
          if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]*$ ]] ||
            [[ ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::RIPR producer has no valid run/attempt identity: NOT_PROVEN.'
            exit 1
          fi
          {
            echo "subject_sha=$MERGE_GROUP_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Require immutable RIPR subject
        shell: bash
        run: bash scripts/ci/require-ripr-subject.sh

      - name: Prepare RIPR freshness handoff
        shell: bash
        run: |
          set -euo pipefail
          handoff="$(mktemp -d "$RUNNER_TEMP/ripr-freshness.XXXXXX")"
          mkdir -p "$handoff/xtask-builds"
          token="${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/$$"
          printf "RIPR_FRESHNESS_HANDOFF=%s\nRIPR_FRESHNESS_TOKEN=%s\n" "$handoff" "$token" >> "$GITHUB_ENV"

      - name: Toolchain (rust-toolchain.toml pins 1.95.0)
        run: rustc --version

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ripr-${{ env.RIPR_VERSION }}
          cache-workspace-crates: true
          # #12563: the old main-only save-if could never fire in this
          # workflow, so every hosted run cold-built ~6.5m into the
          # runner-eviction window. PR runs must stay restore-only
          # (docs/ci/cache-policy.md): PR-created caches are scoped to the PR
          # merge ref, cannot warm other PRs, and burn the 10 GB quota. Saves
          # come from the scheduled main-ref seed job (and a manual main-ref
          # dispatch) instead.
          # Analysis jobs restore the canonical seed but never publish shared state.
          save-if: ${{ false }}

      # #16126: ripr derives its fact cache from the workspace root, so it
      # lands inside the per-run checkout and never survives. Point it at the
      # runner's temp dir instead. Declared here rather than in the job's
      # `env:` because that is the shape ci.yml:827 already uses for a
      # per-runner path, and because `runner` is a step-level context -- no
      # other job-level `env:` in this repository reaches for it.
      - name: Point ripr's fact cache outside the workspace
        run: echo "RIPR_CACHE_DIR=$RUNNER_TEMP/ripr-facts" >> "$GITHUB_ENV"

      # #16126: the cargo cache above never covered ripr's own fact cache, so
      # the repo-wide scan rebuilt it from cold on every run -- ~31 minutes,
      # against ~25 seconds for the identical second scan later in this same
      # job. Restore-only here for the same reason as the step above: this is
      # a candidate-reachable job and docs/ci/cache-policy.md reserves writes
      # to the canonical main-ref seed.
      #
      # A coarse restore is sound because ripr's key is content-addressed:
      # RepoSeamCacheKey covers files_content_hash, cfg/features, config, test
      # intent, suppressions, analyzer and schema version and the seam limit,
      # and per-file FileFacts are keyed on (schema, analyzer, path, content).
      # A cache from another commit can only hit where the inputs are
      # byte-identical; anything else misses and recomputes. Corrupt entries
      # degrade to Miss. So this changes how long the answer takes, never
      # which answer it is.
      - name: Restore ripr fact cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ripr-facts
          key: ripr-facts-${{ env.RIPR_VERSION }}-${{ github.sha }}
          restore-keys: |
            ripr-facts-${{ env.RIPR_VERSION }}-

      - name: Install ripr
        run: cargo install ripr --version "$RIPR_VERSION" --locked

      - name: Check xtask build observer controls
        run: python3 scripts/tests/test_observe_xtask_build.py

      - name: Check hosted xtask build ordering
        run: python3 scripts/tests/test_ripr_host_build_order.py

      - name: Run ripr doctor
        run: ripr doctor

      - name: Generate PR evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/ripr/pr
          mkdir -p target/ripr/pr
          container_name="ripr-github-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}"
          cleanup_host_state() {
            status=$?
            set +e
            cleanup_failed=0
            container_id="$(timeout --signal=TERM --kill-after=5s 15s docker ps -aq --filter "name=^/${container_name}$" 2>/dev/null)"
            if [ "$?" -ne 0 ]; then
              echo "::error::failed to inspect hosted RIPR container during cleanup" >&2
              cleanup_failed=1
            elif [ -n "$container_id" ] && ! timeout --signal=TERM --kill-after=5s 15s docker rm -f "$container_name" >/dev/null 2>&1; then
              echo "::error::failed to stop hosted RIPR container during cleanup" >&2
              cleanup_failed=1
            fi
            if ! sudo -n chown -R "$(id -u):$(id -g)" target; then
              echo "::error::failed to restore hosted RIPR target ownership" >&2
              cleanup_failed=1
            fi
            if [ "$cleanup_failed" -ne 0 ] && [ "$status" -eq 0 ]; then
              status=1
            fi
            exit "$status"
          }
          trap cleanup_host_state EXIT
          printf "runner=github-hosted\njob_phase=host-start\n" > target/ripr/pr/ripr-measurement-config.txt
          image='rust:1.95-slim-bookworm'
          set +e
          timeout --signal=TERM --kill-after=10s 3m docker pull "$image"
          pull_status=$?
          set -e
          printf "pull_exit=%s\n" "$pull_status" >> target/ripr/pr/ripr-measurement-config.txt
          if [ "$pull_status" -ne 0 ]; then exit "$pull_status"; fi
          set +e
          image_id="$(timeout --signal=TERM --kill-after=5s 15s docker image inspect --format '{{.Id}}' "$image")"
          inspect_id_status=$?
          image_digest="$(timeout --signal=TERM --kill-after=5s 15s docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          inspect_digest_status=$?
          set -e
          printf "inspect_id_exit=%s\ninspect_digest_exit=%s\n" "$inspect_id_status" "$inspect_digest_status" >> target/ripr/pr/ripr-measurement-config.txt
          if [ "$inspect_id_status" -ne 0 ] || [ "$inspect_digest_status" -ne 0 ]; then exit 1; fi
          printf "image_id=%s\nimage_digest=%s\n" "$image_id" "$image_digest" >> target/ripr/pr/ripr-measurement-config.txt
          set +e
          # #15498: the admission boundary must stay explicit and paired with a
          # container budget measured to hold it. 1600-file closures indexed
          # inside 6g, i.e. <=3.75 MB per file; 2560 files therefore needs
          # ~9.6 GB of analysis memory, so the container gets 14g of this
          # 16 GB runner (2 GB stays with the host). 2560 still refuses a
          # whole-tree index (~4080 files, ~15 GB) — the guard stays bounded.
          # Do not lower the container budget without lowering the file cap:
          # an oversized closure must fail closed as diff_scope_oversized,
          # never as an OOM kill.
          timeout --signal=TERM --kill-after=30s 40m docker run --rm --name "$container_name" \
            --cpus=4 --memory=14g --memory-swap=14g \
            -e RIPR_VERSION -e PR_HEAD_SHA \
            -e RIPR_BASE_SHA -e RIPR_EVENT_HEAD_SHA -e RIPR_EVALUATED_SHA \
            -e GITHUB_EVENT_NAME \
            -e RIPR_MAX_DIFF_INDEX_FILES=2560 \
            -e RIPR_FRESHNESS_HANDOFF=/freshness -e RIPR_FRESHNESS_TOKEN \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            -e MEASUREMENT_IMAGE_ID="$image_id" -e MEASUREMENT_IMAGE_DIGEST="$image_digest" \
            -v "$GITHUB_WORKSPACE:/workspace" -v "$RIPR_FRESHNESS_HANDOFF:/freshness" \
            -w /workspace "$image_id" bash -euo pipefail -c '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev git curl jq time
              git config --global --add safe.directory /workspace
              mkdir -p target/ripr/pr
              printf "job_phase=container-tools-start\n" >> target/ripr/pr/ripr-measurement-config.txt
              bash scripts/ci/require-ripr-subject.sh
              base_arg="$RIPR_BASE_SHA"
              cargo install ripr --version "$RIPR_VERSION" --locked
              rustc_version="$(rustc --version)"; cargo_version="$(cargo --version)"
              ripr_version="$(ripr --version)"; ripr_path="$(command -v ripr)"
              ripr_sha256="$(sha256sum "$ripr_path" | cut -d " " -f 1)"
              {
                printf "docker_memory=14g\ndocker_memory_swap=14g\nsource_head_sha=%s\nsource_base_ref=%s\n" "$(git rev-parse HEAD)" "$base_arg"
                printf "head=%s\nbase=%s\nripr_version=%s\nripr_sha256=%s\nindex_limit=%s\n" "$(git rev-parse HEAD)" "$base_arg" "$ripr_version" "$ripr_sha256" "$RIPR_MAX_DIFF_INDEX_FILES"
                printf "%s\n%s\n" "$rustc_version" "$cargo_version"
              } >> target/ripr/pr/ripr-measurement-config.txt
              bash scripts/ci/observe-xtask-build.sh container "$RIPR_FRESHNESS_HANDOFF/xtask-builds" -- cargo build -p xtask --locked
              ripr doctor
              set +e
              timeout --signal=TERM --kill-after=30s 25m /usr/bin/time -v -o target/ripr/pr/ripr-measurement-time.txt cargo xtask ripr-pr --base "$base_arg" --head "$RIPR_EVALUATED_SHA" --pr-head "$PR_HEAD_SHA"
              analysis_status=$?
              set -e
              printf "analysis_exit=%s\n" "$analysis_status" >> target/ripr/pr/ripr-measurement-config.txt
              if [ "$analysis_status" -ne 0 ]; then exit "$analysis_status"; fi
              test -s target/ripr/pr/repo-exposure.json
              cargo xtask ripr-pr --base "$base_arg" --head "$RIPR_EVALUATED_SHA" --pr-head "$PR_HEAD_SHA" --check
              marker="$RIPR_FRESHNESS_HANDOFF/clear-succeeded"
              test -f "$marker" && test "$(cat "$marker")" = "$RIPR_FRESHNESS_TOKEN"
            '
          container_status=$?
          set -e
          printf "container_exit=%s\n" "$container_status" >> target/ripr/pr/ripr-measurement-config.txt
          exit "$container_status"

      # Build host artifacts after the container writes the shared target tree.
      - name: Build xtask
        run: bash scripts/ci/observe-xtask-build.sh host-initial "$RIPR_FRESHNESS_HANDOFF/xtask-builds" -- cargo build -p xtask --locked

      # #16431: the repo-wide RIPR+ receipt is a function of the checked-out
      # HEAD tree alone -- it embeds `head: <current_head>` and every consumer
      # head-binds it (`ripr-plus --check` byte-compares; the quality gate
      # marks a receipt `stale` unless its head matches) -- so a re-run of the
      # same head can restore the receipt instead of recomputing the
      # whole-workspace seam/closure scan (~44m on 2026-09-25 against ~33s
      # warm). The key pins the full content identity: toolchain version,
      # exact head sha, suppression-ledger hash. The `restore-keys` prefix
      # mirrors the fact-cache shape above, but a prefix hit restores a
      # DIFFERENT head's receipt, so only an exact-key hit may be consumed --
      # the adjudicator below translates the action's exact-match-only
      # `cache-hit` output into the env var the receipt step guards on, and
      # the produce branch simply overwrites whatever a prefix hit restored.
      - name: Restore memoized ripr-plus receipt
        id: ripr-plus-receipt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/receipts/quality/ripr-plus.json
          key: ripr-plus-receipt-v1-${{ env.RIPR_VERSION }}-${{ github.sha }}-${{ hashFiles('policy/ripr-suppressions.toml') }}
          restore-keys: |
            ripr-plus-receipt-v1-${{ env.RIPR_VERSION }}-

      # `actions/cache/restore` reports `cache-hit=true` only when the exact
      # primary key matched; a `restore-keys` prefix match restores another
      # head's entry with `cache-hit=false`. Bridge that decision into the
      # environment so the receipt step's guard stays plain bash and can
      # never consume a receipt for a head other than the one checked out.
      # The action output rides `env:` as data, not interpreter source
      # (workflow-security ratchet).
      - name: Adjudicate receipt cache exactness
        if: always()
        env:
          RIPR_RECEIPT_CACHE_MATCHED: ${{ steps.ripr-plus-receipt-cache.outputs.cache-hit }}
          RIPR_RECEIPT_CACHE_MATCHED_KEY: ${{ steps.ripr-plus-receipt-cache.outputs.cache-matched-key }}
        run: |
          if [ "$RIPR_RECEIPT_CACHE_MATCHED" = "true" ] && [ -f target/receipts/quality/ripr-plus.json ]; then
            echo "RIPR_RECEIPT_CACHE_HIT=true" >> "$GITHUB_ENV"
            echo "exact-head memoized receipt restored: $RIPR_RECEIPT_CACHE_MATCHED_KEY"
          else
            echo "RIPR_RECEIPT_CACHE_HIT=false" >> "$GITHUB_ENV"
            echo "no exact-head receipt cache hit; the receipt step will produce fresh"
          fi

      - name: Generate repo-wide RIPR+ baseline receipt
        if: always()
        # #16431: consume the memoized receipt only on an exact-head hit;
        # otherwise produce fresh. Either way the mandatory handshake stays
        # the `ripr-plus --check` byte-compare in "Validate PR evidence
        # contracts" below -- any byte drift or head mismatch fails closed
        # exactly as before, with no auto-regenerate-and-retry. The freshness
        # marker records "this run produced the receipt itself" so the save
        # step at the end of the job never re-publishes a restored receipt.
        run: |
          if [ -f target/receipts/quality/ripr-plus.json ] && [ "${RIPR_RECEIPT_CACHE_HIT:-}" = "true" ]; then
            echo "head-memoized receipt restored; validating"
            rm -f target/receipts/quality/.ripr-plus-fresh
          else
            bash scripts/ci/observe-xtask-build.sh host-baseline "$RIPR_FRESHNESS_HANDOFF/xtask-builds" -- cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json
            mkdir -p target/receipts/quality
            printf 'produced-fresh head=%s\n' "$(git rev-parse HEAD)" > target/receipts/quality/.ripr-plus-fresh
          fi

      - name: Record exact RIPR badge producer
        if: always()
        run: |
          mkdir -p target/receipts/quality
          printf '{"schema_version":1,"kind":"ripr_badge_producer","head":"%s","root":".","source_format":"ripr-plus repo-badge-json","ripr_version":"%s"}\n' "$(git rev-parse HEAD)" "$RIPR_VERSION" > target/receipts/quality/ripr-badge-producer.json

      - name: Generate review guidance
        if: always()
        # 1800s: the guidance pass on a new-crate diff no longer completes in
        # 600s on the hosted lane — #15082 and #15028 both failed the required
        # ripr+ New Gap Gate twice with review_guidance.status=incomplete,
        # turning 64-67 mechanical no_static_path seams into unadjudicated
        # gaps because static-limitation credit is only paid from a completed
        # receipt. 3600s: #14897 then measured the guidance pass itself
        # exceeding 1800s on a 1600+-file closure (xtask SIGTERMed the ripr
        # child at the bound, exit 143), so the bound is raised together with
        # the 135m job envelope — analysis 40m + receipt + guidance 60m fits,
        # and an incomplete receipt keeps failing closed, just later.
        # #18428: this pass is the one lane workload with no memory envelope
        # (the analysis container above is capped at 14g). Both examined kills
        # (jobs 124028039451 and 124544802140) show the guidance child at
        # ~15 GiB RSS with the 16 GB host down to 44-100 MiB free before the
        # runner died at exit 143 — host-memory exhaustion read as runner
        # eviction, which armed the infra retry and fed a same-head rerun
        # loop. Run the pass inside a transient cgroup scope with the same
        # 14g / no-swap budget as the container (systemd is PID 1 on
        # ubuntu-24.04), so an oversized pass is OOM-killed inside the lane:
        # SIGKILL (exit 137) carries no runner-teardown marker, so the
        # classifier fails closed to ripr-failure and never arms the retry.
        # The envelope itself fails closed — if sudo -n or systemd-run cannot
        # create the scope the step reds rather than running unbounded.
        # --setenv forwards the step environment sudo strips (names filtered
        # to what systemd accepts); --uid/--gid keep target/ runner-owned for
        # the host steps that follow. Same command and 3600s bound as before.
        shell: bash
        run: |
          scope_env=()
          while IFS= read -r -d '' pair; do
            if [[ "$pair" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then scope_env+=("--setenv=$pair"); fi
          done < <(env -0)
          sudo -n systemd-run --scope -p MemoryMax=14G -p MemorySwapMax=0 \
            --uid="$(id -un)" --gid="$(id -gn)" "${scope_env[@]}" -- \
            bash scripts/ci/observe-xtask-build.sh host-guidance "$RIPR_FRESHNESS_HANDOFF/xtask-builds" -- cargo xtask ripr-review-comments --base "$RIPR_BASE_SHA" --head "$RIPR_EVALUATED_SHA" --pr-head "$PR_HEAD_SHA" --timeout-seconds 3600

      - name: Generate impacted evidence
        if: always()
        run: cargo xtask impacted-evidence --labels-csv "$PR_LABELS"

      - name: Generate PR evidence summary
        if: always()
        run: cargo xtask ripr-pr-summary

      - name: Generate warning annotations
        if: always()
        run: cargo xtask ripr-annotations

      # Advisory: reports the suppression ledger's own expires/review_after
      # dates, which nothing else in the toolchain reads. Never gates.
      - name: Audit suppression lifecycle
        if: always()
        continue-on-error: true
        run: cargo xtask ripr-suppression-audit

      - name: Validate PR evidence contracts
        if: always()
        run: |
          marker="$RIPR_FRESHNESS_HANDOFF/clear-succeeded"
          if [ ! -f "$marker" ] || [ "$(cat "$marker")" != "$RIPR_FRESHNESS_TOKEN" ]; then
            echo "RIPR artifact invalidation did not complete for this producer invocation" >&2
            exit 1
          fi
          bash scripts/ci/require-ripr-subject.sh
          cargo xtask ripr-pr --base "$RIPR_BASE_SHA" --head "$RIPR_EVALUATED_SHA" --pr-head "$PR_HEAD_SHA" --check
          cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json --check
          cargo xtask ripr-review-comments --base "$RIPR_BASE_SHA" --head "$RIPR_EVALUATED_SHA" --pr-head "$PR_HEAD_SHA" --check
          cargo xtask impacted-evidence --labels-csv "$PR_LABELS" --check
          cargo xtask ripr-pr-summary --check
          cargo xtask ripr-annotations --check

      - name: Enforce new RIPR gap quality gate
        if: always()
        run: |
          marker="$RIPR_FRESHNESS_HANDOFF/clear-succeeded"
          if [ ! -f "$marker" ] || [ "$(cat "$marker")" != "$RIPR_FRESHNESS_TOKEN" ]; then
            echo "RIPR artifact invalidation did not complete for this producer invocation" >&2
            exit 1
          fi
          cargo xtask quality-gate \
            --mode enforce-new-ripr \
            --ripr-receipt target/receipts/quality/ripr-plus.json \
            --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
            --review-receipt target/ripr/review/comments.json \
            --ripr-base "$RIPR_BASE_SHA" \
            --ripr-head "$RIPR_EVALUATED_SHA" \
            --ripr-pr-head "$PR_HEAD_SHA" \
            --receipt target/receipts/quality/quality-gate-ripr.json \
            --summary target/receipts/quality/quality-gate-ripr.md
          cargo xtask quality-gate \
            --mode enforce-new-ripr \
            --ripr-receipt target/receipts/quality/ripr-plus.json \
            --ripr-pr-receipt target/ripr/pr/repo-exposure.json \
            --review-receipt target/ripr/review/comments.json \
            --ripr-base "$RIPR_BASE_SHA" \
            --ripr-head "$RIPR_EVALUATED_SHA" \
            --ripr-pr-head "$PR_HEAD_SHA" \
            --receipt target/receipts/quality/quality-gate-ripr.json \
            --summary target/receipts/quality/quality-gate-ripr.md \
            --check

      - name: Append PR evidence summary
        if: always()
        shell: bash
        run: |
          marker="${RIPR_FRESHNESS_HANDOFF:-}/clear-succeeded"
          if [ ! -f "$marker" ] || [ "$(cat "$marker")" != "${RIPR_FRESHNESS_TOKEN:-}" ]; then
            echo "RIPR freshness handoff unavailable; suppressing stale summary and annotations."
            exit 0
          fi
          if [ -f target/ripr/pr/summary.md ]; then
            cat target/ripr/pr/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR PR evidence summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/receipts/quality/quality-gate-ripr.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat target/receipts/quality/quality-gate-ripr.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No RIPR quality-gate summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/ripr/suppressions/lifecycle-audit.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat target/ripr/suppressions/lifecycle-audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/ripr/review/annotations.txt ]; then
            cat target/ripr/review/annotations.txt
          fi

      - name: Record RIPR freshness handoff result
        id: ripr-freshness-result
        if: always()
        shell: bash
        run: |
          marker="$RIPR_FRESHNESS_HANDOFF/clear-succeeded"
          if [ -f "$marker" ] && [ "$(cat "$marker")" = "$RIPR_FRESHNESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No successful artifact invalidation handoff; stale RIPR files will not be uploaded."
          fi

      - name: Upload ripr PR evidence
        if: always() && steps.ripr-freshness-result.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: ripr-pr-evidence
          path: |
            target/ripr/pr/**
            target/ripr/review/**
            target/xtask/impacted-evidence/**
            target/receipts/quality/ripr-plus.json
            target/receipts/quality/ripr-badge-producer.json
            target/receipts/quality/quality-gate-ripr.json
            target/receipts/quality/quality-gate-ripr.md
          retention-days: 14
          if-no-files-found: error

      # Diagnostic data has no receipt/gate authority. Keep its artifact separate
      # so the trusted freshness handshake and proof archive layout stay intact.
      - name: Upload xtask build observations
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ripr-xtask-build-observations
          path: ${{ env.RIPR_FRESHNESS_HANDOFF }}/xtask-builds/**
          retention-days: 7
          if-no-files-found: warn

      # #16431: publish the freshly produced receipt under its exact head key
      # so a re-run of the same head restores it (~44m -> ~33s warm). The
      # freshness marker exists only when this run produced the receipt
      # itself, so a restored receipt is never re-saved. GitHub scopes
      # PR-branch caches to that PR: this memoizes re-runs of the same head
      # -- the dominant failure mode per #16431 -- and cannot warm other
      # PRs. docs/ci/cache-policy.md § "Exact-head RIPR+ receipt
      # memoization" records the reviewed compensating controls for this
      # candidate-reachable writer.
      - name: Save memoized ripr-plus receipt
        if: success() && hashFiles('target/receipts/quality/.ripr-plus-fresh') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/receipts/quality/ripr-plus.json
          key: ripr-plus-receipt-v1-${{ env.RIPR_VERSION }}-${{ github.sha }}-${{ hashFiles('policy/ripr-suppressions.toml') }}

  # Main-only cache maintenance; not qualification evidence.
  seed-cache:
    name: Seed ripr rust cache
    if: >-
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.seed_cache == true)) &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    # 90m (#16126): was 45m for install + xtask build (~7m). This job now also
    # runs the repo-wide scan once, which is the ~31m the analysis lanes were
    # each paying from cold. 90m holds both with the same headroom 45m gave the
    # original pair.
    timeout-minutes: 90
    env:
      RIPR_VERSION: "0.10.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Toolchain (rust-toolchain.toml pins 1.95.0)
        run: rustc --version

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          cache-workspace-crates: true
          shared-key: ripr-${{ env.RIPR_VERSION }}
          save-if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.seed_cache == true)) && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}

      - name: Install ripr
        run: cargo install ripr --version "$RIPR_VERSION" --locked

      - name: Build xtask
        run: cargo build -p xtask --locked

      # #16126: ripr derives its fact cache from the workspace root, so it
      # lands inside the per-run checkout and never survives. Point it at the
      # runner's temp dir instead. Declared here rather than in the job's
      # `env:` because that is the shape ci.yml:827 already uses for a
      # per-runner path, and because `runner` is a step-level context -- no
      # other job-level `env:` in this repository reaches for it.
      - name: Point ripr's fact cache outside the workspace
        run: echo "RIPR_CACHE_DIR=$RUNNER_TEMP/ripr-facts" >> "$GITHUB_ENV"

      # #16126: until now this job warmed only the cargo cache, so ripr's own
      # fact cache had no writer anywhere and every analysis lane paid the cold
      # ~31 minutes. Run the repo-wide scan once here, on main, so the lanes
      # restore it. This is the same command ripr.yml already runs twice per
      # analysis job; it produces no receipt anyone consumes from this job.
      - name: Warm the ripr fact cache
        run: |
          # The gap verdict belongs to the analysis lanes and the required
          # check, not to the seeder -- the lanes already spell this the same
          # way, guarding generation with `|| RIPR_FAILED=1` so a finding still
          # yields artifacts. A finding here must not cost the whole warm
          # cache, and a partial scan still leaves sound entries: each one is
          # keyed on its own content, so a later lane hits only where the
          # inputs match and recomputes everything else.
          status=0
          cargo xtask ripr-plus --receipt target/receipts/quality/ripr-plus.json || status=$?
          echo "repo-wide scan exit: $status"

      # Read the size into the log. docs/ci/cache-policy.md budgets against a
      # 10 GB account-wide quota and this entry's size on this repository was
      # unmeasured when the step was written; the first seed run answers it.
      - name: Report fact cache size
        if: always()
        run: |
          if [ -d "$RIPR_CACHE_DIR" ]; then
            echo "ripr fact cache: $(du -sh "$RIPR_CACHE_DIR" | cut -f1)"
            echo "entries: $(find "$RIPR_CACHE_DIR" -type f | wc -l)"
          else
            echo "ripr fact cache: absent at $RIPR_CACHE_DIR"
          fi

      # docs/ci/cache-policy.md § Direct cache-save actions: "An explicit writer
      # such as `actions/cache/save` must carry its own trusted event/ref
      # guard." The job's `if:` already restricts this job to a scheduled or
      # opted-in dispatch on a canonical ref, and the cache inventory reads that
      # as `job_static_exclusion` -- but the policy asks the writer to state its
      # own authority rather than inherit it, and the rust-cache step above
      # already repeats the guard for the same reason. Same spelling, so the two
      # writers in this job cannot drift apart.
      - name: Save ripr fact cache
        if: >-
          (github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.seed_cache == true)) &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ripr-facts
          key: ripr-facts-${{ env.RIPR_VERSION }}-${{ github.sha }}

  ripr:
    name: ripr+ New Gap Gate
    needs: [ripr-github]
    if: always() && github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    # #16431: the retrieval budget is 660s minus the 60s finalization reserve
    # (~600s of bounded log/annotation retrieval). The previous 300s budget
    # expired before run 35507463908's evicted lane log — which carried the
    # shutdown marker — became retrievable, so the gate could only fail
    # closed. The job must outlive the evaluator deadline plus checkout.
    timeout-minutes: 12
    env:
      # Start the evaluator's clock before checkout/setup so those steps cannot
      # consume the verdict, summary, and artifact-upload reserve.
      RIPR_GATE_TIMEOUT_SECONDS: 660
      RIPR_GATE_FINALIZATION_RESERVE_SECONDS: 60
    permissions:
      contents: read
      # #6807: read the failed lane's job log to classify runner evictions.
      actions: read
      # Read current-attempt lane annotations for failure classification.
      checks: read
    steps:
      - name: Establish gate deadline
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          finalize_setup_failure() {
            echo "RIPR_GATE_VERDICT=ripr-failure"
            echo "::error::ripr gate deadline setup was interrupted; failing closed"
            {
              echo ""
              echo "### ripr+ New Gap Gate Finalization"
              echo "- verdict: ripr-failure"
              echo "- reason: deadline setup was interrupted before evaluation"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          trap 'finalize_setup_failure; exit 1' TERM INT

          started_at="$(date +%s)"
          gate_deadline=$((started_at + RIPR_GATE_TIMEOUT_SECONDS - RIPR_GATE_FINALIZATION_RESERVE_SECONDS))
          if [ "$gate_deadline" -le "$started_at" ]; then
            finalize_setup_failure
            exit 1
          fi
          {
            echo "RIPR_GATE_DEADLINE_EPOCH=$gate_deadline"
            echo "RIPR_GATE_FINALIZATION_RESERVE_SECONDS=$RIPR_GATE_FINALIZATION_RESERVE_SECONDS"
          } >> "$GITHUB_ENV"
          echo "ripr_gate_deadline_epoch=$gate_deadline"
          echo "ripr_gate_finalization_reserve_seconds=$RIPR_GATE_FINALIZATION_RESERVE_SECONDS"

      # The aggregator classifies lane termination through the shared,
      # unit-tested classifier in scripts/ci/ (#6807, #12563, complementing
      # #12771's bounded auto-retry handoff).
      # B/G are subjects only. Select protected immutable main T from
      # independent repository, branch-protection and ref reads.
      # This bootstrap still needs outer trusted-workflow/App generation
      # enforcement; G-authored workflow source cannot authenticate itself.
      - name: Resolve protected main evaluator generation
        id: evaluator
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = 'EffortlessMetrics', repo = 'perl-lsp-swarm', branch = 'main';
            const fullName = owner + '/' + repo;
            const eventRepo = context.payload.repository;
            if (context.eventName !== 'merge_group' || context.payload.action !== 'checks_requested' ||
                context.repo.owner !== owner || context.repo.repo !== repo ||
                eventRepo?.full_name !== fullName || !Number.isSafeInteger(eventRepo.id) || eventRepo.id <= 0 ||
                typeof eventRepo.node_id !== 'string' || !eventRepo.node_id ||
                context.payload.merge_group?.base_ref !== 'refs/heads/main') {
              throw new Error('NOT_PROVEN: native repository/main identity required');
            }
            const {data: repository} = await github.rest.repos.get({owner, repo});
            const {data: protectedBranch} = await github.rest.repos.getBranch({owner, repo, branch});
            const {data: ref} = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
            const sha = protectedBranch.commit?.sha;
            if (repository.full_name !== fullName || repository.id !== eventRepo.id ||
                repository.node_id !== eventRepo.node_id || repository.default_branch !== branch ||
                protectedBranch.name !== branch || protectedBranch.protected !== true ||
                typeof sha !== 'string' || !/^[0-9a-f]{40}$/.test(sha) ||
                ref.ref !== 'refs/heads/main' || ref.object?.type !== 'commit' || ref.object?.sha !== sha) {
              throw new Error('NOT_PROVEN: protected immutable evaluator generation unavailable');
            }
            core.setOutput('sha', sha);
      - name: Checkout decision scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.evaluator.outputs.sha }}
          fetch-depth: 1

      - name: Record decision authority
        shell: bash
        env:
          SELECTED_DECISION_SHA: ${{ steps.evaluator.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${SELECTED_DECISION_SHA:-}" =~ ^[0-9a-f]{40}$ ]] ||
            [ "$(git rev-parse HEAD)" != "$SELECTED_DECISION_SHA" ]; then
            echo '::error::RIPR decision checkout differs from protected T: NOT_PROVEN.'
            exit 1
          fi
          echo "RIPR_DECISION_SHA=$SELECTED_DECISION_SHA" >> "$GITHUB_ENV"

      - name: Revalidate protected decision authority before evaluation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = 'EffortlessMetrics', repo = 'perl-lsp-swarm', branch = 'main';
            const fullName = owner + '/' + repo;
            const eventRepo = context.payload.repository;
            if (context.eventName !== 'merge_group' || context.payload.action !== 'checks_requested' ||
                context.repo.owner !== owner || context.repo.repo !== repo ||
                eventRepo?.full_name !== fullName || !Number.isSafeInteger(eventRepo.id) || eventRepo.id <= 0 ||
                typeof eventRepo.node_id !== 'string' || !eventRepo.node_id ||
                context.payload.merge_group?.base_ref !== 'refs/heads/main') {
              throw new Error('NOT_PROVEN: native repository/main identity required');
            }
            const {data: repository} = await github.rest.repos.get({owner, repo});
            const {data: protectedBranch} = await github.rest.repos.getBranch({owner, repo, branch});
            const {data: ref} = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
            const sha = protectedBranch.commit?.sha;
            if (repository.full_name !== fullName || repository.id !== eventRepo.id ||
                repository.node_id !== eventRepo.node_id || repository.default_branch !== branch ||
                protectedBranch.name !== branch || protectedBranch.protected !== true ||
                typeof sha !== 'string' || !/^[0-9a-f]{40}$/.test(sha) ||
                ref.ref !== 'refs/heads/main' || ref.object?.type !== 'commit' || ref.object?.sha !== sha) {
              throw new Error('NOT_PROVEN: protected immutable evaluator generation unavailable');
            }
            if (sha !== process.env.RIPR_DECISION_SHA) {
              throw new Error('NOT_PROVEN: protected main decision generation changed');
            }
            const {execFileSync} = require('node:child_process');
            const env = Object.fromEntries(Object.entries(process.env).filter(([key]) => !key.startsWith('GIT_')));
            Object.assign(env, {GIT_CONFIG_NOSYSTEM: '1', GIT_CONFIG_GLOBAL: '/dev/null',
              GIT_CONFIG_SYSTEM: '/dev/null', GIT_NO_REPLACE_OBJECTS: '1'});
            const head = execFileSync('git', ['rev-parse', 'HEAD'], {env, encoding: 'utf8'}).trim();
            const dirty = execFileSync('git', ['status', '--porcelain', '--untracked-files=no'], {env, encoding: 'utf8'}).trim();
            if (head !== sha || dirty) {
              throw new Error('NOT_PROVEN: decision checkout custody differs from protected T');
            }

      - name: Evaluate hosted result
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
          PROOF_SHA: ${{ needs.ripr-github.outputs.subject_sha }}
          PROOF_RUN_ID: ${{ needs.ripr-github.outputs.run_id }}
          PROOF_RUN_ATTEMPT: ${{ needs.ripr-github.outputs.run_attempt }}
          GITHUB_RESULT: ${{ needs.ripr-github.result }}
          # gh authenticates through GH_TOKEN/GITHUB_TOKEN; without this the
          # eviction log inspection below always fails closed to ripr-failure.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gate_finalized=false
          finalize_on_termination() {
            if [ "$gate_finalized" = "true" ]; then
              return
            fi
            gate_finalized=true
            echo "RIPR_GATE_VERDICT=ripr-failure"
            echo "::error::ripr gate evaluator received TERM/INT before a terminal verdict; failing closed"
            {
              echo ""
              echo "### ripr+ New Gap Gate Finalization"
              echo "- verdict: ripr-failure"
              echo "- reason: evaluator termination before verdict completion"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          trap 'finalize_on_termination; exit 1' TERM INT

          gate_deadline="${RIPR_GATE_DEADLINE_EPOCH:-}"
          if ! [[ "$gate_deadline" =~ ^[0-9]+$ ]]; then
            finalize_on_termination
            exit 1
          fi
          now="$(date +%s)"
          if [ "$now" -ge "$gate_deadline" ]; then
            echo "::warning::ripr gate setup consumed the evaluator deadline; no retrieval was attempted"
            finalize_on_termination
            exit 1
          fi

          if [ "${EVENT_NAME:-}" != merge_group ] ||
            [[ ! "${MERGE_GROUP_SHA:-}" =~ ^[0-9a-f]{40}$ ]] ||
            [ "$MERGE_GROUP_SHA" != "${GITHUB_SHA:-}" ]; then
            echo '::error::RIPR proof is not bound to native G: NOT_PROVEN.'
            exit 1
          fi
          if [[ ! "${RIPR_DECISION_SHA:-}" =~ ^[0-9a-f]{40}$ ]] ||
            [ "$(git rev-parse HEAD)" != "$RIPR_DECISION_SHA" ]; then
            echo '::error::RIPR trusted decision snapshot unavailable: NOT_PROVEN.'
            exit 1
          fi
          echo "- decision authority: $RIPR_DECISION_SHA" >> "$GITHUB_STEP_SUMMARY"

          remaining_until_deadline() {
            local now
            now="$(date +%s)"
            echo $((gate_deadline - now))
          }

          # #16980: a cancelled lane is still blocking, but must reach the
          # current-attempt job/annotation lookup before naming its cause and
          # writing the attempt-bound classification artifact. A configured
          # 135-minute timeout has a specific platform annotation; absent that
          # evidence, cancellation remains cancelled-no-verdict (#5460).
          cancelled_result_seen=false
          if [ "${GITHUB_RESULT:-}" = cancelled ]; then cancelled_result_seen=true; fi
          lane_name="ripr+ on GitHub Hosted"
          lane_result="${GITHUB_RESULT:-}"
          lane_class="ripr-failure"
          if [ "$cancelled_result_seen" = "true" ]; then
            lane_class="cancelled-no-verdict"
          fi
          lane_gap_hits=0
          lane_evidence_source="unavailable"
          lane_job_id=""
          if [ "$lane_result" != "success" ]; then
            # Keep both retrieval phases inside the one job-level deadline.
            # The deadline was established before checkout/setup, reserving the
            # finalization interval for the verdict, summary, and artifact upload.
            bounded_gh_api_until() {
              local cutoff="$1"
              shift
              local remaining
              remaining=$((cutoff - $(date +%s)))
              if [ "$remaining" -le 0 ]; then
                return 124
              fi
              local request_timeout=$remaining
              if [ "$request_timeout" -gt 30 ]; then
                request_timeout=30
              fi
              timeout --signal=TERM --kill-after=5s "${request_timeout}s" gh api "$@"
            }
            bounded_gh_api() {
              bounded_gh_api_until "$gate_deadline" "$@"
            }
            bounded_sleep_until() {
              local cutoff="$1" delay="$2"
              local remaining
              remaining=$((cutoff - $(date +%s)))
              if [ "$remaining" -le 0 ] || [ "$delay" -gt "$remaining" ]; then
                return 124
              fi
              sleep "$delay"
            }
            bounded_sleep() {
              bounded_sleep_until "$gate_deadline" "$1"
            }
            # #14774: the bound on both retrieval phases is the gate's own
            # budget, not a fixed attempt count. A five-attempt schedule of
            # 5+10+15+20 spends ~50s, and a request that fails fast returns
            # almost immediately, so on a freshly evicted lane the loop gave
            # up ~180s short of the deadline the gate had already reserved —
            # before the window in which the log becomes retrievable. The
            # deadline stays the single hard stop and every exit below still
            # routes to the same fail-closed verdict.
            RETRIEVAL_BACKOFF_CAP_SECONDS=15
            next_backoff() {
              local attempt="$1" delay
              delay=$((attempt * 5))
              if [ "$delay" -gt "$RETRIEVAL_BACKOFF_CAP_SECONDS" ]; then
                delay="$RETRIEVAL_BACKOFF_CAP_SECONDS"
              fi
              printf '%s\n' "$delay"
            }
            # Cancelled jobs can expose the configured timeout only through
            # their check-run annotation. Reserve the final 120 seconds for
            # that API lookup: both the lane lookup and the log fetch below
            # stop at this earlier cutoff so a lagging jobs API cannot
            # consume the annotation window before the cutoff applies.
            log_fetch_deadline="$gate_deadline"
            if [ "$lane_result" = "cancelled" ]; then
              log_fetch_deadline=$((gate_deadline - 120))
            fi
            # The Actions jobs listing can briefly lag the lane result.
            # Keep this lookup bounded rather than silently skipping it.
            lane_lookup_output=$(mktemp)
            lane_lookup_attempts=0
            while [ "$((log_fetch_deadline - $(date +%s)))" -gt 0 ]; do
              lane_lookup_attempts=$((lane_lookup_attempts + 1))
              if bounded_gh_api_until "$log_fetch_deadline" "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
                --jq ".jobs[] | select(.name == \"${lane_name}\") | .id" > "$lane_lookup_output"; then
                lane_job_id=$(head -1 "$lane_lookup_output")
              else
                lane_job_id=""
              fi
              if [ -n "$lane_job_id" ]; then
                break
              fi
              if ! bounded_sleep_until "$log_fetch_deadline" "$(next_backoff "$lane_lookup_attempts")"; then
                break
              fi
            done
            rm -f "$lane_lookup_output"
            if [ -n "$lane_job_id" ]; then
              # Fetch first and classify only on a complete successful read:
              # a partial log carrying a signature after a failed fetch must
              # never become infra-no-proof; retrieval failure stays
              # ripr-failure (#6807 follow-up).
              #
              # #12563 complement to #12771: the decision itself lives in the
              # unit-tested scripts/ci/classify-ripr-lane-termination so the
              # boundary — a genuine gap receipt ("quality gate failed; see
              # receipt") always outranks teardown markers; infra-no-proof
              # requires positive runner-teardown evidence — is pinned by the
              # fixture suite in ci-gate-self-tests. This block stays the ONE
              # classifier: it runs that script and hands its verdict to
              # ripr-infra-retry.yml strictly as data.
              lane_log=$(mktemp)
              fetched=false
              lane_fetch_attempts=0
              # The cutoff above already reserves the final 120 seconds for
              # the annotation lookup on cancelled lanes.
              while [ "$((log_fetch_deadline - $(date +%s)))" -gt 0 ]; do
                lane_fetch_attempts=$((lane_fetch_attempts + 1))
                if bounded_gh_api_until "$log_fetch_deadline" "repos/${GITHUB_REPOSITORY}/actions/jobs/${lane_job_id}/logs" > "$lane_log" 2>/dev/null; then
                  fetched=true
                  lane_evidence_source="lane-log"
                  clf_out=$(bash scripts/ci/classify-ripr-lane-termination "$lane_log") || clf_out=""
                  printf '%s\n' "$clf_out"
                  clf_class=$(printf '%s\n' "$clf_out" | sed -n 's/^classification=//p' | head -1)
                  clf_gap=$(printf '%s\n' "$clf_out" | sed -n 's/^gap_receipt_matches=//p' | head -1)
                  case "$clf_gap" in ''|*[!0-9]*) clf_gap=0 ;; esac
                  lane_gap_hits="$clf_gap"
                  if [ "$lane_gap_hits" -gt 0 ]; then
                    lane_class="ripr-failure"
                  elif [ "${clf_class:-}" = "infra-no-proof" ] && [ "$lane_result" != "cancelled" ]; then
                    lane_class="infra-no-proof"
                  fi
                fi
                if [ "$fetched" = "true" ]; then
                  break
                fi
                if ! bounded_sleep_until "$log_fetch_deadline" "$(next_backoff "$lane_fetch_attempts")"; then
                  break
                fi
              done
              # #17450: the hosted UI often shows only an early build prefix.
              # Persist the API-retrieved tail before the temp file is removed.
              if [ "$fetched" = "true" ] && [ -f scripts/ci/preserve-lane-log-tail.sh ]; then
                if ! bash scripts/ci/preserve-lane-log-tail.sh "$lane_log" ripr-lane-log-tail.txt; then
                  echo "::warning::lane log tail for ${lane_name} (job ${lane_job_id}) was not preserved; lane classification continues"
                fi
              fi
              if [ "$fetched" != "true" ]; then
                # Retrieval failure is not evidence of an eviction. Preserve
                # the fail-closed class so ripr-infra-retry cannot arm, but
                # emit an explicit machine-readable classification and
                # diagnostic instead of silently skipping the classifier.
                printf '%s\n' "classification=ripr-failure"
                if [ "$(remaining_until_deadline)" -le 0 ]; then
                  echo "::warning::lane log for ${lane_name} (job ${lane_job_id}) reached the job-level retrieval deadline; eviction classification skipped and the gate will fail closed"
                else
                  echo "::warning::lane log for ${lane_name} (job ${lane_job_id}) was not retrievable after ${lane_fetch_attempts} attempts; eviction classification skipped and the gate will fail closed"
                fi
              fi
              # #16431: the log is not the only eviction evidence the API
              # keeps. When the bounded log fetch failed outright, or came
              # back with neither a genuine receipt nor teardown markers, the
              # lane job's check-run annotations and its steps state still
              # carry positive platform-teardown evidence: "The hosted runner
              # lost communication..." evictions end mid-cargo with zero
              # in-log markers (runs 35444262230 / 35501271465), and a log
              # carrying the shutdown marker arrived too late for the old
              # budget on run 35507463908. Gather the API evidence under the
              # same deadline and let the classifier's --api-evidence mode
              # decide; it fails closed on anything else.
              if { [ "$lane_class" != "infra-no-proof" ] || [ "$lane_result" = "cancelled" ]; } && [ "$lane_gap_hits" -eq 0 ]; then
                annotations_json=$(mktemp)
                steps_json=$(mktemp)
                annotations_ok=false
                steps_ok=false
                api_evidence_attempts=0
                while [ "$(remaining_until_deadline)" -gt 0 ]; do
                  api_evidence_attempts=$((api_evidence_attempts + 1))
                  if [ "$annotations_ok" != "true" ]; then
                    # For Actions jobs the check-run id equals the job id
                    # (verified via check_run_url on the #16431 runs).
                    if bounded_gh_api "repos/${GITHUB_REPOSITORY}/check-runs/${lane_job_id}/annotations" > "$annotations_json" 2>/dev/null; then
                      annotations_ok=true
                    fi
                  fi
                  if [ "$steps_ok" != "true" ]; then
                    if bounded_gh_api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
                      --jq "first(.jobs[] | select(.name == \"${lane_name}\") | {conclusion: .conclusion, steps: [.steps[] | {name: .name, status: .status, conclusion: .conclusion}]})" \
                      > "$steps_json" 2>/dev/null; then
                      steps_ok=true
                    fi
                  fi
                  if [ "$annotations_ok" = "true" ] && [ "$steps_ok" = "true" ]; then
                    break
                  fi
                  if ! bounded_sleep "$(next_backoff "$api_evidence_attempts")"; then
                    break
                  fi
                done
                if [ "$annotations_ok" = "true" ] || [ "$steps_ok" = "true" ]; then
                  lane_evidence_source="api-evidence"
                  # A retrieved lane log stays receipt evidence even when it
                  # held no teardown marker: hand it to the classifier so a
                  # genuine gap receipt in it keeps outranking API markers.
                  if [ "$fetched" = "true" ]; then
                    clf_out=$(bash scripts/ci/classify-ripr-lane-termination --api-evidence "$annotations_json" "$steps_json" --gap-receipt "$lane_log") || clf_out=""
                  else
                    clf_out=$(bash scripts/ci/classify-ripr-lane-termination --api-evidence "$annotations_json" "$steps_json") || clf_out=""
                  fi
                  printf '%s\n' "$clf_out"
                  clf_class=$(printf '%s\n' "$clf_out" | sed -n 's/^classification=//p' | head -1)
                  clf_gap=$(printf '%s\n' "$clf_out" | sed -n 's/^gap_receipt_matches=//p' | head -1)
                  case "$clf_gap" in ''|*[!0-9]*) clf_gap=0 ;; esac
                  if [ "$clf_gap" -gt 0 ]; then
                    lane_class="ripr-failure"
                  elif [ "${clf_class:-}" = "configured-timeout-no-proof" ] && [ "$lane_result" = "cancelled" ]; then
                    lane_class="configured-timeout-no-proof"
                  elif [ "${clf_class:-}" = "infra-no-proof" ] && [ "$lane_result" != "cancelled" ]; then
                    lane_class="infra-no-proof"
                  fi
                else
                  printf '%s\n' "classification=ripr-failure"
                  if [ "$(remaining_until_deadline)" -le 0 ]; then
                    echo "::warning::API classification evidence for ${lane_name} (job ${lane_job_id}) reached the job-level retrieval deadline; eviction classification stays fail-closed"
                  else
                    echo "::warning::API classification evidence for ${lane_name} (job ${lane_job_id}) was not retrievable after ${api_evidence_attempts} attempts; eviction classification stays fail-closed"
                  fi
                fi
                rm -f "$annotations_json" "$steps_json"
              fi
              rm -f "$lane_log"
            else
              printf '%s\n' "classification=ripr-failure"
              if [ "$(remaining_until_deadline)" -le 0 ]; then
                echo "::warning::job id for ${lane_name} reached the job-level retrieval deadline; eviction classification skipped and the gate will fail closed"
              else
                echo "::warning::job id for ${lane_name} was not retrievable after ${lane_lookup_attempts} attempts; eviction classification skipped and the gate will fail closed"
              fi
            fi
          fi
          # #6807 slice 2 + #16431: hand the lane verdict to the bounded
          # auto-retry (ripr-infra-retry.yml) as data so there is exactly one
          # eviction classifier. Every classified lane failure now leaves the
          # file — infra-no-proof and ripr-failure alike — so the consumer
          # reads a verdict from an artifact that always exists for lane
          # failures and never has to treat artifact absence (the rarer
          # "gate died before classifying" class) as the classifier's voice.
          # The consumer greps fields; it must never source this file.
          write_gate_classification() {
            {
              echo "classification=$1"
              echo "reason=$2"
              echo "lane_name=${lane_name:-unknown}"
              echo "lane_job_id=${lane_job_id:-unknown}"
              echo "head_sha=${GITHUB_SHA}"
              echo "runner=github-hosted"
              echo "decision_sha=$RIPR_DECISION_SHA"
              echo "run_id=${GITHUB_RUN_ID}"
              echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
              echo "evidence=${lane_evidence_source}"
            } > ripr-gate-classification.env
          }
          report_lane_failure() {
            if [ "$lane_class" = "infra-no-proof" ]; then
              # Machine-checkable verdicts (#12563): every application of this
              # gate names its outcome class explicitly so reviewers and tooling
              # can audit the infra-no-verdict decision boundary.
              echo "RIPR_GATE_VERDICT=infra-no-proof"
              echo "RIPR_GATE_DECISION boundary=\"infra-no-proof needs positive runner-teardown evidence with no genuine gap receipt; a real red always reds; one automatic same-head retry max via ripr-infra-retry, then the manual path\""
              echo "::error::ripr lane \`${lane_name}\` was killed by the runner (infra-no-proof: shutdown signal / SIGTERM / API cancellation / lost communication), NOT by a ripr source gap. No proof exists for ${GITHUB_SHA}. Safe same-head recovery: \`gh run rerun ${GITHUB_RUN_ID} --failed\` — the evaluated tree is unchanged by an infra kill, so a rerun re-runs this exact head (#6807, #12563, #16431)."
              write_gate_classification "infra-no-proof" "runner eviction: positive teardown evidence (lane log markers or job annotations/steps state) with no genuine gap receipt"
              {
                echo "- classification: \`infra-no-proof (runner eviction)\`"
                echo "- lane: \`${lane_name}\` (job \`${lane_job_id:-unknown}\`)"
                echo "- head: \`${GITHUB_SHA}\`"
                echo "- evidence: \`${lane_evidence_source}\`"
                echo "- rerun: \`gh run rerun ${GITHUB_RUN_ID} --failed\` (automatic bounded retry armed once; second eviction = manual path)"
              } >> "$GITHUB_STEP_SUMMARY"
            elif [ "$lane_class" = "configured-timeout-no-proof" ]; then
              echo "RIPR_GATE_VERDICT=configured-timeout-no-proof"
              write_gate_classification "configured-timeout-no-proof" "configured hosted lane exceeded 135 minutes, proven by current job annotation"
              echo "::error::ripr lane ${lane_name} (job ${lane_job_id}) exceeded its configured 135-minute limit. No proof exists for ${GITHUB_SHA}; this is not a RIPR gap or an infra auto-retry. Investigate the bounded lane before a manual rerun."
              {
                echo "- classification: \`configured-timeout-no-proof\`"
                echo "- lane: \`${lane_name}\` (job \`${lane_job_id:-unknown}\`)"
                echo "- head: \`${GITHUB_SHA}\`"
                echo "- evidence: \`${lane_evidence_source}\`"
                if [ -f ripr-lane-log-tail.txt ]; then
                  echo "- lane log tail: workflow artifact \`ripr-lane-log-tail\` (last 4 MiB of the retrieved lane log)"
                else
                  echo "- lane log tail: unavailable (lane log was not retrievable before the gate deadline)"
                fi
              } >> "$GITHUB_STEP_SUMMARY"
            elif [ "$lane_class" = "cancelled-no-verdict" ]; then
              echo "RIPR_GATE_VERDICT=cancelled-no-verdict"
              write_gate_classification "cancelled-no-verdict" "cancellation cause unproved on current lane attempt"
              echo "::error::ripr lane cancelled — no proof produced for ${GITHUB_SHA}. No current-job 135-minute timeout annotation or genuine gap receipt proved a more specific cause. This is NOT a new RIPR gap; investigate the cancellation and re-run this head."
            else
              echo "RIPR_GATE_VERDICT=ripr-failure"
              write_gate_classification "ripr-failure" "$1"
              echo "::error::$1"
            fi
            exit 1
          }

          if [ "$GITHUB_RESULT" != success ]; then
            report_lane_failure "ripr on GitHub-hosted did not succeed: $GITHUB_RESULT"
          fi
          if [ "$MERGE_GROUP_SHA" != "${PROOF_SHA:-}" ]; then
            echo '::error::Successful RIPR producer has no exact-G subject: NOT_PROVEN.'
            exit 1
          fi
          # A result-only rerun must not reuse an earlier producer attempt.
          if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]*$ ]] ||
            [[ ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ]] ||
            [ "$GITHUB_RUN_ID" != "${PROOF_RUN_ID:-}" ] ||
            [ "$GITHUB_RUN_ATTEMPT" != "${PROOF_RUN_ATTEMPT:-}" ]; then
            echo '::error::RIPR producer is not from this run/attempt: NOT_PROVEN. Rerun the producer with its dependent result.'
            exit 1
          fi
          echo "RIPR_GATE_EVALUATION=success"

      - name: Revalidate protected decision authority after evaluation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = 'EffortlessMetrics', repo = 'perl-lsp-swarm', branch = 'main';
            const fullName = owner + '/' + repo;
            const eventRepo = context.payload.repository;
            if (context.eventName !== 'merge_group' || context.payload.action !== 'checks_requested' ||
                context.repo.owner !== owner || context.repo.repo !== repo ||
                eventRepo?.full_name !== fullName || !Number.isSafeInteger(eventRepo.id) || eventRepo.id <= 0 ||
                typeof eventRepo.node_id !== 'string' || !eventRepo.node_id ||
                context.payload.merge_group?.base_ref !== 'refs/heads/main') {
              throw new Error('NOT_PROVEN: native repository/main identity required');
            }
            const {data: repository} = await github.rest.repos.get({owner, repo});
            const {data: protectedBranch} = await github.rest.repos.getBranch({owner, repo, branch});
            const {data: ref} = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
            const sha = protectedBranch.commit?.sha;
            if (repository.full_name !== fullName || repository.id !== eventRepo.id ||
                repository.node_id !== eventRepo.node_id || repository.default_branch !== branch ||
                protectedBranch.name !== branch || protectedBranch.protected !== true ||
                typeof sha !== 'string' || !/^[0-9a-f]{40}$/.test(sha) ||
                ref.ref !== 'refs/heads/main' || ref.object?.type !== 'commit' || ref.object?.sha !== sha) {
              throw new Error('NOT_PROVEN: protected immutable evaluator generation unavailable');
            }
            if (sha !== process.env.RIPR_DECISION_SHA) {
              throw new Error('NOT_PROVEN: protected main decision generation changed');
            }
            const {execFileSync} = require('node:child_process');
            const env = Object.fromEntries(Object.entries(process.env).filter(([key]) => !key.startsWith('GIT_')));
            Object.assign(env, {GIT_CONFIG_NOSYSTEM: '1', GIT_CONFIG_GLOBAL: '/dev/null',
              GIT_CONFIG_SYSTEM: '/dev/null', GIT_NO_REPLACE_OBJECTS: '1'});
            const head = execFileSync('git', ['rev-parse', 'HEAD'], {env, encoding: 'utf8'}).trim();
            const dirty = execFileSync('git', ['status', '--porcelain', '--untracked-files=no'], {env, encoding: 'utf8'}).trim();
            if (head !== sha || dirty) {
              throw new Error('NOT_PROVEN: decision checkout custody differs from protected T');
            }

      - name: Finalize verified hosted result
        shell: bash
        run: |
          set -euo pipefail
          echo "RIPR_GATE_VERDICT=success"
          echo "ripr+ New Gap Gate: success (GitHub-hosted exact G $GITHUB_SHA, protected T $RIPR_DECISION_SHA)"

      # #6807 slice 2 + #16431: every classified lane failure leaves
      # ripr-gate-classification.env (infra-no-proof or ripr-failure with a
      # reason) for the bounded auto-retry workflow (ripr-infra-retry.yml),
      # which ignores every non-infra class. `ignore` remains correct for the
      # rarer exits that happen before any lane classification (deadline
      # setup, abrupt termination, non-lane verdicts).
      - name: Upload gate classification
        if: failure()
        # New pin uses must carry the reviewed v7.0.1 projection; v7.0.0 is
        # recorded legacy debt and strict mode rejects it on changed lines.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ripr-gate-classification
          path: ripr-gate-classification.env
          retention-days: 1
          if-no-files-found: ignore

      # #17450: when the hosted lane hits its configured timeout, the UI log is
      # often truncated to compile/setup output; the artifact keeps the tail the
      # gate already retrieved for classification.
      - name: Upload lane log tail
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ripr-lane-log-tail
          path: ripr-lane-log-tail.txt
          retention-days: 7
          if-no-files-found: ignore
