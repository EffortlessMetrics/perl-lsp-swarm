name: Repair EffectiveLspSurface review findings

on:
  push:
    branches:
      - automation/12649-s02-review-repair
    paths:
      - .github/workflows/repair-effective-surface.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: automation/12649-s02-review-repair
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply bounded S02 review repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          effective_path = 'crates/perl-lsp-rs-core/src/protocol/effective_surface.rs'
          effective = read(effective_path)
          effective = replace_once(
              effective,
              '''    /// `notebookDocumentSync`.
              NotebookDocumentSync,
              /// `foldingRangeProvider`.
          ''',
              '''    /// `notebookDocumentSync`.
              NotebookDocumentSync,
              /// `lsp.notebook_cell_execution` identity-only sub-feature.
              ///
              /// This selection has no independent `serverCapabilities` pointer; it
              /// still participates in profile/configuration suppression and the
              /// effective advertised feature-ID set.
              NotebookCellExecution,
              /// `foldingRangeProvider`.
          ''',
              'capability-family notebook identity',
          )
          effective = replace_once(
              effective,
              '''    /// No active workspace-symbol surface remains for the watcher to serve.
              WorkspaceSurfaceInactive,
          ''',
              '''    /// The simple `lsp.workspace_symbol` feature gate required by the shipped
              /// watcher-admission predicate is inactive. A resolve-only
              /// `workspaceSymbolProvider` advertisement may still remain active.
              WorkspaceSymbolFeatureDisabled,
          ''',
              'watcher reason definition',
          )
          effective = replace_once(
              effective,
              'WatcherWithholdReason::WorkspaceSurfaceInactive',
              'WatcherWithholdReason::WorkspaceSymbolFeatureDisabled',
              'watcher reason construction',
          )
          effective = replace_once(
              effective,
              '''        (CapabilityFamily::NotebookDocumentSync, base.notebook_document_sync),
                  (CapabilityFamily::FoldingRange, base.folding_range),
          ''',
              '''        (CapabilityFamily::NotebookDocumentSync, base.notebook_document_sync),
                  (CapabilityFamily::NotebookCellExecution, base.notebook_cell_execution),
                  (CapabilityFamily::FoldingRange, base.folding_range),
          ''',
              'notebook identity base flag',
          )
          effective = replace_once(
              effective,
              '''        CapabilityFamily::NotebookDocumentSync => flags.notebook_document_sync,
                  CapabilityFamily::FoldingRange => flags.folding_range,
          ''',
              '''        CapabilityFamily::NotebookDocumentSync => flags.notebook_document_sync,
                  CapabilityFamily::NotebookCellExecution => flags.notebook_cell_execution,
                  CapabilityFamily::FoldingRange => flags.folding_range,
          ''',
              'notebook identity post-config flag',
          )
          effective = replace_once(
              effective,
              '''            Self::NotebookDocumentSync => "lsp.notebook_document_sync",
                          Self::FoldingRange => "lsp.folding_range",
          ''',
              '''            Self::NotebookDocumentSync => "lsp.notebook_document_sync",
                          Self::NotebookCellExecution => "lsp.notebook_cell_execution",
                          Self::FoldingRange => "lsp.folding_range",
          ''',
              'notebook identity feature id',
          )
          effective = replace_once(
              effective,
              '''            Self::NotebookDocumentSync => &["notebookDocumentSync"],
                          Self::FoldingRange => &["foldingRangeProvider"],
          ''',
              '''            Self::NotebookDocumentSync => &["notebookDocumentSync"],
                          Self::NotebookCellExecution => &[],
                          Self::FoldingRange => &["foldingRangeProvider"],
          ''',
              'notebook identity wire ownership',
          )
          effective = replace_once(
              effective,
              '''            (Self::NotebookDocumentSync, "lsp.notebook_document_sync"),
                          (Self::FoldingRange, "lsp.folding_range"),
          ''',
              '''            (Self::NotebookDocumentSync, "lsp.notebook_document_sync"),
                          (Self::NotebookCellExecution, "lsp.notebook_cell_execution"),
                          (Self::FoldingRange, "lsp.folding_range"),
          ''',
              'notebook identity suppression mapping',
          )
          effective = replace_once(
              effective,
              '''                "completionItem": {
                                      "labelDetailsSupport": true,
                                      "insertTextModes": [1, 2],
                                  },
          ''',
              '''                "completionItem": {
                                      "labelDetailsSupport": true,
                                  },
          ''',
              'invalid completion insertTextModes removal',
          )
          write(effective_path, effective)

          tests_path = 'crates/perl-lsp-rs-core/src/protocol/effective_surface/tests.rs'
          tests = read(tests_path)

          notebook_test = r'''#[test]
          fn notebook_cell_execution_is_a_typed_identity_without_a_wire_pointer() {
              let all = build_ok(&bare_inputs(FeatureProfile::All));
              assert_eq!(
                  all.families.get(&CapabilityFamily::NotebookCellExecution),
                  Some(&FamilyOutcome::Static),
              );
              assert!(all.advertised_feature_ids.contains(&"lsp.notebook_cell_execution"));
              assert!(CapabilityFamily::NotebookCellExecution.wire_prefixes().is_empty());
              assert!(
                  flatten_surface_pointers(&all.server_capabilities)
                      .iter()
                      .all(|pointer| !pointer.contains("notebookCellExecution")),
                  "identity-only sub-feature must not invent a server capability"
              );

              let production = build_ok(&bare_inputs(FeatureProfile::Production));
              assert_eq!(
                  production.families.get(&CapabilityFamily::NotebookCellExecution),
                  Some(&FamilyOutcome::UnadvertisedUnsupported),
              );
              assert!(
                  !production.advertised_feature_ids.contains(&"lsp.notebook_cell_execution")
              );

              let mut disabled = bare_inputs(FeatureProfile::All);
              disabled
                  .disabled_feature_ids
                  .insert("lsp.notebook_cell_execution".to_string());
              let suppressed = build_ok(&disabled);
              assert_eq!(
                  suppressed.families.get(&CapabilityFamily::NotebookCellExecution),
                  Some(&FamilyOutcome::Suppressed(
                      SuppressionReason::DisabledByConfiguration {
                          feature_id: "lsp.notebook_cell_execution".to_string(),
                      },
                  )),
              );
              assert!(
                  !suppressed.advertised_feature_ids.contains(&"lsp.notebook_cell_execution")
              );
          }

          '''
          tests = replace_once(
              tests,
              '#[test]\nfn position_encoding_pin_records_negotiated_preference_as_downgrade() {',
              notebook_test + '#[test]\nfn position_encoding_pin_records_negotiated_preference_as_downgrade() {',
              'notebook identity test insertion',
          )

          completion_test = r'''#[test]
          fn completion_projection_removes_invalid_server_insert_text_modes_shape() {
              let surface = build_ok(&bare_inputs(FeatureProfile::Production));
              assert_eq!(
                  surface
                      .server_capabilities
                      .pointer("/completionProvider/completionItem/labelDetailsSupport"),
                  Some(&serde_json::json!(true)),
              );
              assert!(
                  surface
                      .server_capabilities
                      .pointer("/completionProvider/completionItem/insertTextModes")
                      .is_none(),
                  "insertTextModes is a client capability, not a valid server capability"
              );
          }

          '''
          tests = replace_once(
              tests,
              '// ---------------------------------------------------------------------------\n// Static vs planned-dynamic exclusivity (#9665 item 4)\n',
              completion_test
              + '// ---------------------------------------------------------------------------\n// Static vs planned-dynamic exclusivity (#9665 item 4)\n',
              'completion negative-control test insertion',
          )

          tests = replace_once(
              tests,
              '''    assert_eq!(
                      refused.watcher_registration_decision,
                      WatcherPlanDecision::Withheld(WatcherWithholdReason::ClientUnsupported),
                  );

                  // With the JetBrains compatibility exception: force-disabled.
          ''',
              '''    assert_eq!(
                      refused.watcher_registration_decision,
                      WatcherPlanDecision::Withheld(WatcherWithholdReason::ClientUnsupported),
                  );

                  // The shipped watcher predicate still depends on the simple
                  // `lsp.workspace_symbol` flag. Suppressing only that flag leaves the
                  // resolve-capable wire surface active, but must withhold the watcher
                  // for the exact typed feature-gate cause.
                  let mut resolve_only = base();
                  resolve_only
                      .disabled_feature_ids
                      .insert("lsp.workspace_symbol".to_string());
                  let resolve_only = build_ok(&resolve_only);
                  assert_eq!(
                      resolve_only.server_capabilities.get("workspaceSymbolProvider"),
                      Some(&serde_json::json!({ "resolveProvider": true })),
                  );
                  assert!(resolve_only.registration_plan.registrations.is_empty());
                  assert_eq!(
                      resolve_only.watcher_registration_decision,
                      WatcherPlanDecision::Withheld(
                          WatcherWithholdReason::WorkspaceSymbolFeatureDisabled,
                      ),
                  );

                  // With the JetBrains compatibility exception: force-disabled.
          ''',
              'watcher resolve-only regression',
          )

          tests = replace_once(
              tests,
              '''        let removed_model_only = retain_count(&mut model_only, |pointer| {
                          pointer == "positionEncoding"
                              || pointer.starts_with("workspace")
                              || pointer.starts_with("textDocumentSync")
                      });
                      assert!(
                          removed_model_only >= 1,
                          "positionEncoding pin must appear as a model-only pointer"
                      );
          ''',
              '''        assert!(
                          model_only.iter().any(|pointer| pointer == "positionEncoding"),
                          "positionEncoding itself must be the model-only pin pointer"
                      );
                      retain_count(&mut model_only, |pointer| {
                          pointer == "positionEncoding"
                              || pointer.starts_with("workspace")
                              || pointer.starts_with("textDocumentSync")
                      });
          ''',
              'direct positionEncoding parity assertion',
          )

          tests = replace_once(
              tests,
              '''        static_only.retain(|pointer| !pointer.starts_with("textDocumentSync"));

                      // textDocumentSync differs in value but shares pointers; compare
          ''',
              '''        static_only.retain(|pointer| !pointer.starts_with("textDocumentSync"));

                      // The live static builder still emits this invalid server-capability
                      // field. S03 removes that second writer; S02 must not preserve it in
                      // the intended final-surface authority.
                      let invalid_insert_text_modes =
                          "completionProvider.completionItem.insertTextModes[]";
                      assert!(
                          static_only.iter().any(|pointer| pointer == invalid_insert_text_modes),
                          "the pre-S03 static builder delta must remain explicit"
                      );
                      static_only.retain(|pointer| pointer != invalid_insert_text_modes);

                      // textDocumentSync differs in value but shares pointers; compare
          ''',
              'insertTextModes static parity delta',
          )

          tests = replace_once(
              tests,
              '''        for sanitized in [&mut sanitized_static, &mut sanitized_final] {
                          if let Some(map) = sanitized.as_object_mut() {
                              map.remove("textDocumentSync");
                              map.remove("workspace");
                              map.remove("positionEncoding");
                              map.remove("inlineCompletionProvider");
                          }
                      }
                      assert_eq!(
                          sanitized_static, sanitized_final,
          ''',
              '''        for sanitized in [&mut sanitized_static, &mut sanitized_final] {
                          if let Some(map) = sanitized.as_object_mut() {
                              map.remove("textDocumentSync");
                              map.remove("workspace");
                              map.remove("positionEncoding");
                              map.remove("inlineCompletionProvider");
                          }
                      }
                      if let Some(completion_item) = sanitized_static
                          .pointer_mut("/completionProvider/completionItem")
                          .and_then(serde_json::Value::as_object_mut)
                      {
                          completion_item.remove("insertTextModes");
                      }
                      assert_eq!(
                          sanitized_static, sanitized_final,
          ''',
              'sanitize explicit static insertTextModes delta',
          )

          inventory_start = tests.index(
              '#[test]\nfn every_9665_targeted_inventory_row_maps_into_the_model() {'
          )
          inventory_end = tests.index(
              '\n#[test]\nfn file_operation_intersection_follows_normalized_facts()',
              inventory_start,
          )
          inventory_test = r'''#[test]
          fn every_9665_targeted_inventory_row_maps_into_the_model() {
              use crate::protocol::final_surface_inventory::{SurfaceKind, final_surface_rows};

              let rows = final_surface_rows();
              for row in &rows {
                  if row.target_issue != "#9665" || row.kind != SurfaceKind::Suppression {
                      continue;
                  }

                  // Each named suppression input is expressible as a typed model
                  // mechanism: disabledFeatures IDs map to feature-ID families;
                  // profile:/tool:/config: inputs are expressed by profile selection,
                  // reviewed RuntimeAvailability, and registration-plan tuning.
                  let expressible = row
                      .protocol_field
                      .starts_with("initializationOptions.disabledFeatures:")
                      || CapabilityFamily::feature_id_for_suppression(row.protocol_field).is_some()
                      || row.protocol_field.starts_with("profile:")
                      || row.protocol_field.starts_with("tool:")
                      || row.protocol_field.starts_with("config:");
                  assert!(
                      expressible,
                      "S02 model cannot yet express suppression row {}",
                      row.surface_id
                  );
              }

              let compatibility_rows: Vec<_> = rows
                  .iter()
                  .filter(|row| {
                      row.target_issue == "#9665" && row.kind == SurfaceKind::Compatibility
                  })
                  .collect();
              assert_eq!(
                  compatibility_rows.len(),
                  3,
                  "S02 owns only the two intrinsic client exceptions and the position pin"
              );
              assert!(compatibility_rows.iter().any(|row| {
                  row.protocol_field
                      == KnownException::JetBrainsWatcherForceDisable.subject_evidence()
              }));
              assert!(compatibility_rows.iter().any(|row| {
                  row.protocol_field
                      == KnownException::OpenCodePushDiagnosticsRetention.subject_evidence()
              }));
              assert!(compatibility_rows.iter().any(|row| {
                  row.client_capability_inputs.contains(&"general.positionEncodings")
              }));

              let mut jetbrains = bare_inputs(FeatureProfile::Production);
              jetbrains.client.dynamic_file_watcher_registration = ClientFact::Supported;
              jetbrains
                  .compatibility_exceptions
                  .insert(KnownException::JetBrainsWatcherForceDisable);
              let jetbrains = build_ok(&jetbrains);
              assert_eq!(
                  jetbrains.watcher_registration_decision,
                  WatcherPlanDecision::Withheld(
                      WatcherWithholdReason::CompatibilityException {
                          exception: KnownException::JetBrainsWatcherForceDisable,
                      },
                  ),
              );

              let mut opencode = bare_inputs(FeatureProfile::Production);
              opencode.client.diagnostic_pull = ClientFact::Supported;
              opencode
                  .compatibility_exceptions
                  .insert(KnownException::OpenCodePushDiagnosticsRetention);
              let opencode = build_ok(&opencode);
              assert_eq!(
                  opencode.diagnostic_transport,
                  DiagnosticTransport::PushOnly(PushTransportReason::ClientCompatibility(
                      KnownException::OpenCodePushDiagnosticsRetention,
                  )),
              );

              let position = build_ok(&bare_inputs(FeatureProfile::All));
              assert!(matches!(
                  position.families.get(&CapabilityFamily::PositionEncoding),
                  Some(FamilyOutcome::Downgraded(
                      DowngradeReason::PositionEncodingPin { .. },
                      _,
                  ))
              ));
          }
          '''
          tests = tests[:inventory_start] + inventory_test + tests[inventory_end:]
          write(tests_path, tests)

          runtime_path = (
              'crates/perl-lsp-rs/src/runtime/lifecycle/'
              'effective_surface_parity_tests.rs'
          )
          runtime = read(runtime_path)
          runtime = replace_once(
              runtime,
              '''//! These tests are the S03 migration evidence: every subject proves the model
              //! independently derives the exact final surface the runtime emits, and pins
          ''',
              '''//! These tests are the S03 migration evidence: every subject proves the model
              //! independently derives the intended final surface outside one explicit
              //! pre-S03 invalid-field removal delta, and pins
          ''',
              'runtime parity module claim',
          )
          runtime = replace_once(
              runtime,
              '''/// Core discriminator: the model must reproduce the EXACT emitted initialize
              /// capabilities for the given subject, plus effective advertised identities.
          ''',
              '''/// Core discriminator: the model must reproduce emitted initialize capabilities
              /// outside the explicit pre-S03 `insertTextModes` removal delta, plus effective
              /// advertised identities.
          ''',
              'runtime parity function claim',
          )

          equality_start = runtime.index(
              '    assert_eq!(\n        response.get("capabilities"),'
          )
          equality_end = runtime.index(
              '    // The model derives identities from final family outcomes',
              equality_start,
          )
          equality = r'''    let mut runtime_capabilities = response
              .get("capabilities")
              .cloned()
              .expect("initialize response carries capabilities");
              let removed_insert_text_modes = runtime_capabilities
                  .pointer_mut("/completionProvider/completionItem")
                  .and_then(Value::as_object_mut)
                  .and_then(|completion_item| completion_item.remove("insertTextModes"));
              let completion_active = surface
                  .families
                  .get(&CapabilityFamily::Completion)
                  .is_some_and(FamilyOutcome::is_effectively_advertised);
              if completion_active {
                  assert_eq!(
                      removed_insert_text_modes,
                      Some(json!([1, 2])),
                      "the live pre-S03 path must expose only the enumerated invalid delta"
                  );
              } else {
                  assert!(removed_insert_text_modes.is_none());
              }
              assert!(
                  surface
                      .server_capabilities
                      .pointer("/completionProvider/completionItem/insertTextModes")
                      .is_none(),
                  "the intended authority must not preserve the invalid client-capability field"
              );
              assert_eq!(
                  runtime_capabilities, surface.server_capabilities,
                  "model projection must equal shipped initialize capabilities outside the \
                   explicit insertTextModes removal owned by S03"
              );
          '''
          runtime = runtime[:equality_start] + equality + runtime[equality_end:]
          write(runtime_path, runtime)

          inventory_path = 'crates/perl-lsp-rs-core/src/protocol/final_surface_inventory.rs'
          inventory = read(inventory_path)
          wrapper_marker = '\n/// Stable surface IDs referenced across crates by the runtime census proof.\n'
          if inventory.count(wrapper_marker) != 1:
              raise SystemExit('compatibility-owner wrappers: marker mismatch')
          wrappers = r'''
          fn negotiation_compat(
              surface_id: &'static str,
              protocol_field: &'static str,
              builder_mutator_path: &'static str,
              client_capability_inputs: &'static [&'static str],
              evidence_owner: &'static str,
              subject: &'static str,
              reason: &'static str,
              expiry: &'static str,
          ) -> SurfaceRow {
              let mut row = compat(
                  surface_id,
                  protocol_field,
                  builder_mutator_path,
                  client_capability_inputs,
                  evidence_owner,
                  subject,
                  reason,
                  expiry,
              );
              row.target_issue = "#6735";
              row
          }

          fn bootstrap_compat(
              surface_id: &'static str,
              protocol_field: &'static str,
              builder_mutator_path: &'static str,
              client_capability_inputs: &'static [&'static str],
              evidence_owner: &'static str,
              subject: &'static str,
              reason: &'static str,
              expiry: &'static str,
          ) -> SurfaceRow {
              let mut row = compat(
                  surface_id,
                  protocol_field,
                  builder_mutator_path,
                  client_capability_inputs,
                  evidence_owner,
                  subject,
                  reason,
                  expiry,
              );
              row.target_issue = "#1671";
              row
          }
          '''
          inventory = inventory.replace(wrapper_marker, '\n' + wrappers + wrapper_marker, 1)
          write(inventory_path, inventory)

          rows_path = 'crates/perl-lsp-rs-core/src/protocol/final_surface_inventory/rows.rs'
          rows = read(rows_path)

          def retarget_call(text: str, surface_id: str, constructor: str) -> str:
              old = f'        compat(\n            "{surface_id}",'
              new = f'        {constructor}(\n            "{surface_id}",'
              return replace_once(text, old, new, f'retarget {surface_id}')

          for surface_id in (
              'compat.protocol.diagnosticRefreshSingularKey',
              'compat.protocol.markdownContentFormatFallback',
              'compat.protocol.completionItemFlattenedShape',
              'compat.negotiated.clientInputsWithoutAdvertisementSeam',
          ):
              rows = retarget_call(rows, surface_id, 'negotiation_compat')
          for surface_id in (
              'compat.initialize.legacyRootPath',
              'compat.initialize.initOptionsRootFallbackChain',
              'compat.initialize.cwdFallback',
          ):
              rows = retarget_call(rows, surface_id, 'bootstrap_compat')

          rows = replace_once(
              rows,
              '"until #9665 canonical negotiation model owns markup selection",',
              '"until #6735 canonical client-capability normalization owns markup selection",',
              'markdown compatibility expiry',
          )
          rows = replace_once(
              rows,
              '"until #9665 normalizes capability parsing",',
              '"until #6735 normalizes capability parsing",',
              'completion compatibility expiry',
          )
          rows = replace_once(
              rows,
              '"until #9665 owns root-resolution policy",',
              '"until #1671 initialize bootstrap owns root-resolution policy",',
              'init-options root expiry',
          )
          rows = replace_once(
              rows,
              '"until #9665 defines explicit no-workspace behavior",',
              '"until #1671 initialize bootstrap defines explicit no-workspace behavior",',
              'cwd fallback expiry',
          )
          rows = replace_once(
              rows,
              '"S02 EffectiveLspSurface models each as a typed negotiation outcome (#9665)",',
              '"owned by #6735 client-capability normalization; S02 consumes only normalized inputs that affect final-surface policy",',
              'parsed client inputs ownership',
          )
          write(rows_path, rows)
          PY

      - name: Format sources
        run: cargo fmt --all

      - name: Regenerate final-surface inventory
        run: >-
          cargo test -p perl-lsp-rs-core --lib
          final_surface_inventory::tests::regenerate_checked_in_artifact
          --locked -- --ignored

      - name: Verify focused authority tests
        run: |
          cargo test -p perl-lsp-rs-core --lib effective_surface --locked
          cargo test -p perl-lsp-rs --lib effective_surface_parity --locked
          cargo test -p perl-lsp-rs-core --lib capabilities --locked
          cargo test -p perl-lsp-rs-core --lib final_surface_inventory --locked

      - name: Verify focused lint and formatting
        run: |
          cargo clippy -p perl-lsp-rs-core --lib --locked -- -D warnings
          cargo clippy -p perl-lsp-rs --lib --locked -- -D warnings
          cargo fmt --all -- --check
          git diff --check

      - name: Commit exact-head repair
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm .github/workflows/repair-effective-surface.yml
          git add \
            crates/perl-lsp-rs-core/src/protocol/effective_surface.rs \
            crates/perl-lsp-rs-core/src/protocol/effective_surface/tests.rs \
            crates/perl-lsp-rs-core/src/protocol/final_surface_inventory.rs \
            crates/perl-lsp-rs-core/src/protocol/final_surface_inventory/rows.rs \
            crates/perl-lsp-rs/src/runtime/lifecycle/effective_surface_parity_tests.rs \
            docs/specs/lsp-final-surface-inventory.json
          git status --short
          git commit -m "fix(lsp): close EffectiveLspSurface review gaps (#12649)"
          git push origin HEAD:automation/12649-s02-review-repair
