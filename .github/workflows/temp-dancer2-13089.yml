name: Temporary Dancer2 1.x contract repair

on:
  push:
    branches: ["fix/13089-dancer2-dsl-keywords"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/13089-dancer2-dsl-keywords
          fetch-depth: 1

      - name: Apply version-aware Dancer2 contract repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def replace_section(
              text: str,
              start_marker: str,
              end_marker: str,
              replacement: str,
              label: str,
          ) -> str:
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"{label}: start marker not found")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"{label}: end marker not found")
              if text.find(start_marker, start + 1) >= 0:
                  raise SystemExit(f"{label}: start marker is not unique")
              return text[:start] + replacement + text[end:]

          facts_path = Path("crates/perl-semantic-facts/src/framework_adapters/dancer2.rs")
          facts = facts_path.read_text()

          facts = replace_section(
              facts,
              "/// Versioned identity of the reviewed default-DSL keyword contract.\n",
              "/// Reviewed versioned-descriptor schema revision for this adapter. Tracks\n",
              """/// Versioned identity of the reviewed default-DSL keyword contract.
          ///
          /// The table is the reviewed Dancer2 1.x union: the v1.0.0 registry at
          /// `PerlDancer/Dancer2@ab2a50a478f81b005d0a6f4f1ff2a1f6f9ce1aa5`
          /// is the base, while `uri_for_route` was introduced by
          /// `PerlDancer/Dancer2@1211dbf5e19ffbe46026ddf983c444ce1f5c0b6d`
          /// and shipped in v1.1.0. Facts are filtered against the observed
          /// framework version before publication. v3 also corrects `redirect`
          /// and `cookie` scope, preserves the four upstream-deprecated exports,
          /// and removes route/hook names that the reviewed DSL does not register
          /// as keywords (#13089).
          pub const DANCER2_DSL_CONTRACT_VERSION: &str = "dancer2-dsl.1-1.v3";
          const DANCER2_DSL_1_0_CONTRACT_VERSION: &str = "dancer2-dsl.1-0.v3";
          const DANCER2_URI_FOR_ROUTE_VERSION_CONSTRAINT: &str = ">=1.1.0,<2.0.0";

          """,
              "contract provenance",
          )

          facts = replace_section(
              facts,
              "/// Reviewed default Dancer2 DSL keyword contract (Dancer2 v1.1.1).\n",
              "pub const DANCER2_DSL_KEYWORDS: &[Dancer2DslKeyword] = &[\n",
              """/// Reviewed default Dancer2 1.x DSL keyword union.
          ///
          /// Entries intentionally follow the v1.1.1 upstream `dsl_keywords`
          /// registration order so review can compare the two tables without
          /// reconstructing a second grouping. Per-activation facts filter additions
          /// that were unavailable at the observed framework version. Hook names such
          /// as `before` and `after` are operands to `hook`, not imported DSL keywords.
          """,
              "keyword table documentation",
          )

          facts = replace_once(
              facts,
              "];\n\n/// Build the Dancer2 adapter descriptor.\n",
              """ ];

          fn supports_uri_for_route(framework_version: &str) -> bool {
              matches!(
                  crate::framework::version_constraint_matches(
                      DANCER2_URI_FOR_ROUTE_VERSION_CONSTRAINT,
                      framework_version,
                  ),
                  Some(true)
              )
          }

          fn keyword_is_available_in_version(
              keyword: &Dancer2DslKeyword,
              framework_version: &str,
          ) -> bool {
              keyword.name != "uri_for_route" || supports_uri_for_route(framework_version)
          }

          fn dsl_contract_version_for(framework_version: &str) -> &'static str {
              if supports_uri_for_route(framework_version) {
                  DANCER2_DSL_CONTRACT_VERSION
              } else {
                  DANCER2_DSL_1_0_CONTRACT_VERSION
              }
          }

          /// Build the Dancer2 adapter descriptor.
          """.replace(" ];", "];"),
              "version helpers",
          )

          facts = replace_section(
              facts,
              "#[must_use]\npub fn dancer2_activation_facts(\n",
              "\nfn dynamic_boundary_reason(\n",
              """#[must_use]
          pub fn dancer2_activation_facts(
              detection: &AdapterDetectionResult,
              package_name: Option<&str>,
              evidence: &Dancer2ImportEvidence,
          ) -> Dancer2ActivationFacts {
              let dsl = evidence.dsl.clone().unwrap_or(DslSelection::Default);
              let (framework_version, source_generation) = match &detection.outcome {
                  DetectionOutcome::Detected { framework_version, .. } => (
                      framework_version.clone().unwrap_or_default(),
                      detection.project_generation.clone(),
                  ),
                  outcome => {
                      return Dancer2ActivationFacts {
                          state: Dancer2ActivationState::NotActivated {
                              reason: format!("detection outcome is {outcome:?}"),
                          },
                          dsl,
                          dsl_contract_version: DANCER2_DSL_CONTRACT_VERSION,
                          keywords: Vec::new(),
                          unknown_exclusions: unknown_exclusions(evidence, None),
                      };
                  }
              };

              let dsl_contract_version = dsl_contract_version_for(&framework_version);
              let appname = dancer2_application_identity(package_name, evidence.appname.as_ref());
              let boundary_reason = dynamic_boundary_reason(&appname, &dsl, evidence);
              if let Some(reason) = boundary_reason {
                  return Dancer2ActivationFacts {
                      state: Dancer2ActivationState::DynamicBoundary { reason },
                      dsl,
                      dsl_contract_version,
                      keywords: Vec::new(),
                      unknown_exclusions: unknown_exclusions(
                          evidence,
                          Some(&framework_version),
                      ),
                  };
              }

              let application_name = match &appname {
                  AppNameSelection::Literal(name) => name.clone(),
                  _ => package_name.map(ToOwned::to_owned).unwrap_or_default(),
              };
              let keywords = default_keyword_facts(evidence, &framework_version);
              let unknown_exclusions = unknown_exclusions(evidence, Some(&framework_version));

              Dancer2ActivationFacts {
                  state: Dancer2ActivationState::Exact {
                      application_name,
                      framework_version,
                      source_generation,
                  },
                  dsl,
                  dsl_contract_version,
                  keywords,
                  unknown_exclusions,
              }
          }
          """,
              "activation fact builder",
          )

          facts = replace_section(
              facts,
              "fn default_keyword_facts(\n",
              "\n#[cfg(test)]\n",
              """fn default_keyword_facts(
              evidence: &Dancer2ImportEvidence,
              framework_version: &str,
          ) -> Vec<Dancer2KeywordImportFact> {
              DANCER2_DSL_KEYWORDS
                  .iter()
                  .filter(|keyword| keyword_is_available_in_version(keyword, framework_version))
                  .map(|keyword| Dancer2KeywordImportFact {
                      keyword: keyword.name.to_string(),
                      scope: keyword.scope,
                      state: if evidence
                          .excluded_keywords
                          .iter()
                          .any(|excluded| excluded == keyword.name)
                      {
                          Dancer2KeywordState::Excluded
                      } else {
                          Dancer2KeywordState::Imported
                      },
                      deprecated: keyword.deprecated,
                  })
                  .collect()
          }

          fn keyword_is_reviewed_for_version(
              keyword: &Dancer2DslKeyword,
              framework_version: Option<&str>,
          ) -> bool {
              match framework_version {
                  Some(version) => keyword_is_available_in_version(keyword, version),
                  None => true,
              }
          }

          fn unknown_exclusions(
              evidence: &Dancer2ImportEvidence,
              framework_version: Option<&str>,
          ) -> Vec<String> {
              evidence
                  .excluded_keywords
                  .iter()
                  .filter(|excluded| {
                      !DANCER2_DSL_KEYWORDS.iter().any(|keyword| {
                          keyword.name == excluded.as_str()
                              && keyword_is_reviewed_for_version(keyword, framework_version)
                      })
                  })
                  .cloned()
                  .collect()
          }
          """,
              "versioned keyword fact builders",
          )

          facts = replace_once(
              facts,
              "fn keyword_table_matches_reviewed_upstream_registration()",
              "fn keyword_table_matches_reviewed_v1_1_registration()",
              "table test name",
          )

          facts = replace_section(
              facts,
              "    #[test]\n    fn reviewed_keyword_exclusion_is_known_and_preserved() {\n",
              "\n    #[test]\n    fn parses_literal_appname_dsl_and_exclusions() {\n",
              """    #[test]
              fn reviewed_keyword_exclusion_is_known_and_preserved() {
                  let evidence = parse_dancer2_import_args(&["!uri_for_route".to_string()]);
                  let facts = default_keyword_facts(&evidence, "1.1.1");
                  let uri_for_route = facts
                      .iter()
                      .find(|fact| fact.keyword == "uri_for_route")
                      .expect("reviewed keyword fact");
                  assert_eq!(uri_for_route.state, Dancer2KeywordState::Excluded);
                  assert!(unknown_exclusions(&evidence, Some("1.1.1")).is_empty());
                  assert_eq!(
                      dsl_contract_version_for("1.1.1"),
                      DANCER2_DSL_CONTRACT_VERSION
                  );
              }

              #[test]
              fn uri_for_route_is_not_imported_before_v1_1() {
                  let evidence = parse_dancer2_import_args(&["!uri_for_route".to_string()]);
                  let facts = default_keyword_facts(&evidence, "1.0.0");
                  assert_eq!(facts.len(), DANCER2_DSL_KEYWORDS.len() - 1);
                  assert!(
                      facts.iter().all(|fact| fact.keyword != "uri_for_route"),
                      "Dancer2 1.0.x did not register `uri_for_route`"
                  );
                  assert_eq!(
                      unknown_exclusions(&evidence, Some("1.0.0")),
                      vec!["uri_for_route".to_string()]
                  );
                  assert_eq!(
                      dsl_contract_version_for("1.0.0"),
                      DANCER2_DSL_1_0_CONTRACT_VERSION
                  );
              }

              #[test]
              fn non_keyword_hook_name_remains_an_unknown_exclusion() {
                  let evidence = parse_dancer2_import_args(&["!before".to_string()]);
                  assert_eq!(
                      unknown_exclusions(&evidence, Some("1.1.1")),
                      vec!["before".to_string()]
                  );
              }
          """,
              "version discrimination tests",
          )
          facts_path.write_text(facts)

          completion_path = Path("crates/perl-lsp-rs-core/src/providers/dancer2/completion.rs")
          completion = completion_path.read_text()
          completion = replace_once(
              completion,
              """use perl_semantic_facts::framework_adapters::dancer2::{
              DANCER2_DSL_CONTRACT_VERSION, Dancer2KeywordState, DslKeywordScope,
          };
          """,
              """use perl_semantic_facts::framework_adapters::dancer2::{
              Dancer2KeywordState, DslKeywordScope,
          };
          """,
              "completion imports",
          )

          completion = replace_section(
              completion,
              "#[must_use]\npub fn keyword_completion_candidates(\n",
              "\n/// The rank penalty re-exported for runtime ranking decisions.\n",
              """#[must_use]
          pub fn keyword_completion_candidates(
              activations: &Dancer2FileActivations,
              facts: &CanonicalDancer2FileFacts,
              package: &str,
              offset: usize,
              locally_declared_subnames: &dyn Fn(&str) -> bool,
          ) -> Vec<Dancer2CompletionCandidate> {
              let Some(activation) = activations.for_package(package) else {
                  return Vec::new();
              };
              if !activation.facts.is_exact() {
                  return Vec::new();
              }
              let version = match &activation.facts.state {
                  perl_semantic_facts::framework_adapters::dancer2::Dancer2ActivationState::Exact {
                      framework_version,
                      ..
                  } => framework_version.clone(),
                  _ => return Vec::new(),
              };
              let inside_handler = facts.inside_handler_context(offset);
              let dsl_contract_version = activation.facts.dsl_contract_version;
              let mut candidates = Vec::new();
              for keyword in &activation.facts.keywords {
                  if keyword.state != Dancer2KeywordState::Imported {
                      // `!keyword` at the activating import: never offered.
                      continue;
                  }
                  if keyword.scope == DslKeywordScope::RouteHandlerOnly && !inside_handler {
                      continue;
                  }
                  if locally_declared_subnames(&keyword.keyword) {
                      // A same-named local subroutine owns the name in this file;
                      // ordinary Perl completion covers it.
                      continue;
                  }
                  candidates.push(Dancer2CompletionCandidate {
                      label: keyword.keyword.clone(),
                      scope: keyword.scope,
                      rank_penalty: KEYWORD_RANK_PENALTY,
                      detail: format!(
                          "Dancer2 {} keyword ({} — {})",
                          &version,
                          match keyword.scope {
                              DslKeywordScope::Global => "global",
                              DslKeywordScope::RouteHandlerOnly => "route handler only",
                              _ => "unknown",
                          },
                          dsl_contract_version
                      ),
                      dsl_contract_version,
                  });
              }
              candidates
          }
          """,
              "completion fact consumption",
          )

          completion = replace_section(
              completion,
              "    fn setup(source: &'static str) -> (Dancer2FileActivations, CanonicalDancer2FileFacts) {\n",
              "\n    fn none_declared(_: &str) -> bool {\n",
              """    fn setup(source: &'static str) -> (Dancer2FileActivations, CanonicalDancer2FileFacts) {
                  setup_with_version(source, "1.1.1")
              }

              fn setup_with_version(
                  source: &'static str,
                  framework_version: &str,
              ) -> (Dancer2FileActivations, CanonicalDancer2FileFacts) {
                  let mut parser = Parser::new(source);
                  let ast = parser.parse().expect("fixture must parse");
                  let module = RuntimeDancer2Module::new("lib/Dancer2.pm", framework_version);
                  let activations = file_activations(
                      &ast,
                      FileId(1),
                      Some(&module),
                      &SourceGeneration::known("g1"),
                  );
                  let facts = canonical_file_facts(&ast, FileId(1), &activations);
                  (activations, facts)
              }
          """,
              "versioned completion setup",
          )

          completion = replace_once(
              completion,
              "    #[test]\n    fn excluded_keyword_is_never_offered() {\n",
              """    #[test]
              fn dancer2_1_0_omits_uri_for_route_and_uses_v1_0_contract() {
                  let source = "use Dancer2;\nget '/x' => sub { params; };\n";
                  let (activations, facts) = setup_with_version(source, "1.0.0");
                  let handler_offset = source.find("params").expect("handler body offset");
                  let candidates = keyword_completion_candidates(
                      &activations,
                      &facts,
                      "main",
                      handler_offset,
                      &none_declared,
                  );
                  assert!(
                      candidates
                          .iter()
                          .all(|candidate| candidate.label != "uri_for_route"),
                      "Dancer2 1.0.x must not receive a v1.1 keyword"
                  );
                  let uri_for = candidates
                      .iter()
                      .find(|candidate| candidate.label == "uri_for")
                      .expect("v1.0 request helper");
                  assert_eq!(uri_for.dsl_contract_version, "dancer2-dsl.1-0.v3");
              }

              #[test]
              fn excluded_keyword_is_never_offered() {
          """,
              "v1.0 completion proof",
          )
          completion_path.write_text(completion)

          route_path = Path("crates/perl-semantic-facts/src/route.rs")
          route = route_path.read_text()
          route = replace_once(
              route,
              '            "dancer2-dsl.1-1.v2",\n',
              '            "dancer2-dsl.1-1.v3",\n',
              "route receipt contract",
          )
          route_path.write_text(route)

          analyzer_path = Path("crates/perl-semantic-analyzer/tests/dancer2_route_facts.rs")
          analyzer = analyzer_path.read_text()
          analyzer = replace_once(
              analyzer,
              '    assert_eq!(context.dsl_contract_version, "dancer2-dsl.1-1.v2");\n',
              '    assert_eq!(context.dsl_contract_version, "dancer2-dsl.1-1.v3");\n',
              "analyzer receipt contract",
          )
          analyzer_path.write_text(analyzer)
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Run semantic-fact proof
        run: cargo test --locked -p perl-semantic-facts

      - name: Run route-family receipt proof
        run: cargo test --locked -p perl-semantic-analyzer --test dancer2_route_facts

      - name: Run Dancer2 provider proof
        run: cargo test --locked -p perl-lsp-rs-core providers::dancer2

      - name: Commit contained repair and remove temporary executor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-dancer2-13089.yml
          if rg -n 'dancer2-dsl\.1-1\.v2' \
            crates/perl-semantic-facts \
            crates/perl-semantic-analyzer \
            crates/perl-lsp-rs-core; then
            echo "::error::stale Dancer2 v2 contract receipt remains"
            exit 1
          fi
          python3 <<'PY'
          import subprocess

          expected = {
              ".github/workflows/temp-dancer2-13089.yml",
              "crates/perl-lsp-rs-core/src/providers/dancer2/completion.rs",
              "crates/perl-semantic-analyzer/tests/dancer2_route_facts.rs",
              "crates/perl-semantic-facts/src/framework_adapters/dancer2.rs",
              "crates/perl-semantic-facts/src/route.rs",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if changed != expected:
              raise SystemExit(
                  "unexpected changed-file set:\n"
                  f"expected={sorted(expected)}\nobserved={sorted(changed)}"
              )
          PY
          git diff --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            .github/workflows/temp-dancer2-13089.yml \
            crates/perl-lsp-rs-core/src/providers/dancer2/completion.rs \
            crates/perl-semantic-analyzer/tests/dancer2_route_facts.rs \
            crates/perl-semantic-facts/src/framework_adapters/dancer2.rs \
            crates/perl-semantic-facts/src/route.rs
          git commit -m "fix(dancer2): gate keyword facts by framework version (#13089)"
          git push origin HEAD:fix/13089-dancer2-dsl-keywords
