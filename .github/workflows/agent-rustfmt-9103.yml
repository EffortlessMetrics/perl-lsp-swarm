name: One-shot rustfmt for #9103

on:
  push:
    branches:
      - agent/distribution-surface-registry-9103

permissions:
  contents: write

concurrency:
  group: agent-rustfmt-9103
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/distribution-surface-registry-9103
          fetch-depth: 1
          persist-credentials: true

      - name: Install pinned formatter
        uses: ./.github/actions/setup-rust
        with:
          toolchain: '1.95.0'
          components: rustfmt
          cache: 'false'

      - name: Format candidate and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          rm .github/workflows/agent-rustfmt-9103.yml
          git diff --check

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'No formatter changes were required.'
            exit 0
          fi
          git commit -m 'style(distribution): apply pinned rustfmt (#9103)'
          git push origin HEAD:agent/distribution-surface-registry-9103
