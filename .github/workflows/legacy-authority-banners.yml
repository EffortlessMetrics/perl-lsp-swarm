name: Legacy Authority Banners

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: legacy-authority-banners-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check local legacy-authority banners
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate banners, registry agreement, and inert migrator
        run: |
          python3 -m unittest \
            tests/test_legacy_authority_banners.py \
            tests/test_agent_authority_status.py

      - name: Check diff hygiene
        run: git diff --check
