name: Apply Legacy Authority Banners

on:
  push:
    branches: [codex/4555-local-authority-banners]
    paths:
      - '.github/workflows/legacy-authority-banners.yml'

permissions:
  contents: write

concurrency:
  group: apply-legacy-authority-banners
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify local authority banners
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Apply bounded banner migration
        run: python3 scripts/migrate-legacy-authority-banners.py

      - name: Verify migrated authority surfaces
        run: python3 -m unittest tests/test_legacy_authority_banners.py

      - name: Check migrated diff hygiene
        run: git diff --check

      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            docs/reference/ORCHESTRATION_DOCTRINE.md \
            docs/reference/PIPELINE_GATES.md \
            docs/reference/OCTOPUS_CLUSTER.md \
            docs/reference/GLOSSARY.md \
            docs/reference/LIVE_SIGNALS_VS_LABELS.md \
            docs/adr/0044-octopus-cluster-orchestration.md \
            docs/articles/PIPELINE_STATE_MACHINE.md \
            docs/handoff/SWARM_DESIGN.md \
            .spec/3988-merge-readiness/spec.md
          if git diff --cached --quiet; then
            echo "No banner changes required"
            exit 0
          fi
          git commit -m "docs(control-plane): mark legacy authority files historical"
          git push origin HEAD
