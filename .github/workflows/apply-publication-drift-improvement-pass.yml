name: Apply publication drift improvement pass

on:
  push:
    branches:
      - agent/publication-drift-classifier-6743

permissions:
  contents: write

concurrency:
  group: apply-publication-drift-improvement-pass
  cancel-in-progress: false

jobs:
  improve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: agent/publication-drift-classifier-6743

      - name: Apply reviewed fixes
        shell: bash
        env:
          PATCH_SCRIPT_B64: [... ELLIPSIZATION ...]
        run: |
          printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode > /tmp/apply-publication-drift-improvements.py
          python3 /tmp/apply-publication-drift-improvements.py

      - name: Format and verify improvement pass
        shell: bash
        run: |
          cargo fmt -p xtask
          git diff --check
          cargo test -p xtask --lib --locked publication_drift
          cargo test -p xtask --test publication_drift_cli --locked

      - name: Commit verified improvements and remove executor
        shell: bash
        run: |
          git rm .github/workflows/apply-publication-drift-improvement-pass.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git commit -m "refactor(release): harden publication drift proof surface (#6743)"
          git push origin HEAD:agent/publication-drift-classifier-6743
