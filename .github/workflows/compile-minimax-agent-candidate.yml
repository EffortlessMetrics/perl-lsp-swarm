name: Compile MiniMax Agent Candidate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/minimax-coding-agent.md'
      - '.github/workflows/minimax-coding-agent.lock.yml'
      - '.github/workflows/compile-minimax-agent-candidate.yml'
      - 'scripts/ci/prepare_minimax_agent_final.py'
      - 'scripts/ci/workflow_security_ratchet.py'
      - 'scripts/ci/test_workflow_security_ratchet.py'
      - '.ci/workflow-security-baseline.json'
      - '.ci/policies/action-pin-provenance.toml'

permissions:
  contents: read

concurrency:
  group: compile-minimax-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  compile:
    if: >-
      github.repository == 'EffortlessMetrics/perl-lsp-swarm' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/gh-aw-minimax-canary' &&
      github.event.pull_request.user.login == 'EffortlessSteven'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned gh-aw compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler="${RUNNER_TEMP:?}/gh-aw-v0.88.7"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 180 \
            https://github.com/github/gh-aw/releases/download/v0.88.7/linux-amd64 \
            --output "$compiler"
          printf '%s  %s\n' \
            37faaaa95f622b910568bc878452f6036f01e951380fdfc41441944a95da43bf \
            "$compiler" | sha256sum --check --status
          chmod 0755 "$compiler"
          "$compiler" --version
          echo "GH_AW_COMPILER=$compiler" >> "$GITHUB_ENV"

      - name: Recompile reviewed strict workflow lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$GH_AW_COMPILER" compile minimax-coding-agent \
            --strict --verbose --approve --no-check-update
          test -s .github/workflows/minimax-coding-agent.lock.yml
          test -s .github/aw/actions-lock.json

      - name: Build final policy and drift-check candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/prepare_minimax_agent_final.py

      - name: Verify ratchet changes and regenerate exact baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/workflow_security_ratchet.py
          python3 -m unittest scripts/ci/test_workflow_security_ratchet.py
          python3 scripts/ci/workflow_security_ratchet.py baseline \
            --root . \
            --output .ci/workflow-security-baseline.json
          python3 scripts/ci/workflow_security_ratchet.py validate-baseline \
            --root . \
            --baseline .ci/workflow-security-baseline.json \
            --baseline-root . \
            --report /tmp/workflow-security-final.json

      - name: Package final candidate authority
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:?}/minimax-agent-final"
          mkdir -p "$out"
          files=(
            .github/workflows/minimax-coding-agent.lock.yml
            .github/aw/actions-lock.json
            .gitattributes
            scripts/ci/workflow_security_ratchet.py
            scripts/ci/test_workflow_security_ratchet.py
            .ci/workflow-security-baseline.json
            .ci/policies/action-pin-provenance.toml
            .github/workflows/minimax-agent-compile-check.yml
          )
          sha256sum "${files[@]}" > "$out/sha256sums.txt"
          tar --create --gzip --file "$out/final-authority.tar.gz" "${files[@]}"
          cp /tmp/workflow-security-final.json "$out/"
          cat > "$out/receipt.txt" <<RECEIPT
          source_head=${SOURCE_HEAD}
          compiler_version=v0.88.7
          compiler_sha256=37faaaa95f622b910568bc878452f6036f01e951380fdfc41441944a95da43bf
          compile_mode=strict-approved-no-update-check
          temporary_compiler_deleted=true
          temporary_generator_deleted=true
          ratchet_unit_tests=pass
          exact_baseline_validation=pass
          RECEIPT

      - name: Upload final text as dangling Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          upload_blob() {
            local path="$1"
            jq -Rs '{content: ., encoding: "utf-8"}' "$path" |
              gh api --method POST "repos/${REPOSITORY}/git/blobs" --input - --jq '.sha'
          }
          out="${RUNNER_TEMP:?}/minimax-agent-final/receipt.txt"
          while IFS='|' read -r label path; do
            sha="$(upload_blob "$path")"
            printf '%s_blob_sha=%s\n' "$label" "$sha" | tee -a "$out"
          done <<'FILES'
          lock|.github/workflows/minimax-coding-agent.lock.yml
          action_lock|.github/aw/actions-lock.json
          gitattributes|.gitattributes
          ratchet|scripts/ci/workflow_security_ratchet.py
          ratchet_tests|scripts/ci/test_workflow_security_ratchet.py
          ratchet_baseline|.ci/workflow-security-baseline.json
          pin_ledger|.ci/policies/action-pin-provenance.toml
          compile_check|.github/workflows/minimax-agent-compile-check.yml
          FILES

      - name: Upload final candidate authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minimax-agent-final-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/minimax-agent-final
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
