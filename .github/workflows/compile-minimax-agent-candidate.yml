name: Compile MiniMax Agent Candidate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/minimax-coding-agent.md'
      - '.github/workflows/compile-minimax-agent-candidate.yml'

permissions:
  contents: read

concurrency:
  group: compile-minimax-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  compile:
    if: >-
      github.repository == 'EffortlessMetrics/perl-lsp-swarm' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/gh-aw-minimax-canary' &&
      github.event.pull_request.user.login == 'EffortlessSteven'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned gh-aw compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler="${RUNNER_TEMP:?}/gh-aw-v0.88.7"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 180 \
            https://github.com/github/gh-aw/releases/download/v0.88.7/linux-amd64 \
            --output "$compiler"
          printf '%s  %s\n' \
            37faaaa95f622b910568bc878452f6036f01e951380fdfc41441944a95da43bf \
            "$compiler" | sha256sum --check --status
          chmod 0755 "$compiler"
          "$compiler" --version
          echo "GH_AW_COMPILER=$compiler" >> "$GITHUB_ENV"

      - name: Compile strict workflow lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$GH_AW_COMPILER" compile minimax-coding-agent --strict --verbose
          test -s .github/workflows/minimax-coding-agent.lock.yml

      - name: Commit generated compiler authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add \
            .github/workflows/minimax-coding-agent.lock.yml \
            .github/aw/actions-lock.json \
            .github/dependabot.yml
          if git diff --cached --quiet; then
            echo 'Compiled lock is already current.'
            exit 0
          fi
          git config user.name 'EffortlessSteven'
          git config user.email '15812269+EffortlessSteven@users.noreply.github.com'
          git commit -m 'ci(agent): compile MiniMax workflow lock'
          gh auth setup-git
          git push origin "HEAD:${HEAD_REF}"
