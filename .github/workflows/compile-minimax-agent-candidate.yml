name: Compile MiniMax Agent Candidate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/minimax-coding-agent.md'
      - '.github/workflows/compile-minimax-agent-candidate.yml'

permissions:
  contents: read

concurrency:
  group: compile-minimax-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  compile:
    if: >-
      github.repository == 'EffortlessMetrics/perl-lsp-swarm' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/gh-aw-minimax-canary' &&
      github.event.pull_request.user.login == 'EffortlessSteven'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned gh-aw compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler="${RUNNER_TEMP:?}/gh-aw-v0.88.7"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 180 \
            https://github.com/github/gh-aw/releases/download/v0.88.7/linux-amd64 \
            --output "$compiler"
          printf '%s  %s\n' \
            37faaaa95f622b910568bc878452f6036f01e951380fdfc41441944a95da43bf \
            "$compiler" | sha256sum --check --status
          chmod 0755 "$compiler"
          "$compiler" --version
          echo "GH_AW_COMPILER=$compiler" >> "$GITHUB_ENV"

      - name: Compile reviewed strict workflow lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$GH_AW_COMPILER" compile minimax-coding-agent --strict --verbose --approve
          test -s .github/workflows/minimax-coding-agent.lock.yml
          test -s .github/aw/actions-lock.json

      - name: Package generated authority and receipt
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:?}/minimax-agent-generated"
          mkdir -p "$out"
          files=(
            .github/workflows/minimax-coding-agent.lock.yml
            .github/aw/actions-lock.json
            .gitattributes
          )
          if ! git diff --quiet -- .github/dependabot.yml; then
            files+=(.github/dependabot.yml)
          fi
          sha256sum "${files[@]}" > "$out/sha256sums.txt"
          tar --create --gzip --file "$out/generated-authority.tar.gz" "${files[@]}"
          cat > "$out/receipt.txt" <<RECEIPT
          source_head=${CANDIDATE_SHA}
          compiler_version=v0.88.7
          compiler_sha256=37faaaa95f622b910568bc878452f6036f01e951380fdfc41441944a95da43bf
          compile_mode=strict-approved
          generated_lock=.github/workflows/minimax-coding-agent.lock.yml
          generated_action_cache=.github/aw/actions-lock.json
          RECEIPT

      - name: Upload generated authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minimax-agent-generated-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/minimax-agent-generated
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
