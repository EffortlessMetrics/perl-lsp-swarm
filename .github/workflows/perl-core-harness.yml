name: Perl Core Harness

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected-evidence:
    name: Selected upstream comparison-series evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The repository MSRV remains unchanged. This workflow deliberately measures
      # the compiler with the installed Rust 1.97 toolchain and records that identity.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          cargo +1.97.0 --version

      - name: Install upstream Perl build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libdb-dev \
            libgdbm-dev \
            zlib1g-dev

      - name: Read pinned upstream config
        id: upstream
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path(".ci/perl-core-harness/upstream.toml").read_text())
          print(f"ref={config['ref']}")
          print(f"profile={config.get('profile', 'base')}")
          print(f"modes={','.join(config.get('modes', ['parse', 'compile']))}")
          print(f"runner={config.get('runner', 'test')}")
          PY

      - name: Prepare upstream Perl tree
        run: |
          cargo +1.97.0 run --locked -p xtask -- perl-core-harness prepare \
            --ref "${{ steps.upstream.outputs.ref }}" \
            --output-dir "target/perl-core/upstream/${{ steps.upstream.outputs.ref }}"

      - name: Record measured subject identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ steps.upstream.outputs.ref }}"
          receipt="target/perl-core/prepare/${ref}/prepare.json"
          prepared_tree="target/perl-core/upstream/${ref}/perl5"
          test -s "$receipt"
          digest="$(sha256sum "$receipt" | awk '{print $1}')"
          perl_resolved_ref="$(git -C "$prepared_tree" rev-parse HEAD)"
          {
            echo "receipt=$receipt"
            echo "digest=$digest"
            echo "perl_resolved_ref=$perl_resolved_ref"
            echo "preparation_id=perl-prepare-${ref}"
            echo "compiler_subject_identity=perl-lsp-swarm:${GITHUB_SHA}:rustc-1.97.0:perl-core-harness.v1"
            echo "invocation_identity=perl-core-harness:smoke:v1:runner-${{ steps.upstream.outputs.runner }}:parse-compile"
            echo "capability_identity=linux:perl-core-harness:runner-${{ steps.upstream.outputs.runner }}:parse-compile"
            echo "environment_identity=ubuntu-24.04:rustc-1.97.0"
          } >> "$GITHUB_OUTPUT"

      - name: Build selected comparison series and evidence bundles
        shell: bash
        run: |
          set -uo pipefail
          overall_status=0
          ref="${{ steps.upstream.outputs.ref }}"
          perl_resolved_ref="${{ steps.identity.outputs.perl_resolved_ref }}"
          modes="${{ steps.upstream.outputs.modes }}"
          runner="${{ steps.upstream.outputs.runner }}"
          prepared_tree="target/perl-core/upstream/${ref}/perl5"
          preparation="${{ steps.identity.outputs.receipt }}"
          preparation_digest="${{ steps.identity.outputs.digest }}"
          preparation_id="${{ steps.identity.outputs.preparation_id }}"
          compiler_subject_identity="${{ steps.identity.outputs.compiler_subject_identity }}"
          invocation_identity="${{ steps.identity.outputs.invocation_identity }}"
          capability_identity="${{ steps.identity.outputs.capability_identity }}"
          environment_identity="${{ steps.identity.outputs.environment_identity }}"

          for profile in base comp run; do
            profile_dir="target/perl-core/smoke/${profile}"
            series="target/perl-core/series/${profile}.json"
            series_id="selected-${profile}-perl-5.42.2"
            mkdir -p "$profile_dir" "target/perl-core/series" "target/perl-core/baselines"

            # Discovery is performed before parsing or compiling so the denominator
            # is frozen into the series manifest before result evidence is accepted.
            if ! cargo +1.97.0 run --locked -p xtask -- perl-core-harness discover \
              --perl-tree "$prepared_tree" \
              --host-perl perl \
              --runner "$runner" \
              --profile "$profile" \
              --perl-ref "$ref" \
              --output "$profile_dir/discovery.json" \
              --raw-output "$profile_dir/discovery.raw.txt"; then
              overall_status=1
              continue
            fi

            if ! cargo +1.97.0 run --locked -p xtask -- perl-core-harness series-manifest \
              --discovery "$profile_dir/discovery.json" \
              --output "$series" \
              --series-id "$series_id" \
              --profile "$profile" \
              --perl-requested-ref "$ref" \
              --perl-resolved-ref "$perl_resolved_ref" \
              --preparation-receipt-id "$preparation_id" \
              --preparation-receipt-digest "$preparation_digest" \
              --compiler-subject-identity "$compiler_subject_identity" \
              --invocation-identity "$invocation_identity" \
              --capability-identity "$capability_identity" \
              --environment-identity "$environment_identity" \
              --change-reason "initial pinned selected comparison series"; then
              overall_status=1
              continue
            fi

            if ! cargo +1.97.0 run --locked -p xtask -- perl-core-harness series-manifest \
              --discovery "$profile_dir/discovery.json" \
              --output "$series" \
              --series-id "$series_id" \
              --profile "$profile" \
              --perl-requested-ref "$ref" \
              --perl-resolved-ref "$perl_resolved_ref" \
              --preparation-receipt-id "$preparation_id" \
              --preparation-receipt-digest "$preparation_digest" \
              --compiler-subject-identity "$compiler_subject_identity" \
              --invocation-identity "$invocation_identity" \
              --capability-identity "$capability_identity" \
              --environment-identity "$environment_identity" \
              --change-reason "initial pinned selected comparison series" \
              --check; then
              overall_status=1
              continue
            fi

            if ! cargo +1.97.0 run --locked -p xtask -- perl-core-harness smoke \
              --perl-tree "$prepared_tree" \
              --host-perl perl \
              --runner "$runner" \
              --profile "$profile" \
              --modes "$modes" \
              --perl-ref "$ref" \
              --output-dir "$profile_dir"; then
              # Keep the red receipt and diagnostics for classification, but do not
              # manufacture a v2 baseline or an accepted bundle from a failed run.
              overall_status=1
              continue
            fi

            terminal_receipt="$profile_dir/terminal-admission.json"
            admitted_dir="$profile_dir/admitted-reports"
            admitted_parse="$admitted_dir/parse.json"
            admitted_compile="$admitted_dir/compile.json"
            if ! cargo +1.97.0 run --locked -p perl-core-harness \
              --bin perl-core-harness-terminal-admission -- \
              --report "$profile_dir/parse.json" \
              --report "$profile_dir/compile.json" \
              --output "$terminal_receipt" \
              --admitted-dir "$admitted_dir" \
              --expected-runner "$runner" \
              --expected-profile "$profile" \
              --expected-commit "$GITHUB_SHA" \
              --expected-perl-ref "$perl_resolved_ref"; then
              # Legacy missing/nonzero status is NOT_PROVEN even when file and
              # assertion counts are green. Preserve the typed receipt and stop.
              overall_status=1
              continue
            fi

            verify_terminal_receipt() {
              cargo +1.97.0 run --locked -p perl-core-harness \
                --bin perl-core-harness-terminal-admission -- \
                --check-receipt "$terminal_receipt" \
                --expected-runner "$runner" \
                --expected-profile "$profile" \
                --expected-commit "$GITHUB_SHA" \
                --expected-perl-ref "$perl_resolved_ref"
            }

            boundaries="$profile_dir/semantic-boundaries.json"
            reproduction="$profile_dir/reproduction.json"
            candidate="target/perl-core/baselines/${profile}-compile-candidate.json"
            accepted="target/perl-core/baselines/${profile}-compile-accepted.json"
            bundle_id="perl-5.42.2-${profile}-${GITHUB_SHA}"
            bundle="target/perl-core/bundles/${bundle_id}"

            if ! verify_terminal_receipt; then
              overall_status=1
              continue
            fi
            python3 - "$admitted_compile" "$boundaries" "$reproduction" \
              "$series_id" "$profile" "$compiler_subject_identity" <<'PY'
          import json
          import sys
          from pathlib import Path

          compile_path, boundaries_path, reproduction_path, series_id, profile, subject = sys.argv[1:]
          compile_report = json.loads(Path(compile_path).read_text())
          boundaries = compile_report.get("semantic_boundaries", [])
          Path(boundaries_path).write_text(json.dumps(boundaries, indent=2, sort_keys=True) + "\n")
          reproduction = {
              "schema_version": "perl_core_harness.evidence_reproduction.v1",
              "series_id": series_id,
              "profile": profile,
              "modes": ["parse", "compile"],
              "commands": [
                  "cargo +1.97.0 run --locked -p xtask -- perl-core-harness discover --profile " + profile,
                  "cargo +1.97.0 run --locked -p xtask -- perl-core-harness smoke --profile " + profile + " --modes parse,compile",
              ],
              "compiler_subject_identity": subject,
              "deterministic": True,
          }
          Path(reproduction_path).write_text(json.dumps(reproduction, indent=2, sort_keys=True) + "\n")
          PY

            if ! verify_terminal_receipt; then
              overall_status=1
              continue
            fi
            if ! cargo +1.97.0 run --locked -p xtask -- perl-core-harness baseline \
              --mode compile \
              --profile "$profile" \
              --report "$admitted_compile" \
              --baseline "$candidate" \
              --series "$series" \
              --compiler-subject-identity "$compiler_subject_identity" \
              --invocation-identity "$invocation_identity" \
              --capability-identity "$capability_identity" \
              --environment-identity "$environment_identity" \
              --evidence-bundle "$bundle_id" \
              --accept; then
              overall_status=1
              continue
            fi
            cp -- "$candidate" "$accepted"

            if ! verify_terminal_receipt; then
              overall_status=1
              continue
            fi
            if ! cargo +1.97.0 run --locked -p xtask -- perl-core-harness bundle \
              --write \
              --output-dir "$bundle" \
              --bundle-id "$bundle_id" \
              --measurement-sha "$GITHUB_SHA" \
              --claim-boundary "selected parse and compile acceptance with explicit semantic-boundary inventory" \
              --repository-root "$GITHUB_WORKSPACE" \
              --series "$series" \
              --preparation "$preparation" \
              --discovery-raw "$profile_dir/discovery.raw.txt" \
              --discovery "$profile_dir/discovery.json" \
              --parse "$admitted_parse" \
              --compile "$admitted_compile" \
              --runner-records "$profile_dir/runner-records.jsonl" \
              --semantic-boundaries "$boundaries" \
              --gap-map "$profile_dir/gap-map.json" \
              --smoke "$profile_dir/smoke.json" \
              --baseline-candidate "$candidate" \
              --baseline-accepted "$accepted" \
              --reproduction "$reproduction"; then
              overall_status=1
              continue
            fi

            if ! cargo +1.97.0 run --locked -p xtask -- perl-core-harness bundle \
              --check \
              --bundle-dir "$bundle" \
              --repository-root "$GITHUB_WORKSPACE"; then
              overall_status=1
              continue
            fi

            if ! cargo +1.97.0 run --locked -p perl-core-harness \
              --bin perl-core-harness-public-evidence -- \
              --bundle-dir "$bundle"; then
              overall_status=1
            fi
          done

          exit "$overall_status"

      - name: Summarize selected receipts
        if: always()
        shell: bash
        run: |
          {
            echo "## Perl core harness selected evidence"
            echo
            echo "- measurement SHA: `${GITHUB_SHA}`"
            echo "- Perl ref: `${{ steps.upstream.outputs.ref }}`"
            echo "- Perl resolved ref: `${{ steps.identity.outputs.perl_resolved_ref }}`"
            echo "- Rust toolchain: `1.97.0`"
            echo "- modes: `${{ steps.upstream.outputs.modes }}`"
            echo "- accepted claim: selected parse/compile evidence only; execution and general semantic support are not implied"
            echo
            python3 - <<'PY'
          import json
          from pathlib import Path

          for profile in ("base", "comp", "run"):
              series_path = Path(f"target/perl-core/series/{profile}.json")
              smoke_path = Path(f"target/perl-core/smoke/{profile}/smoke.json")
              terminal_path = Path(f"target/perl-core/smoke/{profile}/terminal-admission.json")
              bundle_indexes = list(Path("target/perl-core/bundles").glob(f"perl-5.42.2-{profile}-*/index.json"))
              print(f"### `{profile}`")
              if series_path.exists():
                  series = json.loads(series_path.read_text())
                  print(f"- series: `{series['series_id']}`")
                  print(f"- manifest files: `{len(series['normalized_manifest'])}`")
                  print(f"- manifest hash: `{series['manifest_hash']}`")
              else:
                  print("- series: not written")
              if smoke_path.exists():
                  smoke = json.loads(smoke_path.read_text())
                  print(f"- smoke status: `{smoke['status']}`")
                  print(f"- parse: `{smoke.get('parse_files_passed')}/{smoke.get('parse_files_total')}`")
                  print(f"- compile: `{smoke.get('compile_files_passed')}/{smoke.get('compile_files_total')}`")
              else:
                  print("- smoke receipt: not written")
              if terminal_path.exists():
                  terminal = json.loads(terminal_path.read_text())
                  print(f"- terminal admission: `{terminal['verdict']}`")
                  print(f"- admitted reports: `{len(terminal.get('reports', []))}`")
              else:
                  print("- terminal admission: not written")
              print(f"- bundle index: `{bundle_indexes[0] if bundle_indexes else 'not written'}`")
              print()
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Perl core harness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perl-core-harness-${{ github.sha }}
          # Keep normalized evidence and bounded diagnostics; disposable Perl
          # run trees are not evidence and make the artifact unnecessarily huge.
          path: |
            target/perl-core/bundles/
            target/perl-core/series/
            target/perl-core/baselines/
            target/perl-core/smoke/
            target/perl-core/prepare/**/prepare.json
          if-no-files-found: warn
          retention-days: 30
