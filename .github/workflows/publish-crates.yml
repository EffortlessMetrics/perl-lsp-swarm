name: Publish to crates.io

# Automated publishing of all crates to crates.io
# Uses cargo metadata for correct dependency-order publishing

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.x.y)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no actual publishing)'
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-crates-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Step 1: Compute topological publish order from cargo metadata
  compute-order:
    name: Compute publish order
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      crates: ${{ steps.topo.outputs.crates }}
      version: ${{ steps.release-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: stable

      - name: Compute topological order
        id: topo
        run: |
          cargo metadata --format-version=1 --no-deps | python3 -c '
          import json, sys

          meta = json.load(sys.stdin)
          workspace_members = set(meta["workspace_members"])

          # Build name -> package info map (only workspace members)
          packages = {}
          for pkg in meta["packages"]:
              if pkg["id"] in workspace_members:
                  packages[pkg["name"]] = pkg

          # Build separate normal and dev dependency graphs (only internal deps).
          # cargo publish resolves dev-deps from the registry when packaging the
          # manifest, so a crate that dev-depends on another workspace member
          # must be published after that member. However, dev-dep edges can
          # form cycles between workspace crates. We break those cycles by
          # running Tarjan SCC: intra-SCC dev edges are dropped, while
          # inter-SCC dev edges are kept.
          from collections import defaultdict

          normal_deps = defaultdict(set)
          dev_deps = defaultdict(set)
          for name, pkg in packages.items():
              for dep in pkg["dependencies"]:
                  if dep["name"] not in packages:
                      continue
                  if dep.get("kind") == "dev":
                      dev_deps[name].add(dep["name"])
                  else:
                      normal_deps[name].add(dep["name"])

          def tarjan_sccs(graph, nodes):
              index_counter = [0]
              stack = []
              lowlink = {}
              index = {}
              on_stack = {}
              sccs = []

              def strongconnect(v):
                  index[v] = index_counter[0]
                  lowlink[v] = index_counter[0]
                  index_counter[0] += 1
                  stack.append(v)
                  on_stack[v] = True
                  for w in graph.get(v, set()):
                      if w not in index:
                          strongconnect(w)
                          lowlink[v] = min(lowlink[v], lowlink[w])
                      elif on_stack.get(w):
                          lowlink[v] = min(lowlink[v], index[w])
                  if lowlink[v] == index[v]:
                      scc = []
                      while True:
                          w = stack.pop()
                          on_stack[w] = False
                          scc.append(w)
                          if w == v:
                              break
                      sccs.append(scc)

              sys.setrecursionlimit(max(10000, len(nodes) * 2))
              for v in nodes:
                  if v not in index:
                      strongconnect(v)
              return sccs

          full_graph = {name: normal_deps[name] | dev_deps[name] for name in packages}
          sccs = tarjan_sccs(full_graph, list(packages.keys()))
          node_to_scc = {}
          for i, scc in enumerate(sccs):
              for node in scc:
                  node_to_scc[node] = i

          deps = {}
          for name in packages:
              deps[name] = set(normal_deps[name])
              for dep in dev_deps[name]:
                  if node_to_scc.get(dep) != node_to_scc.get(name):
                      deps[name].add(dep)

          # Topological sort (Kahn algorithm)
          in_degree = {name: len(d) for name, d in deps.items()}
          queue = sorted([n for n, d in in_degree.items() if d == 0])
          order = []

          while queue:
              node = queue.pop(0)
              order.append(node)
              for name, d in deps.items():
                  if node in d:
                      in_degree[name] -= 1
                      if in_degree[name] == 0:
                          queue.append(name)
                          queue.sort()

          if len(order) != len(packages):
              print("ERROR: cycle detected in dependency graph", file=sys.stderr)
              sys.exit(1)

          # Filter to only crates listed in the workspace publish allowlist.
          allowlist = meta.get("metadata", {}).get("publish", {}).get("allow", [])
          if not isinstance(allowlist, list):
              print(
                  "ERROR: Workspace publish allowlist must be a list at [workspace.metadata.publish.allow].",
                  file=sys.stderr,
              )
              sys.exit(1)

          allowed = []
          for crate_name in allowlist:
              if not isinstance(crate_name, str):
                  print(
                      f"ERROR: Invalid publish allowlist entry (not a string): {crate_name}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              if crate_name in allowed:
                  continue

              if crate_name not in packages:
                  print(
                      f"ERROR: Crate in publish allowlist is not a workspace member: {crate_name}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              allowed.append(crate_name)

          if len(allowed) == 0:
              print(
                  "ERROR: Publish allowlist is empty. Set [workspace.metadata.publish.allow] in workspace Cargo.toml.",
                  file=sys.stderr,
              )
              sys.exit(1)

          result = []
          for name in order:
              if name not in allowed:
                  continue
              pkg = packages[name]
              result.append({"name": name, "version": pkg["version"]})

          print(json.dumps(result))
          ' > /tmp/crates.json

          printf 'crates=%s\n' "$(cat /tmp/crates.json)" >> "$GITHUB_OUTPUT"
          printf 'Publish order (%s crates):\n' "$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' < /tmp/crates.json)"
          python3 -c '
          import json, sys
          for i, c in enumerate(json.load(sys.stdin), 1):
              print("  {}. {}@{}".format(i, c["name"], c["version"]))
          ' < /tmp/crates.json

      - name: Resolve and validate target version
        id: release-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${RELEASE_TAG#v}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            printf '::error::Invalid release version: %s\n' "$VERSION"
            exit 1
          fi

          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'Resolved target version: %s\n' "$VERSION"

  # Step 2: Publish crates sequentially in dependency order
  publish:
    name: Publish crates
    needs: compute-order
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true

      - name: Validate crate versions match release target
        env:
          CRATES_JSON: ${{ needs.compute-order.outputs.crates }}
          TARGET_VERSION: ${{ needs.compute-order.outputs.version }}
        run: |
          printf '%s\n' "$CRATES_JSON" | python3 -c '
          import json, os, sys

          target = os.environ["TARGET_VERSION"]
          crates = json.load(sys.stdin)
          mismatches = [
              "{}@{}".format(crate["name"], crate["version"])
              for crate in crates
              if crate["version"] != target
          ]

          if mismatches:
              print(
                  "::error::Crate versions do not match release target {}: {}".format(
                      target,
                      ", ".join(mismatches),
                  )
              )
              sys.exit(1)

          print("All publishable crates match target version {}".format(target))
          '

      - name: Check perl-lsp-rs-core packaged build inputs
        run: python3 scripts/ci/check_perl_lsp_rs_core_package.py

      - name: Test publish package guard
        run: python3 scripts/ci/test_check_publish_package_contents.py

      - name: Publish all crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES_JSON: ${{ needs.compute-order.outputs.crates }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          assert_clean_workspace() {
            local context="$1"
            local dirty=false

            if ! git diff --quiet -- || ! git diff --cached --quiet --; then
              dirty=true
            fi

            local untracked
            untracked="$(git ls-files --others --exclude-standard)"
            if [ -n "$untracked" ]; then
              dirty=true
            fi

            if [ "$dirty" = "true" ]; then
              printf '::error::Workspace is not clean %s. Refusing to publish.\n' "$context"
              git status --short
              exit 1
            fi
          }

          assert_only_manifest_dirty() {
            local manifest_rel="$1"
            local context="$2"

            if ! git diff --cached --quiet --; then
              printf '::error::Staged changes exist %s. Refusing to publish.\n' "$context"
              git status --short
              exit 1
            fi

            local untracked
            untracked="$(git ls-files --others --exclude-standard)"
            if [ -n "$untracked" ]; then
              printf '::error::Untracked files exist %s. Refusing to publish.\n' "$context"
              printf '%s\n' "$untracked"
              exit 1
            fi

            mapfile -t changed_paths < <(git diff --name-only --)
            if [ "${#changed_paths[@]}" -gt 1 ]; then
              printf '::error::More than one tracked file changed %s. Refusing to publish.\n' "$context"
              git status --short
              exit 1
            fi
            if [ "${#changed_paths[@]}" -eq 1 ] && [ "${changed_paths[0]}" != "$manifest_rel" ]; then
              printf '::error::Unexpected tracked file changed %s: %s (expected %s).\n' "$context" "${changed_paths[0]}" "$manifest_rel"
              exit 1
            fi
          }

          TOTAL="$(printf '%s\n' "$CRATES_JSON" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          printf 'Publishing %s crates...\n' "$TOTAL"

          # Compute the sparse-index path for a crate name per the cargo
          # sparse-index layout: https://doc.rust-lang.org/cargo/reference/registry-index.html
          sparse_index_path() {
            local name_lc
            name_lc=$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')
            local len=${#name_lc}
            case "$len" in
              1) printf '1/%s' "$name_lc" ;;
              2) printf '2/%s' "$name_lc" ;;
              3) printf '3/%s/%s' "${name_lc:0:1}" "$name_lc" ;;
              *) printf '%s/%s/%s' "${name_lc:0:2}" "${name_lc:2:2}" "$name_lc" ;;
            esac
          }

          # Returns 0 if $1@$2 is present (non-yanked) in the crates.io sparse
          # index, 1 otherwise.
          check_sparse_index() {
            local name="$1"
            local version="$2"
            local path
            path=$(sparse_index_path "$name")
            local url="https://index.crates.io/${path}"
            local body
            body=$(curl -fsSL --max-time 15 "$url" 2>/dev/null) || return 1
            printf '%s\n' "$body" | VERS="$version" python3 -c '
          import json, os, sys
          target = os.environ["VERS"]
          for line in sys.stdin:
              line = line.strip()
              if not line:
                  continue
              try:
                  entry = json.loads(line)
              except Exception:
                  continue
              if entry.get("vers") == target and not entry.get("yanked", False):
                  sys.exit(0)
          sys.exit(1)
          '
          }

          # Build a map of crate name -> manifest path from cargo metadata.
          MANIFEST_MAP="$(mktemp)"
          cargo metadata --format-version=1 --no-deps | python3 -c '
          import json, sys
          meta = json.load(sys.stdin)
          ws = set(meta["workspace_members"])
          for pkg in meta["packages"]:
              if pkg["id"] in ws:
                  print("{} {}".format(pkg["name"], pkg["manifest_path"]))
          ' > "$MANIFEST_MAP"

          # Strip the top-level [dev-dependencies] section for packaging. Cargo
          # resolves dev-deps while preparing a publish even with --no-verify;
          # workspace dev-dependency cycles therefore require this temporary,
          # explicitly verified manifest-only edit.
          STRIP_SCRIPT="$(mktemp --suffix=.py)"
          cat > "$STRIP_SCRIPT" << 'STRIP_SCRIPT_EOF'
          import pathlib
          import re
          import sys

          # Match every dev-dependency table form TOML allows, not just the bare
          # header: `[dev-dependencies]`, the dotted per-crate form
          # `[dev-dependencies.foo]`, and the target-scoped forms
          # `[target.'cfg(unix)'.dev-dependencies]` and its dotted variant.
          # The bare-header-only pattern left dotted tables behind, which would
          # reach cargo as unresolvable dev-dep edges during packaging.
          DEV_DEP_TABLE = re.compile(
              r"^\[(?:"
              r"dev-dependencies(?:\.[^\]\r\n]+)?"
              r"|target\.[^\]\r\n]+\.dev-dependencies(?:\.[^\]\r\n]+)?"
              r")\].*?(?=^\[|\Z)",
              flags=re.MULTILINE | re.DOTALL,
          )

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          new_text = DEV_DEP_TABLE.sub("", text)
          path.write_text(new_text, encoding="utf-8")
          STRIP_SCRIPT_EOF

          FAILED_CRATES=()
          PUBLISHED_COUNT=0
          CRATES_LIST="$(mktemp)"
          printf '%s\n' "$CRATES_JSON" | python3 -c 'import json,sys; [print("{} {}".format(c["name"], c["version"])) for c in json.load(sys.stdin)]' > "$CRATES_LIST"

          if [ "$DRY_RUN" != "true" ]; then
            assert_clean_workspace "before the publish loop"
          fi

          while read -r CRATE VERSION; do
            echo ""
            printf '===> %s@%s\n' "$CRATE" "$VERSION"

            # Locate the manifest for this crate (package name may differ from
            # directory name, so we look it up from cargo metadata).
            MANIFEST_PATH="$(grep "^${CRATE} " "$MANIFEST_MAP" | awk '{print $2}')"
            if [ -z "$MANIFEST_PATH" ]; then
              echo "::error::Could not find manifest path for $CRATE in cargo metadata"
              exit 1
            fi

            if [ "$DRY_RUN" = "true" ]; then
              TARGET_DIR="${RUNNER_TEMP}/cargo-package-${CRATE//\//-}"
              rm -rf "$TARGET_DIR"
              python3 scripts/ci/check_publish_package_contents.py \
                --crate "$CRATE" --manifest "$MANIFEST_PATH"
              printf 'Dry run: scripts/cargo-package-workspace-dry-run.sh %s (CARGO_TARGET_DIR=%s)\n' "$CRATE" "$TARGET_DIR"
              CARGO_TARGET_DIR="$TARGET_DIR" CARGO_PACKAGE_NO_VERIFY=1 bash scripts/cargo-package-workspace-dry-run.sh "$CRATE"
              continue
            fi

            assert_clean_workspace "before processing $CRATE@$VERSION"

            # Fast-path: if the crate@version is already in the sparse index,
            # nothing to do. Re-runs after partial failure therefore skip work
            # that already landed.
            if check_sparse_index "$CRATE" "$VERSION"; then
              printf '::notice::%s@%s already present in sparse index, skipping\n' "$CRATE" "$VERSION"
              PUBLISHED_COUNT=$((PUBLISHED_COUNT + 1))
              continue
            fi

            MANIFEST_REL="$(python3 - "$MANIFEST_PATH" "$GITHUB_WORKSPACE" <<'PY'
          import pathlib
          import sys

          manifest = pathlib.Path(sys.argv[1]).resolve(strict=True)
          workspace = pathlib.Path(sys.argv[2]).resolve(strict=True)
          try:
              relative = manifest.relative_to(workspace)
          except ValueError:
              raise SystemExit(f"manifest escapes workspace: {manifest}")
          print(relative.as_posix())
          PY
            )"
            git ls-files --error-unmatch "$MANIFEST_REL" >/dev/null

            # Back up the manifest and register a trap to restore it on any
            # unexpected exit so [dev-dependencies] is always reinstated.
            MANIFEST_BACKUP="$(mktemp)"
            cp "$MANIFEST_PATH" "$MANIFEST_BACKUP"
            trap 'cp "$MANIFEST_BACKUP" "$MANIFEST_PATH"; rm -f "$MANIFEST_BACKUP"' EXIT

            printf 'Stripping [dev-dependencies] from %s before publish\n' "$MANIFEST_REL"
            python3 "$STRIP_SCRIPT" "$MANIFEST_PATH"
            # `--allow-dirty` is bounded by re-validating immediately before every
            # publish attempt: zero changes or exactly the selected manifest edit,
            # with no staged/untracked files. Validating once before the loop was
            # not sufficient — `cargo publish` runs without `--locked`, and the
            # dev-dependency strip changes the resolved graph, so a failed attempt
            # can rewrite the tracked root `Cargo.lock` and leave a second,
            # unvalidated dirty file for attempts 2 and 3 to publish.
            PUBLISHED=false
            for attempt in 1 2 3; do
              # Re-check immediately before every publish attempt. A failed
              # cargo invocation or a future pre-publish step must not create a
              # new packaged file between the first check and a retry.
              python3 scripts/ci/check_publish_package_contents.py \
                --crate "$CRATE" --manifest "$MANIFEST_PATH"
              assert_only_manifest_dirty "$MANIFEST_REL" "before publish attempt $attempt/3 for $CRATE@$VERSION"
              printf 'Attempt %s/3: cargo publish -p %s --no-verify --allow-dirty\n' "$attempt" "$CRATE"
              PUBLISH_LOG="$(mktemp)"
              PUBLISH_EXIT=0
              cargo publish -p "$CRATE" --no-verify --allow-dirty 2>&1 | tee "$PUBLISH_LOG" || PUBLISH_EXIT=${PIPESTATUS[0]}

              ALREADY_EXISTS=false
              if grep -q "crate ${CRATE}@${VERSION} already exists on crates.io index" "$PUBLISH_LOG"; then
                printf '::warning::%s@%s already exists on crates.io index\n' "$CRATE" "$VERSION"
                ALREADY_EXISTS=true
              fi

              IS_RATE_LIMITED=false
              if grep -qE "429|Too Many Requests" "$PUBLISH_LOG"; then
                IS_RATE_LIMITED=true
              fi
              rm -f "$PUBLISH_LOG"

              if [ "$PUBLISH_EXIT" != "0" ] && [ "$ALREADY_EXISTS" != "true" ]; then
                if [ "$IS_RATE_LIMITED" = "true" ]; then
                  printf 'Publish attempt %s hit 429 rate limit, waiting 60s before retry...\n' "$attempt"
                  sleep 60
                else
                  printf 'Publish attempt %s failed (exit %s), waiting 30s before retry...\n' "$attempt" "$PUBLISH_EXIT"
                  sleep 30
                fi
                continue
              fi

              if [ "$ALREADY_EXISTS" != "true" ]; then
                echo "Throttle: sleeping 13s to stay under crates.io rate limit (1 update/12s steady-state)..."
                sleep 13
              fi

              printf 'Waiting for %s@%s to appear in sparse index...\n' "$CRATE" "$VERSION"
              INDEXED=false
              ELAPSED=0
              for delta in 5 10 30 45; do
                sleep "$delta"
                ELAPSED=$((ELAPSED + delta))
                if check_sparse_index "$CRATE" "$VERSION"; then
                  printf '%s@%s indexed after %ss\n' "$CRATE" "$VERSION" "$ELAPSED"
                  INDEXED=true
                  break
                fi
                printf '  %ss elapsed, not yet in sparse index...\n' "$ELAPSED"
              done

              if [ "$INDEXED" = "true" ]; then
                PUBLISHED=true
                break
              fi

              printf '::warning::%s@%s not in sparse index after 90s on attempt %s/3; will retry publish\n' "$CRATE" "$VERSION" "$attempt"
            done

            cp "$MANIFEST_BACKUP" "$MANIFEST_PATH"
            rm -f "$MANIFEST_BACKUP"
            trap - EXIT
            assert_clean_workspace "after restoring $MANIFEST_REL"

            if [ "$PUBLISHED" != "true" ]; then
              printf '::error::Failed to publish %s@%s after 3 attempts — not visible in sparse index at https://index.crates.io/%s\n' "$CRATE" "$VERSION" "$(sparse_index_path "$CRATE")"
              FAILED_CRATES+=("$CRATE@$VERSION")
              continue
            fi

            PUBLISHED_COUNT=$((PUBLISHED_COUNT + 1))
          done < "$CRATES_LIST"

          if [ "$DRY_RUN" = "true" ]; then
            echo ""
            printf 'DRY RUN complete: %s crates packaged (no actual publish).\n' "$TOTAL"
            exit 0
          fi

          echo ""
          printf 'PUBLISHED: %s/%s\n' "$PUBLISHED_COUNT" "$TOTAL"
          if [ "${#FAILED_CRATES[@]}" -gt 0 ]; then
            echo ""
            printf 'FAILED CRATES (%s):\n' "${#FAILED_CRATES[@]}"
            for entry in "${FAILED_CRATES[@]}"; do
              printf '  - %s\n' "$entry"
            done
            echo ""
            echo "NEXT STEPS: Re-trigger this workflow with the same version."
            echo "  Already-published crates will be skipped via the sparse-index"
            echo "  fast-path; only the failed crates above will be retried."
            exit 1
          fi
          echo "All crates published successfully."

  # Step 3: Verify all crates are published.
  # This job runs unconditionally after compute-order succeeds so a partial
  # publish produces a hard error listing exactly which crates failed to land.
  verify:
    name: Verify all crates published
    needs: [compute-order, publish]
    if: always() && needs.compute-order.result == 'success' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Verify all crates against sparse index
        env:
          CRATES_JSON: ${{ needs.compute-order.outputs.crates }}
        run: |
          set -euo pipefail
          sparse_index_path() {
            local name_lc
            name_lc=$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')
            local len=${#name_lc}
            case "$len" in
              1) printf '1/%s' "$name_lc" ;;
              2) printf '2/%s' "$name_lc" ;;
              3) printf '3/%s/%s' "${name_lc:0:1}" "$name_lc" ;;
              *) printf '%s/%s/%s' "${name_lc:0:2}" "${name_lc:2:2}" "$name_lc" ;;
            esac
          }

          check_sparse_index() {
            local name="$1"
            local version="$2"
            local path
            path=$(sparse_index_path "$name")
            local url="https://index.crates.io/${path}"
            local body
            body=$(curl -fsSL --max-time 15 "$url" 2>/dev/null) || return 1
            printf '%s\n' "$body" | VERS="$version" python3 -c '
          import json, os, sys
          target = os.environ["VERS"]
          for line in sys.stdin:
              line = line.strip()
              if not line:
                  continue
              try:
                  entry = json.loads(line)
              except Exception:
                  continue
              if entry.get("vers") == target and not entry.get("yanked", False):
                  sys.exit(0)
          sys.exit(1)
          '
          }

          FAILED=""
          TOTAL=0
          OK=0

          CRATES_LIST="$(mktemp)"
          printf '%s\n' "$CRATES_JSON" | python3 -c 'import json,sys; [print("{} {}".format(c["name"], c["version"])) for c in json.load(sys.stdin)]' > "$CRATES_LIST"
          while read -r CRATE VERSION; do
            TOTAL=$((TOTAL + 1))

            if check_sparse_index "$CRATE" "$VERSION"; then
              printf 'OK %s@%s\n' "$CRATE" "$VERSION"
              OK=$((OK + 1))
            else
              printf 'FAIL %s@%s (not present in https://index.crates.io/%s)\n' "$CRATE" "$VERSION" "$(sparse_index_path "$CRATE")"
              FAILED="${FAILED} ${CRATE}@${VERSION}"
            fi
          done < "$CRATES_LIST"

          echo ""
          printf 'Published: %s/%s\n' "$OK" "$TOTAL"

          if [ -n "$FAILED" ]; then
            printf '::error::The following crates are missing from the crates.io sparse index:%s\n' "$FAILED"
            {
              echo "## Publish verification FAILED :x:"
              echo ""
              printf 'Verified %s/%s crates present in the crates.io sparse index.\n' "$OK" "$TOTAL"
              echo ""
              echo "**Missing crates:**"
              for entry in $FAILED; do
                printf -- '- `%s`\n' "$entry"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Summary
        if: success()
        env:
          CRATES_JSON: ${{ needs.compute-order.outputs.crates }}
          TARGET_VERSION: ${{ needs.compute-order.outputs.version }}
        run: |
          COUNT="$(printf '%s\n' "$CRATES_JSON" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          {
            echo "## All Crates Published Successfully :rocket:"
            echo ""
            printf -- '- **Crates**: %s published in topological order\n' "$COUNT"
            printf -- '- **Target version**: %s\n' "$TARGET_VERSION"
            echo "- **Status**: All crates verified on crates.io sparse index"
          } >> "$GITHUB_STEP_SUMMARY"
