name: Temporary source export for issue 1723

on:
  push:
    branches:
      - agent/1723-source-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Upload bounded source bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-1723
          path: |
            crates/perl-semantic-analyzer/src/analysis/type_inference.rs
            crates/perl-semantic-analyzer/tests
            crates/perl-ast/src/ast.rs
            crates/perl-semantic-analyzer/Cargo.toml
          if-no-files-found: error
