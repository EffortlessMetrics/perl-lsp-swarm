name: ChatGPT 13901 typed oracle subject

on:
  push:
    branches:
      - fix/13901-typed-oracle-subject-input

permissions:
  contents: write

concurrency:
  group: chatgpt-13901-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply bounded API repair
        run: python3 scripts/maintenance/chatgpt_13901_typed_oracle_subject.py

      - name: Format candidate
        run: cargo fmt --all

      - name: Prove harness behavior
        run: cargo test -p perl-core-harness --locked

      - name: Prove exact harness Clippy subject
        run: cargo clippy -p perl-core-harness --lib --locked -- -D warnings -A missing_docs

      - name: Prove workspace-library Clippy subject
        run: cargo clippy --workspace --lib --locked -- -D warnings -A missing_docs

      - name: Check formatting and patch hygiene
        run: |
          cargo fmt --all -- --check
          git diff --check

      - name: Remove temporary executor and publish candidate
        run: |
          rm .github/workflows/chatgpt-13901-typed-oracle-subject.yml
          rm scripts/maintenance/chatgpt_13901_typed_oracle_subject.py
          git add -A
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "fix(critic-compat): use typed oracle subject identity (#13901)"
          git push origin HEAD:fix/13901-typed-oracle-subject-input
