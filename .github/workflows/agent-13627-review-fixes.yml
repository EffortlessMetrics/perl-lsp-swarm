name: Apply cpanfile review fixes

on:
  push:
    branches:
      - agent/13627-cpanfile-conditional-facts

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'EffortlessSteven'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply reviewed parser fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/perl-workspace-core/src/dist.rs")
          source = path.read_text(encoding="utf-8")

          old_loop = """    let mut block_stack: Vec<CpanfileBlock> = Vec::new();
              let mut buf = String::new();
              for ch in cleaned.chars() {
                  match ch {
          """
          new_loop = """    let mut block_stack: Vec<CpanfileBlock> = Vec::new();
              let mut buf = String::new();
              let mut quote = None;
              let mut escaped = false;
              for ch in cleaned.chars() {
                  if let Some(delimiter) = quote {
                      buf.push(ch);
                      if escaped {
                          escaped = false;
                      } else if ch == '\\\\' {
                          escaped = true;
                      } else if ch == delimiter {
                          quote = None;
                      }
                      continue;
                  }

                  match ch {
                      '\\'' | '"' => {
                          quote = Some(ch);
                          buf.push(ch);
                      }
          """
          if source.count(old_loop) != 1:
              raise SystemExit("expected exactly one cpanfile scanner loop")
          source = source.replace(old_loop, new_loop, 1)

          old_boundary = """    if !rest.starts_with(|c: char| c.is_whitespace() || c == '\\'' || c == '"') {
                  return None;
              }
          """
          new_boundary = """    if !rest.starts_with(|c: char| c.is_whitespace() || matches!(c, '(' | '\\'' | '"')) {
                  return None;
              }
          """
          if source.count(old_boundary) != 1:
              raise SystemExit("expected exactly one on-block boundary check")
          source = source.replace(old_boundary, new_boundary, 1)

          insertion_point = """    #[test]
              fn cpanfile_unsupported_blocks_do_not_become_unconditional_facts() {
          """
          test = """    #[test]
              fn cpanfile_quoted_delimiters_do_not_change_block_state() {
                  let content = r#"
                      my $open = '{';
                      my $close = "}";
                      my $separator = ";";
                      requires 'Path::Tiny';
                      on('test') => sub { requires 'Test::More'; };
                  "#;
                  let facts = parse_cpanfile(FileId::new("cpanfile", &Digest::of("x")), content);

                  assert!(
                      facts.prereqs.iter().any(|p| p.module == "Path::Tiny" && p.phase == "runtime"),
                      "quoted braces and semicolons must remain statement text: {:?}",
                      facts.prereqs
                  );
                  assert!(
                      facts.prereqs.iter().any(|p| p.module == "Test::More" && p.phase == "test"),
                      "parenthesized on blocks retain their canonical phase: {:?}",
                      facts.prereqs
                  );
              }

          """
          if source.count(insertion_point) != 1:
              raise SystemExit("expected exactly one cpanfile test insertion point")
          source = source.replace(insertion_point, test + insertion_point, 1)
          path.write_text(source, encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check

      - name: Run distribution metadata regressions
        run: cargo test -p perl-workspace-core --locked dist::tests

      - name: Commit clean source diff
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm .github/workflows/agent-13627-review-fixes.yml
          git add crates/perl-workspace-core/src/dist.rs
          git diff --cached --check
          git commit -m "fix(workspace-core): track quoted cpanfile delimiters (#13627)"
          git push origin HEAD:agent/13627-cpanfile-conditional-facts
