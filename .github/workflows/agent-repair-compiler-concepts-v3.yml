name: Agent repair compiler concepts v3

on:
  push:
    branches:
      - agent/compiler-concepts-ledger-6657
    paths:
      - .github/workflows/agent-repair-compiler-concepts-v3.yml
      - .github/scripts/repair_compiler_concepts.py
      - .github/scripts/repair_compiler_concepts_closeout.py

permissions:
  contents: write

concurrency:
  group: agent-repair-compiler-concepts-v3
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout triggering candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Confirm candidate identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "candidate_sha=$(git rev-parse HEAD)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply reviewed repairs
        run: |
          python3 .github/scripts/repair_compiler_concepts.py
          python3 .github/scripts/repair_compiler_concepts_closeout.py

      - name: Normalize candidate lints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("xtask/src/bin/compiler-concepts.rs")
          text = path.read_text()
          pattern = (
              r"fn validate_evidence<'a>\(\n"
              r"(\s*)&self,\n"
              r"(\s*)known_ids: &BTreeSet<&'a str>,\n"
              r"(\s*)known_literals: &BTreeSet<&'a str>,"
          )
          replacement = (
              r"fn validate_evidence(\n"
              r"\1&self,\n"
              r"\2known_ids: &BTreeSet<&str>,\n"
              r"\3known_literals: &BTreeSet<&str>,"
          )
          updated, count = re.subn(pattern, replacement, text, count=1)
          if count == 1:
              path.write_text(updated)
          elif "fn validate_evidence(" not in text and "validate_evidence" in text:
              raise SystemExit("validate_evidence has an unexpected signature")
          PY

      - name: Validate schema syntax
        run: python3 -m json.tool schemas/perl_compiler_concepts.v1.schema.json >/dev/null

      - name: Format candidate
        run: rustfmt --edition 2024 xtask/src/bin/compiler-concepts.rs

      - name: Regenerate status
        run: cargo run -p xtask --bin compiler-concepts -- --write-status

      - name: Verify formatting
        run: rustfmt --edition 2024 --check xtask/src/bin/compiler-concepts.rs

      - id: test_committed
        name: Test committed ledger and status
        continue-on-error: true
        run: cargo test -p xtask --bin compiler-concepts committed_ledger_validates_and_status_is_current -- --nocapture

      - id: test_duplicate
        name: Test duplicate concept IDs
        continue-on-error: true
        run: cargo test -p xtask --bin compiler-concepts duplicate_concept_ids_fail_closed -- --nocapture

      - id: test_issue
        name: Test invalid owner issue
        continue-on-error: true
        run: cargo test -p xtask --bin compiler-concepts invalid_owner_issue_fails_closed -- --nocapture

      - id: test_opaque
        name: Test opaque exact-provider rejection
        continue-on-error: true
        run: cargo test -p xtask --bin compiler-concepts opaque_body_hir_cannot_authorize_exact_provider_output -- --nocapture

      - id: test_complete
        name: Test inventory completeness closeout
        continue-on-error: true
        run: cargo test -p xtask --bin compiler-concepts inventory_complete_rejects_unresolved_work_after_authority -- --nocapture

      - id: test_exact
        name: Test exact-provider canonical pipeline
        continue-on-error: true
        run: cargo test -p xtask --bin compiler-concepts exact_provider_requires_canonical_executable_pipeline_regardless_of_owner -- --nocapture

      - id: test_eir
        name: Test executable EIR PIR admission
        continue-on-error: true
        run: cargo test -p xtask --bin compiler-concepts executable_eir_requires_modeled_pir_a -- --nocapture

      - id: test_ast_kinds
        name: Test required AST kinds field
        continue-on-error: true
        run: cargo test -p xtask --bin compiler-concepts ast_kinds_is_required_by_typed_parser -- --nocapture

      - id: test_id_grammar
        name: Test concept ID grammar
        continue-on-error: true
        run: cargo test -p xtask --bin compiler-concepts concept_id_grammar_matches_segment_contract -- --nocapture

      - id: test_rendering
        name: Test deterministic rendering
        continue-on-error: true
        run: cargo test -p xtask --bin compiler-concepts rendering_is_independent_of_input_order -- --nocapture

      - id: clippy
        name: Verify Clippy
        continue-on-error: true
        run: cargo clippy -p xtask --bin compiler-concepts -- -D warnings

      - id: status
        name: Verify generated status
        continue-on-error: true
        run: cargo run -p xtask --bin compiler-concepts -- --check

      - name: Require all targeted verification
        if: ${{ always() }}
        env:
          TEST_COMMITTED: ${{ steps.test_committed.outcome }}
          TEST_DUPLICATE: ${{ steps.test_duplicate.outcome }}
          TEST_ISSUE: ${{ steps.test_issue.outcome }}
          TEST_OPAQUE: ${{ steps.test_opaque.outcome }}
          TEST_COMPLETE: ${{ steps.test_complete.outcome }}
          TEST_EXACT: ${{ steps.test_exact.outcome }}
          TEST_EIR: ${{ steps.test_eir.outcome }}
          TEST_AST_KINDS: ${{ steps.test_ast_kinds.outcome }}
          TEST_ID_GRAMMAR: ${{ steps.test_id_grammar.outcome }}
          TEST_RENDERING: ${{ steps.test_rendering.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          STATUS: ${{ steps.status.outcome }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "committed=$TEST_COMMITTED" \
            "duplicate=$TEST_DUPLICATE" \
            "issue=$TEST_ISSUE" \
            "opaque=$TEST_OPAQUE" \
            "complete=$TEST_COMPLETE" \
            "exact=$TEST_EXACT" \
            "eir=$TEST_EIR" \
            "ast_kinds=$TEST_AST_KINDS" \
            "id_grammar=$TEST_ID_GRAMMAR" \
            "rendering=$TEST_RENDERING" \
            "clippy=$CLIPPY" \
            "status=$STATUS"
          test "$TEST_COMMITTED" = success
          test "$TEST_DUPLICATE" = success
          test "$TEST_ISSUE" = success
          test "$TEST_OPAQUE" = success
          test "$TEST_COMPLETE" = success
          test "$TEST_EXACT" = success
          test "$TEST_EIR" = success
          test "$TEST_AST_KINDS" = success
          test "$TEST_ID_GRAMMAR" = success
          test "$TEST_RENDERING" = success
          test "$CLIPPY" = success
          test "$STATUS" = success

      - name: Commit improvement pass
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm .github/workflows/agent-repair-compiler-concepts-v3.yml
          git rm .github/scripts/repair_compiler_concepts.py
          git rm .github/scripts/repair_compiler_concepts_closeout.py
          git add contracts/compiler/perl_compiler_concepts.v1.toml
          git add docs/project/status/perl_compiler_concepts.md
          git add schemas/perl_compiler_concepts.v1.schema.json
          git add xtask/src/bin/compiler-concepts.rs
          git diff --cached --check
          git commit -m "fix(compiler): close concept ledger admission gaps"
          git push origin HEAD:agent/compiler-concepts-ledger-6657
