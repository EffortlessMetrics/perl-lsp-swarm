name: Agent compiler builtin improvement v2

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: agent-compiler-builtin-improve-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  improve:
    if: github.event.pull_request.head.ref == 'agent/compiler-builtin-stack-ci'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply reviewed improvements
        run: python3 .ci/agent_apply_compiler_builtin_improvements.py

      - name: Format and regenerate status
        shell: bash
        run: |
          cargo fmt --all
          cargo run -p xtask --bin compiler-builtin-catalog -- --write-status
          cargo fmt --all
          git diff --check

      - name: Run targeted tests and lints
        shell: bash
        run: |
          cargo test -p xtask \
            --bin compiler-builtin-catalog \
            --test compiler_builtin_catalog_cli
          cargo clippy -p xtask \
            --bin compiler-builtin-catalog \
            --test compiler_builtin_catalog_cli \
            -- -D warnings

      - name: Commit improvement pass
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            xtask/src/bin/compiler-builtin-catalog.rs \
            xtask/tests/compiler_builtin_catalog_cli.rs \
            docs/project/status/perl_builtin_semantics.md
          if git diff --cached --quiet; then
            echo "No improvement changes to commit"
            exit 0
          fi
          git commit -m "fix(compiler): require implemented builtin execution seams"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
