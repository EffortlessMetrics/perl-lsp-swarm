name: Format PR 13913 candidate

on:
  push:
    branches:
      - agent/parser-metamorphic-byte-map-13657

permissions:
  contents: write

concurrency:
  group: pr-13913-rustfmt
  cancel-in-progress: false

jobs:
  rustfmt:
    name: Apply repository rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/parser-metamorphic-byte-map-13657

      - name: Install repository Rust toolchain with rustfmt
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Format and constrain the resulting diff
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all

          mapfile -t changed_files < <(git diff --name-only)
          for path in "${changed_files[@]}"; do
            case "$path" in
              xtask/src/tasks/metrics/parser_accuracy_metamorphic_transform.rs|xtask/tests/parser_accuracy_metamorphic_transform.rs)
                ;;
              *)
                echo "::error file=$path::rustfmt changed an unexpected path"
                exit 1
                ;;
            esac
          done

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "Candidate is already formatted."
            exit 0
          fi

          git diff --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -- "${changed_files[@]}"
          git commit -m "style(parser-accuracy): apply rustfmt (#13657)"
          git push origin HEAD:agent/parser-metamorphic-byte-map-13657
