name: Agent 7725 exact Git object widths

on:
  push:
    branches:
      - fix/7725-exact-git-object-widths

permissions:
  contents: write

concurrency:
  group: agent-7725-exact-git-object-widths
  cancel-in-progress: false

jobs:
  patch-and-prove:
    name: Patch and prove exact Git object widths
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0

      - name: Apply exact Git object identity law
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one replacement, found {count}\n--- old ---\n{old}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          discovery = Path("crates/perl-core-harness/src/observed_discovery/build.rs")
          replace_once(
              discovery,
              '    validate_reference(&input.subject.repository_commit, "repository commit", 40, 64, true)?;\n',
              '    validate_git_object_id(&input.subject.repository_commit, "repository commit")?;\n',
          )
          replace_once(
              discovery,
              '    validate_reference(&input.subject.perl_ref, "perl ref", 1, 128, false)?;\n',
              '    validate_printable_reference(&input.subject.perl_ref, "perl ref", 1, 128)?;\n',
          )
          replace_once(
              discovery,
              '''    validate_reference(
                  &input.subject.prepared_tree_identity,
                  "prepared tree identity",
                  1,
                  128,
                  false,
              )?;
          ''',
              '''    validate_printable_reference(
                  &input.subject.prepared_tree_identity,
                  "prepared tree identity",
                  1,
                  128,
              )?;
          ''',
          )
          replace_once(
              discovery,
              '    validate_reference(&input.subject.host_perl_identity, "host perl identity", 1, 128, false)?;\n',
              '    validate_printable_reference(&input.subject.host_perl_identity, "host perl identity", 1, 128)?;\n',
          )
          replace_once(
              discovery,
              '        validate_reference(instrument, "instrumentation id", 1, 128, false)?;\n',
              '        validate_printable_reference(instrument, "instrumentation id", 1, 128)?;\n',
          )
          replace_once(
              discovery,
              '''pub(crate) fn validate_reference(
              value: &str,
              label: &str,
              min_len: usize,
              max_len: usize,
              lowercase_hex: bool,
          ) -> Result<(), String> {
              if value.len() < min_len || value.len() > max_len {
                  return Err(format!("{label} must be {min_len}-{max_len} characters"));
              }
              if lowercase_hex {
                  if !value.bytes().all(crate::is_lower_case_hex_byte) {
                      return Err(format!("{label} must be lower-case hexadecimal"));
                  }
                  return Ok(());
              }
              if !value.bytes().all(is_graphic_ascii) {
                  return Err(format!("{label} must be printable ASCII without whitespace"));
              }
              Ok(())
          }
          ''',
              '''/// Validate a full Git object identity without admitting ambiguous widths.
          ///
          /// SHA-1 object IDs are exactly 40 hexadecimal characters and SHA-256
          /// object IDs are exactly 64. Intermediate widths are neither format.
          pub(crate) fn validate_git_object_id(value: &str, label: &str) -> Result<(), String> {
              if !matches!(value.len(), 40 | 64) {
                  return Err(format!("{label} must be exactly 40 or 64 characters"));
              }
              if !value.bytes().all(crate::is_lower_case_hex_byte) {
                  return Err(format!("{label} must be lower-case hexadecimal"));
              }
              Ok(())
          }

          pub(crate) fn validate_printable_reference(
              value: &str,
              label: &str,
              min_len: usize,
              max_len: usize,
          ) -> Result<(), String> {
              if value.len() < min_len || value.len() > max_len {
                  return Err(format!("{label} must be {min_len}-{max_len} characters"));
              }
              if !value.bytes().all(is_graphic_ascii) {
                  return Err(format!("{label} must be printable ASCII without whitespace"));
              }
              Ok(())
          }
          ''',
          )
          replace_once(
              discovery,
              '''        validate_environment_value, validate_reference, validate_sha256_field, validate_target_id,
              validate_working_directory,
          ''',
              '''        validate_environment_value, validate_git_object_id, validate_printable_reference,
              validate_sha256_field, validate_target_id, validate_working_directory,
          ''',
          )
          replace_once(
              discovery,
              '''    #[test]
              fn references_enforce_their_declared_bounds_and_alphabet() {
                  assert!(validate_reference(&"ab".repeat(20), "commit", 40, 64, true).is_ok());
                  assert!(rejected_as(
                      validate_reference(&"ab".repeat(19), "commit", 40, 64, true),
                      "must be 40-64 characters"
                  ));
                  assert!(rejected_as(
                      validate_reference(&"AB".repeat(20), "commit", 40, 64, true),
                      "lower-case hexadecimal"
                  ));
                  assert!(validate_reference("v5.40.0", "perl ref", 1, 128, false).is_ok());
                  assert!(rejected_as(
                      validate_reference("has space", "perl ref", 1, 128, false),
                      "printable ASCII without whitespace"
                  ));
              }
          ''',
              '''    #[test]
              fn git_object_ids_require_full_sha1_or_sha256_widths() {
                  assert!(validate_git_object_id(&"ab".repeat(20), "repository commit").is_ok());
                  assert!(validate_git_object_id(&"ab".repeat(32), "repository commit").is_ok());
                  for width in [39, 41, 63, 65] {
                      assert!(rejected_as(
                          validate_git_object_id(&"a".repeat(width), "repository commit"),
                          "exactly 40 or 64 characters"
                      ));
                  }
                  assert!(rejected_as(
                      validate_git_object_id(&"AB".repeat(20), "repository commit"),
                      "lower-case hexadecimal"
                  ));
              }

              #[test]
              fn printable_references_enforce_their_declared_bounds_and_alphabet() {
                  assert!(validate_printable_reference("v5.40.0", "perl ref", 1, 128).is_ok());
                  assert!(rejected_as(
                      validate_printable_reference("", "perl ref", 1, 128),
                      "must be 1-128 characters"
                  ));
                  assert!(rejected_as(
                      validate_printable_reference("has space", "perl ref", 1, 128),
                      "printable ASCII without whitespace"
                  ));
              }
          ''',
          )

          subject = Path("crates/perl-core-harness/src/observed_subject/build.rs")
          replace_once(
              subject,
              '''use crate::observed_discovery::build::{
              sha256_json, validate_reference, validate_sha256_field, validate_target_id,
          };
          ''',
              '''use crate::observed_discovery::build::{
              sha256_json, validate_git_object_id, validate_printable_reference,
              validate_sha256_field, validate_target_id,
          };
          ''',
          )
          replacements = {
              '    validate_reference(&producer.repository_commit, "repository commit", 40, 64, true)?;\n':
                  '    validate_git_object_id(&producer.repository_commit, "repository commit")?;\n',
              '    validate_reference(&producer.perl_ref, "perl ref", 1, 128, false)?;\n':
                  '    validate_printable_reference(&producer.perl_ref, "perl ref", 1, 128)?;\n',
              '    validate_reference(&producer.prepared_tree_identity, "prepared tree identity", 1, 128, false)?;\n':
                  '    validate_printable_reference(&producer.prepared_tree_identity, "prepared tree identity", 1, 128)?;\n',
              '    validate_reference(&producer.host_perl_identity, "host perl identity", 1, 128, false)?;\n':
                  '    validate_printable_reference(&producer.host_perl_identity, "host perl identity", 1, 128)?;\n',
              '    validate_reference(&equivalence.instrumentation_id, "instrumentation id", 1, 128, false)?;\n':
                  '    validate_printable_reference(&equivalence.instrumentation_id, "instrumentation id", 1, 128)?;\n',
          }
          for old, new in replacements.items():
              replace_once(subject, old, new)

          subject_text = subject.read_text(encoding="utf-8").rstrip()
          subject_text += r'''

          #[cfg(test)]
          mod git_object_identity_tests {
              use super::validate_producer_shape;
              use crate::observed_discovery::model::RunnerArtifactIdentity;
              use crate::observed_subject::model::ProducerSubjectIdentity;
              use crate::runner_model::RunnerKind;

              fn producer_with_commit(repository_commit: String) -> ProducerSubjectIdentity {
                  ProducerSubjectIdentity {
                      repository_commit,
                      perl_ref: "perl-5.42.2".to_string(),
                      prepared_tree_identity: "prepared-tree-1".to_string(),
                      host_perl_identity: "host-perl-5.42.2".to_string(),
                      matrix_fingerprint: "a".repeat(64),
                      target_id: "component_base".to_string(),
                      target_contract_digest: "b".repeat(64),
                      variant_target_id: None,
                      runner: RunnerKind::Test,
                      runner_artifact: RunnerArtifactIdentity {
                          canonical_path: "t/TEST".to_string(),
                          content_sha256: "c".repeat(64),
                      },
                      working_directory: "t".to_string(),
                      environment_sha256: "d".repeat(64),
                  }
              }

              #[test]
              fn producer_subject_accepts_only_full_git_object_id_widths() {
                  for width in [40, 64] {
                      assert!(validate_producer_shape(&producer_with_commit("a".repeat(width))).is_ok());
                  }
                  for width in [39, 41, 63, 65] {
                      let error = validate_producer_shape(&producer_with_commit("a".repeat(width)))
                          .expect_err("intermediate Git object ID width must reject");
                      assert!(error.contains("exactly 40 or 64 characters"), "{error}");
                  }
                  let error = validate_producer_shape(&producer_with_commit("A".repeat(40)))
                      .expect_err("upper-case Git object ID must reject");
                  assert!(error.contains("lower-case hexadecimal"), "{error}");
              }
          }
          '''
          subject.write_text(subject_text.lstrip("\n") + "\n", encoding="utf-8")

          trace = Path("crates/perl-core-harness/src/invocation_trace/build.rs")
          replace_once(
              trace,
              '    validate_reference(&subject.repository_commit, "repository commit", 40, 64, true)?;\n',
              '    crate::observed_discovery::build::validate_git_object_id(\n        &subject.repository_commit,\n        "repository commit",\n    )?;\n',
          )
          trace_replacements = {
              '    validate_reference(&subject.perl_ref, "perl ref", 1, 128, false)?;\n':
                  '    validate_printable_reference(&subject.perl_ref, "perl ref", 1, 128)?;\n',
              '    validate_reference(&subject.prepared_tree_identity, "prepared tree identity", 1, 128, false)?;\n':
                  '    validate_printable_reference(&subject.prepared_tree_identity, "prepared tree identity", 1, 128)?;\n',
              '    validate_reference(&subject.host_perl_identity, "host perl identity", 1, 128, false)?;\n':
                  '    validate_printable_reference(&subject.host_perl_identity, "host perl identity", 1, 128)?;\n',
              '        validate_reference(instrument, "instrumentation id", 1, 128, false)?;\n':
                  '        validate_printable_reference(instrument, "instrumentation id", 1, 128)?;\n',
              '    validate_reference(&subject.parent_process_nonce, "parent process nonce", 1, 128, false)?;\n':
                  '    validate_printable_reference(&subject.parent_process_nonce, "parent process nonce", 1, 128)?;\n',
          }
          for old, new in trace_replacements.items():
              replace_once(trace, old, new)
          replace_once(
              trace,
              '''fn validate_reference(
              value: &str,
              label: &str,
              min_len: usize,
              max_len: usize,
              lowercase_hex: bool,
          ) -> Result<(), String> {
              if value.len() < min_len || value.len() > max_len {
                  return Err(format!("{label} must be {min_len}-{max_len} characters"));
              }
              if lowercase_hex {
                  if !value.bytes().all(crate::is_lower_case_hex_byte) {
                      return Err(format!("{label} must be lower-case hexadecimal"));
                  }
                  return Ok(());
              }
              if !value.bytes().all(|byte| (0x21..=0x7e).contains(&byte)) {
                  return Err(format!("{label} must be printable ASCII without whitespace"));
              }
              Ok(())
          }
          ''',
              '''fn validate_printable_reference(
              value: &str,
              label: &str,
              min_len: usize,
              max_len: usize,
          ) -> Result<(), String> {
              if value.len() < min_len || value.len() > max_len {
                  return Err(format!("{label} must be {min_len}-{max_len} characters"));
              }
              if !value.bytes().all(|byte| (0x21..=0x7e).contains(&byte)) {
                  return Err(format!("{label} must be printable ASCII without whitespace"));
              }
              Ok(())
          }
          ''',
          )
          replace_once(
              trace,
              '''        RunnerArtifactIdentity, required_limitations, validate_artifact, validate_reference,
              validate_sha256_field, validate_target_id, validate_trace_session_id,
          ''',
              '''        RunnerArtifactIdentity, required_limitations, validate_artifact,
              validate_printable_reference, validate_sha256_field, validate_subject,
              validate_target_id, validate_trace_session_id,
          ''',
          )
          replace_once(
              trace,
              '    use crate::invocation_trace::model::SUBJECT_VALIDATIONS_PER_CONSTRUCTION;\n',
              '    use crate::invocation_trace::model::{\n        SUBJECT_VALIDATIONS_PER_CONSTRUCTION, TraceSubjectIdentity,\n    };\n',
          )
          replace_once(
              trace,
              '''    #[test]
              fn references_enforce_their_declared_bounds_and_alphabet() {
                  assert!(validate_reference(&"ab".repeat(20), "commit", 40, 64, true).is_ok());
                  assert!(rejected_as(
                      validate_reference(&"ab".repeat(19), "commit", 40, 64, true),
                      "must be 40-64 characters"
                  ));
                  assert!(rejected_as(
                      validate_reference(&"AB".repeat(20), "commit", 40, 64, true),
                      "lower-case hexadecimal"
                  ));
                  assert!(validate_reference("v5.42.2", "perl ref", 1, 128, false).is_ok());
                  assert!(rejected_as(
                      validate_reference("has space", "perl ref", 1, 128, false),
                      "printable ASCII without whitespace"
                  ));
              }
          ''',
              '''    #[test]
              fn printable_references_enforce_their_declared_bounds_and_alphabet() {
                  assert!(validate_printable_reference("v5.42.2", "perl ref", 1, 128).is_ok());
                  assert!(rejected_as(
                      validate_printable_reference("", "perl ref", 1, 128),
                      "must be 1-128 characters"
                  ));
                  assert!(rejected_as(
                      validate_printable_reference("has space", "perl ref", 1, 128),
                      "printable ASCII without whitespace"
                  ));
              }
          ''',
          )
          replace_once(
              trace,
              '''    #[test]
              fn sha256_fields_must_be_exactly_64_hex_characters() {
          ''',
              '''    fn trace_subject_with_commit(repository_commit: String) -> TraceSubjectIdentity {
                  TraceSubjectIdentity {
                      repository_commit,
                      perl_ref: "perl-5.42.2".to_string(),
                      prepared_tree_identity: "prepared-tree-1".to_string(),
                      host_perl_identity: "host-perl-5.42.2".to_string(),
                      matrix_fingerprint: "a".repeat(64),
                      target_id: "component_base".to_string(),
                      target_contract_digest: "b".repeat(64),
                      variant_target_id: None,
                      instrumentation_id: None,
                      trace_session_id: "trace-session-1".to_string(),
                      parent_process_nonce: "process-1".to_string(),
                      parent_receipt_digest: "c".repeat(64),
                  }
              }

              #[test]
              fn trace_subject_accepts_only_full_git_object_id_widths() {
                  for width in [40, 64] {
                      assert!(validate_subject(&trace_subject_with_commit("a".repeat(width))).is_ok());
                  }
                  for width in [39, 41, 63, 65] {
                      assert!(rejected_as(
                          validate_subject(&trace_subject_with_commit("a".repeat(width))),
                          "exactly 40 or 64 characters"
                      ));
                  }
              }

              #[test]
              fn sha256_fields_must_be_exactly_64_hex_characters() {
          ''',
          )

          exact_pattern = '^(?:[0-9a-f]{40}|[0-9a-f]{64})$'
          old_pattern = '^[0-9a-f]{40,64}$'
          schema_paths = []
          for path in sorted(Path("schemas").glob("perl_core_harness*.schema.json")):
              text = path.read_text(encoding="utf-8")
              if '"repository_commit"' not in text:
                  continue
              count = text.count(f'"pattern": "{old_pattern}"')
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one repository-commit range pattern, found {count}"
                  )
              path.write_text(
                  text.replace(
                      f'"pattern": "{old_pattern}"',
                      f'"pattern": "{exact_pattern}"',
                      1,
                  ),
                  encoding="utf-8",
              )
              schema_paths.append(path.name)

          required_schemas = {
              "perl_core_harness_upstream_runner_discovery.v1.schema.json",
              "perl_core_harness_upstream_effective_invocation_trace.v1.schema.json",
          }
          if not required_schemas.issubset(schema_paths):
              raise SystemExit(
                  f"missing expected compiler-harness schemas: {sorted(required_schemas - set(schema_paths))}"
              )

          schema_test = Path(
              "crates/perl-core-harness/tests/git_object_identity_contract.rs"
          )
          schema_test.write_text(
              r'''use serde_json::Value;
          use std::collections::BTreeSet;
          use std::fs;
          use std::path::Path;

          const EXACT_GIT_OBJECT_PATTERN: &str = "^(?:[0-9a-f]{40}|[0-9a-f]{64})$";
          const REQUIRED_SCHEMA_FILES: [&str; 2] = [
              "perl_core_harness_upstream_effective_invocation_trace.v1.schema.json",
              "perl_core_harness_upstream_runner_discovery.v1.schema.json",
          ];

          fn collect_repository_commit_patterns(value: &Value, patterns: &mut Vec<String>) {
              match value {
                  Value::Object(fields) => {
                      if let Some(repository_commit) = fields.get("repository_commit") {
                          let pattern = repository_commit
                              .get("pattern")
                              .and_then(Value::as_str)
                              .unwrap_or_else(|| {
                                  panic!("repository_commit schema lacks a string pattern")
                              });
                          patterns.push(pattern.to_string());
                      }
                      for child in fields.values() {
                          collect_repository_commit_patterns(child, patterns);
                      }
                  }
                  Value::Array(items) => {
                      for child in items {
                          collect_repository_commit_patterns(child, patterns);
                      }
                  }
                  _ => {}
              }
          }

          #[test]
          fn compiler_harness_schemas_match_the_exact_git_object_width_law() {
              let schema_dir = Path::new(env!("CARGO_MANIFEST_DIR")).join("../../schemas");
              let mut governed_files = BTreeSet::new();

              for entry in fs::read_dir(&schema_dir).expect("read schema directory") {
                  let path = entry.expect("read schema entry").path();
                  let Some(name) = path.file_name().and_then(|name| name.to_str()) else {
                      continue;
                  };
                  if !name.starts_with("perl_core_harness") || !name.ends_with(".schema.json") {
                      continue;
                  }
                  let text = fs::read_to_string(&path).expect("read compiler-harness schema");
                  if !text.contains("\"repository_commit\"") {
                      continue;
                  }
                  let schema: Value = serde_json::from_str(&text).expect("parse schema JSON");
                  let mut patterns = Vec::new();
                  collect_repository_commit_patterns(&schema, &mut patterns);
                  assert!(!patterns.is_empty(), "{name} declares repository_commit without a pattern");
                  assert!(
                      patterns.iter().all(|pattern| pattern == EXACT_GIT_OBJECT_PATTERN),
                      "{name} admits a repository_commit spelling outside the exact 40/64 lower-case law: {patterns:?}"
                  );
                  governed_files.insert(name.to_string());
              }

              for required in REQUIRED_SCHEMA_FILES {
                  assert!(
                      governed_files.contains(required),
                      "required compiler-harness identity schema was not governed: {required}"
                  );
              }
          }

          #[test]
          fn intermediate_git_object_widths_are_never_canonical() {
              let canonical = |value: &str| {
                  matches!(value.len(), 40 | 64)
                      && value.bytes().all(|byte| byte.is_ascii_digit() || matches!(byte, b'a'..=b'f'))
              };

              assert!(canonical(&"a".repeat(40)));
              assert!(canonical(&"a".repeat(64)));
              for width in 41..64 {
                  assert!(!canonical(&"a".repeat(width)), "width {width} must reject");
              }
              assert!(!canonical(&"A".repeat(40)));
          }
          ''',
              encoding="utf-8",
          )

          for path in [discovery, subject, trace]:
              text = path.read_text(encoding="utf-8")
              if "repository_commit" in text and "40, 64, true" in text:
                  raise SystemExit(f"{path}: residual range-based repository commit validation")
          PY

      - name: Format compiler harness
        run: cargo fmt -p perl-core-harness

      - name: Check patch whitespace
        run: git diff --check

      - name: Test compiler harness
        run: cargo test -p perl-core-harness --all-targets --locked

      - name: Lint compiler harness library
        run: cargo clippy -p perl-core-harness --lib --locked -- -D warnings

      - name: Commit proven candidate
        shell: bash
        run: |
          rm .github/workflows/agent-7725-exact-git-widths.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "candidate produced no changes" >&2
            exit 1
          fi
          git commit -m "fix(compiler-harness): require exact Git object ID widths (#7725)"
          git push origin HEAD:${GITHUB_REF_NAME}
