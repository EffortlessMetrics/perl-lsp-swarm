name: Agent 7725 exact Git object widths

on:
  push:
    branches:
      - fix/7725-exact-git-object-widths

permissions:
  contents: write

concurrency:
  group: agent-7725-exact-git-object-widths
  cancel-in-progress: false

jobs:
  patch-and-prove:
    name: Patch and prove exact Git object widths
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - name: Apply exact Git object identity law
        run: python3 scripts/agent_7725_patch.py

      - name: Format compiler harness
        run: cargo fmt -p perl-core-harness

      - name: Check patch whitespace
        run: git diff --check

      - name: Test compiler harness
        run: cargo test -p perl-core-harness --all-targets --locked

      - name: Lint compiler harness library
        run: cargo clippy -p perl-core-harness --lib --locked -- -D warnings

      - name: Commit proven candidate
        shell: bash
        run: |
          rm .github/workflows/agent-7725-exact-git-widths.yml
          rm scripts/agent_7725_patch.py
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "candidate produced no changes" >&2
            exit 1
          fi
          git diff --cached --stat
          git commit -m "fix(compiler-harness): require exact Git object ID widths (#7725)"
          git push origin HEAD:${GITHUB_REF_NAME}
