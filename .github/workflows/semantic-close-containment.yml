name: Semantic Close Containment

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: semantic-close-containment-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  semantic-close-containment:
    runs-on:
      group: em-ci-nano
      labels: [self-hosted, linux, x64, em-ci, trusted-pr, workflow-nano]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Reject internally contradictory terminal relations
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_INCREMENTAL: "0"
        run: >-
          cargo run -p xtask --bin semantic-close-containment --locked --
          --event "$GITHUB_EVENT_PATH"
          --format human
