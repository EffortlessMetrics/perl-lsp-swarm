# Semantic Close Containment (CP00) — advisory trusted-base guard for
# internally contradictory terminal closing relations (#10413).
#
# Executes ONLY trusted base-branch validator code: the checkout is pinned to
# the pull request's exact base SHA and PR-head code is never checked out or
# executed. PR/issue text is consumed as bounded data by the validator
# (`cargo`-built `xtask/src/bin/semantic-close-containment.rs`, merged via
# #11847), which enforces relation/section/byte bounds and exits before any
# issue lookup when a PR carries no automatic closing keyword.
#
# #15640: reruns replay the original event payload, so the validator builds
# the semantic subject from one live `GET /repos/{owner}/{repo}/pulls/{n}`
# snapshot (fetched with the existing read-only token) instead of the stale
# event title/body. The event supplies only the locator and audit metadata; a
# fetch failure is an instrument failure with no event-payload fallback, and
# the report records `updated_at`, live head SHA, and a title/body digest so
# the job proves what it actually evaluated.
#
# Exit contract: 0 = pass (containment level only), 2 = high-confidence
# contradiction (the check fails with the suggested non-terminal relation),
# 3 = NOT_PROVEN/instrument failure (the check fails; it never passes on
# missing or broken evidence).
#
# Trigger note: `pull_request_target` lets the base-owned workflow execute the
# validator after the workflow is present on the base.
#
# Advisory / non-required: intentionally absent from
# `.ci/policies/required-checks.toml`; any required-promotion decision is
# reviewed separately under #10168. Retirement into the CP03+ semantic
# preflight is mapped per rule inside the validator and documented under
# `.spec/10413-semantic-close-containment/`.
#
# Known advisory-tier boundary: this workflow remains advisory and has no merge
# authority; any required-promotion decision is reviewed separately under
# #10168.

name: Semantic Close Containment (CP00)

on:
  pull_request_target:
    # Automatic closing keywords only act when a PR merges into the default
    # branch, so other targets are not applicable by construction.
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: semantic-close-containment-${{ github.event.pull_request.number || github.ref }}
  # #15640: any fresh PR event (edit included) supersedes an older queued or
  # in-progress rerun for the same PR, so stale and current verdicts cannot
  # race in the UI. workflow_dispatch runs on a distinct group and are never
  # cancelled by PR events.
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  containment:
    name: Semantic close containment (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout exact trusted base authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact base execution
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid base SHA identity"
            exit 1
          fi
          resolved="$(git rev-parse 'HEAD^{commit}')"
          if [ "$resolved" != "$BASE_SHA" ]; then
            printf '::error::Checked-out base %s does not match event base %s\n' \
              "$resolved" "$BASE_SHA"
            exit 1
          fi

      - name: Prove inert PR head identity
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid PR head SHA identity"
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid PR number identity"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"
          fetched="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [ "$fetched" != "$HEAD_SHA" ]; then
            printf '::error::Fetched PR head %s does not match event head %s\n' \
              "$fetched" "$HEAD_SHA"
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0

      - name: Build trusted-base validator
        run: cargo build --locked -p xtask --bin semantic-close-containment

      - name: Replay immutable CP00 fixtures (instrument self-test)
        # Expected-contradiction fixtures legitimately exit 2; anything else
        # non-zero (3 = NOT_PROVEN verdict, 4 = instrument failure, crashes,
        # expectation mismatches) fails this step, so broken evidence can never
        # masquerade as a pass. 3 and 4 were the same code until #16214.
        run: |
          set -u
          bin="target/debug/semantic-close-containment"
          count=0
          failures=0
          for fixture in .ci/semantic-close-containment/fixtures/*.json; do
            rc=0
            "$bin" --fixture "$fixture" --format json > /dev/null || rc=$?
            case "$rc" in
              0|2)
                count=$((count + 1))
                ;;
              *)
                printf '::error::CP00 fixture %s exited %s\n' "$fixture" "$rc"
                failures=$((failures + 1))
                ;;
            esac
          done
          echo "Replayed ${count} immutable CP00 fixtures."
          if [ "${failures}" -ne 0 ] || [ "${count}" -lt 12 ]; then
            echo "::error::instrument self-test failed"
            exit 1
          fi

          # #16214: the contract that a validator which cannot do its job exits
          # differently from one that reached a verdict is only worth anything
          # if it holds for the real binary. No fixture reaches exit 3 or 4 --
          # all 26 land on 0 or 2 -- so this is the only place the instrument
          # failure path is exercised end to end.
          rc=0
          env -u GITHUB_EVENT_PATH "$bin" >/dev/null 2>"${RUNNER_TEMP:-/tmp}/scc-selftest-stderr.txt" || rc=$?
          if [ "${rc}" -ne 4 ]; then
            printf '::error::a validator that cannot evaluate anything must exit 4, got %s\n' "${rc}"
            exit 1
          fi
          if ! grep -q '^INSTRUMENT_FAILURE ' "${RUNNER_TEMP:-/tmp}/scc-selftest-stderr.txt"; then
            echo "::error::an instrument failure must name itself on stderr"
            exit 1
          fi
          echo "Instrument-failure path exits 4 and names itself."

      - name: Evaluate terminal relations (untrusted PR text stays data)
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
        # The report — including the #15640 snapshot receipt (updated_at, live
        # head SHA, title/body digest) — still lands in the job summary as
        # evidence of what this run actually evaluated. What is new (#16214) is
        # that the exit code is classified into an annotation: the job summary
        # is not served by the REST API, so a reader outside the web UI used to
        # see only "Process completed with exit code 3" and could not tell a
        # verdict about the pull request from a failure of the validator.
        run: |
          set -uo pipefail
          report="${RUNNER_TEMP:-/tmp}/scc-report.txt"
          errors="${RUNNER_TEMP:-/tmp}/scc-stderr.txt"
          rc=0
          target/debug/semantic-close-containment >"${report}" 2>"${errors}" || rc=$?
          # The report is the evidence this step claims to publish, so a
          # failed write is a failure of the step, not a detail. On main the
          # validator was piped straight into `tee` under `pipefail`, which
          # failed the step on a write error; splitting the run into
          # capture-then-classify (#16214) put the validator's status in `rc`
          # and left `tee` unchecked. Missing evidence is NOT_PROVEN, so guard
          # it explicitly rather than relying on the pipeline shape.
          if ! tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}" <"${report}"; then
            printf '::error title=semantic close containment instrument failure::the report could not be published to the job summary -- the verdict below has no evidence behind it\n'
            cat "${errors}" >&2
            exit 4
          fi
          cat "${errors}" >&2

          # Message data escaping per GitHub's workflow-command rules. The
          # validator already replaces every control character in its output,
          # so this guards the percent only, and guards it in the one place
          # runner text reaches a command.
          first_error="$(head -n 1 "${errors}" | tr -d '\r' | sed 's/%/%25/g')"

          case "${rc}" in
            0)
              echo "semantic close containment: no contradiction found"
              ;;
            2)
              printf '::error title=semantic close containment::a terminal relation contradicts its issue subject (exit 2) -- a finding against this pull request\n'
              ;;
            3)
              printf '::error title=semantic close containment::a terminal relation could not be proven (exit 3) -- a verdict about this pull request, see the job summary for the relation and reason\n'
              ;;
            4)
              printf '::error title=semantic close containment instrument failure::the validator could not evaluate this pull request (exit 4) -- NOT a finding against it: %s\n' "${first_error:-no detail on stderr}"
              ;;
            *)
              printf '::error title=semantic close containment crashed::unclassified exit %s -- outside the documented 0/2/3/4 contract: %s\n' "${rc}" "${first_error:-no detail on stderr}"
              ;;
          esac
          exit "${rc}"
