name: CI Gate Self-Tests

# Runs self-tests for CI gates whenever the gate scripts themselves change.
#
# Background: CI gates can silently false-fail (or false-pass) if no test
# verifies they actually catch what they claim to catch. The self-test pattern
# feeds known-bad inputs to each gate and asserts non-zero exit, and known-good
# inputs and asserts exit 0.
#
# See: docs/reference/PROCESS_LESSONS.md — "CI Gate Self-Tests"
# Issue: #3322

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'scripts/cargo-package-workspace-dry-run.sh'
      - 'install.sh'
      - 'scripts/install.sh'
      - 'scripts/publish-topo.py'
      - 'scripts/tests/test-install-target-selection.sh'
      # Install-surface honesty gates (issue #5448): the zero-argument
      # bootstrap path and the public package manifests.
      - 'install.ps1'
      - 'distribution/**'
      - 'Formula/**'
      - 'scripts/render-linux-packages.py'
      - 'scripts/tests/test-installer-zero-args.sh'
      - 'scripts/tests/test-install-path-contract.sh'
      - 'scripts/windows_fresh_path_oracle.py'
      - 'scripts/tests/test-windows-fresh-path-oracle.sh'
      - 'scripts/tests/test-distribution-manifest-consistency.sh'
      - 'scripts/maintenance/verify_11983_reject_identities.py'
      - 'scripts/tests/test-rebuild-11983-reject-identities.py'
      - 'scripts/maintenance/rebuild_11983_current_main.sh'
      # The manifest-consistency gate derives its expected values from these
      # three authorities, so a change to any of them can make every
      # distribution manifest stale. Without them here, the only gate that
      # detects that mismatch would not run on the PR that caused it.
      #   license      -> Cargo.toml [workspace.package] license
      #   posture      -> README.md release-posture sentence
      #   asset prefix -> .github/workflows/release.yml NAME=
      - 'Cargo.toml'
      - 'README.md'
      - '.github/workflows/release.yml'
      - 'scripts/tests/test-publish-dry-run-gate.sh'
      - 'scripts/ci/check-pr-review-convergence'
      - 'scripts/ci/fixtures/convergence/**'
      - 'scripts/tests/test-check-pr-review-convergence.sh'
      - 'scripts/reviews/**'
      # Subject-bound semantic review currentness. The policy-surface suite
      # asserts against the skill trees, the shared contract, and pre-merge, so
      # a change to any of them can regress the gate that reads them.
      - 'scripts/ci/check-pr-semantic-review-currentness.py'
      - 'scripts/ci/test_check_pr_semantic_review_currentness.py'
      - 'tests/test_semantic_review_currentness.py'
      - 'scripts/pre-merge-check.sh'
      - 'docs/agents/REVIEW_CURRENTNESS.md'
      - '.agents/skills/**'
      - '.claude/skills/**'
      - 'scripts/tests/test-review-lease.sh'
      - 'scripts/tests/test-review-threads-inline.sh'
      - 'scripts/worktree-manager.py'
      - 'scripts/tests/test-worktree-manager.sh'
      - '.cargo/config.toml'
      - 'scripts/tests/test-target-isolation.sh'
      # ripr lane termination classification + bounded same-head retry
      # (#6807/#12563/#12771): the gate's eviction classifier is itself a
      # gate. These self-tests prove a genuine red still redding the required
      # "ripr+ New Gap Gate" and only positive runner-teardown evidence
      # reaching the single-retry path.
      - '.github/workflows/ripr.yml'
      - '.github/workflows/ripr-infra-retry.yml'
      - 'scripts/ci/classify-ripr-lane-termination'
      - 'scripts/tests/test-classify-ripr-lane-termination.sh'
      # Toolchain guard for bash entrypoints (issue #12593): the coverage
      # consistency test scans every cargo-invoking scripts/*.sh, so any
      # script change re-proves that none of them dodges the guard.
      - 'scripts/lib/cargo-toolchain-guard.sh'
      - 'scripts/*.sh'
      - 'scripts/cargo-safe'
      - 'scripts/fuzz-bounded'
      - '.github/run_all_tests.sh'
      - 'scripts/tests/test-cargo-toolchain-guard.sh'
      - 'scripts/tests/test-cargo-safe-toolchain-guard.sh'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - '.github/workflows/publish-dry-run.yml'
      - '.github/workflows/ci-gate-self-tests.yml'
      # PR Plan head-name sentinel guard (#6238): payload-only pull_request
      # evaluator whose structural and classifier contract is proved by its
      # scripts/tests fixture.
      - '.github/workflows/pr-plan-head-name-guard.yml'
      - 'scripts/tests/test-pr-plan-head-name-guard.sh'
  workflow_dispatch: {}

concurrency:
  group: ci-gate-self-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-dry-run-self-test:
    name: Publish dry-run gate self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Run publish dry-run gate self-test
        run: bash scripts/tests/test-publish-dry-run-gate.sh

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## CI gate self-tests passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The publish dry-run gate correctly catches:" >> "$GITHUB_STEP_SUMMARY"
            echo "- Invalid TOML (duplicate keys) — cargo metadata rejects it" >> "$GITHUB_STEP_SUMMARY"
            echo "- Nonexistent dependencies — cargo package fails to resolve" >> "$GITHUB_STEP_SUMMARY"
            echo "- Clean manifests — passes without false-failing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## CI gate self-tests FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A gate self-test assertion failed — the gate may not be catching errors it claims to catch." >> "$GITHUB_STEP_SUMMARY"
            echo "Check the step output above for which case failed." >> "$GITHUB_STEP_SUMMARY"
          fi

  install-target-selection-self-test:
    name: Installer target-selection self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run installer target-selection self-test
        run: bash scripts/tests/test-install-target-selection.sh

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Installer target-selection self-test passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The installer selects GNU/glibc, musl, override, bad-override, and wrapper fallback paths as expected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Installer target-selection self-test FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The installer target-selection contract regressed. Check the step output above for the failed case." >> "$GITHUB_STEP_SUMMARY"
          fi

  installer-zero-args-self-test:
    name: Installer zero-argument bootstrap self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run installer zero-argument self-test
        run: bash scripts/tests/test-installer-zero-args.sh

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Installer zero-argument self-test passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The documented \`curl -fsSL ... | bash\` bootstrap (issue #5448) survives \`set -u\`: \`\${BASH_SOURCE[0]}\` is guarded for stdin invocation, empty array expansions use \`\${arr[@]+\"\${arr[@]}\"}\` so bash 3.2 (macOS system bash) does not abort, and positional/flag argument forwarding is unchanged. The bash 3.2 container case runs when Docker is available and SKIPs otherwise." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Installer zero-argument self-test FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The zero-argument installer bootstrap regressed — the documented curl-pipe command may abort before installing anything. Check the step output above for the failed case." >> "$GITHUB_STEP_SUMMARY"
          fi

  installer-path-contract-self-test:
    name: Installer PATH contract self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run installer PATH contract self-test
        run: bash scripts/tests/test-install-path-contract.sh

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "## Installer PATH contract self-test passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Windows install.ps1 owns User-PATH persistence with -NoModifyPath and bounded dispositions; POSIX remains explicitly manual when the user-local fallback is outside PATH (issue #7832). This is a source contract, not fresh-host proof." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Installer PATH contract self-test FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The installer PATH source contract regressed. Check the step output above for the failed case." >> "$GITHUB_STEP_SUMMARY"
          fi

  windows-fresh-path-oracle-self-test:
    name: Windows fresh-process PATH oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Windows fresh-process PATH oracle self-test
        run: bash scripts/tests/test-windows-fresh-path-oracle.sh

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "## Windows fresh-process PATH oracle passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Spawned oracle rebuilds PATH from Machine+User fixtures and resolves the exact staged subject without harness PATH injection (issue #7832). Fixture-scope proof only — not live-host install proof." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Windows fresh-process PATH oracle FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The Machine+User fresh-process PATH oracle regressed. Check the step output above for the failed case." >> "$GITHUB_STEP_SUMMARY"
          fi

  distribution-manifest-consistency-self-test:
    name: Distribution manifest consistency self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run distribution manifest consistency self-test
        run: bash scripts/tests/test-distribution-manifest-consistency.sh

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Distribution manifest consistency self-test passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Scoop, winget, Chocolatey, Linux, and Homebrew manifests (issue #5448) agree with the repository's own authorities: license expression from \`Cargo.toml [workspace.package]\`, release posture from \`README.md\`, and release asset prefix from \`release.yml\`. Every channel installs \`perl-dap\`, every manifest parses in its own format, and exactly one Homebrew formula exists." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Distribution manifest consistency self-test FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A public package manifest disagrees with the repository's license, posture, asset-name, or binary-set truth. These strings are what users read in \`winget show\` / \`scoop info\` / the Chocolatey listing. Check the step output above." >> "$GITHUB_STEP_SUMMARY"
          fi

  rebuild-11983-reject-identity-self-test:
    name: Rebuild 11983 reject-identity self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run reject-identity fixture self-test
        run: python3 scripts/tests/test-rebuild-11983-reject-identities.py

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "## Rebuild 11983 reject-identity self-test passed" >> "$GITHUB_STEP_SUMMARY"
            echo "The widened 12-file/20-hunk denominator and all authored hunk/old-side reject identities accept the positive fixture while mismatch, omission, duplicate, and unaccounted-artifact controls fail closed (issue #12975)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Rebuild 11983 reject-identity self-test FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "The per-file reject-identity contract accepted a mismatch, omission, duplicate, or unaccounted artifact, or rejected the authored positive fixture." >> "$GITHUB_STEP_SUMMARY"
          fi

  check-pr-review-convergence-self-test:
    name: Review-convergence gate self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run review-convergence gate self-test
        run: bash scripts/tests/test-check-pr-review-convergence.sh

      # The convergence wrapper reports native GitHub facts and deliberately
      # refuses to classify them as substantive review. That split is only
      # honest if the verifier which does own the verdict is proved alongside
      # it, so both halves run in the same gate.
      - name: Run subject-bound semantic-currentness verifier tests
        run: python3 -m unittest scripts/ci/test_check_pr_semantic_review_currentness.py

      - name: Run semantic-currentness policy-surface tests
        run: python3 -m unittest tests.test_semantic_review_currentness

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Review-convergence gate self-test passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "check-pr-review-convergence correctly BLOCKs on both active and outdated unresolved review threads (issue #3679), stays ADVISORY-only on stale bot reviews, converges when all threads are resolved, and (issue #3693 R1) reports the review-protocol axes advisory-by-default while BLOCKing them under REVIEW_PROTOCOL_ENFORCE=1." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The wrapper and \`scripts/reviews/state\` stay fact-only (issue #6628): neither promotes a submitted review into a currentness verdict, and subject-bound semantic review is proved separately by check-pr-semantic-review-currentness.py." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Review-convergence gate self-test FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The review-convergence gate contract regressed. Check the step output above for the failed case." >> "$GITHUB_STEP_SUMMARY"
          fi

  review-lease-self-test:
    name: Review-lease self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run review-lease self-test
        run: bash scripts/tests/test-review-lease.sh

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Review-lease self-test passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "scripts/reviews/lease (issue #3693 R1) correctly acquires/verifies/releases a per-branch lease, refuses a different owner while unexpired, and surfaces expired leases as takeover-candidates on audit (the relocated fixture 11)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Review-lease self-test FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The review-lease contract regressed. Check the step output above for the failed case." >> "$GITHUB_STEP_SUMMARY"
          fi

  review-threads-inline-self-test:
    name: Review threads/inline self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run review threads/inline self-test
        run: bash scripts/tests/test-review-threads-inline.sh

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Review threads/inline self-test passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "scripts/reviews/threads (issue #6178) pages through a multi-page reviewThreads connection without dropping a thread, filters with --unresolved-only, makes no mutating call, and emits thread IDs that scripts/reviews/disposition --thread accepts. scripts/reviews/inline posts findings as ONE submitted review and refuses to post anything when a finding is not anchored to an addressable diff line, naming the offending finding." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Review threads/inline self-test FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The review threads/inline contract regressed. Check the step output above for the failed case." >> "$GITHUB_STEP_SUMMARY"
          fi

  worktree-manager-self-test:
    name: Worktree-manager allocate self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run worktree-manager allocate self-test
        run: bash scripts/tests/test-worktree-manager.sh

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Worktree-manager allocate self-test passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "scripts/worktree-manager.py \`allocate\` (issue #3749) correctly checks out an already-pushed origin branch's real content on slot re-allocation, and cuts genuinely-new branches from a freshly-fetched origin/main instead of a stale local tracking ref." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Worktree-manager allocate self-test FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The worktree-manager allocate contract regressed. Check the step output above for the failed case." >> "$GITHUB_STEP_SUMMARY"
          fi

  target-isolation-self-test:
    name: Per-worktree cargo target-dir isolation self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: stable

      - name: Run target-dir isolation self-test
        run: bash scripts/tests/test-target-isolation.sh

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Target-dir isolation self-test passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Two independently created worktrees (issue #3854) resolve \`cargo metadata\`'s \`target_directory\` to their own \`<worktree>/target\`, differing from each other, with \`CARGO_TARGET_DIR\` unset — confirming cargo's default per-worktree isolation, including from a subdirectory." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Target-dir isolation self-test FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The per-worktree target-dir isolation contract regressed. Check the step output above for the failed case." >> "$GITHUB_STEP_SUMMARY"
          fi

  cargo-toolchain-guard-self-test:
    name: Entrypoint cargo toolchain guard self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: stable

      - name: Run guard decision-function and coverage self-test
        run: bash scripts/tests/test-cargo-toolchain-guard.sh

      - name: Run guard entrypoint integration self-test
        run: bash scripts/tests/test-cargo-safe-toolchain-guard.sh

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "## Cargo toolchain guard self-test passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The entrypoint toolchain guard (issue #12593) refuses a stale non-rustup cargo (the WSL /usr/bin/cargo 1.75 shape) with exit 78 and a remediation message before any build work, passes a satisfying cargo through to delegation, keeps the real-toolchain happy path green, and the coverage check proves every cargo-invoking scripts/*.sh plus cargo-safe and .github/run_all_tests.sh either runs the guard or carries an explicit exemption." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Cargo toolchain guard self-test FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The guard contract regressed — a bash entrypoint could again hand builds to a cargo older than the workspace rust-version and surface it as a manifest parse error. Check the step output above." >> "$GITHUB_STEP_SUMMARY"
          fi

  ripr-lane-termination-classifier-self-test:
    name: ripr lane-termination classifier self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run ripr termination classifier + bounded-retry self-test
        run: bash scripts/tests/test-classify-ripr-lane-termination.sh

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "## ripr lane-termination classifier self-test passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The eviction classifier (#6807, #12563, #12771) keeps the boundary that matters: a genuine gap receipt (\"quality gate failed\") always classifies ripr-failure — with or without a later teardown marker, so real reds are never auto-retried — while only positive runner-teardown evidence yields infra-no-proof for the single same-head retry (ripr-infra-retry), silence or unreadable logs fail closed to ripr-failure, and attempt >= 2 surfaces NOT_PROVEN loudly." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ripr lane-termination classifier self-test FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The classifier or decision table regressed — an infra kill could mask a genuine red, a retry could loop unboundedly, or absent evidence could pass. Check the step output above for which fixture misclassified." >> "$GITHUB_STEP_SUMMARY"
          fi

  pr-plan-head-name-guard-self-test:
    name: PR Plan head-name guard self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run PR Plan head-name guard self-test
        run: bash scripts/tests/test-pr-plan-head-name-guard.sh

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
