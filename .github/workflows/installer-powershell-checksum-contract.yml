name: Installer PowerShell Checksum Contract

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'install.ps1'
      - 'scripts/agent-cleanup.ps1'
      - 'scripts/tests/test-agent-cleanup-target-retention.ps1'
      - 'scripts/install.sh'
      - 'scripts/tests/test-install-ps1-checksum-required.ps1'
      - 'scripts/tests/new-install-ps1-native-fixture.ps1'
      - 'scripts/tests/test-install-ps1-installed-verification.ps1'
      - 'scripts/tests/test-install-ps1-archive-safety.ps1'
      - 'scripts/tests/test-install-ps1-product-unit-promotion.ps1'
      - 'policy/standalone-archive-safety.v1.toml'
      - 'docs/how-to/INSTALLATION.md'
      - '.github/workflows/installer-powershell-checksum-contract.yml'
  push:
    branches: [main, master]
    paths:
      - 'install.ps1'
      - 'scripts/agent-cleanup.ps1'
      - 'scripts/tests/test-agent-cleanup-target-retention.ps1'
      - 'scripts/install.sh'
      - 'scripts/tests/test-install-ps1-checksum-required.ps1'
      - 'scripts/tests/new-install-ps1-native-fixture.ps1'
      - 'scripts/tests/test-install-ps1-installed-verification.ps1'
      - 'scripts/tests/test-install-ps1-archive-safety.ps1'
      - 'scripts/tests/test-install-ps1-product-unit-promotion.ps1'
      - 'policy/standalone-archive-safety.v1.toml'
      - 'docs/how-to/INSTALLATION.md'
      - '.github/workflows/installer-powershell-checksum-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PowerShell checksum, archive safety, and product-unit promotion
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout identity
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) {
              throw "checkout identity mismatch"
          }

      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          foreach ($Path in @(
              'install.ps1',
              'scripts/agent-cleanup.ps1',
              'scripts/tests/test-agent-cleanup-target-retention.ps1',
              'scripts/tests/test-install-ps1-checksum-required.ps1',
              'scripts/tests/new-install-ps1-native-fixture.ps1',
              'scripts/tests/test-install-ps1-installed-verification.ps1',
              'scripts/tests/test-install-ps1-archive-safety.ps1',
              'scripts/tests/test-install-ps1-product-unit-promotion.ps1'
          )) {
              $Tokens = $null
              $Errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $Path),
                  [ref]$Tokens,
                  [ref]$Errors
              ) | Out-Null
              if ($Errors.Count -ne 0) {
                  $Errors | ForEach-Object { Write-Error $_ }
                  throw "$Path contains PowerShell parse errors"
              }
          }

      # Parse-only guard under Windows PowerShell 5.1 (shell: powershell on
      # windows runners). pwsh defaults to UTF-8, so the pwsh parse step above
      # cannot see encoding damage: a BOM-less file carrying non-ASCII glyphs
      # parses there but fails under 5.1, which decodes BOM-less files as
      # Windows-1252. This step never executes the installer.
      - name: Parse PowerShell sources under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/tests/test-powershell-51-parse-guard.ps1

      - name: Run checksum negative controls
        shell: pwsh
        run: ./scripts/tests/test-install-ps1-checksum-required.ps1

      - name: Verify installed native binaries under PowerShell 7
        shell: pwsh
        run: ./scripts/tests/test-install-ps1-installed-verification.ps1

      - name: Verify installed native binaries under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/tests/test-install-ps1-installed-verification.ps1

      - name: Run archive-safety controls
        shell: pwsh
        run: ./scripts/tests/test-install-ps1-archive-safety.ps1

      - name: Run product-unit promotion controls
        shell: pwsh
        run: ./scripts/tests/test-install-ps1-product-unit-promotion.ps1

      - name: Run target-retention controls under PowerShell 7
        id: target-retention-pwsh7
        shell: pwsh
        run: ./scripts/tests/test-agent-cleanup-target-retention.ps1 -ProofRoot (Join-Path $env:RUNNER_TEMP 'target-retention-pwsh7')

      - name: Run target-retention controls under Windows PowerShell 5.1
        # Collect both runtime results without bypassing a failed earlier setup.
        if: ${{ !cancelled() && (steps.target-retention-pwsh7.outcome == 'success' || steps.target-retention-pwsh7.outcome == 'failure') }}
        shell: powershell
        run: ./scripts/tests/test-agent-cleanup-target-retention.ps1 -ProofRoot (Join-Path $env:RUNNER_TEMP 'target-retention-windows51')

      - name: Preserve target-retention results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-target-retention-results
          path: |
            ${{ runner.temp }}/target-retention-pwsh7/results.json
            ${{ runner.temp }}/target-retention-windows51/results.json
          if-no-files-found: warn
