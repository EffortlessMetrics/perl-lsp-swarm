name: Installer PowerShell Checksum Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]
    paths:
      - 'install.ps1'
      - 'scripts/install.sh'
      - 'scripts/tests/test-install-ps1-checksum-required.ps1'
      - 'scripts/tests/test-install-ps1-archive-safety.ps1'
      - 'scripts/tests/test-install-ps1-product-unit-promotion.ps1'
      - 'policy/standalone-archive-safety.v1.toml'
      - 'docs/how-to/INSTALLATION.md'
      - '.github/workflows/installer-powershell-checksum-contract.yml'
  push:
    branches: [main, master]
    paths:
      - 'install.ps1'
      - 'scripts/install.sh'
      - 'scripts/tests/test-install-ps1-checksum-required.ps1'
      - 'scripts/tests/test-install-ps1-archive-safety.ps1'
      - 'scripts/tests/test-install-ps1-product-unit-promotion.ps1'
      - 'policy/standalone-archive-safety.v1.toml'
      - 'docs/how-to/INSTALLATION.md'
      - '.github/workflows/installer-powershell-checksum-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    name: PowerShell checksum, archive safety, and product-unit promotion
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout identity
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) {
              throw "checkout identity mismatch"
          }

      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          foreach ($Path in @(
              'install.ps1',
              'scripts/tests/test-install-ps1-checksum-required.ps1',
              'scripts/tests/test-install-ps1-archive-safety.ps1',
              'scripts/tests/test-install-ps1-product-unit-promotion.ps1'
          )) {
              $Tokens = $null
              $Errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $Path),
                  [ref]$Tokens,
                  [ref]$Errors
              ) | Out-Null
              if ($Errors.Count -ne 0) {
                  $Errors | ForEach-Object { Write-Error $_ }
                  throw "$Path contains PowerShell parse errors"
              }
          }

      # Parse-only guard under Windows PowerShell 5.1 (shell: powershell on
      # windows runners). pwsh defaults to UTF-8, so the pwsh parse step above
      # cannot see encoding damage: a BOM-less file carrying non-ASCII glyphs
      # parses there but fails under 5.1, which decodes BOM-less files as
      # Windows-1252. This step never executes the installer.
      - name: Parse PowerShell sources under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/tests/test-powershell-51-parse-guard.ps1

      - name: Run checksum negative controls
        shell: pwsh
        run: ./scripts/tests/test-install-ps1-checksum-required.ps1

      - name: Run archive-safety controls
        shell: pwsh
        run: ./scripts/tests/test-install-ps1-archive-safety.ps1

      - name: Run product-unit promotion controls
        shell: pwsh
        run: ./scripts/tests/test-install-ps1-product-unit-promotion.ps1
