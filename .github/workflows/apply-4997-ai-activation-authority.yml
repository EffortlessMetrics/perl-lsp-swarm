name: Apply #4997 AI activation authority

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - scripts/maintenance/apply_4997_ai_activation_authority.py
      - .github/workflows/apply-4997-ai-activation-authority.yml
      - .spec/4997-ai-activation-authority/last-validation.log

permissions:
  contents: write

concurrency:
  group: apply-4997-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'EffortlessMetrics/perl-lsp-swarm' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/4997-ai-activation-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/4997-ai-activation-authority
          fetch-depth: 0

      - name: Admit current regression, schema, schema-test, and constructor signatures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/maintenance/apply_4997_ai_activation_authority.py")
          text = path.read_text(encoding="utf-8")

          signature_old = (
              r'fn workspace_ai_completion_ignores_untrusted_endpoint_and_credential_settings\(\) \{'
          )
          signature_new = (
              r'fn workspace_ai_completion_ignores_untrusted_endpoint_and_credential_settings\(\)(?: -> TestResult)? \{'
          )
          assert text.count(signature_old) == 1, text.count(signature_old)
          text = text.replace(signature_old, signature_new)

          description_old = (
              "AI-powered inline completion configuration. Sensitive destination/credential fields are intentionally excluded from LSP client settings."
          )
          description_new = (
              "Client-controlled AI completion behavior. Endpoint and credential-routing fields are intentionally excluded because workspace-delivered LSP settings may not redirect source/secret-bearing requests."
          )
          assert text.count(description_old) == 1, text.count(description_old)
          text = text.replace(description_old, description_new)

          provider_old = '"provider": { "type": "string", "default": "openai_compat" }'
          provider_new = (
              '"provider": { "type": "string", "enum": ["openai_compat"], '
              '"default": "openai_compat" }'
          )
          block_start = text.index('for line in [')
          block_end = text.index(']:\n    replace_exact(SCHEMA, line, "")', block_start)
          block = text[block_start:block_end]
          assert block.count(provider_old) == 1, block.count(provider_old)
          block = block.replace(provider_old, provider_new)
          text = text[:block_start] + block + text[block_end:]

          section = text.index('SCHEMA_TEST = "crates/perl-lsp-rs-core/tests/perllsp_settings_schema_tests.rs"')
          call_starts = []
          cursor = section
          for _ in range(3):
              start = text.index("replace_exact(\n    SCHEMA_TEST,\n", cursor)
              call_starts.append(start)
              cursor = text.index("\n)\n", start) + 3

          assertion_start = call_starts[1]
          assertion_end = text.index("\n)\n", assertion_start) + 3
          sensitive_start = call_starts[2]
          sensitive_end = text.index("\n)\n", sensitive_start) + 3

          assertion_call = r'''replace_exact(
              SCHEMA_TEST,
              '    assert_eq!(server.ai_completion.user_enabled, true);\n'
              '    assert_eq!(server.ai_completion.model, "fixture-model");\n',
              '    assert_eq!(server.ai_completion.user_enabled, false);\n'
              '    assert_eq!(server.ai_completion.enabled, false);\n'
              '    assert_eq!(server.ai_completion.model, "gpt-4o-mini");\n',
          )
          '''
          sensitive_call = r'''replace_exact(
              SCHEMA_TEST,
              '    assert_eq!(ai.get("endpoint").is_none(), true);\n'
              '    assert_eq!(ai.get("apiKeyEnv").is_none(), true);\n'
              '    assert_eq!(ai.get("apiKeyHeader").is_none(), true);\n'
              '    assert_eq!(ai.get("apiKeyPrefix").is_none(), true);\n',
              '    assert_eq!(ai.get("enabled").is_none(), true);\n'
              '    assert_eq!(ai.get("provider").is_none(), true);\n'
              '    assert_eq!(ai.get("model").is_none(), true);\n'
              '    assert_eq!(ai.get("endpoint").is_none(), true);\n'
              '    assert_eq!(ai.get("apiKeyEnv").is_none(), true);\n'
              '    assert_eq!(ai.get("apiKeyHeader").is_none(), true);\n'
              '    assert_eq!(ai.get("apiKeyPrefix").is_none(), true);\n',
          )
          '''

          text = text[:sensitive_start] + sensitive_call + text[sensitive_end:]
          text = text[:assertion_start] + assertion_call + text[assertion_end:]

          constructors = text.index('CONSTRUCTORS = "crates/perl-lsp-rs/src/runtime/constructors.rs"')
          count_start = text.index('    count=2,\n)', constructors)
          text = text[:count_start] + '    count=3,\n)' + text[count_start + len('    count=2,\n)'):]

          final_old = '''assert_absent(SCHEMA, '\"enabled\": { \"type\": \"boolean\", \"default\": false }')
          assert_absent(SCHEMA, '\"provider\": { \"type\": \"string\", \"default\": \"openai_compat\" }')
          assert_absent(SCHEMA, '\"model\": { \"type\": \"string\", \"default\": \"gpt-4o-mini\" }')
          '''
          final_new = '''schema_value = __import__("json").loads(read(SCHEMA))
          ai_properties = schema_value["properties"]["perl"]["properties"]["aiCompletion"]["properties"]
          for forbidden in [
              "enabled",
              "provider",
              "model",
              "endpoint",
              "apiKeyEnv",
              "apiKeyHeader",
              "apiKeyPrefix",
          ]:
              if forbidden in ai_properties:
                  raise RuntimeError(f"{SCHEMA}: generic AI authority returned: {forbidden}")
          '''
          assert text.count(final_old) == 1, text.count(final_old)
          text = text.replace(final_old, final_new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Preserve trusted activation setup in project opt-out tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/maintenance/apply_4997_ai_activation_authority.py")
          text = path.read_text(encoding="utf-8")
          marker = '''# ---------------------------------------------------------------------------
          # Declarative authority: generic sources may tune safe preferences, but may not
          # arm/select the remote backend.
          # ---------------------------------------------------------------------------
          '''
          insertion = r'''replace_exact(
              CONFIG,
              '        let mut config = ServerConfig::default();\n'
              '        config.update_from_value(&serde_json::json!({\n'
              '            "aiCompletion": { "enabled": true }\n'
              '        }));\n',
              '        let mut config = ServerConfig::default();\n'
              '        config.ai_completion.user_enabled = true;\n'
              '        recompute_ai_completion_effective(&mut config.ai_completion);\n',
              count=2,
          )

          '''
          assert text.count(marker) == 1, text.count(marker)
          path.write_text(text.replace(marker, insertion + marker), encoding="utf-8")
          PY

      - name: Apply count-checked cutover
        run: python3 scripts/maintenance/apply_4997_ai_activation_authority.py

      - name: Format and validate focused contracts
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          log=/tmp/4997-validation.log
          : > "$log"
          status=0

          run_checked() {
            printf '\n## %q' "$1" >> "$log"
            shift
            printf ' %q' "$@" >> "$log"
            printf '\n' >> "$log"
            "$@" >> "$log" 2>&1
            rc=$?
            printf '\nexit_status=%s\n' "$rc" >> "$log"
            return "$rc"
          }

          run_checked "cargo fmt --all" cargo fmt --all || status=$?
          if [ "$status" -eq 0 ]; then
            run_checked "validate settings schema JSON" python3 -m json.tool schemas/perllsp-settings.schema.json || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_checked "validate VS Code package JSON" python3 -m json.tool vscode-extension/package.json || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_checked "AI authority recurrence" cargo test -p perl-lsp-rs-core --test ai_activation_authority_contract --locked || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_checked "settings schema behavior" cargo test -p perl-lsp-rs-core --test perllsp_settings_schema_tests --locked || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_checked "core AI configuration" cargo test -p perl-lsp-rs-core --lib ai_completion --locked || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_checked "inline completion first effect" cargo test -p perl-lsp-rs --features expose_lsp_test_api --test lsp_ai_inline_completion_tests --locked || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_checked "all-feature server check" cargo check -p perl-lsp-rs --all-targets --all-features --locked || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_checked "diff hygiene" git diff --check || status=$?
          fi

          cp "$log" .spec/4997-ai-activation-authority/last-validation.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist bounded failed-validation receipt
        if: steps.validate.outputs.status != '0'
        env:
          BRANCH: agent/4997-ai-activation-authority
        run: |
          cp .spec/4997-ai-activation-authority/last-validation.log /tmp/4997-validation.log
          git reset --hard HEAD
          mkdir -p .spec/4997-ai-activation-authority
          cp /tmp/4997-validation.log .spec/4997-ai-activation-authority/last-validation.log
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add .spec/4997-ai-activation-authority/last-validation.log
          if git diff --cached --quiet; then
            echo "Validation receipt is unchanged"
          else
            git commit -m 'chore(ai): record #4997 validation failure'
            git push origin HEAD:"$BRANCH"
          fi
          exit 1

      - name: Publish implementation commit and remove one-shot machinery
        if: steps.validate.outputs.status == '0'
        env:
          BRANCH: agent/4997-ai-activation-authority
        run: |
          rm -- scripts/maintenance/apply_4997_ai_activation_authority.py
          rm -- .github/workflows/apply-4997-ai-activation-authority.yml
          rm -f -- .spec/4997-ai-activation-authority/last-validation.log
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add -A
          git diff --cached --check
          git commit -m 'security(ai-completion): bind remote backend to trusted authority (#4997)'
          git push origin HEAD:"$BRANCH"
