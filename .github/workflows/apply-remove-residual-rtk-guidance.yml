name: Apply residual RTK guidance cleanup

on:
  push:
    branches:
      - agent/remove-residual-rtk-guidance
    paths:
      - .github/workflows/apply-remove-residual-rtk-guidance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/remove-residual-rtk-guidance
          fetch-depth: 0

      - name: Remove RTK from live guidance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path(".ci/README-coverage.md"),
              Path(".kiro/specs/rc2-semantic-analysis/design.md"),
              Path(".spec/4414-parser-layering/checklist.md"),
              Path(".spec/4420-wave1-perl-module/checklist.md"),
              Path(".spec/agent-context-v1/acceptance.md"),
              Path("docs/ci/ripr.md"),
              Path("docs/development/LSP_INTERACTIVE_LATENCY_ROLLOUT.md"),
              Path("docs/how-to/COVERAGE.md"),
              Path("docs/project/TREE_SITTER_INCREMENTAL_CROSSOVER.md"),
              Path("docs/project/status/coverage_and_ripr_enforcement.md"),
              Path("docs/proposals/PLSP-PROP-0003-spec-governance.md"),
              Path("docs/reference/CI_ARCHITECTURE.md"),
              Path("docs/reference/CLUSTER_CURATION.md"),
              Path("docs/reference/COMMANDS_REFERENCE.md"),
              Path("docs/reference/FAILURE_MODES.md"),
              Path("docs/reference/LANE_BOUNDARIES.md"),
              Path("docs/specs/PLSP-SPEC-0026-determinism-receipt-v1.md"),
              Path("docs/specs/PLSP-SPEC-0027-differential-real-perl-oracle.md"),
              Path("plans/real-perl-editor-trust/implementation-plan.md"),
              Path("plans/spec-governance/implementation-plan.md"),
              Path("scripts/ci/test_receipts_to_junit.py"),
              Path("xtask/src/tasks/ci_route.rs"),
              Path("xtask/src/tasks/goals/snapshot.rs"),
              Path("xtask/src/tasks/quality_baseline.rs"),
              Path("xtask/src/tasks/quality_gate.rs"),
              Path("xtask/tests/quality_gate_cli_policy.rs"),
              Path("xtask/tests/quality_gate_patch_coverage_cli_policy.rs"),
              Path("xtask/tests/quality_gate_ripr_new_gap_cli_policy.rs"),
              Path("xtask/tests/quality_pr_summary_policy.rs"),
          ]

          changed = []
          total = 0
          for path in paths:
              if not path.is_file():
                  print(f"skip missing: {path}")
                  continue
              raw = path.read_bytes()
              count = raw.count(b"rtk ")
              if count:
                  path.write_bytes(raw.replace(b"rtk ", b""))
                  changed.append((str(path), count))
                  total += count

          if total == 0:
              raise SystemExit("allowlisted live surfaces contained no RTK commands")
          for path, count in changed:
              print(f"{path}: removed {count} RTK prefix(es)")
          PY

          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            .ci/README-coverage.md \
            .kiro/specs/rc2-semantic-analysis/design.md \
            .spec/4414-parser-layering/checklist.md \
            .spec/4420-wave1-perl-module/checklist.md \
            .spec/agent-context-v1/acceptance.md \
            docs/ci/ripr.md \
            docs/development/LSP_INTERACTIVE_LATENCY_ROLLOUT.md \
            docs/how-to/COVERAGE.md \
            docs/project/TREE_SITTER_INCREMENTAL_CROSSOVER.md \
            docs/project/status/coverage_and_ripr_enforcement.md \
            docs/proposals/PLSP-PROP-0003-spec-governance.md \
            docs/reference/CI_ARCHITECTURE.md \
            docs/reference/CLUSTER_CURATION.md \
            docs/reference/COMMANDS_REFERENCE.md \
            docs/reference/FAILURE_MODES.md \
            docs/reference/LANE_BOUNDARIES.md \
            docs/specs/PLSP-SPEC-0026-determinism-receipt-v1.md \
            docs/specs/PLSP-SPEC-0027-differential-real-perl-oracle.md \
            plans/real-perl-editor-trust/implementation-plan.md \
            plans/spec-governance/implementation-plan.md \
            scripts/ci/test_receipts_to_junit.py \
            xtask/src/tasks/ci_route.rs \
            xtask/src/tasks/goals/snapshot.rs \
            xtask/src/tasks/quality_baseline.rs \
            xtask/src/tasks/quality_gate.rs \
            xtask/tests/quality_gate_cli_policy.rs \
            xtask/tests/quality_gate_patch_coverage_cli_policy.rs \
            xtask/tests/quality_gate_ripr_new_gap_cli_policy.rs \
            xtask/tests/quality_pr_summary_policy.rs
          git commit -m "docs: remove RTK from live guidance and generated commands"
          git push origin HEAD:agent/remove-residual-rtk-guidance
