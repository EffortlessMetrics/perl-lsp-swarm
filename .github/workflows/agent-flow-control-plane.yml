name: Agent Flow Control Plane

# #5201 C3: compile the static operating-system contract only when that
# contract changes. This workflow has no GitHub or live-agent authority.

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/agents/**'
      - 'docs/specs/PLSP-SPEC-0006-pr-queue-disposition.md'
      - 'docs/specs/README.md'
      - 'docs/INDEX.md'
      - '.agents/skills/**'
      - '.claude/skills/**'
      - '.claude/settings.json'
      - '.codex/**'
      - 'xtask/src/main.rs'
      - 'xtask/src/tasks/agent_flow.rs'
      - 'xtask/src/tasks/mod.rs'
      - 'xtask/tests/agent_merge_review_backstop.rs'
      - 'xtask/tests/pr_convergence_contract.rs'
      - 'xtask/tests/ripr_placement_contract.rs'
      - 'scripts/tests/test-agent-flow-control-plane-trigger.sh'
      - '.github/workflows/agent-flow-control-plane.yml'
  push:
    branches: [main, master]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/agents/**'
      - 'docs/specs/PLSP-SPEC-0006-pr-queue-disposition.md'
      - 'docs/specs/README.md'
      - 'docs/INDEX.md'
      - '.agents/skills/**'
      - '.claude/skills/**'
      - '.claude/settings.json'
      - '.codex/**'
      - 'xtask/src/main.rs'
      - 'xtask/src/tasks/agent_flow.rs'
      - 'xtask/src/tasks/mod.rs'
      - 'xtask/tests/agent_merge_review_backstop.rs'
      - 'xtask/tests/pr_convergence_contract.rs'
      - 'xtask/tests/ripr_placement_contract.rs'
      - 'scripts/tests/test-agent-flow-control-plane-trigger.sh'
      - '.github/workflows/agent-flow-control-plane.yml'

permissions:
  contents: read

concurrency:
  group: agent-flow-control-plane-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Compile agent-flow control plane
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Validate trigger contract
        run: bash scripts/tests/test-agent-flow-control-plane-trigger.sh

      - name: Check metadata and route references
        run: cargo xtask agent-flow check --format json

      - name: Check deterministic route scenarios
        run: cargo xtask agent-flow scenarios --format json

      - name: Check merge review/integration backstop
        run: cargo test -p xtask --test agent_merge_review_backstop --locked

      - name: Check PR convergence contract
        run: cargo test -p xtask --test pr_convergence_contract --locked

      - name: Check RIPR placement contract
        run: cargo test -p xtask --test ripr_placement_contract --locked
