name: Release Artifact Size Shadow

# Read-only, manual-only same-SHA safe-ICF A/B measurement for issue #5432.
#
# This lane produces evidence and nothing else. It never tags, publishes,
# uploads a release asset, or changes how release.yml links any artifact.
# Adoption is a separate, later decision made from the receipts this lane
# retains.
#
# Each governed macOS triple is measured on its own native runner: the
# `release_artifact_size` instrument rejects a measurement whose rustc host is
# not the measured target, because a cross-built artifact's runtime smoke never
# ran on the platform being claimed.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Native macOS target to measure'
        required: true
        type: choice
        options:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
      repeat_confirmed:
        description: 'A confirming repeat measurement of a borderline win (0.5%-1.0%) has already been run'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-artifact-size-shadow-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The exact candidate link flags governed by #5432. `measure.rs` requires the
  # declared candidate flags to equal this string, and requires the baseline to
  # declare none, so the A/B differs only by these flags.
  SAFE_ICF_RUSTFLAGS: '-C linker=rust-lld -C linker-flavor=ld64.lld -C link-arg=--icf=safe'
  DAP_SMOKE_TEST: stdio_transport_framing_initialize_threads_disconnect

jobs:
  measure:
    name: Measure ${{ inputs.target }}
    runs-on: ${{ inputs.target == 'x86_64-apple-darwin' && 'macos-15-intel' || 'macos-14' }}
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: stable
          targets: ${{ inputs.target }}

      - name: Resolve measurement subject
        id: subject
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # `measure.rs` treats a non-native host as `not_proven`: fail early
          # rather than burning two release builds on unusable evidence.
          HOST="$(rustc -vV | awk '/^host: /{print $2}')"
          if [ "$HOST" != "$TARGET" ]; then
            echo "runner host $HOST cannot measure $TARGET natively" >&2
            exit 1
          fi
          VERSION="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          printf 'host=%s\n' "$HOST" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          # `subject_complete` requires a clean tree, so every staging path this
          # lane writes stays under the gitignored `target/` directory.
          mkdir -p target/shadow/baseline target/shadow/candidate target/shadow/receipts

      - name: Build baseline
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          # Declared empty on purpose: the baseline must carry no linker policy.
          RUSTFLAGS: ''
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET" -p perllsp --bin perllsp
          cargo build --locked --release --target "$TARGET" -p perl-dap --bin perl-dap

      - name: Package baseline
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ steps.subject.outputs.version }}
        run: |
          set -euo pipefail
          scripts/ci/release_artifact_size_stage.sh baseline "$TARGET" "$VERSION"

      - name: Smoke baseline binaries
        shell: bash
        env:
          VERSION: ${{ steps.subject.outputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          scripts/ci/release_artifact_size_smoke.sh baseline "$TARGET" "$VERSION"

      - name: Discard the baseline build directory
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # The candidate must be linked from scratch under the same absolute
          # target path; a surviving baseline artifact would not be relinked.
          rm -rf "target/${TARGET}/release"

      - name: Build candidate
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          RUSTFLAGS: ${{ env.SAFE_ICF_RUSTFLAGS }}
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET" -p perllsp --bin perllsp
          cargo build --locked --release --target "$TARGET" -p perl-dap --bin perl-dap

      - name: Package candidate
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ steps.subject.outputs.version }}
        run: |
          set -euo pipefail
          scripts/ci/release_artifact_size_stage.sh candidate "$TARGET" "$VERSION"

      - name: Smoke candidate binaries
        shell: bash
        env:
          VERSION: ${{ steps.subject.outputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          scripts/ci/release_artifact_size_smoke.sh candidate "$TARGET" "$VERSION"

      - name: Compare baseline and candidate artifacts
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ steps.subject.outputs.version }}
          SOURCE_SHA: ${{ steps.subject.outputs.source_sha }}
          REPEAT_CONFIRMED: ${{ inputs.repeat_confirmed }}
        run: |
          set -euo pipefail
          PKG="perllsp-${VERSION}-${TARGET}"
          REPEAT_FLAG=()
          if [ "$REPEAT_CONFIRMED" = "true" ]; then
            REPEAT_FLAG=(--repeat-confirmed)
          fi
          cargo run --locked -p xtask --example release_artifact_size -- \
            --target "$TARGET" \
            --baseline-dir "target/shadow/baseline/${PKG}" \
            --candidate-dir "target/shadow/candidate/${PKG}" \
            --baseline-archive "target/shadow/baseline/${PKG}.tar.gz" \
            --candidate-archive "target/shadow/candidate/${PKG}.tar.gz" \
            --baseline-lsp-smoke target/shadow/baseline/lsp-smoke.json \
            --candidate-lsp-smoke target/shadow/candidate/lsp-smoke.json \
            --baseline-dap-smoke target/shadow/baseline/dap-smoke.json \
            --candidate-dap-smoke target/shadow/candidate/dap-smoke.json \
            --baseline-source-sha "$SOURCE_SHA" \
            --candidate-source-sha "$SOURCE_SHA" \
            --baseline-rustflags '' \
            --candidate-rustflags "$SAFE_ICF_RUSTFLAGS" \
            "${REPEAT_FLAG[@]}" \
            --json "target/shadow/receipts/release-artifact-size-${TARGET}.json" \
            --markdown "target/shadow/receipts/release-artifact-size-${TARGET}.md"

      - name: Summarize the measurement
        if: always()
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          SUMMARY="target/shadow/receipts/release-artifact-size-${TARGET}.md"
          if [ -f "$SUMMARY" ]; then
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No comparison receipt was produced for `%s`.\n' "$TARGET" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain measurement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifact-size-${{ inputs.target }}
          path: |
            target/shadow/receipts
            target/shadow/baseline/lsp-smoke.json
            target/shadow/baseline/dap-smoke.json
            target/shadow/candidate/lsp-smoke.json
            target/shadow/candidate/dap-smoke.json
          if-no-files-found: warn
          retention-days: 30
