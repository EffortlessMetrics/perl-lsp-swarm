name: Rust 1.100 staged-patch rebase diagnostic

on:
  push:
    branches: [build/rust-1.100-upgrade]
    paths: [.github/workflows/rust-1-100-patch-rebase.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: build/rust-1.100-upgrade
          fetch-depth: 1
          persist-credentials: false

      - name: Apply surviving test hunks and print rejects
        shell: bash
        run: |
          set -euo pipefail
          cp .ci/staged/17903-root-triggers.patch /tmp/root-triggers.patch
          for path in \
            xtask/tests/lane_history_ci_dispatch_contract.rs \
            xtask/tests/post_merge_status_regen_tests.rs
          do
            git apply --unidiff-zero --reject --whitespace=nowarn --include="$path" /tmp/root-triggers.patch || true
            echo "=== $path diff after surviving hunks ==="
            git diff -- "$path"
            echo "=== $path rejects ==="
            if test -f "$path.rej"; then
              cat "$path.rej"
            else
              echo none
            fi
          done
