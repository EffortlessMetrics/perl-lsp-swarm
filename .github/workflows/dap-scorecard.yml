name: DAP scorecard repair commit (one shot)

on:
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/dap-scorecard.yml'

permissions:
  contents: write

jobs:
  commit-proven-repair:
    name: Commit the already-proven pagination repair
    if: github.event.pull_request.head.ref == 'agent/dap-scorecard-same-sha-6680'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: agent/dap-scorecard-same-sha-6680
          fetch-depth: 0
          persist-credentials: true

      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Reapply the proven diff and bypass the broken hosted hook
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import subprocess
          import textwrap

          workflow = ".github/workflows/dap-scorecard.yml"
          previous = subprocess.run(
              ["git", "show", f"HEAD^:{workflow}"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n          rustfmt"
          start = previous.index(start_marker) + len(start_marker)
          end = previous.index(end_marker, start)
          script = textwrap.dedent(previous[start:end])
          exec(compile(script, "dap-pagination-proven-repair.py", "exec"), {"__name__": "__main__"})
          PY

          rustfmt --edition 2024 crates/perl-dap/src/debug_adapter/parsing/scope_variables.rs
          python3 -m py_compile \
            scripts/ci/dap_scorecard_probes.py \
            scripts/tests/test_dap_scorecard_runtime.py
          git show cce2bcb38a3dd7c0d23ea8df8f76fbc7a1f3f664:.github/workflows/dap-scorecard.yml \
            > .github/workflows/dap-scorecard.yml
          git diff --check
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'test(dap): bind pagination proof to lexical fixture'
          git push origin HEAD:agent/dap-scorecard-same-sha-6680
