name: Agent Oxfmt Diagnostics

on:
  push:
    branches:
      - agent/vscode-accessibility-inventory-7864

permissions:
  contents: read

jobs:
  format-diffs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup VS Code toolchain
        uses: ./.github/actions/setup-vscode-toolchain
        with:
          working-directory: vscode-extension
          verify-publisher-tools: 'false'

      - name: Emit exact Oxfmt diffs
        shell: bash
        run: |
          set -euo pipefail
          scratch="vscode-extension/agent-format-scratch"
          rm -rf "$scratch"
          mkdir -p "$scratch"

          while IFS='|' read -r branch path key; do
            [ -n "$branch" ] || continue
            git fetch --no-tags --depth=1 origin \
              "$branch:refs/remotes/origin/$branch"
            mkdir -p "$scratch/$key"
            target="$scratch/$key/$(basename "$path")"
            before="$target.before"
            git show "refs/remotes/origin/$branch:$path" > "$target"
            cp "$target" "$before"
            (
              cd vscode-extension
              npx oxfmt "agent-format-scratch/$key/$(basename "$path")" >/dev/null
            )
            printf '\n===== OXFMT %s %s =====\n' "$branch" "$path"
            diff -u "$before" "$target" || true
          done <<'EOF'
          agent/vscode-accessibility-inventory-7864|vscode-extension/src/accessibilityInventory.ts|7882-src
          agent/vscode-accessibility-inventory-7864|vscode-extension/src/test/accessibilityInventory.test.ts|7882-test
          agent/vscode-client-measurement-7866|vscode-extension/src/clientMeasurement.ts|7884-src
          agent/vscode-client-measurement-7866|vscode-extension/src/test/clientMeasurement.test.ts|7884-test
          agent/vscode-crash-recovery-arbiter-7845|vscode-extension/src/crashRecoveryArbiter.ts|7888-src
          agent/vscode-crash-recovery-arbiter-7845|vscode-extension/src/test/crashRecoveryArbiter.test.ts|7888-test
          agent/support-packet-schema-7860|vscode-extension/src/supportPacket.ts|7879-src
          agent/support-packet-schema-7860|vscode-extension/src/test/supportPacket.test.ts|7879-test
          agent/vscode-migration-runtime-7838|vscode-extension/src/configurationMigrationRuntime.ts|7896-src
          agent/vscode-migration-runtime-7838|vscode-extension/src/test/configurationMigrationRuntime.test.ts|7896-test
          agent/vscode-support-issue-flow-7862|vscode-extension/src/supportCommands.ts|7904-src
          agent/vscode-support-issue-flow-7862|vscode-extension/src/test/supportCommands.test.ts|7904-test
          agent/vscode-disable-generic-mcp-7119|vscode-extension/src/mcpSupport.ts|7911-src
          agent/vscode-disable-generic-mcp-7119|vscode-extension/src/test/mcpSupportDisabled.test.ts|7911-test
          agent/vscode-offline-startup-policy-7852|vscode-extension/src/managedStartupPolicy.ts|7914-src
          agent/vscode-offline-startup-policy-7852|vscode-extension/src/test/managedStartupPolicy.test.ts|7914-test
          agent/vscode-activation-transaction-7854|vscode-extension/src/activationTransaction.ts|7918-src
          agent/vscode-activation-transaction-7854|vscode-extension/src/test/activationTransaction.test.ts|7918-test
          agent/managed-cache-publication-7858|vscode-extension/src/managedCandidateSelection.ts|7919-src
          agent/managed-cache-publication-7858|vscode-extension/src/test/managedCandidateSelection.test.ts|7919-test
          agent/vscode-client-perf-policy-7868|vscode-extension/src/clientPerformancePolicy.ts|7921-src
          agent/vscode-client-perf-policy-7868|vscode-extension/src/test/clientPerformancePolicy.test.ts|7921-test
          EOF

          rm -rf "$scratch"
