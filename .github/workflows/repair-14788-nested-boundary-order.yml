name: "Repair PR 14788 nested boundary order"

on:
  push:
    branches:
      - ops/repair-14788-nested-boundary-order

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/gifted-edison-6rxuro
          path: target
          fetch-depth: 1
          persist-credentials: true

      - name: Verify exact repair subject
        run: test "$(git -C target rev-parse HEAD)" = '08b8d63d78a2c113ddc3916d5b6d1771f9322f2f'

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply bounded repair
        run: python3 control/.github/ops/repair_14788.py

      - name: Format and regenerate governed status
        working-directory: target
        run: |
          set -euo pipefail
          cargo fmt -p perl-parser-core
          cargo run --locked -p xtask --bin compiler-concepts -- --write-status

      - name: Run focused and adjacency proof
        working-directory: target
        run: |
          set -euo pipefail
          cargo test -p perl-parser-core --test hir_lowering_tie_boundary --locked
          cargo test -p perl-parser-core --test pir_tests --locked
          cargo clippy -p perl-parser-core --lib --locked -- -D warnings
          cargo run --locked -p xtask --bin compiler-concepts -- --check
          cargo run --locked -p xtask -- metrics hir-coverage --check
          git diff --check

      - name: Restrict and commit verified repair
        working-directory: target
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | sort)"
          expected=$'contracts/compiler/perl_compiler_concepts.v1.toml\ncrates/perl-parser-core/src/pir/lower.rs\ncrates/perl-parser-core/tests/hir_lowering_tie_boundary.rs\ndocs/project/status/perl_compiler_concepts.md'
          test "$actual" = "$expected"
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add \
            contracts/compiler/perl_compiler_concepts.v1.toml \
            crates/perl-parser-core/src/pir/lower.rs \
            crates/perl-parser-core/tests/hir_lowering_tie_boundary.rs \
            docs/project/status/perl_compiler_concepts.md
          git diff --cached --check
          git commit -m 'fix(pir): order nested tie boundaries before consumers'
          git push origin HEAD:claude/gifted-edison-6rxuro
