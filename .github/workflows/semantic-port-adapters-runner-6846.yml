name: Semantic port adapter rebuild runner 6846

on:
  push:
    branches:
      - agent/semantic-port-adapters-runner-6846

permissions:
  contents: write

jobs:
  rebuild-adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BASE_HEAD: d19c114a7de42488612121fd91264700be0da477
      OLD_CHILD_HEAD: 0e8eb95f3338a9861d3c71034063783a90da87f1
    steps:
      - name: Check out exact adapter candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 0e8eb95f3338a9861d3c71034063783a90da87f1
          path: candidate
          persist-credentials: false

      - name: Check out exact semantic-port base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/semantic-provider-port-6816
          path: work
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct current stacked adapter diff
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/semantic-port-adapters.log"
          test "$(git -C candidate rev-parse HEAD)" = "$OLD_CHILD_HEAD"
          test "$(git -C work rev-parse HEAD)" = "$BASE_HEAD"

          cp candidate/.changes/unreleased/product-6846-Added-210342.yaml \
            work/.changes/unreleased/product-6846-Added-210342.yaml
          cp candidate/crates/perl-lsp-rs-core/src/providers/semantic_port_adapters.rs \
            work/crates/perl-lsp-rs-core/src/providers/semantic_port_adapters.rs
          cp candidate/crates/perl-lsp-rs-core/tests/semantic_port_adapters.rs \
            work/crates/perl-lsp-rs-core/tests/semantic_port_adapters.rs

          python - <<'PY'
          from pathlib import Path

          path = Path('work/crates/perl-lsp-rs-core/src/providers/mod.rs')
          text = path.read_text(encoding='utf-8')
          declaration = 'pub mod semantic_port;\n'
          reexport = 'pub use semantic_port::*;\n'
          if text.count(declaration) != 1:
              raise SystemExit(f'semantic_port declaration anchor count: {text.count(declaration)}')
          if text.count(reexport) != 1:
              raise SystemExit(f'semantic_port re-export anchor count: {text.count(reexport)}')
          text = text.replace(
              declaration,
              declaration + 'pub mod semantic_port_adapters;\n',
          )
          text = text.replace(
              reexport,
              reexport + 'pub use semantic_port_adapters::*;\n',
          )
          path.write_text(text, encoding='utf-8')
          PY

          git -C work add \
            .changes/unreleased/product-6846-Added-210342.yaml \
            crates/perl-lsp-rs-core/src/providers/mod.rs \
            crates/perl-lsp-rs-core/src/providers/semantic_port_adapters.rs \
            crates/perl-lsp-rs-core/tests/semantic_port_adapters.rs

          printf '%s\n' \
            .changes/unreleased/product-6846-Added-210342.yaml \
            crates/perl-lsp-rs-core/src/providers/mod.rs \
            crates/perl-lsp-rs-core/src/providers/semantic_port_adapters.rs \
            crates/perl-lsp-rs-core/tests/semantic_port_adapters.rs \
            | sort > "$RUNNER_TEMP/expected-adapter-paths"
          git -C work diff --cached --name-only | sort > "$RUNNER_TEMP/actual-adapter-paths"
          diff -u "$RUNNER_TEMP/expected-adapter-paths" "$RUNNER_TEMP/actual-adapter-paths"

          printf '%s\n' \
            $'9\t0\t.changes/unreleased/product-6846-Added-210342.yaml' \
            $'2\t0\tcrates/perl-lsp-rs-core/src/providers/mod.rs' \
            $'1313\t0\tcrates/perl-lsp-rs-core/src/providers/semantic_port_adapters.rs' \
            $'415\t0\tcrates/perl-lsp-rs-core/tests/semantic_port_adapters.rs' \
            | sort > "$RUNNER_TEMP/expected-adapter-numstat"
          git -C work diff --cached --numstat | sort > "$RUNNER_TEMP/actual-adapter-numstat"
          diff -u "$RUNNER_TEMP/expected-adapter-numstat" "$RUNNER_TEMP/actual-adapter-numstat"
          git -C work diff --cached --check

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Format adapter rebuild
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          set -o pipefail
          cargo +1.95.0 fmt --all 2>&1 | tee -a "$RUNNER_TEMP/semantic-port-adapters.log"
          unexpected_paths="$(git status --short | awk '{print $2}' | grep -Ev '^(.changes/unreleased/product-6846-Added-210342.yaml|crates/perl-lsp-rs-core/src/providers/mod.rs|crates/perl-lsp-rs-core/src/providers/semantic_port_adapters.rs|crates/perl-lsp-rs-core/tests/semantic_port_adapters.rs)$' || true)"
          test -z "$unexpected_paths"
          git add \
            .changes/unreleased/product-6846-Added-210342.yaml \
            crates/perl-lsp-rs-core/src/providers/mod.rs \
            crates/perl-lsp-rs-core/src/providers/semantic_port_adapters.rs \
            crates/perl-lsp-rs-core/tests/semantic_port_adapters.rs
          test -z "$(git diff --name-only)"
          cargo +1.95.0 fmt --all -- --check 2>&1 | tee -a "$RUNNER_TEMP/semantic-port-adapters.log"
          git diff --cached --check

      - name: Compile adapter targets
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          set -o pipefail
          cargo +1.95.0 check --locked -p perl-lsp-rs-core --all-targets 2>&1 | tee -a "$RUNNER_TEMP/semantic-port-adapters.log"

      - name: Lint adapter targets
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          set -o pipefail
          cargo +1.95.0 clippy --locked -p perl-lsp-rs-core --all-targets -- -D warnings 2>&1 | tee -a "$RUNNER_TEMP/semantic-port-adapters.log"

      - name: Test adapter public contract
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          set -o pipefail
          cargo +1.95.0 test --locked -p perl-lsp-rs-core --test semantic_port_adapters 2>&1 | tee -a "$RUNNER_TEMP/semantic-port-adapters.log"
          cargo +1.95.0 test --locked -p perl-lsp-rs-core --all-targets semantic_port 2>&1 | tee -a "$RUNNER_TEMP/semantic-port-adapters.log"

      - name: Verify adapter file policy
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          set -o pipefail
          cargo +1.95.0 run --locked -p xtask -- check-file-policy 2>&1 | tee -a "$RUNNER_TEMP/semantic-port-adapters.log"

      - name: Upload adapter transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-port-adapters-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semantic-port-adapters.log
          if-no-files-found: warn
          retention-days: 7

      - name: Rewrite child branch onto the verified base
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/agent/semantic-provider-adapters-6817 | awk '{print $1}')"
          test "$remote_head" = "$OLD_CHILD_HEAD"
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "feat(semantic-port): adapt current fact producers"
          test "$(git rev-parse HEAD^)" = "$BASE_HEAD"
          test -z "$(git status --porcelain)"
          git push \
            --force-with-lease=refs/heads/agent/semantic-provider-adapters-6817:$OLD_CHILD_HEAD \
            origin HEAD:agent/semantic-provider-adapters-6817
