name: EM CI Routed Rust

on:
  merge_group:
    types: [checks_requested]

permissions:
  actions: read
  checks: read
  contents: read

# One bounded hosted qualification per actual G. Native queue cancellation may
# stop obsolete groups; a missing/cancelled producer never supplies green proof.
concurrency:
  group: em-ci-routed-rust-${{ github.repository }}-${{ github.event.merge_group.head_sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: "1.95.0"

jobs:
  rust-small-github:
    name: Perl LSP Rust Small on GitHub Hosted
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      subject_sha: ${{ steps.subject.outputs.subject_sha }}
      run_id: ${{ steps.subject.outputs.run_id }}
      run_attempt: ${{ steps.subject.outputs.run_attempt }}
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.merge_group.head_sha }}

      - name: Verify merge-group source
        id: subject
        shell: bash
        env:
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${MERGE_GROUP_SHA:-}" =~ ^[0-9a-f]{40}$ ]] ||
            [ "$MERGE_GROUP_SHA" != "$GITHUB_SHA" ] ||
            [ "$(git rev-parse HEAD)" != "$MERGE_GROUP_SHA" ]; then
            echo '::error::Rust Small checkout is not the exact native merge-group G: NOT_PROVEN.'
            exit 1
          fi
          if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]*$ ]] ||
            [[ ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Rust Small producer has no valid run/attempt identity: NOT_PROVEN.'
            exit 1
          fi
          {
            echo "subject_sha=$MERGE_GROUP_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable (master)
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: perl-lsp-rust-small-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Rust small lane
        shell: bash
        run: |
          set -euo pipefail
          # Pinned lane literal: scripts/ci/test_rustfmt_required_workflow.py
          # requires workspace-wide fmt here per route (#9127/#12320).
          cargo fmt --all -- --check
          # Keep the canonical semantic steps and typed receipt owner (#8407).
          # The route contract pins this exact invocation; no second proof list.
          cargo run -p xtask --profile agent --locked -- rust-small-proof

  rust-small-result:
    name: Perl LSP Rust Small Result
    needs: [rust-small-github]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout rustfmt prevention contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.merge_group.head_sha }}

      - name: Prove rustfmt prevention contract
        shell: bash
        run: |
          set -euo pipefail
          # Structural + producer tests for #9127 residual and #9959
          # meta-fmt retirement: a silent revert of the #12320 cargo fmt
          # --all insertions, reintroduced changed-file narrowing, verbose-header
          # misclassification, or a second unowned hosted formatter producer
          # must fail this required check. Missing or cancelled G proof stays
          # blocking; the executable result controls retain that distinction.
          python3 -m unittest \
            scripts/ci/test_rustfmt_check.py \
            scripts/ci/test_rustfmt_required_workflow.py \
            scripts/ci/test_rust_small_route_contract.py \
            scripts/ci/test_hosted_formatter_producers.py \
            scripts/ci/test_rust_small_probe_gate.py \
            scripts/ci/test_main_red_refusal.py \
            scripts/ci/test_rust_small_supersession.py

      - name: Probe main-red refusal
        if: >-
          github.event_name == 'merge_group' &&
          needs.rust-small-github.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          # pull_request executes ci.yml from the synthetic merge tree
          # (github.sha), not the PR head. A base-only ci.yml advancement
          # on main must remain comparable. merge_group uses the
          # merge-group head. Never fall back to CANDIDATE_SHA here.
          EFFECTIVE_WORKFLOW_TREE: ${{ github.event_name == 'pull_request' && github.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
        run: |
          set -u
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT

          api_ok=true
          TRUSTED_SCRIPT_AVAILABLE=false
          read_main_sha() {
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha' 2>"$probe_dir/main-ref.err"
          }
          read_workflow_sha() {
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/contents/.github/workflows/ci.yml?ref=$1" \
              --jq '.sha' 2>"$probe_dir/workflow-$2.err"
          }

          # Read the branch immediately before and immediately after the
          # check-run lookup. A main movement makes all observations stale;
          # the classifier deliberately turns that into a warning.
          MAIN_SHA_BEFORE="$(read_main_sha)" || {
            MAIN_SHA_BEFORE=""
            api_ok=false
          }
          MAIN_WORKFLOW_SHA="$(read_workflow_sha "${MAIN_SHA_BEFORE:-}" main)" || {
            MAIN_WORKFLOW_SHA=""
            api_ok=false
          }
          if [ -n "${CANDIDATE_SHA:-}" ]; then
            trusted_response="$probe_dir/trusted-script.json"
            TRUSTED_SCRIPT="$probe_dir/main_red_refusal.py"
            if gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/contents/scripts/ci/main_red_refusal.py?ref=${MAIN_SHA_BEFORE}" \
              >"$trusted_response" 2>"$probe_dir/trusted-script.err" &&
              jq -e '.content | type == "string"' "$trusted_response" >/dev/null &&
              jq -r '.content' "$trusted_response" | tr -d '\n' | base64 --decode >"$TRUSTED_SCRIPT"
            then
              TRUSTED_SCRIPT_AVAILABLE=true
            else
              echo "::warning::trusted main-red classifier is not available at ${MAIN_SHA_BEFORE}; refusal probe is non-blocking during bootstrap"
            fi
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/commits/${MAIN_SHA_BEFORE}/check-runs?per_page=100" \
              >"$probe_dir/main-runs.json" 2>"$probe_dir/main-runs.err" || {
                : >"$probe_dir/main-runs.json"
                api_ok=false
              }
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${MAIN_SHA_BEFORE}&per_page=100" \
              >"$probe_dir/main-workflow-runs.json" 2>"$probe_dir/main-workflow-runs.err" || {
                : >"$probe_dir/main-workflow-runs.json"
                api_ok=false
              }
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?per_page=100" \
              >"$probe_dir/candidate-runs.json" 2>"$probe_dir/candidate-runs.err" || {
                : >"$probe_dir/candidate-runs.json"
                api_ok=false
              }
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${CANDIDATE_SHA}&per_page=100" \
              >"$probe_dir/candidate-workflow-runs.json" 2>"$probe_dir/candidate-workflow-runs.err" || {
                : >"$probe_dir/candidate-workflow-runs.json"
                api_ok=false
              }
            CANDIDATE_WORKFLOW_SHA=""
            if [ -n "${EFFECTIVE_WORKFLOW_TREE:-}" ]; then
              CANDIDATE_WORKFLOW_SHA="$(read_workflow_sha "$EFFECTIVE_WORKFLOW_TREE" candidate)" || {
                CANDIDATE_WORKFLOW_SHA=""
                api_ok=false
              }
            fi
          else
            echo "::warning::${EVENT_NAME} has no PR/merge-group subject SHA; main-red refusal probe is non-applicable"
            : >"$probe_dir/main-runs.json"
            : >"$probe_dir/candidate-runs.json"
            : >"$probe_dir/main-workflow-runs.json"
            : >"$probe_dir/candidate-workflow-runs.json"
            MAIN_WORKFLOW_SHA=""
            CANDIDATE_WORKFLOW_SHA=""
            TRUSTED_SCRIPT=""
          fi
          MAIN_SHA_AFTER="$(read_main_sha)" || {
            MAIN_SHA_AFTER=""
            api_ok=false
          }

          if [ "$api_ok" = "false" ]; then
            echo "::warning::main-red refusal API probe was incomplete; treating probe data as non-blocking"
          fi
          run_refusal() {
            if [ "$TRUSTED_SCRIPT_AVAILABLE" != "true" ]; then
              return 0
            fi
            python3 "$TRUSTED_SCRIPT" \
              --main-runs "$probe_dir/main-runs.json" \
              --candidate-runs "$probe_dir/candidate-runs.json" \
              --main-workflow-runs "$probe_dir/main-workflow-runs.json" \
              --candidate-workflow-runs "$probe_dir/candidate-workflow-runs.json" \
              --main-sha-before "${MAIN_SHA_BEFORE:-}" \
              --main-sha-after "${MAIN_SHA_AFTER:-}" \
              --candidate-sha "${CANDIDATE_SHA:-}" \
              --main-workflow-sha "${MAIN_WORKFLOW_SHA:-}" \
              --candidate-workflow-sha "${CANDIDATE_WORKFLOW_SHA:-}" \
              "$@"
          }

          set +e
          run_refusal
          refusal_status=$?
          set -u
          poll_attempt=0
          while [ "$refusal_status" -eq 2 ] && [ "$poll_attempt" -lt 50 ]; do
            poll_attempt=$((poll_attempt + 1))
            echo "::notice::main-red refusal is waiting for candidate shard evidence (poll ${poll_attempt}/50)"
            sleep 30
            MAIN_SHA_AFTER="$(read_main_sha)" || {
              MAIN_SHA_AFTER=""
            }
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?per_page=100" \
              >"$probe_dir/candidate-runs.json" 2>"$probe_dir/candidate-runs.err" || {
                : >"$probe_dir/candidate-runs.json"
              }
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${CANDIDATE_SHA}&per_page=100" \
              >"$probe_dir/candidate-workflow-runs.json" 2>"$probe_dir/candidate-workflow-runs.err" || {
                : >"$probe_dir/candidate-workflow-runs.json"
              }
            CANDIDATE_WORKFLOW_SHA=""
            if [ -n "${EFFECTIVE_WORKFLOW_TREE:-}" ]; then
              CANDIDATE_WORKFLOW_SHA="$(read_workflow_sha "$EFFECTIVE_WORKFLOW_TREE" candidate)" || {
                CANDIDATE_WORKFLOW_SHA=""
              }
            fi
            run_refusal
            refusal_status=$?
          done
          if [ "$refusal_status" -eq 2 ]; then
            echo "::warning::candidate shard evidence did not become terminal before the bounded wait; applying final fail-closed refusal"
            run_refusal --final
            refusal_status=$?
          fi
          if [ "$refusal_status" -eq 1 ]; then
            exit 1
          fi

      - name: Evaluate routed result
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
          PROOF_SHA: ${{ needs.rust-small-github.outputs.subject_sha }}
          PROOF_RUN_ID: ${{ needs.rust-small-github.outputs.run_id }}
          PROOF_RUN_ATTEMPT: ${{ needs.rust-small-github.outputs.run_attempt }}
          GITHUB_RESULT: ${{ needs.rust-small-github.result }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME:-}" != merge_group ] ||
            [[ ! "${MERGE_GROUP_SHA:-}" =~ ^[0-9a-f]{40}$ ]] ||
            [ "$MERGE_GROUP_SHA" != "${GITHUB_SHA:-}" ]; then
            echo '::error::Rust Small proof is not bound to this native merge-group G: NOT_PROVEN.'
            exit 1
          fi
          if [ "${GITHUB_RESULT:-}" = cancelled ]; then
            echo 'RUST_SMALL_GATE_VERDICT=cancelled-no-verdict'
            echo '::error::Rust Small lane cancelled: no proof for this G. This is NOT a test failure.'
            exit 1
          fi
          if [ "${GITHUB_RESULT:-}" != success ]; then
            echo "::error::Rust Small hosted proof did not succeed: ${GITHUB_RESULT:-missing}. NOT_PROVEN."
            exit 1
          fi
          if [ "$MERGE_GROUP_SHA" != "${PROOF_SHA:-}" ]; then
            echo '::error::Successful Rust Small producer has no exact-G subject: NOT_PROVEN.'
            exit 1
          fi
          # Partial reruns retain outputs from jobs that were not rerun. A
          # prior successful attempt on the same G is not this attempt's proof.
          if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]*$ ]] ||
            [[ ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ]] ||
            [ "$GITHUB_RUN_ID" != "${PROOF_RUN_ID:-}" ] ||
            [ "$GITHUB_RUN_ATTEMPT" != "${PROOF_RUN_ATTEMPT:-}" ]; then
            echo '::error::Rust Small producer is not from this exact run/attempt: NOT_PROVEN. Rerun the producer with its dependent result.'
            exit 1
          fi
          echo 'Perl LSP Rust Small Result: success'
          echo "- Rust Small: success on native G $MERGE_GROUP_SHA" >> "$GITHUB_STEP_SUMMARY"
