name: Bootstrap issue 6947 implementation

on:
  push:
    branches:
      - agent/remove-false-mcp-alias

permissions:
  contents: write

concurrency:
  group: bootstrap-6947-${{ github.ref }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply implementation
        run: python3 .github/bootstrap/implement-6947.py

      - name: Format
        run: cargo fmt --all

      - name: Focused parser and process tests
        run: |
          cargo test -p perl-lsp-rs-core --test mcp_alias_rejection
          cargo test -p perllsp --test mcp_alias_rejected

      - name: Commit implementation and remove bootstrap files
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm -- .github/workflows/bootstrap-6947.yml .github/bootstrap/implement-6947.py
          git add -- \
            crates/perl-lsp-rs-core/src/runtime/launcher/mod.rs \
            crates/perl-lsp-rs-core/tests/mcp_alias_rejection.rs \
            crates/perllsp/tests/mcp_alias_rejected.rs
          git diff --cached --check
          git commit -m "fix(protocol): retire false --mcp alias (#6947)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
