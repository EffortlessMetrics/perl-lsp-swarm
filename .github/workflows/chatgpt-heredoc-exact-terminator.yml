name: One-shot exact heredoc terminator patch

on:
  push:
    branches:
      - chatgpt/heredoc-exact-terminator
    paths:
      - .github/workflows/chatgpt-heredoc-exact-terminator.yml

permissions:
  contents: write

concurrency:
  group: chatgpt-heredoc-exact-terminator
  cancel-in-progress: false

jobs:
  patch-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/heredoc-exact-terminator
          fetch-depth: 0

      - name: Prove the regression is red on the old implementation
        shell: bash
        run: |
          if grep -Fq \
            'inspection window; pathological indentation or trailing whitespace' \
            crates/perl-lexer/src/lib.rs; then
            set +e
            cargo test -p perl-lexer --test heredoc_terminator_exactness --locked \
              > /tmp/heredoc-red.log 2>&1
            status=$?
            set -e
            cat /tmp/heredoc-red.log
            if [ "$status" -eq 0 ]; then
              echo "new heredoc tests did not discriminate the old implementation" >&2
              exit 1
            fi
          else
            echo "exact-match production fix already present from an earlier queued run"
          fi

      - name: Require exact heredoc terminator matching
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lexer_path = Path("crates/perl-lexer/src/lib.rs")
          lexer = lexer_path.read_text(encoding="utf-8")

          old_comment = (
              "        // A delimiter line is not part of the body budget, but probing it must\n"
              "        // still be bounded. Reuse the body cap as the maximum delimiter-line\n"
              "        // inspection window; pathological indentation or trailing whitespace\n"
              "        // therefore cannot restore an unbounded scan.\n"
          )
          new_comment = (
              "        // A delimiter line is not part of the body budget, but probing it must\n"
              "        // still be bounded. Reuse the body cap as the maximum delimiter-line\n"
              "        // inspection window. `<<~` may indent the label, but Perl requires the\n"
              "        // label itself to be followed immediately by a line ending or EOF.\n"
          )
          old_count = lexer.count(old_comment)
          new_count = lexer.count(new_comment)
          if old_count == 1 and new_count == 0:
              lexer = lexer.replace(old_comment, new_comment, 1)
          elif old_count != 0 or new_count != 1:
              raise SystemExit("heredoc delimiter comment is neither old nor proven-new")

          trailing_space_acceptance = (
              "        while cursor < scan_end && matches!(self.input_bytes[cursor], b' ' | b'\\t') {\n"
              "            cursor += 1;\n"
              "        }\n\n"
          )
          label_assignment = "        cursor = label_end;\n\n"
          target = label_assignment + trailing_space_acceptance
          target_count = lexer.count(target)
          if target_count == 1:
              lexer = lexer.replace(target, label_assignment, 1)
          elif target_count != 0:
              raise SystemExit("ambiguous trailing-space terminator scans")
          lexer_path.write_text(lexer, encoding="utf-8")

          edge_path = Path("crates/perl-lexer/tests/edge_case_tests.rs")
          edge = edge_path.read_text(encoding="utf-8")
          old_name = "fn heredoc_with_trailing_whitespace_on_terminator() -> R"
          new_name = "fn heredoc_trailing_whitespace_near_miss_is_unterminated() -> R"
          old_edge = (
              "#[test]\n"
              "fn heredoc_with_trailing_whitespace_on_terminator() -> R {\n"
              "    // Perl allows trailing whitespace on the terminator line\n"
              "    let input = \"<<EOF\\nhello\\nEOF   \\n\";\n"
              "    assert_terminates(input);\n"
              "    let sig = significant(input);\n"
              "    let has_heredoc = sig.iter().any(|t| matches!(t.token_type, TokenType::HeredocStart));\n"
              "    assert!(has_heredoc, \"expected HeredocStart\");\n"
              "    Ok(())\n"
              "}\n"
          )
          new_edge = (
              "#[test]\n"
              "fn heredoc_trailing_whitespace_near_miss_is_unterminated() -> R {\n"
              "    let input = \"<<EOF\\nhello\\nEOF   \\n\";\n"
              "    assert_terminates(input);\n"
              "    let toks = tokens(input);\n"
              "    assert!(\n"
              "        toks.iter().any(|t| matches!(t.token_type, TokenType::UnknownRest)),\n"
              "        \"expected UnknownRest when heredoc label is followed by trailing whitespace\"\n"
              "    );\n"
              "    Ok(())\n"
              "}\n"
          )
          old_name_count = edge.count(old_name)
          new_name_count = edge.count(new_name)
          if old_name_count == 1 and new_name_count == 0:
              if edge.count(old_edge) != 1:
                  raise SystemExit("obsolete heredoc edge test shape drifted")
              edge = edge.replace(old_edge, new_edge, 1)
          elif old_name_count != 0 or new_name_count != 1:
              raise SystemExit("heredoc edge test is neither old nor proven-new")
          edge_path.write_text(edge, encoding="utf-8")
          PY

      - name: Format and run focused proof
        shell: bash
        run: |
          cargo fmt -p perl-lexer
          unexpected="$({ git diff --name-only; git ls-files --others --exclude-standard; } \
            | sort -u \
            | grep -Ev '^(crates/perl-lexer/src/lib.rs|crates/perl-lexer/tests/edge_case_tests.rs|crates/perl-lexer/tests/heredoc_terminator_exactness.rs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "formatter changed files outside the candidate allowlist:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          cargo fmt -p perl-lexer -- --check
          cargo test -p perl-lexer --test heredoc_terminator_exactness --locked
          cargo test -p perl-lexer --test edge_case_tests --locked
          cargo clippy -p perl-lexer --lib --locked -- -D warnings
          git diff --check

      - name: Run affected package proof
        shell: bash
        run: cargo test -p perl-lexer --all-targets --locked

      - name: Publish the proven candidate without workflow residue
        shell: bash
        run: |
          rm -f .github/workflows/chatgpt-heredoc-exact-terminator.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          unexpected="$(git diff --cached --name-only \
            | grep -Ev '^(\.github/workflows/chatgpt-heredoc-exact-terminator.yml|crates/perl-lexer/src/lib.rs|crates/perl-lexer/tests/edge_case_tests.rs|crates/perl-lexer/tests/heredoc_terminator_exactness.rs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "candidate contains files outside the publication allowlist:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "branch already contains the proven candidate"
            exit 0
          fi
          if git diff --cached --name-only | grep -qx 'crates/perl-lexer/src/lib.rs'; then
            message='fix(lexer): require exact heredoc terminators'
          else
            message='test(lexer): correct heredoc terminator edge case'
          fi
          git commit -m "$message"
          git push origin HEAD:chatgpt/heredoc-exact-terminator
