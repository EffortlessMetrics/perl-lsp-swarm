name: Temporary Dancer2 provider contract provenance repair

on:
  push:
    branches: ["fix/13089-dancer2-dsl-keywords"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/13089-dancer2-dsl-keywords
          fetch-depth: 1

      - name: Propagate activation-selected contract receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          diagnostics_path = Path(
              "crates/perl-lsp-rs-core/src/providers/dancer2/diagnostics.rs"
          )
          diagnostics = diagnostics_path.read_text()
          diagnostics = replace_once(
              diagnostics,
              """use perl_semantic_facts::framework_adapters::dancer2::{
              DANCER2_DSL_CONTRACT_VERSION, Dancer2KeywordState, DslKeywordScope,
          };
          """,
              """use perl_semantic_facts::framework_adapters::dancer2::{
              Dancer2KeywordState, DslKeywordScope,
          };
          """,
              "diagnostics import",
          )
          diagnostics = replace_once(
              diagnostics,
              """        let package = activation.package.as_str();

                  // (1) excluded route keyword used by a declaration.
          """,
              """        let package = activation.package.as_str();
                  let dsl_contract_version = activation.facts.dsl_contract_version;

                  // (1) excluded route keyword used by a declaration.
          """,
              "diagnostics activation contract",
          )
          constant = "{DANCER2_DSL_CONTRACT_VERSION}"
          if diagnostics.count(constant) != 2:
              raise SystemExit(
                  "diagnostics receipt uses: expected 2, "
                  f"found {diagnostics.count(constant)}"
              )
          diagnostics = diagnostics.replace(constant, "{dsl_contract_version}")

          diagnostics_test = r'''

              #[test]
              fn dancer2_1_0_diagnostic_reports_activation_contract() -> Result<(), String> {
                  let source = "use Dancer2;\nmy $x = params;";
                  let mut parser = Parser::new(source);
                  let ast = parser
                      .parse()
                      .map_err(|error| format!("fixture must parse: {error:?}"))?;
                  let module = RuntimeDancer2Module::new("lib/Dancer2.pm", "1.0.0");
                  let activations = file_activations(
                      &ast,
                      FileId(1),
                      Some(&module),
                      &SourceGeneration::known("g1"),
                  );
                  let facts = canonical_file_facts(&ast, FileId(1), &activations);
                  let diagnostics = bounded_diagnostics(&ast, &activations, &facts);
                  let diagnostic = diagnostics
                      .first()
                      .ok_or_else(|| "expected handler-only diagnostic".to_string())?;
                  assert!(diagnostic.message.contains("dancer2-dsl.1-0.v3"));
                  assert!(!diagnostic.message.contains("dancer2-dsl.1-1.v3"));
                  Ok(())
              }
          '''
          if diagnostics_test.strip() in diagnostics:
              raise SystemExit("diagnostics version test already present")
          if not diagnostics.endswith("}\n"):
              raise SystemExit("diagnostics test module does not end with one closing brace")
          diagnostics = diagnostics[:-2] + diagnostics_test + "}\n"
          diagnostics_path.write_text(diagnostics)

          hover_path = Path("crates/perl-lsp-rs-core/src/providers/dancer2/hover.rs")
          hover = hover_path.read_text()
          hover = replace_once(
              hover,
              """use perl_semantic_facts::framework_adapters::dancer2::{
              DANCER2_DSL_CONTRACT_VERSION, Dancer2KeywordState, DslKeywordScope,
          };
          """,
              """use perl_semantic_facts::framework_adapters::dancer2::{
              Dancer2KeywordState, DslKeywordScope,
          };
          """,
              "hover import",
          )
          hover = replace_once(
              hover,
              """    let version = exact_version(&activation.facts)?;

              if let Some(hook) = facts.hook_at(offset) {
                  return Some(hook_hover(hook, &version));
              }
              if let Some(route) = facts.route_at(offset) {
                  return Some(route_hover(route, facts, &version));
              }
              keyword_hover(&activation.facts, ast, offset, &version, package)
          """,
              """    let version = exact_version(&activation.facts)?;
              let dsl_contract_version = activation.facts.dsl_contract_version;

              if let Some(hook) = facts.hook_at(offset) {
                  return Some(hook_hover(hook, &version));
              }
              if let Some(route) = facts.route_at(offset) {
                  return Some(route_hover(route, facts, &version, dsl_contract_version));
              }
              keyword_hover(
                  &activation.facts,
                  ast,
                  offset,
                  &version,
                  dsl_contract_version,
                  package,
              )
          """,
              "hover dispatch contract",
          )
          hover = replace_once(
              hover,
              """fn route_hover(
              fact: &RouteFact,
              facts: &CanonicalDancer2FileFacts,
              version: &str,
          ) -> RouteHoverProjection {
          """,
              """fn route_hover(
              fact: &RouteFact,
              facts: &CanonicalDancer2FileFacts,
              version: &str,
              dsl_contract_version: &str,
          ) -> RouteHoverProjection {
          """,
              "route hover contract parameter",
          )
          hover = replace_once(
              hover,
              """        DANCER2_DSL_CONTRACT_VERSION
              ));
          """,
              """        dsl_contract_version
              ));
          """,
              "route hover receipt",
          )
          hover = replace_once(
              hover,
              """    version: &str,
              package: &str,
          ) -> Option<RouteHoverProjection> {
          """,
              """    version: &str,
              dsl_contract_version: &str,
              package: &str,
          ) -> Option<RouteHoverProjection> {
          """,
              "keyword hover contract parameter",
          )
          hover = replace_once(
              hover,
              "`{DANCER2_DSL_CONTRACT_VERSION}`",
              "`{dsl_contract_version}`",
              "keyword hover receipt",
          )

          hover_test = r'''

              #[test]
              fn dancer2_1_0_hover_reports_activation_contract() {
                  let source = "use Dancer2;\nget '/x' => sub { uri_for '/x'; };";
                  let mut parser = Parser::new(source);
                  let ast = must_with(parser.parse(), "fixture must parse");
                  let module = RuntimeDancer2Module::new("lib/Dancer2.pm", "1.0.0");
                  let activations = file_activations(
                      &ast,
                      FileId(1),
                      Some(&module),
                      &SourceGeneration::known("g1"),
                  );
                  let facts = canonical_file_facts(&ast, FileId(1), &activations);

                  for (needle, expected_projection) in
                      [("/x", "route"), ("uri_for", "keyword")]
                  {
                      let offset = must_some_with(source.rfind(needle), "hover offset");
                      let projection = must_some_with(
                          hover_projection_at(&activations, &facts, &ast, "main", offset),
                          "Dancer2 hover",
                      );
                      let content = match projection {
                          RouteHoverProjection::Route { content, .. }
                          | RouteHoverProjection::Keyword { content } => content,
                          RouteHoverProjection::Hook { .. } => {
                              assert!(false, "expected {expected_projection} hover");
                              String::new()
                          }
                      };
                      assert!(content.contains("dancer2-dsl.1-0.v3"), "{content}");
                      assert!(!content.contains("dancer2-dsl.1-1.v3"), "{content}");
                  }
              }
          '''
          if hover_test.strip() in hover:
              raise SystemExit("hover version test already present")
          if not hover.endswith("}\n"):
              raise SystemExit("hover test module does not end with one closing brace")
          hover = hover[:-2] + hover_test + "}\n"
          hover_path.write_text(hover)
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Run Dancer2 provider proof
        run: cargo test --locked -p perl-lsp-rs-core providers::dancer2

      - name: Run strict provider lint proof
        run: cargo clippy --locked -p perl-lsp-rs-core --lib --tests -- -D warnings

      - name: Commit verified provider repair and remove executor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-dancer2-13089-provider-provenance.yml
          python3 <<'PY'
          import subprocess

          expected = {
              ".github/workflows/temp-dancer2-13089-provider-provenance.yml",
              "crates/perl-lsp-rs-core/src/providers/dancer2/diagnostics.rs",
              "crates/perl-lsp-rs-core/src/providers/dancer2/hover.rs",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if changed != expected:
              raise SystemExit(
                  "unexpected changed-file set:\n"
                  f"expected={sorted(expected)}\nobserved={sorted(changed)}"
              )
          PY
          git diff --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            .github/workflows/temp-dancer2-13089-provider-provenance.yml \
            crates/perl-lsp-rs-core/src/providers/dancer2/diagnostics.rs \
            crates/perl-lsp-rs-core/src/providers/dancer2/hover.rs
          git commit -m "fix(dancer2): propagate versioned DSL receipts (#13089)"
          git push origin HEAD:fix/13089-dancer2-dsl-keywords
