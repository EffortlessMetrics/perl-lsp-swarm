name: MiniMax Agent Compile Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/minimax-agent-compile-check.yml'

permissions:
  contents: read

concurrency:
  group: minimax-agent-baseline-publisher-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish-baseline-blob:
    if: >-
      github.repository == 'EffortlessMetrics/perl-lsp-swarm' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/gh-aw-minimax-canary' &&
      github.event.pull_request.user.login == 'EffortlessSteven'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified baseline artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:?}/verified-baseline"
          mkdir -p "$out"
          gh run download 35082783199 \
            --repo "$REPOSITORY" \
            --name minimax-agent-baseline-c27e14fbb1f230e8da9b94ba7f689c28c75e868b \
            --dir "$out"
          test -s "$out/workflow-security-baseline.json"
          test -s "$out/workflow-security-report.json"
          python3 - "$out/workflow-security-baseline.json" "$out/workflow-security-report.json" <<'PY'
          import json
          import sys

          baseline_path, report_path = sys.argv[1:]
          with open(baseline_path, encoding="utf-8") as handle:
              baseline = json.load(handle)
          with open(report_path, encoding="utf-8") as handle:
              report = json.load(handle)
          findings = baseline.get("findings", baseline.get("allowed_findings", []))
          if len(findings) != 87:
              raise SystemExit(f"expected 87 findings, found {len(findings)}")
          if any(
              item.get("path") == ".github/workflows/minimax-agent-compile-check.yml"
              for item in findings
          ):
              raise SystemExit("temporary compile-check finding remains in final baseline")
          summary = report.get("summary", report)
          for key, expected in {
              "current_findings": 87,
              "existing_findings": 87,
              "new_findings": 0,
              "resolved_findings": 0,
          }.items():
              value = summary.get(key)
              if value is not None and value != expected:
                  raise SystemExit(f"unexpected {key}: {value}")
          print("verified_findings=87")
          PY

      - name: Upload exact baseline as inert Git blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          path="${RUNNER_TEMP:?}/verified-baseline/workflow-security-baseline.json"
          sha256sum "$path"
          blob_sha="$({ jq -Rs '{content: ., encoding: "utf-8"}' "$path"; } | \
            gh api --method POST "repos/${REPOSITORY}/git/blobs" --input - --jq '.sha')"
          printf 'BASELINE_BLOB_SHA=%s\n' "$blob_sha"
          printf '%s\n' "$blob_sha" > "${RUNNER_TEMP:?}/verified-baseline/blob-sha.txt"

      - name: Upload baseline publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minimax-agent-baseline-blob-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/verified-baseline/blob-sha.txt
            ${{ runner.temp }}/verified-baseline/workflow-security-report.json
          if-no-files-found: error
          retention-days: 1
