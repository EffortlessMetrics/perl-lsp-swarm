name: MiniMax Agent Compile Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/minimax-coding-agent.md'
      - '.github/workflows/minimax-coding-agent.lock.yml'
      - '.github/workflows/minimax-agent-compile-check.yml'
      - '.github/aw/actions-lock.json'
      - '.gitattributes'
      - '.github/dependabot.yml'
      - 'scripts/ci/harden_gh_aw_ratchet.py'
      - 'scripts/ci/workflow_security_ratchet.py'
      - 'scripts/ci/test_workflow_security_ratchet.py'
      - '.ci/workflow-security-baseline.json'

permissions:
  contents: read

concurrency:
  group: minimax-agent-compile-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  compile-check:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'EffortlessMetrics/perl-lsp-swarm' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/gh-aw-minimax-canary' &&
      github.event.pull_request.user.login == 'EffortlessSteven'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned gh-aw compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler="${RUNNER_TEMP:?}/gh-aw-v0.88.7"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 180 \
            https://github.com/github/gh-aw/releases/download/v0.88.7/linux-amd64 \
            --output "$compiler"
          printf '%s  %s\n' \
            37faaaa95f622b910568bc878452f6036f01e951380fdfc41441944a95da43bf \
            "$compiler" | sha256sum --check --status
          chmod 0755 "$compiler"
          "$compiler" --version
          echo "GH_AW_COMPILER=$compiler" >> "$GITHUB_ENV"

      - name: Verify generated authority is current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$GH_AW_COMPILER" compile minimax-coding-agent \
            --strict --verbose --approve --no-check-update
          git diff --exit-code -- \
            .github/workflows/minimax-coding-agent.lock.yml \
            .github/aw/actions-lock.json \
            .gitattributes \
            .github/dependabot.yml

      - name: Harden exact-lock ratchet and regenerate baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/workflow_security_ratchet.py')
          text = path.read_text(encoding='utf-8')
          if 'GH_AW_LOCK_FILE_DIGESTS' not in text:
              needle = (
                  'GH_AW_CONFIGURE_GIT_COMMAND = '
                  'r\'bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"\'\n'
              )
              addition = (
                  '# Normalized-LF digest of the complete reviewed strict compiler output.\n'
                  '# The persisted-credential exception applies only while the entire lock file\n'
                  '# remains byte-for-byte equivalent after splitlines() normalization.\n'
                  'GH_AW_LOCK_FILE_DIGESTS = {\n'
                  '    ".github/workflows/minimax-coding-agent.lock.yml": '
                  '"e2a2042de450de733abd8b07853fceb5af0167920fde149042c146da185932f1",\n'
                  '}\n'
              )
              if text.count(needle) != 1:
                  raise SystemExit('expected one gh-aw credential-command anchor')
              path.write_text(text.replace(needle, needle + addition, 1), encoding='utf-8')
          PY
          python3 scripts/ci/harden_gh_aw_ratchet.py
          python3 -m py_compile scripts/ci/workflow_security_ratchet.py
          python3 -m unittest scripts/ci/test_workflow_security_ratchet.py
          python3 scripts/ci/workflow_security_ratchet.py baseline \
            --root . \
            --output .ci/workflow-security-baseline.json
          python3 scripts/ci/workflow_security_ratchet.py validate-baseline \
            --root . \
            --baseline .ci/workflow-security-baseline.json \
            --baseline-root . \
            --report /tmp/workflow-security-exact-lock.json

      - name: Commit hardened ratchet authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add \
            scripts/ci/workflow_security_ratchet.py \
            scripts/ci/test_workflow_security_ratchet.py \
            .ci/workflow-security-baseline.json
          git add -u scripts/ci/harden_gh_aw_ratchet.py
          git diff --cached --check
          git config user.name 'EffortlessSteven'
          git config user.email '15812269+EffortlessSteven@users.noreply.github.com'
          git commit -m 'fix(ci): bind gh-aw publisher exception to exact lock'
          gh auth setup-git
          git push origin "HEAD:${HEAD_REF}"
