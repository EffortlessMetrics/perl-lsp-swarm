name: MiniMax Agent Compile Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/minimax-coding-agent.md'
      - '.github/workflows/minimax-coding-agent.lock.yml'
      - '.github/workflows/minimax-agent-compile-check.yml'
      - '.github/aw/actions-lock.json'
      - '.gitattributes'
      - '.github/dependabot.yml'
      - '.ci/workflow-security-baseline.json'
      - '.github/workflows/workflow-security-ratchet.yml'
      - 'scripts/ci/workflow_security_ratchet.py'
      - 'scripts/ci/test_workflow_security_ratchet.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimax-agent-compile-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  compile-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned gh-aw compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler="${RUNNER_TEMP:?}/gh-aw-v0.88.7"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 180 \
            https://github.com/github/gh-aw/releases/download/v0.88.7/linux-amd64 \
            --output "$compiler"
          printf '%s  %s\n' \
            37faaaa95f622b910568bc878452f6036f01e951380fdfc41441944a95da43bf \
            "$compiler" | sha256sum --check --status
          chmod 0755 "$compiler"
          "$compiler" --version
          echo "GH_AW_COMPILER=$compiler" >> "$GITHUB_ENV"

      - name: Verify generated authority is current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$GH_AW_COMPILER" compile minimax-coding-agent \
            --strict --verbose --approve --no-check-update
          git diff --exit-code -- \
            .github/workflows/minimax-coding-agent.lock.yml \
            .github/aw/actions-lock.json \
            .gitattributes \
            .github/dependabot.yml

      - name: Generate exact canonical workflow-security baseline
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP:?}/workflow-security-report.json"
          python3 -m py_compile scripts/ci/workflow_security_ratchet.py
          python3 -m unittest scripts/ci/test_workflow_security_ratchet.py
          python3 scripts/ci/workflow_security_ratchet.py baseline \
            --root . \
            --output .ci/workflow-security-baseline.json
          python3 scripts/ci/workflow_security_ratchet.py validate-baseline \
            --root . \
            --baseline .ci/workflow-security-baseline.json \
            --baseline-root . \
            --report "$report"
          python3 - .ci/workflow-security-baseline.json <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          findings = payload.get("findings", payload.get("allowed_findings", []))
          compile_check_findings = [
              item for item in findings
              if item.get("path") == ".github/workflows/minimax-agent-compile-check.yml"
          ]
          if compile_check_findings:
              raise SystemExit(
                  f"permanent read-only compile check produced findings: {compile_check_findings!r}"
              )
          print(f"generated_findings={len(findings)}")
          PY

      - name: Upload exact generated baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minimax-final-security-baseline-${{ github.run_id }}
          path: .ci/workflow-security-baseline.json
          if-no-files-found: error
