name: Contabo consumer inventory qualification

on:
  push:
    branches: [feat/contabo-rust-standard]
    paths: [.github/workflows/contabo-inventory-qualification.yml]

permissions:
  contents: read

jobs:
  inventory:
    name: Generate frozen consumer inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: fad20eea23597b2dfe5d089ef828698e383c1e61
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout exact consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fad20eea23597b2dfe5d089ef828698e383c1e61
          persist-credentials: false
          fetch-depth: 1
      - name: Verify frozen qualification subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test ! -e .github/workflows/contabo-inventory-qualification.yml
          git diff --exit-code
      - name: Install existing pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.95.0"
      - name: Run inventory owner and exact-tree check
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --package xtask -- ci-cache-inventory
          cargo run --locked --package xtask -- ci-cache-inventory --check
          python3 scripts/ci/workflow_security_ratchet.py validate-baseline --root . --baseline .ci/workflow-security-baseline.json --baseline-root .
          mkdir -p target/contabo-inventory-qualification
          cp .ci/ci-cache/cache-inventory.v1.json target/contabo-inventory-qualification/cache-inventory.v1.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          inventory = Path("target/contabo-inventory-qualification/cache-inventory.v1.json")
          receipt = {"schema": "contabo-consumer-inventory.v1", "source_sha": os.environ["SOURCE_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "inventory_sha256": hashlib.sha256(inventory.read_bytes()).hexdigest(), "owner_command": "cargo run --locked --package xtask -- ci-cache-inventory", "exact_tree_check": "passed"}
          (inventory.parent / "qualification.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - name: Retain owner-generated qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contabo-consumer-inventory
          path: target/contabo-inventory-qualification/
          if-no-files-found: error
          retention-days: 7
