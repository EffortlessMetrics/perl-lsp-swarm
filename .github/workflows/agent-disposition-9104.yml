name: Apply reviewed legacy dispositions for #9104

on:
  push:
    branches:
      - agent/distribution-legacy-dispositions-9104

permissions:
  contents: write

concurrency:
  group: agent-disposition-9104
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact stacked branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/distribution-legacy-dispositions-9104
          fetch-depth: 1
          persist-credentials: true

      - name: Install pinned formatter
        uses: ./.github/actions/setup-rust
        with:
          toolchain: '1.95.0'
          components: rustfmt
          cache: 'false'

      - name: Apply exact reviewed dispositions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          registry_path = Path('policy/install-surface-registry.toml')
          text = registry_path.read_text()
          blocks = text.split('[[surfaces]]')

          def rewrite(surface_id, updates):
              for index in range(1, len(blocks)):
                  block = blocks[index]
                  if f'surface_id = "{surface_id}"' not in block:
                      continue
                  lines = block.splitlines()
                  seen = set()
                  for line_index, line in enumerate(lines):
                      key = line.split('=', 1)[0].strip() if '=' in line else None
                      if key in updates:
                          lines[line_index] = f'{key} = {updates[key]}'
                          seen.add(key)
                  missing = set(updates) - seen
                  if missing:
                      raise SystemExit(f'{surface_id}: missing fields {sorted(missing)}')
                  blocks[index] = '\n'.join(lines)
                  return
              raise SystemExit(f'missing registry surface {surface_id}')

          rewrite('package.legacy.build-packages', {
              'producer': '"retired_tombstone"',
              'consumer': '"historical_reference"',
              'topology_relationship': '"not_applicable"',
              'publication_stage': '"historical"',
              'active_user_reachability': '"retired"',
              'disposition': '"retired"',
              'exit_condition': '"Retired: package formats require a new topology-backed owner and evidence before reintroduction."',
          })
          rewrite('package.homebrew.local-formula', {
              'producer': '"xtask_projection"',
              'topology_relationship': '"derived"',
              'disposition': '"canonical_generated"',
              'owner': '"#9106"',
              'exit_condition': '"Bind generated placeholders and freshness to exact topology in #9106; public currentness remains #7831."',
          })
          rewrite('channel.homebrew.public-tap', {
              'disposition': '"active_owned_channel_source"',
              'owner': '"#7831"',
              'exit_condition': '"Source ownership is active; public version/currentness still requires #7831/#4351 evidence."',
          })
          rewrite('spec.packaging-install', {
              'producer': '"historical_repository_record"',
              'consumer': '"historical_regression"',
              'disposition': '"historical_fixture"',
              'owner': '"#9104"',
              'exit_condition': '"Historical only; current setup claims are owned by #8087/#6355 and generated support registries."',
          })

          historical_row = '''

          [[surfaces]]
          surface_id = "fixture.windows-asset-404-incident"
          external_identity = "xtask:install_surface_check:legacy_windows_asset_404"
          surface_kind = "historical_fixture"
          producer = "xtask_fixture"
          consumer = "historical_regression"
          target_channel = "none"
          installed_product_unit = "not_applicable"
          authority_refs = ["#6196", "#9104"]
          topology_relationship = "not_applicable"
          publication_stage = "historical"
          active_user_reachability = "historical"
          disposition = "historical_fixture"
          owner = "#9104"
          exit_condition = "Retain the concrete 404 incident as regression evidence without treating it as current PowerShell route truth."
          '''.strip()
          if 'surface_id = "fixture.windows-asset-404-incident"' not in text:
              blocks.append('\n' + historical_row + '\n')

          registry_path.write_text('[[surfaces]]'.join(blocks).rstrip() + '\n')
          PY

          cat > distribution/build-packages.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          cat >&2 <<'MESSAGE'
          distribution/build-packages.sh is retired historical scaffolding.

          It encoded an independent 1.0.0/amd64/server-only DEB, RPM, tarball,
          man-page, and systemd product model that is not part of current release
          topology. Use the topology-backed release and channel owners recorded in
          policy/install-surface-registry.toml. Reintroducing a Linux package format
          requires a new reviewed owner and public-channel evidence.
          MESSAGE
          exit 64
          EOF
          chmod -x distribution/build-packages.sh

          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/specs/PACKAGING_INSTALL_SPEC.md')
          source = path.read_text()
          marker = '''<!-- install-surface-role: historical_fixture; owner: #9104 -->
          > [!WARNING]
          > Historical design record. Its runnable commands, alpha wording, settings,
          > target names, and client examples are not current installation guidance.
          > Current routes and claims come from the topology, route, channel, PATH, and
          > support authorities referenced by `policy/install-surface-registry.toml`.

          '''
          if not source.startswith('<!-- install-surface-role: historical_fixture;'):
              path.write_text(marker + source)
          PY

          python3 - <<'PY'
          from pathlib import Path
          path = Path('xtask/src/tasks/install_surface_inventory.rs')
          source = path.read_text()
          needle = '''    #[test]
          fn rejects_duplicate_ids() -> Result<()> {'''
          test = '''    #[test]
          fn reviewed_legacy_rows_have_terminal_dispositions() -> Result<()> {
              let root = PathBuf::from(env!("CARGO_MANIFEST_DIR")).join("..");
              let registry = load_registry(&root.join("policy/install-surface-registry.toml"))?;
              let dispositions = registry
                  .surfaces
                  .iter()
                  .map(|row| (row.surface_id.as_str(), row.disposition))
                  .collect::<BTreeMap<_, _>>();
              assert_eq!(
                  dispositions.get("package.legacy.build-packages"),
                  Some(&Disposition::Retired)
              );
              assert_eq!(
                  dispositions.get("package.homebrew.local-formula"),
                  Some(&Disposition::CanonicalGenerated)
              );
              assert_eq!(
                  dispositions.get("spec.packaging-install"),
                  Some(&Disposition::HistoricalFixture)
              );
              assert_eq!(
                  dispositions.get("fixture.windows-asset-404-incident"),
                  Some(&Disposition::HistoricalFixture)
              );
              Ok(())
          }

          '''
          if 'fn reviewed_legacy_rows_have_terminal_dispositions()' not in source:
              if needle not in source:
                  raise SystemExit('could not locate inventory test insertion point')
              source = source.replace(needle, test + needle)
              path.write_text(source)
          PY

          cargo fmt --all
          rm .github/workflows/agent-disposition-9104.yml
          git diff --check

      - name: Commit disposition stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add --all
          git commit -m 'chore(distribution): disposition legacy install surfaces (#9104)'
          git push origin HEAD:agent/distribution-legacy-dispositions-9104
