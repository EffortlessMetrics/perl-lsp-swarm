name: Publish VSCode Extension

# Publish VSCode extension packages to VS Code Marketplace and Open VSX.
# Cost: ~$0.05 per publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.x.y)"
        required: true
        type: string

concurrency:
  group: publish-extension-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-vsix:
    name: Prepare VSIX
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      build_sha: ${{ github.sha }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      version: ${{ steps.version.outputs.version }}
      vsix_file: ${{ steps.package.outputs.vsix_file }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup VS Code toolchain
        uses: ./.github/actions/setup-vscode-toolchain
        with:
          verify-publisher-tools: 'true'

      - name: Set version
        working-directory: vscode-extension
        id: version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            if [ "$REF_TYPE" = "tag" ]; then
              VERSION="${GITHUB_REF#refs/tags/v}"
            else
              echo "::error::Version input is required for workflow_dispatch"
              exit 1
            fi
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            # This value failed validation, so it is still fully attacker-shaped.
            # `::error::` is GitHub's workflow-command protocol, not plain text:
            # percent-encode so a crafted version cannot close this annotation and
            # emit a further command (e.g. a newline followed by `::add-mask::`).
            ENCODED=${VERSION//%/%25}
            ENCODED=${ENCODED//$'\r'/%0D}
            ENCODED=${ENCODED//$'\n'/%0A}
            printf '::error::Invalid extension version: %s\n' "$ENCODED"
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
            printf '::notice::Prerelease version %s will be packaged for GitHub/Open VSX; VS Code Marketplace publish will be skipped.\n' "$VERSION"
          else
            IS_PRERELEASE=false
          fi

          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            printf 'Extension already at version %s\n' "$VERSION"
          else
            npm version "$VERSION" --no-git-tag-version
          fi

          printf 'artifact_name=perl-lsp-rs-%s.vsix\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'is_prerelease=%s\n' "$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          printf 'release_tag=v%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release VSIX
        working-directory: vscode-extension
        id: package
        run: |
          npm run verify:marketplace

          shopt -s nullglob
          vsix_files=(perl-lsp-rs-*.vsix)
          if [ "${#vsix_files[@]}" -ne 1 ]; then
            echo "::error::Expected one VSIX package, found ${#vsix_files[@]}"
            printf '%s\n' "${vsix_files[@]}"
            exit 1
          fi

          echo "vsix_file=${vsix_files[0]}" >> "$GITHUB_OUTPUT"

      - name: Archive exact source-map evidence
        working-directory: vscode-extension
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run check:source-map

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: vscode-extension/${{ steps.package.outputs.vsix_file }}
          retention-days: 30

      - name: Upload source-map evidence artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact_name }}-source-map
          path: target/receipts/vscode-source-map/**
          if-no-files-found: error
          retention-days: 30

  publish-vscode-marketplace:
    name: Publish VS Code Marketplace
    needs: prepare-vsix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.prepare-vsix.outputs.version }}
      VSIX_FILE: ${{ needs.prepare-vsix.outputs.vsix_file }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare-vsix.outputs.artifact_name }}
          path: vscode-extension

      - name: Setup VS Code toolchain
        uses: ./.github/actions/setup-vscode-toolchain
        with:
          verify-publisher-tools: 'true'

      - name: Skip prerelease Marketplace publish
        if: ${{ needs.prepare-vsix.outputs.is_prerelease == 'true' }}
        run: |
          echo "::notice::VS Code Marketplace publish skipped for prerelease $VERSION; Marketplace accepts non-prerelease SemVer package versions only."

      - name: Publish to VS Code Marketplace
        if: ${{ needs.prepare-vsix.outputs.is_prerelease != 'true' }}
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT is not configured; VS Code Marketplace publish cannot run."
            exit 1
          fi

          # Idempotency guard: skip if this version is already on the marketplace.
          PUBLISHED_VERSION=$(npm exec --offline --no -- @vscode/vsce show EffortlessMetrics.perl-lsp-rs --json 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['versions'][0]['version'])" \
            2>/dev/null || echo "")
          if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
            echo "::warning::VS Code Marketplace already has version $VERSION; skipping publish."
            exit 0
          fi
          npm exec --offline --no -- @vscode/vsce publish --pat "$VSCE_PAT" --packagePath "$VSIX_FILE"

  publish-open-vsx:
    name: Publish Open VSX
    needs: prepare-vsix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.prepare-vsix.outputs.version }}
      VSIX_FILE: ${{ needs.prepare-vsix.outputs.vsix_file }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare-vsix.outputs.artifact_name }}
          path: vscode-extension

      - name: Setup VS Code toolchain
        uses: ./.github/actions/setup-vscode-toolchain
        with:
          verify-publisher-tools: 'true'

      - name: Publish to Open VSX
        working-directory: vscode-extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT is not configured; Open VSX publish cannot run."
            exit 1
          fi

          # --skip-duplicate exits 0 with a notice if the version already exists.
          npm exec --offline --no -- ovsx publish "$VSIX_FILE" --pat "$OVSX_PAT" --skip-duplicate

  github-release-asset:
    name: Attach VSIX to GitHub Release
    needs: prepare-vsix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BUILD_SHA: ${{ needs.prepare-vsix.outputs.build_sha }}
      RELEASE_TAG: ${{ needs.prepare-vsix.outputs.release_tag }}
      VSIX_FILE: ${{ needs.prepare-vsix.outputs.vsix_file }}

    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare-vsix.outputs.artifact_name }}
          path: vscode-extension

      # `release_tag` is derived from the dispatch version input alone, while the
      # VSIX is built from the dispatch-selected ref. Nothing else proves those
      # are the same subject, so a dispatch naming an older version would rebuild
      # current source and `--clobber` that version's historical asset (#9597).
      # Bind the two before the upload can run: resolve the tag to its commit and
      # require it to be the commit we built. Fail closed on any unresolved tag.
      - name: Verify release tag resolves to the built subject
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Built subject SHA is not a full commit SHA: ${BUILD_SHA}"
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if ref_json=$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" 2>/dev/null); then
              break
            fi
            ref_json=""
            echo "Waiting for tag ${RELEASE_TAG} to become available..."
            sleep 10
          done

          if [ -z "$ref_json" ]; then
            echo "::error::Tag ${RELEASE_TAG} was not available in time; refusing to attach a VSIX."
            exit 1
          fi

          object_sha=$(printf '%s' "$ref_json" | jq -r '.object.sha // empty')
          object_type=$(printf '%s' "$ref_json" | jq -r '.object.type // empty')

          # Annotated tags resolve to a tag object; dereference to the commit.
          if [ "$object_type" = "tag" ]; then
            object_sha=$(gh api "repos/${GH_REPO}/git/tags/${object_sha}" --jq '.object.sha // empty')
          fi

          if ! [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve ${RELEASE_TAG} to a commit; refusing to attach a VSIX."
            exit 1
          fi

          if [ "$object_sha" != "$BUILD_SHA" ]; then
            echo "::error::Release identity mismatch: ${RELEASE_TAG} points at ${object_sha}, but this VSIX was built from ${BUILD_SHA}. Re-run this workflow with the release tag selected as the ref so the published asset matches the release it claims to be."
            exit 1
          fi

          printf 'Release %s and the built VSIX share subject %s.\n' "$RELEASE_TAG" "$BUILD_SHA"

      - name: Create GitHub Release asset
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" \
                "vscode-extension/$VSIX_FILE" \
                --clobber
              exit 0
            fi

            echo "Waiting for GitHub release ${RELEASE_TAG} to become available..."
            sleep 10
          done

          echo "::error::Release ${RELEASE_TAG} was not available in time for VSIX attachment."
          exit 1

  published-marketplace-smoke:
    name: Published Marketplace Smoke
    needs:
      - prepare-vsix
      - publish-vscode-marketplace
    if: ${{ needs.prepare-vsix.outputs.is_prerelease != 'true' && needs.publish-vscode-marketplace.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vscode-extension
    env:
      PERL_LSP_PUBLISHED_EXTENSION_SOURCE: marketplace
      PERL_LSP_PUBLISHED_EXTENSION_VERSION: ${{ needs.prepare-vsix.outputs.version }}
      PERL_LSP_PUBLISHED_BINARY_VERSION: ${{ needs.prepare-vsix.outputs.version }}
      PERL_LSP_REQUIRE_STRUCTURED_COMMANDS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup VS Code toolchain
        uses: ./.github/actions/setup-vscode-toolchain

      - name: Smoke published Marketplace extension
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: xvfb-run -a npm run test:published

  published-open-vsx-smoke:
    name: Published Open VSX Smoke
    needs:
      - prepare-vsix
      - publish-open-vsx
    if: ${{ needs.publish-open-vsx.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vscode-extension
    env:
      PERL_LSP_PUBLISHED_EXTENSION_SOURCE: open-vsx
      PERL_LSP_PUBLISHED_EXTENSION_VERSION: ${{ needs.prepare-vsix.outputs.version }}
      PERL_LSP_PUBLISHED_BINARY_VERSION: ${{ needs.prepare-vsix.outputs.version }}
      PERL_LSP_REQUIRE_STRUCTURED_COMMANDS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup VS Code toolchain
        uses: ./.github/actions/setup-vscode-toolchain

      - name: Smoke published Open VSX extension
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: xvfb-run -a npm run test:published

  publish-summary:
    name: Publish Extension Summary
    needs:
      - prepare-vsix
      - publish-vscode-marketplace
      - publish-open-vsx
      - github-release-asset
      - published-marketplace-smoke
      - published-open-vsx-smoke
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Post publish summary
        env:
          VERSION: ${{ needs.prepare-vsix.outputs.version }}
          ARTIFACT_NAME: ${{ needs.prepare-vsix.outputs.artifact_name }}
          MARKETPLACE_RESULT: ${{ needs.publish-vscode-marketplace.result }}
          OPEN_VSX_RESULT: ${{ needs.publish-open-vsx.result }}
          RELEASE_ASSET_RESULT: ${{ needs.github-release-asset.result }}
          MARKETPLACE_SMOKE_RESULT: ${{ needs.published-marketplace-smoke.result }}
          OPEN_VSX_SMOKE_RESULT: ${{ needs.published-open-vsx-smoke.result }}
          IS_PRERELEASE: ${{ needs.prepare-vsix.outputs.is_prerelease }}
        run: |
          {
            echo "## VS Code extension publish"
            echo ""
            printf -- '- Version: %s\n' "$VERSION"
            printf -- '- VSIX artifact: %s\n' "$ARTIFACT_NAME"
            printf -- '- VS Code Marketplace job: %s\n' "$MARKETPLACE_RESULT"
            printf -- '- Open VSX job: %s\n' "$OPEN_VSX_RESULT"
            printf -- '- GitHub release asset job: %s\n' "$RELEASE_ASSET_RESULT"
            printf -- '- Published Marketplace smoke job: %s\n' "$MARKETPLACE_SMOKE_RESULT"
            printf -- '- Published Open VSX smoke job: %s\n' "$OPEN_VSX_SMOKE_RESULT"
            if [ "$IS_PRERELEASE" = "true" ]; then
              echo "- Marketplace prerelease policy: skipped; publish Marketplace only for non-prerelease SemVer versions."
            fi
            echo "- Marketplace: https://marketplace.visualstudio.com/items?itemName=EffortlessMetrics.perl-lsp-rs"
            echo "- Open VSX: https://open-vsx.org/extension/EffortlessMetrics/perl-lsp-rs"
          } >> "$GITHUB_STEP_SUMMARY"
