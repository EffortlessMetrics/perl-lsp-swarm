# PR Plan
#
# Advisory CI economics forecast. Runs on every non-draft PR. The planner and
# policy are always loaded from the exact base SHA; the PR head is imported only
# as a Git object for diffing and is never executed.

name: PR Plan

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: pr-plan-${{ github.event.pull_request.number }}
  # Only cancel on synchronize so label add/remove events re-run the plan
  # without cancelling an in-progress run. Required by workflow-policy-lint
  # rule LABEL_EVENT_CANCELS_PR_RUN.
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    name: Forecast LEM and lanes
    runs-on:
      group: em-ci-nano
      labels: [self-hosted, linux, x64, em-ci, trusted-pr, workflow-nano]
    timeout-minutes: 5
    if: github.event.pull_request.draft != true
    steps:
      - name: Checkout trusted planner and policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact PR head as inert diff data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .pr-plan-head
          fetch-depth: 1
          persist-credentials: false

      - name: Import and verify PR head object
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags .pr-plan-head/.git HEAD
          resolved_head="$(git rev-parse FETCH_HEAD)"
          if [ "$resolved_head" != "$HEAD_SHA" ]; then
            printf '::error::Fetched PR head %s does not match event head %s\n' "$resolved_head" "$HEAD_SHA"
            exit 1
          fi
          git update-ref refs/remotes/pr-plan/head "$resolved_head"
          rm -rf .pr-plan-head

      # System python3 on the self-hosted runner (Ubuntu ships >=3.11 with
      # tomllib). pr_plan.py is stdlib-only, so no setup action is required.
      - name: Compute PR Plan from trusted authority
        # continue-on-error so the artifact upload step still runs even when
        # the budget guard returns exit 2 (over hard ceiling, no override).
        continue-on-error: true
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          mkdir -p target/ci
          python3 scripts/ci/pr_plan.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --labels-json "$LABELS_JSON" \
            --budget policy/ci-budget.toml \
            --lanes policy/ci-lanes.toml \
            --risk-packs policy/ci-risk-packs.toml \
            --trust-lanes policy/trust-lanes.toml \
            --json-out target/ci/ci-plan.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload ci-plan.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-plan
          path: target/ci/ci-plan.json
          retention-days: 14
          if-no-files-found: warn

      - name: Budget guard (hard ceiling)
        # Re-surface a non-zero exit from the planner so over-ceiling PRs that
        # do not have a `full-ci` or `ci-budget-override` label visibly fail.
        # The PR Plan workflow is advisory and not a required merge check.
        if: always() && steps.plan.outcome == 'failure'
        run: |
          echo "::error::PR Plan returned a non-success exit code; see the step summary."
          exit 1
