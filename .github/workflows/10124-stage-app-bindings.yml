name: 10124 stage source-specific app bindings

on:
  push:
    branches: [codex/10124-stage-app-bindings]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout construction branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize bounded construction helper
        shell: bash
        run: |
          mkdir -p target/10124
          python3 - <<'PY'
          import gzip
          from pathlib import Path

          Path("target/10124/stage_issue_10124.py").write_bytes(
              gzip.decompress(Path("construction/10124/stage.py.gz").read_bytes())
          )
          PY
          python3 -m py_compile target/10124/stage_issue_10124.py

      - name: Patch exact static-contract surfaces
        run: python3 target/10124/stage_issue_10124.py patch

      - name: Run focused static-contract falsifiers
        run: python3 target/10124/stage_issue_10124.py verify

      - name: Commit temporary exact subject for receipt validation
        shell: bash
        run: |
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add \
            .ci/policies/required-checks.toml \
            .github/workflows/gate-enforcement-contract.yml \
            docs/ci/gate-enforcement-app-bindings.md \
            scripts/ci/test_gate_enforcement_app_bindings.py \
            scripts/ci/validate_gate_enforcement_contract.py
          git commit -m "test(ci): prove issue 10124 exact static subject"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Validate temporary static contract and receipt
        run: |
          python3 scripts/ci/validate_gate_enforcement_contract.py \
            --root . \
            --receipt target/10124/gate-enforcement-contract-temporary.json

      - name: Fetch exact main base object
        run: |
          git fetch --no-tags --depth=1 origin \
            cdc3bdce56bdda4b5d3fcc4e7d4d2cbbec19a266

      - name: Build, revalidate, and push clean five-file commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          base_sha="cdc3bdce56bdda4b5d3fcc4e7d4d2cbbec19a266"
          target_branch="codex/10124-static-app-bindings"
          index_file="$RUNNER_TEMP/issue-10124.index"
          clean_root="$RUNNER_TEMP/issue-10124-clean"
          rm -f "$index_file"
          rm -rf "$clean_root"

          GIT_INDEX_FILE="$index_file" git read-tree "$base_sha^{tree}"
          for path in \
            .ci/policies/required-checks.toml \
            .github/workflows/gate-enforcement-contract.yml \
            docs/ci/gate-enforcement-app-bindings.md \
            scripts/ci/test_gate_enforcement_app_bindings.py \
            scripts/ci/validate_gate_enforcement_contract.py
          do
            GIT_INDEX_FILE="$index_file" git add -- "$path"
          done

          tree_sha="$(GIT_INDEX_FILE="$index_file" git write-tree)"
          head_sha="$(printf '%s\n' \
            'feat(ci): declare source-specific enforcement app bindings (#10124)' \
            | git commit-tree "$tree_sha" -p "$base_sha")"

          cat > "$RUNNER_TEMP/issue-10124-expected.txt" <<'EOF'
          .ci/policies/required-checks.toml
          .github/workflows/gate-enforcement-contract.yml
          docs/ci/gate-enforcement-app-bindings.md
          scripts/ci/test_gate_enforcement_app_bindings.py
          scripts/ci/validate_gate_enforcement_contract.py
          EOF
          git diff-tree --no-commit-id --name-only -r "$head_sha" \
            | sort > "$RUNNER_TEMP/issue-10124-actual.txt"
          diff -u \
            "$RUNNER_TEMP/issue-10124-expected.txt" \
            "$RUNNER_TEMP/issue-10124-actual.txt"

          git worktree add --detach "$clean_root" "$head_sha"
          python3 "$clean_root/scripts/ci/validate_gate_enforcement_contract.py" \
            --root "$clean_root" \
            --receipt "$GITHUB_WORKSPACE/target/10124/gate-enforcement-contract-clean.json"

          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote_url" "$head_sha:refs/heads/$target_branch"

          HEAD_SHA="$head_sha" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema_version": 1,
              "issue": 10124,
              "base_sha": "cdc3bdce56bdda4b5d3fcc4e7d4d2cbbec19a266",
              "branch": "codex/10124-static-app-bindings",
              "head_sha": os.environ["HEAD_SHA"],
              "paths": [
                  ".ci/policies/required-checks.toml",
                  ".github/workflows/gate-enforcement-contract.yml",
                  "docs/ci/gate-enforcement-app-bindings.md",
                  "scripts/ci/test_gate_enforcement_app_bindings.py",
                  "scripts/ci/validate_gate_enforcement_contract.py",
              ],
          }
          Path("target/10124/result.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload construction receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: issue-10124-static-app-bindings
          path: |
            target/10124/result.json
            target/10124/gate-enforcement-contract-temporary.json
            target/10124/gate-enforcement-contract-clean.json
          if-no-files-found: warn
          retention-days: 1
