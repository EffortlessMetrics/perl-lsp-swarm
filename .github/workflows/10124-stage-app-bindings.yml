name: 10124 stage source-specific app bindings

on:
  push:
    branches: [codex/10124-stage-app-bindings]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout construction branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize bounded construction helper
        shell: bash
        run: |
          mkdir -p target/10124
          python3 - <<'PY'
          import gzip
          from pathlib import Path

          Path("target/10124/stage_issue_10124.py").write_bytes(
              gzip.decompress(Path("construction/10124/stage.py.gz").read_bytes())
          )
          PY
          python3 -m py_compile target/10124/stage_issue_10124.py

      - name: Patch exact static-contract surfaces
        run: python3 target/10124/stage_issue_10124.py patch

      - name: Run focused static-contract falsifiers
        run: python3 target/10124/stage_issue_10124.py verify

      - name: Commit temporary exact subject for receipt validation
        shell: bash
        run: |
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add \
            .ci/policies/required-checks.toml \
            .github/workflows/gate-enforcement-contract.yml \
            docs/ci/gate-enforcement-app-bindings.md \
            scripts/ci/test_gate_enforcement_app_bindings.py \
            scripts/ci/validate_gate_enforcement_contract.py
          git commit -m "test(ci): prove issue 10124 exact static subject"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Validate the exact static contract and receipt
        run: |
          python3 scripts/ci/validate_gate_enforcement_contract.py \
            --root . \
            --receipt target/10124/gate-enforcement-contract.json

      - name: Publish clean five-file branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 target/10124/stage_issue_10124.py publish

      - name: Upload construction receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: issue-10124-static-app-bindings
          path: |
            target/10124/result.json
            target/10124/gate-enforcement-contract.json
          if-no-files-found: error
          retention-days: 1
