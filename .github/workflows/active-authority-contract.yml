name: Active Authority Contract

# Check the short, high-retrieval maintainer and contributor entrypoints that
# steer humans and coding agents. Historical documents are outside this workflow.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: active-authority-contract-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check active authority contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check current maintainer entrypoints
        # Kept on one line: test_workflow_runs_only_its_own_surface asserts the
        # contiguous source substring "python3 -m unittest tests/test_active_authority_contract.py",
        # which folded (>-) YAML would break.
        run: python3 -m unittest tests/test_active_authority_contract.py tests/test_writer_authority_transfer_contract.py
