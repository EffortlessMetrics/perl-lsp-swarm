name: Emacs Train Packet Contract

on:
  pull_request:
    branches: [main, master]
    paths:
      - '.spec/10918-emacs-train-graph/**'
      - '.spec/11770-emacs-train-revisions/**'
      - '.spec/11717-emacs-train-specs/**'
      - '.spec/11756-emacs-context-engine/**'
      - '.spec/11716-emacs-support-architecture/**'
      - 'xtask/src/tasks/emacs_train_packet.rs'
      - 'xtask/src/tasks/emacs_train_packet/**'
      - 'xtask/src/tasks/emacs_train_context/**'
      - 'xtask/src/tasks/emacs_train_specs.rs'
      - 'xtask/src/tasks/agent_implementation_packet.rs'
      - 'xtask/src/tasks/agent_review_packet.rs'
      - 'schemas/agent_implementation_packet.v1.schema.json'
      - 'schemas/agent_review_packet.v1.schema.json'
      - 'fixtures/agent_implementation_packet/**'
      - 'fixtures/agent_review_packet/**'
      - '.github/workflows/emacs-train-packet-contract.yml'
  workflow_dispatch: {}

concurrency:
  group: emacs-train-packet-contract-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate E06 shared-contract packet adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Falsifier suite
        run: cargo test -p xtask --bin xtask emacs_train_packet --locked

      - name: Denominator assumes no vacancy without a live observation
        run: |
          set -euo pipefail
          cargo run -p xtask --locked -- integration emacs train packets --check | tee /tmp/den-blind.txt
          # A coding packet admits a writer, so with no observation supplied
          # every node must refuse rather than assume its claim is free.
          grep -q 'EMU_PACKETS_CHECK=OK rendered=0 ' /tmp/den-blind.txt
          grep -q 'code=NO_LIVE_OBSERVATION' /tmp/den-blind.txt

      - name: Validate the packet denominator against a supplied observation
        run: |
          set -euo pipefail
          cargo run -p xtask --locked -- integration emacs train packets --check \
            --live-observation fixtures/emacs_train_packet/observed_no_candidate.v1.json | tee /tmp/den.txt
          # The render path must stay exercised on the real tree: a denominator
          # that renders nothing proves no zero-drift.
          grep -q 'EMU_PACKET node=CTXENG .* status=ok' /tmp/den.txt

      - name: Determinism proof on the real tree (two renders must match)
        run: |
          set -euo pipefail
          for out in a b; do
            cargo run -p xtask --locked -- integration emacs train packet CTXENG \
              --profile coding_agent_bounded \
              --live-observation fixtures/emacs_train_packet/observed_no_candidate.v1.json \
              > /tmp/pkt-$out.json
          done
          diff /tmp/pkt-a.json /tmp/pkt-b.json

      - name: Offline routes refuse fail-closed with the exact typed code
        run: |
          set -uo pipefail
          # Asserting exit 3 alone would accept any refusal, including a wrong
          # or accidental one; assert the typed code this adapter owns.
          assert_refusal() {
            local expected="$1"; shift
            local err
            err="$("$@" 2>&1 >/dev/null)" && { echo "expected a refusal from: $*"; exit 1; }
            test $? -eq 3 || { echo "expected exit 3 from: $*"; exit 1; }
            echo "$err" | grep -q "EMU_PACKET_REFUSED .*code=$expected" || {
              echo "expected code=$expected from: $*"; echo "$err"; exit 1;
            }
          }
          assert_refusal MISSING_CANDIDATE_IDENTITY \
            cargo run -p xtask --locked -- integration emacs train review-packet CTXENG
          assert_refusal NO_LIVE_OBSERVATION \
            cargo run -p xtask --locked -- integration emacs train reconcile-packet CTXENG
          assert_refusal NO_LIVE_OBSERVATION \
            cargo run -p xtask --locked -- integration emacs train packet CTXENG --profile coding_agent_bounded

      - name: Shared contract checks stay green (zero drift)
        run: |
          cargo run -p xtask --locked -- check-agent-implementation-packet
          cargo run -p xtask --locked -- check-agent-review-packet
