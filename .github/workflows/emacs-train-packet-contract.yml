name: Emacs Train Packet Contract

on:
  pull_request:
    branches: [main, master]
    paths:
      - '.spec/10918-emacs-train-graph/**'
      - '.spec/11770-emacs-train-revisions/**'
      - '.spec/11717-emacs-train-specs/**'
      - '.spec/11756-emacs-context-engine/**'
      - '.spec/11716-emacs-support-architecture/**'
      - 'xtask/src/tasks/emacs_train_packet.rs'
      - 'xtask/src/tasks/emacs_train_packet/**'
      - 'xtask/src/tasks/emacs_train_context/**'
      - 'xtask/src/tasks/emacs_train_specs.rs'
      - 'xtask/src/tasks/agent_implementation_packet.rs'
      - 'xtask/src/tasks/agent_review_packet.rs'
      - 'schemas/agent_implementation_packet.v1.schema.json'
      - 'schemas/agent_review_packet.v1.schema.json'
      - 'fixtures/agent_implementation_packet/**'
      - 'fixtures/agent_review_packet/**'
      - '.github/workflows/emacs-train-packet-contract.yml'
  workflow_dispatch: {}

concurrency:
  group: emacs-train-packet-contract-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate E06 shared-contract packet adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Falsifier suite
        run: cargo test -p xtask --bin xtask emacs_train_packet --locked

      - name: Validate the packet denominator (fail-closed typed refusals)
        run: cargo run -p xtask --locked -- integration emacs train packets --check

      # A coding packet may never assume vacancy (#11719), so the determinism
      # proof must declare an observation before any packet can render. The
      # fixture asserts nothing about a real candidate.
      - name: Determinism proof on the real tree (two renders must match)
        run: |
          # Declared inline rather than checked in: it asserts nothing about any
          # real candidate and exists only so a packet can render at all.
          OBS=/tmp/ci-live-observation.json
          cat > "$OBS" <<'JSON'
          {
            "candidate_state": "observed",
            "digest": "sha256:c1f1c7u4e0b5e2v4t10n00000000000000000000000000000000000000000000",
            "candidate_identity": "ci-fixture/emacs-train-packet-contract",
            "collision_state": "ci fixture: sole declared writer"
          }
          JSON
          cargo run -p xtask --locked -- integration emacs train packet CTXENG --profile coding_agent_bounded --live-observation "$OBS" > /tmp/pkt-a.json
          cargo run -p xtask --locked -- integration emacs train packet CTXENG --profile coding_agent_bounded --live-observation "$OBS" > /tmp/pkt-b.json
          diff /tmp/pkt-a.json /tmp/pkt-b.json

      - name: A coding packet without a live observation refuses fail-closed
        run: |
          set -o pipefail
          cargo run -p xtask --locked -- integration emacs train packet CTXENG --profile coding_agent_bounded 2>&1 | tee /tmp/no-live.txt && exit 1
          test "${PIPESTATUS[0]}" -eq 3 || { echo "expected exit 3"; exit 1; }
          grep -q 'code=NO_LIVE_OBSERVATION' /tmp/no-live.txt

      # Asserting exit 3 alone would pass on any typed refusal, including a
      # wrong one; each route asserts its own `code=`.
      - name: Offline review and reconcile routes refuse fail-closed
        run: |
          set -o pipefail
          assert_refusal() {
            expected="$1"; shift
            out="/tmp/refusal-$expected.txt"
            status=0
            cargo run -p xtask --locked -- "$@" > "$out" 2>&1 || status=$?
            if [ "$status" -ne 3 ]; then
              echo "expected exit 3 from '$*', got $status"; cat "$out"; exit 1
            fi
            if ! grep -q "code=$expected" "$out"; then
              echo "expected code=$expected from '$*'"; cat "$out"; exit 1
            fi
          }
          assert_refusal MISSING_CANDIDATE_IDENTITY integration emacs train review-packet CTXENG
          assert_refusal NO_LIVE_OBSERVATION integration emacs train reconcile-packet CTXENG

      - name: Shared contract checks stay green (zero drift)
        run: |
          cargo run -p xtask --locked -- check-agent-implementation-packet
          cargo run -p xtask --locked -- check-agent-review-packet
