# Policy Validators
#
# Runs the CI economics and architecture policy validators on PRs that touch
# their ledgers, governed source, generated projections, or validator scripts.
# Catches drift automatically instead of relying on contributors to remember
# to run the scripts locally.
#
# See policy/ci-lane-whitelist.toml entry `policy_validators`.

name: Policy Validators

on:
  pull_request:
    paths:
      - 'policy/**'
      - '.ci/gate-policy.yaml'
      - '.ci/parser-facade/**'
      - '.github/workflows/**'
      # Any manifest anywhere: `discover_consumer_contexts` scans every
      # Cargo.toml in the repository for perl-parser dependencies, so a
      # consumer manifest outside `crates/**` (xtask, fuzz, tests/fuzz,
      # archive/...) must trigger this workflow too, or consumer drift in
      # those files passes silently (#15580). `**/Cargo.toml` names manifests
      # at any depth; the bare `Cargo.toml` entry pins the workspace-root
      # manifest explicitly.
      - '**/Cargo.toml'
      - 'Cargo.toml'
      - 'crates/perl-parser/src/lib.rs'
      - 'crates/perl-parser/src/incremental/mod.rs'
      - 'docs/project/PARSER_FACADE_AUTHORITY.md'
      - 'scripts/ci/parser_facade_authority.py'
      - 'scripts/ci/parser_facade_inventory.py'
      - 'scripts/ci/check_parser_facade_authority.py'
      - 'scripts/ci/test_parser_facade_authority.py'
      - 'scripts/ci/validate_risk_packs.py'
      - 'scripts/ci/validate_gate_lane_mapping.py'
      - '.ci/policy-checks-inventory.json'
      - 'scripts/ci/validate_policy_checks_inventory.py'
      - 'scripts/ci/test_validate_policy_checks_inventory.py'
      - 'docs/ci/policy-checks-inventory.md'
      - 'scripts/ci/validate_provider_fact_reads.py'
      - 'scripts/ci/validate_cargo_lock_conflict_policy.py'
      - 'scripts/ci/test_validate_cargo_lock_conflict_policy.py'
      - 'docs/releases/**'
      - 'scripts/validate-exposed-surface-disposition.py'
      - 'scripts/tests/test-validate-exposed-surface-disposition.py'
      - 'scripts/tests/fixtures/exposed-surface-disposition/**'
      - 'scripts/ci/fixtures/cargo_lock_conflict_policy.json'
      - 'docs/how-to/DEPENDENCY_QUICK_REFERENCE.md'
      - 'docs/how-to/DEPENDENCY_MANAGEMENT.md'
      - 'CONTRIBUTING.md'
      - 'book/src/developer/contributing.md'
      - 'scripts/populate-book.sh'
      - '.github/dependabot.yml'
      - 'scripts/ci/validate_dependabot_contract.py'
      - 'scripts/ci/test_validate_dependabot_contract.py'
      - 'scripts/ci/validate_dependabot_cooldown.py'
      - 'scripts/ci/test_validate_dependabot_cooldown.py'
      - 'vscode-extension/.npmrc'
      - 'docs/reference/WORKTREE_PROTOCOL.md'
      - 'docs/project/CI_LOCAL_VALIDATION.md'
      - 'scripts/ci/check_perl_lsp_rs_core_package.py'
      - 'docs/release/RUNBOOK.md'
      - 'docs/project/RELEASE_RUNBOOK_0_12_3.md'
      - 'justfile'
      # The fact-read inventory anchors to provider SOURCES: editing a governed
      # provider source without touching the catalog is the primary drift class,
      # so these paths (the exact roots of every catalog-anchored source) must
      # execute the validator too (#6815).
      - 'crates/perl-lsp-rs/src/runtime/**'
      - 'crates/perl-lsp-rs-core/src/providers/**'
      # validate_gate_lane_mapping.py --strict also checks this doc's lane
      # enumeration against the mapping, so a docs-only edit must trigger the
      # workflow -- otherwise the drift check is not load-bearing on its own
      # subject file (#5425).
      - 'docs/ci/gate-policy-economics.md'
      - 'scripts/ci/validate_trust_lanes.py'
      - 'scripts/ci/check_bounded_result_overflow.py'
      - 'scripts/ci/verify_homebrew_formula_digests.py'
      - 'scripts/ci/test_verify_homebrew_formula_digests.py'
      - 'docs/agents/bounded-subagent-result-v1.schema.json'
      - 'docs/agents/bounded-subagent-result-v1.fixtures.json'
      - 'docs/project/status/provider_fact_reads.md'
      - 'xtask/src/tasks/update_status/provider_fact_reads.rs'
      - 'xtask/src/tasks/update_status/mod.rs'
      - '.github/workflows/policy-validators.yml'
  workflow_dispatch: {}

concurrency:
  group: policy-validators-${{ github.event.pull_request.number || github.ref }}
  # Only cancel on synchronize to avoid label-event cancellation cascades
  # (workflow-policy-lint LABEL_EVENT_CANCELS_PR_RUN rule).
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  route:
    name: Route Policy Validators
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft != true || github.event_name != 'pull_request'
    outputs:
      target: ${{ steps.route.outputs.target }}
      reason: ${{ steps.route.outputs.reason }}
      error: ${{ steps.route.outputs.error }}
      fallback_allowed: ${{ steps.route.outputs.fallback_allowed }}
    steps:
      - name: Decide target runner
        id: route
        env:
          GH_TOKEN: ${{ secrets.EM_RUNNER_READ_TOKEN }}
          ORG: EffortlessMetrics
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PR_AUTHOR_LOGIN: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login || '' }}
          PR_AUTHOR_TYPE: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.type || '' }}
        shell: bash
        run: |
          set -euo pipefail

          emit() {
            local target="$1" reason="$2" error="$3" fallback_allowed="$4"
            echo "router_target=$target"
            echo "router_reason=$reason"
            echo "router_error=$error"
            echo "router_fallback_allowed=$fallback_allowed"
            {
              echo "target=$target"
              echo "reason=$reason"
              echo "error=$error"
              echo "fallback_allowed=$fallback_allowed"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### Policy Validators Route"
              echo ""
              echo "- router_target: \`$target\`"
              echo "- router_reason: \`$reason\`"
              echo "- router_error: \`$error\`"
              echo "- router_fallback_allowed: \`$fallback_allowed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$IS_FORK_PR" = "true" ]; then
            emit "github" "fork_pr" "false" "true"
            exit 0
          fi

          if [ "$IS_PULL_REQUEST" = "true" ]; then
            pr_author_login_lc="$(printf '%s' "${PR_AUTHOR_LOGIN:-}" | tr '[:upper:]' '[:lower:]')"
            pr_author_type_lc="$(printf '%s' "${PR_AUTHOR_TYPE:-}" | tr '[:upper:]' '[:lower:]')"
            is_bot_pr="false"

            case "$pr_author_login_lc" in
              dependabot*|app/*|*\[bot\])
                is_bot_pr="true"
                ;;
            esac

            if [ "$pr_author_type_lc" = "bot" ]; then
              is_bot_pr="true"
            fi

            if [ "$is_bot_pr" = "true" ]; then
              emit "github" "bot_pr_github_hosted" "false" "true"
              exit 0
            fi
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::runner inventory token is unavailable; routing Policy Validators to GitHub-hosted"
            emit "github" "runner_token_missing_github_hosted" "false" "true"
            exit 0
          fi

          response="$(mktemp)"
          status="$(curl -sS -w '%{http_code}' -o "$response" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/$ORG/actions/runners?per_page=100" || true)"

          if [ "$status" != "200" ]; then
            echo "::warning::runner inventory API returned HTTP $status; routing Policy Validators to GitHub-hosted"
            emit "github" "runner_api_unavailable_github_hosted" "false" "true"
            exit 0
          fi

          if ! jq -e '.runners' "$response" >/dev/null 2>&1; then
            echo "::warning::runner inventory response has no runners list; routing Policy Validators to GitHub-hosted"
            emit "github" "runner_group_absent_github_hosted" "false" "true"
            exit 0
          fi

          idle_nano="$(jq '
            [ .runners[]?
              | select(.status == "online")
              | select(.busy == false)
              | ([.labels[].name | ascii_downcase] // []) as $have
              | select(
                  ($have | index("em-ci")) and
                  ($have | index("trusted-pr")) and
                  ($have | index("workflow-nano"))
                )
            ] | length
          ' "$response")"

          echo "idle_nano=${idle_nano:-0}"

          if [ "${idle_nano:-0}" -gt 0 ]; then
            emit "nano" "nano_idle" "false" "false"
          else
            emit "github" "no_idle_runner_github_hosted" "false" "true"
          fi

  validate:
    name: Validate CI policy ledgers (self-hosted)
    needs: route
    if: >-
      needs.route.result == 'success' &&
      needs.route.outputs.target == 'nano'
    runs-on:
      group: em-ci-nano
      labels: [self-hosted, linux, x64, em-ci, trusted-pr, workflow-nano]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      # System python3 on the self-hosted runner (Ubuntu ships >=3.11 with
      # tomllib). actions/setup-python has no tool-cache build for this
      # runner's OS, and the validators are stdlib-only, so no setup needed.
      - name: Validate risk packs
        run: |
          python3 scripts/ci/validate_risk_packs.py --strict

      - name: Validate trust lanes
        run: |
          python3 scripts/ci/validate_trust_lanes.py --strict

      - name: Validate gate -> lane mapping
        run: |
          workflow_args=()
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            [[ -f "$workflow" ]] && workflow_args+=(--workflow "$workflow")
          done
          python3 scripts/ci/validate_gate_lane_mapping.py --strict "${workflow_args[@]}"

      - name: Validate policy_checks inventory
        run: |
          python3 scripts/ci/test_validate_policy_checks_inventory.py
          python3 scripts/ci/validate_policy_checks_inventory.py --check

      - name: Validate policy TOML parses
        run: |
          python3 - <<'EOF'
          import sys, tomllib
          from pathlib import Path
          failed = []
          for p in sorted(Path("policy").glob("*.toml")):
              try:
                  tomllib.loads(p.read_text(encoding="utf-8"))
                  print(f"OK: {p}")
              except tomllib.TOMLDecodeError as e:
                  failed.append((p, e))
                  print(f"FAIL: {p}: {e}")
          sys.exit(1 if failed else 0)
          EOF

      - name: Validate provider fact-read inventory
        run: |
          python3 scripts/ci/validate_provider_fact_reads.py

      - name: Validate Cargo.lock conflict-repair policy
        run: |
          python3 scripts/ci/test_validate_cargo_lock_conflict_policy.py
          python3 scripts/ci/validate_cargo_lock_conflict_policy.py --repo-root .

      - name: Validate Dependabot source contract
        run: |
          python3 scripts/ci/test_validate_dependabot_contract.py
          python3 scripts/ci/validate_dependabot_contract.py --repo-root .

      - name: Validate Dependabot cooldown contract
        run: |
          python3 scripts/ci/test_validate_dependabot_cooldown.py
          python3 scripts/ci/validate_dependabot_cooldown.py --repo-root .

      - name: Validate exposed-surface disposition contract
        run: |
          python3 -m unittest scripts/tests/test-validate-exposed-surface-disposition.py
          python3 scripts/validate-exposed-surface-disposition.py \
            --authority-catalog docs/releases/exposed-surface-authorities.v1.json \
            --projection docs/releases/exposed-surface-disposition.v1.json

      - name: Validate bounded-result overflow invariants
        run: |
          python3 scripts/ci/check_bounded_result_overflow.py

      - name: Validate parser facade authority
        run: |
          python3 scripts/ci/test_parser_facade_authority.py
          python3 scripts/ci/check_parser_facade_authority.py --check-doc

      # brew-bump.yml only runs on release/dispatch, so its own workflow never
      # gates a PR. Without this step the digest-to-stanza binding would have a
      # swapped-digest negative control that never runs (#6013).
      - name: Validate Homebrew formula digest binding
        run: |
          python3 scripts/ci/test_verify_homebrew_formula_digests.py

  validate-hosted:
    name: Validate CI policy ledgers (GitHub-hosted)
    needs: route
    if: >-
      needs.route.result == 'success' &&
      needs.route.outputs.target == 'github'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      # ubuntu-24.04 ships python3.12 with tomllib in the stdlib, so the
      # validators run with system python3 exactly as on em-ci-nano: no
      # toolchain install, no cargo, checkout only. The step list below is
      # intentionally identical to `validate`; the route contract test
      # (scripts/ci/test_policy_validators_route_contract.py) fails the
      # required aggregate if the two copies drift.
      - name: Validate risk packs
        run: |
          python3 scripts/ci/validate_risk_packs.py --strict

      - name: Validate trust lanes
        run: |
          python3 scripts/ci/validate_trust_lanes.py --strict

      - name: Validate gate -> lane mapping
        run: |
          workflow_args=()
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            [[ -f "$workflow" ]] && workflow_args+=(--workflow "$workflow")
          done
          python3 scripts/ci/validate_gate_lane_mapping.py --strict "${workflow_args[@]}"

      - name: Validate policy_checks inventory
        run: |
          python3 scripts/ci/test_validate_policy_checks_inventory.py
          python3 scripts/ci/validate_policy_checks_inventory.py --check

      - name: Validate policy TOML parses
        run: |
          python3 - <<'EOF'
          import sys, tomllib
          from pathlib import Path
          failed = []
          for p in sorted(Path("policy").glob("*.toml")):
              try:
                  tomllib.loads(p.read_text(encoding="utf-8"))
                  print(f"OK: {p}")
              except tomllib.TOMLDecodeError as e:
                  failed.append((p, e))
                  print(f"FAIL: {p}: {e}")
          sys.exit(1 if failed else 0)
          EOF

      - name: Validate provider fact-read inventory
        run: |
          python3 scripts/ci/validate_provider_fact_reads.py

      - name: Validate Cargo.lock conflict-repair policy
        run: |
          python3 scripts/ci/test_validate_cargo_lock_conflict_policy.py
          python3 scripts/ci/validate_cargo_lock_conflict_policy.py --repo-root .

      - name: Validate Dependabot source contract
        run: |
          python3 scripts/ci/test_validate_dependabot_contract.py
          python3 scripts/ci/validate_dependabot_contract.py --repo-root .

      - name: Validate Dependabot cooldown contract
        run: |
          python3 scripts/ci/test_validate_dependabot_cooldown.py
          python3 scripts/ci/validate_dependabot_cooldown.py --repo-root .

      - name: Validate exposed-surface disposition contract
        run: |
          python3 -m unittest scripts/tests/test-validate-exposed-surface-disposition.py
          python3 scripts/validate-exposed-surface-disposition.py \
            --authority-catalog docs/releases/exposed-surface-authorities.v1.json \
            --projection docs/releases/exposed-surface-disposition.v1.json

      - name: Validate bounded-result overflow invariants
        run: |
          python3 scripts/ci/check_bounded_result_overflow.py

      - name: Validate parser facade authority
        run: |
          python3 scripts/ci/test_parser_facade_authority.py
          python3 scripts/ci/check_parser_facade_authority.py --check-doc

      # brew-bump.yml only runs on release/dispatch, so its own workflow never
      # gates a PR. Without this step the digest-to-stanza binding would have a
      # swapped-digest negative control that never runs (#6013).
      - name: Validate Homebrew formula digest binding
        run: |
          python3 scripts/ci/test_verify_homebrew_formula_digests.py

  validate-result:
    name: Validate CI policy ledgers
    needs:
      - route
      - validate
      - validate-hosted
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Prove policy-validators route contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts/ci/test_policy_validators_route_contract.py

      # Fail-closed aggregation: the selected route must have passed and the
      # unselected implementation must have skipped. Routing failure already
      # selected hosted capacity above; a validator failure on either route
      # remains a real failure here.
      - name: Evaluate routed result
        shell: bash
        run: |
          set -euo pipefail
          target="${{ needs.route.outputs.target }}"
          route_result="${{ needs.route.result }}"
          nano_result="${{ needs.validate.result }}"
          hosted_result="${{ needs.validate-hosted.result }}"
          echo "route=$route_result target=$target nano=$nano_result hosted=$hosted_result"
          if [ "$route_result" != "success" ]; then
            echo "::error::Policy Validators router did not succeed (result=$route_result)"
            exit 1
          fi
          if [ "$target" = "nano" ]; then
            if [ "$nano_result" != "success" ]; then
              echo "::error::self-hosted Policy Validators failed (result=$nano_result)"
              exit 1
            fi
            if [ "$hosted_result" != "skipped" ]; then
              echo "::error::unselected hosted route must skip (result=$hosted_result)"
              exit 1
            fi
          elif [ "$target" = "github" ]; then
            if [ "$hosted_result" != "success" ]; then
              echo "::error::hosted Policy Validators failed (result=$hosted_result)"
              exit 1
            fi
            if [ "$nano_result" != "skipped" ]; then
              echo "::error::unselected self-hosted route must skip (result=$nano_result)"
              exit 1
            fi
          else
            echo "::error::unknown router target '$target'"
            exit 1
          fi
          echo "Policy Validators routed result: $target passed, unselected route skipped."
