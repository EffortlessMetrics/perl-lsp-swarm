# Policy Validators
#
# Runs the CI economics and architecture policy validators on PRs that touch
# their ledgers, governed source, generated projections, or validator scripts.
# Catches drift automatically instead of relying on contributors to remember
# to run the scripts locally.
#
# See policy/ci-lane-whitelist.toml entry `policy_validators`.

name: Policy Validators

on:
  workflow_dispatch: {}

concurrency:
  group: policy-validators-${{ github.event.pull_request.number || github.ref }}
  # Only cancel on synchronize to avoid label-event cancellation cascades
  # (workflow-policy-lint LABEL_EVENT_CANCELS_PR_RUN rule).
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

permissions:
  contents: read
  # No write authority here: the workflow security ratchet forbids write
  # grants on PR-triggered workflows (#15900). The deadline diagnostics in
  # validate-diagnostics are advisory only; the scheduled
  # policy-validators-nano-reaper workflow owns the explicit cancel of a
  # queued-forever trusted lane.

jobs:
  validate:
    name: Validate CI policy ledgers (self-hosted)
    # Trusted self-hosted capacity stays off forks and bot PRs; those are
    # proven by the hosted lane alone. A queued-forever nano (outage) is
    # tolerated: only the diagnostic job polls it with a deadline; the
    # required verdict depends solely on the identical hosted validation.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.type != 'Bot' &&
        !startsWith(github.event.pull_request.user.login, 'dependabot') &&
        !startsWith(github.event.pull_request.user.login, 'app/') &&
        !endsWith(github.event.pull_request.user.login, '[bot]'))
    runs-on:
      group: em-ci-nano
      labels: [self-hosted, linux, x64, em-ci, trusted-pr, workflow-nano]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      # System python3 on the self-hosted runner (Ubuntu ships >=3.11 with
      # tomllib). actions/setup-python has no tool-cache build for this
      # runner's OS, and the validators are stdlib-only, so no setup needed.
      - name: Validate risk packs
        run: |
          python3 scripts/ci/validate_risk_packs.py --strict

      - name: Validate trust lanes
        run: |
          python3 scripts/ci/validate_trust_lanes.py --strict

      - name: Validate gate -> lane mapping
        run: |
          workflow_args=()
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            [[ -f "$workflow" ]] && workflow_args+=(--workflow "$workflow")
          done
          python3 scripts/ci/validate_gate_lane_mapping.py --strict "${workflow_args[@]}"

      - name: Validate policy_checks inventory
        run: |
          python3 scripts/ci/test_validate_policy_checks_inventory.py
          python3 scripts/ci/validate_policy_checks_inventory.py --check

      - name: Validate policy TOML parses
        run: |
          python3 - <<'EOF'
          import sys, tomllib
          from pathlib import Path
          failed = []
          for p in sorted(Path("policy").glob("*.toml")):
              try:
                  tomllib.loads(p.read_text(encoding="utf-8"))
                  print(f"OK: {p}")
              except tomllib.TOMLDecodeError as e:
                  failed.append((p, e))
                  print(f"FAIL: {p}: {e}")
          sys.exit(1 if failed else 0)
          EOF

      - name: Validate provider fact-read inventory
        run: |
          python3 scripts/ci/validate_provider_fact_reads.py

      - name: Validate Cargo.lock conflict-repair policy
        run: |
          python3 scripts/ci/test_validate_cargo_lock_conflict_policy.py
          python3 scripts/ci/validate_cargo_lock_conflict_policy.py --repo-root .

      # #8409: every governed Cargo feature carries one classified role and its
      # discovered consumer evidence. Adding a feature to any workspace manifest
      # without classifying it fails here.
      - name: Validate Cargo feature roles
        run: |
          python3 scripts/ci/test_validate_cargo_feature_roles.py
          python3 scripts/ci/validate_cargo_feature_roles.py --repo-root .

      - name: Validate Dependabot source contract
        run: |
          python3 scripts/ci/test_validate_dependabot_contract.py
          python3 scripts/ci/validate_dependabot_contract.py --repo-root .

      - name: Validate Dependabot cooldown contract
        run: |
          python3 scripts/ci/test_validate_dependabot_cooldown.py
          python3 scripts/ci/validate_dependabot_cooldown.py --repo-root .

      - name: Validate exposed-surface disposition contract
        run: |
          python3 -m unittest scripts/tests/test-validate-exposed-surface-disposition.py
          python3 scripts/validate-exposed-surface-disposition.py \
            --authority-catalog docs/releases/exposed-surface-authorities.v1.json \
            --projection docs/releases/exposed-surface-disposition.v1.json

      - name: Validate bounded-result overflow invariants
        run: |
          python3 scripts/ci/check_bounded_result_overflow.py

      - name: Validate parser facade authority
        run: |
          python3 scripts/ci/test_parser_facade_authority.py
          python3 scripts/ci/check_parser_facade_authority.py --check-doc

      # brew-bump.yml only runs on release/dispatch, so its own workflow never
      # gates a PR. Without this step the digest-to-stanza binding would have a
      # swapped-digest negative control that never runs (#6013).
      - name: Validate Homebrew formula digest binding
        run: |
          python3 scripts/ci/test_verify_homebrew_formula_digests.py

  validate-hosted:
    name: Validate CI policy ledgers (GitHub-hosted)
    # Always runs in parallel: the aggregate below decides between the
    # trusted verdict and the fallback, so a queued-forever trusted lane
    # (runner outage; queue time ignores timeout-minutes) cannot block
    # failover the way a needs-gated lane would.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      # ubuntu-24.04 ships python3.12 with tomllib in the stdlib, so the
      # validators run with system python3 exactly as on em-ci-nano: no
      # toolchain install, no cargo, checkout only. The step list below is
      # intentionally identical to `validate`; the fallback contract test
      # (scripts/ci/test_policy_validators_route_contract.py) fails the
      # required aggregate if the two copies drift.
      - name: Validate risk packs
        run: |
          python3 scripts/ci/validate_risk_packs.py --strict

      - name: Validate trust lanes
        run: |
          python3 scripts/ci/validate_trust_lanes.py --strict

      - name: Validate gate -> lane mapping
        run: |
          workflow_args=()
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            [[ -f "$workflow" ]] && workflow_args+=(--workflow "$workflow")
          done
          python3 scripts/ci/validate_gate_lane_mapping.py --strict "${workflow_args[@]}"

      - name: Validate policy_checks inventory
        run: |
          python3 scripts/ci/test_validate_policy_checks_inventory.py
          python3 scripts/ci/validate_policy_checks_inventory.py --check

      - name: Validate policy TOML parses
        run: |
          python3 - <<'EOF'
          import sys, tomllib
          from pathlib import Path
          failed = []
          for p in sorted(Path("policy").glob("*.toml")):
              try:
                  tomllib.loads(p.read_text(encoding="utf-8"))
                  print(f"OK: {p}")
              except tomllib.TOMLDecodeError as e:
                  failed.append((p, e))
                  print(f"FAIL: {p}: {e}")
          sys.exit(1 if failed else 0)
          EOF

      - name: Validate provider fact-read inventory
        run: |
          python3 scripts/ci/validate_provider_fact_reads.py

      - name: Validate Cargo.lock conflict-repair policy
        run: |
          python3 scripts/ci/test_validate_cargo_lock_conflict_policy.py
          python3 scripts/ci/validate_cargo_lock_conflict_policy.py --repo-root .

      # #8409: every governed Cargo feature carries one classified role and its
      # discovered consumer evidence. Adding a feature to any workspace manifest
      # without classifying it fails here.
      - name: Validate Cargo feature roles
        run: |
          python3 scripts/ci/test_validate_cargo_feature_roles.py
          python3 scripts/ci/validate_cargo_feature_roles.py --repo-root .

      - name: Validate Dependabot source contract
        run: |
          python3 scripts/ci/test_validate_dependabot_contract.py
          python3 scripts/ci/validate_dependabot_contract.py --repo-root .

      - name: Validate Dependabot cooldown contract
        run: |
          python3 scripts/ci/test_validate_dependabot_cooldown.py
          python3 scripts/ci/validate_dependabot_cooldown.py --repo-root .

      - name: Validate exposed-surface disposition contract
        run: |
          python3 -m unittest scripts/tests/test-validate-exposed-surface-disposition.py
          python3 scripts/validate-exposed-surface-disposition.py \
            --authority-catalog docs/releases/exposed-surface-authorities.v1.json \
            --projection docs/releases/exposed-surface-disposition.v1.json

      - name: Validate bounded-result overflow invariants
        run: |
          python3 scripts/ci/check_bounded_result_overflow.py

      - name: Validate parser facade authority
        run: |
          python3 scripts/ci/test_parser_facade_authority.py
          python3 scripts/ci/check_parser_facade_authority.py --check-doc

      # brew-bump.yml only runs on release/dispatch, so its own workflow never
      # gates a PR. Without this step the digest-to-stanza binding would have a
      # swapped-digest negative control that never runs (#6013).
      - name: Validate Homebrew formula digest binding
        run: |
          python3 scripts/ci/test_verify_homebrew_formula_digests.py

  validate-result:
    name: Validate CI policy ledgers
    # Every pair in the shared decision table passes exactly when hosted
    # validation succeeds. Nano changes diagnostics only, so neither its
    # queue nor the bounded diagnostic wait belongs on this required path.
    needs:
      - validate-hosted
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Prove policy-validators fallback contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts/ci/test_policy_validators_route_contract.py

      - name: Evaluate routed result
        shell: bash
        env:
          HOSTED_RESULT: ${{ needs.validate-hosted.result }}
        run: |
          set -euo pipefail
          # Unobserved is honest: no trusted outcome is claimed here.
          # Full agreement/divergence/failover diagnostics follow separately.
          python3 scripts/ci/policy_validators_aggregate.py "unobserved" "$HOSTED_RESULT"

  validate-diagnostics:
    name: Policy Validators lane diagnostics
    needs:
      - validate-hosted
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Only this advisory job reads native job conclusions. The required
      # verdict has no API dependency or additional token permission.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      # Preserve the bounded trusted-lane observation and outage diagnostics
      # outside the required verdict. Queue time ignores timeout-minutes.
      # Context values arrive via env, never embedded in run source.
      - name: Report lane diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HOSTED_RESULT: ${{ needs.validate-hosted.result }}
          NANO_JOB: Validate CI policy ledgers (self-hosted)
          POLL_DEADLINE_SECONDS: 900
          POLL_INTERVAL_SECONDS: 30
        run: |
          set -euo pipefail
          nano_conclusion=""
          deadline=$((SECONDS + POLL_DEADLINE_SECONDS))
          while [ "$SECONDS" -lt "$deadline" ]; do
            nano_conclusion="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq ".jobs[] | select(.name == \"$NANO_JOB\") | .conclusion // \"pending\"")"
            if [ -n "$nano_conclusion" ] && [ "$nano_conclusion" != "pending" ]; then
              break
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done
          # A trusted lane that never receives a runner stays queued forever
          # (queue time ignores timeout-minutes), so the run and its check
          # never reach a terminal state (#15900). This workflow holds no
          # write authority (PR-triggered), so it reports actionable
          # diagnostics and leaves the explicit cancel to the scheduled
          # policy-validators-nano-reaper workflow. The required verdict
          # has already used the hosted result without this diagnostic wait.
          if [ -z "$nano_conclusion" ] || [ "$nano_conclusion" = "pending" ]; then
            echo "::warning::Trusted lane has no observed conclusion after ${POLL_DEADLINE_SECONDS}s past the hosted lane (runner group em-ci-nano, labels self-hosted/linux/x64/em-ci/trusted-pr/workflow-nano); the scheduled policy-validators-nano-reaper cancels a queued job so this run reaches a terminal state. The required verdict uses the hosted result. See issue #15900."
            {
              echo "### Trusted-lane failover diagnostics"
              echo ""
              echo "- No trusted conclusion observed within ${POLL_DEADLINE_SECONDS}s past the hosted lane (queue time ignores timeout-minutes)."
              echo "- Trusted placement: runner group em-ci-nano, labels self-hosted, linux, x64, em-ci, trusted-pr, workflow-nano."
              echo "- Action: the scheduled policy-validators-nano-reaper cancels a queued job; the required verdict uses the hosted result."
              echo "- Follow-up: verify em-ci-nano runner registration and connectivity before the next trusted run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          nano="${nano_conclusion:-pending}"
          echo "nano=$nano hosted=$HOSTED_RESULT" | tee -a "$GITHUB_STEP_SUMMARY"
          # The unchanged table keeps complete agreement, divergence,
          # failover and failure reporting. pipefail preserves a failed
          # comparison as a failed diagnostic job, never green test credit.
          python3 scripts/ci/policy_validators_aggregate.py "$nano" "$HOSTED_RESULT" | tee -a "$GITHUB_STEP_SUMMARY"
