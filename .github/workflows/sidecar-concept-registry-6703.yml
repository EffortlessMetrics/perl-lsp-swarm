name: Build typed sidecar registry slice

on:
  push:
    branches:
      - agent/sidecar-concept-registry-6703

permissions:
  contents: write

jobs:
  build-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out writable branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/sidecar-concept-registry-6703
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply, verify, commit, and remove instrument
        shell: bash
        env:
          PATCH_B64: "              "        run: |
          set -euo pipefail
          workflow_file='.github/workflows/sidecar-concept-registry-6703.yml'
          python3 -c 'import base64, os; exec(base64.b64decode(os.environ["PATCH_B64"]))'
          cargo fmt -p perl-corpus
          cargo test -p perl-corpus sidecar --locked
          cargo test -p perl-corpus --test sidecar_expectations --locked
          cargo test -p perl-corpus --test fixture_expectation_sidecars --locked
          cargo test -p perl-corpus --test fixture_sidecars --locked
          git rm -- "$workflow_file"
          git add -- crates/perl-corpus
          git diff --cached --check
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git commit -m 'fix(corpus): bind sidecars to typed concept registry'
          git push origin HEAD:agent/sidecar-concept-registry-6703
