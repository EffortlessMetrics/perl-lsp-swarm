name: Build typed sidecar registry slice

on:
  push:
    branches:
      - agent/sidecar-concept-registry-6703

permissions:
  contents: write

jobs:
  build-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out writable branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/sidecar-concept-registry-6703
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply, verify, commit, and remove instrument
        shell: bash
        run: |
          set -euo pipefail
          workflow_file='.github/workflows/sidecar-concept-registry-6703.yml'
          cat > /tmp/sidecar_registry_patch.py <<'PY'
          from pathlib import Path
          import re


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one replacement, found {count}")
              return text.replace(old, new, 1)


          def replace_regex(text: str, pattern: str, new: str, label: str) -> str:
              updated, count = re.subn(pattern, new, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected one regex replacement, found {count}")
              return updated


          path = Path("crates/perl-corpus/src/concepts.rs")
          text = path.read_text()
          text = replace_once(text, "use serde::Deserialize;", "use serde::{Deserialize, Serialize};", "concept serde import")
          text = text.replace("#[derive(Debug, Clone, Deserialize)]", "#[derive(Debug, Clone, Deserialize, Serialize)]")
          text = replace_once(text, "#[derive(Debug, Clone)]\npub struct LoadedConcept", "#[derive(Debug, Clone, Serialize)]\npub struct LoadedConcept", "loaded concept serialize")
          text = replace_once(
              text,
              "fn load_concept_registry_from(\n",
              "/// Load and validate the typed concept registry from explicit roots.\npub fn load_concept_registry_from(\n",
              "public typed registry loader",
          )
          path.write_text(text)

          path = Path("crates/perl-corpus/src/sidecar.rs")
          text = path.read_text()
          text = replace_once(text, "use std::collections::HashSet;", "use std::collections::BTreeSet;", "sidecar set import")
          text = replace_once(
              text,
              "use std::path::{Path, PathBuf};\n",
              "use std::path::{Path, PathBuf};\n\nuse crate::concepts::{LoadedConcept, load_concept_registry, load_concept_registry_from};\n",
              "typed concept imports",
          )
          text = replace_once(
              text,
              "pub const FIXTURE_EXPECTATION_SCHEMA: &str = \"fixture_expectation.v1\";\n",
              "pub const FIXTURE_EXPECTATION_SCHEMA: &str = \"fixture_expectation.v1\";\n\n"
              "/// Versioned schema for the typed concept-registry population bound to validation.\n"
              "pub const CONCEPT_REGISTRY_SCHEMA: &str = \"perl_concept_registry.v1\";\n\n"
              "/// Named deterministic algorithm for typed registry identity.\n"
              "pub const CONCEPT_REGISTRY_IDENTITY_ALGORITHM: &str = \"serde-json+fnv1a-128.v1\";\n",
              "registry constants",
          )
          text = replace_once(
              text,
              "/// Canonical sidecar validation result.\n#[derive(Debug, Clone, Default, PartialEq, Eq)]\npub struct SidecarValidation {\n    /// Blocking validation failures.\n    pub errors: Vec<String>,",
              "/// Exact typed concept-registry population used for validation.\n"
              "#[derive(Debug, Clone, PartialEq, Eq)]\n"
              "pub struct ConceptRegistryBinding {\n"
              "    /// Versioned typed-registry schema.\n"
              "    pub schema: String,\n"
              "    /// Named deterministic identity algorithm.\n"
              "    pub identity_algorithm: String,\n"
              "    /// Digest of the ordered, typed registry population.\n"
              "    pub identity: String,\n"
              "}\n\n"
              "/// Canonical sidecar validation result.\n"
              "#[derive(Debug, Clone, Default, PartialEq, Eq)]\n"
              "pub struct SidecarValidation {\n"
              "    /// Exact typed concept-registry population used for validation.\n"
              "    pub concept_registry: Option<ConceptRegistryBinding>,\n"
              "    /// Blocking validation failures.\n"
              "    pub errors: Vec<String>,",
              "validation binding field",
          )
          registry_start = text.index("/// Loaded set of valid concept IDs.")
          registry_end = text.index("/// Parse canonical schema-v1 TOML from memory.")
          registry_block = r'''/// Loaded and identity-bound set of valid concept IDs.
          #[derive(Debug, Clone)]
          pub struct ConceptRegistry {
              concept_ids: BTreeSet<String>,
              binding: ConceptRegistryBinding,
          }

          impl ConceptRegistry {
              /// Discover and load the checked-in typed concept registry.
              pub fn discover() -> Result<Self> {
                  Self::from_loaded(load_concept_registry()?)
              }

              /// Load the typed concept registry from explicit concept and workspace roots.
              pub fn load_from(concept_dir: &Path, workspace_root: &Path) -> Result<Self> {
                  Self::from_loaded(load_concept_registry_from(concept_dir, workspace_root)?)
              }

              /// Reject the retired single-file, arbitrary-TOML registry surface.
              pub fn load(path: &Path) -> Result<Self> {
                  if path.is_dir() {
                      let workspace_root = path
                          .parent()
                          .and_then(Path::parent)
                          .ok_or_else(|| anyhow::anyhow!("cannot derive workspace root from {}", path.display()))?;
                      return Self::load_from(path, workspace_root);
                  }
                  bail!(
                      "single-file concept registry is unsupported; load the typed concepts directory: {}",
                      path.display()
                  )
              }

              /// Build a bounded compatibility registry from an explicit unique ID set.
              pub fn from_ids(ids: impl IntoIterator<Item = String>) -> Self {
                  let concept_ids = ids.into_iter().collect::<BTreeSet<_>>();
                  let payload = concept_ids.iter().cloned().collect::<Vec<_>>();
                  let bytes = serde_json::to_vec(&payload).unwrap_or_default();
                  Self {
                      concept_ids,
                      binding: ConceptRegistryBinding {
                          schema: "compat_concept_id_set.v1".to_string(),
                          identity_algorithm: CONCEPT_REGISTRY_IDENTITY_ALGORITHM.to_string(),
                          identity: registry_identity(&bytes),
                      },
                  }
              }

              fn from_loaded(concepts: Vec<LoadedConcept>) -> Result<Self> {
                  if concepts.is_empty() {
                      bail!("typed concept registry is empty");
                  }
                  let bytes = serde_json::to_vec(&concepts)
                      .context("serializing typed concept registry identity")?;
                  let concept_ids = concepts
                      .into_iter()
                      .map(|concept| concept.row.id)
                      .collect::<BTreeSet<_>>();
                  Ok(Self {
                      concept_ids,
                      binding: ConceptRegistryBinding {
                          schema: CONCEPT_REGISTRY_SCHEMA.to_string(),
                          identity_algorithm: CONCEPT_REGISTRY_IDENTITY_ALGORITHM.to_string(),
                          identity: registry_identity(&bytes),
                      },
                  })
              }

              /// Whether the registry contains a concept ID.
              #[must_use]
              pub fn contains(&self, concept_id: &str) -> bool {
                  self.concept_ids.contains(concept_id)
              }

              /// Stable binding for validation receipts produced against this population.
              #[must_use]
              pub fn binding(&self) -> ConceptRegistryBinding {
                  self.binding.clone()
              }
          }

          fn registry_identity(payload: &[u8]) -> String {
              const OFFSET_BASIS: u128 = 0x6c62_272e_07bb_0142_62b8_2175_6295_c58d;
              const PRIME: u128 = 0x0000_0000_0100_0000_0000_0000_0000_013b;
              let hash = payload
                  .iter()
                  .fold(OFFSET_BASIS, |hash, byte| (hash ^ u128::from(*byte)).wrapping_mul(PRIME));
              format!("{hash:032x}")
          }

          '''
          text = text[:registry_start] + registry_block + text[registry_end:]
          text = replace_once(
              text,
              "    let mut validation = SidecarValidation::default();\n\n    match expected_fixture_path(sidecar_path) {",
              "    let mut validation = SidecarValidation::default();\n"
              "    validation.concept_registry = concept_registry.map(ConceptRegistry::binding);\n\n"
              "    match expected_fixture_path(sidecar_path) {",
              "bind registry before validation",
          )
          text = replace_once(
              text,
              "    } else {\n        validation.warnings.push(format!(\n            \"concept registry unavailable; concept resolution pending for '{}'\",\n            sidecar.concept.id\n        ));\n    }",
              "    } else {\n        validation.errors.push(format!(\n            \"concept registry unavailable; cannot validate concept.id '{}'\",\n            sidecar.concept.id\n        ));\n    }",
              "missing registry fails closed",
          )
          collector_start = text.index("fn collect_concept_ids(")
          collector_end = text.index("#[cfg(test)]", collector_start)
          text = text[:collector_start] + text[collector_end:]

          marker = "    #[test]\n    fn canonical_schema_identity_is_v1() {"
          helper = r'''    const TEST_CONCEPT_FILES: &[&str] = &[
              "lexer.toml",
              "parser.toml",
              "recovery.toml",
              "positions.toml",
              "incremental.toml",
              "tree_sitter.toml",
          ];

              fn write_typed_registry(root: &Path, concept_id: &str) -> Result<ConceptRegistry> {
                  let concept_dir = root.join("concepts");
                  fs::create_dir_all(&concept_dir)?;
                  let row = format!(
                      r#"[[concept]]
          id = "{concept_id}"
          status = "seed"
          scope = {{ crates = ["perl-parser"], risk_tags = ["test"] }}
          fixtures = {{ floors = ["case.pl"], variants = [] }}
          expect = {{ panic = false, timeout = false, mode = "parse" }}
          snapshots = {{ tokens = false, ast = true, spans = true }}
          run = {{ pr = true, nightly = false, release = false }}
          "#
                  );
                  for file_name in TEST_CONCEPT_FILES {
                      fs::write(
                          concept_dir.join(file_name),
                          if *file_name == "lexer.toml" { row.as_str() } else { "" },
                      )?;
                  }
                  ConceptRegistry::load_from(&concept_dir, root)
              }

          '''
          text = replace_once(text, marker, helper + marker, "typed registry test helper")
          text = replace_regex(
              text,
              r"    #\[test\]\n    fn validation_owns_fixture_concept_and_registry_rules\(\) -> Result<\(\), Box<dyn Error>> \{.*?\n    \}\n\n    #\[test\]\n    fn validation_rejects_missing_fixture_and_empty_tier",
              r'''    #[test]
              fn validation_owns_fixture_concept_and_registry_rules() -> Result<(), Box<dyn Error>> {
                  let temporary = tempfile::tempdir()?;
                  let raw = minimal_sidecar_toml("parser.example", "parse_clean");
                  let sidecar_path = write_pair(temporary.path(), "case", &raw)?;
                  let parsed = parse_sidecar(&sidecar_path)?;

                  let unavailable = validate_sidecar(&sidecar_path, &parsed, None);
                  assert!(!unavailable.is_ok());
                  assert!(unavailable.concept_registry.is_none());
                  assert!(unavailable.errors.iter().any(|error| error.contains("registry unavailable")));

                  let registry = write_typed_registry(temporary.path(), "parser.example")?;
                  let accepted = validate_sidecar(&sidecar_path, &parsed, Some(&registry));
                  assert!(accepted.is_ok(), "unexpected errors: {:?}", accepted.errors);
                  let binding = accepted.concept_registry.expect("registry binding");
                  assert_eq!(binding.schema, CONCEPT_REGISTRY_SCHEMA);
                  assert_eq!(binding.identity_algorithm, CONCEPT_REGISTRY_IDENTITY_ALGORITHM);

                  let other = tempfile::tempdir()?;
                  fs::write(other.path().join("case.pl"), "1;")?;
                  let wrong_registry = write_typed_registry(other.path(), "parser.other")?;
                  let rejected = validate_sidecar(&sidecar_path, &parsed, Some(&wrong_registry));
                  assert!(!rejected.is_ok());
                  assert!(rejected.errors.iter().any(|error| error.contains("not present")));
                  Ok(())
              }

              #[test]
              fn validation_rejects_missing_fixture_and_empty_tier''',
              "registry validation unit test",
          )
          text = replace_regex(
              text,
              r"    #\[test\]\n    fn registry_loader_collects_nested_ids\(\) -> Result<\(\), Box<dyn Error>> \{.*?\n    \}\n\}",
              r'''    #[test]
              fn registry_loader_rejects_untyped_single_file() -> Result<(), Box<dyn Error>> {
                  let temporary = tempfile::tempdir()?;
                  let registry_path = temporary.path().join("concepts.toml");
                  fs::write(&registry_path, "[groups.nested]\nid = \"parser.untyped\"\n")?;

                  let error = ConceptRegistry::load(&registry_path)
                      .expect_err("arbitrary TOML IDs must not enter the typed registry");
                  assert!(error.to_string().contains("single-file"));
                  Ok(())
              }

              #[test]
              fn registry_identity_is_stable_and_content_bound() -> Result<(), Box<dyn Error>> {
                  let first_root = tempfile::tempdir()?;
                  fs::write(first_root.path().join("case.pl"), "1;")?;
                  let first = write_typed_registry(first_root.path(), "parser.one")?;
                  let repeated = ConceptRegistry::load_from(&first_root.path().join("concepts"), first_root.path())?;
                  assert_eq!(first.binding(), repeated.binding());

                  let second_root = tempfile::tempdir()?;
                  fs::write(second_root.path().join("case.pl"), "1;")?;
                  let second = write_typed_registry(second_root.path(), "parser.two")?;
                  assert_ne!(first.binding().identity, second.binding().identity);
                  Ok(())
              }
          }
          ''',
              "registry identity unit tests",
          )
          path.write_text(text)

          path = Path("crates/perl-corpus/src/fixture_expectations.rs")
          text = path.read_text()
          text = replace_once(
              text,
              "pub struct SidecarValidation {\n    /// Sidecar path that was inspected.",
              "pub struct SidecarValidation {\n"
              "    /// Exact concept-registry population used by the canonical validator.\n"
              "    pub concept_registry: Option<sidecar::ConceptRegistryBinding>,\n"
              "    /// Sidecar path that was inspected.",
              "adapter registry binding field",
          )
          text = replace_once(
              text,
              "    let (errors, warnings) = match sidecar::parse_sidecar(path) {\n        Ok(parsed) => {\n            let validation = sidecar::validate_sidecar(path, &parsed, registry.as_ref());\n            (validation.errors, validation.warnings)\n        }\n        Err(error) => (vec![error.to_string()], Vec::new()),\n    };\n\n    SidecarValidation { sidecar_path: path.to_path_buf(), fixture_path, errors, warnings }",
              "    let (errors, warnings, registry_binding) = match sidecar::parse_sidecar(path) {\n"
              "        Ok(parsed) => {\n"
              "            let validation = sidecar::validate_sidecar(path, &parsed, registry.as_ref());\n"
              "            (validation.errors, validation.warnings, validation.concept_registry)\n"
              "        }\n"
              "        Err(error) => (vec![error.to_string()], Vec::new(), None),\n"
              "    };\n\n"
              "    SidecarValidation {\n"
              "        concept_registry: registry_binding,\n"
              "        sidecar_path: path.to_path_buf(),\n"
              "        fixture_path,\n"
              "        errors,\n"
              "        warnings,\n"
              "    }",
              "adapter canonical receipt propagation",
          )
          text = replace_once(
              text,
              "        assert_eq!(adapter.warnings, canonical.warnings);\n        assert_eq!(adapter.fixture_path, sidecar::expected_fixture_path(&path)?);",
              "        assert_eq!(adapter.warnings, canonical.warnings);\n"
              "        assert_eq!(adapter.concept_registry, canonical.concept_registry);\n"
              "        assert_eq!(adapter.fixture_path, sidecar::expected_fixture_path(&path)?);",
              "adapter binding parity",
          )
          text = replace_regex(
              text,
              r"    #\[test\]\n    fn validation_uses_registry_semantics_from_canonical_authority\(\) -> Result<\(\), Box<dyn Error>> \{.*?\n    \}\n\}",
              r'''    #[test]
              fn validation_uses_registry_semantics_from_canonical_authority() -> Result<(), Box<dyn Error>> {
                  let temporary = tempfile::tempdir()?;
                  let path = write_fixture_pair(temporary.path(), "case", valid_toml())?;

                  let unavailable = validate_sidecar(&path, None);
                  assert!(!unavailable.is_valid());
                  assert!(unavailable.errors.iter().any(|error| error.contains("registry unavailable")));

                  let registry = HashSet::from(["parser.example".to_string()]);
                  let accepted = validate_sidecar(&path, Some(&registry));
                  assert!(accepted.is_valid(), "unexpected errors: {:?}", accepted.errors);
                  assert!(accepted.concept_registry.is_some());

                  let wrong = HashSet::from(["parser.other".to_string()]);
                  let rejected = validate_sidecar(&path, Some(&wrong));
                  assert!(!rejected.is_valid());
                  assert!(rejected.errors.iter().any(|error| error.contains("not present")));
                  Ok(())
              }
          }
          ''',
              "adapter registry semantics test",
          )
          path.write_text(text)

          Path("crates/perl-corpus/tests/sidecar_expectations.rs").write_text(r'''use perl_corpus::{
              CONCEPT_REGISTRY_SCHEMA, ConceptRegistry, SidecarValidation, discover_sidecars,
              load_and_validate_sidecar, parse_sidecar,
          };
          use std::error::Error;
          use std::fs;
          use std::path::{Path, PathBuf};
          use std::time::{SystemTime, UNIX_EPOCH};

          const CONCEPT_FILES: &[&str] = &[
              "lexer.toml",
              "parser.toml",
              "recovery.toml",
              "positions.toml",
              "incremental.toml",
              "tree_sitter.toml",
          ];

          fn temp_dir(prefix: &str) -> Result<PathBuf, Box<dyn Error>> {
              let mut path = std::env::temp_dir();
              let nanos = SystemTime::now().duration_since(UNIX_EPOCH)?.as_nanos();
              path.push(format!("{}_{}_{}", prefix, std::process::id(), nanos));
              fs::create_dir_all(&path)?;
              Ok(path)
          }

          fn write_file(path: &Path, contents: &str) -> Result<(), Box<dyn Error>> {
              if let Some(parent) = path.parent() {
                  fs::create_dir_all(parent)?;
              }
              fs::write(path, contents)?;
              Ok(())
          }

          fn valid_sidecar(concept_id: &str) -> String {
              format!(
                  r#"[concept]
          id = "{concept_id}"
          tier = "pr"

          [expect]
          panic = false
          timeout = false
          mode = "recover_without_panic"

          [metrics]
          max_error_nodes = 2
          must_emit_node_kinds = ["SubDecl", "Block"]

          [snapshots]
          tokens = false
          ast = true
          spans = true
          "#
              )
          }

          fn write_registry(root: &Path, concept_id: &str, fixture: &str) -> Result<ConceptRegistry, Box<dyn Error>> {
              let concept_dir = root.join("concepts");
              fs::create_dir_all(&concept_dir)?;
              let row = format!(
                  r#"[[concept]]
          id = "{concept_id}"
          status = "seed"
          scope = {{ crates = ["perl-parser"], risk_tags = ["test"] }}
          fixtures = {{ floors = ["{fixture}"], variants = [] }}
          expect = {{ panic = false, timeout = false, mode = "recover" }}
          snapshots = {{ tokens = false, ast = true, spans = true }}
          run = {{ pr = true, nightly = false, release = false }}
          "#
              );
              for file_name in CONCEPT_FILES {
                  fs::write(
                      concept_dir.join(file_name),
                      if *file_name == "lexer.toml" { row.as_str() } else { "" },
                  )?;
              }
              Ok(ConceptRegistry::load_from(&concept_dir, root)?)
          }

          #[test]
          fn sidecar_validation_fails_closed_without_registry() -> Result<(), Box<dyn Error>> {
              let root = temp_dir("perl_corpus_sidecar_no_registry")?;
              let meta = root.join("tests/perl-corpus/recovery/missing_brace.meta.toml");
              let fixture = root.join("tests/perl-corpus/recovery/missing_brace.pl");
              write_file(&fixture, "sub x { my $v = 1;\n")?;
              write_file(&meta, &valid_sidecar("parser.recovery.missing_closing_brace"))?;

              let parsed = parse_sidecar(&meta)?;
              assert_eq!(parsed.concept.id, "parser.recovery.missing_closing_brace");
              let validation = load_and_validate_sidecar(&meta, None)?;
              assert!(!validation.is_ok());
              assert!(validation.errors.iter().any(|error| error.contains("registry unavailable")));
              assert!(validation.concept_registry.is_none());

              fs::remove_dir_all(&root)?;
              Ok(())
          }

          #[test]
          fn sidecar_requires_fixture_file_to_exist() -> Result<(), Box<dyn Error>> {
              let root = temp_dir("perl_corpus_sidecar_missing_fixture")?;
              let meta = root.join("tests/perl-corpus/recovery/missing_brace.meta.toml");
              write_file(&meta, &valid_sidecar("parser.recovery.missing_closing_brace"))?;
              write_file(&root.join("registry-fixture.pl"), "1;")?;
              let registry = write_registry(
                  &root,
                  "parser.recovery.missing_closing_brace",
                  "registry-fixture.pl",
              )?;

              let validation = load_and_validate_sidecar(&meta, Some(&registry))?;
              assert!(!validation.is_ok());
              assert!(validation.errors.iter().any(|item| item.contains("fixture file does not exist")));

              fs::remove_dir_all(&root)?;
              Ok(())
          }

          #[test]
          fn sidecar_validates_concept_id_against_typed_registry() -> Result<(), Box<dyn Error>> {
              let root = temp_dir("perl_corpus_sidecar_registry")?;
              let meta = root.join("tests/perl-corpus/recovery/missing_brace.meta.toml");
              let fixture = root.join("tests/perl-corpus/recovery/missing_brace.pl");
              write_file(&fixture, "sub x { my $v = 1;\n")?;
              write_file(&meta, &valid_sidecar("parser.recovery.missing_closing_brace"))?;
              let registry = write_registry(
                  &root,
                  "parser.recovery.missing_closing_brace",
                  "tests/perl-corpus/recovery/missing_brace.pl",
              )?;

              let validation = load_and_validate_sidecar(&meta, Some(&registry))?;
              assert_eq!(validation.errors, SidecarValidation::default().errors);
              let binding = validation.concept_registry.expect("typed registry binding");
              assert_eq!(binding.schema, CONCEPT_REGISTRY_SCHEMA);

              fs::remove_dir_all(&root)?;
              Ok(())
          }

          #[test]
          fn discover_sidecars_finds_nested_meta_files() -> Result<(), Box<dyn Error>> {
              let root = temp_dir("perl_corpus_sidecar_discovery")?;
              write_file(
                  &root.join("tests/perl-corpus/recovery/one.meta.toml"),
                  &valid_sidecar("parser.recovery.missing_closing_brace"),
              )?;
              write_file(
                  &root.join("tests/perl-corpus/recovery/two.meta.toml"),
                  &valid_sidecar("parser.recovery.missing_delimiter"),
              )?;

              let sidecars = discover_sidecars(&root)?;
              assert_eq!(sidecars.len(), 2);

              fs::remove_dir_all(&root)?;
              Ok(())
          }
          ''')

          Path("crates/perl-corpus/tests/fixture_expectation_sidecars.rs").write_text(r'''use anyhow::{Context, Result};
          use perl_corpus::{ConceptRegistry, discover_sidecars, load_and_validate_sidecar};
          use std::path::PathBuf;

          fn workspace_root() -> Result<PathBuf> {
              let manifest_dir = PathBuf::from(env!("CARGO_MANIFEST_DIR"));
              let Some(root) = manifest_dir.parent().and_then(|path| path.parent()) else {
                  anyhow::bail!("unable to discover workspace root from {}", manifest_dir.display());
              };
              Ok(root.to_path_buf())
          }

          #[test]
          fn seeded_sidecars_validate_against_one_typed_registry() -> Result<()> {
              let root = workspace_root()?;
              let sidecar_root = root.join("tests/perl-corpus");
              let sidecars = discover_sidecars(&sidecar_root)?;
              assert!(!sidecars.is_empty(), "expected seeded parser sidecars");

              let registry = ConceptRegistry::discover().context("loading typed concept registry")?;
              let expected_identity = registry.binding().identity;

              for sidecar in &sidecars {
                  let validation = load_and_validate_sidecar(sidecar, Some(&registry))
                      .with_context(|| format!("sidecar should load and validate: {}", sidecar.display()))?;
                  assert!(
                      validation.is_ok(),
                      "sidecar should validate against typed registry: {}\nerrors: {:?}",
                      sidecar.display(),
                      validation.errors,
                  );
                  assert_eq!(
                      validation.concept_registry.as_ref().map(|binding| binding.identity.as_str()),
                      Some(expected_identity.as_str()),
                  );
              }

              Ok(())
          }
          ''')

          Path("crates/perl-corpus/tests/fixture_sidecars.rs").write_text(r'''use perl_corpus::fixture_expectations::{ExpectationMode, parse_sidecar, validate_sidecars_in_dir};
          use std::collections::HashSet;
          use std::error::Error;
          use std::path::Path;

          fn seeded_concept_ids(root: &Path) -> Result<HashSet<String>, Box<dyn Error>> {
              Ok(validate_sidecars_in_dir(root, None)?
                  .iter()
                  .filter_map(|validation| parse_sidecar(&validation.sidecar_path).ok())
                  .filter_map(|sidecar| sidecar.concept.map(|concept| concept.id))
                  .collect())
          }

          #[test]
          fn sidecars_parse_for_seed_fixtures() -> Result<(), Box<dyn Error>> {
              let root = Path::new("tests/perl-corpus");
              let registry = seeded_concept_ids(root)?;
              let validations = validate_sidecars_in_dir(root, Some(&registry))?;
              let known_modes = [
                  ExpectationMode::ParseClean,
                  ExpectationMode::RecoverWithoutPanic,
                  ExpectationMode::ExpectedError,
                  ExpectationMode::TokenOnly,
                  ExpectationMode::SpanOnly,
              ];

              for mode in known_modes {
                  let matches_mode = validations
                      .iter()
                      .filter_map(|validation| parse_sidecar(&validation.sidecar_path).ok())
                      .any(|sidecar| sidecar.expect.mode == mode);
                  assert!(matches_mode, "missing seed sidecar for mode");
              }

              Ok(())
          }

          #[test]
          fn sidecars_fail_closed_without_registry() -> Result<(), Box<dyn Error>> {
              let root = Path::new("tests/perl-corpus");
              let validations = validate_sidecars_in_dir(root, None)?;

              assert!(!validations.is_empty());
              assert!(validations.iter().all(|validation| !validation.is_valid()));
              assert!(validations.iter().all(|validation| {
                  validation
                      .errors
                      .iter()
                      .any(|error| error.contains("registry unavailable"))
              }));
              Ok(())
          }

          #[test]
          fn sidecars_have_matching_fixture_files() -> Result<(), Box<dyn Error>> {
              let root = Path::new("tests/perl-corpus");
              let registry = seeded_concept_ids(root)?;
              let validations = validate_sidecars_in_dir(root, Some(&registry))?;

              for validation in validations {
                  assert!(validation.fixture_path.exists());
                  assert!(validation.is_valid(), "unexpected errors: {:?}", validation.errors);
              }

              Ok(())
          }
