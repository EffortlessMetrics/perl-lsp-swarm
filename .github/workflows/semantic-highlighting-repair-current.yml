name: Semantic highlighting repair current-main bootstrap

on:
  push:
    branches:
      - fix/semantic-highlighting-contracts-current

permissions:
  contents: write

concurrency:
  group: semantic-highlighting-repair-current-main
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout current-main repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: fix/semantic-highlighting-contracts-current
          fetch-depth: 0

      - name: Apply reviewed semantic-highlighting patch
        shell: bash
        run: |
          git fetch origin \
            +refs/heads/fix/semantic-highlighting-contracts:refs/remotes/origin/fix/semantic-highlighting-contracts
          git show \
            origin/fix/semantic-highlighting-contracts:.github/workflows/semantic-highlighting-repair-v2.yml \
            > /tmp/semantic-highlighting-repair-v2.yml

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('/tmp/semantic-highlighting-repair-v2.yml').read_text(
              encoding='utf-8'
          )
          opener = "          python3 - <<'PY'\n"
          start = workflow.index(opener) + len(opener)
          end = workflow.index("          PY\n", start)
          body = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          )
          Path('/tmp/apply-semantic-highlighting-repair.py').write_text(
              body + '\n', encoding='utf-8'
          )
          PY
          python3 /tmp/apply-semantic-highlighting-repair.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path('vscode-extension/src/test/packagedSemanticTokensSmoke.test.ts')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          matches = [
              index
              for index, line in enumerate(lines)
              if 'expect(rangeTokens)' in line
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f'packaged semantic range assertion match count: {len(matches)}'
              )
          index = matches[0]
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          replacement = [
              f'{indent}expect(rangeTokens).toHaveLength(expectedRangeTokens.length);\n',
              f'{indent}for (const [tokenIndex, actual] of rangeTokens.entries()) {{\n',
              f'{indent}  const expected = expectedRangeTokens[tokenIndex];\n',
              f'{indent}  if (!expected) {{\n',
              f'{indent}    throw new Error(`missing expected range token at index $' + '{tokenIndex}`);\n',
              f'{indent}  }}\n',
              f'{indent}  expect(actual.line).toBe(expected.line);\n',
              f'{indent}  expect(actual.startChar).toBe(expected.startChar);\n',
              f'{indent}  expect(actual.length).toBe(expected.length);\n',
              f'{indent}  expect(actual.type).toBe(expected.type);\n',
              f'{indent}  expect(actual.modifiers).toBe(expected.modifiers);\n',
              f'{indent}}}\n',
          ]
          lines[index : index + 1] = replacement
          path.write_text(''.join(lines), encoding='utf-8')
          PY

          grep -n -A16 -B8 'toHaveLength(expectedRangeTokens' \
            vscode-extension/src/test/packagedSemanticTokensSmoke.test.ts

      - name: Setup VS Code toolchain
        uses: ./.github/actions/setup-vscode-toolchain

      - name: Format changed TypeScript and manifest
        working-directory: vscode-extension
        run: npm exec --offline --no -- oxfmt --write package.json src/test/packagedSemanticTokensSmoke.test.ts

      - name: Regenerate and verify TextMate snapshots
        working-directory: vscode-extension
        run: |
          npm run test:grammar:update
          npm run test:grammar

      - name: Update source-backed VSIX inventory sizes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          extension = Path('vscode-extension')
          baseline_path = extension / 'scripts/vsix-inventory-baseline.json'
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          for packaged, source in {
              'package.json': extension / 'package.json',
              'syntaxes/perl.tmLanguage.json': extension / 'syntaxes/perl.tmLanguage.json',
          }.items():
              baseline['files'][packaged] = source.stat().st_size
          baseline['total_bytes'] = sum(baseline['files'].values())
          baseline_path.write_text(
              json.dumps(baseline, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Format and test Rust semantic disposition
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p perl-lsp-rs-core semantic_keyword_disposition --lib --locked

      - name: Build exact server and prove packaged full/range parity
        working-directory: vscode-extension
        run: |
          npm run compile:test
          npm run bundle-lsp
          PERL_LSP_REQUIRE_PACKAGED_SEMANTIC_SMOKE=true \
            node scripts/run-jest.js --runTestsByPath src/test/packagedSemanticTokensSmoke.test.ts
          npm run compile

          python3 - <<'PY'
          import json
          from pathlib import Path

          extension = Path.cwd()
          baseline_path = extension / 'scripts/vsix-inventory-baseline.json'
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          for packaged, source in {
              'out/extension.js': extension / 'out/extension.js',
              'bin/linux-x64/perllsp': extension / 'bin/linux-x64/perllsp',
          }.items():
              if not source.is_file():
                  raise SystemExit(f'missing packaged inventory source: {source}')
              baseline['files'][packaged] = source.stat().st_size
          baseline['total_bytes'] = sum(baseline['files'].values())
          baseline_path.write_text(
              json.dumps(baseline, indent=2) + '\n', encoding='utf-8'
          )
          PY

          npm run package

      - name: Commit reviewed repair and remove bootstrap
        shell: bash
        run: |
          rm .github/workflows/semantic-highlighting-repair-current.yml
          git diff --check

          python3 - <<'PY'
          import subprocess

          allowed = {
              '.github/workflows/publish-extension.yml',
              '.github/workflows/semantic-highlighting-repair-current.yml',
              'crates/perl-lsp-rs-core/src/providers/semantic_tokens/semantic_tokens.rs',
              'vscode-extension/package.json',
              'vscode-extension/scripts/vsix-inventory-baseline.json',
              'vscode-extension/src/test/packagedSemanticTokensSmoke.test.ts',
              'vscode-extension/syntaxes/perl.tmLanguage.json',
              'vscode-extension/test/grammar/fixtures/function_declarations.pl',
              'vscode-extension/test/grammar/fixtures/function_declarations.pl.snap',
          }
          changed = {
              line
              for line in subprocess.check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines()
              if line
          }
          unexpected = sorted(changed - allowed)
          missing = sorted(
              {
                  '.github/workflows/publish-extension.yml',
                  '.github/workflows/semantic-highlighting-repair-current.yml',
                  'crates/perl-lsp-rs-core/src/providers/semantic_tokens/semantic_tokens.rs',
                  'vscode-extension/package.json',
                  'vscode-extension/scripts/vsix-inventory-baseline.json',
                  'vscode-extension/src/test/packagedSemanticTokensSmoke.test.ts',
                  'vscode-extension/syntaxes/perl.tmLanguage.json',
                  'vscode-extension/test/grammar/fixtures/function_declarations.pl',
                  'vscode-extension/test/grammar/fixtures/function_declarations.pl.snap',
              }
              - changed
          )
          if unexpected:
              raise SystemExit(f'unexpected changed paths: {unexpected}')
          if missing:
              raise SystemExit(f'expected changed paths missing: {missing}')
          PY

          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            .github/workflows/publish-extension.yml \
            .github/workflows/semantic-highlighting-repair-current.yml \
            crates/perl-lsp-rs-core/src/providers/semantic_tokens/semantic_tokens.rs \
            vscode-extension/package.json \
            vscode-extension/scripts/vsix-inventory-baseline.json \
            vscode-extension/src/test/packagedSemanticTokensSmoke.test.ts \
            vscode-extension/syntaxes/perl.tmLanguage.json \
            vscode-extension/test/grammar/fixtures/function_declarations.pl \
            vscode-extension/test/grammar/fixtures/function_declarations.pl.snap
          git diff --cached --check
          git commit -m "fix(editor): close semantic highlighting contract gaps"
          git push origin HEAD:fix/semantic-highlighting-contracts-current
