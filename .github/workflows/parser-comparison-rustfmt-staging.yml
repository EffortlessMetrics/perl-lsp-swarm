name: One-use parser-comparison rustfmt staging

on:
  push:
    branches:
      - agent/parser-comparison-rustfmt-staging-9964-20260816

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'EffortlessSteven'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install pinned formatter toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format the parser-comparison package
        run: cargo fmt -p perl-parser-comparison

      - name: Validate the bounded formatter delta
        id: delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              crates/perl-parser-comparison/src/*.rs|crates/perl-parser-comparison/tests/*.rs)
                ;;
              *)
                echo "unexpected rustfmt mutation: $path" >&2
                exit 1
                ;;
            esac
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit exact formatter delta to the staging ref
        if: steps.delta.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add crates/perl-parser-comparison/src crates/perl-parser-comparison/tests
          git commit -m "style(parser-comparison): apply exact rustfmt output"
          git push origin "HEAD:${GITHUB_REF_NAME}"
