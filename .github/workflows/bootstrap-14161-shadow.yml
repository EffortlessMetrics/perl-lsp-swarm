name: Bootstrap additive non-Rust policy shadow

on:
  push:
    branches:
      - codex/14161-exact-tree-non-rust-policy

permissions:
  contents: write

concurrency:
  group: bootstrap-14161-shadow
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'EffortlessMetrics/perl-lsp-swarm' && github.ref == 'refs/heads/codex/14161-exact-tree-non-rust-policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact bootstrap subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0

      - name: Restore additive shadow tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import textwrap
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          blobs = {
              ".github/workflows/non-rust-policy-shadow.yml": "cd6ea1c5a52f0803325b15b136ad5876b7aa6d7a",
              "scripts/ci/non_rust_policy_shadow.py": "e777d7bb723bac0e5506039086db05036e3b35ba",
              "scripts/ci/test_non_rust_policy_shadow.py": "df3edc74a1054a139715da4d09dafe4ac95b86a4",
              "docs/ci/non-rust-policy-shadow.md": "1e8c1f30016dae58a4428fad3a118f4f7bae69f5",
          }
          for raw_path, blob_sha in blobs.items():
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs/{blob_sha}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              if payload.get("encoding") != "base64":
                  raise SystemExit(f"unexpected blob encoding for {raw_path}")
              path = Path(raw_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(payload["content"]))

          test_path = Path("scripts/ci/test_non_rust_policy_shadow.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_healer_assertion = '''        healer = (
              self.root / ".github/workflows/post-merge-status-update.yml"
          ).read_text(encoding="utf-8")
          self.assertIn("non-rust inventory --write", healer)
          '''
          new_healer_assertion = '''        workflows = [
              path.read_text(encoding="utf-8")
              for path in (self.root / ".github/workflows").glob("*.yml")
          ]
          self.assertTrue(
              any("non-rust inventory --write" in workflow for workflow in workflows),
              "existing post-merge inventory healer must remain present",
          )
          '''
          if old_healer_assertion not in test_text:
              raise SystemExit("expected healer assertion not found in test source")
          test_path.write_text(
              test_text.replace(old_healer_assertion, new_healer_assertion),
              encoding="utf-8",
          )

          def append_once(raw_path: str, marker: str, block: str) -> None:
              path = Path(raw_path)
              text = path.read_text(encoding="utf-8")
              if marker in text:
                  return
              path.write_text(
                  text.rstrip() + "\n\n" + textwrap.dedent(block).strip() + "\n",
                  encoding="utf-8",
              )

          append_once(
              ".ci/policies/required-checks.toml",
              'name = "Non-Rust policy exact-tree shadow"',
              """
          [[checks]]
          name = "Non-Rust policy exact-tree shadow"
          producer = "repository-job"
          workflow = ".github/workflows/non-rust-policy-shadow.yml"
          job = "exact-tree-shadow"
          workflow_result = "propagate"
          events = ["pull_request", "merge_group", "push", "workflow_dispatch"]
          required = false
          policy_role = "advisory"
          applicability = "always-or-scoped-noop"
          enforcement = "neither"
          reason = "Additive #14161 shadow: binds current-tree non-Rust classification to ci-subject.v1 and publishes receipts while the committed snapshot, existing gate, post-merge healer, and live ruleset remain authoritative."
          """,
          )
          append_once(
              "policy/ci-lane-whitelist.toml",
              'id = "non_rust_policy_exact_tree_shadow"',
              """
          [[lane]]
          id = "non_rust_policy_exact_tree_shadow"
          workflow = ".github/workflows/non-rust-policy-shadow.yml"
          job = "exact-tree-shadow"
          tier = "frontdoor"
          kind = "policy"
          blocking = false
          default_pr = true
          runner = "ubuntu_24_04"
          base_lem = 2
          owner = "ci"
          intent = "Measure exact-subject non-Rust classification as an additive migration shadow without replacing the committed inventory authority."
          failure_mode = "A candidate adds an unclassified non-Rust path or the receipt cannot be bound to the evaluated commit and tree."
          proof_obligation = "Resolve ci-subject.v1, generate a complete current-tree inventory, reject only newly added unclassified paths, and disclose committed-snapshot parity."
          evidence = [
            "target/receipts/ci-subject/non-rust-policy-shadow.json",
            "target/receipts/non-rust-policy-shadow.json",
            "target/policy/non-rust-inventory.json",
            "target/policy/non-rust-inventory.md",
          ]
          allowed_triggers = ["pull_request", "push", "merge_group", "workflow_dispatch"]
          expensive = false
          duplicate_of = ["gate:non_rust_inventory_check"]
          review_after = "2026-09-30"
          expires = "2026-11-30"
          """,
          )
          Path(".github/workflows/bootstrap-14161-shadow.yml").unlink()
          PY
          git add -A

      - name: Prove shadow instrument and repository wiring
        run: python3 -m unittest scripts/ci/test_non_rust_policy_shadow.py

      - name: Prove immutable subject authority
        run: cargo test -p xtask --test ci_subject --locked

      - name: Prove workflow lane policy
        run: cargo xtask workflow-policy-lint --check-lane-whitelist --receipt target/receipts/workflow-policy.json

      - name: Regenerate the preserved committed inventory
        run: |
          set -euo pipefail
          cargo xtask non-rust inventory --write
          git add docs/policy/NON_RUST_INVENTORY.md
          CI_SCOPE_BASE=origin/main cargo xtask non-rust inventory --check

      - name: Commit the final review tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          git status --short
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git commit -m "ci(policy): install additive exact-tree shadow (#14161)"
          git push origin HEAD:codex/14161-exact-tree-non-rust-policy
