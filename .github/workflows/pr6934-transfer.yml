name: PR 6934 verified transfer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr6934-transfer.yml'

permissions:
  contents: write
  issues: read

jobs:
  apply-transfer:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Recover and apply exact generated-status repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import re
          import tarfile
          import urllib.request
          from pathlib import Path

          expected = {
              '.ci/schemas/generated-status-cell.schema.json': (1990, 'd578b37fe1db7e1b184394821e0541641aaca2b942254b77724ac568a398c692'),
              '.github/workflows/generated-status-contract.yml': (1632, '220c16cb3c3a33918e308ea73a3bb6c62e8a06b8e47737a531b16df724c7e4fa'),
              'docs/project/status/generated-status-cells.json': (1789, 'fb77e543ebad84c769ba73ed85e0924586db2d91900a4865486a834f91fa0fa8'),
              'docs/project/status/generated-status-cells.md': (631, 'f2b38780f622c2c5d3967a319f4519b0a913ebc23e35789ba094bfa15f727721'),
              'policy/generated-status-evidence.json': (1239, 'f0f6fff7266bb52fe170250ac3929b105f4b85738f51b580102c4d03aff01db2'),
              'xtask/Cargo.toml': (2501, '890ca0abba409b01717a7eebbf53cfee23f7c75d0ad9ba32e71030fa38d88717'),
              'xtask/src/bin/generated-status-contract.rs': (12080, '5504c24d46db5e5c3d0e90cfbb5cbbb36dc337ea6498e019ff2bcc8c7ff73d2d'),
          }
          request = urllib.request.Request(
              'https://api.github.com/repos/EffortlessMetrics/perl-lsp-swarm/issues/comments/5261936641',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'perl-lsp-swarm-pr6934-transfer',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              body = json.load(response)['body']

          begin = 'BEGIN PR6934 TAR.GZ BASE64\n'
          end = '\nEND PR6934 TAR.GZ BASE64'
          if begin not in body or end not in body:
              raise SystemExit('transfer markers missing')
          encoded = ''.join(
              line.strip()
              for line in body.split(begin, 1)[1].split(end, 1)[0].splitlines()
              if line.strip()
          )
          if re.search(r'[^A-Za-z0-9+/=]', encoded):
              raise SystemExit('transfer contains non-base64 characters')
          archive = base64.b64decode(encoded, validate=True)
          archive_digest = hashlib.sha256(archive).hexdigest()
          if len(archive) != 6211 or archive_digest != 'fbedced33d711e5fa5424ee14218e8e82476fda7cce4538989f12d58c4a1729b':
              raise SystemExit(f'transfer mismatch: {len(archive)} bytes / {archive_digest}')

          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              members = bundle.getmembers()
              names = sorted(member.name for member in members)
              if names != sorted(expected):
                  raise SystemExit(f'unexpected transfer path set: {names!r}')
              for member in members:
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe transfer member: {member.name}')
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f'unreadable transfer member: {member.name}')
                  data = source.read()
                  length, digest = expected[member.name]
                  observed = hashlib.sha256(data).hexdigest()
                  if len(data) != length or observed != digest:
                      raise SystemExit(
                          f'{member.name}: expected {length}/{digest}, got {len(data)}/{observed}'
                      )
                  destination = Path(member.name)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
          PY
          git rm .github/workflows/pr6934-transfer.yml
          git diff --check
          git status --short

      - name: Commit repaired candidate files
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add \
            .ci/schemas/generated-status-cell.schema.json \
            .github/workflows/generated-status-contract.yml \
            docs/project/status/generated-status-cells.json \
            docs/project/status/generated-status-cells.md \
            policy/generated-status-evidence.json \
            xtask/Cargo.toml \
            xtask/src/bin/generated-status-contract.rs
          git commit -m 'fix(status): derive projections from typed evidence'
          echo "TRANSFER_COMMIT=$(git rev-parse HEAD)"
          git push origin "HEAD:${HEAD_BRANCH}"
