name: Address PR #11976 review

on:
  push:
    branches:
      - fix/4997-generic-channel-ai-arm
    paths:
      - scripts/maintenance/address_11976_review.py
      - .github/workflows/address-11976-review.yml
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - scripts/maintenance/address_11976_review.py
      - .github/workflows/address-11976-review.yml

permissions:
  contents: write

concurrency:
  group: address-11976-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'EffortlessMetrics/perl-lsp-swarm'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/4997-generic-channel-ai-arm
          fetch-depth: 0

      - name: Configure repository identity
        run: |
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com

      - name: Integrate current main
        run: |
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply count-checked review repairs
        run: python3 scripts/maintenance/address_11976_review.py

      - name: Format and validate focused contracts
        run: |
          cargo fmt --all -- --check
          python3 -m json.tool schemas/perllsp-settings.schema.json >/dev/null
          python3 -m json.tool .ci/fixtures/zed-perl-upstream/settings-behavior.v1.json >/dev/null
          cargo test -p perl-lsp-rs-core hostile_and_malformed_traffic_preserves_accepted_trusted_ai_state --locked
          cargo test -p perl-lsp-rs-core --test perllsp_settings_schema_tests --locked
          cargo test -p xtask --test zed_settings_behavior --locked
          cargo test -p perl-lsp-rs --test lsp_streaming_completion_tests --locked hostile_generic
          git diff --check

      - name: Publish repair commit and remove one-shot machinery
        env:
          BRANCH: fix/4997-generic-channel-ai-arm
        run: |
          rm -- scripts/maintenance/address_11976_review.py
          rm -- .github/workflows/address-11976-review.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(ai-completion): address #11976 review findings'
          git push origin HEAD:"$BRANCH"
