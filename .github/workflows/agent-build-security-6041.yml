name: Agent build security 6041

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/security-workflow-ratchet-6041'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/security-workflow-ratchet-6041
          fetch-depth: 0
          persist-credentials: false
      - name: Finalize and test scanner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/test_workflow_security_ratchet.py')
          text = path.read_text(encoding='utf-8')
          if 'import sys\n' not in text:
              text = text.replace('import os\n', 'import os\nimport sys\n', 1)
          text = text.replace('ratchet = importlib.util.module_from_spec(SPEC)\nSPEC.loader.exec_module(ratchet)', 'ratchet = importlib.util.module_from_spec(SPEC)\nsys.modules[SPEC.name] = ratchet\nSPEC.loader.exec_module(ratchet)')
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/agent-build-security-6041.yml .agent-trigger-6041
          python3 -m unittest scripts/ci/test_workflow_security_ratchet.py
          python3 scripts/ci/workflow_security_ratchet.py baseline --root . --output .ci/workflow-security-baseline.json
          python3 scripts/ci/workflow_security_ratchet.py check --root . --baseline .ci/workflow-security-baseline.json --report target/receipts/workflow-security-bootstrap.json
          cp .ci/workflow-security-baseline.json "$RUNNER_TEMP/baseline.json"
          python3 scripts/ci/workflow_security_ratchet.py baseline --root . --output .ci/workflow-security-baseline.json
          cmp "$RUNNER_TEMP/baseline.json" .ci/workflow-security-baseline.json
          git diff --check
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
      - name: Run workflow contracts
        run: |
          cargo run -p xtask --locked -- workflow-policy-lint
          cargo run -p xtask --locked -- workflow-trigger-lint
      - name: Create unreferenced verified commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: 'security(ci): add trusted-base workflow ratchet (#6041)'
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']
          parent=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); api=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def call(method,url,payload=None):
              req=urllib.request.Request(url,data=None if payload is None else json.dumps(payload).encode(),method=method,headers=headers)
              with urllib.request.urlopen(req) as response: return json.load(response)
          base_tree=call('GET',f'{api}/git/commits/{parent}')['tree']['sha']; entries=[]
          for relative in ('.github/workflows/workflow-security-ratchet.yml','.ci/workflow-security-baseline.json','scripts/ci/workflow_security_ratchet.py','scripts/ci/test_workflow_security_ratchet.py'):
              content=Path(relative).read_text(encoding='utf-8')
              blob=call('POST',f'{api}/git/blobs',{'content':content,'encoding':'utf-8'})['sha']
              mode='100755' if relative=='scripts/ci/workflow_security_ratchet.py' else '100644'
              entries.append({'path':relative,'mode':mode,'type':'blob','sha':blob})
          for relative in ('.github/workflows/agent-build-security-6041.yml','.agent-trigger-6041'):
              entries.append({'path':relative,'mode':'100644','type':'blob','sha':None})
          tree=call('POST',f'{api}/git/trees',{'base_tree':base_tree,'tree':entries})['sha']
          commit=call('POST',f'{api}/git/commits',{'message':os.environ['COMMIT_MESSAGE'],'tree':tree,'parents':[parent]})['sha']
          Path('target/security-6041-commit.txt').parent.mkdir(parents=True,exist_ok=True)
          Path('target/security-6041-commit.txt').write_text(commit+'\n',encoding='utf-8')
          print(commit)
          PY
      - name: Upload verified commit identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-6041-commit-${{ github.run_id }}
          path: target/security-6041-commit.txt
          if-no-files-found: error
          retention-days: 3
