name: Temporary apply release attestations

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/_tmp_apply_release_attestations.py
      - .github/workflows/_tmp-apply-release-attestations.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/release-artifact-attestations
          fetch-depth: 0

      - name: Apply guarded edit
        run: python3 scripts/_tmp_apply_release_attestations.py

      - name: Validate resulting contract
        run: |
          set -euo pipefail
          test "$(grep -c 'actions/attest@a1948c3f048ba23858d222213b7c278aabede763' .github/workflows/release.yml)" -eq 2
          grep -q 'cargo install cargo-sbom --version 0.10.0 --locked' .github/workflows/release.yml
          grep -q 'artifact-metadata: write' .github/workflows/release.yml
          ! grep -q '^  release:$' .github/workflows/release.yml
          ! grep -q 'cargo install cargo-sbom --locked || true' .github/workflows/release.yml
          git diff --check

      - name: Commit permanent files only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml
          git rm .github/workflows/_tmp-apply-release-attestations.yml scripts/_tmp_apply_release_attestations.py
          git commit -m "build(release): attest artifacts before publication (#4145)"
          git push origin HEAD:agent/release-artifact-attestations
