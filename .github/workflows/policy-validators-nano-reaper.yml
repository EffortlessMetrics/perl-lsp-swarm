# Policy Validators Nano Reaper
#
# The trusted `Validate CI policy ledgers (self-hosted)` lane runs on the
# em-ci-nano self-hosted pool. When that pool is unreachable, the job queues
# forever (job queue time ignores timeout-minutes) and the affected run and
# its check stay pending (#15900). The aggregate lane already fail-overs the
# required verdict to the hosted twin; this scheduled reaper supplies the
# missing explicit terminal state: it cancels runs whose trusted-lane job
# stayed queued without a runner past the service window, and records
# actionable diagnostics.
#
# The cancel is issued at RUN level (`POST /repos/{owner}/{repo}/actions/
# runs/{run_id}/cancel`), not at job level. The job-level endpoint
# (`POST .../actions/jobs/{job_id}/cancel`) has been failing for every
# queued trusted lane since the reaper landed (#15900 evidence: reaper runs
# from 2026-09-24T09:49Z onward log "the cancel API call failed" for every
# candidate, while the endpoint no longer appears in GitHub's current REST
# API description). Run-level cancel reaches queued jobs that never
# received a runner: every run-level/concurrency cancel in this repository
# flipped the queued trusted job to `cancelled` (for example job on run
# 36511849584: queued 2026-09-29T02:16:56Z with no runner, cancelled
# 2026-09-29T02:18:47Z when the next push cancelled the run).
#
# A run is only cancelled when every other job of that run is already
# completed, so a cancel can never interrupt live hosted or aggregate work;
# a run whose aggregate is still polling is left for the next 15-minute
# tick. A failed cancel call fails the step (scheduled-workflow failure
# notifies maintainers) instead of being swallowed into a green run, which
# is how the dead job-level endpoint went unnoticed for days.
#
# See policy/ci-lane-whitelist.toml entry `policy_validators_nano_reaper`.

name: Policy Validators Nano Reaper

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: policy-validators-nano-reaper
  cancel-in-progress: false

permissions:
  contents: read
  # actions: write is required by the deadline cancel of runs whose
  # trusted-lane job queued forever (#15900). This workflow is
  # schedule/dispatch-triggered only and checks out no code, so it holds no
  # candidate write surface.
  actions: write

jobs:
  reap:
    name: Cancel queued trusted lanes past service window
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel queued trusted lanes past service window
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NANO_JOB: Validate CI policy ledgers (self-hosted)
          NANO_WORKFLOW: policy-validators.yml
          MAX_QUEUE_SECONDS: 900
        run: |
          set -euo pipefail
          cancelled=0
          failed=0
          {
            echo "### Policy Validators trusted-lane reaper"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          run_ids="$(gh api "repos/$REPO/actions/workflows/$NANO_WORKFLOW/runs?status=queued&per_page=100" --paginate \
            --jq '.workflow_runs[] | .id')"
          tmpdir="$(mktemp -d)"
          for run_id in $run_ids; do
            job_line="$(gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" \
              --jq ".jobs[] | select(.name == \"$NANO_JOB\" and .status == \"queued\" and (.conclusion | not)) | \"\\(.id) \\(.started_at)\"")"
            [ -n "$job_line" ] || continue
            job_id="$(printf '%s' "$job_line" | head -n 1 | cut -d ' ' -f 1)"
            queued_at="$(printf '%s' "$job_line" | head -n 1 | cut -d ' ' -f 2)"
            age=$(( $(date -u +%s) - $(date -u -d "$queued_at" +%s) ))
            [ "$age" -ge "$MAX_QUEUE_SECONDS" ] || continue
            pending_others="$(gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" \
              --jq ".jobs[] | select(.name != \"$NANO_JOB\" and .status != \"completed\") | .id")"
            if [ -n "$pending_others" ]; then
              echo "::notice::Trusted lane job $job_id on run $run_id queued with no runner for ${age}s, but the run still has non-completed jobs; deferring to the next tick so a cancel cannot interrupt live work."
              continue
            fi
            err_file="$tmpdir/cancel-$run_id.err"
            if gh api -X POST "repos/$REPO/actions/runs/$run_id/cancel" 2>"$err_file" >/dev/null; then
              cancelled=$((cancelled + 1))
              echo "::warning::Cancelled run $run_id whose trusted lane job $job_id queued with no runner for ${age}s (runner group em-ci-nano, labels self-hosted/linux/x64/em-ci/trusted-pr/workflow-nano). The run's required verdict already fail-overed to the hosted lane. See issue #15900."
              echo "- Cancelled run $run_id (trusted job $job_id queued ${age}s with no runner, group em-ci-nano)." >> "$GITHUB_STEP_SUMMARY"
            else
              failed=$((failed + 1))
              api_status="$(sed -n 's/.*(HTTP \([0-9][0-9][0-9]\)).*/\1/p' "$err_file" | tail -n 1)"
              echo "::warning::Run-level cancel for run $run_id (trusted job $job_id queued ${age}s with no runner) failed${api_status:+ with HTTP $api_status}; raw: $(tail -n 1 "$err_file"). Investigate. See issue #15900."
              echo "- Cancel failed for run $run_id${api_status:+ (HTTP $api_status)}." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          {
            echo "- Cancelled $cancelled queued trusted run(s) past the ${MAX_QUEUE_SECONDS}s service window; $failed cancel call(s) failed."
            echo "- Follow-up: verify em-ci-nano runner registration and connectivity before the next trusted run."
          } >> "$GITHUB_STEP_SUMMARY"
          # A failed cancel call must not masquerade as a green tick: the
          # scheduled workflow failing is the signal maintainers see.
          [ "$failed" -eq 0 ]
