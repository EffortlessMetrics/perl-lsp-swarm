name: Rustfmt #13473 finalize candidate

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/rustfmt-13473-artifact.yml

permissions:
  contents: write

concurrency:
  group: rustfmt-13473-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'EffortlessMetrics/perl-lsp-swarm' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/13473-rustfmt-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Materialize and commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

          cat > /tmp/expected-paths <<'EOF'
          crates/perl-corpus/src/api/root.rs
          crates/perl-corpus/src/files.rs
          crates/perl-corpus/tests/distribution_contract.rs
          crates/perl-corpus/tests/root_path_authority.rs
          crates/perl-parser-core/tests/fix_range_precedence_13128.rs
          xtask/src/tasks/update_status/parser/accuracy.rs
          xtask/tests/parser_accuracy_legacy_oracle_policy.rs
          EOF

          cat > /tmp/expected-sha256 <<'EOF'
          2174f6b4d771572442611c1eb9ff39004c3f13e67800cf0e3dbb1c8be4219095  crates/perl-corpus/src/api/root.rs
          ad33d677f75fdb0bc14215ed115cc9d6654a164e3029705dff970edb6f519d77  crates/perl-corpus/src/files.rs
          a1376ea97f36f53fdc69fa7978de2d5de00ad36c6127ec3633d1acb148d44c4a  crates/perl-corpus/tests/distribution_contract.rs
          c5e81a429558409dbd301fda9ed3d47a11971ecc345a6b14f41ced9bd4ab10e3  crates/perl-corpus/tests/root_path_authority.rs
          961e018a71bb3d0ad0d6db95629c33c208b75be65f560efe44f64e0292e62aa1  crates/perl-parser-core/tests/fix_range_precedence_13128.rs
          3d5a7ccc50a91b854613534c77cc57998e2fa45f1a954dc4d06c7ec15c1c40e5  xtask/src/tasks/update_status/parser/accuracy.rs
          a09b768b96187dad97ba5fd7fc74e82ed7742ca693fd78c5681153e3731e080f  xtask/tests/parser_accuracy_legacy_oracle_policy.rs
          EOF

          cargo fmt --all
          git diff --name-only -- '*.rs' | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          sha256sum -c /tmp/expected-sha256

          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          while IFS= read -r path; do
            git add -- "$path"
          done < /tmp/expected-paths
          git rm -- .github/workflows/rustfmt-13473-artifact.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git commit -m "style: restore current-main Rust formatting (#13473)"
          git push origin HEAD:refs/heads/codex/13473-rustfmt-main
