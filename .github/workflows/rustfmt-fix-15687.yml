name: One-shot rustfmt repair for #15687

on:
  push:
    branches:
      - agent/clippy-kernel-package-partition

permissions:
  contents: write

jobs:
  format:
    name: Apply pinned rustfmt and remove this workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout formatter subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned formatter
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Format xtask
        run: cargo +1.95.0 fmt --manifest-path xtask/Cargo.toml

      - name: Commit formatted source and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git rm .github/workflows/rustfmt-fix-15687.yml
          git add xtask/src/tasks/gate_policy.rs
          git diff --cached --check
          git commit -m "chore(fmt): apply rustfmt to gate policy partition"
          git push origin HEAD:agent/clippy-kernel-package-partition
