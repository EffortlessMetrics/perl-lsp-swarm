name: UX Regression Gate

# Run the first-five-minutes Rust UX harness and the VS Code extension test
# surface against one exact candidate. Candidate code receives read-only
# repository authority, no persisted credential, and no repository secret.

on:
  pull_request:
    branches: [main, master]
    # Label changes must not restart and cancel active candidate execution.
    types: [opened, synchronize, reopened]
    paths:
      - 'crates/perl-lsp*/**'
      - 'crates/perl-dap*/**'
      - 'crates/perl-lsp-ux-tests/**'
      - 'vscode-extension/**'
      - 'features.toml'
      - '.github/workflows/ux-regression-gate.yml'
  workflow_dispatch: {}

concurrency:
  group: ux-regression-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# TESTED_SHA is deliberately NOT a workflow- or job-level `env:`. Candidate code
# invoked by `just ux-tests` can append `TESTED_SHA=<any value>` to $GITHUB_ENV,
# and GitHub then supplies that value to every subsequent step — which would let
# the candidate choose the subject that the receipt emitter records and that the
# verifier then checks against, so the two would agree on an attacker-selected
# SHA and the identity binding would prove nothing. Every step below that must
# be anchored to the real candidate declares TESTED_SHA in its own step-level
# `env:` from the immutable `github` context. Step-level env takes precedence
# over anything written to $GITHUB_ENV, so it cannot be rebound.

jobs:
  ux-regression-gate:
    name: UX Regression Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify tested candidate identity
        env:
          TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse 'HEAD^{commit}')"
          if [ "$actual_sha" != "$TESTED_SHA" ]; then
            printf '::error::Checked-out candidate %s does not match tested SHA %s\n' \
              "$actual_sha" "$TESTED_SHA"
            exit 1
          fi
          printf 'Testing exact candidate %s\n' "$TESTED_SHA"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0

      - name: Install just
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ux-gate-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            perl \
            perltidy \
            libperl-critic-perl
          perl --version
          perltidy --version 2>&1 | head -1 || true
          perlcritic --version 2>&1 | head -1 || true

      - name: Check UX test harness availability
        id: harness_check
        run: |
          set -euo pipefail
          has_crate=false
          has_recipe=false

          if cargo metadata --no-deps --quiet 2>/dev/null | \
              python3 -c "import json,sys; pkgs=json.load(sys.stdin)['packages']; \
                          names=[p['name'] for p in pkgs]; \
                          sys.exit(0 if 'perl-lsp-ux-tests' in names else 1)" 2>/dev/null
          then
            has_crate=true
          fi

          if just --list 2>/dev/null | grep -q 'ux-tests'; then
            has_recipe=true
          fi

          if [ "$has_crate" = "true" ] && [ "$has_recipe" = "true" ]; then
            echo "harness_available=true" >> "$GITHUB_OUTPUT"
            echo "UX test harness detected; gate is active."
          else
            echo "harness_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UX test harness is unavailable; this candidate cannot produce UX evidence."
          fi

      - name: Run UX regression tests
        id: ux_tests
        continue-on-error: true
        if: steps.harness_check.outputs.harness_available == 'true'
        run: |
          set -o pipefail
          mkdir -p target/receipts
          set +e
          just ux-tests 2>&1 | tee target/receipts/ux-regression.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test_status="${pipeline_status[0]}"
          tee_status="${pipeline_status[1]}"
          printf '%s\n' "$test_status" > target/receipts/ux-regression.exit
          if [ "$tee_status" -ne 0 ]; then
            printf '%s\n' "$tee_status" > target/receipts/ux-regression.instrumentation.exit
            printf '::error::UX regression tee failed with status %s\n' "$tee_status" >&2
            exit "$tee_status"
          fi
          printf '0\n' > target/receipts/ux-regression.instrumentation.exit
          exit "$test_status"

      - name: Emit structured UX regression receipt
        if: always() && steps.harness_check.outputs.harness_available == 'true'
        env:
          TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          cargo xtask ux-regression-receipt \
            --input target/receipts/ux-regression.log \
            --receipt target/receipts/ux-regression.json \
            --exit-status-file target/receipts/ux-regression.exit \
            --sha "$TESTED_SHA"

      - name: Verify receipt subject identity
        id: verify_receipt
        if: always() && steps.harness_check.outputs.harness_available == 'true'
        env:
          TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt_path = Path("target/receipts/ux-regression.json")
          instrumentation_path = Path("target/receipts/ux-regression.instrumentation.exit")
          if not instrumentation_path.is_file() or instrumentation_path.is_symlink():
              raise SystemExit("UX receipt instrumentation status is missing or not a regular file")
          if instrumentation_path.read_text(encoding="utf-8").strip() != "0":
              raise SystemExit("UX receipt instrumentation failed")
          if not receipt_path.is_file() or receipt_path.is_symlink():
              raise SystemExit("UX receipt is missing or not a regular file")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          if receipt.get("sha") != os.environ["TESTED_SHA"]:
              raise SystemExit(
                  f"UX receipt subject {receipt.get('sha')!r} does not match "
                  f"{os.environ['TESTED_SHA']}"
              )
          PY

      # Evidence publication is gated on the subject check. Uploading on bare
      # `always()` would publish a receipt whose subject the verifier had just
      # rejected, under an artifact name asserting the exact candidate SHA — the
      # artifact would carry more authority than the check that produced it.
      - name: Upload UX regression evidence
        if: always() && steps.harness_check.outputs.harness_available == 'true' && steps.verify_receipt.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ux-regression-gate-receipt-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            target/receipts/ux-regression.json
            target/receipts/ux-regression.log
            target/receipts/ux-regression.exit
            target/receipts/ux-regression.instrumentation.exit
            target/receipts/editor-ux/golden-editor-workload-v3.json
          if-no-files-found: warn
          retention-days: 7

      # Unverified output is still worth keeping for triage, but under a name
      # that does not claim to be evidence about a specific candidate.
      - name: Upload unverified UX diagnostics
        if: always() && steps.harness_check.outputs.harness_available == 'true' && steps.verify_receipt.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ux-regression-gate-unverified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/receipts/ux-regression.json
            target/receipts/ux-regression.log
            target/receipts/ux-regression.exit
            target/receipts/ux-regression.instrumentation.exit
          if-no-files-found: warn
          retention-days: 7

      - name: Convert UX regression receipt to JUnit
        if: always() && steps.harness_check.outputs.harness_available == 'true'
        run: |
          python3 scripts/ci/receipts-to-junit.py \
            --input target/receipts/ux-regression.json \
            --output target/test-results/ux-regression-gate-junit.xml \
            --suite-name ux-regression-gate

      - name: Upload test results to Codecov without a repository secret
        if: always() && steps.harness_check.outputs.harness_available == 'true'
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          report_type: test_results
          files: target/test-results/ux-regression-gate-junit.xml
          fail_ci_if_error: false

      - name: Summarize UX evidence
        if: always()
        env:
          TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          HARNESS_AVAILABLE: ${{ steps.harness_check.outputs.harness_available }}
          UX_TEST_OUTCOME: ${{ steps.ux_tests.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          tested_sha = os.environ["TESTED_SHA"]
          harness_available = os.environ.get("HARNESS_AVAILABLE") == "true"
          test_outcome = os.environ.get("UX_TEST_OUTCOME") or "not_run"
          log_path = Path("target/receipts/ux-regression.log")
          receipt_path = Path("target/receipts/ux-regression.json")

          lines = [
              "## UX Regression Gate",
              "",
              f"- Exact tested SHA: `{tested_sha}`",
              f"- Harness available: `{str(harness_available).lower()}`",
              f"- Test step outcome: `{test_outcome}`",
              "",
          ]

          if not harness_available:
              lines += [
                  "> **NOT PROVEN** — the UX harness was not available.",
                  "",
                  "Expected local reproduction: `just ux-tests`.",
              ]
          else:
              log_lines = (
                  log_path.read_text(encoding="utf-8").splitlines()
                  if log_path.exists()
                  else []
              )
              passed = sum(
                  bool(re.search(r"^\s*test\s+\S+\s+\.\.\.\s+ok\s*$", line))
                  for line in log_lines
              )
              failed_lines = [
                  line.strip()
                  for line in log_lines
                  if re.search(r"^\s*test\s+\S+\s+\.\.\.\s+FAILED\s*$", line)
              ]
              ignored = sum(
                  bool(re.search(r"^\s*test\s+\S+\s+\.\.\.\s+ignored\s*$", line))
                  for line in log_lines
              )
              lines += [
                  "| Result | Count |",
                  "| --- | ---: |",
                  f"| Passed | {passed} |",
                  f"| Failed | {len(failed_lines)} |",
                  f"| Ignored | {ignored} |",
                  "",
              ]
              if failed_lines:
                  lines += ["### Failed scenarios", ""]
                  lines.extend(f"- `{line}`" for line in failed_lines)
                  lines += ["", "Reproduce with `just ux-tests`."]
              else:
                  lines.append("No cargo-test failure line was reported.")

              if receipt_path.exists():
                  try:
                      receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
                  except (OSError, ValueError):
                      receipt = None
                  if isinstance(receipt, dict):
                      lines += [
                          "",
                          "### Structured evidence",
                          "",
                          f"- Failure class: `{receipt.get('failure_class') or 'n/a'}`",
                          f"- First failing test: `{receipt.get('first_failing_test') or 'n/a'}`",
                          f"- Panic location: `{receipt.get('panic_location') or 'n/a'}`",
                          f"- Repro: `{receipt.get('canonical_repro') or receipt.get('friendly_repro') or 'just ux-tests'}`",
                          f"- Route: `{receipt.get('route') or 'triage'}`",
                      ]

          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Fail UX regression gate on test failures
        if: steps.harness_check.outputs.harness_available == 'true' && steps.ux_tests.outcome == 'failure'
        run: exit 1

  extension-jest:
    name: Extension Jest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify tested candidate identity
        env:
          TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse 'HEAD^{commit}')"
          if [ "$actual_sha" != "$TESTED_SHA" ]; then
            printf '::error::Checked-out candidate %s does not match tested SHA %s\n' \
              "$actual_sha" "$TESTED_SHA"
            exit 1
          fi

      - name: Setup VS Code toolchain
        uses: ./.github/actions/setup-vscode-toolchain

      - name: Lint (oxlint --type-aware, with type-aware canary)
        working-directory: vscode-extension
        run: npm run lint

      - name: Format check (oxfmt)
        working-directory: vscode-extension
        run: npm run fmt:check

      - name: Typecheck all configs (tsc --noEmit, TS7)
        working-directory: vscode-extension
        run: npm run typecheck:all

      - name: Build (rolldown)
        working-directory: vscode-extension
        run: npm run compile

      - name: Unit tests (jest --ci)
        id: jest
        working-directory: vscode-extension
        run: npm run test:ci

      - name: Grammar snapshot tests (visual regression)
        id: grammar
        working-directory: vscode-extension
        run: npm run test:grammar

      - name: Summarize extension evidence
        if: always()
        env:
          TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          JEST_OUTCOME: ${{ steps.jest.outcome }}
          GRAMMAR_OUTCOME: ${{ steps.grammar.outcome }}
        run: |
          {
            echo "## Extension Jest"
            echo
            echo "- Exact tested SHA: \`$TESTED_SHA\`"
            echo "- Jest: \`${JEST_OUTCOME:-not_run}\`"
            echo "- Grammar snapshots: \`${GRAMMAR_OUTCOME:-not_run}\`"
          } >> "$GITHUB_STEP_SUMMARY"
