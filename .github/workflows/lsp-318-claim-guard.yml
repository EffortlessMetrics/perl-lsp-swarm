name: LSP 3.18 Claim Guard

on:
  workflow_dispatch: {}

concurrency:
  group: lsp-318-claim-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  claim-guard:
    name: LSP 3.18 claim guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: "0"
      # #17236: validation needs no dev-profile optimization. Oct 12's
      # 590s job spent 522s on this build and 53s building Cargo test targets.
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable (master)
        with:
          toolchain: stable

      - name: Check LSP 3.18 claim guard
        run: |
          start=$SECONDS
          cargo xtask check-lsp-318-claims
          echo "Claim validation (including compilation): $((SECONDS - start))s; job budget: 600s" >> "$GITHUB_STEP_SUMMARY"

      - name: Check official LSP 3.18 changelog totality
        run: cargo test -p xtask --test lsp_318_changelog_totality --locked

      - name: Check unresolved LSP 3.18 closure ownership
        run: cargo test -p xtask --test lsp_318_closure_ownership --locked

      - name: Check generated LSP 3.18 matrix
        run: cargo xtask generate-lsp-318-matrix --check
