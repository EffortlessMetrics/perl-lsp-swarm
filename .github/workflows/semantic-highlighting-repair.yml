name: Semantic highlighting repair bootstrap

on:
  push:
    branches:
      - fix/semantic-highlighting-contracts

permissions:
  contents: write

concurrency:
  group: semantic-highlighting-repair-bootstrap
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: fix/semantic-highlighting-contracts
          fetch-depth: 0

      - name: Apply semantic highlighting repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1. Replace the inert hard-coded color block with registered custom
          # semantic-token types that inherit the active theme's standard styles.
          package_path = ROOT / "vscode-extension/package.json"
          package = json.loads(package_path.read_text(encoding="utf-8"))
          contributes = package["contributes"]
          removed = contributes.pop("semanticTokenColors", None)
          if removed is None:
              raise SystemExit("vscode-extension/package.json: semanticTokenColors block missing")
          semantic_token_types = [
              {
                  "id": "sql_string",
                  "superType": "string",
                  "description": "SQL text recognized inside Perl strings and heredocs.",
              },
              {
                  "id": "sql_heredoc_keyword",
                  "superType": "keyword",
                  "description": "SQL keyword recognized inside a Perl heredoc.",
              },
              {
                  "id": "json_heredoc_key",
                  "superType": "property",
                  "description": "JSON object key recognized inside a Perl heredoc.",
              },
          ]
          package["contributes"] = {"semanticTokenTypes": semantic_token_types, **contributes}
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

          # 2. Give TextMate fallback highlighting a declaration-specific rule.
          grammar_path = ROOT / "vscode-extension/syntaxes/perl.tmLanguage.json"
          replace_once(
              grammar_path,
              '''        {
                  "include": "#variables"
              },
              {
                  "include": "#keywords"
              },''',
              '''        {
                  "include": "#variables"
              },
              {
                  "include": "#function-declarations"
              },
              {
                  "include": "#keywords"
              },''',
          )
          replace_once(
              grammar_path,
              '''        "functions": {
                  "patterns": [''',
              '''        "function-declarations": {
                  "patterns": [
                      {
                          "match": "\\\\b(sub)\\\\b\\\\s+([A-Za-z_][A-Za-z0-9_]*(?:(?:::|')[A-Za-z_][A-Za-z0-9_]*)*)",
                          "captures": {
                              "1": {
                                  "name": "keyword.declaration.function.perl"
                              },
                              "2": {
                                  "name": "entity.name.function.perl"
                              }
                          }
                      }
                  ]
              },
              "functions": {
                  "patterns": [''',
          )
          replace_once(
              grammar_path,
              ''',
                      {
                          "name": "entity.name.function.perl",
                          "match": "\\\\bsub\\\\s+(\\\\w+)",
                          "captures": {
                              "1": {
                                  "name": "entity.name.function.perl"
                              }
                          }
                      }''',
              "",
          )

          fixture_path = ROOT / "vscode-extension/test/grammar/fixtures/function_declarations.pl"
          fixture_path.write_text(
              """sub greet {\n}\n\nmy sub lexical {\n}\n\nsub Foo::qualified :method {\n}\n\nsub Foo'legacy {\n}\n\nsub with_proto($$) {\n}\n\nsub with_signature ($x, $y) {\n}\n\nmy $anonymous = sub { 1 };\n\nsub\n""",
              encoding="utf-8",
          )

          # 3. Make the packaged-binary smoke exercise both valid LSP routes and
          # fail closed during release packaging when the binary is absent.
          smoke_path = ROOT / "vscode-extension/src/test/packagedSemanticTokensSmoke.test.ts"
          smoke = smoke_path.read_text(encoding="utf-8")
          marker = "const serverPath = findBundledServerPath();\n"
          if marker not in smoke:
              raise SystemExit("packagedSemanticTokensSmoke: serverPath marker missing")
          smoke = smoke.replace(
              marker,
              marker
              + "const requirePackagedSmoke =\n"
              + "  process.env.PERL_LSP_REQUIRE_PACKAGED_SEMANTIC_SMOKE === 'true';\n",
              1,
          )
          test_start = smoke.find("const describeOrSkip = serverPath ? describe : describe.skip;")
          if test_start < 0:
              raise SystemExit("packagedSemanticTokensSmoke: test section marker missing")
          smoke = smoke[:test_start] + r'''if (!serverPath && requirePackagedSmoke) {
            throw new Error(
              '[packagedSemanticTokensSmoke] REQUIRED: no packaged perllsp binary found at ' +
                `vscode-extension/bin/${process.platform}-${process.arch}/ and ` +
                'PERL_LSP_SMOKE_SERVER_PATH is unset. Release packaging must bundle the exact binary before this gate runs.',
            );
          }

          const describeOrSkip = serverPath ? describe : describe.skip;

          if (!serverPath && !requirePackagedSmoke) {
            // eslint-disable-next-line no-console
            console.warn(
              '[packagedSemanticTokensSmoke] SKIPPED: no packaged perllsp binary found at ' +
                `vscode-extension/bin/${process.platform}-${process.arch}/ and PERL_LSP_SMOKE_SERVER_PATH is unset. ` +
                'Run `npm run bundle-lsp` (or set PERL_LSP_SMOKE_SERVER_PATH) to exercise the shipped-binary contract locally.',
            );
          }

          describeOrSkip(
            'packaged perllsp binary: full/range semantic-token parity through the advertised legend',
            () => {
              let client: MinimalLspClient;

              afterEach(() => {
                client?.dispose();
              });

              test('full and range agree without painting the sub keyword as a function', async () => {
                const binary = serverPath as string;
                client = new MinimalLspClient(binary);

                const initializeResult = (await client.request(
                  'initialize',
                  {
                    processId: process.pid,
                    rootUri: null,
                    capabilities: {
                      textDocument: {
                        synchronization: { dynamicRegistration: false },
                        semanticTokens: { dynamicRegistration: false },
                      },
                    },
                  },
                  30_000,
                )) as {
                  capabilities?: {
                    semanticTokensProvider?: {
                      legend?: { tokenTypes: string[]; tokenModifiers: string[] };
                      range?: boolean;
                    };
                  };
                };

                const provider = initializeResult.capabilities?.semanticTokensProvider;
                const legend = provider?.legend;
                expect(legend).toBeDefined();
                expect(Array.isArray(legend?.tokenTypes)).toBe(true);
                expect(legend?.tokenTypes.length ?? 0).toBeGreaterThan(0);
                expect(provider?.range).toBe(true);

                client.notify('initialized', {});

                const uri = 'file:///semantic-contract-smoke.pl';
                // The astral character before the declaration makes JS string indexes
                // equal the LSP-required UTF-16 columns while differing from UTF-8 bytes.
                const text = 'my $value = "😀"; sub foo { return 1; }';
                const subStart = text.indexOf('sub');
                const fooStart = text.indexOf('foo');
                expect(subStart).toBeGreaterThan(0);
                expect(fooStart).toBeGreaterThan(subStart);

                client.notify('textDocument/didOpen', {
                  textDocument: { uri, languageId: 'perl', version: 1, text },
                });

                const fullResult = (await client.request(
                  'textDocument/semanticTokens/full',
                  { textDocument: { uri } },
                  30_000,
                )) as { data?: number[] } | null;
                const fullData = fullResult?.data ?? [];
                expect(fullData.length).toBeGreaterThan(0);
                const fullTokens = decodeSemanticTokens(
                  fullData,
                  legend as { tokenTypes: string[] },
                );

                const requestedRange = {
                  start: { line: 0, character: subStart },
                  end: { line: 0, character: text.length },
                };
                const rangeResult = (await client.request(
                  'textDocument/semanticTokens/range',
                  { textDocument: { uri }, range: requestedRange },
                  30_000,
                )) as { data?: number[] } | null;
                const rangeData = rangeResult?.data ?? [];
                expect(rangeData.length).toBeGreaterThan(0);
                const rangeTokens = decodeSemanticTokens(
                  rangeData,
                  legend as { tokenTypes: string[] },
                );

                const expectedRangeTokens = fullTokens.filter(
                  (token) =>
                    token.line === requestedRange.start.line &&
                    token.startChar >= requestedRange.start.character &&
                    token.startChar < requestedRange.end.character,
                );
                expect(rangeTokens).toEqual(expectedRangeTokens);

                for (const tokens of [fullTokens, rangeTokens]) {
                  const subToken = tokens.find(
                    (token) => token.line === 0 && token.startChar === subStart,
                  );
                  expect(subToken).toBeDefined();
                  expect(subToken?.type).toBe('keyword');
                  expect(subToken?.length).toBe(3);

                  const fooToken = tokens.find(
                    (token) => token.line === 0 && token.startChar === fooStart,
                  );
                  expect(fooToken).toBeDefined();
                  expect(fooToken?.type).toBe('function');
                  expect(fooToken?.length).toBe(3);

                  const functionTokenAtSubKeyword = tokens.find(
                    (token) => token.startChar === subStart && token.type === 'function',
                  );
                  expect(functionTokenAtSubKeyword).toBeUndefined();
                }

                await client.request('shutdown', null, 10_000).catch(() => {
                  /* best-effort */
                });
                client.notify('exit', null);
              }, 45_000);
            },
          );
          '''
          smoke_path.write_text(smoke, encoding="utf-8")

          # 4. Make release packaging run the required shipped-binary contract.
          publish_path = ROOT / ".github/workflows/publish-extension.yml"
          replace_once(
              publish_path,
              '''          npm run verify:marketplace

              shopt -s nullglob''',
              '''          npm run verify:marketplace

              npm run compile:test
              PERL_LSP_REQUIRE_PACKAGED_SEMANTIC_SMOKE=true \\
                node scripts/run-jest.js --runTestsByPath src/test/packagedSemanticTokensSmoke.test.ts

              shopt -s nullglob''',
          )

          # 5. Replace the lossy keyword whitelist with an explicit semantic
          # disposition table. Unknown future lexer keywords remain visible as
          # keywords, while the inventory test makes the missing review fail CI.
          semantic_path = (
              ROOT
              / "crates/perl-lsp-rs-core/src/providers/semantic_tokens/semantic_tokens.rs"
          )
          semantic = semantic_path.read_text(encoding="utf-8")
          insertion_marker = '''/// Collect semantic tokens for LSP highlighting in the Complete stage.
          ///'''
          if insertion_marker not in semantic:
              raise SystemExit("semantic_tokens.rs: collector marker missing")
          disposition = r'''#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          enum KeywordSemanticDisposition {
              Keyword,
              Operator,
              DefaultLibraryFunction,
              String,
              Regexp,
              Unreviewed,
          }

          impl KeywordSemanticDisposition {
              fn token_type(self) -> &'static str {
                  match self {
                      Self::Keyword | Self::Unreviewed => "keyword",
                      Self::Operator => "operator",
                      Self::DefaultLibraryFunction => "function",
                      Self::String => "string",
                      Self::Regexp => "regexp",
                  }
              }

              fn modifiers(self) -> u32 {
                  match self {
                      // `defaultLibrary` is bit 9 in the advertised modifier legend.
                      Self::DefaultLibraryFunction => 1 << 9,
                      _ => 0,
                  }
              }
          }

          fn keyword_semantic_disposition(keyword: &str) -> KeywordSemanticDisposition {
              use KeywordSemanticDisposition::{
                  DefaultLibraryFunction, Keyword, Operator, Regexp, String, Unreviewed,
              };

              match keyword {
                  "and" | "cmp" | "isa" | "not" | "or" | "xor" => Operator,
                  "die" | "grep" | "map" | "print" | "say" | "sort" | "split" | "warn" => {
                      DefaultLibraryFunction
                  }
                  "m" | "qr" | "s" | "tr" | "y" => Regexp,
                  "q" | "qq" | "qw" | "qx" => String,
                  "ADJUST" | "BEGIN" | "CHECK" | "END" | "INIT" | "UNITCHECK" | "await"
                  | "break" | "catch" | "class" | "continue" | "default" | "defer" | "do"
                  | "else" | "elsif" | "eval" | "field" | "finally" | "for" | "foreach"
                  | "format" | "given" | "goto" | "if" | "last" | "local" | "method" | "my"
                  | "next" | "our" | "package" | "redo" | "require" | "return" | "state"
                  | "sub" | "try" | "undef" | "unless" | "until" | "use" | "when" | "while" => {
                      Keyword
                  }
                  _ => Unreviewed,
              }
          }

          '''
          semantic = semantic.replace(insertion_marker, disposition + insertion_marker, 1)
          semantic = semantic.replace(
              '''        // Map token types to semantic token kinds
                  // Note: The lexer's TokenType enum is simpler than what we're matching
                  let kind = match &tok.token_type {
                      TokenType::Keyword(kw) => {
                          // Check if it's a known keyword
                          match kw.as_ref() {
                              "my" | "our" | "local" | "state" | "sub" | "package" | "use" | "require"
                              | "if" | "else" | "elsif" | "for" | "foreach" | "while" | "until" | "do"
                              | "return" | "next" | "last" | "redo" | "goto" | "eval" | "given" | "when"
                              | "default" | "break" | "continue" | "unless" | "no" | "BEGIN" | "END"
                              | "CHECK" | "INIT" | "UNITCHECK" | "class" | "method" | "try" | "catch"
                              | "finally" | "await"
                              // Infix operator keywords (perlop) — `isa` added for Perl 5.32+ (issue #778)
                              | "isa" | "cmp" => "keyword",
                              _ => continue,
                          }
                      }
          ''',
              '''        // Map token types to semantic token kinds.
                  // Unknown future lexer keywords remain visible as `keyword`; the
                  // inventory contract below forces an explicit reviewed disposition.
                  let mut token_modifiers = 0u32;
                  let kind = match &tok.token_type {
                      TokenType::Keyword(kw) => {
                          let disposition = keyword_semantic_disposition(kw.as_ref());
                          token_modifiers = disposition.modifiers();
                          disposition.token_type()
                      }
          ''',
              1,
          )
          semantic = semantic.replace(
              '''            lexer_tokens.push((sl, sc, len, kind_idx(&leg, kind), 0));
          ''',
              '''            lexer_tokens.push((sl, sc, len, kind_idx(&leg, kind), token_modifiers));
          ''',
              1,
          )
          tests = r'''

              #[test]
              fn semantic_keyword_disposition_covers_lexer_inventory() {
                  for &keyword in perl_lexer::keywords::LEXER_KEYWORDS {
                      assert_ne!(
                          keyword_semantic_disposition(keyword),
                          KeywordSemanticDisposition::Unreviewed,
                          "lexer keyword `{keyword}` needs an explicit semantic-token disposition"
                      );
                  }
              }

              #[test]
              fn semantic_keyword_disposition_preserves_language_roles() {
                  assert_eq!(
                      keyword_semantic_disposition("and").token_type(),
                      "operator"
                  );
                  assert_eq!(
                      keyword_semantic_disposition("isa").token_type(),
                      "operator"
                  );
                  assert_eq!(
                      keyword_semantic_disposition("print").token_type(),
                      "function"
                  );
                  assert_eq!(
                      keyword_semantic_disposition("print").modifiers(),
                      1 << 9
                  );
                  assert_eq!(keyword_semantic_disposition("qr").token_type(), "regexp");
                  assert_eq!(keyword_semantic_disposition("qw").token_type(), "string");
                  assert_eq!(keyword_semantic_disposition("field").token_type(), "keyword");
                  assert_eq!(
                      keyword_semantic_disposition("future_keyword").token_type(),
                      "keyword",
                      "unreviewed lexer output must remain visible rather than being dropped"
                  );
              }
          '''
          final_close = semantic.rfind("\n}")
          if final_close < 0:
              raise SystemExit("semantic_tokens.rs: test module close missing")
          semantic = semantic[:final_close] + tests + semantic[final_close:]
          semantic_path.write_text(semantic, encoding="utf-8")
          PY

      - name: Setup VS Code toolchain
        uses: ./.github/actions/setup-vscode-toolchain

      - name: Format changed TypeScript and manifest
        working-directory: vscode-extension
        run: npm exec --offline --no -- oxfmt --write package.json src/test/packagedSemanticTokensSmoke.test.ts

      - name: Regenerate and verify TextMate snapshots
        working-directory: vscode-extension
        run: |
          npm run test:grammar:update
          npm run test:grammar

      - name: Format and test Rust semantic disposition
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p perl-lsp-rs-core semantic_keyword_disposition --lib --locked

      - name: Build exact server and prove packaged full/range parity
        working-directory: vscode-extension
        run: |
          npm run compile:test
          npm run bundle-lsp
          PERL_LSP_REQUIRE_PACKAGED_SEMANTIC_SMOKE=true \
            node scripts/run-jest.js --runTestsByPath src/test/packagedSemanticTokensSmoke.test.ts
          npm run package

      - name: Commit reviewed repair and remove bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/semantic-highlighting-repair.yml
          git diff --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            .github/workflows/semantic-highlighting-repair.yml \
            .github/workflows/publish-extension.yml \
            crates/perl-lsp-rs-core/src/providers/semantic_tokens/semantic_tokens.rs \
            vscode-extension/package.json \
            vscode-extension/src/test/packagedSemanticTokensSmoke.test.ts \
            vscode-extension/syntaxes/perl.tmLanguage.json \
            vscode-extension/test/grammar/fixtures
          git commit -m "fix(editor): close semantic highlighting contract gaps"
          git push origin HEAD:fix/semantic-highlighting-contracts
