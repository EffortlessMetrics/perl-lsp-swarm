# ripr-infra-retry - bounded automatic retry of classified infra-no-proof lanes
#
# Historical #6807 slice 2: the ripr gate (ripr.yml) uses positive teardown
# evidence (shutdown signal / API cancellation / lost communication, or the
# guarded failed-lane steps state) to classify infra-no-proof. SIGTERM / exit
# 143 alone is diagnostic, not sufficient authority. The gate leaves a
# `ripr-gate-classification` artifact holding that verdict. This workflow fires
# when a ripr run completes with failure and, if
# and only if the gate's own classification artifact says infra-no-proof,
# reruns the failed jobs once for the same exact SHA — an infra kill leaves
# the evaluated tree unchanged, so a rerun re-runs the same head.
#
# Bound: exactly one automatic retry. The retry fires only while the completed
# run is on attempt 1; attempt 2+ falls back to the documented manual path
# (`gh run rerun <run-id> --failed`, printed by the gate itself). The bound
# needs no state: re-running failed jobs increments run_attempt, and the
# workflow_run event for the retried completion arrives with run_attempt >= 2.
# Deliveries are serialized per source run (concurrency group + live re-read
# before arming) so duplicate events cannot double-arm the single retry.
# Pull-request recovery additionally requires the event's source SHA to remain
# the tip of its source repository/branch. Push/manual/history recovery keeps
# the existing policy; evaluated merge freshness and PR admission are separate.
#
# Security posture: this workflow runs in the default-branch context with an
# actions:write token, so it must never check out or execute candidate code.
# It makes API calls only. The classification artifact is treated strictly as
# data: fields are extracted with grep against exact line patterns, never
# sourced, and only the event-provided run id is used for the rerun call.
#
# Known boundary: if the gate job itself is evicted before it can classify,
# no artifact exists and no retry fires — the gate's manual rerun message is
# the recovery path for that rarer class. This keeps exactly one classifier
# (the gate) instead of duplicating the log-inspection logic here.

name: ripr-infra-retry

on:
  workflow_run:
    workflows: [ripr]
    types: [completed]

permissions:
  contents: read
  # rerun-failed-jobs and artifact download.
  actions: write

# Serialize duplicate completed-event deliveries for the same source run so a
# racing second responder observes the already-armed attempt (run_attempt >= 2)
# and exits on the bound instead of issuing a second rerun (review round 2).
concurrency:
  group: ripr-infra-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-on-eviction:
    name: Bounded retry on infra-no-proof
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry once when the gate classified the failure as infra-no-proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          summary() {
            {
              echo "### ripr infra-no-proof auto-retry (#6807)"
              echo ""
              echo "- run: \`${RUN_ID}\` (attempt \`${RUN_ATTEMPT}\`)"
              echo "- head: \`${HEAD_SHA}\`"
              for line in "$@"; do echo "- ${line}"; done
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Locate the gate's classification artifact. Absence means the gate
          # did not classify this as infra-no-proof (genuine ripr failure, or
          # the gate job itself was killed before classifying): no retry.
          artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "ripr-gate-classification") | .id' | head -1)
          if [ -z "${artifact_id}" ]; then
            echo "::notice::no ripr-gate-classification artifact on run ${RUN_ID} — not an infra-no-proof classification; no automatic retry."
            summary "decision: \`skip (no infra-no-proof classification)\`"
            exit 0
          fi

          # Download and read the verdict strictly as data: grep exact field
          # lines, never source the file.
          workdir=$(mktemp -d)
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${workdir}/classification.zip"
          unzip -o -q "${workdir}/classification.zip" -d "${workdir}"
          classification_file="${workdir}/ripr-gate-classification.env"
          if [ ! -f "${classification_file}" ]; then
            echo "::notice::artifact ${artifact_id} did not contain ripr-gate-classification.env — no automatic retry."
            summary "decision: \`skip (classification file missing from artifact)\`"
            exit 0
          fi
          if ! grep -qx 'classification=infra-no-proof' "${classification_file}"; then
            echo "::notice::classification is not infra-no-proof — genuine ripr failures are never auto-retried."
            summary "decision: \`skip (classification is not infra-no-proof)\`"
            exit 0
          fi
          gate_head=$(grep -oE '^head_sha=[0-9a-f]{40}$' "${classification_file}" | cut -d= -f2 || true)
          gate_run_id=$(grep -oE '^run_id=[0-9]+$' "${classification_file}" | cut -d= -f2 || true)
          gate_attempt=$(grep -oE '^run_attempt=[0-9]+$' "${classification_file}" | cut -d= -f2 || true)
          lane_name=$(grep -oE '^lane_name=.+$' "${classification_file}" | cut -d= -f2- || true)
          lane_job_id=$(grep -oE '^lane_job_id=[0-9]+$' "${classification_file}" | cut -d= -f2 || true)

          # Sanity: the artifact must describe THIS run. The evaluated SHA
          # must be present as an exact 40-hex value, but the API's run/job
          # head_sha is the PR branch tip, not the evaluated PR merge ref.
          # Never treat those distinct SHA domains as interchangeable.
          if [ -z "${gate_head}" ]; then
            echo "::notice::classification lacks a valid evaluated SHA — no automatic retry."
            summary "decision: \`skip (missing evaluated SHA)\`"
            exit 0
          fi
          # Compare the recorded
          # run id — not the head SHA: for pull_request runs the gate's
          # GITHUB_SHA is the evaluated refs/pull/<n>/merge commit while
          # workflow_run.head_sha is the PR branch tip, so a head comparison
          # would skip every genuine PR eviction (verified on run
          # 32969627737: event head_sha == PR branch tip, gate head == merge
          # ref). rerun-failed-jobs re-runs the same run and therefore the
          # same evaluated tree regardless of which identity names it.
          if [ -z "${gate_run_id}" ] || [ "${gate_run_id}" != "${RUN_ID}" ]; then
            echo "::notice::classification run id (${gate_run_id:-invalid}) does not match event run ${RUN_ID} — no automatic retry."
            summary "decision: \`skip (run-id mismatch between classification and event)\`"
            exit 0
          fi
          # Artifacts are listed for the whole run, across all attempts. A
          # prior attempt's otherwise valid infra verdict cannot authorize a
          # retry of the current attempt (#16980).
          if [ -z "${gate_attempt}" ] || [ "${gate_attempt}" != "${RUN_ATTEMPT}" ]; then
            echo "::notice::classification attempt (${gate_attempt:-invalid}) does not match event attempt ${RUN_ATTEMPT} — no automatic retry."
            summary "decision: \`skip (classification attempt mismatch)\`"
            exit 0
          fi
          if [ -z "${lane_job_id}" ]; then
            echo "::notice::classification lacks a numeric lane job id — no automatic retry."
            summary "decision: \`skip (missing lane job identity)\`"
            exit 0
          fi
          # One listing call projects both identity fields: jq emits the id and
          # name on a single tab-separated line, and the id is digits-only so
          # the first tab is always the separator. A second identical request
          # for the same payload would double the API surface for no evidence
          # gain.
          current_lane_job=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs?per_page=100" \
            --jq ".jobs[] | select(.id == ${lane_job_id}) | \"\(.id)\t\(.name)\"" | head -1)
          current_lane_job_id="${current_lane_job%%$'\t'*}"
          current_lane_job_name="${current_lane_job#*$'\t'}"
          if [ "${current_lane_job_id}" != "${lane_job_id}" ]; then
            echo "::notice::classification lane job ${lane_job_id} is not in current run attempt ${RUN_ATTEMPT} — no automatic retry."
            summary "decision: \`skip (lane job attempt mismatch)\`"
            exit 0
          fi
          if [ "${current_lane_job_name}" != "${lane_name}" ]; then
            echo "::notice::classification lane name does not match current run attempt ${RUN_ATTEMPT} — no automatic retry."
            summary "decision: \`skip (lane job name mismatch)\`"
            exit 0
          fi

          # This current attempt now has a validated infra-no-proof artifact
          # and lane identity. Only that evidence supports an exhausted claim.
          # Bound: exactly one automatic retry. A retried completion arrives
          # here with run_attempt >= 2 and takes the manual path instead.
          if [ "${RUN_ATTEMPT}" != "1" ]; then
            # #12563: surface this validated attempt as NOT_PROVEN without
            # inferring eviction cause or proof status outside this attempt.
            echo "RIPR_GATE_VERDICT=not-proven-infra-retry-exhausted"
            echo "::error::NOT_PROVEN (#12563): ripr run ${RUN_ID} validated attempt ${RUN_ATTEMPT} is classified infra-no-proof; the single automatic same-head retry is exhausted. Verify the latest run state before a manual \`gh run rerun ${RUN_ID} --failed\`."
            echo "::notice::run attempt ${RUN_ATTEMPT} — automatic retry is exhausted; use the gate's documented manual rerun for this head."
            summary "decision: \`skip (retry bound reached — manual rerun path applies)\`" \
                    "verdict: \`not-proven-infra-retry-exhausted (NOT_PROVEN)\`"
            exit 0
          fi

          # Re-read the live run immediately before arming (review round 2):
          # a duplicate delivery that queued behind the concurrency group must
          # observe the bumped attempt / in-flight status and skip, so the
          # one-retry bound holds even under racing event deliveries. The
          # rerun API additionally rejects non-completed runs server-side.
          live_state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            --jq '"\(.run_attempt) \(.status)"')
          live_attempt=${live_state%% *}
          live_status=${live_state#* }
          if [ "${live_attempt}" != "1" ] || [ "${live_status}" != "completed" ]; then
            echo "::notice::run ${RUN_ID} is attempt ${live_attempt:-unknown}/status ${live_status:-unknown} before arming — the retry is already armed or consumed; no second automatic retry."
            summary "decision: \`skip (bound already armed or consumed — race with another delivery)\`"
            exit 0
          fi

          # Only PR-origin automatic recovery needs source-branch freshness.
          # Read the exact ref in the event's SOURCE repository, including a
          # fork; do not guess a PR association or substitute the base repo.
          # HEAD_SHA is the event's branch SHA, never gate_head's merge SHA.
          if [ -z "${SOURCE_EVENT:-}" ]; then
            echo "::notice::source event identity missing — freshness NOT_PROVEN; no automatic retry."
            summary "decision: \`skip (source event identity missing)\`"
            exit 0
          fi
          if [ "${SOURCE_EVENT}" = "pull_request" ]; then
            if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ||
                  ! "${SOURCE_REPOSITORY:-}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ||
                  -z "${SOURCE_BRANCH:-}" ]]; then
              echo "::notice::PR source identity missing or malformed — freshness NOT_PROVEN; no automatic retry."
              summary "decision: \`skip (PR source identity missing or malformed)\`"
              exit 0
            fi
            source_ref=$(jq -jn --arg branch "${SOURCE_BRANCH}" '"heads/" + $branch | @uri')
            if ! live_source_head=$(gh api "repos/${SOURCE_REPOSITORY}/git/ref/${source_ref}" \
              --jq '.object.sha' 2>/dev/null) ||
              [[ ! "${live_source_head}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::notice::PR source ref unavailable — freshness NOT_PROVEN; no automatic retry."
              summary "decision: \`skip (PR source ref unavailable)\`"
              exit 0
            fi
            if [ "${live_source_head}" != "${HEAD_SHA}" ]; then
              echo "::notice::PR source head ${HEAD_SHA} is superseded by ${live_source_head}; no automatic retry."
              summary "decision: \`skip (superseded PR source head)\`" \
                      "current source head: \`${live_source_head}\`"
              exit 0
            fi
          fi
          # Freshness is observed immediately before POST, not an atomic lease:
          # the rerun API has no expected-source-head precondition.
          echo "::notice::gate classified run ${RUN_ID} as infra-no-proof (lane: ${lane_name:-unknown}, job: ${lane_job_id:-unknown}); re-running failed jobs for the same evaluated tree."
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"

          summary \
            "decision: \`retry (infra-no-proof)\`" \
            "lane: \`${lane_name:-unknown}\` (job \`${lane_job_id:-unknown}\`)" \
            "evaluated head (gate): \`${gate_head:-unknown}\`" \
            "branch head (event): \`${HEAD_SHA}\`" \
            "action: \`rerun-failed-jobs\` (attempt 2, same evaluated tree)"
          echo "ripr-infra-retry: re-queued failed jobs of run ${RUN_ID} (evaluated ${gate_head:-unknown})"
