name: Post-Merge Status Regeneration

# Regenerate status documentation after trusted default-branch changes. The
# generator runs without repository write authority; a separate minimal job
# proposes the exact generated files through a reviewable PR.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

concurrency:
  group: post-merge-status-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    name: Regenerate status subsystem files
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.scope.outputs.changed }}

    steps:
      - name: Checkout trusted source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          shared-key: post-merge-status-${{ hashFiles('Cargo.lock') }}

      - name: Regenerate status subsystem files and roadmap
        run: cargo run -p xtask -- update-status --write

      - name: Verify generated scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          allowed=(
            docs/project/status/lsp.md
            docs/project/status/tests.md
            docs/project/status/parser.md
            docs/project/status/quality.md
            docs/project/ROADMAP.md
          )

          mapfile -t changed < <(git diff --name-only --)
          for candidate in "${changed[@]}"; do
            allowed_match=false
            for expected in "${allowed[@]}"; do
              if [ "$candidate" = "$expected" ]; then
                allowed_match=true
                break
              fi
            done
            if [ "$allowed_match" != "true" ]; then
              printf '::error::Status generation modified an unexpected file: %s\n' "$candidate"
              exit 1
            fi
          done

          for expected in "${allowed[@]}"; do
            if [ -L "$expected" ] || [ ! -f "$expected" ]; then
              printf '::error::Generated status output is not a regular file: %s\n' "$expected"
              exit 1
            fi
          done

          if [ "${#changed[@]}" -gt 0 ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            printf 'Generated status changes:\n'
            printf '  %s\n' "${changed[@]}"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Status files are already current.'
          fi

      - name: Upload exact generated payload
        if: steps.scope.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-merge-status-${{ github.run_id }}
          path: |
            docs/project/status/lsp.md
            docs/project/status/tests.md
            docs/project/status/parser.md
            docs/project/status/quality.md
            docs/project/ROADMAP.md
          if-no-files-found: error
          retention-days: 7

  open-pr:
    name: Open generated status PR
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download generated status payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: post-merge-status-${{ github.run_id }}
          path: .

      - name: Verify PR payload
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            docs/project/status/lsp.md
            docs/project/status/tests.md
            docs/project/status/parser.md
            docs/project/status/quality.md
            docs/project/ROADMAP.md
          )
          for path in "${expected[@]}"; do
            if [ -L "$path" ] || [ ! -f "$path" ]; then
              printf '::error::Downloaded status output is not a regular file: %s\n' "$path"
              exit 1
            fi
          done
          git diff --name-only -- "${expected[@]}"

      - name: Create generated status PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/post-merge-status
          delete-branch: true
          title: 'chore(docs): regenerate post-merge status (#6012)'
          commit-message: 'chore(docs): regenerate post-merge status (#6012)'
          body: |
            Regenerates the status subsystem from the current trusted default-branch tree.

            The generator ran in a read-only job. This PR contains only:

            - `docs/project/status/lsp.md`
            - `docs/project/status/tests.md`
            - `docs/project/status/parser.md`
            - `docs/project/status/quality.md`
            - `docs/project/ROADMAP.md`
          add-paths: |
            docs/project/status/lsp.md
            docs/project/status/tests.md
            docs/project/status/parser.md
            docs/project/status/quality.md
            docs/project/ROADMAP.md
          labels: |
            automated-pr
            documentation
