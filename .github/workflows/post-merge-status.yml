name: Post-Merge Status Regeneration

# Generate status documentation and the non-Rust reader reference from trusted
# default-branch source without write authority. A separate minimal job validates
# one content-addressed payload and proposes the exact six published files through
# a reviewable pull request. Branch validity is evaluated independently.
#
# #12606: runs queue instead of cancelling, so a run can finish generating long
# after newer commits landed on the default branch. Two guards close that stale
# window without touching the pinned-event-SHA generation model:
#   1. the writer refuses to publish unless the payload's source SHA still
#      equals the live default-branch tip at write time;
#   2. when a run finds the canonical files already current (changed=false), it
#      closes any open proposal PR whose embedded source SHA is behind main.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

concurrency:
  group: post-merge-status-${{ github.ref }}
  # #10199: this run is the sole automated publisher for the generated status
  # documents. Queuing prevents sustained merge cadence from starving
  # publication. The non-Rust inventory is not published here: its tracked
  # pointer is frozen and the evidence is the policy shard's
  # `non-rust-inventory-<sha>` artifact (#14688).
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  generate:
    name: Generate bounded status payload
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.payload.outputs.changed }}
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the immutable event commit, matching the writer. The manifest
          # records `git rev-parse HEAD` and the writer requires it to equal
          # `github.sha`, so generating from the moving branch tip would make the
          # writer reject the payload after a full Cargo build and silently drop
          # the status update for that push.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
          shared-key: post-merge-status-${{ hashFiles('Cargo.lock') }}

      - name: Regenerate status subsystem files and roadmap
        run: cargo run --locked -p xtask -- update-status --write

      - name: Validate and stage exact generated payload
        id: payload
        run: |
          set -euo pipefail
          mkdir -p target/post-merge-status-payload
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import stat
          import subprocess

          canonical = [
              "docs/project/status/lsp.md",
              "docs/project/status/tests.md",
              "docs/project/status/parser.md",
              "docs/project/status/quality.md",
              "docs/project/ROADMAP.md",
          ]
          # `update-status --write` regenerates six subsystems, not four: it also
          # owns docs/project/status/{dap,workspace}.md, editor_ux.json, and the
          # target-derived status receipts. Only the five canonical files above are
          # ever proposed to the writer, but the generator legitimately dirties the
          # rest, so the abort below is scoped to writes that escape the
          # generator-owned surface entirely (source, workflows, scripts, ...).
          owned_prefixes = ("docs/project/status/",)
          # Cargo.lock churns whenever the checked-out manifests and the
          # committed lock disagree: that refresh is the generator's own
          # `cargo run` build state, not an escape into the repository surface,
          # and it never reaches the payload — the artifact below and the
          # privileged writer stay bounded to the canonical files. (#13355)
          owned_paths = {
              "docs/project/ROADMAP.md",
              "Cargo.lock",
          }
          root = Path.cwd().resolve()
          payload_root = root / "target" / "post-merge-status-payload"
          files_root = payload_root / "files"
          manifest_path = payload_root / "manifest.json"
          max_file_bytes = 5_242_880
          max_total_bytes = 20_971_520

          changed_paths: set[str] = set()
          commands = [
              ["git", "diff", "--name-only", "-z"],
              ["git", "diff", "--cached", "--name-only", "-z"],
              ["git", "ls-files", "--others", "--exclude-standard", "-z"],
          ]
          for command in commands:
              output = subprocess.run(
                  command,
                  check=True,
                  stdout=subprocess.PIPE,
              ).stdout
              changed_paths.update(
                  entry.decode("utf-8", errors="surrogateescape")
                  for entry in output.split(b"\0")
                  if entry
              )

          unexpected = sorted(
              path
              for path in changed_paths
              if path not in owned_paths and not path.startswith(owned_prefixes)
          )
          if unexpected:
              raise SystemExit(
                  "status generator changed paths outside its owned surface: "
                  + ", ".join(unexpected)
              )

          records: list[dict[str, object]] = []
          total_bytes = 0
          for relative in canonical:
              source = root / relative
              metadata = source.lstat()
              if not stat.S_ISREG(metadata.st_mode):
                  raise SystemExit(f"generated status output is not regular: {relative}")
              if metadata.st_size > max_file_bytes:
                  raise SystemExit(f"generated status output exceeds byte limit: {relative}")
              data = source.read_bytes()
              total_bytes += len(data)
              records.append(
                  {
                      "path": relative,
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  }
              )

          if total_bytes > max_total_bytes:
              raise SystemExit("generated status payload exceeds aggregate byte limit")

          # Only movement in the five canonical files justifies a proposal PR.
          # Churn confined to the other generator-owned outputs must not open an
          # empty PR, and must not reach the writer's changed-path contract.
          canonical_changed = sorted(changed_paths & set(canonical))
          changed = bool(canonical_changed)
          if files_root.exists():
              shutil.rmtree(files_root)
          for relative in canonical:
              destination = files_root / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(root / relative, destination)

          manifest_path.write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "source_sha": subprocess.check_output(
                          ["git", "rev-parse", "HEAD"], text=True
                      ).strip(),
                      "changed": changed,
                      "changed_paths": canonical_changed,
                      "file_count": len(records),
                      "total_bytes": total_bytes,
                      "files": records,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"changed={'true' if changed else 'false'}\n")
          print(
              f"staged {len(records)} canonical files; "
              f"changed={changed}; total_bytes={total_bytes}"
          )
          PY

      - name: Upload exact generated payload
        if: steps.payload.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: post-merge-status-${{ github.run_id }}
          path: target/post-merge-status-payload
          if-no-files-found: error
          retention-days: 7

      - name: Report current generated state
        if: steps.payload.outputs.changed != 'true'
        run: echo "::notice::Generated status files are already current."

  # #12606: with queued runs (#10199), a stale payload PR lingers when a
  # later run regenerates at the newest SHA, finds the canonical files
  # already current, and skips open-pr — the earlier PR is then neither
  # updated nor invalidated. changed=false means the committed state
  # matches a fresh deterministic regeneration, so any open
  # automation/post-merge-status PR is by construction a no-op or a stale
  # payload: close it as superseded. This also closes the case where main
  # moved after the stale write landed, which a write-time source_sha
  # rejection (the alternative interpretation) cannot reach.
  #
  # This job is deliberately separate from generate: it holds
  # pull-requests: write and must never execute repository code or Cargo
  # dependencies (the workflow treats a compromised generator or build
  # dependency as untrusted; a persisted gh shim must never see this
  # token). No checkout, no build — API calls only.
  close-superseded:
    name: Close superseded generated status PRs
    needs: generate
    if: needs.generate.outputs.changed == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Close superseded generated status PRs
        run: |
          set -euo pipefail
          # changed=false describes only the tree pinned to this run's event
          # SHA. An older rerun (or an unlucky concurrency-group ordering)
          # must not close a PR produced against a newer tree: close only
          # when this run's SHA is still the default-branch tip. A skip is
          # safe — the next push re-fires the healer.
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::run SHA ${GITHUB_SHA} is no longer the default-branch tip (${tip}); skipping closure"
            exit 0
          fi
          # --head matches branch name only, including fork branches; restrict
          # closure to same-repository PRs so a fork branch that happens to
          # share the automation branch name is never touched.
          gh pr list --state open --head automation/post-merge-status \
            --json number,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | .number' |
          while read -r pr; do
            [ -n "$pr" ] || continue
            gh pr close "$pr" --comment "Superseded: regeneration at ${GITHUB_SHA} found the canonical generated files already current (changed=false), so this open payload is stale (#12606)."
          done

  open-pr:
    name: Open generated status PR
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the exact event commit, not the moving branch tip. The manifest
          # is only ever validated against `github.sha`, so a branch ref could let
          # a later commit become the base for a payload generated from an earlier
          # one. `base` is set explicitly below because this leaves HEAD detached.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download generated payload outside the checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: post-merge-status-${{ github.run_id }}
          path: ${{ runner.temp }}/post-merge-status-payload

      - name: Verify and stage canonical generated files
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          PAYLOAD_ROOT: ${{ runner.temp }}/post-merge-status-payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import stat
          import subprocess

          canonical = [
              "docs/project/status/lsp.md",
              "docs/project/status/tests.md",
              "docs/project/status/parser.md",
              "docs/project/status/quality.md",
              "docs/project/ROADMAP.md",
          ]
          expected_paths = set(canonical)
          # Re-declared here on purpose. The generator enforces the same limits,
          # but it is the untrusted side of this boundary: a compromised generator
          # or build dependency controls both the artifact and its manifest, so a
          # limit that exists only over there binds nothing. This privileged job
          # must refuse an oversized payload on its own authority.
          max_file_bytes = 5_242_880
          max_total_bytes = 20_971_520
          payload_root = Path(os.environ["PAYLOAD_ROOT"])
          files_root = payload_root / "files"
          manifest_path = payload_root / "manifest.json"
          if not files_root.is_dir() or files_root.is_symlink():
              raise SystemExit("generated status files payload is missing or non-regular")
          if not manifest_path.is_file() or manifest_path.is_symlink():
              raise SystemExit("generated status manifest is missing or non-regular")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("schema_version") != 1:
              raise SystemExit("unsupported generated status manifest schema")
          if manifest.get("source_sha") != os.environ["EXPECTED_SOURCE_SHA"]:
              raise SystemExit("generated status source SHA does not match this run")
          if manifest.get("changed") is not True:
              raise SystemExit("writer received a payload that declares no change")
          changed_paths = manifest.get("changed_paths")
          if (
              not isinstance(changed_paths, list)
              or not changed_paths
              or any(path not in expected_paths for path in changed_paths)
          ):
              raise SystemExit("generated status manifest has invalid changed paths")

          records = manifest.get("files")
          if not isinstance(records, list) or len(records) != len(canonical):
              raise SystemExit("generated status manifest has wrong file count")
          expected: dict[str, tuple[int, str]] = {}
          for record in records:
              if not isinstance(record, dict):
                  raise SystemExit("generated status manifest contains a non-object")
              relative = record.get("path")
              size = record.get("bytes")
              digest = record.get("sha256")
              if (
                  relative not in expected_paths
                  or not isinstance(size, int)
                  or isinstance(size, bool)
                  or size < 0
                  or size > max_file_bytes
                  or not isinstance(digest, str)
                  or len(digest) != 64
                  or any(ch not in "0123456789abcdef" for ch in digest)
              ):
                  raise SystemExit(f"invalid generated status record: {record!r}")
              if relative in expected:
                  raise SystemExit(f"duplicate generated status record: {relative}")
              expected[relative] = (size, digest)
          if set(expected) != expected_paths:
              raise SystemExit("generated status manifest omits a canonical file")
          if sum(size for size, _ in expected.values()) > max_total_bytes:
              raise SystemExit("generated status payload exceeds aggregate byte limit")

          observed_paths: set[str] = set()
          for path in sorted(files_root.rglob("*")):
              metadata = path.lstat()
              if stat.S_ISDIR(metadata.st_mode):
                  continue
              if not stat.S_ISREG(metadata.st_mode):
                  raise SystemExit(f"generated status payload is non-regular: {path}")
              # Refuse on stat, before any read, so an oversized blob is never
              # loaded into this job at all.
              if metadata.st_size > max_file_bytes:
                  raise SystemExit(f"generated status payload exceeds byte limit: {path}")
              relative = path.relative_to(files_root).as_posix()
              record = expected.get(relative)
              if record is None:
                  raise SystemExit(f"generated status payload has extra file: {relative}")
              data = path.read_bytes()
              if len(data) != record[0]:
                  raise SystemExit(f"generated status size mismatch: {relative}")
              if hashlib.sha256(data).hexdigest() != record[1]:
                  raise SystemExit(f"generated status digest mismatch: {relative}")
              observed_paths.add(relative)
          if observed_paths != expected_paths:
              raise SystemExit("generated status payload omits a canonical file")
          if manifest.get("file_count") != len(expected_paths):
              raise SystemExit("generated status manifest file count is inconsistent")
          if manifest.get("total_bytes") != sum(size for size, _ in expected.values()):
              raise SystemExit("generated status manifest byte count is inconsistent")

          for relative in canonical:
              destination = Path(relative)
              if destination.is_symlink():
                  raise SystemExit(f"repository destination is a symlink: {relative}")
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(files_root / relative, destination)

          # Observe the whole working tree. Restricting `git diff` to `canonical`
          # made this guard unfalsifiable: the pathspec filtered the output down
          # to exactly the set it was then compared against, so the difference was
          # empty by construction and no unexpected write could ever trip it.
          # The payload itself lives in RUNNER_TEMP, outside this checkout.
          changed = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"], text=True
          ).splitlines()
          unexpected = sorted((set(changed) | set(untracked)) - expected_paths)
          if unexpected:
              raise SystemExit(f"writer staged unexpected paths: {unexpected}")
          PY

      # #12606: while this queued run was generating, newer commits may have
      # landed on the default branch. Publishing a payload generated from an
      # older tree would strand a stale proposal PR: the newest run converges,
      # but a changed=false successor skips open-pr entirely and never revisits
      # it. Refusing here is fail-safe — the payload artifact from the generate
      # job remains uploaded as the regeneration receipt, and no automation
      # branch mutation has happened yet. Equality, not ancestry, is the
      # discriminator: the pinned event commit stays an ancestor of every later
      # tip, so a reachability test cannot tell this payload apart from a fresh
      # one. When equality fails, a newer queued run already owns convergence.
      - name: Reject payload whose source fell behind the default branch
        id: freshness
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path

          expected = os.environ["EXPECTED_SOURCE_SHA"]
          repository = os.environ["REPOSITORY"]
          default_branch = os.environ["DEFAULT_BRANCH"]
          completed = subprocess.run(
              ["gh", "api", f"repos/{repository}/branches/{default_branch}",
               "--jq", ".commit.sha"],
              check=True,
              stdout=subprocess.PIPE,
              text=True,
          )
          tip = completed.stdout.strip()
          if len(tip) != 40 or any(ch not in "0123456789abcdef" for ch in tip):
              raise SystemExit("live default-branch tip query returned an invalid object name")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              if tip == expected:
                  output.write("publish=true\n")
                  print(f"payload source {expected} matches the live default-branch tip; publishing")
              else:
                  output.write("publish=false\n")
                  print(
                      "::notice::payload source "
                      f"{expected} no longer matches live default-branch tip {tip}; "
                      "refusing to publish a stale proposal because a newer queued "
                      "run owns convergence (#12606)"
                  )
          PY

      # Established peter-evans/create-pull-request pattern (see
      # post-merge-corpus-ratchet.yml, version-bump.yml). A PR opened by
      # GITHUB_TOKEN raises no pull_request events (GitHub loop prevention),
      # so the next step explicitly dispatches CI on the branch —
      # workflow_dispatch is the documented GITHUB_TOKEN exception — and the
      # required checks populate on the PR head without any manual
      # credential-backed touch (#11731; the twice-confirmed empty-commit
      # remedy is the baseline this replaces).
      - name: Create generated status PR
        id: create-pr
        if: steps.freshness.outputs.publish == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/post-merge-status
          base: ${{ github.event.repository.default_branch }}
          # No delete-branch: an open PR that names this generated branch
          # as its base is a live dependency on it, and deleting the base
          # auto-closes that child (#12885). Cleanup is a separate admitted
          # decision via `xtask branch-deletion-admission admit`.
          title: "chore(docs): regenerate post-merge status (#6012, #11731)"
          commit-message: "chore(docs): regenerate post-merge status (#6012, #11731)"
          body: |
            Regenerates the five canonical status documents from the trusted
            default-branch source at `${{ github.sha }}`.

            Generation ran without repository write authority. The writer
            verified the source SHA and every path, size, and SHA-256 digest.

            Refs #6012. Refs #11731.

            <!-- post-merge-status: source_sha=${{ github.sha }} -->
          add-paths: |
            docs/project/status/lsp.md
            docs/project/status/tests.md
            docs/project/status/parser.md
            docs/project/status/quality.md
            docs/project/ROADMAP.md

      - name: Raise CI on the generated PR
        # GITHUB_TOKEN-created PRs raise no pull_request events, so none of
        # the required-check workflows fire and the PR sits at one GitHub-App
        # check (#11481, #11707, twice-confirmed on #11731; #11788 then showed
        # that ci.yml alone leaves "Perl LSP Rust Small Result",
        # "ripr+ New Gap Gate", and "validate-title" permanently expected).
        # workflow_dispatch is the documented GITHUB_TOKEN exception to loop
        # prevention: dispatching each required-check workflow on the branch
        # attaches its check runs to the PR head commit.
        # The freshness gate is load-bearing here too: a skipped create-pr step
        # exposes empty outputs, and an empty string is not equal to '0', so the
        # old condition alone would dispatch CI after a refused publication.
        if: >-
          steps.freshness.outputs.publish == 'true' &&
          steps.create-pr.outputs.pull-request-number != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/post-merge-status
          BASE_SHA: ${{ github.sha }}
          GENERATED_HEAD_SHA: ${{ steps.create-pr.outputs.pull-request-head-sha }}
        run: |
          # ci.yml's workflow_dispatch declares required inputs (since #13019):
          # the dispatched subject's exact base and head SHAs. Dispatching it
          # bare fails with HTTP 422 "Required input 'base_sha' not provided",
          # so the generated PR's required checks never populate (#13355).
          # base_sha is this run's event SHA — the freshness gate above proved
          # it equals the live default-branch tip, i.e. the generated PR's
          # base. head_sha is the automation branch head the create-pr step
          # just wrote, which is the same commit the --ref below dispatches.
          # The other three workflows declare no dispatch inputs and stay bare.
          # Keep attempting every required workflow so one transient dispatch
          # failure cannot strand the later required checks. The final status
          # remains failing when any dispatch failed.
          set +e
          failed=0
          for workflow in ci.yml em-ci-routed-rust.yml ripr.yml pr-title-check.yml; do
            if [ "$workflow" = ci.yml ]; then
              if gh workflow run "$workflow" --ref "$BRANCH" \
                -f "base_sha=$BASE_SHA" \
                -f "head_sha=$GENERATED_HEAD_SHA"; then
                continue
              fi
            elif gh workflow run "$workflow" --ref "$BRANCH"; then
              continue
            fi
            echo "::error::Failed to dispatch $workflow"
            failed=1
          done
          exit "$failed"

  supersede-stale:
    name: Supersede stale generated status PR
    needs: generate
    # #12606: when this run's regeneration finds every canonical file already
    # current (changed=false), any still-open proposal PR can only have been
    # generated from an older source SHA — a fresh proposal would either carry
    # this run's drift (changed=true) or have been refreshed on the same
    # automation branch by the writer. Close such stranded proposals so a
    # queued stale run cannot leave them open indefinitely.
    if: needs.generate.outputs.changed == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Close proposal PRs generated from older sources
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import subprocess

          repository = os.environ["REPOSITORY"]
          default_branch = os.environ["DEFAULT_BRANCH"]
          marker = re.compile(r"post-merge-status: source_sha=([0-9a-f]{40})")
          visible = re.compile(r"`([0-9a-f]{40})`")

          def gh(*arguments: str) -> str:
              completed = subprocess.run(
                  ["gh", *arguments],
                  check=True,
                  stdout=subprocess.PIPE,
                  text=True,
              )
              return completed.stdout

          tip = gh(
              "api", f"repos/{repository}/branches/{default_branch}",
              "--jq", ".commit.sha",
          ).strip()
          if len(tip) != 40 or any(ch not in "0123456789abcdef" for ch in tip):
              raise SystemExit("live default-branch tip query returned an invalid object name")

          open_proposals = json.loads(
              gh(
                  "pr", "list",
                  "--repo", repository,
                  "--head", "automation/post-merge-status",
                  "--state", "open",
                  "--json", "number,body",
              )
          )

          closed = 0
          for proposal in open_proposals:
              number = proposal.get("number")
              body = proposal.get("body") or ""
              match = marker.search(body) or visible.search(body)
              if match is None:
                  # The source SHA is only trusted when our own template wrote
                  # it; an unparseable body is left for reviewer attention.
                  print(f"::warning::proposal PR #{number} exposes no source SHA; leaving it untouched")
                  continue
              source_sha = match.group(1)
              if source_sha == tip:
                  continue
              comparison = json.loads(gh("api", f"repos/{repository}/compare/{source_sha}...{tip}"))
              if comparison.get("status") != "ahead" or not comparison.get("ahead_by"):
                  # Divergent or unrelated history is not provably behind main;
                  # a stale status payload is refused by the payload validator.
                  print(f"proposal PR #{number} source {source_sha} is not strictly behind {tip}; leaving untouched")
                  continue
              gh(
                  "pr", "close", str(number),
                  "--repo", repository,
                  "--comment",
                  (
                      f"Superseding this proposal: it was generated from `{source_sha}`, "
                      f"which is behind the current default-branch tip `{tip}`, and a "
                      "regeneration run at that tip found every canonical file already "
                      "current, so no fresh proposal was needed. The next canonical-file "
                      "drift re-fires the healer. (#12606)"
                  ),
              )
              closed += 1
              print(f"closed proposal PR #{number} (generated from {source_sha}, behind {tip})")

          print(f"superseded {closed} stale proposal PR(s); default-branch tip {tip}")
          PY

