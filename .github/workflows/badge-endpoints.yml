name: Badge Endpoints

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: badge-endpoints-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate badge endpoints
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Install ripr
        run: cargo install ripr --version 0.10.1 --locked

      - name: Refresh badge endpoints
        run: cargo xtask badges

      - name: Keep only generated badge changes
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::git status before scope cleanup"
          git status --porcelain
          echo "::endgroup::"

          git checkout -- . ':!badges'
          git clean -fd -- . ':!badges'

          unexpected="$(git status --porcelain | awk '$2 !~ /^badges\// { print }')"
          if [ -n "$unexpected" ]; then
            echo "::error::Badge generation left changes outside badges/:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Upload generated badges
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: badge-endpoints-${{ github.run_id }}
          path: badges
          if-no-files-found: error
          retention-days: 7

      - name: Report badge PR creation disabled
        if: vars.BADGE_ENDPOINTS_AUTO_PR != 'true'
        shell: bash
        run: |
          {
            echo "::notice title=Badge PR skipped::Automatic badge PR creation is disabled."
            echo "::notice::Badges were regenerated and archived successfully."
            echo "::notice::Set repository variable BADGE_ENDPOINTS_AUTO_PR=true after enabling GitHub Actions pull-request creation to restore automatic badge PRs."
          }

  open-pr:
    name: Open badge refresh PR
    needs: generate
    if: vars.BADGE_ENDPOINTS_AUTO_PR == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Reset stale automation branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/automation/badge-endpoints" \
            >/dev/null 2>&1 || true

      - name: Download generated badges
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: badge-endpoints-${{ github.run_id }}
          path: badges

      - name: Verify write payload
        shell: bash
        run: |
          set -euo pipefail
          test -d badges
          if find badges -type l -print -quit | grep -q .; then
            echo "::error::Badge artifact contains a symbolic link"
            exit 1
          fi
          git status --short -- badges

      - name: Create badge refresh PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/badge-endpoints
          add-paths: badges
          title: "chore(badges): refresh public endpoints (#8820)"
          commit-message: "chore(badges): refresh public endpoints (#8820)"
          body: |
            Refreshes generated Shields endpoint JSON under `badges/`.

            Generated in a read-only job by:

            ```bash
            cargo xtask badges
            ```
