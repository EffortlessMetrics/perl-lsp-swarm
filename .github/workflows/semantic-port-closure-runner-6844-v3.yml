name: Semantic port authority improvement 6844

on:
  push:
    branches:
      - agent/semantic-port-closure-runner-6844

permissions:
  contents: write

jobs:
  improve-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out reviewed PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/semantic-provider-port-6816
          fetch-depth: 0
          persist-credentials: true

      - name: Verify reviewed source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bb02e319f44a1508ff08a529a393d01ed5b42b8d"

      - name: Bind completeness authority to semantic request identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          model = Path('crates/perl-lsp-rs-core/src/providers/semantic_port/model.rs')
          text = model.read_text(encoding='utf-8')

          fields = '''pub struct ProviderCompletenessAuthorityReceipt {
              capability: ProviderQueryCapability,
              project_identity: ProviderIdentity,
          '''
          bound_fields = '''pub struct ProviderCompletenessAuthorityReceipt {
              capability: ProviderQueryCapability,
              query_kind: ProviderQueryKind,
              subject: ProviderQuerySubject,
              project_identity: ProviderIdentity,
          '''
          if text.count(fields) != 1:
              raise SystemExit('authority receipt field shape changed')
          text = text.replace(fields, bound_fields)

          capability_getter = '''    pub const fn capability(&self) -> ProviderQueryCapability {
              self.capability
          }

          '''
          request_getters = capability_getter + '''    /// Full semantic query shape bound to the denominator snapshot.
          #[must_use]
          pub const fn query_kind(&self) -> &ProviderQueryKind {
              &self.query_kind
          }

              /// Semantic subject bound to the denominator snapshot.
          #[must_use]
          pub const fn subject(&self) -> &ProviderQuerySubject {
              &self.subject
          }

          '''
          if text.count(capability_getter) != 1:
              raise SystemExit('capability getter shape changed')
          text = text.replace(capability_getter, request_getters)

          literal = '''            authority: ProviderCompletenessAuthorityReceipt {
                  capability,
                  project_identity: request.context.project_identity.clone(),
          '''
          bound_literal = '''            authority: ProviderCompletenessAuthorityReceipt {
                  capability,
                  query_kind: request.kind.clone(),
                  subject: request.subject.clone(),
                  project_identity: request.context.project_identity.clone(),
          '''
          if text.count(literal) != 1:
              raise SystemExit('verified authority literal shape changed')
          text = text.replace(literal, bound_literal)

          match_start = '''        self.authority.capability == ProviderQueryCapability::from_query(&request.kind)
                  && self.authority.project_identity == request.context.project_identity
          '''
          bound_match = '''        self.authority.capability == ProviderQueryCapability::from_query(&request.kind)
                  && self.authority.query_kind == request.kind
                  && self.authority.subject == request.subject
                  && self.authority.project_identity == request.context.project_identity
          '''
          if text.count(match_start) != 1:
              raise SystemExit('authority match shape changed')
          model.write_text(text.replace(match_start, bound_match), encoding='utf-8')

          tests = Path('crates/perl-lsp-rs-core/src/providers/semantic_port/tests.rs')
          test_text = tests.read_text(encoding='utf-8')
          test_name = 'exact_empty_authority_rejects_subject_and_query_shape_replay'
          if test_name not in test_text:
              test_text += '''

          #[test]
          fn exact_empty_authority_rejects_subject_and_query_shape_replay(
          ) -> Result<(), Box<dyn Error>> {
              let source = request(
                  ProviderQueryKind::Declaration,
                  ProviderQuerySubject::File(FileId(1)),
              );
              let grant = verified_grant(&source)?;
              let other_file = request(
                  ProviderQueryKind::Declaration,
                  ProviderQuerySubject::File(FileId(2)),
              );
              let replay = execute(
                  &other_file,
                  ProviderQueryResultDraft::new(
                      ProviderQueryOutcome::Exact,
                      Vec::new(),
                      Some(grant),
                      primary(SemanticReasonCode::ExactSource),
                  ),
                  &NoopProviderQueryControl,
              );
              assert_eq!(
                  replay.err(),
                  Some(ProviderQueryContractError::InvalidCompletenessGrant)
              );

              let references_without_declaration = request(
                  ProviderQueryKind::References {
                      include_declaration: false,
                  },
                  ProviderQuerySubject::File(FileId(1)),
              );
              let reference_grant = verified_grant(&references_without_declaration)?;
              let references_with_declaration = request(
                  ProviderQueryKind::References {
                      include_declaration: true,
                  },
                  ProviderQuerySubject::File(FileId(1)),
              );
              let shape_replay = execute(
                  &references_with_declaration,
                  ProviderQueryResultDraft::new(
                      ProviderQueryOutcome::Exact,
                      Vec::new(),
                      Some(reference_grant),
                      primary(SemanticReasonCode::ExactSource),
                  ),
                  &NoopProviderQueryControl,
              );
              assert_eq!(
                  shape_replay.err(),
                  Some(ProviderQueryContractError::InvalidCompletenessGrant)
              );
              Ok(())
          }
          '''
              tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Format, compile, and test improvement
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cargo +1.95.0 fmt --all 2>&1 | tee -a "$RUNNER_TEMP/semantic-port-authority.log"
          cargo +1.95.0 fmt --all -- --check 2>&1 | tee -a "$RUNNER_TEMP/semantic-port-authority.log"
          cargo +1.95.0 check --locked -p perl-lsp-rs-core --all-targets 2>&1 | tee -a "$RUNNER_TEMP/semantic-port-authority.log"
          cargo +1.95.0 test --locked -p perl-lsp-rs-core --all-targets semantic_port 2>&1 | tee -a "$RUNNER_TEMP/semantic-port-authority.log"
          cargo +1.95.0 run --locked -p xtask -- check-file-policy 2>&1 | tee -a "$RUNNER_TEMP/semantic-port-authority.log"

      - name: Upload improvement transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-port-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semantic-port-authority.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit improvement to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            crates/perl-lsp-rs-core/src/providers/semantic_port/model.rs \
            crates/perl-lsp-rs-core/src/providers/semantic_port/tests.rs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(semantic-port): bind completeness authority"
          git push origin HEAD:agent/semantic-provider-port-6816
