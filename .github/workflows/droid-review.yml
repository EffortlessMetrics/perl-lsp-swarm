name: Droid PR Review

# External AI reviewer. Advisory: see policy/ci-lane-whitelist.toml entry
# `droid_auto_review` and docs/ci/labels.md `ai-review`.
#
# Full semantic review runs when a PR first becomes reviewable. It is not
# cancelled and restarted on every repair push. A later material repair may be
# reviewed explicitly until the pinned action supports affected-seam review.
#
# The job remains advisory and continue-on-error. Action completion is not
# represented as proof that a review was posted, adequate, or clean.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: droid-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

jobs:
  droid-review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, em-ci, trusted-pr, review-nano, droid-review]
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Configure MiniMax M3 for Droid BYOK
        shell: bash
        run: |
          set -euo pipefail

          droid_home="${RUNNER_TEMP}/droid-home"
          mkdir -p "${droid_home}/.factory"

          cat > "${droid_home}/.factory/settings.local.json" <<JSON
          {
            "customModels": [
              {
                "displayName": "MiniMax-M3",
                "model": "MiniMax-M3",
                "baseUrl": "https://api.minimax.io/anthropic",
                "apiKey": "${MINIMAX_API_KEY}",
                "provider": "anthropic",
                "maxOutputTokens": 64000,
                "noImageSupport": true,
                "extraArgs": {
                  "temperature": 1
                }
              }
            ]
          }
          JSON

      - name: Install GitHub CLI for self-hosted Droid
        shell: bash
        env:
          GH_CLI_VERSION: "2.93.0"
          GH_CLI_SHA256: 02d1290eba130e0b896f3709ffff22e1c75a51475ddb70476a85abc6b5807af0
        run: |
          set -euo pipefail

          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi

          archive="gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          install_dir="${RUNNER_TEMP}/gh-cli"
          mkdir -p "${install_dir}"

          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/${archive}" \
            -o "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "${GH_CLI_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum -c -

          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${install_dir}"
          echo "${install_dir}/gh_${GH_CLI_VERSION}_linux_amd64/bin" >> "${GITHUB_PATH}"
          "${install_dir}/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh" --version

      - name: Install pinned Droid CLI
        id: install_droid
        shell: bash
        env:
          DROID_CLI_VERSION: "0.175.0"
          DROID_CLI_SHA256: dccc99755fbba9a1ef561a8273fb317aa47f750e4721748bd830d2ea8581c12c
        run: |
          set -euo pipefail

          install_dir="${RUNNER_TEMP}/droid-cli"
          partial_path="${install_dir}/droid.partial"
          droid_path="${install_dir}/droid"
          mkdir -p "${install_dir}"

          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
            "https://downloads.factory.ai/factory-cli/releases/${DROID_CLI_VERSION}/linux/x64-baseline/droid" \
            -o "${partial_path}"
          printf '%s  %s\n' "${DROID_CLI_SHA256}" "${partial_path}" | sha256sum -c -
          mv "${partial_path}" "${droid_path}"
          chmod +x "${droid_path}"
          "${droid_path}" --version
          echo "path=${droid_path}" >> "${GITHUB_OUTPUT}"

      - name: Run Droid Auto Review
        id: droid_review
        uses: EffortlessMetrics/droid-action-safe@7c1377ccbacddc95560d1570547a5baa51de01ec # review truth outputs tracked under #5778
        env:
          HOME: ${{ runner.temp }}/droid-home
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ""
          ANTHROPIC_BASE_URL: ""
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          upload_debug_artifacts: false
          automatic_review: true
          review_depth: deep
          review_model: custom:MiniMax-M3-0
          automatic_security_review: false
          path_to_droid_executable: ${{ steps.install_droid.outputs.path }}

      - name: Write Droid live-run receipt
        if: always()
        shell: bash
        env:
          DROID_REVIEW_OUTCOME: ${{ steps.droid_review.outcome }}
        run: |
          set -euo pipefail

          receipt_dir="${RUNNER_TEMP}/droid-receipts"
          receipt_path="${receipt_dir}/droid-live-run.json"
          mkdir -p "${receipt_dir}"

          action_completed=false
          not_proven_reason="droid_action_failed_or_did_not_run"
          if [ "${DROID_REVIEW_OUTCOME:-unknown}" = "success" ]; then
            action_completed=true
            not_proven_reason="pinned_action_does_not_expose_review_publication_or_adequacy"
          fi

          cat > "${receipt_path}" <<JSON
          {
            "check": "droid-live-run",
            "schema_version": "2",
            "event": "pull_request",
            "verdict": "warn",
            "workflow": "Droid PR Review",
            "model": "custom:MiniMax-M3-0",
            "review_depth": "deep",
            "runner_labels": ["self-hosted", "linux", "x64", "em-ci", "trusted-pr", "review-nano", "droid-review"],
            "action": "EffortlessMetrics/droid-action-safe",
            "action_completed": ${action_completed},
            "review_posted": false,
            "review_posted_proven": false,
            "review_adequacy": "not_proven",
            "review_result": "not_proven",
            "candidate_count": null,
            "validated_count": null,
            "independent_finding_count": null,
            "not_proven_reason": "${not_proven_reason}",
            "debug_artifacts_uploaded": false,
            "anthropic_env_cleared": true
          }
          JSON

      - name: Upload Droid live-run receipt
        if: always()
        uses: ./.github/actions/upload-receipt
        with:
          receipt-path: ${{ runner.temp }}/droid-receipts/droid-live-run.json
          artifact-name: droid-live-run-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: "14"
          generate-summary: "false"
