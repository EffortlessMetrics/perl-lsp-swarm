name: Droid PR Review

# External AI reviewer. Advisory: see policy/ci-lane-whitelist.toml entry
# `droid_auto_review` and docs/ci/labels.md `ai-review`.
#
# Full semantic review runs only when a PR first becomes reviewable. Repair
# pushes do not cancel an investigation or automatically restart the whole
# review. A maintainer/provider-native flow may request a focused later review
# when a material seam changes.
#
# The job remains continue-on-error so vendor/model/instrument failures do not
# break unrelated CI. Analysis, publication, and process outcome stay separate;
# action success alone never means a review was posted or that the PR was clean.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: droid-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

jobs:
  droid-review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, em-ci, trusted-pr, review-nano, droid-review]
    # Advisory lane: do not break PR signal on external-AI-review failures.
    # See docs/ci/perl-lsp-rollout-plan.md PR 14.
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Configure MiniMax M3 for Droid BYOK
        shell: bash
        run: |
          set -euo pipefail

          droid_home="${RUNNER_TEMP}/droid-home"
          mkdir -p "${droid_home}/.factory"

          cat > "${droid_home}/.factory/settings.local.json" <<JSON
          {
            "customModels": [
              {
                "displayName": "MiniMax-M3",
                "model": "MiniMax-M3",
                "baseUrl": "https://api.minimax.io/anthropic",
                "apiKey": "${MINIMAX_API_KEY}",
                "provider": "anthropic",
                "maxOutputTokens": 64000,
                "noImageSupport": true,
                "extraArgs": {
                  "temperature": 1
                }
              }
            ]
          }
          JSON

      - name: Install GitHub CLI for self-hosted Droid
        shell: bash
        env:
          GH_CLI_VERSION: "2.93.0"
          GH_CLI_SHA256: 02d1290eba130e0b896f3709ffff22e1c75a51475ddb70476a85abc6b5807af0
        run: |
          set -euo pipefail

          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi

          archive="gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          install_dir="${RUNNER_TEMP}/gh-cli"
          mkdir -p "${install_dir}"

          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/${archive}" \
            -o "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "${GH_CLI_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum -c -

          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${install_dir}"
          echo "${install_dir}/gh_${GH_CLI_VERSION}_linux_amd64/bin" >> "${GITHUB_PATH}"
          "${install_dir}/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh" --version

      - name: Install pinned Droid CLI
        id: install_droid
        shell: bash
        env:
          DROID_CLI_VERSION: "0.175.0"
          DROID_CLI_SHA256: dccc99755fbba9a1ef561a8273fb317aa47f750e4721748bd830d2ea8581c12c
        run: |
          set -euo pipefail

          install_dir="${RUNNER_TEMP}/droid-cli"
          partial_path="${install_dir}/droid.partial"
          droid_path="${install_dir}/droid"
          mkdir -p "${install_dir}"

          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
            "https://downloads.factory.ai/factory-cli/releases/${DROID_CLI_VERSION}/linux/x64-baseline/droid" \
            -o "${partial_path}"
          printf '%s  %s\n' "${DROID_CLI_SHA256}" "${partial_path}" | sha256sum -c -
          mv "${partial_path}" "${droid_path}"
          chmod +x "${droid_path}"
          "${droid_path}" --version
          echo "path=${droid_path}" >> "${GITHUB_OUTPUT}"

      - name: Run independent Droid review
        id: droid_review
        # Stacked immutable D1+D2 candidate. Keep this downstream PR draft until
        # the upstream review prompt and outcome action are accepted, then pin
        # the accepted squash SHA without changing this consumer contract.
        uses: EffortlessMetrics/droid-action-safe@b324e7b416fddb19581831ad3b043c0ee953d526
        env:
          HOME: ${{ runner.temp }}/droid-home
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ""
          ANTHROPIC_BASE_URL: ""
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          upload_debug_artifacts: false
          automatic_review: true
          review_depth: deep
          review_model: custom:MiniMax-M3-0
          automatic_security_review: false
          path_to_droid_executable: ${{ steps.install_droid.outputs.path }}

      - name: Compile and verify Droid review outcome
        id: review_outcome
        if: always()
        uses: EffortlessMetrics/droid-action-safe/review-outcome@b324e7b416fddb19581831ad3b043c0ee953d526
        with:
          validated-path: ${{ runner.temp }}/droid-prompts/review_validated.json
          repository: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          expected-head: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ github.token }}
          receipt-path: ${{ runner.temp }}/droid-receipts/droid-review-outcome.json

      - name: Write Droid live-run receipt
        if: always()
        shell: bash
        env:
          DROID_REVIEW_OUTCOME: ${{ steps.droid_review.outcome }}
          REVIEW_OUTCOME_STEP: ${{ steps.review_outcome.outcome }}
          REVIEW_RESULT: ${{ steps.review_outcome.outputs.review-result }}
          PUBLICATION_RESULT: ${{ steps.review_outcome.outputs.publication-result }}
          CANDIDATE_COUNT: ${{ steps.review_outcome.outputs.candidate-count }}
          VALIDATED_COUNT: ${{ steps.review_outcome.outputs.validated-count }}
          APPROVED_INLINE_COUNT: ${{ steps.review_outcome.outputs.approved-inline-count }}
          INDEPENDENT_FINDING_COUNT: ${{ steps.review_outcome.outputs.independent-finding-count }}
          REVIEW_BODY_SUBMITTED: ${{ steps.review_outcome.outputs.review-body-submitted }}
          OBSERVED_HEAD: ${{ steps.review_outcome.outputs.observed-head }}
          CURRENT_HEAD: ${{ steps.review_outcome.outputs.current-head }}
          NOT_PROVEN_REASON: ${{ steps.review_outcome.outputs.not-proven-reason }}
          SUBMITTED_REVIEW_ID: ${{ steps.review_outcome.outputs.submitted-review-id }}
          OUTCOME_RECEIPT_PATH: ${{ steps.review_outcome.outputs.receipt-path }}
        run: |
          set -euo pipefail

          receipt_dir="${RUNNER_TEMP}/droid-receipts"
          receipt_path="${receipt_dir}/droid-live-run.json"
          mkdir -p "${receipt_dir}"

          python3 - "${receipt_path}" <<'PY'
          import json
          import os
          import pathlib
          import sys

          def as_int(name: str) -> int:
              raw = os.environ.get(name, "")
              try:
                  return int(raw)
              except ValueError:
                  return 0

          def as_bool(name: str) -> bool:
              return os.environ.get(name, "").lower() == "true"

          receipt = {
              "check": "droid-live-run",
              "schema_version": "3",
              "event": "pull_request",
              "advisory": True,
              "verdict": "warn",
              "review_result": os.environ.get("REVIEW_RESULT") or "not_proven",
              "publication_result": os.environ.get("PUBLICATION_RESULT") or "not_proven",
              "not_proven_reason": os.environ.get("NOT_PROVEN_REASON") or None,
              "workflow": "Droid PR Review",
              "model": "custom:MiniMax-M3-0",
              "review_depth": "deep",
              "action": "EffortlessMetrics/droid-action-safe",
              "action_outcome": os.environ.get("DROID_REVIEW_OUTCOME", "unknown"),
              "outcome_step": os.environ.get("REVIEW_OUTCOME_STEP", "unknown"),
              "candidate_count": as_int("CANDIDATE_COUNT"),
              "validated_count": as_int("VALIDATED_COUNT"),
              "approved_inline_count": as_int("APPROVED_INLINE_COUNT"),
              "independent_finding_count": as_int("INDEPENDENT_FINDING_COUNT"),
              "review_body_submitted": as_bool("REVIEW_BODY_SUBMITTED"),
              "publication_verified": as_bool("REVIEW_BODY_SUBMITTED"),
              "observed_head": os.environ.get("OBSERVED_HEAD") or None,
              "current_head": os.environ.get("CURRENT_HEAD") or None,
              "submitted_review_id": os.environ.get("SUBMITTED_REVIEW_ID") or None,
              "outcome_receipt_path": os.environ.get("OUTCOME_RECEIPT_PATH") or None,
              "automatic_full_review_on_synchronize": False,
              "semantic_review_cancel_in_progress": False,
              "debug_artifacts_uploaded": False,
              "anthropic_env_cleared": True,
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Droid live-run receipt
        if: always()
        uses: ./.github/actions/upload-receipt
        with:
          receipt-path: ${{ runner.temp }}/droid-receipts/droid-live-run.json
          artifact-name: droid-live-run-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: "14"
          generate-summary: "false"
