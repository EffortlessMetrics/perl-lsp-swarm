name: Droid PR Review

# External AI reviewer. Advisory: see policy/ci-lane-whitelist.toml entry
# `droid_auto_review` and docs/ci/labels.md `ai-review`.
#
# Full semantic review runs only when a PR first becomes reviewable. Repair
# pushes do not cancel an investigation or automatically restart the whole
# review. A maintainer/provider-native flow may request a focused later review
# when a material seam changes.
#
# The job remains continue-on-error so vendor/model/instrument failures do not
# break unrelated CI. Its receipt is fail-honest: action success alone never
# means a review was posted or that the candidate was clean.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: droid-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

jobs:
  droid-review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, em-ci, trusted-pr, review-nano, droid-review]
    # Advisory lane: do not break PR signal on external-AI-review failures.
    # See docs/ci/perl-lsp-rollout-plan.md PR 14.
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Configure MiniMax M3 for Droid BYOK
        shell: bash
        run: |
          set -euo pipefail

          droid_home="${RUNNER_TEMP}/droid-home"
          mkdir -p "${droid_home}/.factory"

          cat > "${droid_home}/.factory/settings.local.json" <<JSON
          {
            "customModels": [
              {
                "displayName": "MiniMax-M3",
                "model": "MiniMax-M3",
                "baseUrl": "https://api.minimax.io/anthropic",
                "apiKey": "${MINIMAX_API_KEY}",
                "provider": "anthropic",
                "maxOutputTokens": 64000,
                "noImageSupport": true,
                "extraArgs": {
                  "temperature": 1
                }
              }
            ]
          }
          JSON
      - name: Install GitHub CLI for self-hosted Droid
        shell: bash
        env:
          GH_CLI_VERSION: "2.93.0"
          GH_CLI_SHA256: 02d1290eba130e0b896f3709ffff22e1c75a51475ddb70476a85abc6b5807af0
        run: |
          set -euo pipefail

          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi

          archive="gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          install_dir="${RUNNER_TEMP}/gh-cli"
          mkdir -p "${install_dir}"

          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/${archive}" \
            -o "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "${GH_CLI_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum -c -

          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${install_dir}"
          echo "${install_dir}/gh_${GH_CLI_VERSION}_linux_amd64/bin" >> "${GITHUB_PATH}"
          "${install_dir}/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh" --version
      - name: Install pinned Droid CLI
        id: install_droid
        shell: bash
        env:
          DROID_CLI_VERSION: "0.175.0"
          DROID_CLI_SHA256: dccc99755fbba9a1ef561a8273fb317aa47f750e4721748bd830d2ea8581c12c
        run: |
          set -euo pipefail

          install_dir="${RUNNER_TEMP}/droid-cli"
          partial_path="${install_dir}/droid.partial"
          droid_path="${install_dir}/droid"
          mkdir -p "${install_dir}"

          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
            "https://downloads.factory.ai/factory-cli/releases/${DROID_CLI_VERSION}/linux/x64-baseline/droid" \
            -o "${partial_path}"
          printf '%s  %s\n' "${DROID_CLI_SHA256}" "${partial_path}" | sha256sum -c -
          mv "${partial_path}" "${droid_path}"
          chmod +x "${droid_path}"
          "${droid_path}" --version
          echo "path=${droid_path}" >> "${GITHUB_OUTPUT}"
      - name: Run Droid Auto Review
        id: droid_review
        # Keep the last accepted immutable pin until the independent-validator
        # and structured-output slices under #6007 merge upstream.
        uses: EffortlessMetrics/droid-action-safe@7c1377ccbacddc95560d1570547a5baa51de01ec # based on Factory-AI/droid-action v5; raw debug artifact upload disabled
        env:
          HOME: ${{ runner.temp }}/droid-home
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ""
          ANTHROPIC_BASE_URL: ""
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          upload_debug_artifacts: false
          automatic_review: true
          review_depth: deep
          review_model: custom:MiniMax-M3-0
          automatic_security_review: false
          path_to_droid_executable: ${{ steps.install_droid.outputs.path }}
      - name: Write fail-honest Droid live-run receipt
        if: always()
        shell: bash
        env:
          DROID_REVIEW_OUTCOME: ${{ steps.droid_review.outcome }}
          REVIEW_VALIDATED_PATH: ${{ runner.temp }}/droid-prompts/review_validated.json
        run: |
          set -euo pipefail

          receipt_dir="${RUNNER_TEMP}/droid-receipts"
          receipt_path="${receipt_dir}/droid-live-run.json"
          mkdir -p "${receipt_dir}"

          python3 - "${REVIEW_VALIDATED_PATH}" "${receipt_path}" <<'PY'
          import json
          import os
          import pathlib
          import sys

          validated_path = pathlib.Path(sys.argv[1])
          receipt_path = pathlib.Path(sys.argv[2])
          action_outcome = os.environ.get("DROID_REVIEW_OUTCOME", "unknown")

          artifact = None
          artifact_error = None
          if validated_path.is_file():
              try:
                  artifact = json.loads(validated_path.read_text(encoding="utf-8"))
              except Exception as exc:  # fail-honest receipt; never hide malformed output
                  artifact_error = f"invalid_validated_artifact:{type(exc).__name__}"
          else:
              artifact_error = "validated_artifact_missing"

          results = artifact.get("results", []) if isinstance(artifact, dict) else []
          independent = (
              artifact.get("independentFindings", [])
              if isinstance(artifact, dict)
              else []
          )
          summary = artifact.get("reviewSummary", {}) if isinstance(artifact, dict) else {}
          if not isinstance(results, list):
              results = []
              artifact_error = artifact_error or "results_not_array"
          if not isinstance(independent, list):
              independent = []
              artifact_error = artifact_error or "independent_findings_not_array"
          if not isinstance(summary, dict):
              summary = {}
              artifact_error = artifact_error or "review_summary_not_object"

          approved_candidates = sum(
              1 for item in results
              if isinstance(item, dict) and item.get("status") == "approved"
          )
          independent_findings = len(independent)
          review_body = summary.get("body") if isinstance(summary.get("body"), str) else ""
          declared_result = summary.get("result")
          artifact_version = artifact.get("version") if isinstance(artifact, dict) else None

          semantic_result = "not_proven"
          not_proven_reason = artifact_error
          if action_outcome != "success":
              not_proven_reason = f"action_outcome:{action_outcome}"
          elif artifact_error:
              pass
          elif declared_result in {"clean", "findings", "not_proven", "stale"}:
              semantic_result = declared_result
              if declared_result == "not_proven":
                  raw_reason = summary.get("notProvenReason")
                  not_proven_reason = (
                      raw_reason if isinstance(raw_reason, str) and raw_reason.strip()
                      else "validator_reported_not_proven"
                  )
              else:
                  not_proven_reason = None
          elif approved_candidates + independent_findings > 0:
              # Legacy v1 output can still prove that findings were selected.
              semantic_result = "findings"
              not_proven_reason = None
          else:
              # The legacy validator cannot prove it independently inspected a
              # zero-candidate PR or submitted a useful clean review body.
              not_proven_reason = "legacy_validator_cannot_prove_independent_clean_review"

          receipt = {
              "check": "droid-live-run",
              "schema_version": "2",
              "event": "pull_request",
              "verdict": "warn",
              "semantic_result": semantic_result,
              "not_proven_reason": not_proven_reason,
              "workflow": "Droid PR Review",
              "model": "custom:MiniMax-M3-0",
              "review_depth": "deep",
              "runner_labels": [
                  "self-hosted", "linux", "x64", "em-ci", "trusted-pr",
                  "review-nano", "droid-review"
              ],
              "action": "EffortlessMetrics/droid-action-safe",
              "action_outcome": action_outcome,
              "validated_artifact_present": artifact is not None,
              "validated_artifact_version": artifact_version,
              "candidate_count": len(results),
              "validated_count": len(results),
              "approved_candidate_count": approved_candidates,
              "independent_finding_count": independent_findings,
              "review_body_declared": bool(review_body.strip()),
              "review_posted": None,
              "publication_verified": False,
              "automatic_full_review_on_synchronize": False,
              "semantic_review_cancel_in_progress": False,
              "debug_artifacts_uploaded": False,
              "anthropic_env_cleared": True,
          }
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload Droid live-run receipt
        if: always()
        uses: ./.github/actions/upload-receipt
        with:
          receipt-path: ${{ runner.temp }}/droid-receipts/droid-live-run.json
          artifact-name: droid-live-run-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: "14"
          generate-summary: "false"