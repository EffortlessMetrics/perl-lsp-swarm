name: Perf Nightly Alert

# Human-visible alert path for nightly benchmark regressions (#17354). The
# benchmark job itself runs at contents:read and must never gain write scopes
# (#6028: it executes candidate-adjacent code), so this separate workflow
# reacts to its completion via workflow_run, which runs in the default-branch
# context with its own minimal permissions.

on:
  workflow_run:
    workflows: ["CI (Nightly)"]
    types: [completed]

permissions:
  actions: read
  issues: write

concurrency:
  group: perf-nightly-alert
  cancel-in-progress: false

jobs:
  alert:
    name: Perf Nightly Alert
    # Scheduled runs only: label-gated and manual runs are watched live by
    # their requester, and alerting on them would spam the rolling issue.
    if: github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Download nightly benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: benchmark-results-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/nightly-bench

      - name: Upsert rolling regression issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BENCH_DIR: ${{ runner.temp }}/nightly-bench
        run: |
          set -euo pipefail
          alert="$BENCH_DIR/alert.md"
          if [ ! -f "$alert" ]; then
            echo "## Perf Nightly Alert" >> "$GITHUB_STEP_SUMMARY"
            echo "No alert.md in nightly results; the nightly run itself carries infra failures." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! grep -qE '^### (🔴 Critical Regressions|⚠️ Performance Regressions)' "$alert"; then
            echo "## Perf Nightly Alert" >> "$GITHUB_STEP_SUMMARY"
            echo "No critical/regression sections in alert.md; nothing to file." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          title="[perf] nightly benchmark regressions (rolling)"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          excerpt=$(grep -A40 -E '^### (🔴 Critical Regressions|⚠️ Performance Regressions)' "$alert" | head -60)
          body=$(printf 'Nightly regressions on `%s`.\n\n%s\n\n**Run:** %s' "$HEAD_SHA" "$excerpt" "$RUN_URL")
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$body" --label performance --label benchmark
            exit 0
          fi
          if gh issue view "$existing" --json body,comments --jq '[.body, (.comments // [] | .[].body)] | join("\n")' | grep -q "$HEAD_SHA"; then
            echo "SHA $HEAD_SHA already reported on #$existing; skipping duplicate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh issue comment "$existing" --body "$body"
