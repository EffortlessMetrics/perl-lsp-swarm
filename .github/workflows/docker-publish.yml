name: Publish Docker Images

# Build and publish multi-arch Docker images
# Cost: ~$0.10 per publish (across all architectures)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.x.y)'
        required: true
        type: string
      push:
        description: 'Push to Docker Hub'
        required: false
        type: boolean
        default: true

concurrency:
  group: publish-docker-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # Dispatch-selected refs used to flow straight into every build/publish job
  # of this workflow while registry credentials were mounted (#9595). This
  # gate resolves the two trusted subjects server-side — the repository
  # default-branch head and the commit behind the declared version's
  # `v<version>` tag — over an anonymous `git ls-remote`, with no checkout and
  # no token mounted. A dispatch-selected ref that is neither of those fails
  # closed here, before any credential-bearing job is scheduled. `init` stays
  # independent so version-validation feedback remains visible on rejected
  # runs.
  resolve-trusted-anchor:
    name: Resolve trusted publish anchor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: none
    outputs:
      approved_sha: ${{ steps.anchor.outputs.approved_sha }}
    steps:
      - name: Resolve trusted anchors server-side
        id: anchor
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          SELECTED_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION_INPUT_RAW: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if ! [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Dispatch subject is not a full commit SHA."
            exit 1
          fi

          if [ -z "$DEFAULT_BRANCH" ] || ! [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$ ]]; then
            echo "::error::Repository default branch is missing or oddly named; refusing to derive a trusted anchor."
            exit 1
          fi

          shas_for() {
            git ls-remote "$REPO_URL" "$@" | awk '{print $1}' | sort -u
          }

          DEFAULT_HEAD=$(shas_for "refs/heads/${DEFAULT_BRANCH}" | sed -n '1p')
          if ! [[ "$DEFAULT_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve refs/heads/${DEFAULT_BRANCH} server-side; refusing to approve this run."
            exit 1
          fi

          APPROVED=""
          if [ "$SELECTED_SHA" = "$DEFAULT_HEAD" ]; then
            APPROVED="$SELECTED_SHA"
            printf 'Approved %s: selected ref matches the current %s head.\n' "$SELECTED_SHA" "$DEFAULT_BRANCH"
          elif [[ "$VERSION_INPUT_RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            # Release orchestration cuts annotated tags (`git tag -a`), whose
            # `refs/tags/v<X>` object id differs from the tagged commit that
            # dispatch selects, so the peeled `^{}` commit must be compared too.
            TAG_SHAS=$(shas_for "refs/tags/v${VERSION_INPUT_RAW}" "refs/tags/v${VERSION_INPUT_RAW}^{}")
            if grep -qx "$SELECTED_SHA" <<<"$TAG_SHAS"; then
              APPROVED="$SELECTED_SHA"
              printf 'Approved %s: selected ref matches tag refs/tags/v%s.\n' "$SELECTED_SHA" "$VERSION_INPUT_RAW"
            fi
          fi

          if [ -z "$APPROVED" ]; then
            {
              echo "::error::Publishing requires a trusted anchor: dispatch on the repository default branch (${DEFAULT_BRANCH}) or on a ref whose commit equals tag v${VERSION_INPUT_RAW}."
              echo "::error::Unapproved refs cannot reach a credential-bearing step (#9595/#9597)."
            } >&2
            exit 1
          fi

          printf 'approved_sha=%s\n' "$APPROVED" >> "$GITHUB_OUTPUT"

  init:
    name: Prepare version metadata
    runs-on: ubuntu-24.04
    # Narrower than the workflow-level grant, which also carries packages:write.
    # This job decides whether a dispatch version may publish at all, so it must
    # not itself hold registry authority — enforced here rather than asserted.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      major: ${{ steps.version.outputs.major }}
      is_stable: ${{ steps.version.outputs.is_stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Validation and tag derivation live in scripts/ci/docker_publish_metadata.py
      # so they can be tested directly. See scripts/ci/test_docker_publish_metadata.py
      # for the negative cases (workflow-command injection, shell metacharacters,
      # control characters, and prerelease stable-channel promotion).
      # This job holds no registry credentials.
      - name: Parse version
        id: version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: python3 scripts/ci/docker_publish_metadata.py

  build:
    name: Build builder image (multi-arch)
    runs-on: ubuntu-24.04
    needs: [init, resolve-trusted-anchor]
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Registry credentials below mount only next to gate-approved source
          # (#9595): the build context and Dockerfile are the approved subject,
          # never an operator-selected ref.
          ref: ${{ needs.resolve-trusted-anchor.outputs.approved_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Keep deterministic semver-like tags for manual dispatch runs.
          # `version` input is provided by release orchestration.
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}
            # Alias tags are stable channels. A prerelease publishes only its
            # own exact tag so that dispatching e.g. 1.2.3-rc.1 cannot silently
            # replace latest / 1 / 1.2 for every consumer.
            type=raw,value=${{ needs.init.outputs.major_minor }},enable=${{ needs.init.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.init.outputs.major }},enable=${{ needs.init.outputs.is_stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.init.outputs.is_stable == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify GHCR builder manifest platforms
        if: github.event.inputs.push != 'false'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          manifest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}")"
          grep -q 'linux/amd64' <<<"${manifest}" || {
            echo "GHCR builder manifest is missing linux/amd64" >&2
            exit 1
          }
          grep -q 'linux/arm64' <<<"${manifest}" || {
            echo "GHCR builder manifest is missing linux/arm64" >&2
            exit 1
          }

  build-perl-runtime:
    name: Build perl-lsp runtime image (multi-arch)
    runs-on: ubuntu-24.04
    needs: [init, resolve-trusted-anchor]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Registry credentials below mount only next to gate-approved source
          # (#9595).
          ref: ${{ needs.resolve-trusted-anchor.outputs.approved_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-perl
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}
            # Alias tags are stable channels. A prerelease publishes only its
            # own exact tag so that dispatching e.g. 1.2.3-rc.1 cannot silently
            # replace latest / 1 / 1.2 for every consumer.
            type=raw,value=${{ needs.init.outputs.major_minor }},enable=${{ needs.init.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.init.outputs.major }},enable=${{ needs.init.outputs.is_stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.init.outputs.is_stable == 'true' }}

      - name: Build and push perl-lsp runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/perl-lsp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify GHCR runtime manifest platforms
        if: github.event.inputs.push != 'false'
        env:
          IMAGE: ghcr.io/${{ github.repository }}-perl
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          manifest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}")"
          grep -q 'linux/amd64' <<<"${manifest}" || {
            echo "GHCR runtime manifest is missing linux/amd64" >&2
            exit 1
          }
          grep -q 'linux/arm64' <<<"${manifest}" || {
            echo "GHCR runtime manifest is missing linux/arm64" >&2
            exit 1
          }

  publish-dockerhub:
    name: Publish to Docker Hub
    runs-on: ubuntu-24.04
    needs: [init, resolve-trusted-anchor]
    timeout-minutes: 150
    if: github.event.inputs.push != 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Docker Hub credentials below mount only next to gate-approved
          # source (#9595).
          ref: ${{ needs.resolve-trusted-anchor.outputs.approved_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: effortlessmetrics/perl-lsp
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}
            # Alias tags are stable channels. A prerelease publishes only its
            # own exact tag so that dispatching e.g. 1.2.3-rc.1 cannot silently
            # replace latest / 1 / 1.2 for every consumer.
            type=raw,value=${{ needs.init.outputs.major_minor }},enable=${{ needs.init.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.init.outputs.major }},enable=${{ needs.init.outputs.is_stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.init.outputs.is_stable == 'true' }}

      - name: Build and push multi-arch (builder image)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  publish-dockerhub-perl:
    name: Publish perl-lsp runtime to Docker Hub
    runs-on: ubuntu-24.04
    needs: [init, resolve-trusted-anchor]
    timeout-minutes: 60
    if: github.event.inputs.push != 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Docker Hub credentials below mount only next to gate-approved
          # source (#9595).
          ref: ${{ needs.resolve-trusted-anchor.outputs.approved_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta-perl
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: effortlessmetrics/perl-lsp
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}-perl
            # See the builder job: prereleases claim no stable alias.
            type=raw,value=${{ needs.init.outputs.major_minor }}-perl,enable=${{ needs.init.outputs.is_stable == 'true' }}
            type=raw,value=latest-perl,enable=${{ needs.init.outputs.is_stable == 'true' }}

      - name: Build and push multi-arch (perl-lsp runtime image)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/perl-lsp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-perl.outputs.tags }}
          labels: ${{ steps.meta-perl.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  summary:
    name: Summary
    needs: [init, build, build-perl-runtime, publish-dockerhub, publish-dockerhub-perl]
    runs-on: ubuntu-24.04
    if: always()
    # Writes only to GITHUB_STEP_SUMMARY. It reports on the publish and must not
    # be able to alter it, so it takes no token scopes at all. Naming `contents`
    # explicitly rather than writing `permissions: {}` is deliberate: declaring
    # any scope drops every unlisted one to none, so this is the same grant, and
    # the workflow-security ratchet is a line scanner that rejects inline flow
    # mappings on security-sensitive keys because it cannot read them.
    permissions:
      contents: none

    steps:
      - name: Summary
        env:
          VERSION: ${{ needs.init.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          IS_STABLE: ${{ needs.init.outputs.is_stable }}
        run: |
          set -euo pipefail

          # This job runs under always(), so it also runs when init rejected the
          # version. In that case needs.init.outputs.version is empty and the
          # image-reference block below would advertise tags that were never
          # published. Report the failure instead.
          if [ -z "$VERSION" ]; then
            {
              echo "## Docker Image Publish"
              echo ""
              echo "Version validation failed; no images were published."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Docker Images Published"
            echo ""
            printf -- '- **Version**: %s\n' "$VERSION"
            if [ "$IS_STABLE" = "true" ]; then
              echo "- **Channel**: stable (latest, major, and major.minor aliases updated)"
            else
              echo "- **Channel**: prerelease (exact tag only; stable aliases unchanged)"
            fi
            echo "- **Platforms**: linux/amd64, linux/arm64"
            echo ""
            echo "### Builder image (Rust CI)"
            printf -- '- `ghcr.io/%s:%s`\n' "$REPOSITORY" "$VERSION"
            printf -- '- `effortlessmetrics/perl-lsp:%s`\n' "$VERSION"
            echo ""
            echo "### Runtime image (perllsp + Perl)"
            printf -- '- `ghcr.io/%s-perl:%s`\n' "$REPOSITORY" "$VERSION"
            printf -- '- `effortlessmetrics/perl-lsp:%s-perl`\n' "$VERSION"
            echo ""
            echo "### Usage"
            echo '```bash'
            printf 'docker run --rm -i -v "${PWD}:/workspace" effortlessmetrics/perl-lsp:%s-perl\n' "$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
