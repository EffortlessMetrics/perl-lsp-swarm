name: Publish Docker Images

# Build and publish multi-arch Docker images
# Cost: ~$0.10 per publish (across all architectures)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.x.y)'
        required: true
        type: string
      push:
        description: 'Push to Docker Hub'
        required: false
        type: boolean
        default: true

concurrency:
  group: publish-docker-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  init:
    name: Prepare version metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      major: ${{ steps.version.outputs.major }}
    steps:
      - name: Parse version
        id: version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$VERSION_INPUT"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            printf '::error::Invalid Docker publish version: %s\n' "$VERSION"
            exit 1
          fi

          BASE_VERSION="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ]; then
            printf '::error::Could not derive image tags from version: %s\n' "$VERSION"
            exit 1
          fi

          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'major_minor=%s.%s\n' "$MAJOR" "$MINOR" >> "$GITHUB_OUTPUT"
          printf 'major=%s\n' "$MAJOR" >> "$GITHUB_OUTPUT"

  build:
    name: Build builder image (multi-arch)
    runs-on: ubuntu-24.04
    needs: init
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Keep deterministic semver-like tags for manual dispatch runs.
          # `version` input is provided by release orchestration.
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}
            type=raw,value=${{ needs.init.outputs.major_minor }}
            type=raw,value=${{ needs.init.outputs.major }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify GHCR builder manifest platforms
        if: github.event.inputs.push != 'false'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          manifest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}")"
          grep -q 'linux/amd64' <<<"${manifest}" || {
            echo "GHCR builder manifest is missing linux/amd64" >&2
            exit 1
          }
          grep -q 'linux/arm64' <<<"${manifest}" || {
            echo "GHCR builder manifest is missing linux/arm64" >&2
            exit 1
          }

  build-perl-runtime:
    name: Build perl-lsp runtime image (multi-arch)
    runs-on: ubuntu-24.04
    needs: init
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-perl
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}
            type=raw,value=${{ needs.init.outputs.major_minor }}
            type=raw,value=${{ needs.init.outputs.major }}
            type=raw,value=latest

      - name: Build and push perl-lsp runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/perl-lsp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify GHCR runtime manifest platforms
        if: github.event.inputs.push != 'false'
        env:
          IMAGE: ghcr.io/${{ github.repository }}-perl
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          manifest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}")"
          grep -q 'linux/amd64' <<<"${manifest}" || {
            echo "GHCR runtime manifest is missing linux/amd64" >&2
            exit 1
          }
          grep -q 'linux/arm64' <<<"${manifest}" || {
            echo "GHCR runtime manifest is missing linux/arm64" >&2
            exit 1
          }

  publish-dockerhub:
    name: Publish to Docker Hub
    runs-on: ubuntu-24.04
    needs: init
    timeout-minutes: 150
    if: github.event.inputs.push != 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: effortlessmetrics/perl-lsp
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}
            type=raw,value=${{ needs.init.outputs.major_minor }}
            type=raw,value=${{ needs.init.outputs.major }}
            type=raw,value=latest

      - name: Build and push multi-arch (builder image)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  publish-dockerhub-perl:
    name: Publish perl-lsp runtime to Docker Hub
    runs-on: ubuntu-24.04
    needs: init
    timeout-minutes: 60
    if: github.event.inputs.push != 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta-perl
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: effortlessmetrics/perl-lsp
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}-perl
            type=raw,value=${{ needs.init.outputs.major_minor }}-perl
            type=raw,value=latest-perl

      - name: Build and push multi-arch (perl-lsp runtime image)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/perl-lsp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-perl.outputs.tags }}
          labels: ${{ steps.meta-perl.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  summary:
    name: Summary
    needs: [init, build, build-perl-runtime, publish-dockerhub, publish-dockerhub-perl]
    runs-on: ubuntu-24.04
    if: always()

    steps:
      - name: Summary
        env:
          VERSION: ${{ needs.init.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## Docker Images Published"
            echo ""
            printf -- '- **Version**: %s\n' "$VERSION"
            echo "- **Platforms**: linux/amd64, linux/arm64"
            echo ""
            echo "### Builder image (Rust CI)"
            printf -- '- `ghcr.io/%s:%s`\n' "$REPOSITORY" "$VERSION"
            printf -- '- `effortlessmetrics/perl-lsp:%s`\n' "$VERSION"
            echo ""
            echo "### Runtime image (perllsp + Perl)"
            printf -- '- `ghcr.io/%s-perl:%s`\n' "$REPOSITORY" "$VERSION"
            printf -- '- `effortlessmetrics/perl-lsp:%s-perl`\n' "$VERSION"
            echo ""
            echo "### Usage"
            echo '```bash'
            printf 'docker run --rm -i -v "${PWD}:/workspace" effortlessmetrics/perl-lsp:%s-perl\n' "$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
