name: Publish Docker Images

# Build and publish multi-arch Docker images.
#
# Digest-split publication topology (#9595/#12888): the build jobs interpret
# repository-controlled build configuration with NO registry credentials
# mounted — they export the gate-approved subject as a bounded, attested OCI
# layout artifact. Publication happens in minimal jobs that hold no repository
# checkout, verify the artifact digest BEFORE any login, and push only that
# verified subject; alias tags are created from the pushed digest.
# Cost: ~$0.10 per publish (across all architectures) plus artifact transfer.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.x.y)'
        required: true
        type: string
      push:
        description: 'Push to Docker Hub'
        required: false
        type: boolean
        default: true
      expected_sha:
        description: 'Exact candidate source SHA approved by release eligibility'
        required: true
        type: string
      candidate_run_id:
        description: 'Candidate workflow run that produced the terminal manifest'
        required: true
        type: string
      manifest_sha256:
        description: 'SHA256 of the terminal candidate manifest'
        required: true
        type: string

concurrency:
  group: publish-docker-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# No workflow-default write authority: every job declares the narrowest grant
# it needs (#5989/#12888). Only publish-ghcr holds `packages: write`, and it
# has no repository checkout.
permissions:
  contents: read

jobs:
  verify-release-eligibility:
    name: Verify release eligibility handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify exact subject and terminal manifest identity
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
          MANIFEST_SHA256: ${{ github.event.inputs.manifest_sha256 }}
          CANDIDATE_RUN_ID: ${{ github.event.inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$MANIFEST_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s' "$CANDIDATE_RUN_ID" | grep -Eq '^[0-9]+$'
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" --name release-terminal-candidate --dir release-candidate
          test -s release-candidate/dist/release-terminal-manifest.json
          actual_manifest_sha256="$(sha256sum release-candidate/dist/release-terminal-manifest.json | awk '{print $1}')"
          test "$actual_manifest_sha256" = "$MANIFEST_SHA256"
          echo "Accepted release eligibility handoff for $EXPECTED_SHA from run $CANDIDATE_RUN_ID."

  # Dispatch-selected refs used to flow straight into every build/publish job
  # of this workflow while registry credentials were mounted (#9595). This
  # gate resolves the two trusted subjects server-side — the repository
  # default-branch head and the commit behind the declared version's
  # `v<version>` tag — over an anonymous `git ls-remote`, with no checkout and
  # no token mounted. A dispatch-selected ref that is neither of those fails
  # closed here, before any credential-bearing job is scheduled. `init` stays
  # independent so version-validation feedback remains visible on rejected
  # runs.
  resolve-trusted-anchor:
    name: Resolve trusted publish anchor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: none
    outputs:
      approved_sha: ${{ steps.anchor.outputs.approved_sha }}
    steps:
      - name: Resolve trusted anchors server-side
        id: anchor
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          SELECTED_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION_INPUT_RAW: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if ! [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Dispatch subject is not a full commit SHA."
            exit 1
          fi

          if [ -z "$DEFAULT_BRANCH" ] || ! [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$ ]]; then
            echo "::error::Repository default branch is missing or oddly named; refusing to derive a trusted anchor."
            exit 1
          fi

          shas_for() {
            git ls-remote "$REPO_URL" "$@" | awk '{print $1}' | sort -u
          }

          DEFAULT_HEAD=$(shas_for "refs/heads/${DEFAULT_BRANCH}" | sed -n '1p')
          if ! [[ "$DEFAULT_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve refs/heads/${DEFAULT_BRANCH} server-side; refusing to approve this run."
            exit 1
          fi

          APPROVED=""
          if [ "$SELECTED_SHA" = "$DEFAULT_HEAD" ]; then
            APPROVED="$SELECTED_SHA"
            printf 'Approved %s: selected ref matches the current %s head.\n' "$SELECTED_SHA" "$DEFAULT_BRANCH"
          elif [[ "$VERSION_INPUT_RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            # Release orchestration cuts annotated tags (`git tag -a`), whose
            # `refs/tags/v<X>` object id differs from the tagged commit that
            # dispatch selects, so the peeled `^{}` commit must be compared too.
            TAG_SHAS=$(shas_for "refs/tags/v${VERSION_INPUT_RAW}" "refs/tags/v${VERSION_INPUT_RAW}^{}")
            if grep -qx "$SELECTED_SHA" <<<"$TAG_SHAS"; then
              APPROVED="$SELECTED_SHA"
              printf 'Approved %s: selected ref matches tag refs/tags/v%s.\n' "$SELECTED_SHA" "$VERSION_INPUT_RAW"
            fi
          fi

          if [ -z "$APPROVED" ]; then
            {
              echo "::error::Publishing requires a trusted anchor: dispatch on the repository default branch (${DEFAULT_BRANCH}) or on a ref whose commit equals tag v${VERSION_INPUT_RAW}."
              echo "::error::Unapproved refs cannot reach a credential-bearing step (#9595/#9597)."
            } >&2
            exit 1
          fi

          printf 'approved_sha=%s\n' "$APPROVED" >> "$GITHUB_OUTPUT"

  init:
    name: Prepare version metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Narrower than the historical workflow default. This job decides whether a
    # dispatch version may publish at all, so it must not itself hold registry
    # authority — enforced here rather than asserted.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      major: ${{ steps.version.outputs.major }}
      is_stable: ${{ steps.version.outputs.is_stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Validation and tag derivation live in scripts/ci/docker_publish_metadata.py
      # so they can be tested directly. See scripts/ci/test_docker_publish_metadata.py
      # for the negative cases (workflow-command injection, shell metacharacters,
      # control characters, and prerelease stable-channel promotion).
      # This job holds no registry credentials.
      - name: Parse version
        id: version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: python3 scripts/ci/docker_publish_metadata.py

  # Build jobs interpret repository-controlled build configuration (Dockerfile,
  # context, BuildKit frontend), so they mount no registry credentials at all
  # (#9595/#12888): no login step, no secrets context, and a job grant of
  # `contents: read` only. The subject is the gate-approved anchor, exported as
  # a compressed OCI layout artifact; the artifact sha256 is recorded as a job
  # output so the publication jobs can verify it before logging in.
  build:
    name: Build builder image (multi-arch, credential-free)
    runs-on: ubuntu-24.04
    needs: [init, resolve-trusted-anchor]
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      artifact_sha256: ${{ steps.artifact.outputs.artifact_sha256 }}
    env:
      OCI_TARBALL: builder-image.oci.tar
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build context and Dockerfile are the approved subject, never an
          # operator-selected ref (#9595).
          ref: ${{ needs.resolve-trusted-anchor.outputs.approved_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Labels only here; tags are applied by the publication jobs from the
          # pushed digest. A single throwaway tag satisfies the action contract.
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}

      - name: Build multi-arch OCI layout (no registry credentials)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          outputs: type=oci,dest=${{ env.OCI_TARBALL }},compression=zstd,force-compression=true

      - name: Digest OCI artifact
        id: artifact
        env:
          ARTIFACT_NAME: docker-builder-oci-${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail
          digest="$(sha256sum "$OCI_TARBALL" | awk '{print $1}')"
          if ! printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::OCI artifact digest is not a sha256: $digest"
            exit 1
          fi
          printf 'artifact_name=%s\n' "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          printf 'artifact_sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload OCI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ env.OCI_TARBALL }}
          # Consumed by the publication jobs in this same run; kept out of
          # long-term storage on purpose (bounded artifact, #9595).
          retention-days: 1

  build-perl-runtime:
    name: Build perl-lsp runtime image (multi-arch, credential-free)
    runs-on: ubuntu-24.04
    needs: [init, resolve-trusted-anchor]
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      artifact_sha256: ${{ steps.artifact.outputs.artifact_sha256 }}
    env:
      OCI_TARBALL: perl-runtime-image.oci.tar
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build context and Dockerfile are the approved subject (#9595).
          ref: ${{ needs.resolve-trusted-anchor.outputs.approved_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-perl
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}

      - name: Build multi-arch OCI layout (no registry credentials)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/perl-lsp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          outputs: type=oci,dest=${{ env.OCI_TARBALL }},compression=zstd,force-compression=true

      - name: Digest OCI artifact
        id: artifact
        env:
          ARTIFACT_NAME: docker-runtime-oci-${{ needs.init.outputs.version }}
        run: |
          set -euo pipefail
          digest="$(sha256sum "$OCI_TARBALL" | awk '{print $1}')"
          if ! printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::OCI artifact digest is not a sha256: $digest"
            exit 1
          fi
          printf 'artifact_name=%s\n' "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          printf 'artifact_sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload OCI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ env.OCI_TARBALL }}
          retention-days: 1

  # Minimal publication job (#9595/#12888): no repository checkout, the OCI
  # artifact digest is verified BEFORE any login, and only the verified subject
  # is pushed — once — after which every tag is created from the pushed digest
  # and re-read back to prove it resolves to that subject. `packages: write` is
  # the narrowest grant that can push to GHCR, and this job never sees a
  # checkout or build configuration.
  publish-ghcr:
    name: Publish GHCR images by digest
    runs-on: ubuntu-24.04
    needs: [verify-release-eligibility, init, build, build-perl-runtime]
    if: github.event.inputs.push != 'false'
    timeout-minutes: 60
    permissions:
      packages: write
    env:
      BUILDER_ARTIFACT_DIR: builder-artifact
      BUILDER_TARBALL: builder-image.oci.tar
      RUNTIME_ARTIFACT_DIR: runtime-artifact
      RUNTIME_TARBALL: perl-runtime-image.oci.tar
    steps:
      - name: Download builder OCI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ env.BUILDER_ARTIFACT_DIR }}

      - name: Download runtime OCI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-perl-runtime.outputs.artifact_name }}
          path: ${{ env.RUNTIME_ARTIFACT_DIR }}

      - name: Verify artifact digests before any login
        env:
          BUILDER_SHA256: ${{ needs.build.outputs.artifact_sha256 }}
          RUNTIME_SHA256: ${{ needs.build-perl-runtime.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail

          check_digest() {
            expected="$1"
            file="$2"
            label="$3"
            if ! printf '%s' "$expected" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::$label artifact digest from the build job is not a sha256: $expected"
              exit 1
            fi
            actual="$(sha256sum "$file" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$label artifact digest mismatch: expected $expected, got $actual; refusing to log in or publish."
              exit 1
            fi
            printf '%s artifact digest verified before login: sha256:%s\n' "$label" "$actual"
          }

          check_digest "$BUILDER_SHA256" "$BUILDER_ARTIFACT_DIR/$BUILDER_TARBALL" "Builder image"
          check_digest "$RUNTIME_SHA256" "$RUNTIME_ARTIFACT_DIR/$RUNTIME_TARBALL" "Runtime image"

      - name: Unpack OCI layouts
        run: |
          set -euo pipefail
          mkdir -p builder-layout runtime-layout
          tar -xf "$BUILDER_ARTIFACT_DIR/$BUILDER_TARBALL" -C builder-layout
          tar -xf "$RUNTIME_ARTIFACT_DIR/$RUNTIME_TARBALL" -C runtime-layout
          for layout in builder-layout runtime-layout; do
            if [ ! -f "$layout/index.json" ]; then
              echo "::error::$layout is not an OCI image layout (missing index.json)."
              exit 1
            fi
          done

      - name: Extract GHCR tags (builder image)
        id: meta-builder
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Keep deterministic semver-like tags for manual dispatch runs.
          # `version` input is provided by release orchestration.
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}
            # Alias tags are stable channels. A prerelease publishes only its
            # own exact tag so that dispatching e.g. 1.2.3-rc.1 cannot silently
            # replace latest / 1 / 1.2 for every consumer.
            type=raw,value=${{ needs.init.outputs.major_minor }},enable=${{ needs.init.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.init.outputs.major }},enable=${{ needs.init.outputs.is_stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.init.outputs.is_stable == 'true' }}

      - name: Extract GHCR tags (perl-lsp runtime image)
        id: meta-runtime
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-perl
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}
            # See the builder job: prereleases claim no stable alias.
            type=raw,value=${{ needs.init.outputs.major_minor }},enable=${{ needs.init.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.init.outputs.major }},enable=${{ needs.init.outputs.is_stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.init.outputs.is_stable == 'true' }}

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified subjects by digest (GHCR)
        env:
          BUILDER_TAGS: ${{ steps.meta-builder.outputs.tags }}
          RUNTIME_TAGS: ${{ steps.meta-runtime.outputs.tags }}
        run: |
          set -euo pipefail

          publish_layout() {
            layout="$1"
            tags="$2"
            label="$3"

            # metadata-action lowercases image names; the primary tag is the
            # first declared one (the exact version), so derive the digest
            # reference from it to stay byte-identical with what was pushed.
            primary="$(printf '%s\n' "$tags" | sed -n '1p')"
            if [ -z "$primary" ]; then
              echo "::error::$label metadata produced no tags."
              exit 1
            fi
            image_base="${primary%:*}"

            # Push the verified index once. Registry blobs dedupe, so the alias
            # creation below uploads manifest bytes only.
            skopeo copy --multi-arch all "oci:$layout" "docker://$primary"

            digest="$(skopeo inspect --format '{{.Digest}}' "docker://$primary")"
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::error::$label pushed subject has no usable digest: $digest"
              exit 1
            fi
            reference="$image_base@$digest"

            # Bounded multi-arch check on the pushed subject, before any alias
            # tag exists. Attestation manifests appear as unknown/unknown
            # platform entries; provenance/SBOM must survive the transfer
            # (#9595 keeps them attached to the published subject).
            manifest="$(docker buildx imagetools inspect "$reference")"
            grep -q 'linux/amd64' <<<"$manifest" || { echo "::error::$label manifest is missing linux/amd64" >&2; exit 1; }
            grep -q 'linux/arm64' <<<"$manifest" || { echo "::error::$label manifest is missing linux/arm64" >&2; exit 1; }
            grep -q 'unknown/unknown' <<<"$manifest" || {
              echo "::error::$label pushed index carries no attestation manifests; provenance/SBOM were lost in transfer." >&2
              exit 1
            }

            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              if [ "$tag" = "$primary" ]; then
                continue
              fi
              docker buildx imagetools create -t "$tag" "$reference"
            done <<<"$tags"

            # Every applied tag must resolve to the one verified subject.
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              tag_digest="$(skopeo inspect --format '{{.Digest}}' "docker://$tag")"
              if [ "$tag_digest" != "$digest" ]; then
                echo "::error::$label tag $tag resolves to $tag_digest, not the verified subject $digest."
                exit 1
              fi
            done <<<"$tags"

            printf '%s: every tag resolves to the verified subject %s.\n' "$label" "$reference"
          }

          publish_layout builder-layout "$BUILDER_TAGS" "GHCR builder image"
          publish_layout runtime-layout "$RUNTIME_TAGS" "GHCR runtime image"

  # Same minimal publication shape as publish-ghcr, against Docker Hub. It
  # holds no repository checkout, verifies both artifact digests before login,
  # and needs no GitHub token authority at all (Docker Hub credentials are
  # repository secrets consumed by the login step only).
  publish-dockerhub:
    name: Publish Docker Hub images by digest
    runs-on: ubuntu-24.04
    needs: [verify-release-eligibility, init, build, build-perl-runtime]
    if: github.event.inputs.push != 'false'
    timeout-minutes: 60
    permissions:
      contents: none
    env:
      BUILDER_ARTIFACT_DIR: builder-artifact
      BUILDER_TARBALL: builder-image.oci.tar
      RUNTIME_ARTIFACT_DIR: runtime-artifact
      RUNTIME_TARBALL: perl-runtime-image.oci.tar
    steps:
      - name: Download builder OCI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ env.BUILDER_ARTIFACT_DIR }}

      - name: Download runtime OCI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-perl-runtime.outputs.artifact_name }}
          path: ${{ env.RUNTIME_ARTIFACT_DIR }}

      - name: Verify artifact digests before any login
        env:
          BUILDER_SHA256: ${{ needs.build.outputs.artifact_sha256 }}
          RUNTIME_SHA256: ${{ needs.build-perl-runtime.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail

          check_digest() {
            expected="$1"
            file="$2"
            label="$3"
            if ! printf '%s' "$expected" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::$label artifact digest from the build job is not a sha256: $expected"
              exit 1
            fi
            actual="$(sha256sum "$file" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$label artifact digest mismatch: expected $expected, got $actual; refusing to log in or publish."
              exit 1
            fi
            printf '%s artifact digest verified before login: sha256:%s\n' "$label" "$actual"
          }

          check_digest "$BUILDER_SHA256" "$BUILDER_ARTIFACT_DIR/$BUILDER_TARBALL" "Builder image"
          check_digest "$RUNTIME_SHA256" "$RUNTIME_ARTIFACT_DIR/$RUNTIME_TARBALL" "Runtime image"

      - name: Unpack OCI layouts
        run: |
          set -euo pipefail
          mkdir -p builder-layout runtime-layout
          tar -xf "$BUILDER_ARTIFACT_DIR/$BUILDER_TARBALL" -C builder-layout
          tar -xf "$RUNTIME_ARTIFACT_DIR/$RUNTIME_TARBALL" -C runtime-layout
          for layout in builder-layout runtime-layout; do
            if [ ! -f "$layout/index.json" ]; then
              echo "::error::$layout is not an OCI image layout (missing index.json)."
              exit 1
            fi
          done

      - name: Extract Docker Hub tags (builder image)
        id: meta-builder
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: effortlessmetrics/perl-lsp
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}
            # Alias tags are stable channels. A prerelease publishes only its
            # own exact tag so that dispatching e.g. 1.2.3-rc.1 cannot silently
            # replace latest / 1 / 1.2 for every consumer.
            type=raw,value=${{ needs.init.outputs.major_minor }},enable=${{ needs.init.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.init.outputs.major }},enable=${{ needs.init.outputs.is_stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.init.outputs.is_stable == 'true' }}

      - name: Extract Docker Hub tags (perl-lsp runtime image)
        id: meta-runtime
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: effortlessmetrics/perl-lsp
          tags: |
            type=raw,value=${{ needs.init.outputs.version }}-perl
            # See the builder job: prereleases claim no stable alias.
            type=raw,value=${{ needs.init.outputs.major_minor }}-perl,enable=${{ needs.init.outputs.is_stable == 'true' }}
            type=raw,value=latest-perl,enable=${{ needs.init.outputs.is_stable == 'true' }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push verified subjects by digest (Docker Hub)
        env:
          BUILDER_TAGS: ${{ steps.meta-builder.outputs.tags }}
          RUNTIME_TAGS: ${{ steps.meta-runtime.outputs.tags }}
          HUB_IMAGE: effortlessmetrics/perl-lsp
        run: |
          set -euo pipefail

          publish_layout() {
            layout="$1"
            tags="$2"
            label="$3"

            primary="$(printf '%s\n' "$tags" | sed -n '1p')"
            if [ -z "$primary" ]; then
              echo "::error::$label metadata produced no tags."
              exit 1
            fi
            image_base="${primary%:*}"

            skopeo copy --multi-arch all "oci:$layout" "docker://$primary"

            digest="$(skopeo inspect --format '{{.Digest}}' "docker://$primary")"
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::error::$label pushed subject has no usable digest: $digest"
              exit 1
            fi
            reference="$image_base@$digest"

            manifest="$(docker buildx imagetools inspect "$reference")"
            grep -q 'linux/amd64' <<<"$manifest" || { echo "::error::$label manifest is missing linux/amd64" >&2; exit 1; }
            grep -q 'linux/arm64' <<<"$manifest" || { echo "::error::$label manifest is missing linux/arm64" >&2; exit 1; }
            grep -q 'unknown/unknown' <<<"$manifest" || {
              echo "::error::$label pushed index carries no attestation manifests; provenance/SBOM were lost in transfer." >&2
              exit 1
            }

            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              if [ "$tag" = "$primary" ]; then
                continue
              fi
              docker buildx imagetools create -t "$tag" "$reference"
            done <<<"$tags"

            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              tag_digest="$(skopeo inspect --format '{{.Digest}}' "docker://$tag")"
              if [ "$tag_digest" != "$digest" ]; then
                echo "::error::$label tag $tag resolves to $tag_digest, not the verified subject $digest."
                exit 1
              fi
            done <<<"$tags"

            printf '%s: every tag resolves to the verified subject %s.\n' "$label" "$reference"
          }

          publish_layout builder-layout "$BUILDER_TAGS" "Docker Hub builder image"
          publish_layout runtime-layout "$RUNTIME_TAGS" "Docker Hub runtime image"

  summary:
    name: Summary
    needs: [init, build, build-perl-runtime, publish-ghcr, publish-dockerhub]
    runs-on: ubuntu-24.04
    if: always()
    timeout-minutes: 5
    # Writes only to GITHUB_STEP_SUMMARY. It reports on the publish and must not
    # be able to alter it, so it takes no token scopes at all. Naming `contents`
    # explicitly rather than writing `permissions: {}` is deliberate: declaring
    # any scope drops every unlisted one to none, so this is the same grant, and
    # the workflow-security ratchet is a line scanner that rejects inline flow
    # mappings on security-sensitive keys because it cannot read them.
    permissions:
      contents: none

    steps:
      - name: Summary
        env:
          VERSION: ${{ needs.init.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          IS_STABLE: ${{ needs.init.outputs.is_stable }}
        run: |
          set -euo pipefail

          # This job runs under always(), so it also runs when init rejected the
          # version. In that case needs.init.outputs.version is empty and the
          # image-reference block below would advertise tags that were never
          # published. Report the failure instead.
          if [ -z "$VERSION" ]; then
            {
              echo "## Docker Image Publish"
              echo ""
              echo "Version validation failed; no images were published."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Docker Images Published"
            echo ""
            printf -- '- **Version**: %s\n' "$VERSION"
            if [ "$IS_STABLE" = "true" ]; then
              echo "- **Channel**: stable (latest, major, and major.minor aliases updated)"
            else
              echo "- **Channel**: prerelease (exact tag only; stable aliases unchanged)"
            fi
            echo "- **Platforms**: linux/amd64, linux/arm64"
            echo "- **Publication**: digest-split; artifacts digest-verified before login and every tag resolves to one pushed subject (#9595/#12888)"
            echo ""
            echo "### Builder image (Rust CI)"
            printf -- '- `ghcr.io/%s:%s`\n' "$REPOSITORY" "$VERSION"
            printf -- '- `effortlessmetrics/perl-lsp:%s`\n' "$VERSION"
            echo ""
            echo "### Runtime image (perllsp + Perl)"
            printf -- '- `ghcr.io/%s-perl:%s`\n' "$REPOSITORY" "$VERSION"
            printf -- '- `effortlessmetrics/perl-lsp:%s-perl`\n' "$VERSION"
            echo ""
            echo "### Usage"
            echo '```bash'
            printf 'docker run --rm -i -v "${PWD}:/workspace" effortlessmetrics/perl-lsp:%s-perl\n' "$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
