name: Verify final object-shape candidate for issue 13121

on:
  push:
    branches:
      - codex/13121-object-shape-assignment

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Execute final focused proof
        run: |
          cargo fmt --all -- --check
          cargo test -p perl-semantic-analyzer --test linked_list_receiver_facts --locked post_construction_link_assignment_preserves_blessed_container_shape
          cargo test -p perl-semantic-analyzer --test linked_list_receiver_facts --locked ordinary_hash_slot_assignment_remains_a_hash_shape
          cargo test -p perl-semantic-analyzer --test hashref_slot_assignment_facts --locked
          cargo clippy -p perl-semantic-analyzer --all-targets --locked -- -D warnings
      - name: Remove verification transport
        run: |
          rm .github/workflows/codex-13121-verify.yml
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add -A
          git commit -m 'chore(agent): remove #13121 verification transport'
          git push origin HEAD:codex/13121-object-shape-assignment
