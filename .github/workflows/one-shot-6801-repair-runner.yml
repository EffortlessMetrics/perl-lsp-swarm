name: One-shot PR 6801 repair runner

on:
  push:
    branches:
      - codex/6713-slash-ambiguity-edit-current

permissions:
  contents: write

jobs:
  repair-runner:
    name: Make bounded repair runner-independent
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/6713-slash-ambiguity-edit-current
          fetch-depth: 1
          persist-credentials: true

      - name: Remove temporary formatter bootstrap and this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          target = Path(".github/workflows/one-shot-6801-review-repairs.yml")
          text = target.read_text(encoding="utf-8")
          anchor = "\n          cargo fmt --all\n          git diff --check\n"
          replacement = "\n          git diff --check\n"
          if text.count(anchor) != 1:
              raise SystemExit("temporary formatter anchor drifted")
          target.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          Path(".github/workflows/one-shot-6801-repair-runner.yml").unlink()
          PY
          git diff --check

      - name: Commit runner repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            .github/workflows/one-shot-6801-review-repairs.yml \
            .github/workflows/one-shot-6801-repair-runner.yml
          git commit -m "chore(ci): make one-shot review repair runner-independent"
          git push origin HEAD:codex/6713-slash-ambiguity-edit-current
