name: Semantic port adapter source snapshot

on:
  push:
    branches:
      - agent/semantic-port-adapters-runner-6846

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_HEAD: d19c114a7de42488612121fd91264700be0da477
      OLD_CHILD_HEAD: 0e8eb95f3338a9861d3c71034063783a90da87f1
    steps:
      - name: Check out exact adapter candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 0e8eb95f3338a9861d3c71034063783a90da87f1
          path: candidate
          persist-credentials: false

      - name: Check out exact semantic-port base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: d19c114a7de42488612121fd91264700be0da477
          path: work
          persist-credentials: false

      - name: Reconstruct compiled source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$OLD_CHILD_HEAD"
          test "$(git -C work rev-parse HEAD)" = "$BASE_HEAD"
          cp candidate/.changes/unreleased/product-6846-Added-210342.yaml \
            work/.changes/unreleased/product-6846-Added-210342.yaml
          cp candidate/crates/perl-lsp-rs-core/src/providers/semantic_port_adapters.rs \
            work/crates/perl-lsp-rs-core/src/providers/semantic_port_adapters.rs
          cp candidate/crates/perl-lsp-rs-core/tests/semantic_port_adapters.rs \
            work/crates/perl-lsp-rs-core/tests/semantic_port_adapters.rs
          python - <<'PY'
          from pathlib import Path
          path = Path('work/crates/perl-lsp-rs-core/src/providers/mod.rs')
          text = path.read_text(encoding='utf-8')
          declaration = 'pub mod semantic_port;\n'
          reexport = 'pub use semantic_port::*;\n'
          if text.count(declaration) != 1 or text.count(reexport) != 1:
              raise SystemExit('semantic port module anchors changed')
          text = text.replace(declaration, declaration + 'pub mod semantic_port_adapters;\n')
          text = text.replace(reexport, reexport + 'pub use semantic_port_adapters::*;\n')
          path.write_text(text, encoding='utf-8')
          PY
          mkdir -p snapshot/crates/perl-lsp-rs-core/src/providers snapshot/crates/perl-lsp-rs-core/tests snapshot/.changes/unreleased
          cp work/.changes/unreleased/product-6846-Added-210342.yaml snapshot/.changes/unreleased/
          cp work/crates/perl-lsp-rs-core/Cargo.toml snapshot/crates/perl-lsp-rs-core/
          cp work/crates/perl-lsp-rs-core/src/providers/mod.rs snapshot/crates/perl-lsp-rs-core/src/providers/
          cp work/crates/perl-lsp-rs-core/src/providers/semantic_port.rs snapshot/crates/perl-lsp-rs-core/src/providers/
          cp work/crates/perl-lsp-rs-core/src/providers/semantic_port_adapters.rs snapshot/crates/perl-lsp-rs-core/src/providers/
          cp -R work/crates/perl-lsp-rs-core/src/providers/semantic_port snapshot/crates/perl-lsp-rs-core/src/providers/
          cp work/crates/perl-lsp-rs-core/tests/semantic_port_adapters.rs snapshot/crates/perl-lsp-rs-core/tests/
          git -C work diff --check

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-port-adapters-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot
          if-no-files-found: error
          retention-days: 3
