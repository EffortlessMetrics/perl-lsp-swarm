# ub-review - advisory unsafe/native-boundary review
#
# This lane is evidence-producing but not merge-required. It runs one complete
# semantic review when a same-repository PR first becomes reviewable. Repair
# pushes do not cancel the active investigation or automatically restart the
# entire review; provider-native PR completion may request a focused later pass
# when a material seam changes.
#
# Analysis, publication, and gate truth remain separate. The job may be
# continue-on-error without describing incomplete evidence or failed posting as
# a clean/pass review.

name: UB Review

on:
  pull_request:
    branches: [master, main]
    types: [opened, reopened, ready_for_review]

concurrency:
  group: ub-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fork-policy:
    name: UB Review (fork policy — skipped)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Skipped by policy
        shell: bash
        run: |
          echo "ub-review skipped: fork PRs cannot access org review secrets."
          echo "This is expected policy, not a product or review result."

  ub-review:
    name: UB Review Advisory on GitHub Hosted
    if: >-
      github.event.pull_request.draft != true &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      actions: read
    env:
      UB_REVIEW_RUNNER_SOURCE: github
      UB_REVIEW_RUNNER_CLASS: github-hosted
      UB_REVIEW_RUNNER_SIZE: standard
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR base ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Secret preflight
        shell: bash
        env:
          HAVE_MINIMAX: ${{ secrets.MINIMAX_API_KEY != '' && 'yes' || '' }}
          HAVE_OPENCODE: ${{ secrets.OPENCODE != '' && 'yes' || '' }}
        run: |
          set -euo pipefail
          if [ -z "${HAVE_MINIMAX:-}" ]; then
            echo "::error::MINIMAX_API_KEY is empty or missing"
            exit 1
          fi
          echo "MINIMAX_API_KEY: present"
          if [ -z "${HAVE_OPENCODE:-}" ]; then
            echo "::warning::OPENCODE is unavailable; fallback lanes may be limited"
          else
            echo "OPENCODE: present"
          fi

      - name: Build and publish UB review packet
        id: ub_review
        uses: EffortlessMetrics/ub-review@ca616b45de025cbd70fabb3849492385a00b4290 # immutable pre-release snapshot
        with:
          config: policy/ub-review.toml
          profile: gh-runner-proof
          runtime-profile: gh-runner-proof
          root: .
          base: origin/${{ github.base_ref }}
          head: HEAD
          out: target/ub-review
          install-tools: 'true'
          tool-bundle: core
          posting: review
          mode: intelligent-ci
          run-pass: auto
          depth: standard
          fail-on-gate: 'true'
          fail-on-post-error: 'true'
          allow-heavy: 'false'
          github-token: ${{ github.token }}
          minimax-api-key: ${{ secrets.MINIMAX_API_KEY }}
          minimax-provider-kind: anthropic
          model-mode: auto
          provider-policy: minimax-only
          opencode-api-key: ${{ secrets.OPENCODE }}
          lane-width: '6'
          model-timeout-sec: '300'
          max-inline-comments: '6'
          model-concurrency: '6'
          max-model-calls: '10'
          github-summary: 'true'

      - name: Compile downstream review-truth receipt
        if: always()
        shell: bash
        env:
          ACTION_OUTCOME: ${{ steps.ub_review.outcome }}
          PACKET_DIR: ${{ steps.ub_review.outputs.out || 'target/ub-review' }}
          GATE_OUTCOME_PATH: ${{ steps.ub_review.outputs.gate-outcome-path }}
          GITHUB_REVIEW_PATH: ${{ steps.ub_review.outputs.github-review-path }}
          POST_RESULT_PATH: ${{ steps.ub_review.outputs.post-result-path }}
          POST_ERROR_PATH: ${{ steps.ub_review.outputs.post-error-path }}
        run: |
          set -euo pipefail

          packet_dir="${PACKET_DIR:-target/ub-review}"
          receipt_path="${packet_dir}/review/consumer-truth.json"
          mkdir -p "$(dirname "${receipt_path}")"

          python3 - \
            "${packet_dir}/review/terminal_state.json" \
            "${GATE_OUTCOME_PATH:-${packet_dir}/review/gate_outcome.json}" \
            "${GITHUB_REVIEW_PATH:-${packet_dir}/review/github-review.json}" \
            "${POST_RESULT_PATH:-${packet_dir}/review/post-result.json}" \
            "${POST_ERROR_PATH:-${packet_dir}/review/post-error.json}" \
            "${receipt_path}" <<'PY'
          import json
          import os
          import pathlib
          import sys

          terminal_path, gate_path, payload_path, post_path, error_path, receipt_path = map(
              pathlib.Path, sys.argv[1:]
          )
          action_outcome = os.environ.get("ACTION_OUTCOME", "unknown")

          def read_json(path: pathlib.Path):
              if not path.is_file():
                  return None, "missing"
              try:
                  return json.loads(path.read_text(encoding="utf-8")), None
              except Exception as exc:
                  return None, f"invalid:{type(exc).__name__}"

          terminal, terminal_error = read_json(terminal_path)
          gate, gate_error = read_json(gate_path)
          payload, payload_error = read_json(payload_path)
          post_result, post_result_error = read_json(post_path)
          post_failure, post_failure_error = read_json(error_path)

          terminal_status = (
              terminal.get("status") if isinstance(terminal, dict) else None
          )
          evidence_gaps = (
              terminal.get("evidence_gaps", 0) if isinstance(terminal, dict) else 0
          )
          if not isinstance(evidence_gaps, int):
              evidence_gaps = 0

          if terminal_error:
              analysis_result = "not_proven"
              analysis_reason = f"terminal_state_{terminal_error}"
          elif terminal_status == "needs-reviewer-attention":
              analysis_result = "findings"
              analysis_reason = terminal.get("reason")
          elif terminal_status == "sufficient" and evidence_gaps == 0:
              analysis_result = "clean"
              analysis_reason = terminal.get("reason")
          elif terminal_status == "sufficient" and evidence_gaps > 0:
              analysis_result = "limited"
              analysis_reason = "terminal_state_sufficient_but_evidence_gaps_present"
          elif terminal_status == "artifact-only":
              analysis_result = "limited"
              analysis_reason = terminal.get("reason")
          else:
              analysis_result = "not_proven"
              analysis_reason = (
                  terminal.get("reason") if isinstance(terminal, dict)
                  else "terminal_state_unavailable"
              )

          if post_result is not None:
              publication_result = "posted"
              publication_reason = None
          elif error_path.is_file():
              publication_result = "failed"
              publication_reason = (
                  "post_error_receipt_present"
                  if post_failure is not None
                  else f"post_error_receipt_{post_failure_error}"
              )
          elif payload is not None:
              publication_result = "not_proven"
              publication_reason = "review_payload_prepared_without_post_receipt"
          elif payload_error == "missing":
              publication_result = "not_needed"
              publication_reason = None
          else:
              publication_result = "not_proven"
              publication_reason = f"review_payload_{payload_error}"

          gate_conclusion = gate.get("conclusion") if isinstance(gate, dict) else None
          if gate_error or gate_conclusion not in {"pass", "fail", "inconclusive"}:
              gate_result = "not_proven"
          else:
              gate_result = gate_conclusion

          if action_outcome != "success":
              overall_result = "not_proven"
              overall_reason = f"action_outcome:{action_outcome}"
          elif analysis_result in {"not_proven", "limited"}:
              overall_result = "not_proven"
              overall_reason = analysis_reason
          elif publication_result in {"failed", "not_proven"}:
              overall_result = "not_proven"
              overall_reason = publication_reason
          elif gate_result in {"not_proven", "inconclusive"}:
              overall_result = "not_proven"
              overall_reason = f"gate_result:{gate_result}"
          elif analysis_result == "findings" or gate_result == "fail":
              overall_result = "findings"
              overall_reason = analysis_reason
          else:
              overall_result = "clean"
              overall_reason = None

          receipt = {
              "schema": "ub-review-consumer-truth.v1",
              "advisory": True,
              "action_outcome": action_outcome,
              "analysis_result": analysis_result,
              "analysis_reason": analysis_reason,
              "publication_result": publication_result,
              "publication_reason": publication_reason,
              "gate_result": gate_result,
              "overall_result": overall_result,
              "overall_reason": overall_reason,
              "terminal_status": terminal_status,
              "evidence_gaps": evidence_gaps,
              "review_payload_present": payload is not None,
              "post_receipt_present": post_result is not None,
              "post_error_present": error_path.is_file(),
              "semantic_review_cancel_in_progress": False,
              "automatic_full_review_on_synchronize": False,
              "source_paths": {
                  "terminal_state": str(terminal_path),
                  "gate_outcome": str(gate_path),
                  "github_review": str(payload_path),
                  "post_result": str(post_path),
                  "post_error": str(error_path),
              },
              "parse_errors": {
                  "terminal_state": terminal_error,
                  "gate_outcome": gate_error,
                  "github_review": payload_error,
                  "post_result": post_result_error,
                  "post_error": post_failure_error,
              },
          }
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload UB review packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ub-review-packet-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: target/ub-review
          if-no-files-found: warn
          retention-days: 14
