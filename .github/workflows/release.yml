name: Release

# Build and release perl-lsp binaries for all platforms
# Cost: ~$0.50 per release (across all platforms)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v<0.x.y>)'
        required: true
        type: string
      prerelease:
        description: 'Mark this as a prerelease'
        required: false
        type: boolean
        default: false

# Cancel in-flight runs on concurrent release dispatches
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Resolve and validate tag
        id: meta
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE_INPUT: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="$TAG_INPUT"
          if [ -z "$TAG" ] && [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::Release tag is missing"
            exit 1
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            printf '::error::Invalid release tag: %s\n' "$TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          PRERELEASE="$PRERELEASE_INPUT"
          if [ -z "$PRERELEASE" ]; then
            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi

          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'prerelease=%s\n' "$PRERELEASE" >> "$GITHUB_OUTPUT"

          printf 'Resolved release tag: %s\n' "$TAG"
          printf 'Resolved version: %s\n' "$VERSION"
          printf 'Resolved prerelease: %s\n' "$PRERELEASE"

  build:
    name: Build ${{ matrix.target }}
    needs: release-metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            use_cross: false
          # Linux aarch64 GNU
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            use_cross: true
          # Linux musl (static)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            use_cross: true
          # macOS
          - target: x86_64-apple-darwin
            os: macos-15-intel
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            use_cross: false
          # Windows ARM64 — native build on windows-11-arm runner (#5208)
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: |
          # Immutable pin of the commit that tag v0.2.5 dereferences to, so the
          # build cannot change if the tag is ever re-pointed upstream. This is
          # the same code the previous `--tag v0.2.5` resolved to — a pinning
          # change with no version move.
          cargo install cross --locked --git https://github.com/cross-rs/cross --rev 88f49ff79e777bef6d3564531636ee4d3cc2f8d2

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
          cache-all-crates: true

      - name: Prepare exact release build identity
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.use_cross }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
          CANDIDATE_ID: ${{ needs.release-metadata.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          BUILD_CMD="cargo"
          if [ "$USE_CROSS" = "true" ]; then
            BUILD_CMD="cross"
          fi
          mkdir -p target/release-identity
          python3 scripts/generate_release_topology.py \
            --release "$VERSION" \
            --frozen-product-sha "$SOURCE_SHA" \
            --output target/release-identity/release-topology.json
          python3 scripts/release_build_identity.py prepare \
            --repository "$REPOSITORY" \
            --release-version "$VERSION" \
            --source-revision "$SOURCE_SHA" \
            --target "$TARGET" \
            --candidate-identity "$CANDIDATE_ID" \
            --artifact-role archive \
            --release-topology target/release-identity/release-topology.json \
            --product-identity policy/product-identity.toml \
            --runner "$BUILD_CMD" \
            --output target/release-identity/release-build-identity.json \
            --github-env "$GITHUB_ENV"
          printf 'BUILD_CMD=%s\n' "$BUILD_CMD" >> "$GITHUB_ENV"

      - name: Build binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Keep these literal `$BUILD_CMD build` command shapes: the
          # repository-owned dist-shadow contract parses them to prove that the
          # shadow manifest exactly matches the live release binaries.
          $BUILD_CMD build --locked --release --target "$TARGET" -p perllsp --bin perllsp
          $BUILD_CMD build --locked --release --target "$TARGET" -p perl-dap --bin perl-dap

      - name: Verify exact release build identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_build_identity.py verify \
            --input target/release-identity/release-build-identity.json \
            --runner "$BUILD_CMD" \
            --receipt target/release-identity/release-build-receipt.json

      - name: Package binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.use_cross }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          NAME="perllsp"

          if [[ "$TARGET" == *"windows"* ]]; then
            BIN="${NAME}.exe"
            DAP_BIN="perl-dap.exe"
            EXT=".zip"
          else
            BIN="${NAME}"
            DAP_BIN="perl-dap"
            EXT=".tar.gz"
          fi

          PKG_NAME="${NAME}-${VERSION}-${TARGET}"
          mkdir -p "$PKG_NAME"

          cp "target/${TARGET}/release/${BIN}" "$PKG_NAME/"
          cp "target/${TARGET}/release/${DAP_BIN}" "$PKG_NAME/"

          if [[ "$TARGET" != *"windows"* ]] && [ "$USE_CROSS" != "true" ]; then
            strip "${PKG_NAME}/${BIN}" 2>/dev/null || true
            strip "${PKG_NAME}/${DAP_BIN}" 2>/dev/null || true
          fi

          # Copy additional files
          cp README.md LICENSE-APACHE LICENSE-MIT "$PKG_NAME/" 2>/dev/null || true

          cd "$PKG_NAME"
          if command -v sha256sum >/dev/null; then
            sha256sum "$BIN" "$DAP_BIN" > SHA256SUMS.txt
          else
            shasum -a 256 "$BIN" "$DAP_BIN" > SHA256SUMS.txt
          fi
          cd ..

          if [ "$EXT" = ".zip" ]; then
            7z a "${PKG_NAME}${EXT}" "${PKG_NAME}"/*
          else
            tar czf "${PKG_NAME}${EXT}" "$PKG_NAME"
          fi

          printf 'ASSET=%s%s\n' "$PKG_NAME" "$EXT" >> "$GITHUB_ENV"
          printf 'PKG_NAME=%s\n' "$PKG_NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.ASSET }}
          retention-days: 1

      - name: Retain release build identity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-identity-${{ matrix.target }}
          path: |
            target/release-identity/release-topology.json
            target/release-identity/release-build-identity.json
            target/release-identity/release-build-receipt.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create Release
    needs: [build, release-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: stable

      - name: Download release archive artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: perllsp-*
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Generate consolidated SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | \
            sort -z | \
            xargs -0 sha256sum | \
            sed 's|  \./[^/]*/|  |' > ../SHA256SUMS
          cd ..
          cat SHA256SUMS

      - name: Verify release archives ship the DAP binary
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          # Flatten the per-artifact download tree into a single dist/ dir that
          # holds every archive plus the consolidated SHA256SUMS, then enforce
          # the downstream DAP contract (perl-dap present in every archive).
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          cp SHA256SUMS dist/
          cargo xtask release artifact-check \
            --dist dist \
            --version "$VERSION"

      - name: Verify curated release notes exist
        id: release_notes_preflight
        env:
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          NOTE_FILE="docs/releases/${TAG}.md"
          if [ ! -f "$NOTE_FILE" ]; then
            printf '::error file=%s::Curated release notes missing for %s. See RELEASE.md "Release History Updates" — every release must ship docs/releases/%s.md before tagging.\n' "$NOTE_FILE" "$TAG" "$TAG"
            exit 1
          fi
          printf 'note_file=%s\n' "$NOTE_FILE" >> "$GITHUB_OUTPUT"
          printf 'Found curated release notes: %s\n' "$NOTE_FILE"

      - name: Generate release notes from docs/releases/<tag>.md
        id: release_notes
        env:
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          # xtask strips YAML frontmatter and emits the curated body. The
          # command fails hard if the note file is missing — the earlier
          # preflight step makes that a clearer error message in the UI.
          cargo xtask release-notes --tag "$TAG" --output release_notes.md
          echo "--- release_notes.md ---"
          cat release_notes.md
          echo "--- /release_notes.md ---"

      # Preflight before anything irreversible. Installing cargo-sbom is the
      # part that can fail on a transient registry error, and the SBOM step now
      # fails hard rather than warning. Running the install before the Release
      # is created means such a failure aborts the job while nothing has been
      # published yet, instead of leaving a public Release with no SBOM asset
      # and a red job that cannot be cleanly re-run.
      #
      # Intentionally ungated, unlike the Release steps below which are gated on
      # `workflow_dispatch`. The previous combined "Generate SBOM" step already
      # ran this install unconditionally on every trigger, so leaving it ungated
      # keeps `release: published` behaviour identical and changes only the
      # ordering on `workflow_dispatch`. Gating it here would break SBOM
      # generation on the `release: published` path.
      - name: Install cargo-sbom (preflight)
        run: |
          set -euo pipefail
          cargo install cargo-sbom --version 0.9.1 --locked

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/*/*
            SHA256SUMS
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.release-metadata.outputs.prerelease == 'true' }}
          tag_name: ${{ needs.release-metadata.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        run: |
          set -euo pipefail
          cargo sbom --output-format spdx_json_2_3 > sbom-spdx.json
          test -s sbom-spdx.json

      - name: Upload SBOM as release asset
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: sbom-spdx.json
          tag_name: ${{ needs.release-metadata.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
