name: Release

# Build and release perl-lsp binaries for all platforms.
# The public GitHub Release is created only after archives, checksums, curated
# notes, and a non-empty SBOM have all succeeded (#6231/#14406).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v<0.x.y>)'
        required: true
        type: string
      prerelease:
        description: 'Mark this as a prerelease'
        required: false
        type: boolean
        default: false
      fail_before_publish:
        description: 'No-publish proof only: fail after artifact validation and before Release creation'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Resolve and validate tag
        id: meta
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE_INPUT: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="$TAG_INPUT"
          if [ -z "$TAG" ] && [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::Release tag is missing"
            exit 1
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            printf '::error::Invalid release tag: %s\n' "$TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
          elif [ -z "$PRERELEASE_INPUT" ]; then
            PRERELEASE="false"
          else
            PRERELEASE="$PRERELEASE_INPUT"
          fi

          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'prerelease=%s\n' "$PRERELEASE" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: release-metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            use_cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            use_cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: |
          cargo install cross --locked --git https://github.com/cross-rs/cross --rev 88f49ff79e777bef6d3564531636ee4d3cc2f8d2

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
          cache-all-crates: true

      - name: Prepare exact release build identity
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.use_cross }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
          CANDIDATE_ID: ${{ needs.release-metadata.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          BUILD_CMD="cargo"
          if [ "$USE_CROSS" = "true" ]; then
            BUILD_CMD="cross"
          fi
          mkdir -p target/release-identity
          python3 scripts/generate_release_topology.py \
            --release "$VERSION" \
            --frozen-product-sha "$SOURCE_SHA" \
            --output target/release-identity/release-topology.json
          python3 scripts/release_build_identity.py prepare \
            --repository "$REPOSITORY" \
            --release-version "$VERSION" \
            --source-revision "$SOURCE_SHA" \
            --target "$TARGET" \
            --candidate-identity "$CANDIDATE_ID" \
            --artifact-role archive \
            --release-topology target/release-identity/release-topology.json \
            --product-identity policy/product-identity.toml \
            --runner "$BUILD_CMD" \
            --output target/release-identity/release-build-identity.json \
            --github-env "$GITHUB_ENV"
          printf 'BUILD_CMD=%s\n' "$BUILD_CMD" >> "$GITHUB_ENV"

      - name: Build binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          $BUILD_CMD build --locked --release --target "$TARGET" -p perllsp --bin perllsp
          $BUILD_CMD build --locked --release --target "$TARGET" -p perl-dap --bin perl-dap

      - name: Verify exact release build identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_build_identity.py verify \
            --input target/release-identity/release-build-identity.json \
            --runner "$BUILD_CMD" \
            --receipt target/release-identity/release-build-receipt.json

      - name: Package binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.use_cross }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          NAME="perllsp"

          if [[ "$TARGET" == *"windows"* ]]; then
            BIN="${NAME}.exe"
            DAP_BIN="perl-dap.exe"
            EXT=".zip"
          else
            BIN="${NAME}"
            DAP_BIN="perl-dap"
            EXT=".tar.gz"
          fi

          PKG_NAME="${NAME}-${VERSION}-${TARGET}"
          mkdir -p "$PKG_NAME"
          cp "target/${TARGET}/release/${BIN}" "$PKG_NAME/"
          cp "target/${TARGET}/release/${DAP_BIN}" "$PKG_NAME/"

          if [[ "$TARGET" != *"windows"* ]] && [ "$USE_CROSS" != "true" ]; then
            strip "${PKG_NAME}/${BIN}" 2>/dev/null || true
            strip "${PKG_NAME}/${DAP_BIN}" 2>/dev/null || true
          fi

          cp README.md LICENSE-APACHE LICENSE-MIT "$PKG_NAME/" 2>/dev/null || true

          cd "$PKG_NAME"
          if command -v sha256sum >/dev/null; then
            sha256sum "$BIN" "$DAP_BIN" > SHA256SUMS.txt
          else
            shasum -a 256 "$BIN" "$DAP_BIN" > SHA256SUMS.txt
          fi
          cd ..

          if [ "$EXT" = ".zip" ]; then
            7z a "${PKG_NAME}${EXT}" "${PKG_NAME}"/*
          else
            tar czf "${PKG_NAME}${EXT}" "$PKG_NAME"
          fi

          printf 'ASSET=%s%s\n' "$PKG_NAME" "$EXT" >> "$GITHUB_ENV"
          printf 'PKG_NAME=%s\n' "$PKG_NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.ASSET }}
          retention-days: 1

      - name: Retain release build identity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-identity-${{ matrix.target }}
          path: |
            target/release-identity/release-topology.json
            target/release-identity/release-build-identity.json
            target/release-identity/release-build-receipt.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: Validate complete release set and create Release
    needs: [build, release-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: stable

      - name: Download release archive artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: perllsp-*
          path: artifacts

      - name: Generate consolidated SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | \
            sort -z | \
            xargs -0 sha256sum | \
            sed 's|  \./[^/]*/|  |' > ../SHA256SUMS
          cd ..
          test -s SHA256SUMS

      - name: Verify release archives ship the DAP binary
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          cp SHA256SUMS dist/
          cargo xtask release artifact-check --dist dist --version "$VERSION"

      - name: Verify curated release notes exist
        env:
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          NOTE_FILE="docs/releases/${TAG}.md"
          if [ ! -f "$NOTE_FILE" ]; then
            printf '::error file=%s::Curated release notes missing for %s\n' "$NOTE_FILE" "$TAG"
            exit 1
          fi

      - name: Generate release notes
        env:
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          cargo xtask release-notes --tag "$TAG" --output release_notes.md
          test -s release_notes.md

      - name: Install cargo-sbom before public mutation
        run: |
          set -euo pipefail
          cargo install cargo-sbom --version 0.9.1 --locked

      - name: Generate and validate SBOM before public mutation
        run: |
          set -euo pipefail
          cargo sbom --output-format spdx_json_2_3 > sbom-spdx.json
          test -s sbom-spdx.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("sbom-spdx.json").read_text(encoding="utf-8"))
          if not isinstance(payload, dict):
              raise SystemExit("SBOM root must be an object")
          if payload.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit("SBOM must declare SPDX-2.3")
          packages = payload.get("packages")
          if not isinstance(packages, list) or not packages:
              raise SystemExit("SBOM contains no package subjects")
          PY

      - name: Inject deterministic no-publish predecessor failure
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fail_before_publish == 'true' }}
        run: |
          echo "::error::Injected predecessor failure after complete artifact validation; public Release creation remains unreachable."
          exit 1

      - name: Create one complete GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/*/*
            SHA256SUMS
            sbom-spdx.json
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.release-metadata.outputs.prerelease == 'true' }}
          tag_name: ${{ needs.release-metadata.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch downstream stable package refresh workflows
        if: github.event_name == 'workflow_dispatch' && needs.release-metadata.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          workflows=(brew-bump.yml scoop-bump.yml chocolatey-bump.yml winget-bump.yml)
          for workflow in "${workflows[@]}"; do
            gh workflow run "$workflow" \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$DEFAULT_BRANCH" \
              --field "tag=$RELEASE_TAG"
          done

      - name: Record prerelease package refresh disposition
        if: github.event_name == 'workflow_dispatch' && needs.release-metadata.outputs.prerelease == 'true'
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          printf 'Package-channel refresh skipped for prerelease %s; downstream package workflows remain stable-release only.\n' "$RELEASE_TAG"
