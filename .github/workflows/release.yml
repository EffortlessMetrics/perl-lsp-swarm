name: Release

# Build and release perl-lsp binaries for all platforms
# Cost: ~$0.50 per release (across all platforms)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v<0.x.y>)'
        required: true
        type: string
      expected_sha:
        description: 'Exact validated 40-hex release subject from orchestration'
        required: true
        type: string
      prerelease:
        description: 'Mark this as a prerelease'
        required: false
        type: boolean
        default: false
      skip_crates:
        description: 'Do not dispatch crates.io publication'
        required: false
        type: boolean
        default: false
      skip_extension:
        description: 'Do not dispatch editor-registry publication'
        required: false
        type: boolean
        default: false
      skip_docker:
        description: 'Do not dispatch container publication'
        required: false
        type: boolean
        default: false

# Cancel in-flight runs on concurrent release dispatches
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Resolve and validate tag
        id: meta
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PRERELEASE_INPUT: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf '::error::Expected release source SHA is malformed\n'
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            printf '::error::Child workflow resolved another source SHA: expected %s, got %s\n' "$EXPECTED_SHA" "$GITHUB_SHA"
            exit 1
          fi
          if [ "$REF_TYPE" != "branch" ] || [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            printf '::error::Release candidate must start at the exact default-branch ref, got %s/%s\n' "$REF_TYPE" "$REF_NAME"
            exit 1
          fi
          TAG="$TAG_INPUT"
          if [ -z "$TAG" ] && [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::Release tag is missing"
            exit 1
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            printf '::error::Invalid release tag: %s\n' "$TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          # SemVer prerelease tags (hyphenated) are never package-channel
          # stable. The boolean workflow_dispatch input defaults to false, so
          # empty-input inference alone would miss vX.Y.Z-rc.N and still fan
          # out Scoop/Chocolatey/WinGet stable refreshes.
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
          elif [ -z "$PRERELEASE_INPUT" ]; then
            PRERELEASE="false"
          else
            PRERELEASE="$PRERELEASE_INPUT"
          fi

          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'prerelease=%s\n' "$PRERELEASE" >> "$GITHUB_OUTPUT"

          printf 'Resolved release tag: %s\n' "$TAG"
          printf 'Resolved version: %s\n' "$VERSION"
          printf 'Resolved prerelease: %s\n' "$PRERELEASE"

  build:
    name: Build ${{ matrix.target }}
    needs: release-metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            use_cross: false
          # Linux aarch64 GNU
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            use_cross: true
          # Linux musl (static)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            use_cross: true
          # macOS
          - target: x86_64-apple-darwin
            os: macos-15-intel
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            use_cross: false
          # Windows ARM64 — native build on windows-11-arm runner (#5208)
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject an occupied release tag
        shell: bash
        env:
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            printf '::error::Release tag already exists: %s\n' "$TAG"
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: |
          # Immutable pin of the commit that tag v0.2.5 dereferences to, so the
          # build cannot change if the tag is ever re-pointed upstream. This is
          # the same code the previous `--tag v0.2.5` resolved to — a pinning
          # change with no version move.
          cargo install cross --locked --git https://github.com/cross-rs/cross --rev 88f49ff79e777bef6d3564531636ee4d3cc2f8d2

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
          cache-all-crates: true

      - name: Prepare exact release build identity
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.use_cross }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
          CANDIDATE_ID: ${{ needs.release-metadata.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          BUILD_CMD="cargo"
          if [ "$USE_CROSS" = "true" ]; then
            BUILD_CMD="cross"
          fi
          mkdir -p target/release-identity
          python3 scripts/generate_release_topology.py \
            --release "$VERSION" \
            --frozen-product-sha "$SOURCE_SHA" \
            --output target/release-identity/release-topology.json
          python3 scripts/release_build_identity.py prepare \
            --repository "$REPOSITORY" \
            --release-version "$VERSION" \
            --source-revision "$SOURCE_SHA" \
            --target "$TARGET" \
            --candidate-identity "$CANDIDATE_ID" \
            --artifact-role archive \
            --release-topology target/release-identity/release-topology.json \
            --product-identity policy/product-identity.toml \
            --runner "$BUILD_CMD" \
            --output target/release-identity/release-build-identity.json \
            --github-env "$GITHUB_ENV"
          printf 'BUILD_CMD=%s\n' "$BUILD_CMD" >> "$GITHUB_ENV"

      - name: Build binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Keep these literal `$BUILD_CMD build` command shapes: the
          # repository-owned dist-shadow contract parses them to prove that the
          # shadow manifest exactly matches the live release binaries.
          $BUILD_CMD build --locked --release --target "$TARGET" -p perllsp --bin perllsp
          $BUILD_CMD build --locked --release --target "$TARGET" -p perl-dap --bin perl-dap

      - name: Verify exact release build identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_build_identity.py verify \
            --input target/release-identity/release-build-identity.json \
            --runner "$BUILD_CMD" \
            --receipt target/release-identity/release-build-receipt.json

      - name: Package binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.use_cross }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          NAME="perllsp"

          if [[ "$TARGET" == *"windows"* ]]; then
            BIN="${NAME}.exe"
            DAP_BIN="perl-dap.exe"
            EXT=".zip"
          else
            BIN="${NAME}"
            DAP_BIN="perl-dap"
            EXT=".tar.gz"
          fi

          PKG_NAME="${NAME}-${VERSION}-${TARGET}"
          mkdir -p "$PKG_NAME"

          cp "target/${TARGET}/release/${BIN}" "$PKG_NAME/"
          cp "target/${TARGET}/release/${DAP_BIN}" "$PKG_NAME/"

          if [[ "$TARGET" != *"windows"* ]] && [ "$USE_CROSS" != "true" ]; then
            strip "${PKG_NAME}/${BIN}" 2>/dev/null || true
            strip "${PKG_NAME}/${DAP_BIN}" 2>/dev/null || true
          fi

          # Copy additional files
          cp README.md LICENSE-APACHE LICENSE-MIT "$PKG_NAME/" 2>/dev/null || true

          cd "$PKG_NAME"
          if command -v sha256sum >/dev/null; then
            sha256sum "$BIN" "$DAP_BIN" > SHA256SUMS.txt
          else
            shasum -a 256 "$BIN" "$DAP_BIN" > SHA256SUMS.txt
          fi
          cd ..

          if [ "$EXT" = ".zip" ]; then
            7z a "${PKG_NAME}${EXT}" "${PKG_NAME}"/*
          else
            tar czf "${PKG_NAME}${EXT}" "$PKG_NAME"
          fi

          printf 'ASSET=%s%s\n' "$PKG_NAME" "$EXT" >> "$GITHUB_ENV"
          printf 'PKG_NAME=%s\n' "$PKG_NAME" >> "$GITHUB_ENV"

      - name: Bind post-strip package members to validated build evidence
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/release_package_evidence.py \
            --receipt target/release-identity/release-build-receipt.json \
            --package-dir "$PKG_NAME" \
            --archive "$ASSET" \
            --source-sha "$SOURCE_SHA" \
            --version "$VERSION" \
            --target "$TARGET" \
            --output target/release-identity/release-package-evidence.json

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.ASSET }}
          retention-days: 1

      - name: Retain release build identity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-identity-${{ matrix.target }}
          path: |
            target/release-identity/release-topology.json
            target/release-identity/release-build-identity.json
            target/release-identity/release-build-receipt.json
            target/release-identity/release-package-evidence.json
          if-no-files-found: error
          retention-days: 90

  candidate:
    name: Build terminal release candidate
    needs: [build, release-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: stable

      - name: Download release archive artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: perllsp-*
          path: artifacts

      - name: Download exact build identity evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-build-identity-*
          path: candidate/evidence

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Generate consolidated SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p candidate/dist
          declare -A ARCHIVE_NAMES=()
          while IFS= read -r -d '' archive; do
            name=$(basename "$archive")
            if [ -n "${ARCHIVE_NAMES[$name]:-}" ]; then
              printf '::error::Duplicate archive filename: %s\n' "$name"
              exit 1
            fi
            ARCHIVE_NAMES[$name]=1
            cp "$archive" candidate/dist/
          done < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0)
          cd candidate/dist
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | \
            sort -z | \
            xargs -0 sha256sum | sed 's|  \./|  |' > SHA256SUMS
          cat SHA256SUMS

      - name: Verify release archives ship the DAP binary
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          # Flatten the per-artifact download tree into a single dist/ dir that
          # holds every archive plus the consolidated SHA256SUMS, then enforce
          # the downstream DAP contract (perl-dap present in every archive).
          cargo xtask release artifact-check \
            --dist candidate/dist \
            --version "$VERSION"

      - name: Verify curated release notes exist
        id: release_notes_preflight
        env:
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          NOTE_FILE="docs/releases/${TAG}.md"
          if [ ! -f "$NOTE_FILE" ]; then
            printf '::error file=%s::Curated release notes missing for %s. See RELEASE.md "Release History Updates" — every release must ship docs/releases/%s.md before tagging.\n' "$NOTE_FILE" "$TAG" "$TAG"
            exit 1
          fi
          printf 'note_file=%s\n' "$NOTE_FILE" >> "$GITHUB_OUTPUT"
          printf 'Found curated release notes: %s\n' "$NOTE_FILE"

      - name: Generate release notes from docs/releases/<tag>.md
        id: release_notes
        env:
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          # xtask strips YAML frontmatter and emits the curated body. The
          # command fails hard if the note file is missing — the earlier
          # preflight step makes that a clearer error message in the UI.
          cargo xtask release-notes --tag "$TAG" --output release_notes.md
          echo "--- release_notes.md ---"
          cat release_notes.md
          echo "--- /release_notes.md ---"

      - name: Install cargo-sbom (preflight)
        run: |
          set -euo pipefail
          cargo install cargo-sbom --version 0.9.1 --locked

      - name: Generate and validate nonempty SPDX SBOM
        run: |
          set -euo pipefail
          cargo sbom --output-format spdx_json_2_3 > candidate/dist/sbom-spdx.json
          test -s candidate/dist/sbom-spdx.json

      - name: Build terminal artifact manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          cp release_notes.md candidate/release_notes.md
          python3 scripts/release_terminal_manifest.py \
            --candidate candidate \
            --source-sha "$SOURCE_SHA" \
            --tag "$TAG"
          python3 scripts/release_terminal_manifest.py \
            --candidate candidate \
            --source-sha "$SOURCE_SHA" \
            --tag "$TAG" \
            --check

      - name: Attest exact terminal candidate subjects
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.0
        with:
          subject-checksums: candidate/attestation-subjects.sha256

      - name: Upload terminal candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-terminal-candidate
          path: candidate
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish terminal GitHub Release candidate
    needs: [candidate, release-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout exact release subject validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.expected_sha }}
          persist-credentials: false

      - name: Download terminal candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-terminal-candidate
          path: candidate

      - name: Bind terminal manifest to this publication subject
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/release_terminal_manifest.py \
            --candidate candidate \
            --source-sha "$SOURCE_SHA" \
            --tag "$TAG" \
            --check

      - name: Atomically create exact release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api -X POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="$SOURCE_SHA" >/dev/null
          OBSERVED_SHA=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')
          if [ "$OBSERVED_SHA" != "$SOURCE_SHA" ]; then
            printf '::error::Atomic release tag does not name exact source: expected %s, got %s\n' "$SOURCE_SHA" "$OBSERVED_SHA"
            exit 1
          fi

      - name: Create GitHub Release from terminal candidate
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: candidate/dist/*
          body_path: candidate/release_notes.md
          draft: false
          prerelease: ${{ needs.release-metadata.outputs.prerelease == 'true' }}
          tag_name: ${{ needs.release-metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact release tag currentness
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OBSERVED_SHA=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')
          if [ "$OBSERVED_SHA" != "$SOURCE_SHA" ]; then
            printf '::error::Release tag currentness changed: expected %s, got %s\n' "$SOURCE_SHA" "$OBSERVED_SHA"
            exit 1
          fi

  dispatch-publishers:
    name: Dispatch admitted downstream publishers
    needs: [publish-release, release-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Dispatch primary publishers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
          SKIP_CRATES: ${{ github.event.inputs.skip_crates }}
          SKIP_EXTENSION: ${{ github.event.inputs.skip_extension }}
          SKIP_DOCKER: ${{ github.event.inputs.skip_docker }}
        run: |
          set -euo pipefail
          if [ "$SKIP_CRATES" != "true" ]; then
            gh api -X POST \
              /repos/${{ github.repository }}/actions/workflows/publish-crates.yml/dispatches \
              -f ref="$TAG" -F inputs[version]="$VERSION" -F inputs[dry_run]="false"
          fi
          if [ "$SKIP_EXTENSION" != "true" ]; then
            gh api -X POST \
              /repos/${{ github.repository }}/actions/workflows/publish-extension.yml/dispatches \
              -f ref="$TAG" -F inputs[version]="$VERSION"
          fi
          if [ "$SKIP_DOCKER" != "true" ]; then
            gh api -X POST \
              /repos/${{ github.repository }}/actions/workflows/docker-publish.yml/dispatches \
              -f ref="$TAG" -F inputs[version]="$VERSION" -F inputs[push]="true"
          fi

      - name: Dispatch downstream package refresh workflows
        if: needs.release-metadata.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          workflows=(
            brew-bump.yml
            scoop-bump.yml
            chocolatey-bump.yml
            winget-bump.yml
          )
          for workflow in "${workflows[@]}"; do
            printf 'Dispatching %s for %s\n' "$workflow" "$RELEASE_TAG"
            gh workflow run "$workflow" \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$DEFAULT_BRANCH" \
              --field "tag=$RELEASE_TAG"
          done

      - name: Record prerelease package refresh disposition
        if: needs.release-metadata.outputs.prerelease == 'true'
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          printf 'Package-channel refresh skipped for prerelease %s; downstream package workflows remain stable-release only.\n' "$RELEASE_TAG"
