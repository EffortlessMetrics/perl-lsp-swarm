name: Temporary Dancer2 1.x finalization v3

on:
  push:
    branches: ["fix/13089-dancer2-dsl-keywords"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/13089-dancer2-dsl-keywords
          fetch-depth: 1

      - name: Apply remaining review dispositions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(
              ".github/workflows/temp-dancer2-13178-finalize.yml"
          ).read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])

          call_block_start_marker = '''routes = replace_once(
              routes,
              ''' + "'''" + '''            handler_context_facts.push(mint_handler_context_fact(
          '''
          call_block_end_marker = '''routes = replace_once(
              routes,
              ''' + "'''" + '''fn mint_handler_context_fact(
          '''
          call_block_start = script.index(call_block_start_marker)
          call_block_end = script.index(call_block_end_marker, call_block_start)
          robust_call_patch = '''call_start = routes.index(
              "handler_context_facts.push(mint_handler_context_fact("
          )
          call_end = routes.index("));", call_start) + len("));")
          call = routes[call_start:call_end]
          call = replace_once(
              call,
              "                framework_version,\\n                source_generation,\\n",
              "                framework_version,\\n                dsl_contract_version,\\n                source_generation,\\n",
              "handler context call",
          )
          routes = routes[:call_start] + call + routes[call_end:]
          '''
          script = (
              script[:call_block_start]
              + robust_call_patch
              + script[call_block_end:]
          )

          analyzer_block_start = script.index("analyzer_test_anchor = ")
          analyzer_write = "analyzer_path.write_text(analyzer)\n"
          analyzer_block_end = (
              script.index(analyzer_write, analyzer_block_start)
              + len(analyzer_write)
          )
          robust_analyzer_patch = '''test_marker = (
              "\\n// Falsifier: ZERO family facts without registry activation.\\n"
          )
          if analyzer.count(test_marker) != 1:
              raise SystemExit(
                  "versioned handler context proof: expected one insertion boundary, "
                  f"found {analyzer.count(test_marker)}"
              )
          version_test = """
          #[test]
          fn handler_context_uses_the_activation_selected_dsl_contract() {
              let code = "package App;\\nuse Dancer2;\\nget '/x' => sub { params; };\\n";
              let input = input_with_version("gen-1", "1.0.0");
              let facts = family_facts_with_input(code, &input);

              assert_eq!(facts.handler_contexts.len(), 1);
              assert_eq!(
                  facts.handler_contexts[0].dsl_contract_version,
                  "dancer2-dsl.1-0.v3"
              );
          }
          """
          insert_at = analyzer.index(test_marker)
          analyzer = analyzer[:insert_at] + version_test + analyzer[insert_at:]
          analyzer_path.write_text(analyzer)
          '''
          script = (
              script[:analyzer_block_start]
              + robust_analyzer_patch
              + script[analyzer_block_end:]
          )

          exec(compile(script, "dancer2-13178-finalize", "exec"))
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Prove semantic fact and route-family contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p perl-semantic-facts
          cargo test --locked -p perl-semantic-analyzer --test dancer2_route_facts

      - name: Prove Dancer2 provider behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p perl-lsp-rs-core providers::dancer2
          cargo test --locked -p perl-test-must

      - name: Check changelog and strict lint posture
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask changelog check
          cargo clippy --locked -p perl-semantic-facts --all-targets -- -D warnings
          cargo clippy --locked -p perl-semantic-analyzer --test dancer2_route_facts -- -D warnings
          cargo clippy --locked -p perl-lsp-rs-core --lib --tests -- -D warnings
          python3 <<'PY'
          from pathlib import Path

          text = Path(
              "crates/perl-lsp-rs-core/src/providers/dancer2/diagnostics.rs"
          ).read_text()
          selected = [
              '.expect("fixture must parse")',
              '.expect("declaration keyword offset")',
              '.expect("params offset")',
          ]
          remaining = [needle for needle in selected if needle in text]
          if remaining:
              raise SystemExit(f"selected diagnostics extraction debt remains: {remaining}")
          PY

      - name: Commit verified repair and remove temporary executors
        shell: bash
        run: |
          set -euo pipefail
          rm \
            .github/workflows/temp-dancer2-13178-finalize.yml \
            .github/workflows/temp-dancer2-13178-finalize-v2.yml \
            .github/workflows/temp-dancer2-13178-finalize-v3.yml
          python3 <<'PY'
          import subprocess

          expected = {
              ".changes/unreleased/product-13178-Fixed-091500.yaml",
              ".github/workflows/temp-dancer2-13178-finalize-v2.yml",
              ".github/workflows/temp-dancer2-13178-finalize-v3.yml",
              ".github/workflows/temp-dancer2-13178-finalize.yml",
              "crates/perl-lsp-rs-core/src/providers/dancer2/diagnostics.rs",
              "crates/perl-semantic-analyzer/tests/dancer2_route_facts.rs",
              "crates/perl-semantic-facts/src/framework_adapters/dancer2.rs",
              "crates/perl-semantic-facts/src/framework_adapters/dancer2_routes.rs",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if changed != expected:
              raise SystemExit(
                  "unexpected changed-file set:\n"
                  f"expected={sorted(expected)}\nobserved={sorted(changed)}"
              )
          PY
          git diff --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            .changes/unreleased/product-13178-Fixed-091500.yaml \
            .github/workflows/temp-dancer2-13178-finalize-v2.yml \
            .github/workflows/temp-dancer2-13178-finalize-v3.yml \
            .github/workflows/temp-dancer2-13178-finalize.yml \
            crates/perl-lsp-rs-core/src/providers/dancer2/diagnostics.rs \
            crates/perl-semantic-analyzer/tests/dancer2_route_facts.rs \
            crates/perl-semantic-facts/src/framework_adapters/dancer2.rs \
            crates/perl-semantic-facts/src/framework_adapters/dancer2_routes.rs
          git commit -m "fix(dancer2): close versioned contract gaps (#13089)"
          git push origin HEAD:fix/13089-dancer2-dsl-keywords
