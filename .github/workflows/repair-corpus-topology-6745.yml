name: Repair corpus topology authority

on:
  push:
    branches:
      - agent/corpus-topology-6699-current
    paths:
      - .github/workflows/repair-corpus-topology-6745.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: agent/corpus-topology-6699-current
          fetch-depth: 0

      - name: Verify repair base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a4de2d7f35746d2e63d38fe9ac793650b1d054ac"

      - name: Apply bounded review repairs
        shell: bash
        env:
          PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Format and verify focused authority
        shell: bash
        run: |
          set -euo pipefail
          rustup show
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p perl-corpus --lib topology --locked
          cargo clippy -p perl-corpus --lib --locked -- -D warnings -A missing_docs
          git diff --check

      - name: Publish repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-corpus-topology-6745.yml
          git add crates/perl-corpus/src/api/topology.rs .github/workflows/repair-corpus-topology-6745.yml
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/repair-corpus-topology-6745.yml\ncrates/perl-corpus/src/api/topology.rs'
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "fix(corpus): close topology root and layer authority"
          git push origin HEAD:agent/corpus-topology-6699-current
