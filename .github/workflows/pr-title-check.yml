name: PR Title Check

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  # #18255: the merge queue requires `validate-title` on the merge-group ref.
  # The queue path resolves the PR named by the merge-group head ref, re-reads
  # its current title, and applies the same policy as the PR path. It never
  # checks out candidate contents and never mutates PR state.
  merge_group: {}
  workflow_dispatch: {}

permissions:
  pull-requests: write
  checks: write

jobs:
  validate-title:
    # One job, one static producer of the required `validate-title` context.
    # The job is unconditional so the context is always reachable; the event
    # split lives inside the script. This metadata-only check must remain
    # available even when the optional self-hosted nano pool is offline. It
    # never checks out or executes candidate contents, so a hosted runner
    # preserves the trust boundary while making the required context live.
    name: validate-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate PR title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            'use strict';

            // Shared title policy. Defined once here so the PR path and the
            // queue path cannot drift. Pure: reads a PR-shaped object and
            // returns a verdict; never mutates GitHub state.
            const RELEASE_STAMP = /^v?\d+\.\d+\.\d+$/;
            const ISSUE_REFERENCE = /\B#(\d+)\b/g;

            const labelsOf = (pr) => {
              const labels = pr.labels || [];
              return labels.map((label) => (typeof label === 'string' ? label : label.name));
            };
            const loginOf = (pr) =>
              (pr.user && pr.user.login) || (pr.author && pr.author.login) || '';

            const validateTitle = (pr) => {
              const title = pr.title || '';
              const login = loginOf(pr);
              const labels = labelsOf(pr);

              if (login === 'dependabot[bot]') {
                return { ok: true, kind: 'exempt', reason: 'dependabot' };
              }
              if (labels.includes('skip-title-check')) {
                return { ok: true, kind: 'exempt', reason: 'skip-title-check' };
              }
              if (RELEASE_STAMP.test(title.trim())) {
                return { ok: true, kind: 'exempt', reason: 'release stamp' };
              }

              const matches = [...title.matchAll(ISSUE_REFERENCE)];
              if (matches.length === 0) {
                return { ok: false, kind: 'missing-issue', reason: 'no issue reference' };
              }

              const nonZero = matches.find((match) => parseInt(match[1], 10) !== 0);
              if (!nonZero) {
                const placeholder = matches.find((match) => parseInt(match[1], 10) === 0);
                return {
                  ok: true,
                  kind: 'placeholder',
                  reason: 'placeholder issue reference',
                  placeholder: placeholder[0],
                };
              }

              const issueNumber = parseInt(nonZero[1], 10);
              return { ok: true, kind: 'issue', reason: `issue #${issueNumber}`, issueNumber };
            };

            // ---------------------------------------------------------------
            // Queue path (#18255). A native squash group commit has no PR
            // association, so the authoritative queue ref names the PR instead.
            // Re-read that PR's CURRENT title and metadata. Malformed, absent,
            // or contradictory identity fails closed. The event does not carry
            // the admitted PR head or a complete member list, so this validates
            // current named-PR metadata rather than claiming an exact-head or
            // complete-group proof. This branch never mutates PR state.
            // ---------------------------------------------------------------
            if (context.eventName === 'merge_group') {
              const mergeGroup = context.payload.merge_group || {};
              const headSha = mergeGroup.head_sha;
              const baseSha = mergeGroup.base_sha;
              const headRef = mergeGroup.head_ref;
              const baseRef = mergeGroup.base_ref;
              const shaPattern = /^[0-9a-f]{40}$/;

              if (
                typeof headSha !== 'string' || !shaPattern.test(headSha) ||
                typeof baseSha !== 'string' || !shaPattern.test(baseSha) ||
                typeof headRef !== 'string' || typeof baseRef !== 'string'
              ) {
                core.setFailed(
                  'merge_group payload is missing or has malformed head_ref, base_ref, head_sha, or base_sha'
                );
                return;
              }

              const groupBaseRef = baseRef.replace(/^refs\/heads\//, '');
              const queueRef = headRef.replace(/^refs\/heads\//, '');
              if (!groupBaseRef) {
                core.setFailed('merge_group payload is missing base_ref');
                return;
              }

              // Match the entire native ref. The suffix is the group BASE, not
              // the PR head or synthetic group head. Escaping the base branch
              // keeps its characters literal and prevents partial or multiple
              // PR components from being accepted as a singleton identity.
              const escapedBase = groupBaseRef.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = queueRef.match(
                new RegExp(`^gh-readonly-queue/${escapedBase}/pr-([1-9]\\d*)-${baseSha}$`)
              );
              const member = match ? Number(match[1]) : NaN;
              if (!Number.isSafeInteger(member) || member <= 0) {
                core.setFailed(
                  `merge_group head_ref ${headRef} does not name exactly one PR on ` +
                  `base ${groupBaseRef} with base SHA ${baseSha}`
                );
                return;
              }

              let current;
              try {
                const { data } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: member,
                });
                current = data;
              } catch (e) {
                core.setFailed(
                  `merge group title validation failed: #${member}: ` +
                  `could not re-read current title (${e.message})`
                );
                return;
              }

              // The group base may be an earlier synthetic commit. A PR's
              // recorded base SHA is not required to equal that queue base.
              if (
                current.number !== member ||
                current.state !== 'open' ||
                current.base?.ref?.replace(/^refs\/heads\//, '') !== groupBaseRef ||
                typeof current.head?.sha !== 'string' ||
                !shaPattern.test(current.head.sha)
              ) {
                core.setFailed(
                  `merge group title validation failed: #${member} changed state, base, ` +
                  'or identity while queued; refusing to validate a different admission'
                );
                return;
              }

              const verdict = validateTitle(current);
              if (!verdict.ok) {
                core.setFailed(`merge group title validation failed: #${member}: ${verdict.reason}`);
                return;
              }
              core.info(
                `merge group title validation passed for PR #${member} named by ${headRef}`
              );
              return;
            }

            // ---------------------------------------------------------------
            // PR and manual-dispatch path.
            // ---------------------------------------------------------------
            const actor = context.actor;
            let pr = context.payload.pull_request;
            if (!pr) {
              // workflow_dispatch mode (post-merge-status raises this check on
              // its generated branch, since GITHUB_TOKEN PRs fire no
              // pull_request_target events): resolve the open PR from the
              // dispatched ref instead of the absent payload.
              const branch = context.ref.replace('refs/heads/', '');
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: 'open',
              });
              if (pulls.length === 0) {
                core.info(`No open PR found for ${branch}; nothing to validate.`);
                return;
              }
              pr = pulls[0];
            }
            const title = pr.title;

            if (actor === 'dependabot[bot]') {
              core.info('Exempt: dependabot PR');
              return;
            }

            const verdict = validateTitle(pr);
            if (verdict.kind === 'exempt') {
              core.info(`Exempt: ${verdict.reason}`);
              return;
            }

            const BOT_MARKER = '<!-- pr-title-check-bot -->';
            const issueGuidance = [
              'For Codex or other agent-authored PRs: prefer filing the plan as a GitHub issue first, then reference it in the title (e.g. `(#1234)`).',
              '',
              'The issue should preserve the plan context: problem, scope, constraints, files or surfaces, validation, and explicit non-goals.',
              '',
              'If you genuinely cannot determine the issue number, use the placeholder `(#0000)` — do NOT guess a real issue number, because a wrong-but-real reference silently pollutes an unrelated issue. `(#0000)` passes this check (non-blocking) but flags the PR with `needs-issue-link`; a real issue must be linked before merge.',
              '',
              '`skip-title-check` is reserved for maintainer-owned exceptions.',
            ].join('\n');
            const upsertTitleCheckComment = async (commentBody) => {
              // Deduplicate: find and update existing bot comment instead of posting a new one.
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });

              const existing = comments.find(c =>
                c.user.type === 'Bot' && c.body && c.body.includes(BOT_MARKER)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: commentBody,
                });
                core.info('Updated existing bot comment.');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: commentBody,
                });
                core.info('Posted new bot comment.');
              }
            };

            if (verdict.kind === 'missing-issue') {
              core.setFailed(
                `PR title must reference an issue (e.g. "feat: add thing (#42)"). ` +
                `Codex/agent PRs should file the plan as an issue first. Got: "${title}"`
              );

              const commentBody = [
                '## \u26a0\ufe0f PR Title Check Failed',
                '',
                BOT_MARKER,
                '',
                'This PR\'s title does not include an **issue reference** (`#<number>` outside of version strings).',
                '',
                '**Expected format:** `type: description (#1234)`',
                '',
                issueGuidance,
                '',
                `Current title: \`${title}\``,
              ].join('\n');

              await upsertTitleCheckComment(commentBody);
              return;
            }

            // Zero-valued references (#0 / #0000) are the sanctioned placeholder
            // for "issue number not yet known" (issue #724). They are NON-BLOCKING:
            // the check passes, but the PR is flagged with `needs-issue-link` and a
            // real issue must be linked before merge (ops is the backstop). This
            // removes any incentive to guess a real issue number \u2014 a wrong-but-real
            // reference silently pollutes an unrelated issue's thread.
            if (verdict.kind === 'placeholder') {
              core.info(
                `Placeholder issue reference "${verdict.placeholder}" accepted (non-blocking). ` +
                `Flagging needs-issue-link.`
              );
              const commentBody = [
                '## \u2139\ufe0f PR Title \u2014 placeholder issue reference',
                '',
                BOT_MARKER,
                '',
                `This PR title uses the placeholder issue reference \`${verdict.placeholder}\`. The title check **passes** (non-blocking), but a **real issue must be linked before merge** \u2014 this PR is labeled \`needs-issue-link\`.`,
                '',
                'If you know the issue, update the title to reference it, e.g. `(#1234)`. Never guess a real issue number.',
                '',
                issueGuidance,
                '',
                `Current title: \`${title}\``,
              ].join('\n');

              await upsertTitleCheckComment(commentBody);
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: ['needs-issue-link'],
                });
              } catch (e) {
                core.warning(`Could not add needs-issue-link label: ${e.message}`);
              }
              core.info('PR title passes validation (placeholder reference).');
              return;
            }

            // Validate the first real (non-placeholder) issue reference.
            const issueNumber = verdict.issueNumber;
            try {
              await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              core.info(`Referenced issue #${issueNumber} exists.`);
            } catch (e) {
              core.warning(
                `Referenced issue #${issueNumber} was not found. Please verify the issue number.`
              );
              // Don't fail the check for this — it may be a private/internal reference
            }

            // Self-clearing needs-issue-link: this check re-runs on `edited` and
            // `synchronize`, so once a PR's title carries a real (non-placeholder)
            // issue reference, drop the label instead of leaving it for a manual
            // clear at merge time. Per #3356: the title was fixed (a real issue
            // ref added, this check went green) but `needs-issue-link` survived
            // and blocked an ops merge under the "no needs-* label may merge"
            // doctrine — the label-writer never reconciled its own label.
            const labels = labelsOf(pr);
            if (labels.includes('needs-issue-link')) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: 'needs-issue-link',
                });
                core.info(`Removed needs-issue-link: title now references real issue #${issueNumber}.`);
              } catch (e) {
                core.warning(`Could not remove needs-issue-link label: ${e.message}`);
              }
            }

            core.info('PR title passes validation.');
