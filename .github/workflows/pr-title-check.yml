name: PR Title Check

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  # #18255: the merge queue requires `validate-title` on the merge-group ref.
  # The queue path resolves the group's constituent PRs from an authoritative
  # source and validates every member's title; it never checks out or executes
  # candidate contents and holds no PR comment/label write privilege.
  merge_group: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate-title:
    # PR and manual-dispatch path. This metadata-only pull_request_target check
    # must remain available even when the optional self-hosted nano pool is
    # offline. It never checks out or executes candidate contents, so a hosted
    # runner preserves the trust boundary while making the required context live.
    name: validate-title
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
      checks: write
    steps:
      - name: Check PR title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const actor = context.actor;
            let pr = context.payload.pull_request;
            if (!pr) {
              // workflow_dispatch mode (post-merge-status raises this check on
              // its generated branch, since GITHUB_TOKEN PRs fire no
              // pull_request_target events): resolve the open PR from the
              // dispatched ref instead of the absent payload.
              const branch = context.ref.replace('refs/heads/', '');
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: 'open',
              });
              if (pulls.length === 0) {
                core.info(`No open PR found for ${branch}; nothing to validate.`);
                return;
              }
              pr = pulls[0];
            }
            const title = pr.title;
            const login = pr.user.login;

            if (actor === 'dependabot[bot]' || login.includes('dependabot')) {
              core.info('Exempt: dependabot PR');
              return;
            }

            const labels = pr.labels.map(l => l.name);
            if (labels.includes('skip-title-check')) {
              core.info('Exempt: skip-title-check label present');
              return;
            }

            if (/^v?\d+\.\d+\.\d+$/.test(title.trim())) {
              core.info('Exempt: release stamp title');
              return;
            }

            const BOT_MARKER = '<!-- pr-title-check-bot -->';
            const issueGuidance = [
              'For Codex or other agent-authored PRs: prefer filing the plan as a GitHub issue first, then reference it in the title (e.g. `(#1234)`).',
              '',
              'The issue should preserve the plan context: problem, scope, constraints, files or surfaces, validation, and explicit non-goals.',
              '',
              'If you genuinely cannot determine the issue number, use the placeholder `(#0000)` — do NOT guess a real issue number, because a wrong-but-real reference silently pollutes an unrelated issue. `(#0000)` passes this check (non-blocking) but flags the PR with `needs-issue-link`; a real issue must be linked before merge.',
              '',
              '`skip-title-check` is reserved for maintainer-owned exceptions.',
            ].join('\n');
            const upsertTitleCheckComment = async (commentBody) => {
              // Deduplicate: find and update existing bot comment instead of posting a new one.
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });

              const existing = comments.find(c =>
                c.user.type === 'Bot' && c.body && c.body.includes(BOT_MARKER)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: commentBody,
                });
                core.info('Updated existing bot comment.');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: commentBody,
                });
                core.info('Posted new bot comment.');
              }
            };
            const issueMatches = [...title.matchAll(/\B#(\d+)\b/g)];

            if (issueMatches.length === 0) {
              core.setFailed(
                `PR title must reference an issue (e.g. "feat: add thing (#42)"). ` +
                `Codex/agent PRs should file the plan as an issue first. Got: "${title}"`
              );

              const commentBody = [
                '## \u26a0\ufe0f PR Title Check Failed',
                '',
                BOT_MARKER,
                '',
                'This PR\'s title does not include an **issue reference** (`#<number>` outside of version strings).',
                '',
                '**Expected format:** `type: description (#1234)`',
                '',
                issueGuidance,
                '',
                `Current title: \`${title}\``,
              ].join('\n');

              await upsertTitleCheckComment(commentBody);
              return;
            }

            // Zero-valued references (#0 / #0000) are the sanctioned placeholder
            // for "issue number not yet known" (issue #724). They are NON-BLOCKING:
            // the check passes, but the PR is flagged with `needs-issue-link` and a
            // real issue must be linked before merge (ops is the backstop). This
            // removes any incentive to guess a real issue number \u2014 a wrong-but-real
            // reference silently pollutes an unrelated issue's thread.
            const nonZeroMatch = issueMatches.find((match) => parseInt(match[1], 10) !== 0);
            const zeroIssueMatch = issueMatches.find((match) => parseInt(match[1], 10) === 0);

            if (!nonZeroMatch && zeroIssueMatch) {
              core.info(
                `Placeholder issue reference "${zeroIssueMatch[0]}" accepted (non-blocking). ` +
                `Flagging needs-issue-link.`
              );
              const commentBody = [
                '## \u2139\ufe0f PR Title \u2014 placeholder issue reference',
                '',
                BOT_MARKER,
                '',
                `This PR title uses the placeholder issue reference \`${zeroIssueMatch[0]}\`. The title check **passes** (non-blocking), but a **real issue must be linked before merge** \u2014 this PR is labeled \`needs-issue-link\`.`,
                '',
                'If you know the issue, update the title to reference it, e.g. `(#1234)`. Never guess a real issue number.',
                '',
                issueGuidance,
                '',
                `Current title: \`${title}\``,
              ].join('\n');

              await upsertTitleCheckComment(commentBody);
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: ['needs-issue-link'],
                });
              } catch (e) {
                core.warning(`Could not add needs-issue-link label: ${e.message}`);
              }
              core.info('PR title passes validation (placeholder reference).');
              return;
            }

            // Validate the first real (non-placeholder) issue reference.
            const issueNumber = parseInt(nonZeroMatch[1], 10);
            try {
              await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              core.info(`Referenced issue #${issueNumber} exists.`);
            } catch (e) {
              core.warning(
                `Referenced issue #${issueNumber} was not found. Please verify the issue number.`
              );
              // Don't fail the check for this — it may be a private/internal reference
            }

            // Self-clearing needs-issue-link: this check re-runs on `edited` and
            // `synchronize`, so once a PR's title carries a real (non-placeholder)
            // issue reference, drop the label instead of leaving it for a manual
            // clear at merge time. Per #3356: the title was fixed (a real issue
            // ref added, this check went green) but `needs-issue-link` survived
            // and blocked an ops merge under the "no needs-* label may merge"
            // doctrine — the label-writer never reconciled its own label.
            if (labels.includes('needs-issue-link')) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: 'needs-issue-link',
                });
                core.info(`Removed needs-issue-link: title now references real issue #${issueNumber}.`);
              } catch (e) {
                core.warning(`Could not remove needs-issue-link label: ${e.message}`);
              }
            }

            core.info('PR title passes validation.');

  validate-title-merge-group:
    # #18255 queue path. Same required context name, but a separate job so the
    # queue side never inherits PR comment/label write privileges and never
    # checks out candidate contents. Membership is resolved from the live merge
    # queue (authoritative) or the commit-associated PRs by head SHA; absent or
    # contradictory membership fails closed instead of passing.
    name: validate-title
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - name: Validate every constituent PR title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const headSha = context.payload.merge_group?.head_sha;
            const baseSha = context.payload.merge_group?.base_sha;
            const baseRef = context.payload.merge_group?.base_ref || '';

            if (!headSha || !baseSha) {
              core.setFailed('merge_group payload is missing head_sha or base_sha');
              return;
            }

            // Contradictory G/base: the base must be an ancestor of the group
            // head. A diverged or behind base is not a valid merge group.
            try {
              const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${baseSha}...${headSha}`,
              });
              if (cmp.status !== 'ahead' && cmp.status !== 'identical') {
                core.setFailed(
                  `merge_group base ${baseSha} is not an ancestor of head ${headSha} ` +
                  `(compare status: ${cmp.status})`
                );
                return;
              }
            } catch (e) {
              core.setFailed(`could not verify merge_group base/head ancestry: ${e.message}`);
              return;
            }

            // Reuse the existing title policy. Exemptions and placeholder
            // semantics are unchanged; the queue path only reports the verdict
            // and never mutates PR comments or labels.
            const validateTitle = (pr) => {
              const title = pr.title || '';
              const login = pr.author?.login || pr.user?.login || '';
              const labels = (pr.labels?.nodes || pr.labels || []).map((l) => l.name);
              if (login.includes('dependabot')) {
                return { ok: true, reason: 'dependabot' };
              }
              if (labels.includes('skip-title-check')) {
                return { ok: true, reason: 'skip-title-check' };
              }
              if (/^v?\d+\.\d+\.\d+$/.test(title.trim())) {
                return { ok: true, reason: 'release stamp' };
              }
              const issueMatches = [...title.matchAll(/\B#(\d+)\b/g)];
              if (issueMatches.length === 0) {
                return { ok: false, reason: 'no issue reference' };
              }
              const nonZero = issueMatches.find((m) => parseInt(m[1], 10) !== 0);
              if (!nonZero) {
                return { ok: true, reason: 'placeholder issue reference' };
              }
              return { ok: true, reason: `issue #${parseInt(nonZero[1], 10)}` };
            };

            const branch = baseRef.replace(/^refs\/heads\//, '');
            let members = [];
            let source = '';

            // Primary: the live merge queue is the authoritative membership
            // source. Entries are ordered by position; the group is the run of
            // entries ending at the group head and starting at the group base.
            if (branch) {
              try {
                const query = `query($owner:String!,$repo:String!,$branch:String!){repository(owner:$owner,name:$repo){mergeQueue(branch:$branch){entries(first:100){nodes{position state baseCommit{oid} headCommit{oid} pullRequest{number title state headRefOid author{login} labels(first:20){nodes{name}}}}}}}}`;
                const result = await github.graphql(query, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch,
                });
                const entries = result?.repository?.mergeQueue?.entries?.nodes || [];
                if (entries.length > 0) {
                  const headIndex = entries.findIndex((e) => e.headCommit?.oid === headSha);
                  if (headIndex === -1) {
                    core.setFailed(
                      `merge_group head ${headSha} is not present in the live merge queue for ${branch}`
                    );
                    return;
                  }
                  const group = [];
                  let reachedBase = false;
                  for (let i = headIndex; i >= 0; i--) {
                    const entry = entries[i];
                    if (!entry.pullRequest) {
                      core.setFailed(
                        `merge queue entry at position ${entry.position} has no pull request`
                      );
                      return;
                    }
                    group.unshift(entry.pullRequest);
                    if (entry.baseCommit?.oid === baseSha) {
                      reachedBase = true;
                      break;
                    }
                  }
                  if (!reachedBase) {
                    core.setFailed(
                      `merge queue walk from ${headSha} did not reach base ${baseSha}`
                    );
                    return;
                  }
                  members = group;
                  source = 'mergeQueue';
                }
              } catch (e) {
                core.info(
                  `mergeQueue query unavailable (${e.message}); falling back to commit-associated PRs`
                );
              }
            }

            // Fallback: the API by head SHA. This is authoritative for a
            // single-member group and fails closed when it resolves nothing.
            if (members.length === 0) {
              try {
                const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: headSha,
                });
                members = data.filter((pr) => pr.state === 'open' || pr.merged_at);
                source = 'commit-pulls';
              } catch (e) {
                core.setFailed(
                  `could not resolve merge group members by head SHA: ${e.message}`
                );
                return;
              }
            }

            if (members.length === 0) {
              core.setFailed(
                `no constituent pull requests resolved for merge group head ${headSha}`
              );
              return;
            }

            const failures = [];
            for (const pr of members) {
              const verdict = validateTitle(pr);
              if (!verdict.ok) {
                failures.push(`#${pr.number}: ${verdict.reason}`);
              }
            }
            if (failures.length > 0) {
              core.setFailed(`merge group title validation failed: ${failures.join('; ')}`);
              return;
            }
            core.info(
              `merge group title validation passed for ${members.length} PR(s) via ${source}: ` +
              members.map((p) => `#${p.number}`).join(', ')
            );
