name: PR Title Check

on:
  merge_group:
    types: [checks_requested]

# The native group job has no publication, issue, label or PR write authority.
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  issues: read

jobs:
  validate-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Load immutable protected title evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          path: trusted-title-source
          persist-credentials: false
          fetch-depth: 1
      - name: Prove current complete native G title subject
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 trusted-title-source/scripts/ci/native_queue_title.py observe
          --receipt "$RUNNER_TEMP/native-queue-title.json"
      - name: Validate every proved constituent title without writes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const source = path.join(process.env.GITHUB_WORKSPACE, 'trusted-title-source');
            const {validateMembers} = require(path.join(source, 'scripts/ci/pr_title_validator.js'));
            const receiptPath = path.join(process.env.RUNNER_TEMP, 'native-queue-title.json');
            const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
            const results = await validateMembers({github, core, context}, receipt);
            fs.writeFileSync(receiptPath + '.titles.json', JSON.stringify(results));
      - name: Recheck exact G membership, intake and current title metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 trusted-title-source/scripts/ci/native_queue_title.py recheck
          --receipt "$RUNNER_TEMP/native-queue-title.json"
