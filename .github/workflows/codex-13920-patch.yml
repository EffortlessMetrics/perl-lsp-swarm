name: Apply linked-list Rust Small proof for issue 13920

on:
  push:
    branches:
      - codex/13920-linked-list-rust-small-proof

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout stacked parser candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply bounded proof-contract patch
        run: python3 .github/codex-13920-patch.py
      - name: Format and test proof definition
        run: |
          cargo fmt --all
          cargo test -p xtask rust_small_proof --locked
      - name: Replay historical negative control
        shell: bash
        run: |
          set -euo pipefail
          negative=/tmp/linked-list-negative-13920
          rm -rf "$negative"
          git worktree add --detach "$negative" a83ad9a02740f5f12033464696b4ebbec1671951
          set +e
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/negative-control" \
            cargo test --manifest-path "$negative/Cargo.toml" \
              -p perl-semantic-analyzer \
              --test linked_list_receiver_facts \
              --locked > /tmp/linked-list-negative.log 2>&1
          status=$?
          set -e
          cat /tmp/linked-list-negative.log
          git worktree remove --force "$negative"
          if [ "$status" -eq 0 ]; then
            echo '::error::historical subject unexpectedly passed the linked-list target'
            exit 1
          fi
          grep -F 'blessed_recursive_link_initializer_keeps_node_receiver_fact' \
            /tmp/linked-list-negative.log >/dev/null
          echo 'historical_subject=a83ad9a02740f5f12033464696b4ebbec1671951'
          echo 'historical_result=expected_failure_observed'
      - name: Execute canonical Rust Small proof
        run: cargo xtask rust-small-proof
      - name: Commit verified product diff
        run: |
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add -A
          git commit -m 'ci(semantic): execute linked-list receiver proof (#13920)'
          git push origin HEAD:codex/13920-linked-list-rust-small-proof
