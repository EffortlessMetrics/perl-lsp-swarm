name: Focused proof for PR 13194

on:
  push:
    branches:
      - chatgpt/path-tiny-api-completion
    paths:
      - .github/workflows/pr-13194-focused-proof.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  focused-proof:
    if: github.repository == 'EffortlessMetrics/perl-lsp-swarm'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/path-tiny-api-completion
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust 1.95 with rustfmt
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Run declared focused proof
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir='target/receipts/pr-13194'
          mkdir -p "$receipt_dir"

          cargo fmt -p perl-lsp-rs-core -- --check \
            2>&1 | tee "$receipt_dir/rustfmt.log"
          cargo test -p perl-lsp-rs-core --test path_tiny_method_completion_tests --locked \
            2>&1 | tee "$receipt_dir/path-tiny.log"
          cargo test -p perl-lsp-rs-core --test http_client_method_completion_tests --locked \
            2>&1 | tee "$receipt_dir/http-client.log"
          cargo test -p perl-lsp-rs-core --test mojo_adapter_method_completion_tests --locked \
            2>&1 | tee "$receipt_dir/mojo-adapter.log"
          git diff --check \
            2>&1 | tee "$receipt_dir/diff-check.log"

          cat > "$receipt_dir/receipt.json" <<JSON
          {
            "schema_version": 1,
            "pr": 13194,
            "head_sha": "${GITHUB_SHA}",
            "rust_toolchain": "1.95.0",
            "status": "passed",
            "commands": [
              "cargo fmt -p perl-lsp-rs-core -- --check",
              "cargo test -p perl-lsp-rs-core --test path_tiny_method_completion_tests --locked",
              "cargo test -p perl-lsp-rs-core --test http_client_method_completion_tests --locked",
              "cargo test -p perl-lsp-rs-core --test mojo_adapter_method_completion_tests --locked",
              "git diff --check"
            ]
          }
          JSON

          {
            echo '## PR #13194 focused proof'
            echo
            echo '- Rust 1.95 rustfmt: passed'
            echo '- Path::Tiny completion tests: passed'
            echo '- HTTP client completion regression tests: passed'
            echo '- Mojo adapter completion regression tests: passed'
            echo '- Git diff hygiene: passed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload focused proof receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-13194-focused-proof-${{ github.sha }}
          path: target/receipts/pr-13194
          if-no-files-found: error
          retention-days: 14
