name: Apply bounded legacy dispositions for #9104

on:
  push:
    branches:
      - agent/distribution-legacy-dispositions-9104

permissions:
  contents: write

concurrency:
  group: agent-disposition-9104-v2
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact stacked branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/distribution-legacy-dispositions-9104
          fetch-depth: 1
          persist-credentials: true

      - name: Apply registry dispositions and isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('policy/install-surface-registry.toml')
          text = path.read_text()
          blocks = text.split('[[surfaces]]')

          def rewrite(surface_id, updates):
              for index in range(1, len(blocks)):
                  if f'surface_id = "{surface_id}"' not in blocks[index]:
                      continue
                  lines = blocks[index].splitlines()
                  seen = set()
                  for line_index, line in enumerate(lines):
                      if '=' not in line:
                          continue
                      key = line.split('=', 1)[0].strip()
                      if key in updates:
                          lines[line_index] = f'{key} = {updates[key]}'
                          seen.add(key)
                  missing = set(updates) - seen
                  if missing:
                      raise SystemExit(f'{surface_id}: missing {sorted(missing)}')
                  blocks[index] = '\n'.join(lines)
                  return
              raise SystemExit(f'missing surface {surface_id}')

          rewrite('package.legacy.build-packages', {
              'producer': '"retired_tombstone"',
              'consumer': '"historical_reference"',
              'topology_relationship': '"not_applicable"',
              'publication_stage': '"historical"',
              'active_user_reachability': '"retired"',
              'disposition': '"retired"',
              'exit_condition': '"Retired: a new topology-backed package-format owner and evidence are required before reintroduction."',
          })
          rewrite('package.homebrew.local-formula', {
              'producer': '"xtask_projection"',
              'topology_relationship': '"derived"',
              'disposition': '"canonical_generated"',
              'owner': '"#9106"',
              'exit_condition': '"Bind generated placeholders and freshness to exact topology in #9106; public currentness remains #7831."',
          })
          rewrite('channel.homebrew.public-tap', {
              'disposition': '"active_owned_channel_source"',
              'owner': '"#7831"',
              'exit_condition': '"Source ownership is active; public version/currentness still requires #7831/#4351 evidence."',
          })
          rewrite('spec.packaging-install', {
              'producer': '"historical_repository_record"',
              'consumer': '"historical_regression"',
              'disposition': '"historical_fixture"',
              'owner': '"#9104"',
              'exit_condition': '"Historical only; current setup claims are owned by #8087/#6355 and generated support registries."',
          })

          text = '[[surfaces]]'.join(blocks).rstrip()
          if 'surface_id = "fixture.windows-asset-404-incident"' not in text:
              text += '''

          [[surfaces]]
          surface_id = "fixture.windows-asset-404-incident"
          external_identity = "xtask:install_surface_check:legacy_windows_asset_404"
          surface_kind = "historical_fixture"
          producer = "xtask_fixture"
          consumer = "historical_regression"
          target_channel = "none"
          installed_product_unit = "not_applicable"
          authority_refs = ["#6196", "#9104"]
          topology_relationship = "not_applicable"
          publication_stage = "historical"
          active_user_reachability = "historical"
          disposition = "historical_fixture"
          owner = "#9104"
          exit_condition = "Retain the concrete 404 incident without treating it as current PowerShell route truth."
          '''
          path.write_text(text.rstrip() + '\n')
          PY

          cat > distribution/build-packages.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cat >&2 <<'MESSAGE'
          distribution/build-packages.sh is retired historical scaffolding.
          It encoded an independent 1.0.0/amd64/server-only DEB, RPM, tarball,
          man-page, and systemd product model outside current release topology.
          Reintroduction requires a new topology-backed owner and public-channel evidence.
          MESSAGE
          exit 64
          EOF
          chmod -x distribution/build-packages.sh

          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/specs/PACKAGING_INSTALL_SPEC.md')
          source = path.read_text()
          marker = '''<!-- install-surface-role: historical_fixture; owner: #9104 -->
          > [!WARNING]
          > Historical design record. Its runnable commands, alpha wording, settings,
          > target names, and client examples are not current installation guidance.
          > Current routes and claims come from the authorities referenced by
          > `policy/install-surface-registry.toml`.

          '''
          if not source.startswith('<!-- install-surface-role: historical_fixture;'):
              path.write_text(marker + source)
          PY

          rm .github/workflows/agent-disposition-9104.yml
          rm .github/workflows/agent-disposition-9104-v2.yml
          git diff --check

      - name: Commit exact disposition result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add --all
          git commit -m 'chore(distribution): disposition legacy install surfaces (#9104)'
          git push origin HEAD:agent/distribution-legacy-dispositions-9104
