name: Release Orchestration

# Default-branch release workflow that orchestrates all release tasks
# Triggered manually after version bump PR is merged

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.x.y)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false
      skip_crates:
        description: 'Skip crates.io publishing'
        required: false
        type: boolean
        default: false
      skip_extension:
        description: 'Skip VSCode extension publishing'
        required: false
        type: boolean
        default: false
      skip_docker:
        description: 'Skip Docker image publishing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-orchestration-${{ github.event.inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: read
      checks: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      subject_sha: ${{ steps.resolve.outputs.subject_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable (master)
        with:
          toolchain: stable

      - name: Resolve and validate version
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          TAG="v${VERSION}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid version format: ${VERSION}"
            exit 1
          fi

          WORKSPACE_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$WORKSPACE_VERSION" != "$VERSION" ]; then
            echo "::error::Workspace version ${WORKSPACE_VERSION} does not match release version ${VERSION}"
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            echo "::error::Tag ${TAG} already exists"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "subject_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "✅ Version validated: ${VERSION}"

      - name: Check default branch and CI status
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Checkout does not match the immutable release subject"
            exit 1
          fi
          python3 -B scripts/ci/check_release_required_ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$DEFAULT_BRANCH" \
            --sha "$GITHUB_SHA" \
            --timeout-seconds "${VALIDATE_RELEASE_CI_TIMEOUT_SECONDS:-300}" \
            --poll-interval-seconds "${VALIDATE_RELEASE_CI_POLL_INTERVAL_SECONDS:-30}"

      - name: Check for unreleased changes
        run: |
          if grep -q "## \[Unreleased\]" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md has unreleased section"
          fi

          echo "✅ Changelog checked"

      - name: Verify curated release notes exist
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          NOTE_FILE="docs/releases/${TAG}.md"
          if [ ! -f "$NOTE_FILE" ]; then
            echo "::error file=$NOTE_FILE::Release notes file missing: $NOTE_FILE"
            echo "::error::Every release must ship a curated note at docs/releases/${TAG}.md before tagging."
            echo "::error::See RELEASE.md \"Release History Updates\" for the template."
            exit 1
          fi
          if ! head -1 "$NOTE_FILE" | grep -q '^---$'; then
            echo "::error file=$NOTE_FILE::Release notes must open with a YAML frontmatter block (---)."
            exit 1
          fi
          echo "✅ Found curated release notes: $NOTE_FILE"

      - name: Verify RELEASE_HISTORY ledger row exists
        run: |
          # Trip-wire: a missing ledger row breaks the release-history drift
          # gate for *every* PR opened against the default branch, not just release PRs.
          # The bundling guarantee (version bump and ledger row land together)
          # is enforced both upstream by `cargo xtask bump-version` (which
          # appends the row) and here at finalization (so a manually-edited
          # release-prep PR can't bypass the upstream generator).
          # See docs/forensics/2026-05-03-release-history-ledger-drift.md.
          VERSION="${{ steps.resolve.outputs.version }}"
          if [ ! -f RELEASE_HISTORY.md ]; then
            echo "::warning::RELEASE_HISTORY.md not found in repo; skipping ledger check"
            exit 0
          fi
          if ! grep -qE "^\| \[${VERSION}\]" RELEASE_HISTORY.md; then
            echo "::error file=RELEASE_HISTORY.md::Missing RELEASE_HISTORY.md row for ${VERSION}"
            echo "::error::Release-prep was incomplete. Either run 'cargo xtask bump-version ${VERSION}' (which appends the row automatically) or add the row by hand before re-dispatching."
            echo "::error::See docs/forensics/2026-05-03-release-history-ledger-drift.md for context."
            exit 1
          fi
          echo "✅ RELEASE_HISTORY.md contains row for ${VERSION}"

      - name: Summary
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
          INPUT_SKIP_CRATES: ${{ github.event.inputs.skip_crates }}
          INPUT_SKIP_EXTENSION: ${{ github.event.inputs.skip_extension }}
          INPUT_SKIP_DOCKER: ${{ github.event.inputs.skip_docker }}
        run: |
          echo "## Release Validation Complete :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: $INPUT_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Prerelease**: $INPUT_PRERELEASE" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Skip crates.io**: $INPUT_SKIP_CRATES" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Skip VSCode**: $INPUT_SKIP_EXTENSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Skip Docker**: $INPUT_SKIP_DOCKER" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All checks passed! Proceeding with release." >> "$GITHUB_STEP_SUMMARY"

  trigger-release:
    name: Trigger Fail-Closed Release Transaction
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Dispatch release transaction
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
          INPUT_SKIP_CRATES: ${{ github.event.inputs.skip_crates }}
          INPUT_SKIP_EXTENSION: ${{ github.event.inputs.skip_extension }}
          INPUT_SKIP_DOCKER: ${{ github.event.inputs.skip_docker }}
          EXPECTED_SHA: ${{ needs.validate.outputs.subject_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          REF="$DEFAULT_BRANCH"
          PRERELEASE="$INPUT_PRERELEASE"

          echo "Dispatching release workflow for ${TAG}"
          gh api \
            -X POST \
            /repos/${{ github.repository }}/actions/workflows/release.yml/dispatches \
            -f ref="${REF}" \
            -F inputs[tag]="${TAG}" \
            -F inputs[expected_sha]="$EXPECTED_SHA" \
            -F inputs[prerelease]="${PRERELEASE}" \
            -F inputs[skip_crates]="$INPUT_SKIP_CRATES" \
            -F inputs[skip_extension]="$INPUT_SKIP_EXTENSION" \
            -F inputs[skip_docker]="$INPUT_SKIP_DOCKER"

          echo "Candidate construction now precedes every tag and publisher mutation."

      - name: Summary
        env:
          REPOSITORY: ${{ github.repository }}
          SKIP_CRATES: ${{ github.event.inputs.skip_crates }}
          SKIP_EXTENSION: ${{ github.event.inputs.skip_extension }}
          SKIP_DOCKER: ${{ github.event.inputs.skip_docker }}
        run: |
          echo "## Release Triggered :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Only the release transaction has been dispatched." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Build & Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Release](https://github.com/$REPOSITORY/actions/workflows/release.yml) - build, validate, attest, then publish" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Downstream eligibility after candidate success" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SKIP_CRATES" != "true" ]; then
            echo "- [Publish to crates.io](https://github.com/$REPOSITORY/actions/workflows/publish-crates.yml)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ~~Publish to crates.io~~ (skipped)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$SKIP_EXTENSION" != "true" ]; then
            echo "- [Publish VSCode Extension](https://github.com/$REPOSITORY/actions/workflows/publish-extension.yml) - Marketplace and Open VSX jobs report separately" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ~~Publish VSCode Extension~~ (skipped)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$SKIP_DOCKER" != "true" ]; then
            echo "- [Publish Docker Images](https://github.com/$REPOSITORY/actions/workflows/docker-publish.yml)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ~~Publish Docker Images~~ (skipped)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No downstream publisher is dispatched until release.yml's terminal candidate succeeds." >> "$GITHUB_STEP_SUMMARY"
