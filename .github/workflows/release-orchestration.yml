name: Release Orchestration

# One ordered release transaction. The exact release build/publication run must
# complete successfully and produce a verified public artifact manifest before
# any external publisher job becomes reachable (#6231/#14406).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.x.y)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false
      skip_crates:
        description: 'Skip crates.io publishing'
        required: false
        type: boolean
        default: false
      skip_extension:
        description: 'Skip VSCode extension publishing'
        required: false
        type: boolean
        default: false
      skip_docker:
        description: 'Skip Docker image publishing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-orchestration-${{ github.event.inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}

    steps:
      - name: Checkout exact orchestration subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: stable

      - name: Resolve and validate version
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$INPUT_VERSION"
          TAG="v${VERSION}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            printf '::error::Invalid version format: %s\n' "$VERSION"
            exit 1
          fi
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf '::error::Release source is not a full commit SHA: %s\n' "$SOURCE_SHA"
            exit 1
          fi

          WORKSPACE_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$WORKSPACE_VERSION" != "$VERSION" ]; then
            printf '::error::Workspace version %s does not match release version %s\n' "$WORKSPACE_VERSION" "$VERSION"
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            printf '::error::Tag %s already exists\n' "$TAG"
            exit 1
          fi

          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'Validated release subject %s at %s\n' "$TAG" "$SOURCE_SHA"

      - name: Check default branch and CI status
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          DEFAULT_SHA=$(git rev-parse "origin/$DEFAULT_BRANCH")
          if [ "$SOURCE_SHA" != "$DEFAULT_SHA" ]; then
            printf '::error::Release must run from %s tip. Subject is %s; branch tip is %s\n' "$DEFAULT_BRANCH" "$SOURCE_SHA" "$DEFAULT_SHA"
            exit 1
          fi

          POLL_TIMEOUT_SECONDS="${VALIDATE_RELEASE_CI_TIMEOUT_SECONDS:-300}"
          POLL_INTERVAL_SECONDS="${VALIDATE_RELEASE_CI_POLL_INTERVAL_SECONDS:-30}"
          DEADLINE=$(($(date +%s) + POLL_TIMEOUT_SECONDS))
          CI_STATE=""

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            CI_STATE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/status" --jq '.state' 2>/dev/null || true)
            case "$CI_STATE" in
              success) break ;;
              failure|error)
                printf '::error::Commit %s CI reported %s\n' "$SOURCE_SHA" "$CI_STATE"
                exit 1
                ;;
              pending|"") sleep "$POLL_INTERVAL_SECONDS" ;;
              *) sleep "$POLL_INTERVAL_SECONDS" ;;
            esac
          done

          if [ "$CI_STATE" != "success" ]; then
            printf '::error::Commit %s did not reach success within %ss (last state: %s)\n' "$SOURCE_SHA" "$POLL_TIMEOUT_SECONDS" "${CI_STATE:-unknown}"
            exit 1
          fi

      - name: Verify curated release inputs
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          NOTE_FILE="docs/releases/${TAG}.md"
          if [ ! -f "$NOTE_FILE" ]; then
            printf '::error file=%s::Release notes file missing\n' "$NOTE_FILE"
            exit 1
          fi
          if ! head -1 "$NOTE_FILE" | grep -q '^---$'; then
            printf '::error file=%s::Release notes must open with YAML frontmatter\n' "$NOTE_FILE"
            exit 1
          fi
          if [ -f RELEASE_HISTORY.md ] && ! grep -qE "^\| \[${VERSION}\]" RELEASE_HISTORY.md; then
            printf '::error file=RELEASE_HISTORY.md::Missing release-history row for %s\n' "$VERSION"
            exit 1
          fi

      - name: Validate prerequisite graph source
        run: |
          python3 scripts/ci/test_release_workflow_gate.py
          python3 scripts/ci/check_release_prerequisite_graph.py

  create-tag:
    name: Create Release Tag
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.tag.outputs.source_sha }}
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout exact release subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Create and push immutable annotated tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "::error::Checkout moved from the validated release source"
            exit 1
          fi

          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CHANGELOG_SECTION=$(mktemp)
          TAG_MESSAGE=$(mktemp)
          trap 'rm -f "$CHANGELOG_SECTION" "$TAG_MESSAGE"' EXIT
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > "$CHANGELOG_SECTION"
          {
            printf 'Release %s\n\n' "$TAG"
            if [ -s "$CHANGELOG_SECTION" ]; then
              cat "$CHANGELOG_SECTION"
            else
              echo "Automated release from workspace changelog."
            fi
          } > "$TAG_MESSAGE"

          git tag -a "$TAG" "$SOURCE_SHA" -F "$TAG_MESSAGE"
          git push origin "refs/tags/${TAG}"

          RESOLVED=$(git rev-list -n 1 "$TAG")
          if [ "$RESOLVED" != "$SOURCE_SHA" ]; then
            printf '::error::Tag %s resolved to %s, expected %s\n' "$TAG" "$RESOLVED" "$SOURCE_SHA"
            exit 1
          fi
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build, validate, and publish GitHub release
    needs: [validate, create-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: write
      contents: read
    outputs:
      run_id: ${{ steps.release.outputs.run_id }}
      run_attempt: ${{ steps.release.outputs.run_attempt }}
      run_url: ${{ steps.release.outputs.html_url }}
      source_sha: ${{ steps.release.outputs.head_sha }}
      manifest_digest: ${{ steps.manifest.outputs.manifest_digest }}
      manifest_artifact: exact-release-manifest-${{ needs.validate.outputs.version }}

    steps:
      - name: Checkout orchestration helper at exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Dispatch and await exact release workflow
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          python3 scripts/ci/release_workflow_gate.py \
            --repo "$REPOSITORY" \
            --workflow release.yml \
            --ref "$TAG" \
            --expected-sha "$SOURCE_SHA" \
            --field "tag=$TAG" \
            --field "prerelease=$PRERELEASE" \
            --timeout-seconds 13_800

      - name: Re-read public release and build exact asset manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ steps.release.outputs.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p exact-release-assets
          gh release view "$TAG" --repo "$REPOSITORY" --json tagName,isPrerelease >/tmp/release.json
          test "$(jq -r '.tagName' /tmp/release.json)" = "$TAG"
          gh release download "$TAG" --repo "$REPOSITORY" --dir exact-release-assets
          find exact-release-assets -type f -print -quit | grep -q .

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("exact-release-assets")
          assets = []
          for path in sorted(item for item in root.rglob("*") if item.is_file()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assets.append({
                  "name": path.relative_to(root).as_posix(),
                  "size": path.stat().st_size,
                  "sha256": digest,
              })
          if not assets:
              raise SystemExit("public release has no downloaded assets")
          manifest = {
              "schema": "release_prerequisite_manifest.v1",
              "repository": os.environ["REPOSITORY"],
              "tag": os.environ["TAG"],
              "version": os.environ["VERSION"],
              "source_sha": os.environ["SOURCE_SHA"],
              "release_run_id": int(os.environ["RELEASE_RUN_ID"]),
              "release_run_attempt": int(os.environ["RELEASE_RUN_ATTEMPT"]),
              "assets": assets,
          }
          Path("release-prerequisite-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          MANIFEST_DIGEST=$(sha256sum release-prerequisite-manifest.json | awk '{print $1}')
          printf 'manifest_digest=%s\n' "$MANIFEST_DIGEST" >> "$GITHUB_OUTPUT"
          cat release-prerequisite-manifest.json

      - name: Retain exact release prerequisite manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-release-manifest-${{ needs.validate.outputs.version }}
          path: release-prerequisite-manifest.json
          if-no-files-found: error
          retention-days: 90

  publication-eligibility:
    name: Verify common publisher eligibility
    needs: [validate, create-tag, build-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: none
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      manifest_digest: ${{ steps.verify.outputs.manifest_digest }}

    steps:
      - name: Download exact release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-release.outputs.manifest_artifact }}

      - name: Fail closed on incomplete or mismatched predecessor
        id: verify
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.source_sha }}
          EXPECTED_TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_DIGEST: ${{ needs.build-release.outputs.manifest_digest }}
          RELEASE_HEAD_SHA: ${{ needs.build-release.outputs.source_sha }}
          RELEASE_RUN_ID: ${{ needs.build-release.outputs.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ needs.build-release.outputs.run_attempt }}
        run: |
          set -euo pipefail
          ACTUAL_DIGEST=$(sha256sum release-prerequisite-manifest.json | awk '{print $1}')
          test "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST"
          test "$RELEASE_HEAD_SHA" = "$EXPECTED_SHA"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("release-prerequisite-manifest.json").read_text(encoding="utf-8"))
          expected = {
              "schema": "release_prerequisite_manifest.v1",
              "source_sha": os.environ["EXPECTED_SHA"],
              "tag": os.environ["EXPECTED_TAG"],
              "version": os.environ["EXPECTED_VERSION"],
              "release_run_id": int(os.environ["RELEASE_RUN_ID"]),
              "release_run_attempt": int(os.environ["RELEASE_RUN_ATTEMPT"]),
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"predecessor mismatch for {key}: {manifest.get(key)!r} != {value!r}")
          assets = manifest.get("assets")
          if not isinstance(assets, list) or not assets:
              raise SystemExit("release prerequisite manifest has no asset denominator")
          names = {asset.get("name") for asset in assets if isinstance(asset, dict)}
          required_exact = {"SHA256SUMS", "sbom-spdx.json"}
          missing = sorted(required_exact - names)
          if missing:
              raise SystemExit(f"release prerequisite manifest misses required assets: {missing}")
          if not any(str(name).endswith((".tar.gz", ".zip")) for name in names if name):
              raise SystemExit("release prerequisite manifest contains no release archive")
          for asset in assets:
              if not isinstance(asset, dict):
                  raise SystemExit("malformed asset row")
              digest = asset.get("sha256")
              size = asset.get("size")
              if not isinstance(digest, str) or len(digest) != 64:
                  raise SystemExit(f"invalid asset digest: {asset}")
              if not isinstance(size, int) or size <= 0:
                  raise SystemExit(f"empty or invalid release asset: {asset}")
          PY

          printf 'source_sha=%s\n' "$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$EXPECTED_TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
          printf 'manifest_digest=%s\n' "$EXPECTED_DIGEST" >> "$GITHUB_OUTPUT"

  publish-crates:
    name: Publish crates after eligibility
    needs: [validate, publication-eligibility]
    if: ${{ github.event.inputs.skip_crates != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 390
    permissions:
      actions: write
      contents: read
    outputs:
      run_id: ${{ steps.publisher.outputs.run_id }}
      run_url: ${{ steps.publisher.outputs.html_url }}

    steps:
      - name: Checkout exact publisher helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.publication-eligibility.outputs.source_sha }}

      - name: Dispatch and await exact crates publisher
        id: publisher
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.publication-eligibility.outputs.tag }}
          VERSION: ${{ needs.publication-eligibility.outputs.version }}
          SOURCE_SHA: ${{ needs.publication-eligibility.outputs.source_sha }}
        run: |
          python3 scripts/ci/release_workflow_gate.py \
            --repo "$REPOSITORY" \
            --workflow publish-crates.yml \
            --ref "$TAG" \
            --expected-sha "$SOURCE_SHA" \
            --field "version=$VERSION" \
            --field "dry_run=false" \
            --timeout-seconds 22_800

  publish-extension:
    name: Publish extension after eligibility
    needs: [validate, publication-eligibility]
    if: ${{ github.event.inputs.skip_extension != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      actions: write
      contents: read
    outputs:
      run_id: ${{ steps.publisher.outputs.run_id }}
      run_url: ${{ steps.publisher.outputs.html_url }}

    steps:
      - name: Checkout exact publisher helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.publication-eligibility.outputs.source_sha }}

      - name: Dispatch and await exact extension publisher
        id: publisher
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.publication-eligibility.outputs.tag }}
          VERSION: ${{ needs.publication-eligibility.outputs.version }}
          SOURCE_SHA: ${{ needs.publication-eligibility.outputs.source_sha }}
        run: |
          python3 scripts/ci/release_workflow_gate.py \
            --repo "$REPOSITORY" \
            --workflow publish-extension.yml \
            --ref "$TAG" \
            --expected-sha "$SOURCE_SHA" \
            --field "version=$VERSION" \
            --timeout-seconds 5_400

  publish-docker:
    name: Publish containers after eligibility
    needs: [validate, publication-eligibility]
    if: ${{ github.event.inputs.skip_docker != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: write
      contents: read
    outputs:
      run_id: ${{ steps.publisher.outputs.run_id }}
      run_url: ${{ steps.publisher.outputs.html_url }}

    steps:
      - name: Checkout exact publisher helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.publication-eligibility.outputs.source_sha }}

      - name: Dispatch and await exact container publisher
        id: publisher
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.publication-eligibility.outputs.tag }}
          VERSION: ${{ needs.publication-eligibility.outputs.version }}
          SOURCE_SHA: ${{ needs.publication-eligibility.outputs.source_sha }}
        run: |
          python3 scripts/ci/release_workflow_gate.py \
            --repo "$REPOSITORY" \
            --workflow docker-publish.yml \
            --ref "$TAG" \
            --expected-sha "$SOURCE_SHA" \
            --field "version=$VERSION" \
            --field "push=true" \
            --timeout-seconds 13_800

  summary:
    name: Release transaction summary
    needs:
      - validate
      - create-tag
      - build-release
      - publication-eligibility
      - publish-crates
      - publish-extension
      - publish-docker
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: none

    steps:
      - name: Record ordered transaction
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          RELEASE_RESULT: ${{ needs.build-release.result }}
          ELIGIBILITY_RESULT: ${{ needs.publication-eligibility.result }}
          RELEASE_RUN_URL: ${{ needs.build-release.outputs.run_url }}
          MANIFEST_DIGEST: ${{ needs.build-release.outputs.manifest_digest }}
          CRATES_RESULT: ${{ needs.publish-crates.result }}
          CRATES_RUN_URL: ${{ needs.publish-crates.outputs.run_url }}
          EXTENSION_RESULT: ${{ needs.publish-extension.result }}
          EXTENSION_RUN_URL: ${{ needs.publish-extension.outputs.run_url }}
          DOCKER_RESULT: ${{ needs.publish-docker.result }}
          DOCKER_RUN_URL: ${{ needs.publish-docker.outputs.run_url }}
        run: |
          {
            echo "## Ordered release transaction"
            echo
            printf -- '- Version: `%s`\n' "$VERSION"
            printf -- '- Tag: `%s`\n' "$TAG"
            printf -- '- Source SHA: `%s`\n' "$SOURCE_SHA"
            printf -- '- Release predecessor: %s (%s)\n' "$RELEASE_RESULT" "$RELEASE_RUN_URL"
            printf -- '- Common eligibility: %s\n' "$ELIGIBILITY_RESULT"
            printf -- '- Prerequisite manifest: `sha256:%s`\n' "$MANIFEST_DIGEST"
            printf -- '- crates.io publisher: %s %s\n' "$CRATES_RESULT" "$CRATES_RUN_URL"
            printf -- '- Extension publisher: %s %s\n' "$EXTENSION_RESULT" "$EXTENSION_RUN_URL"
            printf -- '- Container publisher: %s %s\n' "$DOCKER_RESULT" "$DOCKER_RUN_URL"
            echo
            echo "Publisher jobs are structurally downstream of the exact successful release and common artifact-eligibility fan-in."
          } >> "$GITHUB_STEP_SUMMARY"
