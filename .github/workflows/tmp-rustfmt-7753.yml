name: Temporary rustfmt finalization for PR 7753

on:
  push:
    branches:
      - agent/strict-position-authority-1814

permissions:
  contents: write

jobs:
  format-and-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0

      - name: Apply canonical formatting and remove temporary workflow
        shell: bash
        run: |
          cargo fmt --all
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add crates/perl-position-tracking/src/lib.rs crates/perl-position-tracking/src/strict.rs
          git rm .github/workflows/tmp-rustfmt-7753.yml
          git commit -m "style(position): apply canonical rustfmt (#1814)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
