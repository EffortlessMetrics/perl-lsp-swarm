name: Temporary rustfmt extraction for PR 7753

on:
  push:
    branches:
      - agent/strict-position-authority-1814

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install repository Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.95.0
          components: rustfmt
          cache: 'false'

      - name: Format candidate
        shell: bash
        run: |
          cargo fmt --all
          git diff -- crates/perl-position-tracking/src > /tmp/rustfmt-7753.diff

      - name: Upload exact formatter output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: rustfmt-output-7753-${{ github.sha }}
          path: |
            crates/perl-position-tracking/src/lib.rs
            crates/perl-position-tracking/src/strict.rs
            /tmp/rustfmt-7753.diff
          if-no-files-found: error
          retention-days: 1
