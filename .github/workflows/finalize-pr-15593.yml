name: Finalize PR 15593

on:
  push:
    branches:
      - fix/12952-facade-recursion-mapping

permissions:
  contents: write

concurrency:
  group: finalize-pr-15593
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Correct proof and changelog identity
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | python3

      - name: Validate final candidate
        shell: bash
        run: |
          cargo fmt -p tree-sitter-perl-rs
          cargo fmt -p tree-sitter-perl-rs -- --check
          git diff --check
          cargo test -p tree-sitter-perl-rs --all-targets --locked
          cargo clippy -p tree-sitter-perl-rs --all-targets --locked -- -D warnings
          git fetch origin main --depth=1
          cargo xtask changelog check

      - name: Rewrite review repair with repository identity
        shell: bash
        env:
          EXPECTED_REMOTE_HEAD: ${{ github.sha }}
          GIT_AUTHOR_NAME: EffortlessSteven
          GIT_AUTHOR_EMAIL: 15812269+EffortlessSteven@users.noreply.github.com
          GIT_COMMITTER_NAME: EffortlessSteven
          GIT_COMMITTER_EMAIL: 15812269+EffortlessSteven@users.noreply.github.com
        run: |
          git rm .github/workflows/finalize-pr-15593.yml
          git config user.name 'EffortlessSteven'
          git config user.email '15812269+EffortlessSteven@users.noreply.github.com'
          git reset --soft 74814849befe1c2cdc2bc3d9b8d597a04230fdc2
          git add -A
          git commit \
            -m 'fix(tree-sitter-perl-rs): preserve terminal failure contracts' \
            -m 'Derive terminal failure classification from the authoritative stop cause, keep FutureTypedTerminal explicitly unclassified without publishing a partial tree, and pin recovery as non-terminal.' \
            -m 'Correct the changelog fragment to identify PR 15593.' \
            -m 'Verified with cargo fmt, git diff --check, the full tree-sitter-perl-rs all-target test and Clippy targets, and the changelog checker.'
          git push \
            --force-with-lease=refs/heads/fix/12952-facade-recursion-mapping:${EXPECTED_REMOTE_HEAD} \
            origin HEAD:refs/heads/fix/12952-facade-recursion-mapping
