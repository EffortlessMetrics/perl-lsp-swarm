name: Documentation Build (PR)

# Exercise the documentation production build on pull requests without Pages,
# OIDC, environment, artifact-upload, or deployment authority.
on:
  pull_request:
    paths:
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'book/**'
      - 'scripts/populate-book.sh'
      - 'scripts/tests/test-populate-book-roadmap-links.sh'
      # The Helix drift check must run when the checker itself changes, not
      # only when the documents it governs change -- otherwise the check is not
      # load-bearing on its own subject file (same rule as #5425).
      - 'scripts/ci/validate_helix_fixture_drift.py'
      - 'scripts/ci/test_validate_helix_fixture_drift.py'
      # Same rule for the committed-copy freshness check (#16544).
      - 'scripts/ci/validate_book_copy_freshness.sh'
      - 'scripts/ci/rewrite_book_source_links.py'
      - 'scripts/tests/test-validate-book-copy-freshness.sh'
      - '.github/workflows/docs-deploy.yml'
      - '.github/workflows/docs-pr-build.yml'

permissions:
  contents: read

concurrency:
  group: docs-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Runs against the committed tree, before populate-book.sh writes its
      # generated copies, so the result reflects repository content only.
      # Setup guides embed docs/examples/helix/languages.toml inline; a copy
      # that drops the Perl 5 `file-types` narrowing silently reattaches the
      # Perl 5 server to Raku/NQP/P6 files (#7724). Stdlib-only (ubuntu-24.04
      # ships Python >=3.11 with tomllib), so no Python setup step is needed.
      - name: Validate Helix registration fixture drift
        run: |
          python3 scripts/ci/test_validate_helix_fixture_drift.py
          python3 scripts/ci/validate_helix_fixture_drift.py

      # Also runs against the committed tree, before populate-book.sh writes
      # its generated copies: committed generated copies silently drift when
      # canonical docs move without a refresh (#16544, same class as #14220).
      # The self-test proves both directions: clean tree passes, an
      # artificially drifted copy fails.
      - name: Validate committed book copy freshness
        run: |
          bash scripts/tests/test-validate-book-copy-freshness.sh
          bash scripts/ci/validate_book_copy_freshness.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # stable (master)
        with:
          toolchain: stable

      # Restore-only: this is a pull_request workflow, and candidate runs may
      # restore but not publish shared cache state (docs/ci/cache-policy.md,
      # #15590). The canonical `*-mdbook-*` entry is written by
      # docs-deploy.yml on main; restoring it here also keeps the cached
      # `mdbook` executable trusted instead of candidate-built.
      - name: Restore mdBook cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-mdbook-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mdbook-

      - name: Install mdBook
        run: |
          cargo install mdbook --version 0.4.40 --locked || true
          mdbook --version

      - name: Populate documentation
        run: |
          bash scripts/tests/test-populate-book-roadmap-links.sh
          bash scripts/populate-book.sh

      - name: Build mdBook
        run: |
          mdbook build book
