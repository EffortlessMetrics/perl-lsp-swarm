name: One-shot import-gate repair for PR 13194

on:
  push:
    branches:
      - chatgpt/path-tiny-api-completion
    paths:
      - .github/workflows/pr-13194-import-gate-fix.yml
  pull_request:
    paths:
      - .github/workflows/pr-13194-import-gate-fix.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  repair-and-prove:
    if: github.repository == 'EffortlessMetrics/perl-lsp-swarm'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/path-tiny-api-completion
          fetch-depth: 0

      - name: Install Rust 1.95 with rustfmt
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Repair the conflicting import gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/perl-lsp-rs-core/src/providers/completion/completion/methods.rs')
          text = path.read_text()
          replacements = [
              (
                  '''fn infer_imported_api_receiver_type(
              context: &CompletionContext,
              source: &str,
              used_modules: &HashSet<String>,
          ) -> Option<&'static str> {''',
                  '''fn infer_imported_api_receiver_type(
              context: &CompletionContext,
              source: &str,
          ) -> Option<&'static str> {''',
              ),
              (
                  '''    if used_modules.contains("Path::Tiny")
                  && module_was_used_before(source, context.position, "Path::Tiny")
                  && ((module_imported_symbol_before(source, context.position, "Path::Tiny", "path")''',
                  '''    if module_was_used_before(source, context.position, "Path::Tiny")
                  && ((module_imported_symbol_before(source, context.position, "Path::Tiny", "path")''',
              ),
              (
                  '''    ["HTTP::Tiny", "LWP::UserAgent"].into_iter().find(|&module| {
                  used_modules.contains(module)
                      && module_was_used_before(source, context.position, module)
                      && expression_calls_constructor(expression, module)
              })''',
                  '''    ["HTTP::Tiny", "LWP::UserAgent"].into_iter().find(|&module| {
                  module_was_used_before(source, context.position, module)
                      && expression_calls_constructor(expression, module)
              })''',
              ),
              (
                  '''fn imported_static_methods(
              prefix: &str,
              source: &str,
              position: usize,
              used_modules: &HashSet<String>,
          ) -> Option<&'static [(&'static str, &'static str)]> {''',
                  '''fn imported_static_methods(
              prefix: &str,
              source: &str,
              position: usize,
          ) -> Option<&'static [(&'static str, &'static str)]> {''',
              ),
              (
                  '''    if !used_modules.contains(module) || !module_was_used_before(source, position, module) {''',
                  '''    if !module_was_used_before(source, position, module) {''',
              ),
              (
                  'infer_imported_api_receiver_type(context, source, used_modules)',
                  'infer_imported_api_receiver_type(context, source)',
              ),
              (
                  'imported_static_methods(context.receiver_prefix(), source, context.position, used_modules)',
                  'imported_static_methods(context.receiver_prefix(), source, context.position)',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          cargo fmt -p perl-lsp-rs-core

          changed="$(git diff --name-only)"
          expected='crates/perl-lsp-rs-core/src/providers/completion/completion/methods.rs'
          if [[ "$changed" != "$expected" ]]; then
            printf 'repair changed an unexpected file set:\n%s\n' "$changed" >&2
            exit 1
          fi

      - name: Run focused regression proof
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir='target/receipts/pr-13194-import-gate'
          mkdir -p "$receipt_dir"

          cargo fmt -p perl-lsp-rs-core -- --check \
            2>&1 | tee "$receipt_dir/rustfmt.log"
          cargo test -p perl-lsp-rs-core --test path_tiny_method_completion_tests --locked \
            2>&1 | tee "$receipt_dir/path-tiny.log"
          cargo test -p perl-lsp-rs-core --test http_client_method_completion_tests --locked \
            2>&1 | tee "$receipt_dir/http-client.log"
          cargo test -p perl-lsp-rs-core --test mojo_adapter_method_completion_tests --locked \
            2>&1 | tee "$receipt_dir/mojo-adapter.log"
          git diff --check \
            2>&1 | tee "$receipt_dir/diff-check.log"

          cat > "$receipt_dir/receipt.json" <<JSON
          {
            "schema_version": 1,
            "pr": 13194,
            "input_head_sha": "${GITHUB_SHA}",
            "rust_toolchain": "1.95.0",
            "status": "passed",
            "finding": "source-aware before-cursor use proof is authoritative over incomplete AST used_modules membership",
            "commands": [
              "cargo fmt -p perl-lsp-rs-core -- --check",
              "cargo test -p perl-lsp-rs-core --test path_tiny_method_completion_tests --locked",
              "cargo test -p perl-lsp-rs-core --test http_client_method_completion_tests --locked",
              "cargo test -p perl-lsp-rs-core --test mojo_adapter_method_completion_tests --locked",
              "git diff --check"
            ]
          }
          JSON

      - name: Commit the proved repair and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/pr-13194-import-gate-fix.yml \
            .github/workflows/pr-13194-focused-proof.yml

          changed="$(git diff --name-only HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/pr-13194-focused-proof.yml \
            .github/workflows/pr-13194-import-gate-fix.yml \
            crates/perl-lsp-rs-core/src/providers/completion/completion/methods.rs | sort)"
          if [[ "$changed" != "$expected" ]]; then
            printf 'commit would contain an unexpected file set:\n%s\n' "$changed" >&2
            exit 1
          fi

          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add crates/perl-lsp-rs-core/src/providers/completion/completion/methods.rs
          git commit -m 'fix(lsp): accept versioned common API imports'
          git push origin HEAD:chatgpt/path-tiny-api-completion

      - name: Upload focused proof receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-13194-import-gate-proof-${{ github.sha }}
          path: target/receipts/pr-13194-import-gate
          if-no-files-found: warn
          retention-days: 14
