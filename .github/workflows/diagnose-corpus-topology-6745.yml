name: Diagnose corpus topology repair

on:
  push:
    branches:
      - agent/corpus-topology-6699-current
    paths:
      - .github/workflows/diagnose-corpus-topology-6745.yml

permissions:
  contents: write

jobs:
  diagnose-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@v5
        with:
          ref: agent/corpus-topology-6699-current
          fetch-depth: 0

      - name: Verify bounded base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a4de2d7f35746d2e63d38fe9ac793650b1d054ac HEAD
          test "$(git diff --name-only a4de2d7f35746d2e63d38fe9ac793650b1d054ac HEAD | sort)" = $'.github/workflows/diagnose-corpus-topology-6745.yml\n.github/workflows/repair-corpus-topology-6745.yml'

      - name: Reapply bounded mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/repair-corpus-topology-6745.yml').read_text()
          match = re.search(r'^\s*PATCH_GZ_B64:\s*(\S+)\s*$', workflow, re.MULTILINE)
          if match is None:
              raise SystemExit('embedded topology patch not found')
          script = gzip.decompress(base64.b64decode(match.group(1)))
          Path('/tmp/patch.py').write_bytes(script)
          PY
          python3 /tmp/patch.py

      - name: Format and verify with diagnostic annotations
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail

          run_checked() {
            local label="$1"
            shift
            local log="/tmp/${label//[^a-zA-Z0-9]/_}.log"
            if "$@" >"$log" 2>&1; then
              cat "$log"
              return 0
            fi
            cat "$log"
            python3 - "$label" "$log" <<'PY'
          import sys
          from pathlib import Path

          title = sys.argv[1]
          lines = Path(sys.argv[2]).read_text(errors='replace').splitlines()
          message = '\n'.join(lines[-80:]) or 'command failed without output'
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          title = title.replace('%', '%25').replace('\r', ' ').replace('\n', ' ')
          print(f'::error title={title}::{message}')
          PY
            return 1
          }

          rustup show
          run_checked "cargo fmt" cargo fmt --all
          run_checked "cargo fmt check" cargo fmt --all -- --check
          run_checked "topology tests" cargo test -p perl-corpus --lib topology --locked
          run_checked "topology clippy" cargo clippy -p perl-corpus --lib --locked -- -D warnings -A missing_docs
          run_checked "diff check" git diff --check

      - name: Publish verified repair and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-corpus-topology-6745.yml
          rm .github/workflows/diagnose-corpus-topology-6745.yml
          git add crates/perl-corpus/src/api/topology.rs \
            .github/workflows/repair-corpus-topology-6745.yml \
            .github/workflows/diagnose-corpus-topology-6745.yml
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/diagnose-corpus-topology-6745.yml\n.github/workflows/repair-corpus-topology-6745.yml\ncrates/perl-corpus/src/api/topology.rs'
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "fix(corpus): close topology root and layer authority"
          git push origin HEAD:agent/corpus-topology-6699-current
