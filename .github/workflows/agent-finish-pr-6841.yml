name: One-shot finish PR 6841

on:
  push:
    branches:
      - test/lsp-client-support-registry-6739

permissions:
  contents: write

jobs:
  finish-registry:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: test/lsp-client-support-registry-6739

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Pin registry vocabularies and remove tautological path check
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/perl-lsp-rs/tests/lsp_client_support_registry.rs")
          text = path.read_text()

          marker = 'const PACKAGED_PRODUCT_RECEIPT_ROOT: &str = "docs/receipts/lsp-clients/packaged";\n'
          constants = '''const ALLOWED_TIERS: [&str; 6] = [
              "packaged_product_proven",
              "real_generic_client_proven",
              "protocol_profile_proven",
              "configuration_documented",
              "bridge_or_plugin_dependency",
              "not_proven_unsupported",
          ];
          const ALLOWED_EVIDENCE_KINDS: [&str; 4] = [
              "documentation",
              "protocol_profile",
              "actual_client",
              "packaged_product",
          ];
          '''
          if constants.strip() not in text:
              if marker not in text:
                  raise SystemExit("receipt-root marker not found")
              text = text.replace(marker, marker + constants, 1)

          anchor = '''    let registry = load_registry(&root)?;
              let tracked_files = load_tracked_files(&root)?;
              let allowed_tiers = registry
          '''
          replacement = '''    let registry = load_registry(&root)?;
              let tracked_files = load_tracked_files(&root)?;
              let declared_tiers = registry
                  .meta
                  .allowed_tiers
                  .iter()
                  .map(String::as_str)
                  .collect::<BTreeSet<_>>();
              let expected_tiers = ALLOWED_TIERS.into_iter().collect::<BTreeSet<_>>();
              ensure!(
                  declared_tiers == expected_tiers,
                  "registry tier vocabulary drifted: declared={declared_tiers:?} expected={expected_tiers:?}"
              );
              let declared_evidence_kinds = registry
                  .meta
                  .allowed_evidence_kinds
                  .iter()
                  .map(String::as_str)
                  .collect::<BTreeSet<_>>();
              let expected_evidence_kinds =
                  ALLOWED_EVIDENCE_KINDS.into_iter().collect::<BTreeSet<_>>();
              ensure!(
                  declared_evidence_kinds == expected_evidence_kinds,
                  "registry evidence vocabulary drifted: declared={declared_evidence_kinds:?} expected={expected_evidence_kinds:?}"
              );
              let allowed_tiers = registry
          '''
          if replacement.strip() not in text:
              if anchor not in text:
                  raise SystemExit("claim-inflation anchor not found")
              text = text.replace(anchor, replacement, 1)

          tautology = '''                let expected_relative =
                          validate_execution_receipt_path(&evidence.path, &evidence.kind)?;
                      let receipt_path =
                          validate_repository_file(&root, &evidence.path, &tracked_files)?;
                      ensure!(
                          repository_path_string(&expected_relative)
                              == repository_path_string(&validate_relative_path(&evidence.path)?),
                          "executable receipt path normalization drifted"
                      );
          '''
          simplified = '''                let _ = validate_execution_receipt_path(&evidence.path, &evidence.kind)?;
                      let receipt_path =
                          validate_repository_file(&root, &evidence.path, &tracked_files)?;
          '''
          if simplified.strip() not in text:
              if tautology not in text:
                  raise SystemExit("tautological path check not found")
              text = text.replace(tautology, simplified, 1)

          path.write_text(text)

      - name: Update lockfile and compile the authority tests
        shell: bash
        run: cargo check -p perl-lsp-rs --tests

      - name: Format only touched Rust files
        shell: bash
        run: |
          rustup run 1.95.0 rustfmt \
            --edition 2024 \
            --config-path . \
            crates/perl-lsp-rs/tests/lsp_client_support_registry.rs \
            crates/perl-lsp-rs/tests/semantic_definition.rs

      - name: Remove one-shot workflow and push result
        shell: bash
        run: |
          rm .github/workflows/agent-finish-pr-6841.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Cargo.lock \
            crates/perl-lsp-rs/tests/lsp_client_support_registry.rs \
            crates/perl-lsp-rs/tests/semantic_definition.rs \
            .github/workflows/agent-finish-pr-6841.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "test(lsp): finish client support evidence authority"
          git push origin HEAD:test/lsp-client-support-registry-6739
