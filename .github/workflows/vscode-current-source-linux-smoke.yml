name: VS Code Current-Source Linux Smoke

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main, master]
    paths:
      - 'vscode-extension/**'
      - 'crates/perl-lsp*/**'
      - 'crates/perllsp/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vscode-current-source-linux-smoke.yml'

concurrency:
  group: vscode-current-source-linux-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-integrate-release-metadata:
    name: Integrate bounded release metadata patch
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/security-release-metadata-bounds'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Wire bounded transport into downloader
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('vscode-extension/src/downloader.ts')
          text = path.read_text(encoding='utf-8')

          import_anchor = "import AdmZip from 'adm-zip';\n"
          import_line = "import { fetchBoundedJson } from './boundedHttpJson';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('downloader import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          call_anchor = 'const release = await this.getLatestRelease();'
          call_replacement = 'const release = await this.getLatestRelease(30000, token);'
          if call_anchor in text:
              text = text.replace(call_anchor, call_replacement, 1)
          elif call_replacement not in text:
              raise SystemExit('getLatestRelease call anchor not found')

          start_marker = '  private async getLatestRelease('
          end_marker = '\n  private async getInternalRelease('
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('getLatestRelease function boundary not found')

          replacement = r'''  private async getLatestRelease(
            timeoutMs = 30000,
            cancellationToken?: vscode.CancellationToken,
          ): Promise<Release> {
            const config = vscode.workspace.getConfiguration('perl-lsp');
            const channel = config.get<string>('channel', 'latest');
            const versionTag = config.get<string>('versionTag', '');
            const downloadBaseUrl = config.get<string>('downloadBaseUrl', '');

            if (cancellationToken?.isCancellationRequested) {
              throw new Error('Release metadata fetch cancelled');
            }

            if (downloadBaseUrl) {
              return this.getInternalRelease(downloadBaseUrl, versionTag || 'latest');
            }

            let url: string;
            if (channel === 'tag' && versionTag) {
              const encodedTag = encodeURIComponent(versionTag);
              url = `https://api.github.com/repos/${BinaryDownloader.REPO_OWNER}/${BinaryDownloader.REPO_NAME}/releases/tags/${encodedTag}`;
            } else if (channel === 'stable') {
              url = `https://api.github.com/repos/${BinaryDownloader.REPO_OWNER}/${BinaryDownloader.REPO_NAME}/releases`;
            } else {
              url = `https://api.github.com/repos/${BinaryDownloader.REPO_OWNER}/${BinaryDownloader.REPO_NAME}/releases/latest`;
            }

            const isHttps = url.startsWith('https:');
            const httpConfig = vscode.workspace.getConfiguration('http');
            const proxyStrictSSL = httpConfig.get<boolean>('proxyStrictSSL', true);
            const options: https.RequestOptions = {
              headers: githubApiHeaders(url, proxyStrictSSL),
              rejectUnauthorized: proxyStrictSSL,
            };

            const parsed = await fetchBoundedJson<unknown>({
              requestFactory: (listener) => this.httpGet(isHttps, url, options, listener),
              timeoutMs,
              maxBytes: 1024 * 1024,
              cancellationToken,
              operationName: 'Release metadata fetch',
            });

            if (
              parsed &&
              typeof parsed === 'object' &&
              !Array.isArray(parsed) &&
              'message' in parsed
            ) {
              const message = (parsed as { message?: unknown }).message;
              if (typeof message === 'string') {
                if (message.includes('Not Found')) {
                  throw new Error('No releases found');
                }
                throw new Error(`GitHub API error: ${message}`);
              }
            }

            const isRelease = (value: unknown): value is Release => {
              if (!value || typeof value !== 'object' || Array.isArray(value)) {
                return false;
              }
              const candidate = value as Partial<Release>;
              return (
                typeof candidate.tag_name === 'string' &&
                Array.isArray(candidate.assets) &&
                candidate.assets.every(
                  (asset) =>
                    Boolean(asset) &&
                    typeof asset.name === 'string' &&
                    typeof asset.browser_download_url === 'string',
                )
              );
            };

            if (Array.isArray(parsed)) {
              const releases = parsed.filter(isRelease);
              const selected = releases.find((release) => !release.prerelease) ?? releases[0];
              if (!selected) {
                throw new Error('No releases found');
              }
              return selected;
            }

            if (!isRelease(parsed)) {
              throw new Error('Release metadata response has an invalid schema');
            }
            return parsed;
          }
          '''

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup locked extension toolchain
        uses: ./.github/actions/setup-vscode-toolchain
        with:
          working-directory: vscode-extension

      - name: Format and validate extension changes
        working-directory: vscode-extension
        run: |
          set -euo pipefail
          npm exec --offline --no -- oxfmt --write \
            src/downloader.ts \
            src/boundedHttpJson.ts \
            src/test/boundedHttpJson.test.ts
          npm run fmt:check
          npm run typecheck
          npm run lint:ci
          npm test -- --runInBand src/test/boundedHttpJson.test.ts

      - name: Restore workflow and commit product-only tree
        env:
          BRANCH: agent/security-release-metadata-bounds
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:.github/workflows/vscode-current-source-linux-smoke.yml \
            > .github/workflows/vscode-current-source-linux-smoke.yml
          rm -f \
            .github/workflows/agent-wire-release-metadata.yml \
            .agent-trigger-release-metadata

          git add \
            .github/workflows/vscode-current-source-linux-smoke.yml \
            .github/workflows/agent-wire-release-metadata.yml \
            .agent-trigger-release-metadata \
            vscode-extension/src/downloader.ts \
            vscode-extension/src/boundedHttpJson.ts \
            vscode-extension/src/test/boundedHttpJson.test.ts
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "fix(vscode): bound release metadata fetch (#6018)"
          git push origin "HEAD:${BRANCH}"

  current-source-linux-smoke:
    name: Current-source Linux smoke (${{ matrix.vscode_version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        vscode_version: ['1.125.0', 'stable']

    defaults:
      run:
        working-directory: vscode-extension

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      PERL_LSP_VSCODE_VERSION: ${{ matrix.vscode_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Setup VS Code toolchain
        uses: ./.github/actions/setup-vscode-toolchain

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: vscode-current-source-smoke-${{ hashFiles('Cargo.lock') }}

      - name: Prove exact public perllsp process contracts
        working-directory: .
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/perl-lsp-public-process-target
          RUST_TEST_THREADS: '1'
        run: >-
          cargo test -p perllsp --tests
          --locked -- --test-threads=1

      - name: Build current Rust server
        working-directory: .
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/perl-lsp-current-source-target
        run: cargo build -p perllsp --release --locked

      - name: Run exact current-source smoke under Xvfb
        env:
          PERL_LSP_E2E: '1'
          PERL_LSP_FIRST_HOUR_SERVER_PATH: ${{ runner.temp }}/perl-lsp-current-source-target/release/perllsp
          PERL_LSP_SERVER_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PERL_LSP_SMOKE_SOURCE_LABEL: hosted-linux-current-source
        run: xvfb-run -a npm run test:published:local

      - name: Upload current-source smoke receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: vscode-current-source-linux-smoke-${{ matrix.vscode_version }}-${{ github.sha }}
          path: target/receipts/vscode-smoke/**
          if-no-files-found: warn
          retention-days: 14
