name: Agent 7194 Process Tree Proof

on:
  push:
    branches:
      - agent/7194-process-tree-proof

permissions:
  contents: read

concurrency:
  group: agent-7194-process-tree-proof
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  platform:
    name: Process-tree proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: agent-7194-platform-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Check touched-file formatting
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check \
            xtask/src/tasks/update_status/cmd.rs \
            xtask/src/tasks/update_status/cmd/tests.rs \
            xtask/src/tasks/update_status/tests.rs

      - name: Prove timeout tree termination
        run: cargo test -p xtask --locked run_cmd_merged -- --nocapture

      - name: Strict xtask Clippy
        if: runner.os == 'Linux'
        run: cargo clippy -p xtask --all-targets --locked -- -D warnings

  cold-full:
    name: Cold full status regeneration
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Cache Cargo dependencies only
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
          shared-key: agent-7194-cold-${{ hashFiles('Cargo.lock') }}

      - name: Check touched-file formatting
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check \
            xtask/src/tasks/update_status/cmd.rs \
            xtask/src/tasks/update_status/cmd/tests.rs \
            xtask/src/tasks/update_status/tests.rs

      - name: Focused status tests
        run: cargo test -p xtask --locked update_status

      - name: Strict xtask Clippy
        run: cargo clippy -p xtask --all-targets --locked -- -D warnings

      - name: Run cold full regeneration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          cargo run -p xtask --locked -- update-status --write \
            2>&1 | tee target/agent-7194-full.log

      - name: Verify one shared inventory and no timeout
        shell: bash
        run: |
          set -euo pipefail
          STATUS_LOG=target/agent-7194-full.log python3 - <<'PY'
          import os
          from pathlib import Path

          lines = Path(os.environ["STATUS_LOG"]).read_text(encoding="utf-8").splitlines()
          matches = [
              line
              for line in lines
              if "[update-status] running:" in line
              and "cargo" in line
              and "test" in line
              and "--workspace" in line
              and "--lib" in line
              and "--exclude" in line
              and "tree-sitter-perl" in line
              and "--list" in line
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected one shared workspace lib-test discovery, found {len(matches)}: {matches!r}"
              )
          if any("command timed out" in line for line in lines):
              raise SystemExit("cold full regeneration recorded a command timeout")
          if not any("[update-status] completed subsystem: quality" in line for line in lines):
              raise SystemExit("quality subsystem did not complete")
          PY
          git diff --check

      - name: Upload cold proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-7194-cold-full-${{ github.sha }}
          path: target/agent-7194-full.log
          if-no-files-found: error
          retention-days: 7
