name: Chocolatey Manifest Refresh

# Refresh the repo-local Chocolatey package metadata on release. Upstream
# submission remains an explicit maintainer action because this repository's
# GITHUB_TOKEN cannot write to chocolatey-community/chocolatey-coreteampackages.
# Cost: ~$0.02 per refresh

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to refresh (e.g., v0.10.0)'
        required: true
        type: string

concurrency:
  group: chocolatey-bump-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate release tag
        id: tag
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:RELEASE_TAG_INPUT
          } else {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          }

          if ($tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Invalid release tag: $tag"
          }

          $version = $tag.Substring(1)
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Wait for release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $found = $false
          for ($i = 1; $i -le 20; $i++) {
            Write-Host "Checking for release assets (attempt $i/20)..."
            $assetCount = gh release view $env:RELEASE_TAG --json assets -q '.assets | length'
            if ($LASTEXITCODE -eq 0 -and $assetCount -match '^[1-9]') {
              Write-Host 'Assets found.'
              $found = $true
              break
            }
            Start-Sleep -Seconds 30
          }

          if (-not $found) {
            throw "Release assets were not available for $env:RELEASE_TAG after 20 attempts."
          }

      - name: Download Windows binary
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $assetDir = Join-Path $env:RUNNER_TEMP 'choco-assets'
          $assetName = "perllsp-$($env:RELEASE_VERSION)-x86_64-pc-windows-msvc.zip"

          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          Write-Host "Downloading $assetName..."
          gh release download $env:RELEASE_TAG `
            --pattern $assetName `
            --dir $assetDir
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download $assetName from $env:RELEASE_TAG."
          }

      - name: Compute SHA256
        id: checksum
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $assetDir = Join-Path $env:RUNNER_TEMP 'choco-assets'
          $assetPath = Join-Path $assetDir "perllsp-$($env:RELEASE_VERSION)-x86_64-pc-windows-msvc.zip"

          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $assetPath).Hash.ToLowerInvariant()
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "SHA256: $sha"

      - name: Update Chocolatey package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          RELEASE_SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          ./distribution/windows/update-manifests.ps1 `
            -Version $env:RELEASE_VERSION `
            -ReleaseSha256 $env:RELEASE_SHA256 `
            -ChocolateyNuspecPath 'distribution/chocolatey/perl-lsp.nuspec' `
            -ChocolateyInstallPath 'distribution/chocolatey/tools/chocolateyinstall.ps1'

          if (Select-String -Path 'distribution/chocolatey/perl-lsp.nuspec', 'distribution/chocolatey/tools/chocolateyinstall.ps1' -Pattern '__RELEASE_VERSION__|__RELEASE_SHA256__' -Quiet) {
            throw 'Chocolatey files still contain unreplaced placeholders after update.'
          }

      - name: Create repo-local Chocolatey package PR
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/chocolatey-${{ steps.tag.outputs.version }}
          title: "chore(distribution): refresh Chocolatey package for ${{ steps.tag.outputs.version }}"
          body: |
            Refresh the repo-local Chocolatey package metadata for perl-lsp ${{ steps.tag.outputs.version }}.

            The release archive was downloaded from the published GitHub release and hashed in this workflow. Upstream submission to `chocolatey-community/chocolatey-coreteampackages` remains a separate maintainer action; this workflow does not claim cross-repository write authority.
          commit-message: "chore(distribution): refresh Chocolatey package for ${{ steps.tag.outputs.version }}"
          add-paths: |
            distribution/chocolatey/perl-lsp.nuspec
            distribution/chocolatey/tools/chocolateyinstall.ps1
          labels: |
            automated-pr
            skip-title-check
          signoff: false
          delete-branch: true

      - name: Summary
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          RELEASE_SHA256: ${{ steps.checksum.outputs.sha256 }}
          PACKAGE_PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '## Chocolatey Manifest Refresh Complete'
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Add-Content $env:GITHUB_STEP_SUMMARY "- **Version**: $env:RELEASE_VERSION"
          Add-Content $env:GITHUB_STEP_SUMMARY "- **SHA256**: $env:RELEASE_SHA256"
          Add-Content $env:GITHUB_STEP_SUMMARY "- **Repo-local PR**: $env:PACKAGE_PR_URL"
          Add-Content $env:GITHUB_STEP_SUMMARY '- **Upstream submission**: manual follow-up to chocolatey-community/chocolatey-coreteampackages'
