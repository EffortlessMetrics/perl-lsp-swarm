name: Post-Merge Corpus Ratchet

# Refresh the CPAN corpus baseline and known-clean manifest. Corpus installation,
# parsing, and ratcheting run without repository write authority. A separate
# minimal job proposes the two generated files through a reviewable PR.

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
    paths:
      - '.ci/cpan-top-1000-distributions.txt'
      - '.ci/cpan-top-50-distributions.txt'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: bounded (top-50, fast) or full (top-1000, nightly)'
        required: false
        type: choice
        options:
          - bounded
          - full
        default: bounded

concurrency:
  group: post-merge-corpus-ratchet-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corpus-ratchet-bounded:
    name: CPAN corpus (bounded — top 50)
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.mode == 'bounded' || github.event.inputs.mode == ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout bounded analysis tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          shared-key: post-merge-corpus-ratchet-${{ hashFiles('Cargo.lock') }}

      - name: Install just
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2.85.13
        with:
          tool: just

      - name: Restore CPAN corpus cache (bounded)
        id: cpan-bounded-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/cpan-corpus-bounded
          key: cpan-corpus-bounded-${{ runner.os }}-${{ hashFiles('.ci/cpan-top-50-distributions.txt') }}
          restore-keys: |
            cpan-corpus-bounded-${{ runner.os }}-

      - name: Install CPAN corpus (bounded — top 50)
        id: cpan-bounded-install
        if: steps.cpan-bounded-cache-restore.outputs.cache-hit != 'true'
        run: |
          cargo xtask cpan-corpus install \
            --dist-list .ci/cpan-top-50-distributions.txt \
            --install-dir target/cpan-corpus-bounded

      - name: Save CPAN corpus cache (bounded)
        if: steps.cpan-bounded-install.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/cpan-corpus-bounded
          key: cpan-corpus-bounded-${{ runner.os }}-${{ hashFiles('.ci/cpan-top-50-distributions.txt') }}

      - name: Verify bounded corpus path
        run: test -d "$GITHUB_WORKSPACE/target/cpan-corpus-bounded/lib/perl5"

      - name: Sweep bounded corpus and emit receipt
        run: |
          set -euo pipefail
          mkdir -p target/corpus-receipts
          cargo xtask cpan-corpus sweep \
            --install-dir target/cpan-corpus-bounded \
            --output target/corpus-receipts/bounded-sweep.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path('target/corpus-receipts/bounded-sweep.json').read_text(encoding='utf-8')
          )
          total = report.get('total_files', 0)
          clean = report.get('clean_files', 0)
          pct = (clean / total * 100) if total > 0 else 0
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a', encoding='utf-8') as handle:
              handle.write('### CPAN Corpus (Bounded — Top 50)\n')
              handle.write('| Metric | Value |\n| --- | ---: |\n')
              handle.write(f'| Total .pm files | {total} |\n')
              handle.write(f'| Parse-clean | {clean} ({pct:.1f}%) |\n')
              handle.write(f'| Parse failures | {total - clean} |\n')
          PY

      - name: Upload bounded corpus receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpan-corpus-bounded-receipt-${{ github.sha }}
          path: target/corpus-receipts/bounded-sweep.json
          retention-days: 14
          if-no-files-found: warn

  corpus-ratchet-full:
    name: CPAN corpus ratchet (full — 1000 distributions)
    # A manual full run must come from the default branch. `workflow_dispatch`
    # accepts any ref, and this lane executes repository-owned Rust and shares a
    # `target/cpan-corpus` cache key with the scheduled default-branch run, so a
    # branch dispatch could otherwise seed that cache and feed the writer.
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.mode == 'full' &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.scope.outputs.changed }}

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          shared-key: post-merge-corpus-ratchet-${{ hashFiles('Cargo.lock') }}

      - name: Install just
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2.85.13
        with:
          tool: just

      - name: Restore CPAN corpus cache (full)
        id: cpan-corpus-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/cpan-corpus
          key: cpan-corpus-${{ runner.os }}-${{ hashFiles('.ci/cpan-top-1000-distributions.txt') }}
          restore-keys: |
            cpan-corpus-${{ runner.os }}-

      - name: Install CPAN corpus
        id: cpan-install
        if: steps.cpan-corpus-cache-restore.outputs.cache-hit != 'true'
        run: cargo xtask cpan-corpus install

      - name: Save CPAN corpus cache (full)
        if: steps.cpan-install.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/cpan-corpus
          key: cpan-corpus-${{ runner.os }}-${{ hashFiles('.ci/cpan-top-1000-distributions.txt') }}

      - name: Verify corpus baseline path
        run: test -d "$GITHUB_WORKSPACE/target/cpan-corpus/lib/perl5"

      - name: Update CPAN baseline receipt
        run: cargo xtask cpan-corpus sweep --output .ci/cpan-corpus-baseline.json

      - name: Run corpus ratchet
        run: cargo xtask cpan-corpus ratchet

      - name: Verify CPAN corpus gate
        run: cargo xtask cpan-corpus sweep --enforce

      - name: Emit corpus receipt summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path('.ci/cpan-corpus-baseline.json')
          if not report_path.is_file():
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding='utf-8'))
          total = report.get('total_files', 0)
          clean = report.get('clean_files', 0)
          pct = (clean / total * 100) if total > 0 else 0
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a', encoding='utf-8') as handle:
              handle.write('### CPAN Corpus (Full — 1000 distributions)\n')
              handle.write('| Metric | Value |\n| --- | ---: |\n')
              handle.write(f'| Total .pm files | {total} |\n')
              handle.write(f'| Parse-clean | {clean} ({pct:.1f}%) |\n')
              handle.write(f'| Parse failures | {total - clean} |\n')
          PY

      - name: Verify generated corpus scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          allowed=(
            .ci/cpan-corpus-baseline.json
            .ci/cpan-corpus-manifest.txt
          )

          for expected in "${allowed[@]}"; do
            if [ -L "$expected" ] || [ ! -f "$expected" ]; then
              printf '::error::Generated corpus output is not a regular file: %s\n' "$expected"
              exit 1
            fi
          done

          mapfile -d '' changed < <(
            {
              git diff --name-only -z --
              git ls-files --others --exclude-standard -z
            } | sort -zu
          )
          for candidate in "${changed[@]}"; do
            allowed_match=false
            for expected in "${allowed[@]}"; do
              if [ "$candidate" = "$expected" ]; then
                allowed_match=true
                break
              fi
            done
            if [ "$allowed_match" != "true" ]; then
              printf '::error::Corpus ratchet modified an unexpected file: %s\n' "$candidate"
              exit 1
            fi
          done

          if [ "${#changed[@]}" -gt 0 ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            printf 'Generated corpus changes:\n'
            printf '  %s\n' "${changed[@]}"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Corpus receipts are already current.'
          fi

      - name: Upload full corpus evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpan-corpus-full-receipt-${{ github.run_id }}
          path: |
            .ci/cpan-corpus-baseline.json
            .ci/cpan-corpus-manifest.txt
          retention-days: 30
          if-no-files-found: warn

  open-ratchet-pr:
    name: Open refreshed corpus receipt PR
    needs: corpus-ratchet-full
    # The trusted-event anchor is deliberately restated here rather than
    # inherited through `needs`. The only write surface in this workflow must
    # be statically unreachable from `pull_request` by reading this job alone,
    # without tracing the producer's guards.
    if: |
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.corpus-ratchet-full.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin the ref explicitly. `workflow_dispatch` can be launched against
          # any branch; without this the step's name would be a false claim and
          # the writer would commit against the dispatched ref.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Staged outside the worktree on purpose. `upload-artifact` roots a
      # multi-path artifact at the least common ancestor of its inputs, so an
      # artifact built from two `.ci/*` files carries bare basenames with no
      # `.ci/` prefix. Downloading that to `.` would drop the generated files at
      # the repository root and leave the real `.ci/` copies untouched — every
      # check below would then pass against unmodified checkout content and the
      # writer would silently open nothing.
      - name: Download generated corpus receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cpan-corpus-full-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/corpus-receipts

      - name: Verify and stage PR payload
        shell: bash
        env:
          STAGED: ${{ runner.temp }}/corpus-receipts
          MAX_BYTES: '4194304'
        run: |
          set -euo pipefail

          baseline_name='cpan-corpus-baseline.json'
          manifest_name='cpan-corpus-manifest.txt'

          # The artifact must contain exactly the two expected members. A
          # differing layout means the producer or the upload root changed, and
          # this job must fail loudly rather than infer a location.
          mapfile -t staged_entries < <(cd "$STAGED" && find . -mindepth 1 -printf '%P\n' | sort)
          expected_entries=$(printf '%s\n%s\n' "$baseline_name" "$manifest_name")
          if [ "$(printf '%s\n' "${staged_entries[@]}")" != "$expected_entries" ]; then
            printf '::error::Unexpected corpus artifact layout. Expected exactly:\n%s\nGot:\n%s\n' \
              "$expected_entries" "$(printf '%s\n' "${staged_entries[@]}")"
            exit 1
          fi

          for name in "$baseline_name" "$manifest_name"; do
            path="$STAGED/$name"
            if [ -L "$path" ] || [ ! -f "$path" ]; then
              printf '::error::Corpus output is not a regular file: %s\n' "$name"
              exit 1
            fi
            size=$(stat -c '%s' "$path")
            if [ "$size" -eq 0 ]; then
              printf '::error::Corpus output is empty: %s\n' "$name"
              exit 1
            fi
            if [ "$size" -gt "$MAX_BYTES" ]; then
              printf '::error::Corpus output exceeds the %s-byte cap: %s is %s bytes\n' \
                "$MAX_BYTES" "$name" "$size"
              exit 1
            fi
          done

          # Semantic bounds, not just "parses". The baseline must be a JSON
          # object carrying its schema version; the manifest must be LF-normalized
          # UTF-8 text with no NUL bytes.
          python3 - "$STAGED/$baseline_name" "$STAGED/$manifest_name" <<'PY'
          import json
          import sys

          baseline_path, manifest_path = sys.argv[1], sys.argv[2]

          with open(baseline_path, "rb") as handle:
              raw = handle.read()
          try:
              baseline = json.loads(raw.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              sys.exit(f"::error::baseline is not valid UTF-8 JSON: {error}")
          if not isinstance(baseline, dict):
              sys.exit("::error::baseline must be a JSON object")
          if "schema_version" not in baseline:
              sys.exit("::error::baseline is missing schema_version")

          with open(manifest_path, "rb") as handle:
              manifest = handle.read()
          if b"\x00" in manifest:
              sys.exit("::error::manifest contains NUL bytes")
          if b"\r" in manifest:
              sys.exit("::error::manifest is not LF-normalized")
          try:
              text = manifest.decode("utf-8")
          except UnicodeDecodeError as error:
              sys.exit(f"::error::manifest is not valid UTF-8: {error}")
          if not text.strip():
              sys.exit("::error::manifest has no content")
          PY

          cp "$STAGED/$baseline_name" ".ci/$baseline_name"
          cp "$STAGED/$manifest_name" ".ci/$manifest_name"

          # The producer reported a change, so the staged payload must actually
          # differ from the trusted checkout — and nothing else may have moved.
          changed=$(git diff --name-only)
          if [ -z "$changed" ]; then
            printf '::error::Producer reported changed=true but the staged payload matches the default branch\n'
            exit 1
          fi
          unexpected=$(printf '%s\n' "$changed" | grep -vE "^\.ci/($baseline_name|$manifest_name)$" || true)
          if [ -n "$unexpected" ]; then
            printf '::error::Unexpected tracked changes outside the governed payload:\n%s\n' "$unexpected"
            exit 1
          fi
          printf 'Governed payload change:\n%s\n' "$changed"

      - name: Create refreshed corpus PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/corpus-ratchet
          delete-branch: true
          add-paths: |
            .ci/cpan-corpus-baseline.json
            .ci/cpan-corpus-manifest.txt
          commit-message: 'chore(ci): refresh CPAN corpus receipts (#1004)'
          title: 'chore(ci): refresh CPAN corpus receipts (#1004)'
          labels: ci
          body: |
            Refreshes `.ci/cpan-corpus-baseline.json` and
            `.ci/cpan-corpus-manifest.txt` from the trusted nightly corpus ratchet.

            Corpus installation, parsing, ratcheting, and gate enforcement ran in
            a read-only job. This writer job consumed only the two bounded generated
            files and did not execute repository code.

            See #1004.
