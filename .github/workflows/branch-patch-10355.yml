name: Branch patch 10355

on:
  push:
    branches:
      - fix/10355-perl-542-named-writer
    paths:
      - .github/workflows/branch-patch-10355.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/10355-perl-542-named-writer
          fetch-depth: 1
          persist-credentials: true

      - name: Install the repository toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply the bounded semantic repair and regression
        shell: python
        run: |
          from pathlib import Path

          source_path = Path("crates/perl-semantic-analyzer/src/analysis/class_model.rs")
          source = source_path.read_text(encoding="utf-8")
          old = '''    fn object_pad_writer_name(field_name: &str, traits: &[String]) -> Option<String> {
                  if traits.iter().any(|trait_name| trait_name == "writer") {
                      Some(format!("set_{}", Self::object_pad_public_name(field_name)))
                  } else {
                      None
                  }
              }
          '''
          new = '''    fn object_pad_writer_name(field_name: &str, traits: &[String]) -> Option<String> {
                  for trait_name in traits {
                      if trait_name == "writer" {
                          return Some(format!("set_{}", Self::object_pad_public_name(field_name)));
                      }
          
                      if let Some(writer_name) = trait_name
                          .strip_prefix("writer(")
                          .and_then(|writer_name| writer_name.strip_suffix(')'))
                          .map(str::trim)
                          .filter(|writer_name| !writer_name.is_empty())
                      {
                          return Some(writer_name.to_owned());
                      }
                  }
          
                  None
              }
          '''

          matches = source.count(old)
          if matches != 1:
              raise SystemExit(f"expected exactly one writer helper seam, found {matches}")
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path(
              "crates/perl-semantic-analyzer/tests/native_class_named_writer.rs"
          )
          test_path.write_text(
              '''//! Perl 5.42 native-class writer generation regression.
          
          use perl_semantic_analyzer::{
              Parser,
              analysis::class_model::ClassModelBuilder,
          };
          use perl_tdd_support::{must, must_some};
          
          #[test]
          fn native_class_named_writer_uses_explicit_method_name() {
              let mut parser = Parser::new(
                  r#"
          class Counter {
              field $implicit :writer;
              field $named :writer(write_named);
          }
          "#,
              );
              let ast = must(parser.parse());
              let models = ClassModelBuilder::new().build(&ast);
              let model = must_some(models.iter().find(|model| model.name == "Counter"));
          
              let implicit = must_some(model.fields.iter().find(|field| field.name == "implicit"));
              let named = must_some(model.fields.iter().find(|field| field.name == "named"));
          
              assert_eq!(implicit.writer.as_deref(), Some("set_implicit"));
              assert_eq!(named.writer.as_deref(), Some("write_named"));
              assert!(
                  model
                      .methods
                      .iter()
                      .any(|method| method.synthetic && method.name == "set_implicit")
              );
              assert!(
                  model
                      .methods
                      .iter()
                      .any(|method| method.synthetic && method.name == "write_named")
              );
              assert!(
                  !model
                      .methods
                      .iter()
                      .any(|method| method.synthetic && method.name == "set_named"),
                  "an explicitly named writer must not retain the default set_<field> identity"
              );
          }
          ''',
              encoding="utf-8",
          )

      - name: Format the workspace
        run: cargo fmt --all

      - name: Run the focused semantic regression
        run: cargo test -p perl-semantic-analyzer --test native_class_named_writer

      - name: Check the resulting patch
        run: git diff --check

      - name: Commit the clean candidate and remove this executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm .github/workflows/branch-patch-10355.yml
          git add \
            crates/perl-semantic-analyzer/src/analysis/class_model.rs \
            crates/perl-semantic-analyzer/tests/native_class_named_writer.rs
          git diff --cached --check
          git commit -m "fix(semantic): honor named Perl 5.42 writers (#10355)"
          git push origin HEAD:fix/10355-perl-542-named-writer
