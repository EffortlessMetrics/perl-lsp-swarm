          path.write_text(text)
          PY

          cargo fmt -p xtask
          mapfile -t changed_files < <(git diff --name-only -- 'xtask/src/tasks/generate_semantic_snapshot.rs')
          if [ "${#changed_files[@]}" -ne 1 ] || [ "${changed_files[0]}" != "$target_file" ]; then
            printf 'unexpected review-fix surface:\n'
            printf '  %s\n' "${changed_files[@]}"
            exit 1
          fi

          git rm -- "$workflow_file"
          git add -- "$target_file"
          git diff --cached --check
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git commit -m 'fix(xtask): close snapshot output authority gaps'
          git push origin "HEAD:${HEAD_BRANCH}"
