name: PR 6750 review fixes

on:
  push:
    branches:
      - agent/hir-snapshot-exact-set-6725

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out writable branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/hir-snapshot-exact-set-6725
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply bounded review fixes and remove this instrument
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          target_file='xtask/src/tasks/generate_semantic_snapshot.rs'
          workflow_file='.github/workflows/pr-6750-review-fixes.yml'
          python3 -c 'import base64, os; exec(base64.b64decode(os.environ["PATCH_B64"]))'
          cargo fmt -p xtask
          mapfile -t changed_files < <(git diff --name-only -- "$target_file")
          if [ "${#changed_files[@]}" -ne 1 ] || [ "${changed_files[0]}" != "$target_file" ]; then
            printf 'unexpected review-fix surface:\n'
            printf '  %s\n' "${changed_files[@]}"
            exit 1
          fi
          git rm -- "$workflow_file"
          git add -- "$target_file"
          git diff --cached --check
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git commit -m 'fix(xtask): close snapshot output authority gaps'
          git push origin HEAD:agent/hir-snapshot-exact-set-6725
