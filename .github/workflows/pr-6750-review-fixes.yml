name: PR 6750 review fixes

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.event.pull_request.number == 6750 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply bounded review fixes and remove this instrument
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          target_file='xtask/src/tasks/generate_semantic_snapshot.rs'
          workflow_file='.github/workflows/pr-6750-review-fixes.yml'

          python3 - <<'PY'
          from pathlib import Path

          path = Path('xtask/src/tasks/generate_semantic_snapshot.rs')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'use std::path::{Path, PathBuf};',
              'use std::path::{Component, Path, PathBuf};',
          )

          replace_once(
              'fn validate_output_separation(root: &Path, fixtures: &[PathBuf], output: &Path) -> Result<()> {\n    let output_metadata = match fs::symlink_metadata(output) {',
              'fn validate_output_separation(root: &Path, fixtures: &[PathBuf], output: &Path) -> Result<()> {\n    validate_output_path_syntax(output)?;\n\n    let output_metadata = match fs::symlink_metadata(output) {',
          )

          replace_once(
              '    Ok(())\n}\n\nfn normalize_output_path(path: &Path, exists: bool) -> Result<PathBuf> {',
              '''    Ok(())
}

fn validate_output_path_syntax(path: &Path) -> Result<()> {
    for component in path.components() {
        if matches!(component, Component::CurDir | Component::ParentDir) {
            bail!("Snapshot output path is not canonical: {}", path.display());
        }
    }
    Ok(())
}

fn normalize_output_path(path: &Path, exists: bool) -> Result<PathBuf> {''',
          )

          replace_once(
              '            if same_file_identity(output_metadata, &fixture_metadata) {',
              '            if same_file_identity(output_metadata, &fixture_metadata)? {',
          )

          replace_once(
              '''#[cfg(unix)]
fn same_file_identity(left: &fs::Metadata, right: &fs::Metadata) -> bool {
    use std::os::unix::fs::MetadataExt as _;

    left.dev() == right.dev() && left.ino() == right.ino()
}

#[cfg(windows)]
fn same_file_identity(left: &fs::Metadata, right: &fs::Metadata) -> bool {
    use std::os::windows::fs::MetadataExt as _;

    match (
        (left.volume_serial_number(), left.file_index()),
        (right.volume_serial_number(), right.file_index()),
    ) {
        ((Some(left_volume), Some(left_index)), (Some(right_volume), Some(right_index))) => {
            left_volume == right_volume && left_index == right_index
        }
        _ => false,
    }
}

#[cfg(not(any(unix, windows)))]
fn same_file_identity(_left: &fs::Metadata, _right: &fs::Metadata) -> bool {
    false
}''',
              '''#[cfg(unix)]
fn same_file_identity(left: &fs::Metadata, right: &fs::Metadata) -> Result<bool> {
    use std::os::unix::fs::MetadataExt as _;

    Ok(left.dev() == right.dev() && left.ino() == right.ino())
}

#[cfg(windows)]
fn same_file_identity(left: &fs::Metadata, right: &fs::Metadata) -> Result<bool> {
    use std::os::windows::fs::MetadataExt as _;

    match (
        (left.volume_serial_number(), left.file_index()),
        (right.volume_serial_number(), right.file_index()),
    ) {
        ((Some(left_volume), Some(left_index)), (Some(right_volume), Some(right_index))) => {
            Ok(left_volume == right_volume && left_index == right_index)
        }
        _ => bail!("Snapshot output file identity is unavailable on Windows"),
    }
}

#[cfg(not(any(unix, windows)))]
fn same_file_identity(_left: &fs::Metadata, _right: &fs::Metadata) -> Result<bool> {
    bail!(
        "Snapshot output file identity is unsupported on target {}",
        std::env::consts::OS
    )
}''',
          )

          replace_once(
              '''    #[test]
    fn snapshot_names_typed_dereference_items() {''',
              '''    #[test]
    fn output_rejects_parent_directory_components() {
        let temporary = TempDir::new().expect("tempdir");
        let fixture_dir = temporary.path().join("fixtures");
        write_fixture(&fixture_dir, "source.pl", "1;\\n");
        let output = fixture_dir.join("missing").join("..").join("snapshot.pl");

        let error = generate_snapshot_result(&fixture_dir, &output)
            .expect_err("parent-directory output must fail closed");
        assert!(error.to_string().contains("not canonical"), "unexpected error: {error}");
