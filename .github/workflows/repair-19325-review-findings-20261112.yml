name: Repair 19325 reviewed bootstrap findings

on:
  push:
    branches: [codex/19325-review-fixes-20261112]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout repair authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/19325-review-fixes-20261112
          path: helper
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dot/nonrust-trusted-precursor-20261112
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Apply complete reviewed repair
        working-directory: target
        shell: bash
        env:
          EXPECTED_HEAD: e0a1b3250ca09b90025eae9530fda40f71b0023a
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" ]
          python3 ../helper/.github/scripts/repair_19325.py
          cargo fmt --all
          git diff --check

      - name: Admission authority regressions
        working-directory: target
        run: python3 -B scripts/ci/test_hosted_queue_admission.py

      - name: Publication transport regressions
        working-directory: target
        run: python3 -B scripts/tests/test_publication_consistency_hook.py

      - name: Gate and publication unit qualification
        working-directory: target
        run: cargo test --locked -p xtask --bin xtask tasks::gates -- --nocapture

      - name: Whitespace instrument-failure regression
        working-directory: target
        run: >-
          cargo test --locked -p xtask --bin xtask
          whitespace_check_unknown_object_is_not_proven_not_blocked -- --nocapture

      - name: Denied shortcut lint qualification
        working-directory: target
        run: >-
          cargo clippy --locked -p xtask --bin xtask --tests --
          -D clippy::unwrap_used -D clippy::expect_used

      - name: Publish exact repaired candidate
        working-directory: target
        shell: bash
        env:
          EXPECTED_HEAD: e0a1b3250ca09b90025eae9530fda40f71b0023a
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" ]
          cargo fmt --all -- --check
          git diff --check
          expected=$'scripts/ci/hosted_queue_admission.py\nscripts/ci/test_hosted_queue_admission.py\nscripts/tests/test_publication_consistency_hook.py\nxtask/src/tasks/commit_checks.rs\nxtask/src/tasks/gates.rs\nxtask/src/tasks/gates/publication.rs'
          actual="$(git diff --name-only | LC_ALL=C sort)"
          [ "$actual" = "$expected" ] || {
            printf 'expected changed files:\n%s\nactual:\n%s\n' "$expected" "$actual"
            exit 1
          }
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add scripts/ci/hosted_queue_admission.py \
            scripts/ci/test_hosted_queue_admission.py \
            scripts/tests/test_publication_consistency_hook.py \
            xtask/src/tasks/commit_checks.rs \
            xtask/src/tasks/gates.rs \
            xtask/src/tasks/gates/publication.rs
          git commit -m 'ci: close hosted bootstrap review findings (#19325)'
          git push origin HEAD:refs/heads/dot/nonrust-trusted-precursor-20261112
