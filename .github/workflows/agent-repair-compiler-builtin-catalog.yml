name: Agent repair compiler builtin catalog

on:
  push:
    branches:
      - agent/compiler-builtin-catalog-6679
    paths:
      - .github/workflows/agent-repair-compiler-builtin-catalog.yml
      - .github/scripts/repair_compiler_builtin_catalog.py

permissions:
  contents: write

concurrency:
  group: agent-repair-compiler-builtin-catalog
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout triggering candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply reviewed repairs
        run: python3 .github/scripts/repair_compiler_builtin_catalog.py

      - name: Validate schema syntax
        run: python3 -m json.tool schemas/perl_builtin_semantics.v1.schema.json >/dev/null

      - name: Format candidate
        run: rustfmt --edition 2024 xtask/src/bin/compiler-builtin-catalog.rs

      - name: Regenerate status
        run: cargo run -p xtask --bin compiler-builtin-catalog -- --write-status

      - name: Verify formatting
        run: rustfmt --edition 2024 --check xtask/src/bin/compiler-builtin-catalog.rs

      - name: Verify unit tests
        run: cargo test -p xtask --bin compiler-builtin-catalog -- --nocapture

      - name: Verify Clippy
        run: cargo clippy -p xtask --bin compiler-builtin-catalog -- -D warnings

      - name: Verify generated status
        run: cargo run -p xtask --bin compiler-builtin-catalog -- --check

      - name: Commit production repair
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm .github/workflows/agent-repair-compiler-builtin-catalog.yml
          git rm .github/scripts/repair_compiler_builtin_catalog.py
          git add contracts/compiler/perl_builtin_semantics.v1.toml
          git add docs/project/status/perl_builtin_semantics.md
          git add schemas/perl_builtin_semantics.v1.schema.json
          git add xtask/src/bin/compiler-builtin-catalog.rs
          git diff --cached --check
          git commit -m "fix(compiler): close builtin catalog authority gaps"
          git push origin HEAD:agent/compiler-builtin-catalog-6679
