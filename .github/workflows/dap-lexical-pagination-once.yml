name: DAP lexical pagination repair (one shot)

on:
  push:
    branches:
      - agent/dap-scorecard-same-sha-6680
    paths:
      - '.github/workflows/dap-lexical-pagination-once.yml'
      - '.github/scripts/apply-dap-lexical-pagination-fix.py'

permissions:
  contents: write

jobs:
  repair:
    name: Apply and verify lexical pagination repair
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: agent/dap-scorecard-same-sha-6680
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply bounded product repair
        run: python3 .github/scripts/apply-dap-lexical-pagination-fix.py

      - name: Format and run focused proof
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test -p perl-dap build_locals_b_eval_cmd --locked
          cargo test -p perl-dap parsed_lexical_array_preserves_a_deep_page --locked
          python3 scripts/tests/test_dap_scorecard_runtime.py
          python3 scripts/tests/test_dap_scorecard_packet.py
          git diff --check

      - name: Commit product repair and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/dap-lexical-pagination-once.yml
          git rm .github/scripts/apply-dap-lexical-pagination-fix.py
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(dap): preserve lexical collection pagination'
          git push origin HEAD:agent/dap-scorecard-same-sha-6680
