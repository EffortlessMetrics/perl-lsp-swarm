name: Receipt Instrument Check (Advisory)

# M7 (#3849) / #3947: the completion-claim receipt gate previously lived in
# `.claude/hooks/task-completed.sh` -- a local agent-runtime hook that read a
# path (`receipts/{verify-build,clippy,test}.<hash>`) nothing in the repo
# ever wrote. That hook logic has been REMOVED, not repointed: a local hook
# is an agent-runtime event with no guarantee it fires for every completion
# path, and it is invisible to reviewers/branch-protection. The authority
# for "a real test gate ran, bound to this head" belongs here instead -- a
# head-bound, actor-agnostic GitHub check.
#
# DESIGN NOTE (corrected after local verification): the `unit_scoped` gate
# has `planning.role = rust_scoped`, and `cargo xtask gates` refuses to run
# a rust_scoped gate standalone via `--gate <name>` -- its command template
# has an unresolved `{package_args}` placeholder that only ci-scope's
# `--tier` planning fills in (verified locally: `--gate unit_scoped` alone
# errors loudly rather than silently running with zero tests -- xtask has
# its own version of this same guard). So this workflow runs the full
# `--tier pr-fast` plan (the SAME command `pr-smoke` in `ci.yml` already
# runs) to get a genuine, ci-scope-resolved `target/receipts/receipt.json`
# (schema: `xtask/src/tasks/gates.rs` `Receipt`), then asserts on it via
# `scripts/ci/check-receipt-instrument.sh`. This DOES duplicate pr-smoke's
# work for now (see the PR's "design wrinkles" -- consuming pr-smoke's
# already-uploaded `pr-fast-receipt-<sha>` artifact via a `workflow_run`
# trigger would avoid the duplication, but that adds run-id-correlation
# complexity not justified for an advisory-first check).
#
# HONEST SCOPE: this catches a zero-selection / zero-test / all-skipped
# gate run (ci-scope selected no crates, or every test reported skipped) --
# it does NOT and cannot catch an early-return-Ok test body (cargo counts
# that as passed). See `scripts/ci/check-receipt-instrument.sh`'s header for
# the full explanation and `scripts/tests/test-check-receipt-instrument.sh`
# for the fixture that documents this limitation explicitly.
#
# THIS JOB IS DELIBERATELY LIGHTWEIGHT: it installs only the Rust toolchain
# (no `just`, no doc-check tooling), so several always-on pr_fast gates
# (fmt, release_history, readme_heading_check, compile_all_targets, ...)
# fail here with exit 127 (tooling not installed) -- that is EXPECTED and
# is not what this check is asserting on (see check-receipt-instrument.sh's
# "SCOPE, DELIBERATELY NARROW" note: it inspects only TEST-COMMAND gates --
# identified by their `command` field containing `cargo test`/`cargo
# nextest` -- and requires every such gate to carry real, nonzero metrics;
# every other gate's status/exit_code is ignored entirely). The
# "Run the pr-fast tier" step is allowed to fail (`continue-on-error`) for
# exactly this reason; the job's real pass/fail signal is the Assert step.
# Those tooling gates are already covered by the required checks
# (`pr-smoke`/merge-gate shards), not this one.
#
# ADVISORY: intentionally NOT listed in `.ci/policies/required-checks.toml`.
# Per the M6 lesson, do not promote to required until this shows recurring
# value catching a real zero-selection/zero-test incident.

on:
  pull_request:
    paths:
      - 'crates/**/*.rs'
      - 'xtask/src/tasks/gates.rs'
      - '.ci/gate-policy.yaml'
      - 'scripts/ci/check-receipt-instrument.sh'
      - 'scripts/tests/test-check-receipt-instrument.sh'
      - '.github/workflows/receipt-instrument-check.yml'
  merge_group:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  receipt-instrument-check:
    name: Receipt instrument check (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Check out the real PR head, not the synthetic merge commit --
          # otherwise `git rev-parse HEAD` (collect_metadata() in gates.rs)
          # stamps the receipt with the merge SHA, and the receipt would
          # never match the PR head this check is meant to bind to
          # (established pattern: .github/workflows/ci.yml).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
          # Fetch full history so ci-scope can diff against origin/main.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88  # stable
        with:
          toolchain: 1.95.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-on-failure: true
          shared-key: receipt-instrument-check-${{ hashFiles('Cargo.lock') }}

      - name: Detect a diff relevant to this check's live-run path
        id: diff
        # Mirrors the `on.pull_request.paths` trigger list above (not just
        # `.rs` files): a PR that changes ONLY .ci/gate-policy.yaml, this
        # check's own assertion script, or this workflow file still needs a
        # LIVE receipt to validate the receipt-producing machinery itself
        # -- not just the fixture self-test. `perl_token_leaf_contract`
        # (planning.role = always_on, .ci/gate-policy.yaml) always runs
        # `cargo test -p perl-token --test conformance_guards` regardless
        # of ci-scope's diff-based crate selection, so it doubles as a
        # sentinel: the live tier run always produces at least one real,
        # non-scoped test-metrics gate even for a diff with zero `.rs`
        # files, so no separate sentinel-crate trick is needed.
        run: |
          if git diff --name-only origin/main...HEAD -- \
              'crates/**/*.rs' 'xtask/**/*.rs' '.ci/gate-policy.yaml' \
              'scripts/ci/check-receipt-instrument.sh' \
              '.github/workflows/receipt-instrument-check.yml' \
              | grep -q .; then
            echo "needs_live_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_live_run=false" >> "$GITHUB_OUTPUT"
            echo "No changes relevant to this check's live-run path vs origin/main -- skipping the live gate run (nothing to prove)."
          fi

      - name: Run the pr-fast tier with a fresh receipt
        if: steps.diff.outputs.needs_live_run == 'true'
        # continue-on-error: this lightweight job doesn't install `just` or
        # doc-check tooling, so non-test always-on gates (fmt,
        # release_history, compile_all_targets, ...) legitimately fail here
        # with exit 127 -- that's out of scope for what this check asserts
        # (see the module header above and check-receipt-instrument.sh).
        # The real pass/fail signal is the Assert step below, which only
        # inspects test-metrics-bearing gates.
        continue-on-error: true
        run: |
          mkdir -p target/receipts
          cargo xtask gates --tier pr-fast --receipt \
            --receipt-path target/receipts/receipt.json --base origin/main

      - name: Assert the instrument actually ran (zero-selection/zero-test guard)
        # always(): still inspect whatever receipt was written even if the
        # tier step itself already failed a required gate (write_receipt in
        # gates.rs runs before the bail! on blocking failures) -- gives a
        # useful vacuous-run signal independent of other gate failures. This
        # step (not the tier step above) is the job's real pass/fail signal.
        if: always() && steps.diff.outputs.needs_live_run == 'true'
        run: |
          bash scripts/ci/check-receipt-instrument.sh \
            "${{ github.event.pull_request.head.sha || github.sha }}" \
            target/receipts/receipt.json

      - name: Test the assertion script itself (fixture-based red/green)
        run: bash scripts/tests/test-check-receipt-instrument.sh

      - name: Upload receipt
        if: always() && steps.diff.outputs.needs_live_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: receipt-instrument-check-${{ github.sha }}
          path: target/receipts/receipt.json
          if-no-files-found: warn
          retention-days: 7
