name: Agent Finalize Product Identity Rustfmt

on:
  push:
    branches:
      - fix/product-identity-rustfmt-baseline

permissions:
  contents: write

concurrency:
  group: agent-finalize-product-identity-rustfmt
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Produce and verify the exact bounded payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('xtask/src/tasks/product_identity.rs')
          text = path.read_text(encoding='utf-8')
          old = '"-_.”.contains(character)'
          new = '"-_.”.contains(character)'.replace('”', '"')
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one accidental Unicode quote, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          cargo fmt --all
          cargo fmt --all -- --check

          sha256sum -c <<'SUMS'
          37baa03208980efc021c3a77d26408d3772b1b11f6c453884bd9618e5b46d784  xtask/src/tasks/product_identity.rs
          e4c81c5c0e892c51cd430f3bc1f0c15b0ce2f7f6165e30e999ae63e0f48afd41  xtask/src/tasks/product_identity_default_build.rs
          07c5b469dc8e10bf8828897e5ea9ebb5c4a398f9776c3ad9b24b3ee5f5651ea8  xtask/src/tasks/product_identity_path_authority.rs
          8097a4a36150337fd800d87e24dd3b462f0b627cc5256727c0d04a20cce6817f  xtask/src/tasks/product_identity_tests.rs
          6e396e1894db9728b4c4294df87ea3f3bd11c88e11d8a264274fbae5ac7aeee8  xtask/src/tasks/product_identity_workspace.rs
          SUMS

          expected=$(cat <<'PATHS'
          xtask/src/tasks/product_identity.rs
          xtask/src/tasks/product_identity_default_build.rs
          xtask/src/tasks/product_identity_path_authority.rs
          xtask/src/tasks/product_identity_tests.rs
          xtask/src/tasks/product_identity_workspace.rs
          PATHS
          )
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"

      - name: Remove temporary control surface and publish final tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-finalize-product-identity-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xtask/src/tasks/product_identity.rs \
            xtask/src/tasks/product_identity_default_build.rs \
            xtask/src/tasks/product_identity_path_authority.rs \
            xtask/src/tasks/product_identity_tests.rs \
            xtask/src/tasks/product_identity_workspace.rs
          git commit -m "style(xtask): restore product identity rustfmt baseline"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/fix/product-identity-rustfmt-baseline"
