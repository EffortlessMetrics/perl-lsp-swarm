name: Refresh Rust 1.100 book projections

on:
  push:
    branches: [build/rust-1.100-upgrade]
    paths: [.github/workflows/rust-1-100-book-refresh.yml]

permissions:
  contents: write

concurrency:
  group: rust-1-100-book-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: build/rust-1.100-upgrade
          fetch-depth: 1
          persist-credentials: true

      - name: Regenerate mapped chapters
        shell: bash
        run: |
          set -euo pipefail
          # Generate all projections, but commit only the five canonical files touched by this migration.
          bash scripts/populate-book.sh >/tmp/populate-book.log
          git add -- \
            book/src/ci/overview.md \
            book/src/ci/local-validation.md \
            book/src/developer/development-workflow.md \
            book/src/developer/test-infrastructure.md \
            book/src/getting-started/installation.md
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Mapped book projections were already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(book): refresh Rust 1.100 projections"
          git push origin HEAD:build/rust-1.100-upgrade
