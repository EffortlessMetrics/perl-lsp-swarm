name: Portable Contract Tools

on:
  pull_request:
    branches: [main]
    paths:
      - 'aqua.yaml'
      - 'scripts/tools/aqua-doctor.sh'
      - 'scripts/tools/install-aqua.sh'
      - 'scripts/tests/test-install-aqua.sh'
      - 'scripts/tests/fixtures/aqua-bootstrap/**'
      - 'docs/how-to/PORTABLE_CONTRACT_TOOLS.md'
      - '.github/workflows/portable-contract-tools.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

concurrency:
  group: portable-contract-tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate Aqua inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact pull request head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repo"
          curl -fsSL "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${HEAD_SHA}" \
            -o "$RUNNER_TEMP/repo.tar.gz"
          tar -xzf "$RUNNER_TEMP/repo.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/repo"

      - name: Prove Aqua bootstrap identity
        working-directory: ${{ runner.temp }}/repo
        run: |
          set -euo pipefail
          bash -n scripts/tools/install-aqua.sh \
            scripts/tools/aqua-doctor.sh \
            scripts/tests/test-install-aqua.sh
          bash scripts/tests/test-install-aqua.sh

      - name: Install pinned Aqua bootstrap
        working-directory: ${{ runner.temp }}/repo
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          bash scripts/tools/install-aqua.sh --dest "$RUNNER_TEMP/bin" \
            >"$RUNNER_TEMP/aqua-bootstrap.log" 2>&1
          tail -n 40 "$RUNNER_TEMP/aqua-bootstrap.log"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Validate and install checked-in tools
        working-directory: ${{ runner.temp }}/repo
        run: |
          set +e
          bash scripts/tools/aqua-doctor.sh >"$RUNNER_TEMP/aqua-doctor.log" 2>&1
          rc=$?
          set -e
          tail -n 160 "$RUNNER_TEMP/aqua-doctor.log"
          exit "$rc"
