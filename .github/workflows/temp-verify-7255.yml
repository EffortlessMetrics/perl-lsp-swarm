name: Temporary verify and squash #7255

on:
  push:
    branches:
      - agent/exact-upstream-ts-parser-perl-7255

permissions:
  contents: write

jobs:
  verify-and-squash:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete branch history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install repository Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup default 1.95.0

      - name: Format parser-comparison candidate
        run: cargo fmt --manifest-path crates/perl-parser-comparison/Cargo.toml

      - name: Run isolated current-upstream subject tests
        run: |
          cargo test -p perl-parser-comparison \
            --no-default-features --features current-upstream \
            --test current_upstream_subject --locked

      - name: Run unaffected historical comparison suites
        run: |
          cargo test -p perl-parser-comparison --lib --bins \
            --test corpus_differential \
            --test differential \
            --locked

      - name: Pin existing historical recovery-suite red
        shell: bash
        run: |
          mkdir -p target/verification-logs
          set +e
          set -o pipefail
          cargo test -p perl-parser-comparison --test recovery_differential --locked 2>&1 \
            | tee target/verification-logs/recovery-baseline.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q '^test recovery_03_unclosed_string .* FAILED$' target/verification-logs/recovery-baseline.log
          grep -q '^test recovery_10_multiple_errors_across_file .* FAILED$' target/verification-logs/recovery-baseline.log
          test "$(grep -Ec '^test .* FAILED$' target/verification-logs/recovery-baseline.log)" -eq 2
          grep -q '^test recovery_07_truncated_heredoc .* ok$' target/verification-logs/recovery-baseline.log

      - name: Upload recovery baseline receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parser-comparison-recovery-baseline-${{ github.run_id }}
          path: target/verification-logs/recovery-baseline.log
          if-no-files-found: error

      - name: Check historical and current-upstream feature subjects
        run: |
          cargo check -p perl-parser-comparison --all-targets --locked
          cargo check -p perl-parser-comparison \
            --no-default-features --features current-upstream \
            --all-targets --locked

      - name: Run focused clippy for both isolated subjects
        shell: bash
        run: |
          set -o pipefail
          {
            cargo clippy -p perl-parser-comparison --all-targets --locked -- -D warnings
            cargo clippy -p perl-parser-comparison \
              --no-default-features --features current-upstream \
              --all-targets --locked -- -D warnings
          } 2>&1 | tee target/verification-logs/clippy.log

      - name: Upload clippy log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-upstream-clippy-${{ github.run_id }}
          path: target/verification-logs/clippy.log
          if-no-files-found: error

      - name: Prove mutually exclusive grammar features
        shell: bash
        run: |
          set +e
          output=$(cargo check -p perl-parser-comparison \
            --features current-upstream --locked 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'export the same native symbol' <<< "$output"

      - name: Check patch hygiene
        run: git diff --check

      - name: Remove temporary verifier and squash verified candidate
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm .github/workflows/temp-verify-7255.yml
          git add -A
          git reset --soft 2da40e518a9e48069f00b77f574f6c508888fa3b
          git commit -m "chore(parser-comparison): add exact current upstream subject (#7255)"
          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"
