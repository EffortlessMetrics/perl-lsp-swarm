name: Apply prerequisite identity patch

on:
  push:
    branches:
      - agent/13628-preserve-prerequisite-facts

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'EffortlessSteven'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply exact source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/perl-lsp-rs-core/src/config/metadata_dependencies.rs")
          source = path.read_text(encoding="utf-8")

          old_function = """fn push_unique(into: &mut Vec<DeclaredDependency>, dependency: DeclaredDependency) {
              if into.iter().any(|existing| existing.module == dependency.module) {
                  return;
              }
              into.push(dependency);
          }
          """
          new_function = """fn push_unique(into: &mut Vec<DeclaredDependency>, dependency: DeclaredDependency) {
              if into.contains(&dependency) {
                  return;
              }
              into.push(dependency);
          }
          """
          if source.count(old_function) != 1:
              raise SystemExit("expected exactly one module-only push_unique implementation")
          source = source.replace(old_function, new_function, 1)

          insertion_point = """    fn missing(message: &'static str) -> std::io::Error {
                  std::io::Error::other(message)
              }

          """
          test = """    #[test]
              fn push_unique_uses_complete_fact_identity() {
                  let runtime = DeclaredDependency::new(
                      "Shared::Module",
                      Some("1.0"),
                      "runtime.requires",
                      DeclaredDependencySource::MetaJson,
                  );
                  let test = DeclaredDependency::new(
                      "Shared::Module",
                      Some("1.0"),
                      "test.requires",
                      DeclaredDependencySource::MetaJson,
                  );
                  let newer = DeclaredDependency::new(
                      "Shared::Module",
                      Some("2.0"),
                      "runtime.requires",
                      DeclaredDependencySource::MetaJson,
                  );
                  let cpanfile = DeclaredDependency::new(
                      "Shared::Module",
                      Some("1.0"),
                      "requires",
                      DeclaredDependencySource::Cpanfile,
                  );

                  let mut dependencies = Vec::new();
                  push_unique(&mut dependencies, runtime.clone());
                  push_unique(&mut dependencies, runtime.clone());
                  push_unique(&mut dependencies, test.clone());
                  push_unique(&mut dependencies, newer.clone());
                  push_unique(&mut dependencies, cpanfile.clone());

                  assert_eq!(dependencies, vec![runtime, test, newer, cpanfile]);
              }

          """
          if source.count(insertion_point) != 1:
              raise SystemExit("expected exactly one test insertion point")
          source = source.replace(insertion_point, insertion_point + test, 1)
          path.write_text(source, encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check

      - name: Run focused regression
        run: cargo test -p perl-lsp-rs-core --locked push_unique_uses_complete_fact_identity

      - name: Commit clean source diff
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm .github/workflows/agent-13628-apply.yml
          git add crates/perl-lsp-rs-core/src/config/metadata_dependencies.rs
          git diff --cached --check
          git commit -m "fix(config): preserve prerequisite fact identity (#13628)"
          git push origin HEAD:agent/13628-preserve-prerequisite-facts
