name: VS Code Prebuilt Payload Adapter

on:
  workflow_dispatch: {}

concurrency:
  group: vscode-prebuilt-payload-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adapter:
    name: Prebuilt payload adapter tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repository Node authority
        uses: ./.github/actions/setup-vscode-toolchain
        with:
          install-dependencies: 'true'

      - name: Setup release schema Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned release schema dependencies
        run: python3 -m pip install -r scripts/requirements-release.txt

      - name: Run release evidence to VSIX adapter tests
        run: python3 -m unittest scripts.test_prepare_vsix_prebuilt_payload -v

      - name: Run mapped packaging and archive tests
        working-directory: vscode-extension
        run: |
          node --test scripts/check-vsix-prebuilt-payload.test.js scripts/check-vsix-inventory-transition.test.js
          node --test --test-name-pattern='mapped' scripts/package-command.test.js
