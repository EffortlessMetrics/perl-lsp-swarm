name: VS Code Prebuilt Payload Adapter

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'scripts/prepare_vsix_prebuilt_payload.py'
      - 'scripts/requirements-release.txt'
      - 'scripts/release_topology_json.py'
      - 'scripts/release_vsix_mapping.py'
      - 'scripts/generate_release_topology.py'
      - 'schemas/release_topology.*.schema.json'
      - 'schemas/vsix_candidate_payload.*.schema.json'
      - 'fixtures/rc_vsix_binding/**'
      - 'vscode-extension/package-lock.json'
      - 'vscode-extension/scripts/check-vsix-prebuilt-payload.js'
      - 'vscode-extension/scripts/check-vsix-prebuilt-payload.test.js'
      - 'vscode-extension/scripts/check-vsix-inventory-transition.js'
      - 'vscode-extension/scripts/check-vsix-inventory-transition.test.js'
      - 'vscode-extension/scripts/package-command.test.js'
      - 'vscode-extension/src/test/vsixPackageProjection.test.ts'
      - 'scripts/release_archive_members.py'
      - 'scripts/release_build_identity.py'
      - 'scripts/release_package_evidence.py'
      - 'scripts/release_terminal_manifest.py'
      - 'scripts/test_prepare_vsix_prebuilt_payload.py'
      - 'scripts/test_generate_release_topology.py'
      - 'scripts/test_release_build_identity.py'
      - 'scripts/test_release_topology_json.py'
      - 'schemas/release_build_identity.v1.schema.json'
      - 'schemas/release_build_identity_receipt.v1.schema.json'
      - 'docs/reference/downstream-dap-integrations.json'
      - 'vscode-extension/src/downloader.ts'
      - 'vscode-extension/scripts/check-vsix-inventory.js'
      - 'vscode-extension/scripts/vsix-inventory-baseline.json'
      - 'vscode-extension/package.json'
      - 'vscode-extension/scripts/reporter.js'
      - 'vscode-extension/scripts/toolchain-doctor.js'
      - 'vscode-extension/scripts/build_vsix_candidate_manifest.js'
      - 'vscode-extension/scripts/package-vsix.js'
      - 'vscode-extension/src/vsixPackageProjection.ts'
      - '.github/actions/setup-vscode-toolchain/action.yml'
      - '.github/workflows/vscode-prebuilt-payload-adapter.yml'
  workflow_dispatch: {}

concurrency:
  group: vscode-prebuilt-payload-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adapter:
    name: Prebuilt payload adapter tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repository Node authority
        uses: ./.github/actions/setup-vscode-toolchain
        with:
          install-dependencies: 'false'

      - name: Setup release schema Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned release schema dependencies
        run: python3 -m pip install -r scripts/requirements-release.txt

      - name: Run release evidence to VSIX adapter tests
        run: python3 -m unittest scripts.test_prepare_vsix_prebuilt_payload -v
