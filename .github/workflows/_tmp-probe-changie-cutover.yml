name: Temporary probe Changie release batching

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/_tmp-probe-changie-cutover.yml]

permissions:
  contents: read

env:
  CHANGIE_VERSION: "1.25.0"
  CHANGIE_LINUX_AMD64_SHA256: "f8c012073cd7865783d6db5123c59cdc006b2244309ce80243c8f6a1dda7aa5a"

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download branch and probe project batching
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          repo="${RUNNER_TEMP}/repo"
          receipt="${RUNNER_TEMP}/changie-probe.txt"
          mkdir -p "$repo"
          curl -fsSL "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${HEAD_SHA}" -o "${RUNNER_TEMP}/repo.tar.gz"
          tar -xzf "${RUNNER_TEMP}/repo.tar.gz" --strip-components=1 -C "$repo"

          asset="changie_${CHANGIE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/miniscruff/changie/releases/download/v${CHANGIE_VERSION}/${asset}" -o "${RUNNER_TEMP}/${asset}"
          echo "${CHANGIE_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/${asset}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}" changie

          cd "$repo"
          echo "FRAGMENT_COUNT=$(find .changes/unreleased -maxdepth 1 -type f -name '*.yaml' | wc -l)" >> "$receipt"
          for project in product vscode; do
            work="${RUNNER_TEMP}/${project}"
            cp -a "$repo" "$work"
            cd "$work"
            set +e
            "${RUNNER_TEMP}/changie" batch v9.9.9-probe --project "$project" >"${RUNNER_TEMP}/${project}.stdout" 2>"${RUNNER_TEMP}/${project}.stderr"
            rc=$?
            set -e
            {
              echo "PROJECT=${project}"
              echo "BATCH_RC=${rc}"
              echo "CHANGED_PATHS=$(git status --short | tr '\n' '|' | head -c 1600)"
              echo "VERSION_FILES=$(find .changes -maxdepth 3 -type f ! -path '*/unreleased/*' -print | sort | tr '\n' '|' | tail -c 1600)"
              echo "STDOUT=$(tr '\n' ' ' <"${RUNNER_TEMP}/${project}.stdout" | head -c 500)"
              echo "STDERR=$(tr '\n' ' ' <"${RUNNER_TEMP}/${project}.stderr" | head -c 500)"
            } >> "$receipt"
            cd "$repo"
          done
          cat "$receipt"

      - name: Upload probe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: changie-project-batch-probe
          path: ${{ runner.temp }}/changie-probe.txt
          retention-days: 7
          if-no-files-found: error
