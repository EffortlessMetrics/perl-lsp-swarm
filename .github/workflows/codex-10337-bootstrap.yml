name: codex-10337-bootstrap

on:
  push:
    branches:
      - "codex/10337-class-ast-schema"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Inventory class AST references
        shell: bash
        run: |
          set -euo pipefail
          echo 'NODE_KIND_CLASS'
          grep -RIn --include='*.rs' 'NodeKind::Class' crates || true
          echo 'CLASS_PATTERNS'
          grep -RIn --include='*.rs' -E 'Class[[:space:]]*\{' crates | head -n 300 || true
          echo 'FIELD_ID'
          grep -RIn --include='*.rs' -E 'enum FieldId|struct FieldId|FieldId::(BODY|ARGUMENT|ATTR)' crates/perl-ast crates/perl-parser-core | head -n 300 || true
