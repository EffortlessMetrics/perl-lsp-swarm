name: codex-10337-bootstrap

on:
  push:
    branches:
      - "codex/10337-class-ast-schema"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Inventory class AST references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== NodeKind::Class references ==='
          grep -RIn -C 3 --include='*.rs' 'NodeKind::Class' crates || true
          echo '=== direct Class constructors ==='
          grep -RIn -C 3 --include='*.rs' 'Class {' crates || true
          echo '=== parser class context ==='
          grep -RIn -C 3 --include='*.rs' -E 'in_class_body|parse_class' crates/perl-parser-core || true
