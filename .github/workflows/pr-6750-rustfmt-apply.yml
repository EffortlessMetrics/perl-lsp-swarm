name: PR 6750 rustfmt apply

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  rustfmt-apply:
    if: github.event.pull_request.number == 6750 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply exact rustfmt and remove this instrument
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          target_file='xtask/src/tasks/generate_semantic_snapshot.rs'
          workflow_file='.github/workflows/pr-6750-rustfmt-apply.yml'
          cargo fmt -p xtask
          git rm -- "$workflow_file"
          git add -- "$target_file"
          git diff --cached --check
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git commit -m 'style(xtask): apply repository rustfmt'
          git push origin "HEAD:${HEAD_BRANCH}"
