name: CI

# Tiered CI for perl-lsp (see tests/TAXONOMY.md)
# - PR smoke: fast feedback on every push (~1-2 min)
# - Merge gate: full validation on every PR push and push to main (~5-10 min)
# Cost: ~$0.05 per PR (smoke + merge gate; see #4675 for rationale)

on:
  pull_request:
    branches: [ main, master ]
    # Deliberately exclude `labeled` / `unlabeled` — labels are navigation and
    # classification metadata, not CI authority. `ready_for_review` and
    # `converted_to_draft` are kept because they change the draft-pr-check guard
    # behavior and must trigger CI.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group: {}
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit SHA for the dispatched subject
        required: true
        type: string
      head_sha:
        description: Exact head commit SHA; must equal the GitHub dispatch SHA
        required: true
        type: string

# Cancel in-progress runs for PR events on new pushes; let push/merge_group runs complete.
# The preflight SHA-staleness check provides additional skip logic for superseded SHAs.
# #16168: push runs group per commit SHA. Under the previous shared refs/heads/main
# group with cancel-in-progress: false, each newly queued main-push run cancelled the
# previously *pending* run in the group (76% of main-push runs were cancelled before
# scheduling a job). Per-SHA groups give every landed commit its own baseline run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  draft-pr-check:
    name: Draft PR guard
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      run_ci: ${{ steps.guard.outputs.run_ci }}
      # #2266: true when the PR diff touches a published facade crate surface
      # or the committed public-API baseline set. Consumed by the
      # public-api-pr / semver-pr compatibility rails below.
      api_scope: ${{ steps.guard.outputs.api_scope }}
    steps:
      - name: Checkout for docs-only detection
        if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Decide whether full CI should run
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
            # Off-PR events skip the API rails by their job-level event gate.
            echo "api_scope=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Non-PR event detected — running full CI"
          elif [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "run_ci=false" >> "$GITHUB_OUTPUT"
            # Drafts are excluded by run_ci; ready_for_review recomputes scope.
            echo "api_scope=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Draft PR CI posture"
              echo
              echo "- \`Rust formatting\` and \`Conflict marker check\` still run against this exact draft head."
              echo "- Other CI jobs are intentionally deferred while the PR remains draft."
              echo "- A skipped job is not verification. Mark the PR ready for review to run the full merge-required suite."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Draft PR detected — running rustfmt and conflict-marker feedback; deferring full CI until ready for review"
          else
            base_sha="${{ github.event.pull_request.base.sha }}"
            pr_number="${{ github.event.pull_request.number }}"
            pr_head_ref="refs/remotes/pr/${pr_number}/head"

            if ! git fetch --no-tags --depth=1 origin "${base_sha}" "pull/${pr_number}/head:${pr_head_ref}"; then
              echo "run_ci=true" >> "$GITHUB_OUTPUT"
              # Fail open like run_ci: an unknowable diff is treated as
              # API-affecting so the compatibility rails never report a green
              # scoped-noop over a surface they could not inspect.
              echo "api_scope=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Could not fetch PR diff refs; running full CI fail-safe"
              exit 0
            fi

            mapfile -t changed_files < <(git diff --name-only "${base_sha}" "${pr_head_ref}")
            if [ "${#changed_files[@]}" -eq 0 ]; then
              echo "run_ci=true" >> "$GITHUB_OUTPUT"
              # Empty diffs contain no API surface; scoped-noop is honest here.
              echo "api_scope=false" >> "$GITHUB_OUTPUT"
              echo "::notice::No changed files detected — running full CI fail-safe"
              exit 0
            fi

            # #2266: auto-select the public-API/semver compatibility rails from
            # the pull request's own changed-file set, read through the REST
            # files endpoint. A two-dot git diff against the base tip silently
            # inherits facade commits other lanes already merged while this
            # branch sat open (observed on #12850), and a merge-base three-dot
            # diff needs history a depth=1 fetch deliberately lacks — so the
            # exact PR file list is both truthful and cheap here. Scope stays
            # job-level (ci.yml excludes `labeled`; workflow-level paths
            # filters leave required contexts unreported), manual label
            # widening remains on ci-nightly.yml pull_request(labeled).
            api_scope="$(PR_NUMBER="${pr_number}" REPOSITORY="${GITHUB_REPOSITORY}" GH_TOKEN="${GITHUB_TOKEN}" \
            python3 - "${changed_files[@]}" <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          repo = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          gh_token = os.environ.get("GH_TOKEN", "")

          # #2266 scope authority: the committed baselines themselves. Any crate whose
          # public items flow into a facade baseline via re-export (perl-lsp-rs-core,
          # perl-parser-core, perl-workspace, perl-ast, ...) derives its crates/<dir>/
          # prefix from the perl_X:: tokens in .ci/public-api-baselines/*.txt, so the
          # selector tracks the real re-export closure without maintaining a second
          # hand-written list beside the baselines. The crates the rails check
          # directly come from the same single list the recipes read
          # (.ci/public-api-baselines/ratchet-crates.txt, #14607), so this
          # selector cannot disagree with `just public-api-check`.
          STATIC_PREFIXES = (
              ".ci/public-api-baselines/",
          )
          RATCHET_LIST = os.path.join(".ci", "public-api-baselines", "ratchet-crates.txt")
          TOKEN_RE = re.compile("(?<![A-Za-z0-9_])perl_[a-z0-9_]+(?=::)")


          def ratchet_crates():
              try:
                  lines = open(RATCHET_LIST, encoding="utf-8").read().splitlines()
              except OSError as error:
                  print("::error::cannot read " + RATCHET_LIST + ": " + str(error), file=sys.stderr)
                  raise SystemExit(1)
              crates = (line.split("#", 1)[0].strip() for line in lines)
              crates = tuple(crate for crate in crates if crate)
              if not crates:
                  # An empty list would silently shrink the api scope to the
                  # baseline directory alone; publish-manifest-check rejects
                  # that state, so fail here too rather than under-select.
                  print("::error::" + RATCHET_LIST + " lists no crates", file=sys.stderr)
                  raise SystemExit(1)
              if len(crates) != len(set(crates)):
                  print("::error::" + RATCHET_LIST + " lists duplicate crates", file=sys.stderr)
                  raise SystemExit(1)
              return crates


          def derive_prefixes():
              found = set(STATIC_PREFIXES)
              for crate in ratchet_crates():
                  found.add("crates/" + crate + "/")
              baseline_dir = os.path.join(".ci", "public-api-baselines")
              try:
                  names = os.listdir(baseline_dir)
              except OSError:
                  return tuple(sorted(found))
              for name in names:
                  if not name.endswith(".txt") or name == "ratchet-crates.txt":
                      continue
                  path = os.path.join(baseline_dir, name)
                  try:
                      content = open(path, encoding="utf-8").read()
                  except OSError:
                      continue
                  for token in TOKEN_RE.findall(content):
                      crate_dir = "crates/" + token.replace("_", "-") + "/"
                      found.add(crate_dir)
              return tuple(sorted(found))

          def emit(value):
              print(value)
              raise SystemExit(0)


          def matches(path):
              return any(
                  path.startswith(prefix) or prefix.rstrip("/") == path for prefix in prefixes
              )


          prefixes = derive_prefixes()
          page = 1
          try:
              while True:
                  url = (
                      f"https://api.github.com/repos/{repo}/pulls/{pr_number}/files"
                      f"?per_page=100&page={page}"
                  )
                  headers = {"Accept": "application/vnd.github+json"}
                  if gh_token:
                      headers["Authorization"] = "Bearer " + gh_token
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=30) as response:
                      batch = json.load(response)
                  if not isinstance(batch, list):
                      raise ValueError("unexpected files payload")
                  for entry in batch:
                      if matches(entry.get("filename") or ""):
                          emit("true")
                  if len(batch) < 100:
                      break
                  page += 1
          except Exception as exc:
              # Unauthenticated or rate-limited API probe on shared runner egress.
              # Fall back to the local two-dot diff scan; that over-approximates
              # scope right after base-tip movement but never under-reports an
              # affected PR.
              print(
                  f"::warning::Could not list PR files ({exc}); using changed-file fallback",
                  file=sys.stderr,
              )
              emit("true" if any(matches(arg) for arg in sys.argv[1:]) else "false")

          emit("false")
          PY
            )"
            echo "api_scope=${api_scope}" >> "$GITHUB_OUTPUT"
            if [ "${api_scope}" = "true" ]; then
              echo "::notice::API-surface change detected — public-api-pr / semver-pr rails will run"
            else
              echo "::notice::No API-surface change — API rails report green scoped-noop (#2266)"
            fi

            docs_only=true
            for path in "${changed_files[@]}"; do
              case "$path" in
                docs/*|*.md|vscode-extension/media/*|vscode-extension/snippets/*|tree-sitter-perl/examples/*)
                  ;;
                *)
                  docs_only=false
                  break
                  ;;
              esac
            done

            if [ "$docs_only" = "true" ]; then
              # The policy shard includes the generated non-Rust inventory
              # freshness gate. Keep the existing required CI contexts active
              # for docs/assets-only changes so tracked-file additions and
              # removals cannot bypass that check.
              echo "run_ci=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Docs/assets-only PR detected — running the policy shard for generated-inventory freshness"
            else
              echo "run_ci=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Non-draft PR with code/config changes — running merge-gate (pr-smoke, conflict-markers, shards, UX tests); supersede protection via preflight-latest-check (#1484)"
            fi
          fi

  # ── Preflight: skip superseded SHAs to save cost ─────────────────────
  preflight-latest-check:
    name: Preflight — is this SHA latest?
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: draft-pr-check
    if: needs.draft-pr-check.outputs.run_ci == 'true'
    outputs:
      is_latest: ${{ steps.check.outputs.is_latest }}
    steps:
      - name: Check if this SHA is latest on the ref
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          CURRENT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The freshness optimization (skip CI for superseded SHAs) is only
          # safe for push events on same-repo refs. For pull_request and
          # merge_group events, github.head_ref is attacker-controlled: a fork
          # author can name their branch "main" so the ls-remote resolves the
          # upstream branch, making every fork PR look "superseded" and
          # silently skipping all gated jobs (#5981).
          if [ "$EVENT_NAME" != "push" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR/merge_group event — freshness optimization bypassed for safety ($CURRENT)"
            exit 0
          fi

          LATEST=$(git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" "refs/heads/${BRANCH}" 2>/dev/null | awk '{print $1}')
          if [ -z "$LATEST" ] || [ "$LATEST" = "$CURRENT" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This SHA ($CURRENT) is latest on $BRANCH — running full CI"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Superseded by $LATEST — skipping remaining jobs to save cost"
          fi

  # Resolve platform widening once on Linux so the Windows job is allocated
  # only when ci-scope identifies a known portability seam.
  platform-overrides:
    name: CI scope platform overrides
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: [draft-pr-check, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    outputs:
      windows_runner: ${{ steps.scope.outputs.windows_runner }}
      windows_test_crates: ${{ steps.scope.outputs.windows_test_crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable (master)
        with:
          toolchain: 1.95.0
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-platform-scope-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      - name: Classify platform overrides
        id: scope
        shell: bash
        env:
          SUBJECT_BASE_SHA: ${{ inputs.base_sha || '' }}
          SUBJECT_HEAD_SHA: ${{ inputs.head_sha || '' }}
        run: |
          set -euo pipefail
          cargo run -p xtask --locked -- ci-subject \
            --base-sha "$SUBJECT_BASE_SHA" \
            --head-sha "$SUBJECT_HEAD_SHA" \
            --receipt "$RUNNER_TEMP/ci-subject.json"
          cargo run -p xtask --locked -- ci-scope \
            --subject "$RUNNER_TEMP/ci-subject.json" \
            --format json > "$RUNNER_TEMP/ci-scope.json"
          schema_version=$(jq -r '.schema_version' "$RUNNER_TEMP/ci-scope.json")
          if [ "$schema_version" != "2" ]; then
            echo "::error::ci-scope schema_version=$schema_version, expected 2 (producer/consumer out of sync)"
            exit 1
          fi
          if ! windows_runner=$(jq -r 'if (.platform_overrides | has("windows_runner") | not) then error("missing field: .platform_overrides.windows_runner") elif .platform_overrides.windows_runner == null then error("null field: .platform_overrides.windows_runner") else .platform_overrides.windows_runner end' "$RUNNER_TEMP/ci-scope.json"); then
            echo "::error::ci-scope is missing .platform_overrides.windows_runner (refusing null->true default)"
            exit 1
          fi
          windows_test_crates=$(jq -r '.platform_overrides.windows_test_crates[]? | "-p \(.)"' "$RUNNER_TEMP/ci-scope.json" | paste -sd' ' -)
          case "$windows_runner" in
            true|false) ;;
            *) echo "::error::ci-scope returned invalid windows_runner=$windows_runner"; exit 1 ;;
          esac
          echo "windows_runner=$windows_runner" >> "$GITHUB_OUTPUT"
          echo "windows_test_crates=$windows_test_crates" >> "$GITHUB_OUTPUT"

  windows-platform-smoke:
    name: Windows platform smoke
    runs-on: windows-2025
    timeout-minutes: 20
    needs: [platform-overrides]
    if: needs.platform-overrides.outputs.windows_runner == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable (master)
        with:
          toolchain: 1.95.0
      # #2908: this lane builds only the ci-scope-selected crate subset
      # ($WINDOWS_TEST_CRATES) directly into the cached target tree, so its
      # cache key must carry the scope-crate-set hash, not Cargo.lock alone —
      # otherwise a 2-crate seam build and a 5-crate seam build restore and
      # churn one workspace-wide entry. The hash is derived before rust-cache
      # runs from the upstream platform-overrides output, canonicalized by
      # scripts/ci/scope_cache_key.py (sorted deduped crate names, SHA-256):
      # force-pushes that move neither lockfile nor set keep a byte-identical
      # key, and unrelated scopes never invalidate each other's entries.
      # rust-cache's restore prefix keeps the explicit Cargo.lock and scope
      # hashes together with its runner, Rust, and environment identity. Its
      # automatic manifest digest is not part of that fallback prefix, so this
      # does not claim identical Cargo.toml state. PRs restore only; main and
      # master pushes may save the scoped entry. Ready-tier lanes keep their
      # workspace-wide keys.
      - name: Derive scope-aware cache key component
        id: windows-scope-key
        shell: bash
        env:
          WINDOWS_TEST_CRATES: ${{ needs.platform-overrides.outputs.windows_test_crates }}
        run: |
          set -euo pipefail
          python_bin="$(command -v python3 || command -v python)"
          scope_hash="$("$python_bin" scripts/ci/scope_cache_key.py --require-non-empty --package-args "$WINDOWS_TEST_CRATES")"
          echo "scope-hash=$scope_hash" >> "$GITHUB_OUTPUT"
          echo "windows scope crates: ${WINDOWS_TEST_CRATES:-<none>}"
          echo "windows scope cache-key hash: $scope_hash"
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-windows-platform-${{ hashFiles('Cargo.lock') }}-${{ steps.windows-scope-key.outputs.scope-hash }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      - name: Run Windows portability smoke
        shell: bash
        env:
          WINDOWS_TEST_CRATES: ${{ needs.platform-overrides.outputs.windows_test_crates }}
        # Keep the existing library smoke execution, then compile the
        # Unix-only integration target on Windows so its cfg boundary cannot
        # silently bit-rot. Unix remains the execution authority for the
        # Bash/chmod smoke.
        run: |
          cargo test $WINDOWS_TEST_CRATES --locked --lib
          cargo test -p xtask --test release_artifact_size_smoke_script --locked --no-run
          if [[ " $WINDOWS_TEST_CRATES " == *" -p perl-ci-hygiene "* ]]; then
            cargo test -p perl-ci-hygiene --locked --bin perl-ci-hygiene process::tests::
          fi

  # ── Conflict-marker guard: <1s, no toolchain needed ─────────────────
  # Prevents committed conflict markers reaching master (see #7183).
  # Two incidents on 2026-04-28 each cost 1-3h of orchestrator + builder time.
  # Repository-owned cheap exact-head contracts (#3987). Advisory in C1;
  # existing required checks remain unchanged until parity is proven.
  repository-contract:
    name: Repository Contract (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    needs: [draft-pr-check, preflight-latest-check]
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.draft-pr-check.outputs.run_ci == 'true' &&
      needs.preflight-latest-check.outputs.is_latest == 'true'
    env:
      CONTRACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.CONTRACT_HEAD }}
          fetch-depth: 0
      - name: Install portable contract tools
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/aquaproj/aqua/v2/cmd/aqua@v2.57.0
          export PATH="$RUNNER_TEMP/bin:$PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          bash scripts/tools/aqua-doctor.sh
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-contract-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      - name: Run Repository Contract
        env:
          SUBJECT_BASE_SHA: ${{ inputs.base_sha || '' }}
          SUBJECT_HEAD_SHA: ${{ inputs.head_sha || '' }}
        run: |
          set +e
          cargo run -p xtask --locked -- ci-subject \
            --base-sha "$SUBJECT_BASE_SHA" \
            --head-sha "$SUBJECT_HEAD_SHA" \
            --receipt target/receipts/ci-subject.json
          subject_status=$?
          if [ "$subject_status" -ne 0 ]; then
            exit "$subject_status"
          fi
          cargo run -p xtask --locked -- ci-contract \
            --subject target/receipts/ci-subject.json \
            --receipt target/receipts/ci-contract.json \
            --summary target/receipts/ci-contract.md
          status=$?
          set -e
          if [ "$status" -eq 1 ] && [ -f target/receipts/ci-contract.json ]; then
            contract_status="$(jq -r '.status // empty' target/receipts/ci-contract.json 2>/dev/null || true)"
            if [ "$contract_status" = "POLICY_FINDING" ]; then
              echo "Repository Contract reported advisory policy findings; receipt is authoritative."
              exit 0
            fi
          fi
          exit "$status"
      - name: Upload Repository Contract receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: repository-contract-${{ env.CONTRACT_HEAD }}
          path: |
            target/receipts/ci-contract.json
            target/receipts/ci-contract.md
            target/receipts/ci-subject.json
            target/receipts/repo-hygiene.json
            target/receipts/repo-hygiene.md
            target/ci-contract/changed-files.txt
          if-no-files-found: warn
          retention-days: 7

  conflict-markers:
    name: Conflict marker check
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [draft-pr-check, preflight-latest-check]
    # `preflight-latest-check` is intentionally skipped for drafts, and GitHub
    # reports a skipped need's outputs as empty strings. `always()` carries the
    # evaluation past that skipped need while the disjunction routes each event
    # class:
    # - draft PR: run_ci is 'false' and the skipped preflight's is_latest is '',
    #   so the needs branch is false and only the draft branch fires.
    # - non-draft PR: run_ci='true' and is_latest='true'; the needs branch fires.
    # - merge_group and push: the draft branch is false (`pull_request.draft` is
    #   unset), so the needs branch is the only route; it fires because
    #   is_latest='true' unless a superseded push SHA is skipped.
    # Dropping either branch silently removes draft or push/merge_group runs;
    # xtask/tests/draft_pr_feedback_contract.rs asserts both branches.
    if: >-
      always() &&
      (
        (github.event_name == 'pull_request' && github.event.pull_request.draft == true) ||
        (
          needs.draft-pr-check.outputs.run_ci == 'true' &&
          needs.preflight-latest-check.outputs.is_latest == 'true'
        )
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
      - name: Check for conflict markers
        run: |
          matches=$(git ls-files -z | xargs -0 grep -lP '^(<{7} |>{7} |={7}$)' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "❌ Conflict markers found in committed files:"
            echo "$matches"
            echo ""
            echo "Run: grep -rn -P '^(<{7} |>{7} |={7}\$)' \$(git ls-files)"
            echo "to locate exact lines, then resolve and re-commit."
            exit 1
          fi
          echo "✅ No conflict markers found"

  # ── Public-API compatibility rails (#2266) ───────────────────────────
  # Auto-run the nightly public-api/semver machinery on PRs that actually
  # touch a published facade surface or `.ci/public-api-baselines/`, closing
  # the label-only gating gap (issue #2266): humans forget labels and bot
  # authors cannot set them. Scope selection happens inside the draft-pr-check
  # guard via job-level conditions so non-API PRs settle as green scoped-noops
  # instead of an always-pending context (REQUIRED_STYLE_SELF_FILTERED /
  # always-or-scoped-noop convention in .ci/policies/required-checks.toml);
  # ci.yml deliberately excludes the `labeled` event, so manual widening keeps
  # using the ci-nightly.yml pull_request(labeled) label gates.
  # Cost: ~1 min of detection-only work when no facade path changes; full
  # cargo-public-api / cargo-semver-checks runtime only where it matters.
  public-api-pr:
    name: Public API Surface (facade PR)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [draft-pr-check, preflight-latest-check]
    if: >-
      github.event_name == 'pull_request' &&
      needs.draft-pr-check.outputs.run_ci == 'true' &&
      needs.preflight-latest-check.outputs.is_latest == 'true'
    permissions:
      contents: read
    steps:
      - name: Scoped no-op summary
        # A hard-failing ratchet must still settle green on out-of-scope diffs
        # so a future ruleset promotion resolves cleanly (issue #2266).
        if: needs.draft-pr-check.outputs.api_scope != 'true'
        shell: bash
        run: |
          {
            echo "### Public API Surface scope"
            echo ""
            echo "- api_scope: \`false\`"
            echo "- verdict: scoped-noop — no facade crate or .ci/public-api-baselines change"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::public-api scoped-noop: no facade crate or baseline surface changed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.draft-pr-check.outputs.api_scope == 'true'
        with:
          persist-credentials: false

      - name: Install Rust
        if: needs.draft-pr-check.outputs.api_scope == 'true'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable (master)
        with:
          toolchain: 1.95.0

      # cargo-public-api builds rustdoc JSON and requires a nightly toolchain;
      # without one the generation fails and (pre-#12861) the recipe silently
      # diffed the empty surface as phantom API removals. The channel floats
      # deliberately: the printing semantics live in the pinned cargo-public-api
      # 0.50.1 (identical output verified across nightly 2026-07-20 and
      # 2026-08-26), the recipe fails closed on instrument errors, and it now
      # records rustc +nightly --version as run provenance. A hard pin would
      # need rustup sysroot symlinks (official names are not linkable), which
      # is more fragile than the slow drift risk it addresses (#12870 review).
      - name: Install nightly toolchain (cargo-public-api rustdoc JSON)
        if: needs.draft-pr-check.outputs.api_scope == 'true'
        run: rustup toolchain install nightly --profile minimal

      - name: Cache cargo dependencies
        if: needs.draft-pr-check.outputs.api_scope == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: public-api-${{ hashFiles('Cargo.lock') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Install cargo-public-api
        if: needs.draft-pr-check.outputs.api_scope == 'true'
        run: cargo install cargo-public-api --locked --version 0.50.1

      - name: Install just
        if: needs.draft-pr-check.outputs.api_scope == 'true'
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff  # v2.87.8
        with:
          tool: just

      - name: Prove the surface filter folds (filter unit probes)
        if: needs.draft-pr-check.outputs.api_scope == 'true'
        # The shared both-sides fold owns convergence; prove it before the
        # comparison that depends on it. Needs only awk, no nightly.
        run: python3 scripts/ci/test_public_api_filter.py

      - name: Check public API surface (.ci/public-api-baselines/ratchet-crates.txt)
        if: needs.draft-pr-check.outputs.api_scope == 'true'
        # Uses cargo public-api --simplified to omit blanket-impl noise; baselines in .ci/public-api-baselines/
        run: just public-api-check

  semver-pr:
    name: Semver Compatibility (facade PR)
    # Advisory per #2266: cargo-semver-checks stays continue-on-error until
    # baseline noise-confidence is established; promote to a blocking verdict
    # with the same evidence window that hardens public-api-pr.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [draft-pr-check, preflight-latest-check]
    if: >-
      github.event_name == 'pull_request' &&
      needs.draft-pr-check.outputs.run_ci == 'true' &&
      needs.preflight-latest-check.outputs.is_latest == 'true'
    permissions:
      contents: read
    steps:
      - name: Scoped no-op summary
        if: needs.draft-pr-check.outputs.api_scope != 'true'
        shell: bash
        run: |
          {
            echo "### Semver Compatibility scope"
            echo ""
            echo "- api_scope: \`false\`"
            echo "- verdict: scoped-noop — no facade crate or .ci/public-api-baselines change"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::semver scoped-noop: no facade crate or baseline surface changed."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.draft-pr-check.outputs.api_scope == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        if: needs.draft-pr-check.outputs.api_scope == 'true'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable (master)
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        if: needs.draft-pr-check.outputs.api_scope == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: semver-${{ hashFiles('Cargo.lock') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Install cargo-semver-checks
        if: needs.draft-pr-check.outputs.api_scope == 'true'
        run: cargo install cargo-semver-checks --version 0.47.0 --locked

      - name: Fetch release tags from canonical repo
        if: needs.draft-pr-check.outputs.api_scope == 'true'
        # Release tags live on EffortlessMetrics/perl-lsp; swarm origin has none
        # (same wiring as the meta shard).
        run: |
          git fetch --force --tags https://github.com/EffortlessMetrics/perl-lsp.git '+refs/tags/v*:refs/tags/v*'

      - name: Determine baseline tag
        id: baseline
        if: needs.draft-pr-check.outputs.api_scope == 'true'
        run: |
          BASELINE=$(git tag | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1) || true
          if [ -z "${BASELINE:-}" ]; then
            echo "::warning::No v*.*.* release tags on this checkout; skipping semver comparison"
            echo "baseline=none" >> "$GITHUB_OUTPUT"
          else
            echo "baseline=${BASELINE}" >> "$GITHUB_OUTPUT"
            echo "Using baseline: ${BASELINE}"
          fi

      - name: Check API-ratcheted crates against baseline
        if: needs.draft-pr-check.outputs.api_scope == 'true' && steps.baseline.outputs.baseline != 'none'
        env:
          SEMVER_BASELINE: ${{ steps.baseline.outputs.baseline }}
        # The crate set is .ci/public-api-baselines/ratchet-crates.txt, the same
        # list `just semver-check-all` and `just public-api-check` read (#14607).
        run: |
          mapfile -t crates < <(sed -e 's/#.*$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' .ci/public-api-baselines/ratchet-crates.txt | grep -v '^$')
          if [ "${#crates[@]}" -eq 0 ]; then
            echo "::error::.ci/public-api-baselines/ratchet-crates.txt lists no crates; refusing a vacuous semver pass"
            exit 1
          fi
          if [ -n "$(printf '%s\n' "${crates[@]}" | sort | uniq -d)" ]; then
            echo "::error::.ci/public-api-baselines/ratchet-crates.txt lists a crate twice; fix the list rather than checking it twice"
            exit 1
          fi
          for crate in "${crates[@]}"; do
            if cargo semver-checks check-release -p "${crate}" \
              --baseline-rev "${SEMVER_BASELINE}"; then
              echo "semver: ${crate} compatible"
            else
              echo "::warning::Breaking changes detected in ${crate}"
            fi
          done

  # ── PR Smoke: advisory fast feedback for every PR ────────────────────
  # ADVISORY (continue-on-error): this lane runs the `pr-fast` xtask tier, whose
  # gates (fmt, conflict markers, publish/layer checks, and unit_routed_full)
  # overlap hosted shards. Hosted formatter authority is dedicated
  # `Rust formatting` plus required Rust Small (#9959/#9127); PR Smoke `fmt`
  # remains advisory overlap owned by #9166. Because pr-fast runs the unit tests
  # in one combined `unit_routed_full` lane, it is the flakier of the two and has
  # false-reddened green PRs (e.g. PR #3321: unit_routed_full exit 101 while all
  # seven CI Gate shards passed). It is not a required check and no longer gates
  # the CI Gate aggregate (removed from merge-gate `needs`). Kept advisory for its
  # combined-run signal + Codecov test-results upload; full removal is tracked in
  # the CI lean-down consolidation issue.
  pr-smoke:
    name: PR Smoke (Fast Feedback, advisory)
    runs-on: ubuntu-24.04
    # Leave setup headroom plus enough room for the inner 60m watchdog to return
    # its status and for the always-run receipt/telemetry steps to finish.
    # #15915: unit_routed_full alone budgets 1500s with one timeout retry
    # (up to 50m worst case) plus 6-16m cold-cache compile and sibling pr-fast
    # gates; the former 45m bound killed healthy runs (exit 124) with all
    # sub-gates green. 60m covers the observed healthy upper bound with
    # headroom while staying inside the 75m GitHub job envelope (15m left for
    # setup plus always-run receipt/telemetry). unit_routed_full stays in the
    # pr-fast envelope because no required merge-gate shard executes the
    # scope-aware --tests proof (shards run --lib only); splitting it out
    # without a new required lane would drop required coverage.
    timeout-minutes: 75
    # Advisory: a pr-fast flake must not present as a hard red on an otherwise
    # green PR. The deterministic base (CI Gate shards + the two required lanes)
    # is the real gate.
    continue-on-error: true
    needs: [draft-pr-check, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    # #11943 bound arm: the tier's single CARGO_TARGET_DIR measured 83 GiB on
    # cold-cache branches (runs 32697324730 / 32697144932) against ~83-84 GiB of
    # starting headroom, filling /dev/root to 100% mid-link (ENOSPC -> ld
    # SIGBUS). Full DWARF (dev-profile default debuginfo=2 across every routed
    # integration-test binary) dominates that footprint; line-tables-only keeps
    # file/line backtraces while cutting the bulk, matching the repo-blessed
    # [profile.agent] footprint setting. Scoped to this advisory lane only:
    # required merge-gate shards keep full debuginfo proof and no unit is
    # skipped or weakened — identical tests run either way.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # #15528: one stable, cache-aligned target dir. The former per-run
      # `pr-smoke-${run_id}-${run_attempt}` path (unique per run and attempt)
      # made every run a full cold build, so the 45m watchdog reliably killed
      # the tier mid-compile. `target` is exactly the tree the rust-cache step
      # below restores and saves, so the lane warms like every other ci.yml
      # job. The #11943 bounds still hold: line-tables-only debuginfo above,
      # plus the preflight/post-run disk guards, which probe this same
      # filesystem (hosted `df` shows /mnt on /dev/root, so the old /mnt
      # redirection was capacity-neutral; it only guaranteed a cold tree).
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
          # Fetch full history so the immutable subject can validate exact event ancestry.
          fetch-depth: 0
          # release_history --verify-git resolves every release tag locally.
          fetch-tags: true

      - name: Fetch release tags from canonical repo
        run: |
          # Release tags live on EffortlessMetrics/perl-lsp; swarm origin has none.
          git fetch --force --tags https://github.com/EffortlessMetrics/perl-lsp.git '+refs/tags/v*:refs/tags/v*'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install just
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff  # v2.87.8
        with:
          tool: just

      # #15528: dedicated cache family for this lane. The shared `ci-gate-`
      # entry is seeded by the merge-gate shards at full debuginfo, whose dep
      # artifacts never fingerprint-match this lane's line-tables-only env, and
      # both jobs saving under one key would nondeterministically overwrite
      # each other's newest main entry. A stable shared key (no lockfile hash —
      # rust-cache already folds the lockfile into its internal keying,
      # docs/ci/cache-policy.md) lets the push-to-main run of this job seed
      # matching line-tables-only artifacts that PR and merge-group runs
      # restore. Save authority is unchanged: candidate events restore only.
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: pr-smoke
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      # #15528 hardening: the dedicated cache family restores the whole
      # target/ tree of the seeding main run, including receipts. Clear them so
      # a run killed by the watchdog can never upload a stale receipt that
      # reads as this run's verdict (same hygiene as the shard job's "Clear
      # restored inventory evidence").
      - name: Clear restored PR-fast receipts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/receipts
          mkdir -p target/receipts/logs

      # The digest step below runs under `always()`, so it must never find a
      # receipt this run did not write. `target/` is restored from a shared
      # rust-cache (#12085), and `xtask gates` writes `receipt.json` only after
      # the whole plan returns -- so any failure before that point (a degraded
      # runner caught by the guard below, a timeout, a failed warm build) would
      # otherwise leave an unrelated SHA's receipt in place for the digest to
      # publish as this run's failure, `first_failure` and all. Rendering the
      # wrong test as the cause is worse than rendering nothing, which is the
      # whole premise of the digest. Cleared here, ahead of everything that can
      # fail, rather than inside the step that produces them.
      - name: Clear cache-restored PR-fast receipt surfaces (#12085)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/receipts/receipt.json target/receipts/logs \
            target/receipts/pr-fast-failure-digest.md \
            || { echo "::error::cannot clear cache-restored PR-fast receipt surfaces (#12085); refusing to run over a possibly stale receipt"; exit 1; }
          mkdir -p target/receipts

      # #11943 visible arm (pre-build): refuse to start the tier on a runner
      # whose free headroom is below the measured worst-case need, naming the
      # path in an explicit resource-exhaustion diagnostic. A degraded runner
      # must fail here in seconds instead of dying inside `ld` with SIGBUS
      # disguised as a compile failure 40 minutes in.
      - name: Pre-flight disk budget guard
        shell: bash
        run: |
          python3 scripts/ci/pr_smoke_disk_guard.py preflight \
            --workspace-path . \
            --target-dir "${CARGO_TARGET_DIR:-target}"

      - name: Warm xtask
        run: cargo build -p xtask --locked

      - name: Resolve immutable CI subject
        env:
          SUBJECT_BASE_SHA: ${{ inputs.base_sha || '' }}
          SUBJECT_HEAD_SHA: ${{ inputs.head_sha || '' }}
        run: |
          "$CARGO_TARGET_DIR/debug/xtask" ci-subject \
            --base-sha "$SUBJECT_BASE_SHA" \
            --head-sha "$SUBJECT_HEAD_SHA" \
            --receipt target/receipts/ci-subject.json

      - name: Determine inline-completion warm-up scope
        id: inline-completion-scope
        shell: bash
        env:
          PR_SMOKE_RUN_ID: ${{ github.run_id }}
          PR_SMOKE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          scope_json="${RUNNER_TEMP}/pr-smoke-ci-scope-${PR_SMOKE_RUN_ID}-${PR_SMOKE_RUN_ATTEMPT}.json"
          warm_inline_completion=true

          if ! "$CARGO_TARGET_DIR/debug/xtask" ci-scope --subject target/receipts/ci-subject.json --format json > "$scope_json"; then
            echo "::warning::ci-scope failed; retaining inline-completion warm-up (fail-closed)"
          elif ! diff_class="$(jq -er '
            if type != "object" or (.diff_class | type) != "string" or
               (.direct_crates | type) != "array" or
               (any(.direct_crates[]?; type != "object" or (.name | type) != "string")) or
               (.reverse_dep_closure | type) != "array" or
               (any(.reverse_dep_closure[]?; type != "object" or (.name | type) != "string")) or
               (.architecture_wideners | type) != "array" or
               (any(.architecture_wideners[]?; type != "object" or (.name | type) != "string")) or
               (.selected_lanes | type) != "array" or
               (any(.selected_lanes[]?; type != "object" or (.scope | type) != "array" or any(.scope[]?; type != "string")))
            then error("invalid ci-scope JSON")
            else .diff_class
            end
          ' "$scope_json")"; then
            echo "::warning::ci-scope returned invalid JSON; retaining inline-completion warm-up (fail-closed)"
          else
            case "$diff_class" in
              prose_only|docs_as_code|ci_config)
                warm_inline_completion=false
                ;;
              code|mixed)
                if ! relevant="$(jq -r '
                  [
                    .direct_crates[]?.name,
                    .reverse_dep_closure[]?.name,
                    .architecture_wideners[]?.name,
                    .selected_lanes[]?.scope[]?
                  ]
                  | any(. == "perl-lsp-rs" or . == "perl-lsp-rs-core")
                ' "$scope_json")"; then
                  echo "::warning::ci-scope package analysis failed; retaining inline-completion warm-up (fail-closed)"
                elif [ "$relevant" = "false" ]; then
                  warm_inline_completion=false
                fi
                ;;
              *)
                echo "::warning::ci-scope returned unknown diff_class '$diff_class'; retaining inline-completion warm-up (fail-closed)"
                ;;
            esac
          fi

          echo "diff_class=${diff_class:-unknown}"
          echo "warm_inline_completion=$warm_inline_completion"
          echo "warm_inline_completion=$warm_inline_completion" >> "$GITHUB_OUTPUT"

      # Build the two cold inline-completion test targets before the independent
      # pr-fast gates start when ci-scope identifies a relevant package change.
      # The gates retain their separate 150s budgets and still execute the tests;
      # scope failure intentionally keeps this warm-up enabled.
      - name: Warm inline-completion test targets
        if: steps.inline-completion-scope.outputs.warm_inline_completion == 'true'
        run: |
          cargo test -p perl-lsp-rs --locked --test lsp_inline_completion_registration_tests --no-run
          cargo test -p perl-lsp-rs-core --locked --lib inline_completion --no-run

      - name: Run PR-fast via shared xtask gate runner
        run: |
          set +e
          # Gate commands reuse the shared CARGO_TARGET_DIR=target build warmed
          # by "Warm xtask" and the cache restore above (#15528).
          # Gate receipts intentionally stay at target/receipts for upload steps.
          echo "PR-fast timeout policy: GitHub job 75m, outer runner watchdog 60m, per-gate timeouts recorded in target/receipts/receipt.json"
          timeout --signal=TERM --kill-after=60s 3600s "$CARGO_TARGET_DIR/debug/xtask" gates --tier pr-fast --subject target/receipts/ci-subject.json --receipt
          status=$?
          case "$status" in
            124)
              echo "::error::PR-fast hit the 60m runner watchdog before xtask produced a final receipt"
              ;;
            137|143)
              echo "::error::PR-fast was cancelled by the runner or process group (exit $status)"
              ;;
          esac
          exit "$status"

      - name: Capture PR-fast disk pressure
        if: always()
        shell: bash
        run: |
          # #11943: capture setup and gate failures, including ENOSPC -> ld SIGBUS,
          # before the runner is discarded. This is advisory evidence only.
          set +e
          mkdir -p target/receipts/logs
          {
            echo "== $(date -u '+%Y-%m-%dT%H:%M:%SZ') PR-fast disk pressure snapshot =="
            echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR:-<unset>}"
            echo "GITHUB_SHA=${GITHUB_SHA:-<unset>}"
            echo "GITHUB_RUN_ID=${GITHUB_RUN_ID:-<unset>}"
            echo "GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT:-<unset>}"
            df -h . "${CARGO_TARGET_DIR:-target}" || true
            timeout --signal=TERM --kill-after=5s 30s \
              bash -c 'du -h --max-depth=1 -- "$1" 2>/dev/null | sort -rh | head -n 20' \
              _ "${CARGO_TARGET_DIR:-target}" || true
          } >> target/receipts/logs/pr-fast-disk-pressure.log || true

      # #11943 visible arm (post-run): classify gate-log exhaustion signatures
      # into an explicit annotation naming the filled path family. Advisory
      # only — the original gate outcome is preserved; this step never exits
      # non-zero.
      - name: Classify PR-fast disk exhaustion
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/pr_smoke_disk_guard.py classify \
            --logs-dir target/receipts/logs \
            --target-dir "${CARGO_TARGET_DIR:-target}"

      # PR Smoke is the lane a contributor reads first and it published no
      # step summary at all: a red sent the reader straight to the job log.
      # The receipt already carries each gate's command and first failure;
      # this renders them. Advisory, and never changes the gate outcome.
      - name: Explain PR-fast failures
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # target/ is restored from a shared cache (#12085), so anything
          # already at this path belongs to another run, not this one.
          rm -f target/receipts/pr-fast-failure-digest.md
          if [ ! -f target/receipts/receipt.json ]; then
            echo "no PR-fast receipt; nothing to explain"
            exit 0
          fi
          "$CARGO_TARGET_DIR/debug/xtask" gate-failure-digest \
            --summary target/receipts/receipt.json \
            --logs target/receipts/logs \
            --out target/receipts/pr-fast-failure-digest.md
          cat target/receipts/pr-fast-failure-digest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PR-fast receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: pr-fast-receipt-${{ github.sha }}
          path: |
            target/receipts/receipt.json
            target/receipts/ci-subject.json
            target/receipts/logs/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize PR-fast gate failures
        if: always()
        shell: bash
        # Renders the gate table into GITHUB_STEP_SUMMARY, mirrors it to stdout
        # for the job-log tail, and publishes one `::error` annotation per
        # failing gate so the check-runs API can name the gate without the
        # artifact download (#15492). The logic lives in a script rather than
        # inline here because four of its branches -- the `skip` exclusion, the
        # workflow-command escaping, the `::stop-commands::` fence and the
        # ten-annotation fold -- are only falsifiable from a test harness:
        # scripts/ci/test_summarize_pr_fast_gates.py, run by
        # .github/workflows/ci-gate-self-tests.yml.
        # Existence guard (#16375): the workflow definition is loaded from
        # `main` even when the PR checkout predates the script, so an unguarded
        # `python3 scripts/ci/summarize_pr_fast_gates.py` exits with
        # `No such file or directory` and turns this advisory step red. Skip
        # with an explicit annotation instead; the missing summary is not a
        # gate failure, and re-basing restores the full behaviour without any
        # other change to this step.
        run: |
          if [ -f scripts/ci/summarize_pr_fast_gates.py ]; then
            python3 scripts/ci/summarize_pr_fast_gates.py
          else
            echo "::warning title=pr-fast summary::summarize_pr_fast_gates.py is not present on this checkout; skipping PR-fast gate summary (rebase onto current main to restore it; issue #16375)."
          fi

      - name: Convert PR-fast receipt to JUnit
        if: always()
        run: |
          python3 scripts/ci/receipts-to-junit.py \
            --input target/receipts/receipt.json \
            --output target/test-results/pr-fast-junit.xml \
            --suite-name pr-fast

      - name: Upload PR-fast test results to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/test-results/pr-fast-junit.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Note: workspace-wide integration-test compilation is covered by the
      # parallel check-all-targets job (just check-all-targets), which runs
      # cargo check --workspace --all-targets --locked independently of pr-smoke.
      # Adding a redundant fallback here would duplicate that work without gain.

  # ── Merge Gate shards: bounded validation lanes for every PR/push ────
  merge-gate-shards:
    name: CI Gate shard (${{ matrix.name }})
    runs-on: ubuntu-24.04
    # Outer runaway guard only — per-lane enforcement is gate-level
    # timeout_seconds in .ci/gate-policy.yaml, which this does not relax.
    # Raised 20 -> 30 with #5425. Measured job wall time on run 30622858284:
    # lsp 18.6 min, meta 16.4 min. At 20 the busiest shards had 1.4 and 3.6 min
    # of headroom, so a ~10% slower runner would kill the job outright — the
    # same merge-blocking symptom the gate split fixes, one level up.
    # Raised 30 -> 40 with #10023's watchdog-retry support: a retried
    # unit_lsp_full consumes 2x its 420s budget (+7 min), which at lsp's
    # measured wall time left under 2.5 min of slow-runner headroom.
    #
    # The inner `timeout ... 1800s` watchdog below was raised 1200 -> 1800 with
    # #11933. It is a runaway bound sized against measured wall time, not the
    # sum of child budgets (that sum is 35 min for lsp even without retries).
    # The 1200s value predated the 30 -> 40 raise above and never absorbed the
    # retried-unit_lsp_full case it was made for: lsp measured 18.6 min, +7 min
    # for that retry is 25.6 min, already past 20. #11933 adds two more gates to
    # the same shard, so the ordinary path moves to ~20.6 min and the 20m
    # watchdog would kill a required shard whose gates are all healthy. 1800s
    # covers 25.6 min with headroom and stays inside the 40 min outer guard,
    # which remains the true runaway bound.
    timeout-minutes: 40
    # No functional dependency on pr-smoke output; run in parallel after preflight
    # + conflict guard to reduce end-to-end merge-gate wall time.
    needs: [draft-pr-check, conflict-markers, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # `fmt` retired from this hosted shard after protected rustfmt
          # parity via required Rust Small (#9959). Rollback: restore `fmt`
          # as the first meta gate and the matching
          # `.ci/gate-shard-execution.json` row if the dedicated/required
          # formatter path is reverted. Local pr-fast `fmt` remains.
          # `compile_all_targets` retired from this hosted shard after
          # #15638: the shard copy duplicated the required
          # `Compile All Targets (bit-rot guard)` / `check-all-targets` job on
          # the same tree and deterministically exceeded the shared shard
          # budget (exit 124, ~19 min cold workspace compile) while the
          # dedicated owner passed on the identical commit. The standalone
          # job owns the bit-rot property; local pr-fast and advisory
          # pr-smoke keep the gate for shift-left. Rollback: restore
          # `compile_all_targets` to this gate list, the matching
          # `.ci/gate-shard-execution.json` row, the
          # `workflow_integration.job_mapping` list in `.ci/gate-policy.yaml`,
          # and re-flip `ci_workflow_includes_compile_all_targets_in_matrix`
          # if the dedicated job is ever reverted.
          - name: meta
            gates: ignored_tests_check_refs check_conflict_markers release_history readme_heading_check publish_closure publish_manifest_check layer_check published_crate_count_pr_fast serial_test_ratchet release_history_check source_commit_api_check perl_token_leaf_contract clippy_full
          - name: foundation
            gates: unit_foundation_full
          - name: parser_stack
            gates: unit_parser_stack_full parser_integration parser_behavior_proof
          - name: analysis
            gates: unit_analysis_full
          - name: lsp
            gates: unit_lsp_core_full unit_lsp_full lsp_smoke pending_parse_freshness pull_diagnostics_freshness
          - name: support
            gates: unit_dap_support_full
          - name: corpus
            gates: common_corpus_clean
          - name: policy
            # The cheapest control remains first for fast diagnosis, but the
            # shard runner now records every independent member before it
            # returns the aggregate failure verdict.
            gates: docs_agents_contract_workflows unsafe_prod_check msrv_authority_sync compiler_concept_ledger compiler_proof_policy compiler_concept_proof compiler_performance_receipt_contract kubernetes_dap_profiles postfix_capability_closure release_trust_invariants docs_build adr_link_check non_rust_inventory_check completion_candidate_ledger must_context_check lint_policy v2_bundle_sync nested_lock_check doctest_contract_proof doctest_enforcement version_sync agent_ledgers_validate code_action_generation_ledger
    permissions:
      contents: read
    # Run on every PR push and on push to main/master
    # Earlier gating > label-gated gating (see #4675)
    # Frequent commits will queue; preflight skips superseded SHAs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Match the PR merge workflow's gate list to its commands and policy (#14946).
          ref: ${{ github.sha }}
          # Release-history verification compares every fetched release tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Bind shard integration source
        id: inventory-source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse 'HEAD^{commit}')"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Reject unsupported PR attributions in reference docs
        if: matrix.name == 'meta'
        run: |
          if git grep -n -E 'PR #153|pull/153|PR #753|pull/753' -- docs/reference ':(exclude)docs/reference/archive/**'; then
            echo "Reference documentation contains an unsupported numbered PR attribution."
            echo "Use a source-backed implementation reference, or remove the PR attribution when the source is historical."
            exit 1
          fi

      - name: Fetch release tags from canonical repo
        run: |
          # Release tags live on EffortlessMetrics/perl-lsp; swarm origin has none.
          git fetch --force --tags https://github.com/EffortlessMetrics/perl-lsp.git '+refs/tags/v*:refs/tags/v*'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install just
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff  # v2.87.8
        with:
          tool: just

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-gate-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      # Same reasoning as the PR-fast clearance above: the `Explain gate
      # failures` step runs under `always()`, while the sweep that clears these
      # surfaces lives inside the shard-running step much further down. A
      # failure during setup therefore skips that sweep and still reaches the
      # digest, which would render cache-restored shard summaries and logs from
      # an unrelated SHA. The in-step sweep stays as the authority for the
      # uploaded artifact; this one exists so the digest cannot read a stale
      # input when the run never got that far.
      - name: Clear cache-restored shard receipt surfaces (#12085)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/receipts/shards target/receipts/shard-summaries \
            target/receipts/logs target/receipts/gate-failure-digest.md \
            || { echo "::error::cannot clear cache-restored shard receipt surfaces (#12085); refusing to run over possibly stale logs"; exit 1; }

      - name: Clear restored inventory evidence
        id: inventory-clean
        if: matrix.name == 'policy'
        shell: bash
        run: |
          set -euo pipefail
          rm -f target/policy/non-rust-inventory.md \
            target/policy/non-rust-inventory.json \
            target/policy/non-rust-inventory-subject.json

      - name: Warm xtask
        run: cargo build -p xtask --locked

      - name: Verify candidate meta self-tests
        if: matrix.name == 'meta'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          checkout_root="$(realpath -e -- .)"
          meta_self_tests=(
            scripts/ci/test_run_gate_shard.py
            scripts/ci/test_scope_cache_key.py
            scripts/ci/test_candidate_meta_self_tests.py
          )
          for self_test in "${meta_self_tests[@]}"; do
            if [[ ! -e "$self_test" && ! -L "$self_test" ]]; then
              if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error title=Unclassifiable missing candidate meta self-test::$self_test is absent without an immutable PR base SHA"
                exit 1
              fi
              if ! git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
                echo "::error title=Unclassifiable missing candidate meta self-test::PR base $PR_BASE_SHA is unavailable; refusing to classify $self_test as stale"
                exit 1
              fi
              mapfile -t historical_base_shas < <(git merge-base --all HEAD "$PR_BASE_SHA")
              if [[ "${#historical_base_shas[@]}" -ne 1 ]]; then
                echo "::error title=Unclassifiable missing candidate meta self-test::Historical merge-base decision is ambiguous or unavailable for HEAD and PR base $PR_BASE_SHA"
                exit 1
              fi
              historical_base_sha="${historical_base_shas[0]}"
              if git cat-file -e "${historical_base_sha}:${self_test}" 2>/dev/null; then
                echo "::error title=Candidate meta self-test removed::$self_test exists in historical PR base $historical_base_sha but is absent from the candidate"
                exit 1
              fi
              disposition="STALE_HEAD_SCOPED_NOOP: candidate path $self_test is absent"
              echo "::notice title=Authorized stale-head meta self-test no-op::$disposition"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                printf -- '- `%s`: `STALE_HEAD_SCOPED_NOOP` (candidate path absent)\n' "$self_test" >> "$GITHUB_STEP_SUMMARY"
              fi
              continue
            fi
            if [[ ! -f "$self_test" || -L "$self_test" ]]; then
              echo "::error title=Invalid candidate meta self-test::$self_test is present but is not a regular non-symlink file"
              exit 1
            fi
            resolved_self_test="$(realpath -e -- "$self_test")" || {
              echo "::error title=Unresolvable candidate meta self-test::$self_test cannot be resolved safely"
              exit 1
            }
            case "$resolved_self_test" in
              "$checkout_root"/*) ;;
              *)
                echo "::error title=Candidate meta self-test escapes checkout::$self_test resolves outside the checkout"
                exit 1
                ;;
            esac
            python3 -m unittest "$self_test"
          done

      - name: Verify candidate proof presence classification
        if: matrix.name == 'meta'
        run: python3 -m unittest scripts/ci/test_candidate_proof_presence.py

      - name: Run merge-gate shard with receipts
        shell: bash
        env:
          SHARD_NAME: ${{ matrix.name }}
          SHARD_GATES: ${{ matrix.gates }}
        run: |
          set +e
          (
            while true; do
              sleep 30
              printf 'ci-gate shard %s still running at %s\n' "$SHARD_NAME" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          subject_sha="$(git rev-parse 'HEAD^{commit}')"
          # rust-cache restores the whole target/ tree, including receipts
          # written by earlier runs of unrelated SHAs (#12085). Every surface
          # uploaded below is cleared so the artifact can only contain outputs
          # produced while proving this subject; run_gate_shard.py sweeps its
          # own receipt dir again, and verify-gate-receipt-freshness
          # independently re-checks every binding before anything is uploaded.
          # The step runs under `set +e`, so a failed clearance must abort
          # here: logs/*.log and artifacts/* carry no SHA binding for the
          # verifier to reject, and the following mkdir would otherwise
          # overwrite the failure status.
          rm -rf target/receipts/shards target/receipts/shard-summaries \
            target/receipts/logs target/receipts/artifacts \
            target/receipts/gate-failure-digest.md \
            target/policy/non-rust-inventory.md \
            target/policy/non-rust-inventory.json \
            || { echo "::error::cannot clear cache-restored target/receipts surfaces (#12085); refusing to run the shard over possibly stale logs/artifacts"; exit 1; }
          mkdir -p target/receipts/shards target/receipts/shard-summaries
          timeout --signal=TERM --kill-after=30s 1800s \
            python3 scripts/ci/run_gate_shard.py \
              --xtask target/debug/xtask \
              --gate-policy .ci/gate-policy.yaml \
              --receipt-dir target/receipts/shards \
              --summary "target/receipts/shard-summaries/${SHARD_NAME}.json" \
              --subject-sha "$subject_sha" \
              --clean-restored-receipts \
              $SHARD_GATES
          status=$?
          case "$status" in
            124)
              echo "::error::Shard hit the 30m inner watchdog; completed receipts and the partial shard summary remain available"
              ;;
            137|143)
              echo "::error::Shard was cancelled by the runner or process group (exit $status)"
              ;;
          esac
          exit "$status"

      - name: Verify parser integration receipt subject
        if: always() && matrix.name == 'parser_stack'
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/ci")
          import run_parser_integration

          run_parser_integration.validate_receipt_subject(
              Path.cwd(),
              Path("target/receipts/parser-integration.json"),
              Path(".ci/parser-integration-targets.json"),
              Path(".ci/parser-integration-targets.lock.json"),
          )

      - name: Verify gate receipt freshness
        id: verify-receipt-freshness
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/verify_gate_receipt_freshness.py \
            --subject-sha "$(git rev-parse 'HEAD^{commit}')" \
            --receipt-dir target/receipts/shards \
            --summary-dir target/receipts/shard-summaries

      - name: Upload gate receipt
        if: always() && steps.verify-receipt-freshness.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: gate-receipt-${{ matrix.name }}-${{ github.sha }}
          path: |
            target/receipts/shards/*.json
            target/receipts/shard-summaries/*.json
            target/receipts/logs/*.log
            target/receipts/artifacts/*
          if-no-files-found: warn
          retention-days: 7

      - name: Bind produced inventory evidence
        id: inventory-evidence
        if: always() && matrix.name == 'policy' && steps.inventory-source.outcome == 'success' && steps.inventory-clean.outcome == 'success'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.inventory-source.outputs.sha }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(["git", "rev-parse", "HEAD^{commit}"], text=True).strip()
          if source != os.environ["SOURCE_SHA"]:
              raise SystemExit("inventory source changed during the shard")
          paths = [Path("target/policy/non-rust-inventory." + ext) for ext in ("md", "json")]
          if not any(path.exists() for path in paths):
              raise SystemExit(0)  # The producer never emitted evidence.
          files = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in paths}
          receipt = {"schema_version": 1, "source_sha": source, "sha256": files}
          Path("target/policy/non-rust-inventory-subject.json").write_text(json.dumps(receipt) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("ready=true\n")
          PYTHON

      - name: Upload non-Rust inventory evidence
        if: always() && matrix.name == 'policy' && steps.inventory-evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: non-rust-inventory-${{ steps.inventory-source.outputs.sha }}
          path: |
            target/policy/non-rust-inventory.md
            target/policy/non-rust-inventory.json
            target/policy/non-rust-inventory-subject.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload parser integration receipt
        if: always() && matrix.name == 'parser_stack'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: parser-integration-receipt-${{ github.sha }}
          path: target/receipts/parser-integration.json
          if-no-files-found: error
          retention-days: 7

      - name: Convert gate shard receipts to JUnit
        if: always() && steps.verify-receipt-freshness.outcome == 'success'
        run: |
          python3 scripts/ci/receipts-to-junit.py \
            --input target/receipts/shards \
            --output target/test-results/gate-shard-${{ matrix.name }}-junit.xml \
            --suite-name "gate-${{ matrix.name }}"

      - name: Emit CI actuals (LEM telemetry)
        # Reads gate receipts produced above and writes target/ci/ci-actuals.json
        # for the calibration pipeline. See docs/ci/ci-actuals.md and
        # docs/ci/learned-estimates.md. Tolerant of missing data.
        if: always() && steps.verify-receipt-freshness.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p target/ci
          python3 scripts/ci/emit_ci_actuals.py \
            --receipts-dir target/receipts/shards \
            --lane-id merge_gate_shards \
            --workflow "${{ github.workflow }}" \
            --sha "${{ github.sha }}" \
            --pr "${{ github.event.pull_request.number || 0 }}" \
            --json-out "target/ci/ci-actuals-${{ matrix.name }}.json" || true

      - name: Upload CI actuals
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: ci-actuals-${{ matrix.name }}-${{ github.sha }}
          path: target/ci/ci-actuals-${{ matrix.name }}.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload gate shard test results to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/test-results/gate-shard-${{ matrix.name }}-junit.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Dump gate failures on error
        if: failure()
        run: |
          echo "=== gate receipts (tail) ==="
          find target/receipts/shards -name '*.json' -maxdepth 1 -print -exec tail -120 {} \; || true
          echo "=== shard summary ==="
          find target/receipts/shard-summaries -name '*.json' -maxdepth 1 -print -exec cat {} \; || true
          echo "=== failed gates ==="
          python3 - <<'PY' || true
          import json, pathlib
          for p in pathlib.Path("target/receipts/shards").glob("*.json"):
              data = json.loads(p.read_text())
              for g in data.get("gates", []):
                  if str(g.get("status", "")).lower() not in ("passed", "pass", "skipped", "skip"):
                      print(f"- {p.name}: {g.get('gate_name', g.get('name', '<unnamed>'))}: {g.get('status', '')} (exit {g.get('exit_code', '?')})")
          PY

      - name: Gate summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          shard_name = os.environ.get("SHARD_NAME", "")
          shard_summary = Path("target/receipts/shard-summaries") / f"{shard_name}.json"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          if not summary_path:
              raise SystemExit(0)

          lines = [f"### CI Gate shard: {shard_name}", ""]
          if not shard_summary.is_file():
              lines.append("Shard summary not found.")
              Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")
              raise SystemExit(0)

          payload = json.loads(shard_summary.read_text(encoding="utf-8"))
          lines.append("| Gate | Result | Receipt status | Exit | Duration (s) |")
          lines.append("| --- | --- | --- | --- | --- |")
          for gate in payload.get("gates", []):
              dur_ms = gate.get("duration_ms")
              dur_s = f"{dur_ms / 1000:.1f}" if isinstance(dur_ms, int) else ""
              lines.append(
                  f"| {gate.get('gate_name', '')} | {gate.get('result', '')} | "
                  f"{gate.get('receipt_status') or ''} | {gate.get('exit_code') if gate.get('exit_code') is not None else ''} | {dur_s} |"
              )
          non_success = payload.get("summary", {}).get("non_success_gates", [])
          if non_success:
              # #15638: render each non-success gate with its shard result
              # class so "the clock ran out" (timeout) is distinguishable from
              # "the gate failed" (failure/instrument_failure) without a log
              # dive. The bare name list in summary.non_success_gates stays
              # machine-readable.
              results = {
                  gate.get("gate_name"): str(gate.get("result", ""))
                  for gate in payload.get("gates", [])
              }
              rendered = ", ".join(
                  f"{name} ({results[name]})" if results.get(name) else name
                  for name in non_success
              )
              lines.extend(["", f"Non-success gates: {rendered}"])

          Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
        env:
          SHARD_NAME: ${{ matrix.name }}

      # The table above names which gate went red and nothing about why, so
      # reading a failure costs a job-log dive — and the job log is not
      # reliably reachable (the full-log archive redirects to blob storage,
      # and the per-job logs API returns a bounded tail a noisy later step can
      # exhaust). Render the failing test, its panic location and the repro
      # command here instead, the way ux-regression-gate.yml already does.
      # Advisory: appends to the summary and never changes a verdict.
      - name: Explain gate failures
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SHARD_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          summary="target/receipts/shard-summaries/${SHARD_NAME}.json"
          if [ ! -f "$summary" ]; then
            echo "no shard summary at $summary; nothing to explain"
            exit 0
          fi
          target/debug/xtask gate-failure-digest \
            --summary "$summary" \
            --logs target/receipts/logs \
            --out target/receipts/gate-failure-digest.md
          cat target/receipts/gate-failure-digest.md >> "$GITHUB_STEP_SUMMARY"

  # ── CI Gate aggregate: roll up the deterministic shard + guard lanes ──
  # This established context is hardened under #12911 but remains advisory.
  # Candidate-controlled pull-request workflow results are not trusted required
  # authority, so do not register this context in ruleset 16664791. The trusted
  # organization-ruleset workflow is a separate follow-up. Keep the exact
  # historical name for continuity with existing advisory consumers.
  # `.ci/policies/required-checks.toml` records this advisory truth.
  # `pr-smoke` remains intentionally outside `needs`: it is advisory, flaky, and
  # redundant with the deterministic shard base (see the pr-smoke job).
  merge-gate:
    name: CI Gate (Advisory Aggregate)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    # Read-only, and narrower than it looks: `pull-requests` only to read the
    # live head of the pull request this job is already running for, `actions`
    # only to look up the replacement run on that head.
    #
    # `actions: read` is belt and braces. Run 35508361581 resolved both heads
    # under `contents`/`pull-requests` alone, with no `Unresolved` notice, so
    # `GET /actions/runs/{id}` needs no explicit scope. The *listing* endpoint
    # this now also calls was not covered by that measurement, and a silently
    # 403'd lookup would leave the feature inert rather than wrong — which is
    # the failure mode this pull request already shipped once. Declaring the
    # scope costs nothing and removes the guess.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    needs:
      - draft-pr-check
      - preflight-latest-check
      - conflict-markers
      - check-all-targets
      - ux-tests
      - merge-gate-shards
    # A required dependent job must always start: a skipped job is treated as
    # successful by GitHub protection. The classifier emits explicit scoped
    # no-ops for draft/superseded routes and fails closed otherwise.
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Evidence that a newer candidate replaced the one this run tested. It
      # no longer changes the gate's colour — every non-success path exits 1 —
      # only which sentence the reader is handed, which is what #16087 asked
      # for. That does not make a wrong answer cheap: a message naming a run
      # that is not proving this candidate is the same defect with more
      # confidence behind it.
      #
      # This job used to gate that on `cancelled()`, and a live run falsified
      # it. Run 35507473500 was concurrency-cancelled by a push, every
      # dependency came back `cancelled`, this job still ran under
      # `if: always()` — and its `if: cancelled()` steps were *skipped*.
      # `cancelled()` is false here: the run was cancelled, this job was not.
      # The marker those steps exported could therefore never be set in the one
      # case #16087 is about, so anything resting on it was inert.
      #
      # Positive evidence replaces it, and needs no cancellation fact at all.
      # Two facts together: the pull request's live head is no longer the head
      # this run tested, *and* a run of this workflow exists for that live
      # head. The first alone was the previous attempt, and review rejected it
      # correctly — a moved head shows the candidate changed, not that
      # anything exists to prove the new one, which is what #16087's accepted
      # design asks for. The classifier still requires every blocker to be a
      # cancelled lane, so a genuine failure alongside a cancellation is still
      # a failure.
      #
      # The pull request is resolved by its number, not by branch name:
      # `github.head_ref` is fork-controlled, which is how a branch called
      # "main" once made every fork PR look superseded (#5981). Both SHAs come
      # from the API rather than the event payload, because this job must not
      # read candidate-controlled pull-request head data (#12911) — the run
      # object's `head_sha` is the head this run actually tested.
      #
      # Fail closed: an unresolved head stays empty and leaves the gate red,
      # which is the behaviour before this step existed.
      - name: Resolve the tested head, the live head, and the replacement run
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          # `github.token` rather than `secrets.GITHUB_TOKEN`: the same
          # installation token, reached without a secret reference in a
          # PR-triggered workflow, which `workflow_security_ratchet.py` flags
          # as `pr_secret_reference`. The job's own `permissions:` block is
          # what bounds the authority, and it is read-only.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          # One read supplies both this run's tested head and its workflow id.
          # The workflow id keeps the replacement lookup below to *this*
          # workflow, so a run of some other workflow on the newer head cannot
          # be mistaken for the replacement.
          run_json="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" 2>/dev/null || true)"
          tested="$(printf '%s' "$run_json" | jq -r '.head_sha // empty' 2>/dev/null || true)"
          workflow_id="$(printf '%s' "$run_json" | jq -r '.workflow_id // empty' 2>/dev/null || true)"
          created="$(printf '%s' "$run_json" | jq -r '.created_at // empty' 2>/dev/null || true)"
          latest="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha' 2>/dev/null || true)"

          # The replacement run's identity, not merely the fact that the head
          # moved. A moved head shows the candidate changed; it does not show
          # that anything is proving the new one. #16087 requires a
          # demonstrable newer run, so it is looked up and its id bound.
          # Queried only once the head has actually moved, so this run can
          # never find itself.
          #
          # The endpoint constrains workflow and head SHA. Event, pull-request
          # association and chronology it does not, and a review finding on
          # #16186 named all three: without them "the evidence claim remains
          # too strong". `scripts/ci/replacement_run_filter.jq` applies them,
          # and `test_evaluate_ci_gate.py` runs that same file against
          # response fixtures, so the two cannot drift.
          replacement=""
          if [[ "${latest}" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "${tested}" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "${latest}" != "${tested}" ]] \
            && [[ "${workflow_id}" =~ ^[0-9]+$ ]] \
            && [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]] \
            && [[ "${created}" =~ ^[0-9T:Z-]+$ ]]; then
            # Arguments are passed as jq arguments, never interpolated into the
            # program text, so neither value can alter what the filter does.
            replacement="$(gh api \
              "repos/${REPOSITORY}/actions/workflows/${workflow_id}/runs?head_sha=${latest}&event=pull_request&per_page=30" \
              2>/dev/null \
              | jq -r --argjson pr "${PR_NUMBER}" --arg since "${created}" \
                  -f scripts/ci/replacement_run_filter.jq 2>/dev/null || true)"
          fi

          # Only well-formed values are exported. `gh` writes nothing to stdout
          # on failure, but a partial or unexpected value would still compare
          # unequal to the other side and read as a supersession that did not
          # happen, so every shape is checked rather than assumed. An
          # unexported variable leaves the gate red, which is the safe
          # direction for all three.
          for pair in "RUN_HEAD_SHA=${tested}" "LATEST_HEAD_SHA=${latest}"; do
            if [[ "${pair#*=}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "$pair" >> "$GITHUB_ENV"
            else
              echo "::notice::Unresolved ${pair%%=*}; the gate stays red."
            fi
          done
          if [[ "${replacement}" =~ ^[0-9]+$ ]]; then
            echo "REPLACEMENT_RUN_ID=${replacement}" >> "$GITHUB_ENV"
          else
            echo "::notice::No replacement run for the live head; the gate stays red."
          fi

      - name: Gate summary
        if: always()
        shell: bash
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft }}
        run: python3 scripts/ci/evaluate_ci_gate.py

  # ── UX Tests: first-5-minutes scenario regression suite ──────────────
  ux-tests:
    name: UX Regression Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # UX suite does not consume pr-smoke artifacts/results; parallelize after preflight.
    needs: [draft-pr-check, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    # Run on every PR push — this is the regression prevention gate.
    # Flakiness note: 11 active entries in .ci/ux-flakes.json (all scenario_14 / @INC
    # conformance tests) are registered as quarantine_effect=non_blocking_pr but that
    # registry is advisory only — it is NOT enforced here. If any scenario_14 test
    # fails this job fails and merge-gate blocks. Quarantine enforcement (reading the
    # registry to generate --skip flags) is a follow-up; see .ci/ux-flakes.json.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify tested candidate identity
        env:
          TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse 'HEAD^{commit}')"
          if [ "$actual_sha" != "$TESTED_SHA" ]; then
            printf '::error::Checked-out candidate %s does not match tested SHA %s\n' \
              "$actual_sha" "$TESTED_SHA"
            exit 1
          fi
          printf 'Testing exact candidate %s\n' "$TESTED_SHA"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Install just
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff  # v2.87.8
        with:
          tool: just

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-ux-tests-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Build perllsp binary
        run: cargo build -p perllsp --bin perllsp

      - name: Run UX regression tests
        id: ux_tests
        continue-on-error: true
        env:
          PERL_LSP_BIN: ${{ github.workspace }}/target/debug/perllsp
          RUST_TEST_THREADS: "1"
          # #9616: golden-manifest error waivers carry calendar expiry dates, so
          # enforcing a lapse on every branch makes the verdict depend on
          # merge-base age rather than on the diff under test. A branch reports
          # a lapse as a warning; a push to the default branch fails, which is
          # where the waiver can actually be refreshed. Waiver *shape* stays
          # enforced everywhere.
          #
          # merge_group stays on `warn` deliberately. A lapsed waiver is a
          # property of the repository, not of the candidate being queued: it
          # is equally true whether or not this candidate lands, so failing the
          # candidate's queue run would attribute a repository problem to a
          # change that did not cause it — the same misattribution this issue
          # removes from branches. The push-to-main run below catches the lapse
          # within one merge, and reports it against the commit that can fix it.
          PERL_LSP_UX_WAIVER_EXPIRY: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) && 'enforce' || 'warn' }}
        run: |
          set -o pipefail
          mkdir -p target/receipts
          set +e
          just ux-tests 2>&1 | tee target/receipts/ux-regression.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test_status="${pipeline_status[0]}"
          tee_status="${pipeline_status[1]}"
          printf '%s\n' "$test_status" > target/receipts/ux-regression.exit
          if [ "$tee_status" -ne 0 ]; then
            printf '%s\n' "$tee_status" > target/receipts/ux-regression.instrumentation.exit
            printf '::error::UX regression tee failed with status %s\n' "$tee_status" >&2
            exit "$tee_status"
          fi
          printf '0\n' > target/receipts/ux-regression.instrumentation.exit
          exit "$test_status"

      - name: Emit UX regression receipt
        if: always()
        env:
          TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          cargo xtask ux-regression-receipt \
            --input target/receipts/ux-regression.log \
            --receipt target/receipts/ux-regression.json \
            --exit-status-file target/receipts/ux-regression.exit \
            --sha "$TESTED_SHA"

      - name: Verify receipt subject identity
        id: verify_receipt
        if: always()
        env:
          TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt_path = Path("target/receipts/ux-regression.json")
          instrumentation_path = Path("target/receipts/ux-regression.instrumentation.exit")
          if not instrumentation_path.is_file() or instrumentation_path.is_symlink():
              raise SystemExit("UX receipt instrumentation status is missing or not a regular file")
          if instrumentation_path.read_text(encoding="utf-8").strip() != "0":
              raise SystemExit("UX receipt instrumentation failed")
          if not receipt_path.is_file() or receipt_path.is_symlink():
              raise SystemExit("UX receipt is missing or not a regular file")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          if receipt.get("sha") != os.environ["TESTED_SHA"]:
              raise SystemExit(
                  f"UX receipt subject {receipt.get('sha')!r} does not match "
                  f"{os.environ['TESTED_SHA']}"
              )
          PY

      - name: Upload UX regression evidence
        if: always() && steps.verify_receipt.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: ux-regression-receipt-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            target/receipts/ux-regression.json
            target/receipts/ux-regression.log
            target/receipts/ux-regression.exit
            target/receipts/ux-regression.instrumentation.exit
            target/receipts/editor-ux/golden-editor-workload-v3.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unverified UX diagnostics
        if: always() && steps.verify_receipt.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: ux-regression-unverified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/receipts/ux-regression.json
            target/receipts/ux-regression.log
            target/receipts/ux-regression.exit
            target/receipts/ux-regression.instrumentation.exit
          if-no-files-found: warn
          retention-days: 7

      - name: Convert UX regression receipt to JUnit
        if: always()
        run: |
          python3 scripts/ci/receipts-to-junit.py \
            --input target/receipts/ux-regression.json \
            --output target/test-results/ux-regression-junit.xml \
            --suite-name ux-regression

      - name: Upload UX regression test results to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/test-results/ux-regression-junit.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: UX regression summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          receipt_path = Path("target/receipts/ux-regression.json")
          log_path = Path("target/receipts/ux-regression.log")
          lines = ["### UX Regression Receipt", ""]
          lines.append(f"- Receipt: `{receipt_path}`")
          lines.append(f"- Log: `{log_path}`")

          if receipt_path.exists():
              data = json.loads(receipt_path.read_text(encoding="utf-8"))
              lines.append(f"- Result: `{data.get('result', 'unknown')}`")
              # A passing run publishes only the neutral `unknown`/`triage`
              # class and route (#16287); omitting them keeps the green summary
              # from advertising a failure remedy.
              if data.get("result") != "pass" and data.get("failure_class"):
                  lines.append(f"- Failure class: `{data.get('failure_class')}`")
              if data.get("result") != "pass" and data.get("route"):
                  lines.append(f"- Route: `{data.get('route')}`")
              if data.get("merge_action"):
                  lines.append(f"- Merge action: `{data.get('merge_action')}`")
              if data.get("first_failing_test"):
                  lines.append(f"- First failing test: `{data.get('first_failing_test')}`")
              if data.get("first_failing_line"):
                  lines.append(f"- First failing line: `{data.get('first_failing_line')}`")
              if data.get("canonical_repro"):
                  lines.append(f"- Repro: `{data.get('canonical_repro')}`")
              if data.get("human_summary"):
                  lines.append(f"- Summary: {data.get('human_summary')}")
          else:
              lines.append("- Receipt unavailable.")

          rendered = "\n".join(lines) + "\n"
          summary.write_text(rendered, encoding="utf-8")
          # Mirror the receipt summary into stdout so the fields appear in the
          # job-log tail when GITHUB_STEP_SUMMARY or artifact downloads are
          # inaccessible (#16026).
          print(rendered)
          PY

      - name: Fail UX regression gate on test failures
        if: steps.ux_tests.outcome == 'failure'
        run: exit 1

  # ── Compile All Targets: catch integration-test + bench bit-rot ───────
  check-all-targets:
    name: Compile All Targets (bit-rot guard)
    runs-on: ubuntu-24.04
    # The default+all-features double workspace check now costs ~14m on this
    # base (#12650/#12712 grew the compiled target surface), leaving the four
    # xtask merge-surface contract tests no budget. Three consecutive runs
    # cancelled inside the emacs docs contract step at the 15m ceiling with
    # the compile step itself green (jobs 98281594104, 98291003739,
    # 98300685210); 25m restores measured headroom for the contracts.
    # 2026-09-19: job 105961871648 (#15953 head 474b2b5d4d) cancelled inside
    # the Dead-code API ledger contract step at the 25m ceiling with the
    # compile step itself green in 13m15s; 35m restores measured headroom
    # for the grown contract tail.
    # Same shape as #5425: raise the knob when runners/base outgrow it.
    timeout-minutes: 35
    needs: [draft-pr-check, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    steps:
      # INTENTIONAL: no `ref:` override here — see #9594.
      #
      # For a pull_request event the workflow *definition* comes from the base
      # branch, so pinning the head SHA runs base's step list against the
      # candidate's tree. When one commit adds a required step and the file it
      # depends on together (as d5064c4d did for the Emacs docs contract), every
      # PR branched before it inherits the step without the file, and this
      # required check fails on branch age rather than on content.
      #
      # Omitting `ref` checks out the event's own ref — the merge ref for a
      # pull_request — so the definition and the tree stay one coherent
      # integration subject. That is also what a bit-rot guard should measure:
      # whether what would actually land still compiles. Other jobs in this
      # workflow deliberately keep exact-head checkout for head-pinned receipts;
      # this one is a merge-surface gate and must not.
      # Full history: the non-Rust file policy contract below runs the real
      # `non-rust inventory --check`, whose newly-added-path ratchet needs
      # `origin/main` (or `HEAD^`) to resolve and fails closed in CI otherwise.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Install just
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff  # v2.87.8
        with:
          tool: just

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-all-targets-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Compile all targets (catches integration-test + bench bit-rot)
        run: just check-all-targets

      # The frozen legacy parity authority is a required merge surface. Keep
      # both integration targets here because compile-all-targets alone cannot
      # execute their assertions, and the routed pr-fast lane is advisory.
      - name: Legacy parity library authority (required merge surface)
        run: cargo test -p perl-release-readiness --test legacy_parity --locked -- --nocapture

      - name: Legacy parity CLI authority (required merge surface)
        run: cargo test -p xtask --test perl_kwalitee_parity --locked -- --nocapture

      # Required merge surface for #7767/#7796: unit_routed_full only executes via
      # advisory pr-smoke, so stale Emacs guidance could otherwise merge while this
      # contract merely compiles. Keep the oracle on Compile All Targets.
      - name: Emacs docs contract (required merge surface)
        run: cargo test -p xtask --test emacs_docs_contract --locked -- --nocapture

      # Keep the direct-command guidance guard load-bearing on the required
      # merge surface, including the tracked root AGENTS.md instructions.
      - name: Direct command guidance contract (required merge surface)
        run: cargo test -p xtask --test direct_command_guidance --locked -- --nocapture

      # The active cache denominator (#9177) is derived from workflow source, so it
      # silently rots whenever a cache step, trigger, or save guard moves. This
      # contract lives as the xtask binary's own unit tests (tasks::ci_cache_inventory),
      # and the merge gate runs `cargo test --workspace --lib`, which never compiles or
      # runs the xtask *binary*'s unit tests — so keep this step required here.
      - name: CI cache inventory contract (required merge surface)
        run: cargo test -p xtask --bin xtask tasks::ci_cache_inventory --locked -- --nocapture

      # The unit tests above prove the deriver's logic; this proves the
      # *producer* against the live workflow tree: the checked-in manifest
      # `.ci/ci-cache/cache-inventory.v1.json` must equal what
      # `ci-cache-inventory` derives right now, or the drift gate fails the
      # merge surface instead of letting the manifest rot silently.
      - name: CI cache inventory manifest drift gate (required merge surface)
        run: cargo run --locked --package xtask -- ci-cache-inventory --check

      # Same reasoning as the Emacs contract above: the merge gate runs
      # `cargo test --workspace --lib`, so this integration test would otherwise
      # only execute via advisory pr-smoke. It guards the publish path that can
      # overwrite a shipped release asset (#9597), so keep it required here.
      - name: Release-asset identity contract (required merge surface)
        run: cargo test -p xtask --test publish_extension_release_identity --locked -- --nocapture

      # Same reasoning for the publication receipt the post-publish smoke test
      # consumes (#9593). If this drifts unobserved the smoke lane silently
      # goes back to certifying a version from a ref shape.
      - name: Publish-provenance contract (required merge surface)
        run: cargo test -p xtask --test post_publish_smoke_version_provenance --locked -- --nocapture

      # Same reasoning as the contracts above: the #11377 semantic-facade
      # recurrence guard otherwise only executes through diff-routed advisory
      # lanes, so stale facade imports could merge without it ever running.
      - name: Semantic facade consumer contract (required merge surface)
        run: cargo test -p xtask --test parser_semantic_facade_consumers --locked -- --nocapture

      # Same reasoning as the contracts above: the #11389 workspace/index
      # facade recurrence guard otherwise only executes through diff-routed
      # advisory lanes, so stale facade imports could merge without it ever
      # running.
      - name: Workspace/index facade consumer contract (required merge surface)
        run: cargo test -p xtask --test parser_workspace_index_facade_consumers --locked -- --nocapture

      # Same reasoning as the contracts above, and the #10544 recurrence #10433
      # exists to prevent: the merge gate runs `cargo test --workspace --lib`, so
      # this ledger would otherwise only execute via advisory pr-smoke. It is the
      # architecture check that stops a second canonical index lifecycle authority,
      # a telemetry-as-readiness disposition, or an unmapped lifecycle declaration
      # from merging, so the producer needs a blocking execution route here.
      - name: Index lifecycle ownership ledger (required merge surface)
        run: cargo test -p xtask --test workspace_index_lifecycle_ledger --locked -- --nocapture

      # Same reasoning as the contracts above: the #11382 TDD-facade
      # recurrence guard otherwise only executes through diff-routed advisory
      # lanes, so stale facade imports could merge without it ever running.
      - name: TDD facade consumer contract (required merge surface)
        run: cargo test -p xtask --test parser_tdd_facade_consumers --locked -- --nocapture

      # #12863/#12693: no gate row or other workflow executed the budget witness
      # below, so its pins could all fail while every required check stayed
      # green. It reads exactly the two files this job budgets, so run it next
      # to the four contracts above on the same required merge surface.
      - name: Gate-policy budget witness contract (required merge surface)
        run: cargo test -p xtask --test issue_4657_ci_workflow_contract --locked -- --nocapture

      # #13295: standalone semantic conformance corpus — oracle, mutation bank,
      # and CLI command wiring. These tests span corpus authoring rules,
      # derivation determinism, and all 15 behavioral mutations; they are the
      # primary negative-control surface for the standalone install semantics
      # (#10243/#11550) and must run on the required merge surface so a broken
      # corpus vector or a regressed oracle cannot land undetected.
      - name: Standalone semantic conformance corpus contract (required merge surface)
        run: cargo test -p xtask --test standalone_vectors_cli --locked -- --nocapture

      # #7611: keep the JSON-RPC dependency-boundary probe on a required
      # merge surface so a restored Perl taxonomy dependency cannot merge
      # behind the advisory PR Smoke lane.
      - name: LSP JSON-RPC dependency probe (required merge surface)
        run: cargo test -p xtask --test lsp_jsonrpc_dependency_probe --locked -- --nocapture

      # #14585: nothing executed `xtask/tests/file_policy.rs`. No workflow named
      # `--test file_policy`, the merge gate runs `cargo test --workspace --lib`
      # (which does not build `tests/`), and the policy shard runs
      # `cargo xtask gates` rather than the test binary. The suite asserts the
      # inventory gate's tier, required flag, description, command, timeout,
      # budgets, single mapping, and shard membership — so the gate guarding the
      # non-Rust inventory was itself guarded by a contract that could not go
      # red, and did in fact sit red on main unnoticed. Same reasoning as the
      # contracts above, so it belongs on the same required merge surface.
      - name: Non-Rust file policy contract (required merge surface)
        run: cargo test -p xtask --test file_policy --locked -- --nocapture

      # #14178: identical reasoning to the file-policy contract directly above.
      # This suite asserts that every literal crate name in the Cargo dependabot
      # entry, and every crate the dependency guide advertises, resolves to a
      # dependency some workspace manifest declares. Its whole value is going
      # red when a stale name is added, and `.github/dependabot.yml` is not in
      # ci-scope's CI_CONFIG_PATHS, so a config-only edit does not even reach
      # the advisory routed lane. Left off this surface the guard would compile
      # and never execute — the state #14585 found `file_policy` in.
      - name: Dependabot dependency-name contract (required merge surface)
        run: cargo test -p xtask --test dependabot_cargo_dependency_names --locked -- --nocapture

      # #13477: same required-surface reasoning as the dependency-name
      # contract above. This suite asserts that the Cargo row keeps
      # `prefix: "chore"` plus `include: "scope"` and rejects
      # `prefix: "chore(deps)"` plus that include. `.github/dependabot.yml`
      # is not in ci-scope's CI_CONFIG_PATHS, so a config-only revert of
      # #13482 would never reach the advisory routed lane.
      - name: Dependabot Cargo commit-message contract (required merge surface)
        run: cargo test -p xtask --test dependabot_cargo_commit_message --locked -- --nocapture

      # #13484: nothing executed the `xtask` *bin* unit tests. The merge gate
      # runs `cargo test --workspace --lib` (a bin is not a lib target) and no
      # workflow names `--bin xtask`, so `tasks::changelog::tests` — the proof
      # that a malformed fragment `time:` becomes a named per-fragment finding
      # instead of a repo-wide `changie batch` crash, and that an absent
      # disposition artifact cannot supply the disposition removing it — could
      # not go red. Same failure mode as #14585 above: the gate guarding the
      # release ledger was itself guarded by a contract with no way to fail.
      # Scoped to the changelog/changie modules rather than the whole bin
      # suite on purpose — that suite also carries inventory ratchets which are
      # red on main today, so enabling it wholesale would gate this surface on
      # other lanes' work.
      # One invocation with both filters, not two runs: libtest ORs positional
      # filters and runs each match once, so `check_malformed_changie_yaml_is_
      # instrument_failure_exit2` — the one name containing both words — is not
      # executed twice. Kept as substring filters rather than exact module
      # paths on purpose: they also pick up the `merge_ready` changelog fan-in
      # tests and the `file_policy` changie-rule tests, which exact paths would
      # drop from this surface.
      - name: Changelog fragment gate contract (required merge surface)
        run: cargo test -p xtask --bin xtask --locked -- --nocapture changelog changie

      # #15040: same defect shape as #13484 directly above. PR #14513 added 12
      # `ci_subject_materializer::tests` and 3 `file_policy::tests::preapproved`
      # unit tests, but no workflow invoked them — `xtask` is a bin target so
      # `cargo test --workspace --lib` does not build them, the only
      # `--bin xtask` invocations are in `emacs-train-context-contract.yml`
      # for unrelated modules, and `ci-gate-self-tests.yml` is path-gated to
      # other paths. Without these steps a future revert of the
      # `-c core.autocrlf=false -c merge.renormalize=false` git wrapper flags,
      # a bump of `PREAPPROVED_SUBJECT_CONTRACT_VERSION` without retargeting
      # the live workflow contract-version, or a relaxation of
      # `validate_preapproved_subject_workflow` could land without the merge
      # surface ever failing — the very failure mode #13484 added to keep
      # `tasks::changelog::tests` honest. Scoped to the exact module paths
      # rather than substring filters on purpose: only those modules carry
      # the structural-validator regressions this claim covers, and broader
      # filters would re-introduce the inventory-ratchet red that #13484
      # was specifically avoiding.
      - name: PR-subject materializer unit tests (required merge surface)
        run: cargo test -p xtask --bin xtask --locked ci_subject_materializer::tests -- --nocapture

      - name: File-policy preapproval unit tests (required merge surface)
        run: cargo test -p xtask --bin xtask --locked file_policy::tests::preapproved -- --nocapture

      - name: Workflow policy CLI wiring (required merge surface)
        run: cargo test -p xtask --bin xtask --locked -- workflow_policy_lint

      # #14180: same required-surface reasoning as the Cargo dependency-name
      # contract above. This suite asserts that the GitHub Actions `/` and npm
      # `/vscode-extension` rows keep `prefix: "chore"` plus `include: "scope"`
      # and reject `prefix: "chore(deps)"` plus that include. Cargo is out of
      # this claim (#13482 / #14898). `.github/dependabot.yml` is not in
      # ci-scope's CI_CONFIG_PATHS, so a config-only revert would never reach
      # the advisory routed lane. Inserted after the changelog fragment gate
      # so it does not occupy the insertion site #14898 uses after the Cargo
      # name contract.
      - name: Dependabot GitHub Actions and npm commit-message contract (required merge surface)
        run: cargo test -p xtask --test dependabot_gha_npm_commit_message --locked -- --nocapture

      # #15100: same required-surface reasoning as the contracts above. These
      # suites assert that every generated-PR CI dispatcher (post-merge-status
      # today, lane-history after this change) satisfies ci.yml's required
      # workflow_dispatch subject inputs (#13019) and refuses to prove a moved
      # subject. No workflow named either target: the post-merge suite sat red
      # on main unobserved after #13468 changed the dispatch shape, and the
      # lane-history suite would never run at all.
      - name: Post-merge generated-PR dispatch contract (required merge surface)
        run: cargo test -p xtask --test post_merge_status_regen_tests --locked -- --nocapture

      - name: Lane-history generated-PR dispatch contract (required merge surface)
        run: cargo test -p xtask --test lane_history_ci_dispatch_contract --locked -- --nocapture

      # #11933: the freshness cfg-binding test lives in
      # `xtask/tests/gate_policy_profile_tests.rs`. unit_routed_full only
      # executes xtask integration tests when the PR diff selects xtask, and
      # `.ci/gate-policy.yaml` is not an xtask-policy-guarded input. A
      # gate-policy-only edit that dropped `workspace` from
      # `pending_parse_freshness` would compile zero tests, exit 0, and leave
      # every required check green — the exact silent-rot this gate exists to
      # catch. Compile-all-targets is the required merge surface that still
      # runs when only `.ci/` changes.
      - name: Freshness-gate cfg-binding contract (required merge surface)
        run: cargo test -p xtask --test gate_policy_profile_tests --locked -- freshness_gate_commands_satisfy_every_named_suite_cfg --nocapture
      # #13491: identical reasoning to the contracts above. The staged
      # product-topology contract lives in `xtask/src/bin/product-topology.rs`
      # (unit tests) and `xtask/tests/product_topology_cli.rs` (current-tree
      # reachability). The merge gate runs `cargo test --workspace --lib`,
      # which builds neither `--bin` nor `tests/` targets, and no workflow
      # names either one — so as authored the whole contract would compile and
      # never execute, the exact state #14585 found `file_policy` in. A
      # topology guard that cannot go red does not guard the topology.
      - name: Product-topology staged contract (required merge surface)
        run: |
          cargo test -p xtask --bin product-topology --locked -- --nocapture
          cargo test -p xtask --test product_topology_cli --locked -- --nocapture

      # #9777: the dead-code API disposition ledger's drift check lives in
      # `xtask/src/tasks/dead_code_api_ledger.rs` — a *bin* unit-test module.
      # Same failure mode as the changelog contract above (#13484): `--lib`
      # gates skip bin targets entirely, and unit_routed_full only executes via
      # advisory pr-smoke and only when the PR diff selects xtask. A public item
      # added to `crates/perl-parser/src/dead_code/mod.rs` alone therefore
      # touches no xtask path, so the ledger could go stale — the surface
      # growing an undispositioned item — with every required check green. That
      # is the exact guard-with-no-way-to-fail this ledger exists to prevent.
      # Filtered to this module rather than the whole bin suite on purpose: that
      # suite also carries inventory ratchets red on main today.
      # The ledger check proves the *record* matches the source. It does not run
      # the behavioral fixtures, so an analyzer change could contradict a
      # `never_produced`, `inert` or constant-confidence disposition while the
      # ledger stayed green. Both halves are required for the claim to hold.
      - name: Dead-code API ledger contract (required merge surface)
        run: |
          cargo test -p xtask --bin xtask --locked -- --nocapture dead_code_api_ledger
          cargo test -p perl-parser --test dead_code_api_compat --locked -- --nocapture

      # #16101: identical reasoning to the contracts above. This suite is the
      # only executable proof that the two required contexts mirror a
      # conclusion from their own bound integration rather than from whichever
      # aggregator posted last. It executes the real `Evaluate routed result`
      # shell block through real `jq` with a shimmed `gh`, so it is what catches
      # a regression in the app-id binding, in the newest-attempt ordering, or
      # in the self-exclusion that stops the mirror reading its own in-progress
      # check. The merge gate runs `cargo test --workspace --lib`, which builds
      # no `tests/` target, and no workflow named this one — so as authored the
      # contract could compile and never execute while a draft-run snapshot
      # silently overwrote a green required check.
      - name: Required-context mirror contract (required merge surface)
        run: cargo test -p xtask --test workflow_draft_snapshot_supersession --locked -- --nocapture

      # #16219: identical reasoning to the contracts above, in its most complete
      # form -- the activation inventory suite is reachable from no CI lane at
      # all. `xtask/tests/activation.rs` is a `tests/` target, so the merge
      # gate's `cargo test --workspace --lib` never builds it, and no workflow
      # named it. The only lane that executes xtask's `tests/` is
      # unit_routed_full, which is advisory and scope-aware, so it is silent
      # unless a diff happens to select xtask. The suite sat 21 passed / 42
      # failed on main while every required check stayed green (#16159).
      # The suite covers inventory drift as well as deriver behaviour:
      # `committed_inventory_matches_fresh_generation` calls
      # `activation::check_drift`, which regenerates in memory and byte-compares
      # against the committed artifact -- the same function `cargo xtask
      # activation generate` calls. Measured: injecting a gate into
      # `.ci/gate-policy.yaml` without regenerating gives 62 passed, 1 failed,
      # that test. So no separate drift step is needed, and this job is the
      # right surface for both, being the required check that still runs when
      # only `.ci/` changes and no crate is selected.
      - name: Activation inventory suite (required merge surface)
        run: cargo test -p xtask --test activation --locked -- --nocapture

  lsp-memory-smoke:
    name: LSP Memory Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [draft-pr-check, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-lsp-memory-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Build perllsp release binary
        run: cargo build --release -p perllsp --bin perllsp --locked

      - name: Run document-churn memory smoke
        run: |
          mkdir -p target/memory
          N_FILES=75 \
          N_CHANGES=5 \
          DO_WORKSPACE_SYMBOL=0 \
          DELETE_AFTER_CLOSE=1 \
          BINARY=./target/release/perllsp \
          python3 scripts/repro_lsp_storm.py \
            --json-out target/memory/pr-smoke-doc-churn.json \
            --csv-out target/memory/pr-smoke-doc-churn.csv \
            --settle-seconds 1 \
            --server-stderr target/memory/pr-smoke-doc-churn.server.log
          set +e
          python3 scripts/assert_rss_plateau.py \
            target/memory/pr-smoke-doc-churn.json \
            --summary-out target/memory/pr-smoke-doc-churn.plateau.json \
            --loose
          PLATEAU_STATUS=$?
          set -e
          case "$GITHUB_EVENT_NAME" in
            pull_request) RECEIPT_EVENT=pull_request ;;
            merge_group) RECEIPT_EVENT=merge_group ;;
            *) RECEIPT_EVENT=push ;;
          esac
          cargo xtask metrics memory \
            --workload-json target/memory/pr-smoke-doc-churn.json \
            --plateau-json target/memory/pr-smoke-doc-churn.plateau.json \
            --scenario lsp_doc_churn_delete_smoke \
            --receipt target/memory/receipts/pr-smoke-doc-churn.receipt.json \
            --commit "$GITHUB_SHA" \
            --event "$RECEIPT_EVENT" \
            --markdown >> "$GITHUB_STEP_SUMMARY"
          cargo xtask gate-receipts validate target/memory/receipts/pr-smoke-doc-churn.receipt.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path:
              raise SystemExit(0)

          plateau = json.loads(Path("target/memory/pr-smoke-doc-churn.plateau.json").read_text())
          payload = json.loads(Path("target/memory/pr-smoke-doc-churn.json").read_text())
          result = "passed" if plateau["passed"] else "failed"

          with open(summary_path, "a", encoding="utf-8") as fh:
              fh.write("## LSP memory smoke\n\n")
              fh.write("| Workload | Files | Tail growth KB | Median tail slope KB/file | Result |\n")
              fh.write("| --- | ---: | ---: | ---: | --- |\n")
              fh.write(
                  "| doc churn + delete "
                  f"| {payload['n_files']} "
                  f"| {plateau['tail_growth_kb']} "
                  f"| {plateau['median_tail_slope_kb_per_file']} "
                  f"| {result} |\n"
              )
          PY
          exit "$PLATEAU_STATUS"

      - name: Upload memory smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: lsp-memory-smoke-${{ github.sha }}
          path: |
            target/memory/pr-smoke-doc-churn.json
            target/memory/pr-smoke-doc-churn.csv
            target/memory/pr-smoke-doc-churn.plateau.json
            target/memory/pr-smoke-doc-churn.server.log
            target/memory/receipts/pr-smoke-doc-churn.receipt.json
          if-no-files-found: warn
          retention-days: 14

  # Standalone, candidate-bound formatter result. Live merge blocking is the
  # required Perl LSP Rust Small Result path (#9127/#12320). This job remains
  # the advisory receipt producer; duplicate meta-shard fmt execution is
  # retired (#9959). Settings-app promotion of this context remains #7087.
  rust-formatting:
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
      RECEIPT_PATH: target/receipts/rustfmt/rustfmt-check.json
    steps:
      - name: Checkout exact formatter subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned formatter toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Bind formatter evidence to the checked-out tree
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD^{commit})"
          test "$actual_sha" = "$SUBJECT_SHA"
          echo "SUBJECT_TREE_SHA=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Run candidate-bound rustfmt check
        shell: bash
        run: |
          set -euo pipefail
          rustfmt_bin="$(rustup which --toolchain 1.95.0 rustfmt)"
          rustc_bin="$(rustup which --toolchain 1.95.0 rustc)"
          python3 scripts/ci/rustfmt_check.py \
            --root . \
            --receipt "$RECEIPT_PATH" \
            --cargo "$(command -v cargo)" \
            --rustfmt "$rustfmt_bin" \
            --rustc "$rustc_bin" \
            --candidate-sha "$SUBJECT_SHA" \
            --candidate-tree-sha "$SUBJECT_TREE_SHA"

      - name: Verify candidate-bound rustfmt receipt
        shell: bash
        run: |
          set -euo pipefail
          rustfmt_bin="$(rustup which --toolchain 1.95.0 rustfmt)"
          rustc_bin="$(rustup which --toolchain 1.95.0 rustc)"
          python3 scripts/ci/verify_rustfmt_receipt.py \
            --root . \
            --receipt "$RECEIPT_PATH" \
            --producer scripts/ci/rustfmt_check.py \
            --cargo "$(command -v cargo)" \
            --rustfmt "$rustfmt_bin" \
            --rustc "$rustc_bin" \
            --candidate-sha "$SUBJECT_SHA" \
            --candidate-tree-sha "$SUBJECT_TREE_SHA"

      - name: Upload candidate-bound rustfmt receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: rustfmt-check-${{ env.SUBJECT_SHA }}
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 7
