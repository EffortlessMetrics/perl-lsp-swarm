name: CI

# Tiered CI for perl-lsp (see tests/TAXONOMY.md)
# - PR smoke: fast feedback on every push (~1-2 min)
# - Merge gate: full validation on every PR push and push to main (~5-10 min)
# Cost: ~$0.05 per PR (smoke + merge gate; see #4675 for rationale)

on:
  pull_request:
    branches: [ main, master ]
    # Deliberately exclude `labeled` / `unlabeled` — labels are navigation and
    # classification metadata, not CI authority. `ready_for_review` and
    # `converted_to_draft` are kept because they change the draft-pr-check guard
    # behavior and must trigger CI.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group: {}
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

# Cancel in-progress runs for PR events on new pushes; let push/merge_group runs complete.
# The preflight SHA-staleness check provides additional skip logic for superseded SHAs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  draft-pr-check:
    name: Draft PR guard
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      run_ci: ${{ steps.guard.outputs.run_ci }}
    steps:
      - name: Checkout for docs-only detection
        if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Decide whether full CI should run
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Non-PR event detected — running full CI"
          elif [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "run_ci=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Draft PR detected — skipping CI jobs until ready for review"
          else
            base_sha="${{ github.event.pull_request.base.sha }}"
            pr_number="${{ github.event.pull_request.number }}"
            pr_head_ref="refs/remotes/pr/${pr_number}/head"

            if ! git fetch --no-tags --depth=1 origin "${base_sha}" "pull/${pr_number}/head:${pr_head_ref}"; then
              echo "run_ci=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Could not fetch PR diff refs; running full CI fail-safe"
              exit 0
            fi

            mapfile -t changed_files < <(git diff --name-only "${base_sha}" "${pr_head_ref}")
            if [ "${#changed_files[@]}" -eq 0 ]; then
              echo "run_ci=true" >> "$GITHUB_OUTPUT"
              echo "::notice::No changed files detected — running full CI fail-safe"
              exit 0
            fi

            docs_only=true
            for path in "${changed_files[@]}"; do
              case "$path" in
                docs/*|*.md|vscode-extension/media/*|vscode-extension/snippets/*|tree-sitter-perl/examples/*)
                  ;;
                *)
                  docs_only=false
                  break
                  ;;
              esac
            done

            if [ "$docs_only" = "true" ]; then
              # The policy shard includes the generated non-Rust inventory
              # freshness gate. Keep the existing required CI contexts active
              # for docs/assets-only changes so tracked-file additions and
              # removals cannot bypass that check.
              echo "run_ci=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Docs/assets-only PR detected — running the policy shard for generated-inventory freshness"
            else
              echo "run_ci=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Non-draft PR with code/config changes — running merge-gate (pr-smoke, conflict-markers, shards, UX tests); supersede protection via preflight-latest-check (#1484)"
            fi
          fi

  # ── Preflight: skip superseded SHAs to save cost ─────────────────────
  preflight-latest-check:
    name: Preflight — is this SHA latest?
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: draft-pr-check
    if: needs.draft-pr-check.outputs.run_ci == 'true'
    outputs:
      is_latest: ${{ steps.check.outputs.is_latest }}
    steps:
      - name: Check if this SHA is latest on the ref
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          CURRENT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The freshness optimization (skip CI for superseded SHAs) is only
          # safe for push events on same-repo refs. For pull_request and
          # merge_group events, github.head_ref is attacker-controlled: a fork
          # author can name their branch "main" so the ls-remote resolves the
          # upstream branch, making every fork PR look "superseded" and
          # silently skipping all gated jobs (#5981).
          if [ "$EVENT_NAME" != "push" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR/merge_group event — freshness optimization bypassed for safety ($CURRENT)"
            exit 0
          fi

          LATEST=$(git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" "refs/heads/${BRANCH}" 2>/dev/null | awk '{print $1}')
          if [ -z "$LATEST" ] || [ "$LATEST" = "$CURRENT" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This SHA ($CURRENT) is latest on $BRANCH — running full CI"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Superseded by $LATEST — skipping remaining jobs to save cost"
          fi

  # ── Conflict-marker guard: <1s, no toolchain needed ─────────────────
  # Prevents committed conflict markers reaching master (see #7183).
  # Two incidents on 2026-04-28 each cost 1-3h of orchestrator + builder time.
  # Repository-owned cheap exact-head contracts (#3987). Advisory in C1;
  # existing required checks remain unchanged until parity is proven.
  repository-contract:
    name: Repository Contract (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    needs: [draft-pr-check, preflight-latest-check]
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.draft-pr-check.outputs.run_ci == 'true' &&
      needs.preflight-latest-check.outputs.is_latest == 'true'
    env:
      CONTRACT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      CONTRACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.CONTRACT_HEAD }}
          fetch-depth: 0
      - name: Install portable contract tools
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/aquaproj/aqua/v2/cmd/aqua@v2.57.0
          export PATH="$RUNNER_TEMP/bin:$PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          bash scripts/tools/aqua-doctor.sh
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-contract-${{ hashFiles('Cargo.lock') }}
      - name: Run Repository Contract
        run: |
          set +e
          cargo run -p xtask --locked -- ci-contract \
            --base "$CONTRACT_BASE" \
            --head "$CONTRACT_HEAD" \
            --receipt target/receipts/ci-contract.json \
            --summary target/receipts/ci-contract.md
          status=$?
          set -e
          if [ "$status" -eq 1 ] && [ -f target/receipts/ci-contract.json ]; then
            contract_status="$(jq -r '.status // empty' target/receipts/ci-contract.json 2>/dev/null || true)"
            if [ "$contract_status" = "POLICY_FINDING" ]; then
              echo "Repository Contract reported advisory policy findings; receipt is authoritative."
              exit 0
            fi
          fi
          exit "$status"
      - name: Upload Repository Contract receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: repository-contract-${{ env.CONTRACT_HEAD }}
          path: |
            target/receipts/ci-contract.json
            target/receipts/ci-contract.md
            target/receipts/repo-hygiene.json
            target/receipts/repo-hygiene.md
            target/ci-contract/changed-files.txt
          if-no-files-found: warn
          retention-days: 7

  conflict-markers:
    name: Conflict marker check
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [draft-pr-check, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
      - name: Check for conflict markers
        run: |
          matches=$(git ls-files -z | xargs -0 grep -lP '^(<{7} |>{7} |={7}$)' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "❌ Conflict markers found in committed files:"
            echo "$matches"
            echo ""
            echo "Run: grep -rn -P '^(<{7} |>{7} |={7}\$)' \$(git ls-files)"
            echo "to locate exact lines, then resolve and re-commit."
            exit 1
          fi
          echo "✅ No conflict markers found"

  # ── PR Smoke: advisory fast feedback for every PR ────────────────────
  # ADVISORY (continue-on-error): this lane runs the `pr-fast` xtask tier, whose
  # gates (fmt, conflict markers, publish/layer checks, and unit_routed_full) are
  # already covered — and split for parallelism — by the merge-gate-shards below,
  # which form the deterministic CI Gate base. Because pr-fast runs the unit tests
  # in one combined `unit_routed_full` lane, it is the flakier of the two and has
  # false-reddened green PRs (e.g. PR #3321: unit_routed_full exit 101 while all
  # seven CI Gate shards passed). It is not a required check and no longer gates
  # the CI Gate aggregate (removed from merge-gate `needs`). Kept advisory for its
  # combined-run signal + Codecov test-results upload; full removal is tracked in
  # the CI lean-down consolidation issue.
  pr-smoke:
    name: PR Smoke (Fast Feedback, advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    # Advisory: a pr-fast flake must not present as a hard red on an otherwise
    # green PR. The deterministic base (CI Gate shards + the two required lanes)
    # is the real gate.
    continue-on-error: true
    needs: [draft-pr-check, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
          # Fetch full history so ci-scope can diff against the explicit PR-fast base.
          fetch-depth: 0
          # release_history --verify-git resolves every release tag locally.
          fetch-tags: true

      - name: Fetch release tags from canonical repo
        run: |
          # Release tags live on EffortlessMetrics/perl-lsp; swarm origin has none.
          git fetch --force --tags https://github.com/EffortlessMetrics/perl-lsp.git '+refs/tags/v*:refs/tags/v*'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install just
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2.85.13
        with:
          tool: just

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-gate-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Select PR Smoke Cargo target
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /mnt ] && sudo mkdir -p /mnt/perl-lsp-swarm && sudo chown "$USER" /mnt/perl-lsp-swarm; then
            target_dir="/mnt/perl-lsp-swarm/pr-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          else
            target_dir="${RUNNER_TEMP:-$PWD/target}/cargo-target/pr-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          fi
          mkdir -p "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          echo "PR-fast CARGO_TARGET_DIR=$target_dir"
          df -h . "$target_dir" || true

      - name: Warm xtask
        run: cargo build -p xtask --locked

      - name: Run PR-fast via shared xtask gate runner
        run: |
          set +e
          # The target directory is selected before Warm xtask so gate commands reuse that build.
          # Gate receipts intentionally stay at target/receipts for upload steps.
          echo "PR-fast timeout policy: GitHub job 50m, outer runner watchdog 45m, per-gate timeouts recorded in target/receipts/receipt.json"
          timeout --signal=TERM --kill-after=60s 2700s "$CARGO_TARGET_DIR/debug/xtask" gates --tier pr-fast --base origin/main --receipt
          status=$?
          case "$status" in
            124)
              echo "::error::PR-fast hit the 45m runner watchdog before xtask produced a final receipt"
              ;;
            137|143)
              echo "::error::PR-fast was cancelled by the runner or process group (exit $status)"
              ;;
          esac
          exit "$status"

      - name: Upload PR-fast receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: pr-fast-receipt-${{ github.sha }}
          path: |
            target/receipts/receipt.json
            target/receipts/logs/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Convert PR-fast receipt to JUnit
        if: always()
        run: |
          python3 scripts/ci/receipts-to-junit.py \
            --input target/receipts/receipt.json \
            --output target/test-results/pr-fast-junit.xml \
            --suite-name pr-fast

      - name: Upload PR-fast test results to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/test-results/pr-fast-junit.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Note: workspace-wide integration-test compilation is covered by the
      # parallel check-all-targets job (just check-all-targets), which runs
      # cargo check --workspace --all-targets --locked independently of pr-smoke.
      # Adding a redundant fallback here would duplicate that work without gain.

  # ── Merge Gate shards: bounded validation lanes for every PR/push ────
  merge-gate-shards:
    name: CI Gate shard (${{ matrix.name }})
    runs-on: ubuntu-24.04
    # Outer runaway guard only — per-lane enforcement is gate-level
    # timeout_seconds in .ci/gate-policy.yaml, which this does not relax.
    # Raised 20 -> 30 with #5425. Measured job wall time on run 30622858284:
    # lsp 18.6 min, meta 16.4 min. At 20 the busiest shards had 1.4 and 3.6 min
    # of headroom, so a ~10% slower runner would kill the job outright — the
    # same merge-blocking symptom the gate split fixes, one level up.
    timeout-minutes: 30
    # No functional dependency on pr-smoke output; run in parallel after preflight
    # + conflict guard to reduce end-to-end merge-gate wall time.
    needs: [draft-pr-check, conflict-markers, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: meta
            gates: fmt ignored_tests_check_refs check_conflict_markers release_history readme_heading_check publish_closure publish_manifest_check layer_check published_crate_count_pr_fast release_history_check perl_token_leaf_contract compile_all_targets clippy_full
          - name: foundation
            gates: unit_foundation_full
          - name: parser_stack
            gates: unit_parser_stack_full parser_integration
          - name: analysis
            gates: unit_analysis_full
          - name: lsp
            gates: unit_lsp_core_full unit_lsp_full lsp_smoke
          - name: support
            gates: unit_dap_support_full
          - name: corpus
            gates: common_corpus_clean
          - name: policy
            # The cheapest control remains first for fast diagnosis, but the
            # shard runner now records every independent member before it
            # returns the aggregate failure verdict.
            gates: msrv_authority_sync compiler_concept_ledger compiler_proof_policy compiler_concept_proof docs_build adr_link_check non_rust_inventory_check v2_bundle_sync nested_lock_check version_sync
    permissions:
      contents: read
    # Run on every PR push and on push to main/master
    # Earlier gating > label-gated gating (see #4675)
    # Frequent commits will queue; preflight skips superseded SHAs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
          # Release-history verification compares every fetched release tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Reject unsupported PR attributions in reference docs
        if: matrix.name == 'meta'
        run: |
          if git grep -n -E 'PR #153|pull/153|PR #753|pull/753' -- docs/reference ':(exclude)docs/reference/archive/**'; then
            echo "Reference documentation contains an unsupported numbered PR attribution."
            echo "Use a source-backed implementation reference, or remove the PR attribution when the source is historical."
            exit 1
          fi

      - name: Fetch release tags from canonical repo
        run: |
          # Release tags live on EffortlessMetrics/perl-lsp; swarm origin has none.
          git fetch --force --tags https://github.com/EffortlessMetrics/perl-lsp.git '+refs/tags/v*:refs/tags/v*'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install just
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2.85.13
        with:
          tool: just

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-gate-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Warm xtask
        run: cargo build -p xtask --locked

      - name: Verify complete shard runner falsifiers
        if: matrix.name == 'meta'
        run: python3 -m unittest scripts/ci/test_run_gate_shard.py

      - name: Run merge-gate shard with receipts
        shell: bash
        env:
          SHARD_NAME: ${{ matrix.name }}
          SHARD_GATES: ${{ matrix.gates }}
        run: |
          set +e
          (
            while true; do
              sleep 30
              printf 'ci-gate shard %s still running at %s\n' "$SHARD_NAME" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          subject_sha="$(git rev-parse 'HEAD^{commit}')"
          mkdir -p target/receipts/shards target/receipts/shard-summaries
          timeout --signal=TERM --kill-after=30s 1200s \
            python3 scripts/ci/run_gate_shard.py \
              --xtask target/debug/xtask \
              --receipt-dir target/receipts/shards \
              --summary "target/receipts/shard-summaries/${SHARD_NAME}.json" \
              --subject-sha "$subject_sha" \
              $SHARD_GATES
          status=$?
          case "$status" in
            124)
              echo "::error::Shard hit the 20m inner watchdog; completed receipts and the partial shard summary remain available"
              ;;
            137|143)
              echo "::error::Shard was cancelled by the runner or process group (exit $status)"
              ;;
          esac
          exit "$status"

      - name: Verify parser integration receipt subject
        if: always() && matrix.name == 'parser_stack'
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/ci")
          import run_parser_integration

          run_parser_integration.validate_receipt_subject(
              Path.cwd(),
              Path("target/receipts/parser-integration.json"),
              Path(".ci/parser-integration-targets.json"),
              Path(".ci/parser-integration-targets.lock.json"),
          )

      - name: Upload gate receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: gate-receipt-${{ matrix.name }}-${{ github.sha }}
          path: |
            target/receipts/shards/*.json
            target/receipts/shard-summaries/*.json
            target/receipts/logs/*.log
            target/receipts/artifacts/*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload parser integration receipt
        if: always() && matrix.name == 'parser_stack'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: parser-integration-receipt-${{ github.sha }}
          path: target/receipts/parser-integration.json
          if-no-files-found: error
          retention-days: 7

      - name: Convert gate shard receipts to JUnit
        if: always()
        run: |
          python3 scripts/ci/receipts-to-junit.py \
            --input target/receipts/shards \
            --output target/test-results/gate-shard-${{ matrix.name }}-junit.xml \
            --suite-name "gate-${{ matrix.name }}"

      - name: Emit CI actuals (LEM telemetry)
        # Reads gate receipts produced above and writes target/ci/ci-actuals.json
        # for the calibration pipeline. See docs/ci/ci-actuals.md and
        # docs/ci/learned-estimates.md. Tolerant of missing data.
        if: always()
        continue-on-error: true
        run: |
          mkdir -p target/ci
          python3 scripts/ci/emit_ci_actuals.py \
            --receipts-dir target/receipts/shards \
            --lane-id merge_gate_shards \
            --workflow "${{ github.workflow }}" \
            --sha "${{ github.sha }}" \
            --pr "${{ github.event.pull_request.number || 0 }}" \
            --json-out "target/ci/ci-actuals-${{ matrix.name }}.json" || true

      - name: Upload CI actuals
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: ci-actuals-${{ matrix.name }}-${{ github.sha }}
          path: target/ci/ci-actuals-${{ matrix.name }}.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload gate shard test results to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/test-results/gate-shard-${{ matrix.name }}-junit.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Dump gate failures on error
        if: failure()
        run: |
          echo "=== gate receipts (tail) ==="
          find target/receipts/shards -name '*.json' -maxdepth 1 -print -exec tail -120 {} \; || true
          echo "=== shard summary ==="
          find target/receipts/shard-summaries -name '*.json' -maxdepth 1 -print -exec cat {} \; || true
          echo "=== failed gates ==="
          python3 - <<'PY' || true
          import json, pathlib
          for p in pathlib.Path("target/receipts/shards").glob("*.json"):
              data = json.loads(p.read_text())
              for g in data.get("gates", []):
                  if str(g.get("status", "")).lower() not in ("passed", "pass", "skipped", "skip"):
                      print(f"- {p.name}: {g.get('gate_name', g.get('name', '<unnamed>'))}: {g.get('status', '')} (exit {g.get('exit_code', '?')})")
          PY

      - name: Gate summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          shard_name = os.environ.get("SHARD_NAME", "")
          shard_summary = Path("target/receipts/shard-summaries") / f"{shard_name}.json"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          if not summary_path:
              raise SystemExit(0)

          lines = [f"### CI Gate shard: {shard_name}", ""]
          if not shard_summary.is_file():
              lines.append("Shard summary not found.")
              Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")
              raise SystemExit(0)

          payload = json.loads(shard_summary.read_text(encoding="utf-8"))
          lines.append("| Gate | Result | Receipt status | Exit | Duration (s) |")
          lines.append("| --- | --- | --- | --- | --- |")
          for gate in payload.get("gates", []):
              dur_ms = gate.get("duration_ms")
              dur_s = f"{dur_ms / 1000:.1f}" if isinstance(dur_ms, int) else ""
              lines.append(
                  f"| {gate.get('gate_name', '')} | {gate.get('result', '')} | "
                  f"{gate.get('receipt_status') or ''} | {gate.get('exit_code') if gate.get('exit_code') is not None else ''} | {dur_s} |"
              )
          non_success = payload.get("summary", {}).get("non_success_gates", [])
          if non_success:
              lines.extend(["", f"Non-success gates: {', '.join(non_success)}"])

          Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
        env:
          SHARD_NAME: ${{ matrix.name }}

  # ── CI Gate aggregate: roll up the deterministic shard + guard lanes ──
  # NOTE ON NAME: this check is NOT a branch-protection required context. The
  # required contexts are "Perl LSP Rust Small Result", "ripr+ New Gap Gate", and
  # "Compile All Targets (bit-rot guard)" — the last of which is defined in this
  # same workflow, below. `.ci/policies/required-checks.toml` is the inventory of
  # record; keep it and this comment in step with the live ruleset.
  #
  # The previous name "CI Gate
  # (Merge-Blocking)" was a misnomer — it never blocked merge — and it read as a
  # scary hard-red on green PRs. Renamed to "CI Gate (Advisory Aggregate)" to stop
  # misleading readers. `pr-smoke` is intentionally NOT in `needs` below: it is an
  # advisory, flaky, redundant lane (see the pr-smoke job) and must not false-red
  # this aggregate.
  merge-gate:
    name: CI Gate (Advisory Aggregate)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs:
      - draft-pr-check
      - preflight-latest-check
      - conflict-markers
      - check-all-targets
      - ux-tests
      - merge-gate-shards
    if: always() && needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    permissions:
      statuses: write
    steps:
      - name: Gate summary
        shell: bash
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          needs = json.loads(os.environ["NEEDS_JSON"])
          lines = ["### CI Gate aggregate", ""]
          lines.append("| Dependency | Result |")
          lines.append("| --- | --- |")
          failed = []
          for name, value in sorted(needs.items()):
              result = value.get("result", "")
              lines.append(f"| {name} | {result} |")
              # "cancelled" means a GitHub concurrency-group kill on a superseded SHA —
              # infra-noise, not a real failure.  "skipped" is an intentional gate bypass.
              # Only genuine "failure" / "timed_out" / etc. block the merge gate.
              # The agent-level classifier (green-ci-check, #351) remains the authoritative
              # routing interpretation for per-PR check states.
              if result not in ("success", "skipped", "cancelled"):
                  failed.append(name)

          if failed:
              lines.extend(["", f"Blocking dependency failure(s): {', '.join(failed)}"])
          else:
              lines.extend(["", "All merge-gate dependencies passed."])

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")

          if failed:
              raise SystemExit(1)
          PY

      - name: Set PR status (check)
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS_JSON || '{}');
            // Mirror the Gate summary classifier: cancelled (concurrency-group kill on
            // superseded SHA) and skipped are non-blocking; only failure/timed_out/etc block.
            const failed = Object.entries(needs)
              .filter(([name, value]) => !['success', 'skipped', 'cancelled'].includes(value.result))
              .map(([name]) => name);
            const status = failed.length === 0 ? 'success' : 'failure';
            const description = failed.length === 0
              ? 'All merge-gate dependencies passed'
              : `Failed dependency: ${failed.join(', ')}`;

            console.log(`Setting PR status to: ${status}`);
            console.log(`Description: ${description}`);

            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: status,
                context: 'ci/merge-gate',
                description,
                target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
              });
            } catch (error) {
              if (error.status === 403) {
                core.warning(`Could not create ci/merge-gate commit status from this workflow context: ${error.message}`);
              } else {
                throw error;
              }
            }

  # ── UX Tests: first-5-minutes scenario regression suite ──────────────
  ux-tests:
    name: UX Regression Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # UX suite does not consume pr-smoke artifacts/results; parallelize after preflight.
    needs: [draft-pr-check, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    # Run on every PR push — this is the regression prevention gate.
    # Flakiness note: 11 active entries in .ci/ux-flakes.json (all scenario_14 / @INC
    # conformance tests) are registered as quarantine_effect=non_blocking_pr but that
    # registry is advisory only — it is NOT enforced here. If any scenario_14 test
    # fails this job fails and merge-gate blocks. Quarantine enforcement (reading the
    # registry to generate --skip flags) is a follow-up; see .ci/ux-flakes.json.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify tested candidate identity
        env:
          TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse 'HEAD^{commit}')"
          if [ "$actual_sha" != "$TESTED_SHA" ]; then
            printf '::error::Checked-out candidate %s does not match tested SHA %s\n' \
              "$actual_sha" "$TESTED_SHA"
            exit 1
          fi
          printf 'Testing exact candidate %s\n' "$TESTED_SHA"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Install just
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2.85.13
        with:
          tool: just

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-ux-tests-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Build perllsp binary
        run: cargo build -p perllsp --bin perllsp

      - name: Run UX regression tests
        id: ux_tests
        continue-on-error: true
        env:
          PERL_LSP_BIN: ${{ github.workspace }}/target/debug/perllsp
          RUST_TEST_THREADS: "1"
        run: |
          set -o pipefail
          mkdir -p target/receipts
          set +e
          just ux-tests 2>&1 | tee target/receipts/ux-regression.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test_status="${pipeline_status[0]}"
          tee_status="${pipeline_status[1]}"
          printf '%s\n' "$test_status" > target/receipts/ux-regression.exit
          if [ "$tee_status" -ne 0 ]; then
            printf '%s\n' "$tee_status" > target/receipts/ux-regression.instrumentation.exit
            printf '::error::UX regression tee failed with status %s\n' "$tee_status" >&2
            exit "$tee_status"
          fi
          printf '0\n' > target/receipts/ux-regression.instrumentation.exit
          exit "$test_status"

      - name: Emit UX regression receipt
        if: always()
        env:
          TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          cargo xtask ux-regression-receipt \
            --input target/receipts/ux-regression.log \
            --receipt target/receipts/ux-regression.json \
            --exit-status-file target/receipts/ux-regression.exit \
            --sha "$TESTED_SHA"

      - name: Verify receipt subject identity
        id: verify_receipt
        if: always()
        env:
          TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt_path = Path("target/receipts/ux-regression.json")
          instrumentation_path = Path("target/receipts/ux-regression.instrumentation.exit")
          if not instrumentation_path.is_file() or instrumentation_path.is_symlink():
              raise SystemExit("UX receipt instrumentation status is missing or not a regular file")
          if instrumentation_path.read_text(encoding="utf-8").strip() != "0":
              raise SystemExit("UX receipt instrumentation failed")
          if not receipt_path.is_file() or receipt_path.is_symlink():
              raise SystemExit("UX receipt is missing or not a regular file")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          if receipt.get("sha") != os.environ["TESTED_SHA"]:
              raise SystemExit(
                  f"UX receipt subject {receipt.get('sha')!r} does not match "
                  f"{os.environ['TESTED_SHA']}"
              )
          PY

      - name: Upload UX regression evidence
        if: always() && steps.verify_receipt.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: ux-regression-receipt-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            target/receipts/ux-regression.json
            target/receipts/ux-regression.log
            target/receipts/ux-regression.exit
            target/receipts/ux-regression.instrumentation.exit
            target/receipts/editor-ux/golden-editor-workload-v3.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unverified UX diagnostics
        if: always() && steps.verify_receipt.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: ux-regression-unverified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/receipts/ux-regression.json
            target/receipts/ux-regression.log
            target/receipts/ux-regression.exit
            target/receipts/ux-regression.instrumentation.exit
          if-no-files-found: warn
          retention-days: 7

      - name: Convert UX regression receipt to JUnit
        if: always()
        run: |
          python3 scripts/ci/receipts-to-junit.py \
            --input target/receipts/ux-regression.json \
            --output target/test-results/ux-regression-junit.xml \
            --suite-name ux-regression

      - name: Upload UX regression test results to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/test-results/ux-regression-junit.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: UX regression summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          receipt_path = Path("target/receipts/ux-regression.json")
          log_path = Path("target/receipts/ux-regression.log")
          lines = ["### UX Regression Receipt", ""]
          lines.append(f"- Receipt: `{receipt_path}`")
          lines.append(f"- Log: `{log_path}`")

          if receipt_path.exists():
              data = json.loads(receipt_path.read_text(encoding="utf-8"))
              lines.append(f"- Result: `{data.get('result', 'unknown')}`")
              if data.get("failure_class"):
                  lines.append(f"- Failure class: `{data.get('failure_class')}`")
              if data.get("route"):
                  lines.append(f"- Route: `{data.get('route')}`")
              if data.get("merge_action"):
                  lines.append(f"- Merge action: `{data.get('merge_action')}`")
              if data.get("first_failing_test"):
                  lines.append(f"- First failing test: `{data.get('first_failing_test')}`")
              if data.get("first_failing_line"):
                  lines.append(f"- First failing line: `{data.get('first_failing_line')}`")
              if data.get("canonical_repro"):
                  lines.append(f"- Repro: `{data.get('canonical_repro')}`")
              if data.get("human_summary"):
                  lines.append(f"- Summary: {data.get('human_summary')}")
          else:
              lines.append("- Receipt unavailable.")

          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Fail UX regression gate on test failures
        if: steps.ux_tests.outcome == 'failure'
        run: exit 1

  # ── Compile All Targets: catch integration-test + bench bit-rot ───────
  check-all-targets:
    name: Compile All Targets (bit-rot guard)
    runs-on: ubuntu-24.04
    # +5m headroom for the focused emacs docs contract after workspace check.
    timeout-minutes: 15
    needs: [draft-pr-check, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    steps:
      # INTENTIONAL: no `ref:` override here — see #9594.
      #
      # For a pull_request event the workflow *definition* comes from the base
      # branch, so pinning the head SHA runs base's step list against the
      # candidate's tree. When one commit adds a required step and the file it
      # depends on together (as d5064c4d did for the Emacs docs contract), every
      # PR branched before it inherits the step without the file, and this
      # required check fails on branch age rather than on content.
      #
      # Omitting `ref` checks out the event's own ref — the merge ref for a
      # pull_request — so the definition and the tree stay one coherent
      # integration subject. That is also what a bit-rot guard should measure:
      # whether what would actually land still compiles. Other jobs in this
      # workflow deliberately keep exact-head checkout for head-pinned receipts;
      # this one is a merge-surface gate and must not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Install just
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2.85.13
        with:
          tool: just

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-all-targets-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Compile all targets (catches integration-test + bench bit-rot)
        run: just check-all-targets

      # Required merge surface for #7767/#7796: unit_routed_full only executes via
      # advisory pr-smoke, so stale Emacs guidance could otherwise merge while this
      # contract merely compiles. Keep the oracle on Compile All Targets.
      - name: Emacs docs contract (required merge surface)
        run: cargo test -p xtask --test emacs_docs_contract --locked -- --nocapture

  lsp-memory-smoke:
    name: LSP Memory Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [draft-pr-check, preflight-latest-check]
    if: needs.draft-pr-check.outputs.run_ci == 'true' && needs.preflight-latest-check.outputs.is_latest == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: ci-lsp-memory-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Build perllsp release binary
        run: cargo build --release -p perllsp --bin perllsp --locked

      - name: Run document-churn memory smoke
        run: |
          mkdir -p target/memory
          N_FILES=75 \
          N_CHANGES=5 \
          DO_WORKSPACE_SYMBOL=0 \
          DELETE_AFTER_CLOSE=1 \
          BINARY=./target/release/perllsp \
          python3 scripts/repro_lsp_storm.py \
            --json-out target/memory/pr-smoke-doc-churn.json \
            --csv-out target/memory/pr-smoke-doc-churn.csv \
            --settle-seconds 1 \
            --server-stderr target/memory/pr-smoke-doc-churn.server.log
          set +e
          python3 scripts/assert_rss_plateau.py \
            target/memory/pr-smoke-doc-churn.json \
            --summary-out target/memory/pr-smoke-doc-churn.plateau.json \
            --loose
          PLATEAU_STATUS=$?
          set -e
          case "$GITHUB_EVENT_NAME" in
            pull_request) RECEIPT_EVENT=pull_request ;;
            merge_group) RECEIPT_EVENT=merge_group ;;
            *) RECEIPT_EVENT=push ;;
          esac
          cargo xtask metrics memory \
            --workload-json target/memory/pr-smoke-doc-churn.json \
            --plateau-json target/memory/pr-smoke-doc-churn.plateau.json \
            --scenario lsp_doc_churn_delete_smoke \
            --receipt target/memory/receipts/pr-smoke-doc-churn.receipt.json \
            --commit "$GITHUB_SHA" \
            --event "$RECEIPT_EVENT" \
            --markdown >> "$GITHUB_STEP_SUMMARY"
          cargo xtask gate-receipts validate target/memory/receipts/pr-smoke-doc-churn.receipt.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path:
              raise SystemExit(0)

          plateau = json.loads(Path("target/memory/pr-smoke-doc-churn.plateau.json").read_text())
          payload = json.loads(Path("target/memory/pr-smoke-doc-churn.json").read_text())
          result = "passed" if plateau["passed"] else "failed"

          with open(summary_path, "a", encoding="utf-8") as fh:
              fh.write("## LSP memory smoke\n\n")
              fh.write("| Workload | Files | Tail growth KB | Median tail slope KB/file | Result |\n")
              fh.write("| --- | ---: | ---: | ---: | --- |\n")
              fh.write(
                  "| doc churn + delete "
                  f"| {payload['n_files']} "
                  f"| {plateau['tail_growth_kb']} "
                  f"| {plateau['median_tail_slope_kb_per_file']} "
                  f"| {result} |\n"
              )
          PY
          exit "$PLATEAU_STATUS"

      - name: Upload memory smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: lsp-memory-smoke-${{ github.sha }}
          path: |
            target/memory/pr-smoke-doc-churn.json
            target/memory/pr-smoke-doc-churn.csv
            target/memory/pr-smoke-doc-churn.plateau.json
            target/memory/pr-smoke-doc-churn.server.log
            target/memory/receipts/pr-smoke-doc-churn.receipt.json
          if-no-files-found: warn
          retention-days: 14

  # Standalone, candidate-bound formatter result for protected integration.
  # Keep the existing advisory `fmt` meta-shard during the parity window tracked
  # by #7087; this independently visible context is the ruleset promotion target.
  rust-formatting:
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
      RECEIPT_PATH: target/receipts/rustfmt/rustfmt-check.json
    steps:
      - name: Checkout exact formatter subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned formatter toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Bind formatter evidence to the checked-out tree
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD^{commit})"
          test "$actual_sha" = "$SUBJECT_SHA"
          echo "SUBJECT_TREE_SHA=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Run candidate-bound rustfmt check
        shell: bash
        run: |
          set -euo pipefail
          rustfmt_bin="$(rustup which --toolchain 1.95.0 rustfmt)"
          rustc_bin="$(rustup which --toolchain 1.95.0 rustc)"
          python3 scripts/ci/rustfmt_check.py \
            --root . \
            --receipt "$RECEIPT_PATH" \
            --cargo "$(command -v cargo)" \
            --rustfmt "$rustfmt_bin" \
            --rustc "$rustc_bin" \
            --candidate-sha "$SUBJECT_SHA" \
            --candidate-tree-sha "$SUBJECT_TREE_SHA"

      - name: Verify candidate-bound rustfmt receipt
        shell: bash
        run: |
          set -euo pipefail
          rustfmt_bin="$(rustup which --toolchain 1.95.0 rustfmt)"
          rustc_bin="$(rustup which --toolchain 1.95.0 rustc)"
          python3 scripts/ci/verify_rustfmt_receipt.py \
            --root . \
            --receipt "$RECEIPT_PATH" \
            --producer scripts/ci/rustfmt_check.py \
            --cargo "$(command -v cargo)" \
            --rustfmt "$rustfmt_bin" \
            --rustc "$rustc_bin" \
            --candidate-sha "$SUBJECT_SHA" \
            --candidate-tree-sha "$SUBJECT_TREE_SHA"

      - name: Upload candidate-bound rustfmt receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: rustfmt-check-${{ env.SUBJECT_SHA }}
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 7
