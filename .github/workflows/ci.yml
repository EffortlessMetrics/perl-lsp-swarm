name: CI

on:
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contabo-proof:
    name: Contabo Proof (Primary)
    uses: EffortlessMetrics/em-ci-workflows/.github/workflows/rust.yml@33b78e885ffc90798a08e93bfe08bd91c47b0999
    with:
      profile: standard
      script: .ci/rust-standard-proof.sh

  fallback-proof:
    name: GitHub Hosted Proof (Fallback)
    needs: [contabo-proof]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Run proof
        run: .ci/rust-standard-proof.sh

  result:
    name: CI Result
    needs: [contabo-proof, fallback-proof]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.contabo-proof.result }}" == "success" ]]; then
            echo "Contabo standard proof succeeded."
            exit 0
          elif [[ "${{ needs.fallback-proof.result }}" == "success" ]]; then
            echo "Contabo proof failed or was unavailable; GitHub hosted fallback proof succeeded."
            exit 0
          else
            echo "Both Contabo proof and GitHub fallback failed."
            exit 1
          fi
