name: VS Code Managed Binary Smoke

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main, master]
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/vscode-managed-binary-smoke.yml'
  schedule:
    - cron: '0 13 * * 1'

concurrency:
  group: vscode-managed-binary-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  managed-binary-smoke:
    name: VS Code smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Perl
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061  # v1.43.1
        with:
          perl-version: '5.40'

      - name: Setup VS Code toolchain
        uses: ./.github/actions/setup-vscode-toolchain

      - name: Test TypeScript authority shim parsing
        run: node --test scripts/check-typescript-authority-windows-shim.test.js

      - name: Verify TypeScript 7 compiler authority
        run: npm run typecheck:authority

      - name: Compile extension
        run: npm run bundle

      - name: Run extension-host smoke
        if: runner.os != 'Linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run test:integration

      - name: Run extension-host smoke under Xvfb
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: xvfb-run -a npm run test:integration

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c47aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vscode-smoke-source-${{ matrix.os }}
          path: target/receipts/vscode-smoke/**
          if-no-files-found: warn
          retention-days: 14

  perl5-alias-smoke:
    # Real-client alias proof for the perl/perl5 language-ID contract (#7699):
    # a perl5-classified document must flow activation → client → server with
    # published diagnostics and a provider result. Runs the focused smoke with
    # the perl5-alias-language fixture development extension.
    name: VS Code perl5 alias smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Perl
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061  # v1.43.1
        with:
          perl-version: '5.40'

      - name: Setup VS Code toolchain
        uses: ./.github/actions/setup-vscode-toolchain

      - name: Compile extension
        run: npm run bundle

      - name: Run perl5 alias extension-host smoke under Xvfb
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PERL_LSP_ALIAS_SMOKE: '1'
          PERL_LSP_SMOKE_SOURCE_LABEL: 'perl5-alias'
        run: xvfb-run -a npm run test:integration -- --grep "alias extension-host smoke"

      - name: Upload alias smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c47aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vscode-smoke-perl5-alias-ubuntu
          path: target/receipts/vscode-smoke/perl5-alias/**
          if-no-files-found: warn
          retention-days: 14
