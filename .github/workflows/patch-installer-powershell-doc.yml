name: Patch PowerShell installer documentation

on:
  push:
    branches: [agent/installer-powershell-checksum-6097]
    paths: ['.github/workflows/patch-installer-powershell-doc.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout builder commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply exact documentation correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/how-to/INSTALLATION.md')
          text = path.read_text(encoding='utf-8')
          old = '''[`install.ps1`](../../install.ps1) in this repository already carries the fix,
but the publication repo has not been synced
([#4348](https://github.com/EffortlessMetrics/perl-lsp-swarm/issues/4348)).
Once it is, the script will download the matching release zip, verify it
against `SHA256SUMS` when that file downloads successfully (warning and
continuing if it does not), and install `perllsp.exe` into
`%USERPROFILE%\\.local\\bin`.
'''
          new = '''[`install.ps1`](../../install.ps1) in this repository already carries the asset-name fix,
but the publication repo has not been synced
([#4348](https://github.com/EffortlessMetrics/perl-lsp-swarm/issues/4348)).
Once it is, the script will require `SHA256SUMS` before downloading the release
zip, require exactly one lowercase SHA-256 row for the exact selected asset,
and verify the downloaded archive before extraction. Missing, duplicate,
malformed, or mismatched checksum evidence fails closed. This proves archive
integrity against the co-hosted manifest; it does not independently prove
publisher provenance, safe archive members, atomic replacement, or rollback.
The script installs into `%USERPROFILE%\\.local\\bin` by default.
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one exact paragraph, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify bounded diff
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "docs/how-to/INSTALLATION.md"
          git diff --check
          rg -n 'require `SHA256SUMS`|fails closed|does not independently prove' docs/how-to/INSTALLATION.md

      - name: Commit validated documentation repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add docs/how-to/INSTALLATION.md
          git commit -m 'docs(install): record required PowerShell checksums (#6097)'
          gh auth setup-git
          git push origin HEAD:agent/installer-powershell-checksum-6097
