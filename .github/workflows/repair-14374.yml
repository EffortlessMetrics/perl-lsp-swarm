name: Integrate non-Rust exact-tree policy

on:
  push:
    branches:
      - codex/14161-exact-tree-non-rust-policy

permissions:
  contents: write

concurrency:
  group: integrate-non-rust-policy-14161
  cancel-in-progress: true

jobs:
  integrate:
    if: github.repository == 'EffortlessMetrics/perl-lsp-swarm'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Rebuild, regenerate, verify, and push the integrated candidate
        env:
          SOURCE_HEAD: 93c5830bf1767c8e7fab638f7622378a3906ce29
          BASE_SHA: b9800cf61544fd2acf379e4ec5fecbabd95874c9
          TARGET_BRANCH: codex/14161-exact-tree-non-rust-policy
        run: python3 scripts/maintenance/integrate_non_rust_policy_14161.py
