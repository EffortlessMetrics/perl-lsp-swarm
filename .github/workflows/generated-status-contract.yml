name: Generated Status Contract

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/project/status/**'
      - 'policy/generated-status-contract.toml'
      - '.ci/schemas/generated-status-cell.schema.json'
      - 'xtask/src/bin/generated-status-contract.rs'
      - 'xtask/src/tasks/update_status/**'
      - '.github/workflows/generated-status-contract.yml'
  workflow_dispatch: {}

concurrency:
  group: generated-status-contract-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate generated status truth
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Test status projection contract
        run: cargo test -p xtask --bin generated-status-contract --locked

      - name: Validate current generated status
        run: |
          cargo run -p xtask --bin generated-status-contract --locked -- \
            --receipt target/receipts/generated-status-contract.json

      - name: Upload generated status receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: generated-status-contract-receipt
          path: target/receipts/generated-status-contract.json
          if-no-files-found: error
          retention-days: 14
