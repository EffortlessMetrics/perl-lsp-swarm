name: Generated Status Contract

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'features.toml'
      - 'crates/perl-lsp-rs/features_sot.toml'
      - 'crates/perl-lsp-rs-core/features_sot.toml'
      - 'crates/perl-parser/features_sot.toml'
      - 'crates/perl-dap/features_sot.toml'
      - 'policy/ga-evidence-policy.toml'
      - 'docs/project/status/**'
      - 'docs/project/ROADMAP.md'
      - 'crates/perl-lsp-rs-core/src/feature_catalog.rs'
      - 'crates/perl-lsp-rs-core/src/feature_evidence.rs'
      - 'policy/generated-status-evidence.json'
      - '.ci/schemas/generated-status-cell.schema.json'
      - 'xtask/Cargo.toml'
      - 'xtask/src/bin/generated-status-contract.rs'
      - 'xtask/src/bin/catalog-authority.rs'
      - 'xtask/src/tasks/update_status/**'
      - 'xtask/src/tasks/features.rs'
      - '.github/workflows/generated-status-contract.yml'
  workflow_dispatch: {}

concurrency:
  group: generated-status-contract-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate generated status truth
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Resolve status projection targets
        run: |
          cargo metadata --no-deps --format-version 1 | jq -e '.packages[] | select(.name == "xtask") | .targets[] | select(.name == "generated-status-contract" and (.kind | index("bin")))'
          cargo metadata --no-deps --format-version 1 | jq -e '.packages[] | select(.name == "xtask") | .targets[] | select(.name == "catalog-authority" and (.kind | index("bin")))'
          ! cargo metadata --no-deps --format-version 1 | jq -e '.packages[] | select(.name == "xtask") | .targets[] | select(.name == "generated-status-contract-missing")'

      - name: Test status projection contract
        run: cargo test -p xtask --bin generated-status-contract --locked

      - name: Validate current generated status
        run: |
          cargo run -p xtask --bin generated-status-contract --locked -- \
            --check

      - name: Test catalog authority gate
        run: cargo test -p xtask --bin catalog-authority --locked

      - name: Catalog claims match their evidence
        run: cargo run -p xtask --bin catalog-authority --locked -- check-catalog

      - name: Vendored catalogs are authority projections
        run: cargo run -p xtask --bin catalog-authority --locked -- sync-vendored

      - name: Claim status surface is current
        run: cargo run -p xtask --bin catalog-authority --locked -- sync-status
