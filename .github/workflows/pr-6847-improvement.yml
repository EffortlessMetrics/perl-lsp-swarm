name: PR 6847 Improvement

on:
  push:
    branches:
      - claude/modest-gauss-o5n7ks

permissions:
  contents: write

jobs:
  apply:
    name: Apply reviewed PR 6847 improvements
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: claude/modest-gauss-o5n7ks
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Apply bounded patch
        run: python3 scripts/ci/apply_pr_6847_improvement.py

      - name: Format and verify focused contracts
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p xtask --test gate_policy_profile_tests --locked inline_completion_gates_are_split_scoped_ordered_and_budgeted
          cargo test -p xtask --locked gate_runner_reports_independent_results_when_a_peer_fails
          git diff --check

      - name: Commit reviewed improvement
        run: |
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add .ci/gate-policy.yaml xtask/src/tasks/gates.rs xtask/tests/gate_policy_profile_tests.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix(ci): preserve inline contract family semantics (#6845)"
          git push origin HEAD:claude/modest-gauss-o5n7ks
