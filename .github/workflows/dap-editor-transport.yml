name: DAP Editor Transport

on:
  workflow_dispatch: {}

concurrency:
  group: dap-editor-transport-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DAP_TRANSPORT_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  inventory:
    name: Stdio-only editor transport
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.DAP_TRANSPORT_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout identity and clean source tree
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$DAP_TRANSPORT_CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

      - name: Run editor-transport falsifiers
        run: python3 scripts/tests/test_dap_editor_transport_inventory.py

      - name: Run editor-transport security falsifiers
        run: python3 scripts/tests/test_dap_editor_transport_security.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable (master)
        with:
          toolchain: 1.95.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          shared-key: dap-editor-transport-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Clear cache-restored transport receipts
        id: clear-receipts
        shell: bash
        run: |
          set -euo pipefail
          for receipt in \
            target/receipts/dap-editor-transport.json \
            target/receipts/dap-editor-transport-security-static.json \
            target/receipts/dap-editor-transport-security.json; do
            if [ -e "$receipt" ]; then
              rm -- "$receipt"
            fi
          done

      - name: Enforce current inventory and ruling
        run: |
          python3 scripts/ci/dap_editor_transport_inventory.py check \
            --root . \
            --manifest .ci/dap/editor-transport-inventory.v1.json \
            --receipt target/receipts/dap-editor-transport.json

      - name: Run exact Linux process/socket rows
        env:
          DAP_EDITOR_TRANSPORT_SECURITY_RECEIPT: ${{ github.workspace }}/target/receipts/dap-editor-transport-security.json
        run: cargo test -p perl-dap --test dap_editor_transport_security --locked -- --nocapture

      - name: Enforce transport-security instrument including runtime receipt
        run: |
          python3 scripts/ci/dap_editor_transport_security.py check \
            --root . \
            --manifest .ci/dap/editor-transport-inventory.v1.json \
            --receipt target/receipts/dap-editor-transport-security-static.json \
            --runtime-receipt target/receipts/dap-editor-transport-security.json \
            --canary dap-10567-peer-token-canary

      - name: Re-materialize inventory receipt for publication
        run: |
          python3 scripts/ci/dap_editor_transport_inventory.py check \
            --root . \
            --manifest .ci/dap/editor-transport-inventory.v1.json \
            --receipt target/receipts/dap-editor-transport.json

      - name: Publish inventory summary
        shell: bash
        run: |
          {
            echo '### DAP editor transport'
            echo
            echo '- Candidate: `'$DAP_TRANSPORT_CANDIDATE_SHA'`'
            echo '- Receipt: `target/receipts/dap-editor-transport.json`'
            echo '- Security static receipt: `target/receipts/dap-editor-transport-security-static.json`'
            echo '- Security runtime receipt: `target/receipts/dap-editor-transport-security.json`'
            echo
            echo '```json'
            cat target/receipts/dap-editor-transport.json
            echo '```'
            echo
            echo '```json'
            cat target/receipts/dap-editor-transport-security-static.json
            echo '```'
            echo
            echo '```json'
            cat target/receipts/dap-editor-transport-security.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inventory receipt
        if: always() && steps.clear-receipts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dap-editor-transport-${{ env.DAP_TRANSPORT_CANDIDATE_SHA }}
          path: |
            target/receipts/dap-editor-transport.json
            target/receipts/dap-editor-transport-security-static.json
            target/receipts/dap-editor-transport-security.json
          if-no-files-found: error
          retention-days: 14
