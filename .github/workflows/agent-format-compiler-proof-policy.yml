name: Agent collect compiler closeout sources

on:
  push:
    branches:
      - agent/compiler-concepts-stack-ci
    paths:
      - .github/workflows/agent-format-compiler-proof-policy.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format proof policy source
        run: rustfmt --edition 2024 xtask/src/bin/compiler-proof-policy.rs

      - name: Verify formatted source
        run: rustfmt --edition 2024 --check xtask/src/bin/compiler-proof-policy.rs

      - name: Collect exact closeout sources
        run: |
          mkdir -p target/compiler-closeout/xtask/src/bin
          mkdir -p target/compiler-closeout/policy
          cp xtask/src/bin/compiler-proof-policy.rs target/compiler-closeout/xtask/src/bin/
          cp policy/non-rust-allowlist.toml target/compiler-closeout/policy/
          git diff -- xtask/src/bin/compiler-proof-policy.rs > target/compiler-closeout/rustfmt.patch

      - name: Upload exact closeout sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compiler-closeout-sources-${{ github.sha }}
          path: target/compiler-closeout
          if-no-files-found: error
          retention-days: 7
