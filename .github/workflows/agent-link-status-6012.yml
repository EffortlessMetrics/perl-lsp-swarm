name: Agent link status issue 6012

on:
  push:
    branches:
      - agent/security-post-merge-status-boundary

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/security-post-merge-status-boundary
          fetch-depth: 0

      - name: Link generated PR to issue and remove helper
        env:
          BRANCH: agent/security-post-merge-status-boundary
        run: |
          set -euo pipefail
          sed -i 's/#0000/#6012/g' .github/workflows/post-merge-status.yml
          rm .github/workflows/agent-link-status-6012.yml
          git add \
            .github/workflows/post-merge-status.yml \
            .github/workflows/agent-link-status-6012.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "chore(ci): link generated status PR to #6012"
          git push origin "HEAD:${BRANCH}"
