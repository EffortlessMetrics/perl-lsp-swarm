name: Version Bump & Changelog Generation

# Automated version bumping and changelog generation.
# Triggered by workflow_dispatch.
#
# Single source of truth: `cargo xtask bump-version <VERSION>` handles all
# version sites (workspace.package, workspace.dependencies, doc badges,
# RELEASE_HISTORY ledger, release-notes scaffold). cargo-release is NOT used
# for the bump — it missed [workspace.package] and [workspace.dependencies]
# during the 0.17.0 cut (issue #3155).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g., 0.x.y)'
        required: false
        type: string
      bump_type:
        description: 'Version bump type (ignored when version is set explicitly)'
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
        default: patch
      prerelease:
        description: 'Is this a prerelease?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
env:
  GIT_CLIFF_VERSION: "2.13.1"
  GIT_CLIFF_LINUX_AMD64_SHA256: "9a1263f24e59a2f508c7b3d3283c9dea94a8bf697f96dbc18cc783cac6284546"

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  version-bump:
    name: Bump Version & Generate Changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: stable

      - name: Install git-cliff
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d)"
          asset="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          asset_url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${asset}"
          archive="${install_dir}/${asset}"

          curl -fsSL "$asset_url" -o "$archive"
          echo "${GIT_CLIFF_LINUX_AMD64_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$install_dir"
          extracted_dir="$(tar -tzf "$archive" | sed -n '1s#/.*##p')"
          if [ -z "$extracted_dir" ]; then
            echo "::error::Could not determine git-cliff archive directory"
            exit 1
          fi
          mkdir -p /usr/local/bin
          sudo mv "${install_dir}/${extracted_dir}/git-cliff" /usr/local/bin/
          sudo chmod +x /usr/local/bin/git-cliff

      - name: Resolve release target
        id: resolved-version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          BUMP_TYPE_INPUT: ${{ github.event.inputs.bump_type }}
        run: |
          set -euo pipefail
          VERSION="$VERSION_INPUT"
          BUMP_TYPE="$BUMP_TYPE_INPUT"

          if [ -n "$VERSION" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              printf '::error::Invalid version format: %s\n' "$VERSION"
              exit 1
            fi
            printf 'mode=explicit\n' >> "$GITHUB_OUTPUT"
            printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BUMP_TYPE" ]; then
            echo "::error::Either version or bump_type must be provided"
            exit 1
          fi

          # Auto-bump: derive the new version from the current workspace version.
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read current version from [workspace.package] in Cargo.toml"
            exit 1
          fi

          IFS='.' read -ra PARTS <<< "$CURRENT"
          MAJOR="${PARTS[0]}"
          MINOR="${PARTS[1]}"
          PATCH="${PARTS[2]}"
          case "$BUMP_TYPE" in
            major) VERSION="$((MAJOR+1)).0.0" ;;
            minor) VERSION="${MAJOR}.$((MINOR+1)).0" ;;
            patch) VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            *) printf '::error::Unknown bump_type: %s\n' "$BUMP_TYPE"; exit 1 ;;
          esac

          printf 'mode=auto\n' >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'Computed version: %s --%s--> %s\n' "$CURRENT" "$BUMP_TYPE" "$VERSION"

      - name: Bump workspace version
        id: bump-version
        env:
          VERSION: ${{ steps.resolved-version.outputs.version }}
        run: |
          set -euo pipefail
          printf 'Bumping workspace to %s via cargo xtask bump-version...\n' "$VERSION"
          cargo xtask bump-version "$VERSION"
          # Regenerate Cargo.lock to reflect the new [workspace.package] version.
          cargo update --workspace --quiet
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'Bump complete: %s\n' "$VERSION"

      - name: Assert bump completeness
        env:
          VERSION: ${{ steps.bump-version.outputs.version }}
        run: |
          set -euo pipefail

          # 1. Verify [workspace.package] version in root Cargo.toml.
          CARGO_VER=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$CARGO_VER" != "$VERSION" ]; then
            printf "::error::[workspace.package] version is '%s', expected '%s'\n" "$CARGO_VER" "$VERSION"
            exit 1
          fi

          # 2. Verify RELEASE_HISTORY.md has a ledger row for the new version.
          if ! grep -qF "| [${VERSION}]" RELEASE_HISTORY.md; then
            printf '::error::RELEASE_HISTORY.md is missing ledger row for %s\n' "$VERSION"
            exit 1
          fi

          printf 'Assertion passed: [workspace.package]=%s, RELEASE_HISTORY.md updated\n' "$VERSION"

      - name: Generate changelog
        id: changelog
        env:
          VERSION: ${{ steps.bump-version.outputs.version }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          git cliff --tag "v${VERSION}" --config cliff.toml > CHANGELOG.new.md

          if [ -f CHANGELOG.md ]; then
            cat CHANGELOG.new.md CHANGELOG.md > CHANGELOG.md.tmp
            mv CHANGELOG.md.tmp CHANGELOG.md
          else
            mv CHANGELOG.new.md CHANGELOG.md
          fi

          rm -f CHANGELOG.new.md

          if [ "$PRERELEASE" = "true" ]; then
            printf 'Release %s changelog generated (prerelease).\n' "$VERSION"
          else
            printf 'Changelog generated for v%s\n' "$VERSION"
          fi

      - name: Create version branch
        id: branch
        env:
          VERSION: ${{ steps.bump-version.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH_NAME="release/v${VERSION}"
          printf 'branch=%s\n' "$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH_NAME"

      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump-version.outputs.version }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all tracked file modifications (bump-version touches many files:
          # Cargo.toml, crate Cargo.tomls, features.toml, RELEASE_HISTORY.md,
          # CLAUDE.md, README.md, ROADMAP.md, copilot-instructions.md,
          # book/src/introduction.md, vscode-extension/package*.json, flake.nix).
          git add -u
          # Stage Cargo.lock (updated by cargo update --workspace above).
          git add Cargo.lock
          # Stage the new release notes scaffold (untracked until created by bump).
          git add "docs/releases/v${VERSION}.md" 2>/dev/null || true

          printf '%s\n' \
            "chore(release): bump version to v${VERSION}" \
            "" \
            "- Update [workspace.package] version to ${VERSION}" \
            "- Update all [workspace.dependencies] version requirements" \
            "- Update version-doc badges (CLAUDE.md, README, ROADMAP, copilot-instructions.md, book)" \
            "- Append RELEASE_HISTORY.md ledger row + 4 link defs" \
            "- Scaffold docs/releases/v${VERSION}.md" \
            "- Regenerate Cargo.lock" \
            "- Generate changelog for v${VERSION}" \
            > /tmp/release-commit-message.txt
          git commit -F /tmp/release-commit-message.txt

          git push origin "$BRANCH_NAME"

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.branch }}
          base: ${{ github.event.repository.default_branch }}
          title: "Release v${{ steps.bump-version.outputs.version }}"
          body: |
            ## Release v${{ steps.bump-version.outputs.version }}

            This PR prepares the release with:
            - Version bump to ${{ steps.bump-version.outputs.version }} (all sites: workspace.package, workspace.dependencies, doc badges)
            - Updated RELEASE_HISTORY.md ledger row
            - Scaffolded docs/releases/v${{ steps.bump-version.outputs.version }}.md
            - Regenerated Cargo.lock
            - Updated changelog

            ### Checklist
            - [ ] All tests passing
            - [ ] Documentation updated
            - [ ] Breaking changes documented
            - [ ] Migration guide updated (if needed)

            ### Next Steps
            Once merged, the release workflow will:
            1. Build binaries for all platforms
            2. Create GitHub release with assets
            3. Publish to crates.io
            4. Update Homebrew formula
            5. Publish VSCode extension
            6. Update Scoop and Chocolatey packages
            7. Build and push Docker images
          labels: release
          draft: false

      - name: Summary
        env:
          VERSION: ${{ steps.bump-version.outputs.version }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch }}
        run: |
          {
            echo "## Version Bump Complete"
            echo ""
            printf -- '- **Version**: v%s\n' "$VERSION"
            printf -- '- **Branch**: %s\n' "$BRANCH_NAME"
            echo "- **PR**: Created"
            echo "- **Changelog**: Generated"
            echo "- **RELEASE_HISTORY.md**: Ledger row appended"
            printf -- '- **Release notes scaffold**: docs/releases/v%s.md\n' "$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
