name: Resume typed sidecar registry slice

on:
  push:
    branches:
      - agent/sidecar-concept-registry-6703

permissions:
  contents: write

jobs:
  resume-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out writable branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/sidecar-concept-registry-6703
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Reuse generated patch, repair fixture, verify, and publish
        shell: bash
        run: |
          set -euo pipefail
          generator='.github/workflows/sidecar-concept-registry-6703.yml'
          resume='.github/workflows/sidecar-concept-registry-resume.yml'

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/sidecar-concept-registry-6703.yml')
          lines = workflow.read_text().splitlines()
          start_marker = "          cat > /tmp/sidecar_registry_patch.py <<'PY'"
          end_marker = "          PY"
          start = lines.index(start_marker) + 1
          end = lines.index(end_marker, start)
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines[start:end]) + "\n"
          Path('/tmp/sidecar_registry_patch.py').write_text(script)
          PY

          python3 /tmp/sidecar_registry_patch.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/perl-corpus/src/sidecar.rs')
          text = path.read_text()
          old = '''        let second_root = tempfile::tempdir()?;
          let second = write_typed_registry(second_root.path(), "parser.two")?;'''
          new = '''        let second_root = tempfile::tempdir()?;
          fs::write(second_root.path().join("case.pl"), "1;")?;
          let second = write_typed_registry(second_root.path(), "parser.two")?;'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one identity-fixture repair, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          cargo fmt -p perl-corpus
          cargo test -p perl-corpus sidecar --locked
          cargo test -p perl-corpus --test sidecar_expectations --locked
          cargo test -p perl-corpus --test fixture_expectation_sidecars --locked
          cargo test -p perl-corpus --test fixture_sidecars --locked
          cargo clippy -p perl-corpus --all-targets --locked -- -D warnings

          git rm -- "$generator" "$resume"
          git add -- crates/perl-corpus
          git diff --cached --check
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git commit -m 'fix(corpus): bind sidecars to typed concept registry'
          git push origin HEAD:agent/sidecar-concept-registry-6703
