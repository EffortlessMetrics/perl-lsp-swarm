name: Agent 6808 consolidate LSP wire contract

on:
  push:
    branches:
      - codex/6776-text-document-sync-shape-contract

permissions:
  contents: write

concurrency:
  group: agent-6808-consolidate-lsp-contract
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.ref == 'refs/heads/codex/6776-text-document-sync-shape-contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Consolidate the exact wire contract into its existing owner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/perl-lsp-rs/tests/lsp_api_contracts.rs")
          text = path.read_text(encoding="utf-8")

          old_import = "use std::collections::HashSet;"
          new_import = "use std::collections::{BTreeSet, HashSet};"
          if text.count(old_import) != 1:
              raise SystemExit("expected one HashSet import to extend")
          text = text.replace(old_import, new_import, 1)

          old_contract = '''    assert_eq!(sync.get("openClose"), Some(&Value::Bool(true)));
    assert_eq!(sync.get("change").and_then(Value::as_u64), Some(1));
    assert_eq!(sync.get("willSave"), Some(&Value::Bool(true)));
    assert_eq!(sync.get("willSaveWaitUntil"), Some(&Value::Bool(true)));

    let save = sync
        .get("save")
        .and_then(Value::as_object)
        .ok_or("textDocumentSync.save must be an object")?;
    assert_eq!(save.get("includeText"), Some(&Value::Bool(true)));

    for snake_case_key in ["open_close", "will_save", "will_save_wait_until"] {
        assert!(!sync.contains_key(snake_case_key));
    }
    assert!(!save.contains_key("include_text"));
'''
          new_contract = '''    let observed_keys: BTreeSet<_> = sync.keys().map(String::as_str).collect();
    let expected_keys = BTreeSet::from([
        "change",
        "openClose",
        "save",
        "willSave",
        "willSaveWaitUntil",
    ]);
    assert_eq!(
        observed_keys, expected_keys,
        "textDocumentSync must change only through an intentional wire-contract update"
    );

    assert_eq!(sync.get("openClose"), Some(&Value::Bool(true)));
    assert_eq!(sync.get("change").and_then(Value::as_u64), Some(1));
    assert_eq!(sync.get("willSave"), Some(&Value::Bool(true)));
    assert_eq!(sync.get("willSaveWaitUntil"), Some(&Value::Bool(true)));

    let save = sync
        .get("save")
        .and_then(Value::as_object)
        .ok_or("textDocumentSync.save must be an object")?;
    let observed_save_keys: BTreeSet<_> = save.keys().map(String::as_str).collect();
    assert_eq!(
        observed_save_keys,
        BTreeSet::from(["includeText"]),
        "textDocumentSync.save must preserve its exact LSP wire shape"
    );
    assert_eq!(save.get("includeText"), Some(&Value::Bool(true)));
'''
          if text.count(old_contract) != 1:
              raise SystemExit("expected one existing textDocumentSync contract block")
          path.write_text(text.replace(old_contract, new_contract, 1), encoding="utf-8")
          PY

          git rm -- crates/perl-lsp-rs/tests/text_document_sync_wire_contract.rs
          git rm -- .github/workflows/agent-6808-consolidate-lsp-contract.yml
          git diff --check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Verify the consolidated contract
        run: |
          cargo fmt -p perl-lsp-rs -- --check
          cargo test -p perl-lsp-rs --locked --test lsp_api_contracts \
            test_text_document_sync_option_keys_use_lsp_camel_case

      - name: Commit the reviewed improvement
        shell: bash
        run: |
          set -euo pipefail
          git add -- crates/perl-lsp-rs/tests/lsp_api_contracts.rs
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 3
          test "${staged[0]}" = ".github/workflows/agent-6808-consolidate-lsp-contract.yml"
          test "${staged[1]}" = "crates/perl-lsp-rs/tests/lsp_api_contracts.rs"
          test "${staged[2]}" = "crates/perl-lsp-rs/tests/text_document_sync_wire_contract.rs"
          git diff --cached --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "test(lsp): consolidate exact textDocumentSync contract (#6776)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
