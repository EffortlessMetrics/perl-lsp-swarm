name: Agent 6808 consolidate LSP wire contract

on:
  push:
    branches:
      - codex/6776-text-document-sync-shape-contract

permissions:
  contents: write

concurrency:
  group: agent-6808-consolidate-lsp-contract
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.ref == 'refs/heads/codex/6776-text-document-sync-shape-contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Consolidate the exact wire contract into its existing owner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/ci/agent_6808_consolidate.py
          git rm -- crates/perl-lsp-rs/tests/text_document_sync_wire_contract.rs
          git rm -- .github/workflows/agent-6808-consolidate-lsp-contract.yml
          git rm -- scripts/ci/agent_6808_consolidate.py
          git diff --check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Verify the consolidated contract
        run: |
          cargo fmt -p perl-lsp-rs -- --check
          cargo test -p perl-lsp-rs --locked --test lsp_api_contracts \
            test_text_document_sync_option_keys_use_lsp_camel_case

      - name: Commit the reviewed improvement
        shell: bash
        run: |
          set -euo pipefail
          git add -- crates/perl-lsp-rs/tests/lsp_api_contracts.rs
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 4
          test "${staged[0]}" = ".github/workflows/agent-6808-consolidate-lsp-contract.yml"
          test "${staged[1]}" = "crates/perl-lsp-rs/tests/lsp_api_contracts.rs"
          test "${staged[2]}" = "crates/perl-lsp-rs/tests/text_document_sync_wire_contract.rs"
          test "${staged[3]}" = "scripts/ci/agent_6808_consolidate.py"
          git diff --cached --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "test(lsp): consolidate exact textDocumentSync contract (#6776)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
