name: One-shot POD command repair for PR 13181

on:
  push:
    branches:
      - chatgpt/http-client-method-completion
    paths:
      - .github/workflows/pr-13181-pod-command-fix.yml
  pull_request:
    paths:
      - .github/workflows/pr-13181-pod-command-fix.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  repair-and-prove:
    if: github.repository == 'EffortlessMetrics/perl-lsp-swarm'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/http-client-method-completion
          fetch-depth: 0

      - name: Install Rust 1.95 with rustfmt and clippy
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Repair modern POD command boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lexical_path = Path(
              'crates/perl-lsp-rs-core/src/providers/completion/completion/lexical_context.rs'
          )
          lexical = lexical_path.read_text()

          replacements = [
              (
                  '''fn is_pod_start_marker(line: &str) -> bool {
              matches!(
                  pod_directive(line),
                  Some("=pod" | "=head1" | "=head2" | "=head3" | "=head4" | "=over" | "=item" | "=back")
              )
          }

          fn is_pod_end_marker(line: &str) -> bool {
              matches!(pod_directive(line), Some("=cut" | "=end"))
          }''',
                  '''fn is_pod_start_marker(line: &str) -> bool {
              matches!(
                  pod_directive(line),
                  Some(
                      "=pod"
                          | "=head1"
                          | "=head2"
                          | "=head3"
                          | "=head4"
                          | "=head5"
                          | "=head6"
                          | "=over"
                          | "=item"
                          | "=back"
                          | "=encoding"
                  )
              )
          }

          fn is_pod_end_marker(line: &str) -> bool {
              pod_directive(line) == Some("=cut")
          }''',
              ),
              (
                  '''    #[test]
              fn for_paragraph_resumes_at_blank_line() {''',
                  '''    #[test]
              fn recognized_modern_pod_commands_start_pod() {
                  for directive in ["=encoding utf8", "=head5 Deep", "=head6 Deeper"] {
                      let source = format!("{directive}\\ndocumentation\\n$http->po");
                      assert!(is_in_pod(&source, source.len()), "{directive} must start POD");
                      assert!(!is_in_string(&source, source.len()));
                      assert!(!is_in_heredoc(&source, source.len()));
                  }
              }

              #[test]
              fn unmatched_end_does_not_cut_pod() {
                  let source = "=pod\\ndocumentation\\n=end comment\\nstill documentation\\n$http->po";
                  assert!(is_in_pod(source, source.len()));
              }

              #[test]
              fn for_paragraph_resumes_at_blank_line() {''',
              ),
          ]

          for old, new in replacements:
              count = lexical.count(old)
              if count != 1:
                  raise SystemExit(
                      f'expected exactly one lexical replacement, found {count}: {old[:100]!r}'
                  )
              lexical = lexical.replace(old, new, 1)

          lexical_path.write_text(lexical)

          integration_path = Path(
              'crates/perl-lsp-rs-core/tests/http_client_method_completion_tests.rs'
          )
          integration = integration_path.read_text()
          old_cases = '''        "use HTTP::Tiny;\\n=pod\\n$http = HTTP::Tiny->new;\\n=cut\\n$http->po",
              ];'''
          new_cases = '''        "use HTTP::Tiny;\\n=pod\\n$http = HTTP::Tiny->new;\\n=cut\\n$http->po",
                  "use HTTP::Tiny;\\n=encoding utf8\\n$http = HTTP::Tiny->new;\\n$http->po",
                  "use HTTP::Tiny;\\n=head5 Deep\\n$http = HTTP::Tiny->new;\\n$http->po",
                  "use HTTP::Tiny;\\n=head6 Deeper\\n$http = HTTP::Tiny->new;\\n$http->po",
                  "use HTTP::Tiny;\\n=pod\\n=end comment\\n$http = HTTP::Tiny->new;\\n$http->po",
              ];'''
          count = integration.count(old_cases)
          if count != 1:
              raise SystemExit(f'expected exactly one integration insertion point, found {count}')
          integration_path.write_text(integration.replace(old_cases, new_cases, 1))
          PY

          cargo fmt -p perl-lsp-rs-core

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            crates/perl-lsp-rs-core/src/providers/completion/completion/lexical_context.rs \
            crates/perl-lsp-rs-core/tests/http_client_method_completion_tests.rs | sort)"
          if [[ "$changed" != "$expected" ]]; then
            printf 'repair changed an unexpected file set:\n%s\n' "$changed" >&2
            exit 1
          fi

      - name: Run focused regression proof
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir='target/receipts/pr-13181-pod-command'
          mkdir -p "$receipt_dir"

          cargo fmt -p perl-lsp-rs-core -- --check \
            2>&1 | tee "$receipt_dir/rustfmt.log"
          cargo clippy -p perl-lsp-rs-core --lib --locked -- -D warnings -A missing_docs \
            2>&1 | tee "$receipt_dir/clippy.log"
          cargo test -p perl-lsp-rs-core --lib lexical_context --locked \
            2>&1 | tee "$receipt_dir/lexical-context.log"
          cargo test -p perl-lsp-rs-core --test http_client_method_completion_tests --locked \
            2>&1 | tee "$receipt_dir/http-client.log"
          cargo test -p perl-lsp-rs-core --test mojo_adapter_method_completion_tests --locked \
            2>&1 | tee "$receipt_dir/mojo-adapter.log"
          git diff --check \
            2>&1 | tee "$receipt_dir/diff-check.log"

          cat > "$receipt_dir/receipt.json" <<JSON
          {
            "schema_version": 1,
            "pr": 13181,
            "input_head_sha": "${GITHUB_SHA}",
            "rust_toolchain": "1.95.0",
            "status": "passed",
            "finding": "recognized modern POD commands enter POD; only =cut ends an ordinary POD region; matching =end remains owned by Begin state",
            "commands": [
              "cargo fmt -p perl-lsp-rs-core -- --check",
              "cargo clippy -p perl-lsp-rs-core --lib --locked -- -D warnings -A missing_docs",
              "cargo test -p perl-lsp-rs-core --lib lexical_context --locked",
              "cargo test -p perl-lsp-rs-core --test http_client_method_completion_tests --locked",
              "cargo test -p perl-lsp-rs-core --test mojo_adapter_method_completion_tests --locked",
              "git diff --check"
            ]
          }
          JSON

      - name: Commit the proved repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr-13181-pod-command-fix.yml

          changed="$(git diff --name-only HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/pr-13181-pod-command-fix.yml \
            crates/perl-lsp-rs-core/src/providers/completion/completion/lexical_context.rs \
            crates/perl-lsp-rs-core/tests/http_client_method_completion_tests.rs | sort)"
          if [[ "$changed" != "$expected" ]]; then
            printf 'commit would contain an unexpected file set:\n%s\n' "$changed" >&2
            exit 1
          fi

          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add \
            crates/perl-lsp-rs-core/src/providers/completion/completion/lexical_context.rs \
            crates/perl-lsp-rs-core/tests/http_client_method_completion_tests.rs
          git commit -m 'fix(completion): recognize modern POD boundaries'
          git push origin HEAD:chatgpt/http-client-method-completion

      - name: Upload focused proof receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-13181-pod-command-proof-${{ github.sha }}
          path: target/receipts/pr-13181-pod-command
          if-no-files-found: warn
          retention-days: 14
