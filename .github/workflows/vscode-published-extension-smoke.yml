name: VS Code Published Extension Smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published extension version to smoke, for example 0.13.2. Empty installs latest.'
        required: false
        type: string
      source:
        description: 'Published package source.'
        required: false
        default: marketplace
        type: choice
        options:
          - marketplace
          - open-vsx
      candidate_id:
        description: 'Candidate identity for a bound installed-acceptance receipt.'
        required: false
        type: string
      artifact_set_id:
        description: 'Artifact-set identity for a bound installed-acceptance receipt.'
        required: false
        type: string
      frozen_product_sha:
        description: 'Frozen source SHA for a bound installed-acceptance receipt.'
        required: false
        type: string
      candidate_artifact_manifest:
        description: 'Linux-only JSON manifest with candidate_id, frozen_product_sha, artifact_set_id, platform=linux, vsix_sha256, and bundled_server_sha256.'
        required: false
        type: string
  schedule:
    - cron: '0 14 * * 1'

concurrency:
  group: vscode-published-extension-smoke-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.source || 'marketplace' }}-${{ github.event_name == 'workflow_dispatch' && inputs.version || 'latest' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  published-extension-smoke:
    name: Published extension smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    defaults:
      run:
        working-directory: vscode-extension

    env:
      GITHUB_TOKEN: ${{ github.token }}
      PERL_LSP_PUBLISHED_EXTENSION_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || 'marketplace' }}
      PERL_LSP_PUBLISHED_EXTENSION_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      # Candidate-bound installed acceptance is intentionally Linux-only: the
      # manifest carries one bundled-server digest, and only Linux assembles
      # and validates the parent fan-in receipt.
      PERL_LSP_CANDIDATE_ID: ${{ runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.candidate_id || '' }}
      PERL_LSP_ARTIFACT_SET_ID: ${{ runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.artifact_set_id || '' }}
      PERL_LSP_CANDIDATE_ARTIFACT_MANIFEST: ${{ runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.candidate_artifact_manifest || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup VS Code toolchain
        uses: ./.github/actions/setup-vscode-toolchain

      - name: Run published extension smoke
        if: runner.os != 'Linux'
        run: npm run test:published

      - name: Run published extension smoke under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:published

      - name: Run packaged bundled-server journey under Xvfb
        if: runner.os == 'Linux'
        env:
          PERL_LSP_PACKAGED_BUNDLE_SMOKE: '1'
          PERL_LSP_SMOKE_SOURCE_LABEL: packaged-bundle
          PERL_LSP_CURRENT_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.frozen_product_sha || '' }}
        run: xvfb-run -a npm run test:published

      - name: Assemble and validate installed acceptance fan-in
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.candidate_id != '' && inputs.artifact_set_id != '' && inputs.frozen_product_sha != '' && inputs.candidate_artifact_manifest != ''
        working-directory: .
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          FROZEN_PRODUCT_SHA: ${{ inputs.frozen_product_sha }}
          ARTIFACT_SET_ID: ${{ inputs.artifact_set_id }}
        run: |
          mkdir -p target/receipts/vscode-smoke/child_receipts
          node vscode-extension/scripts/assemble-installed-acceptance.js \
            --prepare-parent \
            --template fixtures/experience/public_beta/ready.json \
            --output target/receipts/vscode-smoke/public_beta_experience.json \
            --candidate-id "$CANDIDATE_ID" \
            --frozen-product-sha "$FROZEN_PRODUCT_SHA" \
            --artifact-set-id "$ARTIFACT_SET_ID"
          cp fixtures/experience/public_beta/child_receipts/*.json target/receipts/vscode-smoke/child_receipts/
          node vscode-extension/scripts/assemble-installed-acceptance.js \
            --parent target/receipts/vscode-smoke/public_beta_experience.json \
            --source target/receipts/vscode-smoke/packaged-bundle/linux/packaged_bundle_journey_receipt.json \
            --verified target/receipts/vscode-smoke/packaged-bundle/linux/verified_child_receipt.json \
            --output target/receipts/vscode-smoke/public_beta_experience.json \
            --candidate-id "$CANDIDATE_ID" \
            --frozen-product-sha "$FROZEN_PRODUCT_SHA" \
            --artifact-set-id "$ARTIFACT_SET_ID"
          cargo run -p xtask --example public_beta_experience -- \
            --receipt target/receipts/vscode-smoke/public_beta_experience.json \
            --allow-not-proven

      - name: Upload published smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-smoke-published-${{ env.PERL_LSP_PUBLISHED_EXTENSION_SOURCE }}-${{ matrix.os }}
          path: target/receipts/vscode-smoke/**
          if-no-files-found: warn
          retention-days: 14
