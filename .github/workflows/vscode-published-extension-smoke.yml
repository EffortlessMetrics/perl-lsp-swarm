name: VS Code Published Extension Smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published extension version to smoke, for example 0.13.2. Empty installs latest.'
        required: false
        type: string
      source:
        description: 'Published package source.'
        required: false
        default: marketplace
        type: choice
        options:
          - marketplace
          - open-vsx
  schedule:
    - cron: '0 14 * * 1'

concurrency:
  group: vscode-published-extension-smoke-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.source || 'marketplace' }}-${{ github.event_name == 'workflow_dispatch' && inputs.version || 'latest' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  published-extension-smoke:
    name: Published extension smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    defaults:
      run:
        working-directory: vscode-extension

    env:
      GITHUB_TOKEN: ${{ github.token }}
      PERL_LSP_PUBLISHED_EXTENSION_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || 'marketplace' }}
      PERL_LSP_PUBLISHED_EXTENSION_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup VS Code toolchain
        uses: ./.github/actions/setup-vscode-toolchain

      - name: Run published extension smoke
        if: runner.os != 'Linux'
        run: npm run test:published

      - name: Run published extension smoke under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:published

      - name: Run packaged bundled-server journey under Xvfb
        if: runner.os == 'Linux'
        env:
          PERL_LSP_PACKAGED_BUNDLE_SMOKE: '1'
          PERL_LSP_SMOKE_SOURCE_LABEL: packaged-bundle
          PERL_LSP_CURRENT_SOURCE_SHA: ${{ github.sha }}
        run: xvfb-run -a npm run test:published

      - name: Upload published smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-smoke-published-${{ env.PERL_LSP_PUBLISHED_EXTENSION_SOURCE }}-${{ matrix.os }}
          path: target/receipts/vscode-smoke/**
          if-no-files-found: warn
          retention-days: 14
