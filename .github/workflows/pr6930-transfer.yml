name: PR 6930 transfer applicator

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr6930-transfer.yml'

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  apply-transfer:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Fetch, recover, and verify transfer archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import urllib.request

          url = 'https://api.github.com/repos/EffortlessMetrics/perl-lsp-swarm/issues/comments/5261976995'
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'perl-lsp-swarm-pr6930-transfer',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              body = json.load(response)['body']

          begin = 'BEGIN PR6930 TAR.GZ BASE64\n'
          end = '\nEND PR6930 TAR.GZ BASE64'
          if begin not in body or end not in body:
              raise SystemExit('transfer markers missing')
          lines = [
              line.strip()
              for line in body.split(begin, 1)[1].split(end, 1)[0].splitlines()
              if line.strip()
          ]
          encoded = ''.join(lines)
          if re.search(r'[^A-Za-z0-9+/=]', encoded):
              raise SystemExit('transfer contains non-base64 characters')

          expected_size = 9130
          expected_sha = '5a46161b5ccf09e5b2480a44c7e2a2849210d2a8b952a7ab52bfd71563d3f955'
          expected_chars = ((expected_size + 2) // 3) * 4

          def accepted(candidate):
              try:
                  archive = base64.b64decode(candidate, validate=True)
              except ValueError:
                  return None
              if len(archive) != expected_size:
                  return None
              return archive if hashlib.sha256(archive).hexdigest() == expected_sha else None

          archive = accepted(encoded)
          if archive is None and len(encoded) + 1 == expected_chars:
              offsets = []
              cursor = 0
              expected_last = expected_chars - 76 * (len(lines) - 1)
              for index, line in enumerate(lines):
                  expected_length = expected_last if index == len(lines) - 1 else 76
                  if len(line) == expected_length - 1:
                      offsets.extend(range(cursor, cursor + len(line) + 1))
                  cursor += len(line)
              if not offsets:
                  offsets = range(len(encoded) + 1)
              alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
              for offset in offsets:
                  for character in alphabet:
                      archive = accepted(encoded[:offset] + character + encoded[offset:])
                      if archive is not None:
                          print(f'recovered_missing_base64_character offset={offset} value={character}')
                          break
                  if archive is not None:
                      break

          if archive is None:
              raise SystemExit(
                  f'transfer mismatch: encoded_chars={len(encoded)} expected_chars={expected_chars}'
              )
          with open('pr6930.tar.gz', 'wb') as destination:
              destination.write(archive)
          PY

      - name: Apply exact transfer and remove applicator
        run: |
          rm -rf .transfer-pr6930
          mkdir .transfer-pr6930
          tar -xzf pr6930.tar.gz -C .transfer-pr6930
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              '.github/workflows/pr-candidate-set.yml': (1532, '651ed6b7e82d95796ce4af095eed6d7fa14cf8d7aa96a90774077f2b80557d43'),
              'policy/pr-candidate-sets.toml': (7205, 'ee0d3cc910b60b7c314ccdd60b5040b5a59585250542fc66ebe06607939d4257'),
              'xtask/src/bin/pr-candidate-set.rs': (26279, 'f94d6392ec740f7110b78c220fbcb3ee0f5278c5c585231399e484b867afcfca'),
          }
          root = Path('.transfer-pr6930')
          actual = sorted(
              path.relative_to(root).as_posix()
              for path in root.rglob('*')
              if path.is_file()
          )
          if actual != sorted(expected):
              raise SystemExit(f'unexpected transfer path set: {actual!r}')
          for relative, (length, digest) in expected.items():
              data = (root / relative).read_bytes()
              observed = hashlib.sha256(data).hexdigest()
              if len(data) != length or observed != digest:
                  raise SystemExit(
                      f'{relative}: expected {length}/{digest}, got {len(data)}/{observed}'
                  )
              destination = Path(relative)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
          PY
          git rm .github/workflows/pr6930-transfer.yml
          rm -rf .transfer-pr6930 pr6930.tar.gz
          git diff --check
          git status --short

      - name: Commit exact repaired candidate
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'EffortlessSteven'
          git config user.email 'git@effortlesssteven.com'
          git add \
            .github/workflows/pr-candidate-set.yml \
            policy/pr-candidate-sets.toml \
            xtask/src/bin/pr-candidate-set.rs
          git commit -m 'fix(pr): bind candidate reconciliation to semantic observations'
          git push origin "HEAD:${HEAD_BRANCH}"
