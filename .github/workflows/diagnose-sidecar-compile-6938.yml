name: Diagnose sidecar authority compile

on:
  push:
    branches:
      - agent/corpus-sidecar-path-authority-6885
    paths:
      - .github/workflows/diagnose-sidecar-compile-6938.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@v5
        with:
          ref: agent/corpus-sidecar-path-authority-6885
          fetch-depth: 0

      - name: Format and compile with captured diagnostics
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          cargo fmt -p perl-corpus
          log=/tmp/corpus-check.log
          if cargo check -p perl-corpus --all-targets >"$log" 2>&1; then
            cat "$log"
            exit 0
          fi
          cat "$log"
          python3 - "$log" <<'PY'
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          message = '\n'.join(lines[-120:]) or 'compile failed without output'
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=sidecar authority compile::{message}')
          PY
          exit 1
