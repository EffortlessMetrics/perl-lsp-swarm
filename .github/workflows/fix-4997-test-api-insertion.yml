name: Fix #4997 test API insertion

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/fix-4997-test-api-insertion.yml

permissions:
  contents: write

concurrency:
  group: fix-4997-test-api-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.repository == 'EffortlessMetrics/perl-lsp-swarm' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/4997-ai-activation-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/4997-ai-activation-authority
          fetch-depth: 0

      - name: Move helpers into the public test-only LspServer impl
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/maintenance/apply_4997_ai_activation_authority.py")
          text = path.read_text(encoding="utf-8")
          old = '''last_close = test_api_text.rfind("\\n}")
          if last_close < 0:
              raise RuntimeError(f"{TEST_API}: final impl close missing")
          write(TEST_API, test_api_text[:last_close] + TEST_API_APPEND + test_api_text[last_close:])
          '''
          new = '''impl_end_marker = (
              "\\n}\\n\\n/// Public snapshot of the installed parse worker's counters (test-only)."
          )
          impl_end = test_api_text.find(impl_end_marker)
          if impl_end < 0:
              raise RuntimeError(f"{TEST_API}: public test-only LspServer impl close missing")
          write(TEST_API, test_api_text[:impl_end] + TEST_API_APPEND + test_api_text[impl_end:])
          '''
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit the corrected one-shot editor
        env:
          BRANCH: agent/4997-ai-activation-authority
        run: |
          rm -- .github/workflows/fix-4997-test-api-insertion.yml
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(ai): expose #4997 test authority helpers'
          git push origin HEAD:"$BRANCH"
