name: Repair topology helper and verify

on:
  push:
    branches:
      - agent/corpus-topology-6699-current
    paths:
      - .github/workflows/fix-topology-helper-6745.yml

permissions:
  contents: write

jobs:
  repair-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v5
        with:
          ref: agent/corpus-topology-6699-current
          fetch-depth: 0

      - name: Repair recursive helper
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3d535bc044166a8ccf603315f5b493ddbf81dc83 HEAD
          test "$(git diff --name-only 3d535bc044166a8ccf603315f5b493ddbf81dc83 HEAD)" = ".github/workflows/fix-topology-helper-6745.yml"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/perl-corpus/src/api/topology.rs')
          source = path.read_text()
          old = '        topology_from_root(root)\n'
          new = (
              '        CorpusTopology::from_paths(&CorpusPaths::from_root(root.to_path_buf()))\n'
          )
          if source.count(old) != 1:
              raise SystemExit(f'expected one recursive helper call, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          cargo fmt -p perl-corpus

      - name: Verify topology authority
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          cargo fmt -p perl-corpus -- --check
          cargo test -p perl-corpus --lib topology --locked
          cargo clippy -p perl-corpus --lib --locked -- -D warnings -A missing_docs
          git diff --check

      - name: Publish verified repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-topology-helper-6745.yml
          git add crates/perl-corpus/src/api/topology.rs \
            .github/workflows/fix-topology-helper-6745.yml
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/fix-topology-helper-6745.yml\ncrates/perl-corpus/src/api/topology.rs'
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "fix(corpus): remove recursive topology test helper"
          git push origin HEAD:agent/corpus-topology-6699-current
