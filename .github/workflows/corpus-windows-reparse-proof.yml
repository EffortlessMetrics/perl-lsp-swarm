name: Corpus Windows reparse proof

on:
  pull_request:
    branches: [main, master]
    paths:
      - "crates/perl-corpus/**"
      - "xtask/src/publication_drift/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/corpus-windows-reparse-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-windows-reparse-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  windows-reparse-proof:
    name: Windows reparse rejection
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse 'HEAD^{commit}')"
          test "$actual_sha" = "$CANDIDATE_SHA"
          echo "Verified candidate SHA: $actual_sha"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: 1.95.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          shared-key: corpus-windows-reparse-proof-${{ hashFiles('Cargo.lock') }}

      - name: Run non-skipping Windows reparse proof
        env:
          # The proof must never be certified by a typed privilege skip: on
          # an unprivileged runner the helper hard-fails instead (#12567).
          PLSW_REQUIRE_SYMLINK_PRIVILEGE: "1"
        run: >-
          cargo test --locked -p perl-corpus
          --test strict_sectioned_loading
          public_plain_loader_rejects_windows_reparse_point
          -- --exact --nocapture

      - name: Run non-skipping xtask reparse proof
        env:
          # Same anti-vacuity contract as the corpus proof above: the xtask
          # publication-drift rejection test must never be certified by a
          # typed privilege skip on an unprivileged runner (#12567).
          PLSW_REQUIRE_SYMLINK_PRIVILEGE: "1"
        run: >-
          cargo test --locked -p xtask --lib
          dangling_protected_source_rejects_before_publication_write
          -- --nocapture

      - name: Run exact non-skipping perl-corpus topology proofs
        env:
          # The ten topology rejection tests must execute with real symlinks;
          # an unprivileged runner must fail rather than certify a typed skip.
          PLSW_REQUIRE_SYMLINK_PRIVILEGE: "1"
        shell: bash
        run: |
          set -euo pipefail

          selected_tests=(
            api::topology::tests::binding_rejects_intermediate_runtime_root_symlink
            api::topology::tests::excluded_metadata_symlink_does_not_block_discovery
            api::topology::tests::dangling_excluded_metadata_symlink_does_not_block_discovery
            api::topology::tests::symlinked_entries_fail_closed
            api::topology::tests::dangling_selected_symlink_fails_as_symlink_unsupported
            api::topology::tests::symlinked_test_directory_cannot_hide_selected_descendants
            api::topology::tests::symlinked_fuzz_directory_cannot_hide_selected_descendants
            api::topology::tests::symlinked_directory_target_inside_root_still_fails_closed
            api::topology::tests::symlinked_directory_target_outside_root_fails_closed
            api::topology::tests::nested_intermediate_directory_symlink_fails_closed
          )

          test_list="$(mktemp)"
          trap 'rm -f "$test_list"' EXIT
          cargo test --locked -p perl-corpus --lib -- --list \
            | sed 's/\r$//' \
            | tee "$test_list"

          echo "Selected topology symlink tests:"
          for test_name in "${selected_tests[@]}"; do
            if ! grep -Fqx -- "${test_name}: test" "$test_list"; then
              echo "missing expected test: $test_name" >&2
              exit 1
            fi
            echo "- $test_name"
          done

          for test_name in "${selected_tests[@]}"; do
            test_output="$(mktemp)"
            if ! cargo test --locked -p perl-corpus --lib "$test_name" \
              -- --exact --nocapture \
              2>&1 | sed 's/\r$//' | tee "$test_output"; then
              rm -f "$test_output"
              exit 1
            fi

            running_count="$(grep -Ec '^running 1 test$' "$test_output" || true)"
            result_count="$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9.]+s$' "$test_output" || true)"
            rm -f "$test_output"
            if [[ "$running_count" -ne 1 || "$result_count" -ne 1 ]]; then
              echo "exact test did not report exactly one executed test: $test_name" >&2
              echo "running summaries: $running_count; result summaries: $result_count" >&2
              exit 1
            fi
          done
