name: Workflow Trigger Lint

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  finish-exact-process:
    if: github.head_ref == 'test/lsp-real-process-6720'
    name: Finish exact-process review fixes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 3
          ref: test/lsp-real-process-6720

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Enforce strict JSON-RPC framing envelopes
        shell: python
        run: |
          from pathlib import Path

          harness = Path("crates/perl-lsp-rs/tests/support/real_process.rs")
          text = harness.read_text()

          notification_helper = '''    pub fn is_valid_server_notification_for_test(message: &Value) -> bool {
              is_server_notification(message)
          }
          '''
          request_helper = '''    pub fn is_valid_server_notification_for_test(message: &Value) -> bool {
              is_server_notification(message)
          }

              pub fn is_valid_server_request_for_test(message: &Value, method: &str) -> bool {
              is_server_request_for(message, method)
          }
          '''
          if request_helper.strip() not in text:
              if notification_helper not in text:
                  raise SystemExit("notification test helper anchor not found")
              text = text.replace(notification_helper, request_helper, 1)

          response_like = '''fn is_response_like(message: &Value) -> bool {
              message.get("method").is_none()
                  && (message.get("result").is_some() || message.get("error").is_some())
          }
          '''
          response_helpers = '''fn is_response_like(message: &Value) -> bool {
              message.get("method").is_none()
                  && (message.get("result").is_some() || message.get("error").is_some())
          }

          fn has_valid_params(message: &Value) -> bool {
              match message.get("params") {
                  None => true,
                  Some(params) => params.is_object() || params.is_array(),
              }
          }

          fn has_no_response_members(message: &Value) -> bool {
              message.get("result").is_none() && message.get("error").is_none()
          }
          '''
          if response_helpers.strip() not in text:
              if response_like not in text:
                  raise SystemExit("response-like helper anchor not found")
              text = text.replace(response_like, response_helpers, 1)

          response_predicate = '''fn is_response(message: &Value) -> bool {
              is_jsonrpc_2(message)
                  && is_response_like(message)
                  && message.get("id").is_some_and(|id| id.is_number() || id.is_string() || id.is_null())
                  && (message.get("result").is_some() ^ message.get("error").is_some())
          }
          '''
          strict_response_predicate = '''fn is_response(message: &Value) -> bool {
              is_jsonrpc_2(message)
                  && is_response_like(message)
                  && message.get("params").is_none()
                  && message.get("id").is_some_and(|id| id.is_number() || id.is_string() || id.is_null())
                  && (message.get("result").is_some() ^ message.get("error").is_some())
          }
          '''
          if strict_response_predicate.strip() not in text:
              if response_predicate not in text:
                  raise SystemExit("response predicate anchor not found")
              text = text.replace(response_predicate, strict_response_predicate, 1)

          request_predicate = '''fn is_server_request_for(message: &Value, method: &str) -> bool {
              is_jsonrpc_2(message)
                  && message.get("method").and_then(Value::as_str) == Some(method)
                  && message.get("id").is_some_and(|id| id.is_number() || id.is_string())
          }
          '''
          strict_request_predicate = '''fn is_server_request_for(message: &Value, method: &str) -> bool {
              is_jsonrpc_2(message)
                  && message.get("method").and_then(Value::as_str) == Some(method)
                  && message.get("id").is_some_and(|id| id.is_number() || id.is_string())
                  && has_no_response_members(message)
                  && has_valid_params(message)
          }
          '''
          if strict_request_predicate.strip() not in text:
              if request_predicate not in text:
                  raise SystemExit("server request predicate anchor not found")
              text = text.replace(request_predicate, strict_request_predicate, 1)

          notification_predicate = '''fn is_server_notification(message: &Value) -> bool {
              is_jsonrpc_2(message)
                  && message.get("method").and_then(Value::as_str).is_some()
                  && message.get("id").is_none()
          }
          '''
          strict_notification_predicate = '''fn is_server_notification(message: &Value) -> bool {
              is_jsonrpc_2(message)
                  && message.get("method").and_then(Value::as_str).is_some()
                  && message.get("id").is_none()
                  && has_no_response_members(message)
                  && has_valid_params(message)
          }
          '''
          if strict_notification_predicate.strip() not in text:
              if notification_predicate not in text:
                  raise SystemExit("server notification predicate anchor not found")
              text = text.replace(notification_predicate, strict_notification_predicate, 1)

          permissive_header = '''        let line = std::str::from_utf8(&line).context("stdout header was not valid UTF-8")?;
              let line = line.trim_end_matches(['\\r', '\\n']);
          '''
          strict_header = '''        ensure!(
                  line.ends_with(b"\\r\\n"),
                  "stdout header line did not end with CRLF"
              );
              let line = std::str::from_utf8(&line[..line.len() - 2])
                  .context("stdout header was not valid UTF-8")?;
          '''
          if strict_header.strip() not in text:
              if permissive_header not in text:
                  raise SystemExit("header terminator anchor not found")
              text = text.replace(permissive_header, strict_header, 1)

          harness.write_text(text)

          contract = Path("crates/perl-lsp-rs/tests/lsp_stdio_process_contract.rs")
          text = contract.read_text()
          text = text.replace(
              "fn strict_parser_rejects_truncated_and_oversized_headers() -> Result<()> {",
              "fn strict_parser_rejects_truncated_oversized_and_lf_only_headers() -> Result<()> {",
              1,
          )

          oversized = '''    let oversized = vec![b'x'; 5 * 1024];
              let error = RealProcessClient::parse_stdout_frame_for_test(&oversized)
                  .expect_err("oversized header must fail");
              ensure!(error.to_string().contains("exceeded"));
              Ok(())
          '''
          lf_only = '''    let oversized = vec![b'x'; 5 * 1024];
              let error = RealProcessClient::parse_stdout_frame_for_test(&oversized)
                  .expect_err("oversized header must fail");
              ensure!(error.to_string().contains("exceeded"));

              let body = br#"{\"jsonrpc\":\"2.0\",\"method\":\"window/logMessage\"}"#;
              let mut frame = format!("Content-Length: {}\\n\\n", body.len()).into_bytes();
              frame.extend_from_slice(body);
              let error = RealProcessClient::parse_stdout_frame_for_test(&frame)
                  .expect_err("LF-only framing must fail");
              ensure!(
                  error.to_string().contains("CRLF"),
                  "LF-only framing failed for the wrong reason: {error:#}"
              );
              Ok(())
          '''
          if lf_only.strip() not in text:
              if oversized not in text:
                  raise SystemExit("strict parser test anchor not found")
              text = text.replace(oversized, lf_only, 1)

          wrong_version = '''    ensure!(
                  !RealProcessClient::is_valid_server_notification_for_test(&wrong_version),
                  "wrong JSON-RPC version was accepted"
              );
          '''
          scalar_params = '''    ensure!(
                  !RealProcessClient::is_valid_server_notification_for_test(&wrong_version),
                  "wrong JSON-RPC version was accepted"
              );

              let scalar_params = json!({
                  "jsonrpc": "2.0",
                  "method": "window/logMessage",
                  "params": "not-an-object-or-array"
              });
              ensure!(
                  !RealProcessClient::is_valid_server_notification_for_test(&scalar_params),
                  "notification with scalar params was accepted"
              );
          '''
          if scalar_params.strip() not in text:
              if wrong_version not in text:
                  raise SystemExit("notification version test anchor not found")
              text = text.replace(wrong_version, scalar_params, 1)

          insertion_anchor = '''#[test]
          fn event_queue_overflow_does_not_deadlock_drop() -> Result<()> {
          '''
          request_test = '''#[test]
          fn server_request_requires_request_only_members_and_structured_params() -> Result<()> {
              let method = "client/registerCapability";
              let valid = json!({
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": method,
                  "params": { "registrations": [] }
              });
              ensure!(
                  RealProcessClient::is_valid_server_request_for_test(&valid, method),
                  "valid server request was rejected"
              );

              for invalid in [
                  json!({
                      "jsonrpc": "2.0",
                      "id": 2,
                      "method": method,
                      "params": true
                  }),
                  json!({
                      "jsonrpc": "2.0",
                      "id": 3,
                      "method": method,
                      "result": null
                  }),
                  json!({
                      "jsonrpc": "2.0",
                      "id": 4,
                      "method": method,
                      "error": { "code": -32603, "message": "hybrid" }
                  }),
              ] {
                  ensure!(
                      !RealProcessClient::is_valid_server_request_for_test(&invalid, method),
                      "invalid server request was accepted: {invalid}"
                  );
              }
              Ok(())
          }

          #[test]
          fn event_queue_overflow_does_not_deadlock_drop() -> Result<()> {
          '''
          if request_test.strip() not in text:
              if insertion_anchor not in text:
                  raise SystemExit("server request test insertion anchor not found")
              text = text.replace(insertion_anchor, request_test, 1)

          contract.write_text(text)

      - name: Format and verify focused contracts
        shell: bash
        run: |
          rustup run 1.95.0 rustfmt \
            --edition 2024 \
            --config-path . \
            crates/perl-lsp-rs/tests/support/real_process.rs \
            crates/perl-lsp-rs/tests/lsp_stdio_process_contract.rs
          cargo test -p perl-lsp-rs --test lsp_stdio_process_contract --locked -- --test-threads=1
          cargo test -p perl-lsp-rs --test semantic_definition --locked -- --test-threads=1

      - name: Restore carrier workflow and push reviewed result
        shell: bash
        run: |
          git show 601104f64bae50892a9cd1fe9ef40cf3e38f481c:.github/workflows/workflow-trigger-lint.yml > .github/workflows/workflow-trigger-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/perl-lsp-rs/tests/support/real_process.rs \
            crates/perl-lsp-rs/tests/lsp_stdio_process_contract.rs \
            .github/workflows/workflow-trigger-lint.yml
          git diff --cached --check
          git commit -m "test(lsp): enforce strict JSON-RPC framing envelopes"
          git push origin HEAD:test/lsp-real-process-6720
