name: Workflow Trigger Lint

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  finish-exact-process:
    if: github.head_ref == 'test/lsp-real-process-6720'
    name: Finish exact-process review fixes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 3
          ref: test/lsp-real-process-6720

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Execute reviewed transformer with syntax-bound header edit
        shell: python
        run: |
          import ast
          import subprocess
          import textwrap
          from pathlib import Path

          carrier = subprocess.run(
              ["git", "show", "HEAD^:.github/workflows/workflow-trigger-lint.yml"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          marker = '''      - name: Enforce strict JSON-RPC framing envelopes
                  shell: python
                  run: |
          '''
          if marker not in carrier:
              raise SystemExit("reviewed exact-process transformer was not found in parent carrier")
          section = carrier.split(marker, 1)[1].split("\n      - name:", 1)[0]
          source = textwrap.dedent(section).lstrip("\n")
          tree = ast.parse(source)
          target = None
          for node in ast.walk(tree):
              if not isinstance(node, ast.Assign) or not isinstance(node.value, ast.Call):
                  continue
              labels = [
                  argument.value
                  for argument in node.value.args
                  if isinstance(argument, ast.Constant) and isinstance(argument.value, str)
              ]
              if "header terminator" in labels:
                  target = node
                  break
          if target is None or target.end_lineno is None:
              raise SystemExit("header transformation node was not found")

          robust = '''start = text.index('        let line = std::str::from_utf8(&line)')
          end = text.index('        if line.is_empty()', start)
          strict_header = ''' + "'''" + '''        ensure!(
              line.ends_with(b"\\r\\n"),
              "stdout header line did not end with CRLF"
          );
          let line = std::str::from_utf8(&line[..line.len() - 2])
              .context("stdout header was not valid UTF-8")?;
          ''' + "'''" + '''
          text = text[:start] + strict_header + text[end:]'''
          lines = source.splitlines()
          lines[target.lineno - 1 : target.end_lineno] = robust.splitlines()
          patched = ("\n".join(lines) + "\n").encode()
          path = Path("/tmp/finish_pr6811.py")
          path.write_bytes(patched)
          compile(patched, str(path), "exec")
          exec(patched, {"__name__": "__main__"})

      - name: Format and verify focused contracts
        shell: bash
        run: |
          rustup run 1.95.0 rustfmt \
            --edition 2024 \
            --config-path . \
            crates/perl-lsp-rs/tests/support/real_process.rs \
            crates/perl-lsp-rs/tests/lsp_stdio_process_contract.rs
          cargo test -p perl-lsp-rs --test lsp_stdio_process_contract --locked -- --test-threads=1
          cargo test -p perl-lsp-rs --test semantic_definition --locked -- --test-threads=1

      - name: Restore carrier workflow and push reviewed result
        shell: bash
        run: |
          git show 601104f64bae50892a9cd1fe9ef40cf3e38f481c:.github/workflows/workflow-trigger-lint.yml > .github/workflows/workflow-trigger-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/perl-lsp-rs/tests/support/real_process.rs \
            crates/perl-lsp-rs/tests/lsp_stdio_process_contract.rs \
            .github/workflows/workflow-trigger-lint.yml
          git diff --cached --check
          git commit -m "test(lsp): enforce strict JSON-RPC framing envelopes"
          git push origin HEAD:test/lsp-real-process-6720
