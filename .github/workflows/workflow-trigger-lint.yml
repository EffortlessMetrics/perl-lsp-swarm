name: Workflow Trigger Lint

on:
  pull_request:
    branches: [main, master, test/lsp-real-process-6720]

permissions:
  contents: write

jobs:
  finish-capability-matrix:
    if: github.head_ref == 'test/lsp-capability-matrix-6735'
    name: Finish sparse capability matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 3
          ref: test/lsp-capability-matrix-6735

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Add absent inline-completion declaration row
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path("crates/perl-lsp-rs/tests/lsp_capability_negotiation_process.rs")
          text = path.read_text()
          if '"absent declaration"' not in text:
              pattern = r'''(    let cases = \[\n)(        \(\n            json!\(\{\n                "textDocument": \{\n                    "inlineCompletion": \{ "dynamicRegistration": true \}\n                \}\n            \}\),)'''
              replacement = r'''\1        (json!({}), true, false, "absent declaration"),
          \2'''
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"inline-completion case matrix: expected one match, found {count}")
          path.write_text(text)

      - name: Format and verify focused contracts
        shell: bash
        run: |
          rustup run 1.95.0 rustfmt \
            --edition 2024 \
            --config-path . \
            crates/perl-lsp-rs/tests/lsp_capability_negotiation_process.rs
          cargo test -p perl-lsp-rs --test lsp_capability_negotiation_process --locked -- --test-threads=1
          cargo test -p perl-lsp-rs --test semantic_definition --locked -- --test-threads=1

      - name: Restore carrier workflow and push reviewed result
        shell: bash
        run: |
          git show 9e5036fffa1e73a00cd458a21e4c2545b982c16f:.github/workflows/workflow-trigger-lint.yml > .github/workflows/workflow-trigger-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/perl-lsp-rs/tests/lsp_capability_negotiation_process.rs \
            .github/workflows/workflow-trigger-lint.yml
          git diff --cached --check
          git commit -m "test(lsp): prove absent inline-completion declaration"
          git push origin HEAD:test/lsp-capability-matrix-6735
