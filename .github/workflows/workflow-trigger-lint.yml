name: Workflow Trigger Lint

on:
  pull_request:
    branches: [main, master]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, master]

concurrency:
  group: workflow-trigger-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Workflow Trigger Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: stable

      - name: Run workflow trigger lint
        id: lint
        shell: bash
        run: |
          set +e
          cargo xtask workflow-trigger-lint \
            --policy .ci/policies/required-checks.toml \
            --receipt target/receipts/workflow-trigger-lint.json \
            --format json
          status=$?
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Check immutable action-pin provenance
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RECORDED_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.before }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          args=(
            --receipt target/receipts/action-pin-provenance.json
          )
          # pull_request jobs check out GitHub's simulated merge result, which is
          # rebuilt whenever either side moves, while the event-time
          # pull_request.base.sha lags it after intervening merges and charges
          # other people's pin changes to this candidate (#10194). Resolve the
          # merge base against the fetched base branch at run time instead;
          # unresolvable ancestry fails closed inside the tool. The scan is
          # bound to this subject: HEAD must be the simulated merge of this
          # candidate head, and origin must name this repository.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            args+=(
              --merge-base "origin/$PR_BASE_REF"
              --expect-merge-of "$PR_HEAD_SHA"
              --expect-origin "$REPOSITORY"
            )
          elif [[ "$RECORDED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$RECORDED_BASE_SHA" =~ ^0+$ ]]; then
            args+=(--base "$RECORDED_BASE_SHA")
          fi
          cargo run -p xtask --bin action-pin-provenance -- "${args[@]}"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-trigger-lint-receipts
          path: |
            target/receipts/workflow-trigger-lint.json
            target/receipts/action-pin-provenance.json
          if-no-files-found: warn

      - name: Summary
        if: always()
        env:
          LINT_EXIT_CODE: ${{ steps.lint.outputs.exit_code }}
        run: |
          if [ "$LINT_EXIT_CODE" = "0" ]; then
            echo "## Workflow trigger lint passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Workflow trigger lint found violations" >> "$GITHUB_STEP_SUMMARY"
            echo "Required-check policy in .ci/policies/required-checks.toml is enforced. Fix violations before merging." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-minimax-final-blobs:
    name: Publish validated MiniMax final blobs
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'EffortlessMetrics/perl-lsp-swarm' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/gh-aw-minimax-canary' &&
      github.event.pull_request.user.login == 'EffortlessSteven'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize and verify permanent tree
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_minimax_agent_final.py
          python3 -m py_compile scripts/ci/workflow_security_ratchet.py
          python3 -m unittest scripts/ci/test_workflow_security_ratchet.py
          python3 scripts/ci/workflow_security_ratchet.py validate-baseline \
            --root . \
            --baseline .ci/workflow-security-baseline.json \
            --baseline-root . \
            --report "${RUNNER_TEMP:?}/workflow-security-final.json"
          python3 - <<'PY'
          import json
          from pathlib import Path

          with Path('.ci/workflow-security-baseline.json').open(encoding='utf-8') as handle:
              baseline = json.load(handle)
          findings = baseline.get('findings', baseline.get('allowed_findings', []))
          if len(findings) != 87:
              raise SystemExit(f'expected 87 final findings, found {len(findings)}')
          if any(
              item.get('path') == '.github/workflows/minimax-agent-compile-check.yml'
              for item in findings
          ):
              raise SystemExit('permanent read-only compile check still has a finding')
          print('FINAL_TREE_FINDINGS=87')
          PY
          git diff --check

      - name: Upload validated files as inert Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          upload_blob() {
            local path="$1"
            jq -Rs '{content: ., encoding: "utf-8"}' "$path" |
              gh api --method POST "repos/${REPOSITORY}/git/blobs" --input - --jq '.sha'
          }
          baseline_blob="$(upload_blob .ci/workflow-security-baseline.json)"
          workflow_blob="$(upload_blob .github/workflows/minimax-agent-compile-check.yml)"
          printf 'BASELINE_BLOB_SHA=%s\n' "$baseline_blob"
          printf 'WORKFLOW_BLOB_SHA=%s\n' "$workflow_blob"
          sha256sum \
            .ci/workflow-security-baseline.json \
            .github/workflows/minimax-agent-compile-check.yml
