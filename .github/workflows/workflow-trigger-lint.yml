name: Workflow Trigger Lint

on:
  pull_request:
    branches: [main, master]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, master]

concurrency:
  group: workflow-trigger-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Workflow Trigger Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: stable

      - name: Run workflow trigger lint
        id: lint
        shell: bash
        run: |
          set +e
          cargo xtask workflow-trigger-lint \
            --policy .ci/policies/required-checks.toml \
            --receipt target/receipts/workflow-trigger-lint.json \
            --format json
          status=$?
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Check immutable action-pin provenance
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RECORDED_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.before }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          args=(
            --receipt target/receipts/action-pin-provenance.json
          )
          # pull_request jobs check out GitHub's simulated merge result, which is
          # rebuilt whenever either side moves, while the event-time
          # pull_request.base.sha lags it after intervening merges and charges
          # other people's pin changes to this candidate (#10194). Resolve the
          # merge base against the fetched base branch at run time instead;
          # unresolvable ancestry fails closed inside the tool. The scan is
          # bound to this subject: HEAD must be the simulated merge of this
          # candidate head, and origin must name this repository.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            args+=(
              --merge-base "origin/$PR_BASE_REF"
              --expect-merge-of "$PR_HEAD_SHA"
              --expect-origin "$REPOSITORY"
            )
          elif [[ "$RECORDED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$RECORDED_BASE_SHA" =~ ^0+$ ]]; then
            args+=(--base "$RECORDED_BASE_SHA")
          fi
          cargo run -p xtask --bin action-pin-provenance -- "${args[@]}"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-trigger-lint-receipts
          path: |
            target/receipts/workflow-trigger-lint.json
            target/receipts/action-pin-provenance.json
          if-no-files-found: warn

      - name: Summary
        if: always()
        env:
          LINT_EXIT_CODE: ${{ steps.lint.outputs.exit_code }}
        run: |
          if [ "$LINT_EXIT_CODE" = "0" ]; then
            echo "## Workflow trigger lint passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Workflow trigger lint found violations" >> "$GITHUB_STEP_SUMMARY"
            echo "Required-check policy in .ci/policies/required-checks.toml is enforced. Fix violations before merging." >> "$GITHUB_STEP_SUMMARY"
          fi
