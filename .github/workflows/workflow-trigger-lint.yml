name: Workflow Trigger Lint

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  finish-exact-process:
    if: github.head_ref == 'test/lsp-real-process-6720'
    name: Finish exact-process review fixes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 5
          ref: test/lsp-real-process-6720

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Execute reviewed transformer with preserved block indentation
        shell: python
        run: |
          import subprocess
          import textwrap
          from pathlib import Path

          carrier = subprocess.run(
              ["git", "show", "HEAD^:.github/workflows/workflow-trigger-lint.yml"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          marker = '''      - name: Execute reviewed transformer with syntax-bound insertions
                  shell: python
                  run: |
          '''
          if marker not in carrier:
              raise SystemExit("syntax-bound transformer wrapper was not found")
          section = carrier.split(marker, 1)[1].split("\n      - name:", 1)[0]
          source = textwrap.dedent(section).lstrip("\n")
          source = source.replace(
              '"HEAD^^:.github/workflows/workflow-trigger-lint.yml"',
              '"HEAD^^^:.github/workflows/workflow-trigger-lint.yml"',
              1,
          )
          source = source.replace(
              "targets.append((node.lineno, node.end_lineno, label, replacement))",
              "targets.append((node.lineno, node.end_lineno, node.col_offset, label, replacement))",
              1,
          )
          source = source.replace(
              "found = {label for _, _, label, _ in targets}",
              "found = {label for _, _, _, label, _ in targets}",
              1,
          )
          source = source.replace(
              "for start, end, _, replacement in sorted(targets, reverse=True):\n    lines[start - 1 : end] = replacement.splitlines()",
              "for start, end, column, _, replacement in sorted(targets, reverse=True):\n    indented = textwrap.indent(replacement, ' ' * column)\n    lines[start - 1 : end] = indented.splitlines()",
              1,
          )
          if "node.col_offset" not in source or "indented = textwrap.indent" not in source:
              raise SystemExit("transformer indentation patch did not apply")
          patched = source.encode()
          path = Path("/tmp/finish_pr6811_wrapper.py")
          path.write_bytes(patched)
          compile(patched, str(path), "exec")
          exec(patched, {"__name__": "__main__"})

      - name: Format and verify focused contracts
        shell: bash
        run: |
          rustup run 1.95.0 rustfmt \
            --edition 2024 \
            --config-path . \
            crates/perl-lsp-rs/tests/support/real_process.rs \
            crates/perl-lsp-rs/tests/lsp_stdio_process_contract.rs
          cargo test -p perl-lsp-rs --test lsp_stdio_process_contract --locked -- --test-threads=1
          cargo test -p perl-lsp-rs --test semantic_definition --locked -- --test-threads=1

      - name: Restore carrier workflow and push reviewed result
        shell: bash
        run: |
          git show 601104f64bae50892a9cd1fe9ef40cf3e38f481c:.github/workflows/workflow-trigger-lint.yml > .github/workflows/workflow-trigger-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/perl-lsp-rs/tests/support/real_process.rs \
            crates/perl-lsp-rs/tests/lsp_stdio_process_contract.rs \
            .github/workflows/workflow-trigger-lint.yml
          git diff --cached --check
          git commit -m "test(lsp): enforce strict JSON-RPC framing envelopes"
          git push origin HEAD:test/lsp-real-process-6720
