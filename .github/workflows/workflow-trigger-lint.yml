name: Sparse Capability Matrix

on:
  push:
    branches:
      - test/lsp-capability-matrix-6735
  pull_request:
    branches:
      - test/lsp-real-process-6720

permissions:
  contents: read

jobs:
  capability-matrix:
    name: Sparse capability matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Format and verify focused contracts
        shell: bash
        run: |
          rustup run 1.95.0 rustfmt \
            --edition 2024 \
            --config-path . \
            --check \
            crates/perl-lsp-rs/tests/lsp_capability_negotiation_process.rs
          cargo test -p perl-lsp-rs --test lsp_capability_negotiation_process --locked -- --test-threads=1
          cargo test -p perl-lsp-rs --test semantic_definition --locked -- --test-threads=1
