# Composite action for uploading gate receipts as artifacts
# Usage:
#   - uses: ./.github/actions/upload-receipt
#     with:
#       receipt-path: target/receipts/receipt.json
#       retention-days: 14

name: 'Upload Gate Receipt'
description: 'Uploads gate receipt and logs as workflow artifacts with summary'

inputs:
  receipt-path:
    description: 'Path to receipt.json file'
    required: false
    default: 'target/receipts/receipt.json'
  logs-path:
    description: 'Path to gate logs directory'
    required: false
    default: 'target/receipts/logs'
  artifacts-path:
    description: 'Path to additional artifacts'
    required: false
    default: 'target/receipts/artifacts'
  artifact-name:
    description: 'Name for the uploaded artifact'
    required: false
    default: 'gate-receipt'
  retention-days:
    description: 'Number of days to retain the artifact'
    required: false
    default: '14'
  generate-summary:
    description: 'Generate GitHub step summary from receipt'
    required: false
    default: 'true'

outputs:
  artifact-url:
    description: 'URL for the uploaded artifact'
    value: ${{ steps.upload.outputs.artifact-url }}
  receipt-exists:
    description: 'Whether the receipt file exists'
    value: ${{ steps.check.outputs.exists }}

runs:
  using: 'composite'
  steps:
    - name: Validate receipt path inputs
      shell: bash
      env:
        RECEIPT_PATH: ${{ inputs.receipt-path }}
        LOGS_PATH: ${{ inputs.logs-path }}
        ARTIFACTS_PATH: ${{ inputs.artifacts-path }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/validate_paths.py"

    - name: Check receipt exists
      id: check
      shell: bash
      env:
        RECEIPT_PATH: ${{ inputs.receipt-path }}
      run: |
        set -euo pipefail
        if [ -f "$RECEIPT_PATH" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          printf 'Receipt found at %s\n' "$RECEIPT_PATH"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          # `::warning::` is GitHub's workflow-command protocol, not plain text.
          # Percent-encode the caller-supplied value so it cannot alter the
          # annotation payload or terminate the command and start another one.
          encoded=${RECEIPT_PATH//%/%25}
          encoded=${encoded//$'\r'/%0D}
          encoded=${encoded//$'\n'/%0A}
          printf '::warning::Receipt not found at %s\n' "$encoded"
        fi

    - name: Upload gate receipt
      id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.receipt-path }}
          ${{ inputs.logs-path }}/*.log
          ${{ inputs.artifacts-path }}/*
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}

    - name: Generate summary
      if: inputs.generate-summary == 'true' && always()
      shell: bash
      env:
        RECEIPT_PATH: ${{ inputs.receipt-path }}
      run: |
        python3 - <<'PY'
        import html
        import json
        import os
        from pathlib import Path

        receipt_path_raw = os.environ["RECEIPT_PATH"]
        receipt_path = Path(receipt_path_raw)
        summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

        def summary_text(value: object) -> str:
            sanitized = str(value).replace("\r", " ").replace("\n", " ")
            return html.escape(sanitized, quote=True).replace("|", "&#124;")

        def summary_code(value: object) -> str:
            return f"<code>{summary_text(value)}</code>"

        if not summary_path:
            raise SystemExit(0)

        lines = ["### Gate Receipt", ""]

        if not receipt_path.is_file():
            lines.append(f"> Receipt not found at {summary_code(receipt_path_raw)}")
            Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")
            raise SystemExit(0)

        try:
            data = json.loads(receipt_path.read_text(encoding="utf-8"))
        except (json.JSONDecodeError, OSError) as error:
            lines.append(f"> Failed to read receipt: {summary_code(error)}")
            Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")
            raise SystemExit(0)

        # Header info
        lines.append(f"**Generated**: {summary_text(data.get('generated_at', 'unknown'))}")
        commit = str(data.get("commit", "unknown"))[:12]
        lines.append(f"**Commit**: {summary_code(commit)}")

        # Overall status
        raw_gates = data.get("gates", [])
        gates = [gate for gate in raw_gates if isinstance(gate, dict)] if isinstance(raw_gates, list) else []
        passed = sum(1 for gate in gates if gate.get("status") == "passed")
        failed = sum(1 for gate in gates if gate.get("status") == "failed")
        total = len(gates)

        if failed == 0:
            lines.append(f"**Status**: All {passed}/{total} gates passed")
        else:
            lines.append(f"**Status**: {failed}/{total} gates failed")

        lines.append("")

        # Gate table
        lines.append("| Gate | Status | Exit | Duration |")
        lines.append("|------|--------|------|----------|")

        for gate in gates:
            name = summary_text(gate.get("name", "unknown"))
            status = gate.get("status", "unknown")
            exit_code = summary_text(gate.get("exit_code", "?"))
            duration = summary_text(gate.get("duration_seconds", "?"))

            if status == "passed":
                status_text = "passed"
            elif status == "failed":
                status_text = "**FAILED**"
            else:
                status_text = summary_text(status)

            lines.append(f"| {name} | {status_text} | {exit_code} | {duration}s |")

        if "total_duration_seconds" in data:
            total_duration = summary_text(data["total_duration_seconds"])
            lines.append("")
            lines.append(f"**Total duration**: {total_duration}s")

        Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")
        PY
