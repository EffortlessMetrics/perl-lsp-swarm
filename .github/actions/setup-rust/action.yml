# Composite action for setting up Rust toolchain with caching
# Usage:
#   - uses: ./.github/actions/setup-rust
#     with:
#       toolchain: stable  # or '1.95.0', 'nightly', etc.
#       components: rustfmt, clippy
#       cache: true
#       sccache: false

name: 'Setup Rust'
description: 'Sets up Rust toolchain with caching for perl-lsp CI'

inputs:
  toolchain:
    description: 'Rust toolchain to install (stable, beta, nightly, or version like 1.95.0)'
    required: false
    default: 'stable'
  components:
    description: 'Additional components to install (comma-separated)'
    required: false
    default: 'rustfmt, clippy'
  cache:
    description: 'Enable cargo cache'
    required: false
    default: 'true'
  cache-key-suffix:
    description: 'Additional suffix for cache key differentiation'
    required: false
    default: ''
  sccache:
    description: 'Enable sccache for faster compilation'
    required: false
    default: 'false'
  install-just:
    description: 'Install just command runner'
    required: false
    default: 'false'
  install-nextest:
    description: 'Install cargo-nextest test runner'
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: 'Whether the cache was hit'
    value: ${{ steps.cache.outputs.cache-hit }}
  toolchain-version:
    description: 'Actual toolchain version installed'
    value: ${{ steps.toolchain.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Install Rust toolchain
      id: toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Cache cargo dependencies
      id: cache
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      with:
        key: ${{ runner.os }}-${{ inputs.toolchain }}-${{ inputs.cache-key-suffix }}-${{ hashFiles('Cargo.lock') }}
        cache-on-failure: true
        shared-key: 'perl-lsp'

    - name: Install sccache
      if: inputs.sccache == 'true'
      uses: mozilla-actions/sccache-action@2e7f9ec7921547d4b46598398ca573513895d0bd  # v0.0.4

    - name: Configure sccache
      if: inputs.sccache == 'true'
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

    - name: Install just
      if: inputs.install-just == 'true'
      uses: taiki-e/install-action@67729d5c413db75907f0e39bb04b9c868ff60  # v2.85.7
      with:
        tool: just

    - name: Install nextest
      if: inputs.install-nextest == 'true'
      uses: taiki-e/install-action@67729d5c413db75907f0e39bb04b9c868ff60  # v2.85.7
      with:
        tool: nextest

    - name: Show toolchain info
      shell: bash
      run: |
        echo "::group::Toolchain Information"
        rustc --version
        cargo --version
        rustfmt --version 2>/dev/null || true
        clippy-driver --version 2>/dev/null || true
        echo "::endgroup::"
