name: Bug Report
description: Report a reproducible bug in perl-lsp, its parser, or editor integrations
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide the smallest reproducible journey you can share.

        **VS Code public-beta users:** `Perl: Report Issue` can copy a bounded support packet with product/editor identity and only the support state the extension can establish safely. Please review the packet before pasting it below. Do not paste private source, full logs, environment dumps, credentials, debugger values, or test output unless a maintainer asks for one specifically bounded excerpt.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the project is affected?
      options:
        - VS Code extension
        - LSP server (perl-lsp / perllsp)
        - Parser (perl-parser)
        - Lexer (perl-lexer)
        - Completion provider
        - Hover provider
        - Go-to-definition / references / symbols
        - Diagnostics
        - Workspace indexing
        - Formatting / critic
        - Test Explorer
        - DAP / debugger
        - Installation / managed binaries / update
        - Other
    validations:
      required: true

  - type: dropdown
    id: install-source
    attributes:
      label: Installation / Evidence Source
      description: This keeps released-public reports distinct from source/pre-release builds.
      options:
        - Released public artifact (Marketplace/Open VSX/GitHub release/package)
        - Pre-release or local/source build
        - Unknown installation source
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the behavior you believe is wrong.
      placeholder: When I open a Perl file with ..., perl-lsp ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal steps that reproduce the same behavior. Use a small public/synthetic example where possible.
      value: |
        1. Start from ...
        2. Open / edit / invoke ...
        3. ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead.
    validations:
      required: true

  - type: dropdown
    id: restart-result
    attributes:
      label: Does an explicit Perl language-server restart change the result?
      description: In VS Code use the normal Perl restart command; do not reinstall or delete caches just to answer this.
      options:
        - No — it reproduces after restart
        - Yes — restart clears the problem
        - Not tested / not applicable
    validations:
      required: true

  - type: textarea
    id: support-packet
    attributes:
      label: VS Code Support Packet (recommended for VS Code reports)
      description: |
        In VS Code run `Perl: Report Issue` → `Copy Support Packet`, review it, then paste it here.
        The packet is user-triggered and should contain bounded/redacted product state rather than full logs or source.
        Leave blank for other editors or if packet generation is unavailable.
      render: text

  - type: textarea
    id: public-reproducer
    attributes:
      label: Minimal Public Reproducer
      description: |
        If you can share a minimal public fixture/repository, link it or paste only the synthetic/minimized code needed to reproduce the issue.
        Do not attach proprietary/private project source solely for this report.

  - type: input
    id: version
    attributes:
      label: perl-lsp / perllsp Version (if known)
      description: |
        Run `perllsp --version`, or use the VS Code support packet. Leave blank rather than guessing if the executed binary identity is unknown.
      placeholder: "perllsp 0.17.0"

  - type: input
    id: perl-version
    attributes:
      label: Perl Version (if relevant)
      description: Output of `perl --version` when the reported path actually depends on the Perl runtime or an external Perl tool.
      placeholder: "perl 5.38.2"

  - type: input
    id: editor
    attributes:
      label: Editor / Client
      description: Which editor or LSP client are you using?
      placeholder: "VS Code 1.128, Neovim 0.11, Helix 25.x, etc."
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Ubuntu 24.04, macOS 15, Windows 11, etc."
    validations:
      required: true

  - type: textarea
    id: bounded-diagnostics
    attributes:
      label: Additional Bounded Diagnostics (optional)
      description: |
        Add only the small diagnostic excerpt needed to explain the reproduction if the support packet is insufficient.
        Avoid full Output-panel dumps, complete settings files, environment-variable dumps, home/workspace/cache paths, credentials, private source, test output, and debugger variable/evaluate contents.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other non-sensitive context that materially helps reproduce or classify the problem.
