name: Substantive concern or change
description: Capture a real concern lightly so research and planning can progressively mature it without inventing implementation precision.
title: ""
body:
  - type: markdown
    attributes:
      value: |
        ## Progressive issue intake

        Use this form for a substantive bug, feature, architecture concern, tooling gap, or product outcome that needs investigation.

        This is the beginning of `prepare-issue`, not a builder-readiness gate. Record what is known now. Current source research, related-work search, vision/authority review, the plan, proof strategy, dependencies, and risk are added as the issue matures.

        Do not invent a root cause, exact file list, or test implementation merely to complete the form.

  - type: textarea
    id: problem
    attributes:
      label: Problem or desired outcome
      description: What appears wrong, missing, stale, duplicated, unsafe, or worth enabling?
      placeholder: |
        A real Perl workspace can produce compiler facts for this case, but the live definition provider still falls back to a text scan and may return the wrong package declaration.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Current evidence
      description: Record the observation, reproduction, source location, test, receipt, external report, or other basis available now. Separate facts from hypotheses.
      placeholder: |
        Observed:
        - ...

        Basis:
        - current source / test / receipt / external authority

        Hypothesis or uncertainty:
        - ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Known context
      description: Likely owner or consumer, related issues/PRs, product constraints, prior decisions, or known uncertainty. Best-current knowledge is enough.
      placeholder: |
        - Likely owner: ...
        - User or downstream consumer: ...
        - Related issue / PR / spec: ...
        - Important constraint or non-goal: ...
    validations:
      required: false

  - type: textarea
    id: next_questions
    attributes:
      label: Questions for issue preparation
      description: Which uncertainties should `prepare-issue` resolve before proof or implementation?
      placeholder: |
        - Is this already solved or superseded?
        - Which semantic owner should supply the fact?
        - Can a real editor request reach the proposed path?
        - What is the cheapest discriminating proof?
    validations:
      required: false
