# Canonical compiler-profile proof-target topology (#12411).
#
# Route authority train: #12125-#12129. This register is the checked
# denominator consumed by `cargo xtask test-topology` routing and nonzero-work
# receipts. One exact row per declared target; one receipt per routed row per
# candidate head; aggregate counts never backfill an omitted target.
#
# `declared_pending` rows pin future leaf identities (owner issue) before the
# leaf lands; they carry no execution and can never go green. The landing PR
# flips its own row to `active` with exact execution fields plus
# `min_work_items > 0`; activation is a review-visible diff.
#
# Dormancy is not evidence. Workflow YAML and check colour are not semantic
# profile evidence. Live required-check or branch-protection mutation stays
# outside this register's authority.

schema_version = "test_topology_register.v1"
cohort = "compiler-profile"
register_id = "compiler-profile.v1"
description = "Maintained compiler-profile proof targets: model, inventory, observation, evaluation, transition, history, retention, privacy, replay, residual, status, claim, succession, wake-event routing, V01-V11 verification, expansion cohorts, operational generations, oracle/transform/migration/compounding trains."

watch_packages = ["xtask"]
namespace_markers = ["compiler_profile"]

