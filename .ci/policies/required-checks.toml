workflow_result = "propagate"
events = ["workflow_dispatch"]
required = false
policy_role = "advisory"
applicability = "conditional"
enforcement = "neither"
reason = "#2266/#17208 retain merge-advisory semver against the canonical release baseline. Detected breaks still fail the check command; required=false and enforcement=neither remain unchanged. Run applicable authoring proof through scripts/ci/semver_pr_check.sh in-session; ci-nightly.yml:semver-check retains deep admission. The retained PR-only body is not G proof or a qualified manual equivalent."
