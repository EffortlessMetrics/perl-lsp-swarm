applicability = "always-or-scoped-noop"
enforcement = "neither"
reason = "CP00 containment guard (#10413) fails internally contradictory terminal close relations and NOT_PROVEN evidence before semantic evaluation; required-promotion review stays under #10168."

[[checks]]
