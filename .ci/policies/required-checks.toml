enforcement = "neither"
reason = "AR02 advisory exact-head review-context check (#11795): reports PASS_NOT_APPLICABLE or typed non-green verdicts per governed #11793 surface row; required-promotion review stays under #11796."

[[checks]]
name = "Public API Surface (facade PR)"
producer = "repository-job"
workflow = ".github/workflows/ci.yml"
job = "public-api-pr"
workflow_result = "propagate"
events = ["workflow_dispatch"]
required = false
policy_role = "advisory"
applicability = "conditional"
enforcement = "neither"
reason = "#2266 remains merge-advisory: required=false, policy_role=advisory, enforcement=neither. Applicable authoring proof is just public-api-check in-session; ci-nightly.yml:public-api-check retains schedule/explicit deep admission. The retained PR/push body is not G proof or a qualified manual equivalent. #17903 retires ordinary PR and #16815 main-push replay without promoting or deleting the existing advisory exception."

[[checks]]
name = "Semver Compatibility (facade PR)"
producer = "repository-job"
