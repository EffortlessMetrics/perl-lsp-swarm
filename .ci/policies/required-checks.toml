version = 2
source = "github-enforcement-union"

# `[[check]]` is workflow-trigger-lint input. Its `required` bit means the
# workflow receives the required-workflow trigger contract; it does not claim
# GitHub branch protection or ruleset enforcement.

[[check]]
name = "CI Gate"
workflow = ".github/workflows/ci.yml"
required = true
contract_role = "required-workflow-shape"

  [[check.exemption]]
  clause = "pull-request-trigger"
  status = "accepted"
  reason = "#17903 prohibits ordinary development Actions; required integration work runs on actual native merge-group G, not Draft or Ready events."
  tracking = "17903"

  [[check.exemption]]
  clause = "push-targets-master"
  status = "accepted"
  reason = "#17903 retires routine main-push qualification; protected integration is proved on actual G before landing."
  tracking = "17903"

[[check]]
name = "Perl LSP Rust Small Result"
workflow = ".github/workflows/em-ci-routed-rust.yml"
required = true
contract_role = "required-workflow-shape"

  [[check.exemption]]
  clause = "pull-request-trigger"
  status = "accepted"
  reason = "#17903 prohibits ordinary development Actions; required integration work runs on actual native merge-group G, not Draft or Ready events."
  tracking = "17903"

  [[check.exemption]]
  clause = "push-targets-master"
  status = "accepted"
  reason = "#17903 retires routine main-push qualification; protected integration is proved on actual G before landing."
  tracking = "17903"

[[check]]
name = "ripr+ New Gap Gate"
workflow = ".github/workflows/ripr.yml"
required = true
contract_role = "required-workflow-shape"

  [[check.exemption]]
  clause = "pull-request-trigger"
  status = "accepted"
  reason = "#17903 prohibits ordinary development Actions; required integration work runs on actual native merge-group G, not Draft or Ready events."
  tracking = "17903"

  [[check.exemption]]
  clause = "push-targets-master"
  status = "accepted"
  reason = "#17903 retires routine main-push qualification; protected integration is proved on actual G before landing."
  tracking = "17903"

  # Deliberate and argued in the workflow itself: RIPR is evidence production,
  # and a cancelled run becomes a false red on a required context because the
  # aggregator has no branch for a cancelled child (#16087). The cost of the
  # current implementation is measured in #16141 — a superseded head's run
  # holds the concurrency slot while the current head waits — so the exemption
  # is accepted for the property, not for the implementation.
  [[check.exemption]]
  clause = "event-aware-concurrency"
  status = "accepted"
  reason = "cancel-in-progress is false so a cancelled run cannot become a false red on a required context; the queueing cost is tracked in #16141."
  tracking = "16141"

[[check]]
name = "validate-title"
workflow = ".github/workflows/pr-title-check.yml"
required = true
contract_role = "required-workflow-shape"

  # The actual-G leaf reads complete native membership and authenticated H
  # intake, executes only protected B source and never receives write authority.
  [[check.exemption]]
  clause = "pull-request-trigger"
  status = "accepted"
  reason = "Ordinary development Actions are prohibited. Current titles are validated for every proved actual-G member; trusted owning-session publication retains label/comment housekeeping (#17903/#18255)."
  tracking = "16164"

  [[check.exemption]]
  clause = "push-targets-master"
  status = "accepted"
  reason = "A push to main has no PR title; the check is meaningless outside a pull request."
  tracking = "16164"

  [[check.exemption]]
  clause = "event-aware-concurrency"
  status = "accepted"
  reason = "A five-minute metadata job with no runner cost worth cancelling; the clause exists to stop long candidate builds stacking up."
  tracking = "16164"

[[check]]
name = "Methodology Gate"
workflow = ".github/workflows/methodology-gate.yml"
required = false
contract_role = "advisory-workflow-shape"

[[check]]
name = "Semantic Close Containment"
workflow = ".github/workflows/semantic-close-containment.yml"
required = false
contract_role = "advisory-workflow-shape"

[[check]]
name = "Authority Transfer Review"
workflow = ".github/workflows/authority-transfer-review.yml"
required = false
contract_role = "advisory-workflow-shape"

[[check]]
name = "Gate Enforcement Contract"
workflow = ".github/workflows/gate-enforcement-contract.yml"
required = true
contract_role = "required-workflow-shape"

  [[check.exemption]]
  clause = "pull-request-trigger"
  status = "accepted"
  reason = "#17903 prohibits ordinary development Actions; this offline contract runs in-session and on actual native merge-group G."
  tracking = "17903"

  [[check.exemption]]
  clause = "push-targets-master"
  status = "accepted"
  reason = "#17903 prohibits routine main-push qualification; protected integration is proved on actual G before landing."
  tracking = "17903"

  [[check.exemption]]
  clause = "event-aware-concurrency"
  status = "accepted"
  reason = "No ordinary PR event exists to supersede; per-G concurrency with cancellation disabled preserves the required integration result."
  tracking = "17903"

# `[[checks]]` is the emitted status-context inventory. The fields answer
# different questions and must not be inferred from each other:
#
# - producer: repository-owned workflow job or external integration
# - workflow_result: whether a repository job propagates or continues on failure
# - events: workflow events on which this context is expected to be reachable
# - policy_role / required: repository merge-policy role
# - applicability: always, conditional, planned, or not applicable
# - enforcement: claimed classic-protection/ruleset source
# - classic_app_id: explicit classic-protection GitHub App binding
# - ruleset_integration_id: explicit ruleset integration binding
#
# Producer and enforcement binding are separate axes. Neither binding is
# inferred from the workflow, job, producer class, or context name.

[[checks]]
name = "Non-Rust policy exact-tree"
producer = "repository-job"
workflow = ".github/workflows/non-rust-policy.yml"
job = "exact-tree"
workflow_result = "propagate"
events = ["merge_group", "workflow_dispatch"]
required = false
policy_role = "advisory"
applicability = "always-or-scoped-noop"
enforcement = "neither"
reason = "Shadow exact-tree policy evaluator; advisory until canaries and ruleset promotion complete."

[[checks]]
name = "Perl LSP Rust Small Result"
producer = "repository-job"
workflow = ".github/workflows/em-ci-routed-rust.yml"
job = "rust-small-result"
workflow_result = "propagate"
events = ["merge_group", "workflow_dispatch"]
required = true
policy_role = "required"
applicability = "always-or-scoped-noop"
enforcement = "github-ruleset"
ruleset_integration_id = 15368
reason = "Live main ruleset (id 16664791) requires the routed Rust aggregate and its recorded-main-red refusal before merge, bound to the GitHub Actions integration. The former #16168 push baseline is retired by #17903; qualification belongs to actual G."

[[checks]]
name = "ripr+ New Gap Gate"
producer = "repository-job"
workflow = ".github/workflows/ripr.yml"
job = "ripr"
workflow_result = "propagate"
events = ["merge_group", "workflow_dispatch"]
required = true
policy_role = "required"
applicability = "always-or-scoped-noop"
enforcement = "github-ruleset"
ruleset_integration_id = 15368
reason = "Live main ruleset (id 16664791) requires deterministic RIPR receipts from the GitHub Actions integration; named new gaps in changed production files block, while sensor availability remains advisory."

[[checks]]
name = "Compile All Targets (bit-rot guard)"
producer = "repository-job"
workflow = ".github/workflows/ci.yml"
job = "integration-required"
workflow_result = "propagate"
events = ["merge_group", "workflow_dispatch"]
required = true
policy_role = "required"
applicability = "always-or-scoped-noop"
enforcement = "github-ruleset"
ruleset_integration_id = 15368
reason = "Protected Actions context retains compilation and joins the existing fail-closed CI Gate in the same native run/attempt. Every selected shard and UX obligation must succeed independently of main health; missing, skipped or cancelled dependencies remain NOT_PROVEN (#10063/#18269)."

[[checks]]
name = "Conflict marker check"
producer = "repository-job"
workflow = ".github/workflows/ci.yml"
job = "conflict-markers"
workflow_result = "propagate"
events = ["merge_group", "workflow_dispatch"]
required = true
policy_role = "required"
applicability = "conditional"
enforcement = "github-ruleset"
ruleset_integration_id = 15368
reason = "Live main ruleset (id 16664791) requires the conflict-marker scan job before merge, bound to the GitHub Actions integration (check-run read-back on main PR heads observed app.id 15368 for this context); workflow prerequisites control when the job is selected (#15348). A job-level skip leaves GitHub expecting this name; diagnose with scripts/ci/detect_required_check_registration.py (#16469)."

[[checks]]
name = "validate-title"
producer = "repository-job"
workflow = ".github/workflows/pr-title-check.yml"
job = "validate-title"
workflow_result = "propagate"
events = ["merge_group"]
required = true
policy_role = "required"
applicability = "always-or-scoped-noop"
enforcement = "github-ruleset"
ruleset_integration_id = 15368
reason = "The existing Actions-bound validate-title context now proves the complete current native G prefix, every App-authenticated H-to-entry intake, ordered B/H tree equivalence and current per-member title semantics from protected B. No PR association or queued-ref number supplies membership. Publisher binding and effective protection still require explicit activation (#18255/#17903)."

[[checks]]
name = "Rust formatting"
producer = "repository-job"
workflow = ".github/workflows/ci.yml"
job = "rust-formatting"
workflow_result = "propagate"
events = ["merge_group", "workflow_dispatch"]
required = false
policy_role = "advisory"
applicability = "always-or-scoped-noop"
enforcement = "neither"
reason = "Advisory receipt-producing dedicated formatter context. Live merge blocking is owned by the required Perl LSP Rust Small Result path (#9127/#12320). Duplicate meta-shard fmt execution is retired by #9959. Settings-app promotion of this context remains #7087 and is not claimed here."

[[checks]]
name = "Codecov / Patch 95"
producer = "repository-job"
workflow = ".github/workflows/ci-nightly.yml"
job = "test-coverage"
workflow_result = "propagate"
events = ["schedule", "workflow_dispatch"]
required = false
policy_role = "advisory"
applicability = "conditional"
enforcement = "neither"
reason = "Coverage is advisory and expensive; the workflow selects it only for scheduled or explicitly manual coverage runs."

[[checks]]
name = "codecov/patch"
producer = "external"
workflow = "codecov"
required = false
policy_role = "informational"
applicability = "conditional"
enforcement = "neither"
reason = "External Codecov telemetry is not merge authority."

[[checks]]
name = "tokmd Review Cockpit"
producer = "repository-job"
