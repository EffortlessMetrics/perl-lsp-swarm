# Canonical parser-accuracy metric registry.
#
# Authored policy: declares what each emitted parser-accuracy metric MEANS.
# `.ci/schemas/parser-accuracy.schema.json` stays structural; metric semantics live here.
# Consumed by `xtask/src/tasks/metrics/parser_accuracy/registry.rs`, which derives each
# emitted row's `direction` and `confidence` and fails the artifact build closed when a
# row violates its entry. See issue #14553 (parent #8189).
#
# Fields per metric:
#   family                       evidence plane that owns the metric
#   kind                         ratio | count | duration_ms | bytes | scalar
#   direction                    up | down | flat | neutral (which way is better)
#   min / max                    inclusive valid range for a measured value
#   zero_budget                  a measured value other than 0 is a hard violation
#   min_sample_count             below this a row must be insufficient_data
#   high_confidence_sample_count below this a row must not claim `high` confidence
#   cadences                     cadences this metric may be emitted at

schema_version = 1

[[metric]]
name = "allocated_bytes"
family = "cost"
kind = "bytes"
direction = "down"
min = 0.0
zero_budget = false
min_sample_count = 1
high_confidence_sample_count = 1
cadences = ["pr", "merge_gate", "nightly", "release"]

