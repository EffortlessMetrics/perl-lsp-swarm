[[metric]]
# Not a bounded ratio: `total_reparsed_bytes` accumulates across every edit in an
# incremental expectation while the denominator is only the final source length, so a
# multi-edit expectation whose edits each fall back to a full reparse legitimately exceeds
# 1.0. Declared scalar so authored policy does not encode a bound the emitter cannot honour.
