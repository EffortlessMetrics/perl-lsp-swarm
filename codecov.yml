# Codecov configuration for the parser-branch coverage evidence lane.
# See docs/ci/codecov-rollout.md (PR Cov-1) for the claim boundary.

codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "50...85"

  status:
    project:
      parser:
        target: auto
        threshold: 5%
        informational: true
        flags:
          - parser-branch
    patch:
      parser:
        target: 60%
        threshold: 25%
        informational: true
        flags:
          - parser-branch

comment: false

github_checks:
  annotations: false

flags:
  parser-branch:
    paths:
      - crates/perl-parser/src/
      - crates/perl-parser-core/src/
      - crates/perl-lexer/src/
      - crates/perl-ast/src/
      - crates/perl-ast-v2/src/
      - crates/perl-token/src/
    carryforward: true

ignore:
  - "archive/**"
  - "target/**"
  - "crates/tree-sitter-perl-c/**"
  - "crates/tree-sitter-perl-rs/**"
  - "crates/*/tests/**"
  - "crates/*/benches/**"
  - "crates/*/examples/**"
  - "crates/*/build.rs"
  - "xtask/**"
  - "fuzz/**"
  - "vscode-extension/**"
  - "**/*_generated.rs"
