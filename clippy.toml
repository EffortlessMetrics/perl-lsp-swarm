# clippy.toml
# Keep pedantic on, but chill some noisy lints for a parser project.
# warn-on-all-wildcard-imports = false
msrv = "1.95"

# Common pedantic relaxations for parser projects
allow-private-module-inception = true
too-many-arguments-threshold = 8
type-complexity-threshold = 350
cognitive-complexity-threshold = 50
too-many-lines-threshold = 500

# No method-level exceptions are configured.
disallowed-methods = []

# No field-level exceptions are configured (#6114).
# When fields are added to the denylist, they go here.
disallowed-fields = []
