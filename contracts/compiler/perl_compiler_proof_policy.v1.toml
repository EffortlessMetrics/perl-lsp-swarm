[[dimensions]]
dimension_id = "value_context"
values = ["scalar", "list", "void", "unknown"]
owner_issue = "#2275"
claim_boundary = "Boolean is scalar context plus truth demand, not a fifth value context."

[[dimensions]]
dimension_id = "evaluation_demand"
values = ["value", "truth", "definedness"]
owner_issue = "#2275"
claim_boundary = "Truth and definedness demand remain distinct."

[[dimensions]]
dimension_id = "access_mode"
values = ["read", "write", "read_modify_write", "alias", "localize"]
owner_issue = "#2275"
claim_boundary = "Access mode is independent from value context."

[[dimensions]]
dimension_id = "storage_class"
values = ["lexical", "package", "state", "localized", "element", "slice", "glob", "tied", "magical"]
owner_issue = "#6659"
claim_boundary = "Storage identity and lifetime must not collapse into spelling."

[[dimensions]]
dimension_id = "evaluation_order"
values = ["left_to_right", "short_circuit", "condition_then_arm", "register_then_unwind", "unknown"]
owner_issue = "#2017"
claim_boundary = "HIR preorder is not execution order."

[[dimensions]]
dimension_id = "evaluate_once"
values = ["required", "not_applicable", "unknown"]
owner_issue = "#4847"
claim_boundary = "Selectors, receivers, and computed places cannot be duplicated by lowering."

[[dimensions]]
dimension_id = "control_flow"
values = ["straight", "branch", "loop", "postfix_modifier", "return", "loop_transfer", "goto", "exception", "dynamic_exit"]
owner_issue = "#2347"
claim_boundary = "Ordinary, terminal, and dynamic exits remain distinct."

[[dimensions]]
dimension_id = "exception_flow"
values = ["none", "caught", "uncaught", "rethrow", "cleanup", "dynamic"]
owner_issue = "#6661"
claim_boundary = "Exceptional successors cannot be represented as ordinary fallthrough."

[[dimensions]]
dimension_id = "phase"
values = ["runtime", "begin", "unitcheck", "check", "init", "end"]
owner_issue = "#6664"
claim_boundary = "Encounter order, compile schedule, and lifecycle execution are separate."

[[dimensions]]
dimension_id = "compile_state"
values = ["strict", "warnings", "feature", "version", "include_roots", "imports", "constants", "prototypes", "dynamic"]
owner_issue = "#4810"
claim_boundary = "Recording an effect does not prove source-ordered application."

[[dimensions]]
dimension_id = "module_order"
values = ["same_file", "static_use", "static_require", "runtime_require", "scc", "stale_dependency"]
owner_issue = "#2425"
claim_boundary = "Compile-time and runtime dependency edges must not collapse."

[[dimensions]]
dimension_id = "call_syntax"
values = ["parenthesized", "bare", "ampersand", "arrow", "indirect", "core_qualified"]
owner_issue = "#5242"
claim_boundary = "Surface syntax is independent from dispatch semantics."

[[dimensions]]
dimension_id = "dispatch_kind"
values = ["named_sub", "coderef", "method", "builtin", "list_operator", "dynamic"]
owner_issue = "#5242"
claim_boundary = "Dispatch identity and syntax remain orthogonal."

[[dimensions]]
dimension_id = "argument_context"
values = ["scalar", "list", "void", "alias", "block", "implicit", "unknown"]
owner_issue = "#5242"
claim_boundary = "Each argument position may carry a distinct context/access contract."

[[dimensions]]
dimension_id = "prototype_contract"
values = ["ordinary", "visible_prototype", "ampersand_bypass", "builtin", "unknown"]
owner_issue = "#4819"
claim_boundary = "Prototype visibility and bypass behavior are source/phase ordered."

[[dimensions]]
dimension_id = "operator_family"
values = ["arithmetic", "string", "comparison", "bitwise", "logical", "defined_or", "range", "sequence", "smartmatch", "overloaded"]
owner_issue = "#6658"
claim_boundary = "Operator spelling alone does not prove primitive semantics."

[[dimensions]]
dimension_id = "implicit_topic"
values = ["explicit_operand", "implicit_topic", "localized_topic", "aliased_topic", "unknown"]
owner_issue = "#6666"
claim_boundary = "Omitted, implicit, and unknown operands are separate states."

[[dimensions]]
dimension_id = "match_state"
values = ["none", "captures", "named_captures", "position", "clobbered", "dynamic"]
owner_issue = "#6666"
claim_boundary = "Regex operations can read and overwrite hidden interpreter state."

[[dimensions]]
dimension_id = "feature_state"
values = ["enabled", "disabled", "version_mismatch", "deprecated", "recovered"]
owner_issue = "#6674"
claim_boundary = "Parse success does not prove semantic enablement."

[[dimensions]]
dimension_id = "package_scope"
values = ["current_package", "qualified_package", "nested_package", "dynamic_package", "stale_package"]
owner_issue = "#6668"
claim_boundary = "Package identity and runtime stash mutation remain distinct."

[[dimensions]]
dimension_id = "aliasing"
values = ["none", "binding_alias", "element_alias", "slice_alias", "glob_slot_alias", "dynamic"]
owner_issue = "#6659"
claim_boundary = "Aliasing must be explicit rather than inferred from writes."

[[dimensions]]
dimension_id = "localization"
values = ["none", "lexical_scope", "package_value", "glob", "topic", "exception_state", "unknown"]
owner_issue = "#6659"
claim_boundary = "Localization carries save/restore obligations, not ordinary assignment."

[[dimensions]]
dimension_id = "dynamic_boundary"
values = ["none", "operation", "place", "container", "package", "module_world", "host"]
owner_issue = "#4770"
claim_boundary = "Boundary impact must be narrowed to the strongest supported scope."

[[dimensions]]
dimension_id = "source_region"
values = ["perl_code", "format_body", "data_payload", "end_payload", "recovery_region"]
owner_issue = "#6675"
claim_boundary = "Non-code source regions must not leak into ordinary Perl traversal."

[[dimensions]]
dimension_id = "io_capability"
values = ["none", "declared_fixture", "filesystem", "stream", "process", "network", "host_unknown"]
owner_issue = "#6679"
claim_boundary = "Static analysis cannot silently acquire host IO authority."

[[dimensions]]
dimension_id = "lifecycle"
values = ["none", "registration", "active", "teardown", "destruction", "unknown"]
owner_issue = "#6683"
claim_boundary = "Registration, active state, teardown, and destruction are separate obligations."

[[dimensions]]
dimension_id = "hidden_effect"
values = ["none", "bounded_call", "place_mutation", "container_mutation", "package_mutation", "host", "unknown"]
owner_issue = "#6683"
claim_boundary = "Ordinary-looking operations may invoke hidden calls or mutations."

[[dimensions]]
dimension_id = "cleanup"
values = ["none", "finally", "defer", "localization_restore", "destructor", "unknown"]
owner_issue = "#6661"
claim_boundary = "Cleanup obligations must be attached to every relevant exit path."

[[dimensions]]
dimension_id = "recovery_state"
values = ["clean", "recovered", "missing", "malformed", "ambiguous"]
owner_issue = "#5238"
claim_boundary = "Recovered syntax and exact semantic eligibility remain distinct."

[[dimensions]]
dimension_id = "object_dispatch"
values = ["direct", "inherited", "qualified", "super", "autoload", "dynamic", "missing"]
owner_issue = "#6672"
claim_boundary = "Static lookup, bounded candidates, missing results, and dynamic dispatch remain distinct."

[[dimensions]]
dimension_id = "inheritance"
values = ["none", "single", "multiple", "role_composition", "dynamic", "cycle"]
owner_issue = "#4818"
claim_boundary = "Inheritance order, composition, cycles, and dynamic mutation require separate proof."

[[dimensions]]
dimension_id = "result_shape"
values = ["scalar", "list", "key_value_list", "lvalue_list", "void", "unknown"]
owner_issue = "#5244"
claim_boundary = "Value-list, key/value-list, and lvalue-list results cannot collapse."

[[dimensions]]
dimension_id = "incremental_edit"
values = ["unchanged", "body_only", "interface_change", "source_boundary_change", "rename", "delete", "stale"]
