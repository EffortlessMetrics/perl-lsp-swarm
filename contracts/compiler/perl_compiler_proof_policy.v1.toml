claim_boundary = "Edit class determines invalidation scope and stale-evidence rejection."

[[dimensions]]
dimension_id = "perl_version"
values = ["declared_current", "compatible", "older", "newer", "experimental", "unknown"]
owner_issue = "#4826"
claim_boundary = "Version-specific syntax and behavior require exact version identity."

[[dimensions]]
dimension_id = "value_shape"
values = ["undef", "number", "string", "version", "list", "array", "hash", "reference", "code", "unknown"]
owner_issue = "#6658"
claim_boundary = "Static value shape must not imply runtime coercion or execution."

