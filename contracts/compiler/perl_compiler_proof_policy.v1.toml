schema_version = "perl_compiler_proof_policy.v1"
policy_id = "perl_compiler_proof_policy_seed_v1"
controller_issue = "#6689"
concept_ledger_schema = "perl_compiler_concepts.v1"
coverage_scope = "Closed proof-class, composition-dimension, and campaign vocabulary for the current compiler concept programme."
claim_boundary = "This policy defines admissible proof shapes. It does not satisfy any concept obligation or authorize provider promotion."
complete = false

[[proof_classes]]
class_id = "positive_gold"
purpose = "Independently authored expected facts for supported positive behavior."
authority = "independent_gold"
claim_stages = ["body_hir", "pir_a", "effects_world", "eir", "provider"]
circular_output_allowed = false
missing_effect = "blocks_claim"
owner_issue = "#4760"

[[proof_classes]]
class_id = "negative_gold"
purpose = "Changed-shape and near-miss expectations that reject false semantic matches."
authority = "independent_gold"
claim_stages = ["body_hir", "pir_a", "effects_world", "eir", "provider"]
circular_output_allowed = false
missing_effect = "blocks_claim"
owner_issue = "#4760"

[[proof_classes]]
class_id = "boundary_gold"
purpose = "Expected typed dynamic, unsupported, capability, or source-lock boundaries."
authority = "independent_gold"
claim_stages = ["body_hir", "pir_a", "effects_world", "eir", "provider"]
circular_output_allowed = false
missing_effect = "blocks_claim"
owner_issue = "#4770"

[[proof_classes]]
class_id = "recovery_gold"
purpose = "Retained-tree, range, confidence, and fail-closed expectations for malformed or incomplete source."
authority = "independent_gold"
claim_stages = ["parser", "body_hir", "provider"]
circular_output_allowed = false
missing_effect = "blocks_claim"
owner_issue = "#5238"

[[proof_classes]]
class_id = "hir_snapshot"
