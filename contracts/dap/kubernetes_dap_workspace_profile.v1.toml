[[security_requirements]]
requirement_id = "parent_owned_stdio_no_shell_no_tty"
statement = "stdin/stdout are owned by the parent with no shell and no TTY between parent, adapter, and debuggee."

[[security_requirements]]
requirement_id = "no_kubernetes_credentials_to_adapter_or_debuggee"
statement = "No Kubernetes credentials reach the adapter or the debuggee."

[[security_requirements]]
requirement_id = "service_account_token_absent_or_unused"
statement = "The projected ServiceAccount token is absent, or mounted and provably unused according to the profile."

[[security_requirements]]
requirement_id = "no_network_listener_created_for_dap"
statement = "No network listener is created for DAP by the adapter or the debuggee."

[[security_requirements]]
requirement_id = "explicit_uid_gid_and_path_ownership"
statement = "UID/GID, writable paths, and temp/cache/home ownership are declared explicitly."

[[security_requirements]]
requirement_id = "process_tree_and_pod_cleanup_owner"
statement = "Both the debuggee process tree and the pod have one named cleanup owner."

[[security_requirements]]
requirement_id = "secrets_redacted_from_retained_receipts"
statement = "Secrets and private paths are redacted from retained receipts."

[[security_requirements]]
requirement_id = "workspace_data_cannot_select_adapter_or_cluster_target"
statement = "Workspace-controlled data cannot select another adapter binary or a different cluster target."

[[limitations]]
statement = "No cluster, pod, or debug session is executed by this contract; kind execution, live probes, and manifests that run the adapter remain future work."

[[limitations]]
statement = "Sidecar topologies are rejected here even when they share a pod; proving identical source and project-Perl parity is a separate claim."

[[limitations]]
statement = "DAP cell rows are evidence references into current perl-dap proof surfaces; this contract promotes no capability and creates no support row in #7122."

[[limitations]]
statement = "loader os is machine-compared against the single supported `linux` subject; no other operating system is admitted and no cross-OS compatibility is claimed"
