evidence = ["crates/perl-dap/tests/dap_session_cleanup_e2e.rs"]

[profile.adapter]
binary_path = "/usr/local/bin/perl-dap"
version = "0.17.0"
hash = "sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
target = "x86_64-unknown-linux-gnu"

[profile.cleanup_owner]
process_tree = "adapter-parent"
pod = "kubelet"
