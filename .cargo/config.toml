[alias]
xtask = "run --package xtask --"

# Agent/local-safe aliases. These do not choose machine paths.
# Select machine storage in the task shell using docs/agents/CARGO_STORAGE.md.
# Cargo does not automatically load .cargo/config.local.toml.
agent-check = "check --workspace --all-targets --profile agent --locked"
agent-test = "test --workspace --all-targets --profile agent --locked"
agent-clippy = "clippy --workspace --all-targets --profile agent --locked -- -D warnings -A missing_docs"

t2 = "test -- --test-threads=2"

[build]
rustflags = []

# Lossless ELF debug compression on the pinned native Linux compiler-driver
# route. Keep line tables and backtraces; other targets retain their defaults.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--compress-debug-sections=zlib"]

[env]
RUST_BACKTRACE = "1"

[term]
color = "auto"

[net]
retry = 2

[registries.crates-io]
protocol = "sparse"
