[alias]
xtask = "run --package xtask --"

# Legacy raw Cargo aliases: workspace-wide compatibility commands, not admission.
# New agent work uses `just agent-check PACKAGE` / `just agent-test PACKAGE SELECTOR`
# after exact-command preflight; see docs/agents/CARGO_STORAGE.md.
#
# Optional machine-local overrides live in `.cargo/config.local.toml` (gitignored;
# copy from `.cargo/config.local.toml.example`). Cargo does not discover that
# filename automatically. Repository wrappers pass `--config` when it exists
# (`scripts/cargo-safe`, `scripts/cargo-admitted`). For direct `cargo`, pass
# `--config .cargo/config.local.toml` (or set machine-local keys via `CARGO_*`).
agent-check = "check --workspace --all-targets --profile agent --locked"
agent-test = "test --workspace --all-targets --profile agent --locked"
agent-clippy = "clippy --workspace --all-targets --profile agent --locked -- -D warnings -A missing_docs"

t2 = "test -- --test-threads=2"

[build]
rustflags = []

# Lossless ELF debug compression on the pinned native Linux compiler-driver
# route. Keep line tables and backtraces; other targets retain their defaults.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--compress-debug-sections=zlib"]

[env]
RUST_BACKTRACE = "1"

[term]
color = "auto"

[net]
retry = 2

[registries.crates-io]
protocol = "sparse"
