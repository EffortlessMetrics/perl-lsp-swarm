# Negative control for RELEASE_EVENT_FEEDBACK_PATH (#15454).
#
# Identical to `single_entry/demo-bump.yml` except that it also keeps the
# `release: published` trigger. Because `release.yml` publishes a non-draft
# Release and *then* dispatches this workflow, one cut starts it twice.
name: Demo Bump

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Bump
        run: echo "bump ${{ github.event.inputs.tag }}"
