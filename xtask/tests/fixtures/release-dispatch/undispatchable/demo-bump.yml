# Negative control for RELEASE_DISPATCH_TARGET_UNDISPATCHABLE (#15454).
#
# Removing the `release:` trigger without leaving a `workflow_dispatch` entry
# makes the orchestrated dispatch unable to start this workflow at all — the
# over-correction the single-entry rule must also reject.
name: Demo Bump

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Bump
        run: echo bump
