name: fixture-xtask-cli-no-paths-filter
# Negative control. With no paths filter the gate runs on every candidate, so
# there is no filter that could omit the wiring files.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: cargo xtask example-contract check
