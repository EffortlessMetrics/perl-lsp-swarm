name: fixture-xtask-cli-commented-invocation
# Negative control. A commented-out or documented invocation inside a `run:`
# script is prose, not a gate's dependency on the CLI.
on:
  pull_request:
    paths:
      - 'docs/ci/example.md'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          # cargo xtask example-contract check
          echo "documented above; this job runs nothing"
