name: fixture-xtask-cli-paths-missing-wiring
# The #14293 failure mode: a paths-filtered gate runs an xtask CLI subcommand
# but never lists the clap-dispatch / module-registration files the subcommand
# routes through, so a wiring-only change silently skips this gate.
on:
  pull_request:
    paths:
      - 'xtask/src/tasks/example_contract.rs'
      - '.github/workflows/xtask-cli-paths-missing-wiring.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: cargo xtask example-contract check
