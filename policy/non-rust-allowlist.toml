# Non-Rust File Allowlist
#
# Source of truth for which non-Rust files are permitted in `perl-lsp`.
# Doctrine: docs/policy/FILE_POLICY.md.
# Schema:   docs/policy/NON_RUST_POLICY.md.
# Catalog:  docs/policy/POLICY_ALLOWLISTS.md.
#
# Read by: `cargo xtask check-file-policy` (PR 4 of the file-policy rollout).
# Written by: humans, with proposals from `cargo xtask non-rust propose`
# (PR 5) staged in `target/policy/non-rust-proposed-allowlist.toml`.
#
# Mode: this ledger is `advisory` until PR 4 introduces the checker. CI
# becomes blocking-allowlist in PR 10 of the rollout.

schema_version = 1
policy = "non-rust-allowlist"
owner = "EffortlessMetrics"
status = "advisory"
updated = "2026-08-24"

[defaults]
rust_is_default = true
xtask_is_default_for_repo_automation = true
new_non_rust_requires_review = true
broad_globs_require_reason = true
coverage_required_for_production_surfaces = true

# =============================================================================
# Documentation
# =============================================================================

[[allow]]
id = "non-rust-changelog-fragments"
glob = ".changes/unreleased/*.yaml"
kind = "release_metadata"
language = "yaml"
surface = "release"
classification = "documentation"
owner = "release/ci"
reason = "Changie release-note fragments staged for the next release, created by `cargo change` and drained when the release renders. They are transient: a fragment exists for the life of one unreleased change, so a per-fragment allowlist row recorded an identity that disappears at release while forcing every producing PR to edit this shared file. One typed path rule governs the class instead; `cargo xtask changelog check` owns each fragment's project, kind, body, and PR-reference validity, and this ledger owns only whether the path class is accounted for."
covered_by = [
  "cargo xtask changelog check",
  "cargo xtask check-file-policy",
]
created = "2026-08-15"
review_after = "2026-11-15"

