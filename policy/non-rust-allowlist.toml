[[allow]]
id = "non-rust-root-governance-docs"
glob = "**/*.md"
kind = "documentation"
language = "markdown"
surface = "docs"
classification = "documentation"
owner = "docs"
reason = "Top-level README, CHANGELOG, RELEASE_HISTORY, ROADMAP, CONTRIBUTING, SECURITY, SUPPORT, and governance docs, plus the markdown that is not claimed by a more specific entry."
covered_by = [
  "cargo xtask check-file-policy",
]
broad_glob_reason = "Markdown is non-executable prose and non-Rust by definition. The glob is written `**/*.md` because that is the breadth this entry has always had: until #9994 the checker let a single `*` cross `/`, so the previous `*.md` already matched markdown at every depth. Narrowing this entry back to repository-root governance docs, with explicit entries for the 259 files across 21 trees it currently absorbs, is #14583 and is deliberately not a silent side effect of the matcher fix."
created = "2026-05-07"
review_after = "2026-08-07"

[[allow]]
