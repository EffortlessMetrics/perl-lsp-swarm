  "cargo test -p perl-lsp-rs --test lsp4ij_template_projection_tests",
  "cargo xtask check-file-policy",
]
broad_glob_reason = "One LSP4IJ template is a fixed directory of sibling descriptors (template, settings, settings schema, initialization options) plus its maintainer README; the host requires them to live together."
created = "2026-08-15"
review_after = "2026-11-15"

