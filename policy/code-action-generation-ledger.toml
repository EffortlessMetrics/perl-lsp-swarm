# Machine-readable code-action provider-generation disposition ledger.
#
# Human-readable routing remains in:
# docs/project/status/code_action_generation_ledger.md
#
# This policy freezes, per (generation, action family), the disposition that the
# #8393 code-action convergence train must respect before it changes production
# routing. It records what production does today. It does not select providers,
# broaden code-action behavior, promote support tiers, or replace the #8068
# provider contract or the #8392 provider-selection policy.
#
# Controlling issue: #9188 (this ledger + its parity corpus; no routing change)
# Cutover consumer:  #9189 (canonical route selection)
# Retirement:        #9190 (delete retired generations)

schema_version = 1
policy = "code-action-generation-ledger"
owner = "perl-lsp maintainers"
status = "advisory"
updated = "2026-09-07"

convergence_controller = "https://github.com/EffortlessMetrics/perl-lsp-swarm/issues/8393"
provider_contract = "https://github.com/EffortlessMetrics/perl-lsp-swarm/issues/8068"
selection_policy = "https://github.com/EffortlessMetrics/perl-lsp-swarm/issues/8392"
remediation_contract = "https://github.com/EffortlessMetrics/perl-lsp-swarm/issues/4205"

human_ledger = "docs/project/status/code_action_generation_ledger.md"
orchestrator = "crates/perl-lsp-rs/src/runtime/language/code_actions.rs"
parity_corpus = "crates/perl-lsp-rs/tests/code_action_generation_parity_corpus.rs"

# Literals bounding `handle_code_action` itself. Anchors are searched ONLY
# inside this range: an occurrence elsewhere in the file — a helper, a
# test-only handler, the test module — is not production routing and must not
# satisfy a row. `handler_end` is the doc comment of the next item.
handler_start = "pub(crate) fn handle_code_action("
handler_end = "/// Cancellation-aware wrapper for `textDocument/codeAction`."

# Literal that marks where the handler's no-AST branch begins. Every
# `path = "ast"` anchor must occur before it and every `path = "no_ast"` anchor
# after it, so moving a producer between branches cannot leave a stale `path`.
no_ast_boundary = "// No AST (parse error), but we can still offer some actions"

# The six-way disposition vocabulary fixed by #9188. A row's disposition states
# what #9190 may do with it, not how good the implementation is.
#
#   canonical_candidate   - the generation #9189 should keep as the single
#                           production publisher for this family.
#   unique_behavior       - answers this family with behavior no other
#                           generation currently reproduces; retiring it would
#                           silently drop a capability.
#   redundant_behavior    - duplicates a canonical answer for this family;
#                           retirable once parity is proven.
#   compatibility_only    - reachable only on a compatibility path (opt-in
#                           engine, degraded no-AST path) and kept for that
#                           path alone.
#   shadow_only_candidate - reachable only when a preceding generation produced
#                           nothing; not an independent production authority.
#   retire_candidate      - carries no production behavior for this family and
#                           can be deleted without parity evidence.
disposition_states = [
  "canonical_candidate",
  "unique_behavior",
  "redundant_behavior",
  "compatibility_only",
  "shadow_only_candidate",
  "retire_candidate",
]

# Action families are user-visible capabilities, not module names, so that two
# generations answering one family is visible as duplicate authority rather than
# hidden behind two different keys. `none:unreachable_stub` exists so a
# generation that answers nothing still carries an exact disposition.
family_registry = [
  "none:unreachable_stub",
  "quickfix:critic_finding",
  "quickfix:diagnostic_routed",
  "quickfix:explain_diagnostic",
  "quickfix:hardcoded_shebang",
  "quickfix:pragma",
  "quickfix:utf8_pragma",
  "refactor.extract:basic_fallback",
  "refactor.extract:disabled_placeholder",
  "refactor.extract:subroutine",
  "refactor.extract:variable",
  "refactor.rewrite:enhanced_transforms",
  "refactor.rewrite:text_fallback",
  "source.fixAll:aggregate",
  "source.modernize:modernize",
  "source:test_generation",
]

# Named reasons a non-canonical generation cannot be retired yet. Every
# `unique_behavior` row must cite at least one.
retirement_blocker_registry = [
  "canonical_route_omits_diagnostic_association",
  "combined_pragma_fix_has_no_other_producer",
  "canonical_route_has_no_degraded_path_equivalent",
  "capability_gated_disabled_state_has_no_other_producer",
  "opt_in_engine_has_no_canonical_equivalent",
]

# Every `.rs` file under these roots must be claimed by some generation row's
# `modules`. This is the anti-staleness ratchet: a new code-action module cannot
# land without an exact family disposition.
owned_module_roots = [
  "crates/perl-lsp-rs-core/src/providers/code_actions",
  "crates/perl-lsp-rs/src/features/code_actions_provider",
]

# ---------------------------------------------------------------------------
# Generations: the production-reachable code-action producers, in the exact
# order `handle_code_action` invokes them.
#
# `production_anchor` is a literal that must occur in `orchestrator`; it fails
# the check when a generation is rerouted or removed without updating this
# ledger. Rows with `reachability = "unreachable_stub"` carry no anchor.
# ---------------------------------------------------------------------------

[[generation]]
id = "explain_diagnostic"
stage = 1
path = "ast"
reachability = "production"
production_anchor = "self.add_explain_diagnostic_code_actions("
modules = ["crates/perl-lsp-rs/src/runtime/language/code_actions.rs"]
summary = "Command-only 'Explain this diagnostic' action emitted inline by the orchestrator."

[[generation]]
id = "missing_pragmas"
stage = 2
path = "ast"
reachability = "production"
production_anchor = "crate::code_actions_pragmas::missing_pragmas_actions("
modules = ["crates/perl-lsp-rs/src/features/code_actions_pragmas.rs"]
summary = "Source-scanning use strict / use warnings quick fixes, deliberately ordered before the diagnostic-routed generations so source.fixAll prefers its insertion point. AST path only: the other call to missing_pragmas_actions lives in handle_code_actions_pragmas, a separate #[allow(dead_code)] test-only handler, not in the no-AST branch."

[[generation]]
id = "native_critic"
stage = 3
path = "ast"
reachability = "production"
production_anchor = "perl_lsp_rs_core::config::CriticEngine::Native"
modules = ["crates/perl-lsp-rs/src/runtime/language/code_actions.rs"]
summary = "Default native critic registry; only Safe non-empty fixes become quick fixes."

[[generation]]
id = "legacy_critic"
stage = 4
path = "ast"
reachability = "production"
production_anchor = "perl_lsp_rs_core::config::CriticEngine::Legacy"
modules = ["crates/perl-lsp-rs/src/runtime/language/code_actions.rs"]
summary = "Opt-in BuiltInAnalyzer emulating Perl::Critic policy names; mutually exclusive with the native engine."

[[generation]]
id = "provider_v2"
stage = 5
path = "ast"
reachability = "production"
production_anchor = "CodeActionsProviderV2::new("
modules = [
  "crates/perl-lsp-rs/src/features/code_actions_provider/mod.rs",
  "crates/perl-lsp-rs/src/features/code_actions_provider/fixes.rs",
  "crates/perl-lsp-rs/src/features/code_actions_provider/parse_errors.rs",
  "crates/perl-lsp-rs/src/features/code_actions_provider/source_utils.rs",
  "crates/perl-lsp-rs/src/features/code_actions_provider/types.rs",
]
summary = "Diagnostic-based V2 generation. Within the quickfix:diagnostic_routed family it is the only generation that populates CodeAction.diagnostics, matching each action back to the published diagnostic by code and range."

[[generation]]
id = "provider_original"
stage = 6
path = "ast"
reachability = "production"
production_anchor = "let provider = CodeActionsProvider::new("
modules = [
  "crates/perl-lsp-rs-core/src/providers/code_actions/code_actions.rs",
  "crates/perl-lsp-rs-core/src/providers/code_actions/diagnostic_routes.rs",
  "crates/perl-lsp-rs-core/src/providers/code_actions/mod.rs",
  "crates/perl-lsp-rs-core/src/providers/code_actions/modernize.rs",
  "crates/perl-lsp-rs-core/src/providers/code_actions/quick_fixes.rs",
  "crates/perl-lsp-rs-core/src/providers/code_actions/refactors.rs",
  "crates/perl-lsp-rs-core/src/providers/code_actions/source_actions.rs",
  "crates/perl-lsp-rs-core/src/providers/code_actions/types.rs",
]
summary = "Original AST-based generation. Routes diagnostic codes to quick fixes, adds source and modernize actions, and re-invokes the enhanced generation through refactors::get_refactoring_actions."

[[generation]]
id = "provider_enhanced"
stage = 7
path = "ast"
reachability = "production"
production_anchor = "EnhancedCodeActionsProvider::new("
modules = [
  "crates/perl-lsp-rs-core/src/providers/code_actions/enhanced/error_checking.rs",
  "crates/perl-lsp-rs-core/src/providers/code_actions/enhanced/extract_subroutine.rs",
  "crates/perl-lsp-rs-core/src/providers/code_actions/enhanced/extract_variable.rs",
  "crates/perl-lsp-rs-core/src/providers/code_actions/enhanced/helpers.rs",
  "crates/perl-lsp-rs-core/src/providers/code_actions/enhanced/loop_conversion.rs",
  "crates/perl-lsp-rs-core/src/providers/code_actions/enhanced/mod.rs",
  "crates/perl-lsp-rs-core/src/providers/code_actions/enhanced/postfix.rs",
  "crates/perl-lsp-rs-core/src/providers/code_actions/enhanced/signature_actions.rs",
]
summary = "Enhanced AST refactorings. Runs twice per request: once nested inside provider_original and once directly from the orchestrator."

[[generation]]
id = "disabled_extract_placeholder"
stage = 8
path = "both"
reachability = "production"
production_anchor = "self.maybe_push_disabled_extract_placeholder("
modules = ["crates/perl-lsp-rs/src/runtime/language/code_actions.rs"]
summary = "Capability-gated disabled refactor.extract placeholder for zero-width selections. Called from BOTH orchestrator branches — once on the AST path and once on the degraded no-AST path — so it is the only generation that survives a missing parse snapshot alongside text_fallback."

[[generation]]
id = "test_generator"
stage = 9
path = "ast"
reachability = "production"
production_anchor = "Generate test for '{}'"
modules = ["crates/perl-lsp-rs/src/runtime/language/code_actions.rs"]
summary = "Command-only Test::More skeleton action per discovered subroutine."

[[generation]]
id = "source_fix_all_aggregate"
stage = 10
path = "ast"
reachability = "production"
production_anchor = "if let Some(fix_all) = build_source_fix_all("
modules = ["crates/perl-lsp-rs/src/runtime/language/code_actions.rs"]
summary = "Post-dedupe aggregation of collected quick fixes into one source.fixAll action."

[[generation]]
id = "text_fallback"
stage = 11
path = "no_ast"
reachability = "production"
production_anchor = "perl.addDebugPrint"
modules = ["crates/perl-lsp-rs/src/runtime/language/code_actions.rs"]
summary = "Degraded text-oriented generation used when the request finds no AST for the current document generation. Malformed source does not reach it: the v3 parser recovers instead of yielding ast: None (#3760), so in practice it is reached only when the current generation has no published parse snapshot yet."

[[generation]]
id = "lsp_compat_stub"
stage = 0
path = "none"
reachability = "unreachable_stub"
modules = [
  "crates/perl-lsp-rs-core/src/providers/lsp_compat/code_actions_pragmas.rs",
  "crates/perl-lsp-rs-core/src/providers/lsp_compat/code_actions_provider.rs",
]
summary = "Deprecated migration stubs that are still publicly declared but contain no code and are referenced by nothing."

# ---------------------------------------------------------------------------
# Routes: one row per (generation, family) with its exact disposition.
# ---------------------------------------------------------------------------

[[route]]
generation = "explain_diagnostic"
family = "quickfix:explain_diagnostic"
disposition = "canonical_candidate"
notes = "Sole producer. Command-only action carrying no workspace edit."
retirement_blockers = []
parity_fixtures = ["cac-parity-explain-diagnostic-command-only"]

[[route]]
generation = "missing_pragmas"
family = "quickfix:pragma"
disposition = "canonical_candidate"
notes = "Ordered first on purpose so its source-aware insertion point wins the source.fixAll aggregation. Note that ordering does NOT hide the duplication: dedupe_code_actions keys on title, and three generations publish a `use strict` insertion under three different titles, so a client sees all three."
retirement_blockers = []
parity_fixtures = [
  "cac-parity-pragma-duplicate-authority-is-user-visible",
  "cac-parity-stale-superseded-document-version",
]

[[route]]
generation = "provider_original"
family = "quickfix:pragma"
disposition = "redundant_behavior"
notes = "Reaches this family twice over and adds nothing: diagnostic_routes routes PL100/PL101 to the same add_use_strict/add_use_warnings quick fixes the canonical generation already produced, and the nested refactors::get_refactoring_actions re-invocation reaches provider_enhanced's combined fix. dedupe_code_actions collapses both byte-identical results."
retirement_blockers = []
parity_fixtures = ["cac-parity-pragma-duplicate-authority-is-user-visible"]

[[route]]
generation = "provider_enhanced"
family = "quickfix:pragma"
disposition = "unique_behavior"
notes = "get_enhanced_refactoring_actions calls get_global_refactorings, which calls add_recommended_pragmas. It emits one combined 'Add missing pragmas (use strict;, use warnings;)' quickfix carrying a single edit, where the canonical generation emits one action per pragma. A client filtering only=[\"quickfix\"] gets the combined one-click fix from nowhere else: source.modernize and source.fixAll answer different kinds."
retirement_blockers = ["combined_pragma_fix_has_no_other_producer"]
parity_fixtures = ["cac-parity-enhanced-combined-pragma-fix"]

[[route]]
generation = "provider_enhanced"
family = "quickfix:utf8_pragma"
disposition = "canonical_candidate"
notes = "Sole producer of 'Add UTF-8 support', which inserts use utf8; and use open qw(:std :utf8) when the source has non-ASCII content and either pragma is absent."
retirement_blockers = []
parity_fixtures = ["cac-parity-utf8-pragma-only-for-non-ascii-source"]

[[route]]
generation = "provider_original"
family = "quickfix:utf8_pragma"
disposition = "redundant_behavior"
notes = "Reaches the same producer through the nested refactors::get_refactoring_actions re-invocation, so it contributes nothing the canonical generation did not already publish; dedupe_code_actions collapses the pair."
retirement_blockers = []
parity_fixtures = ["cac-parity-utf8-pragma-only-for-non-ascii-source"]

[[route]]
generation = "text_fallback"
family = "quickfix:pragma"
disposition = "compatibility_only"
notes = "The no-AST branch emits its own inline pragma block and is the only pragma producer there: the canonical missing_pragmas generation runs on the AST path only."
retirement_blockers = ["canonical_route_has_no_degraded_path_equivalent"]
parity_fixtures = []
proof_gap = "Not reachable from the LSP surface deterministically. Malformed source recovers onto the AST path (see cac-parity-parse-error-recovery-keeps-ast-path), and the remaining trigger — a generation whose parse snapshot has not been published yet — is a timing window a corpus fixture cannot pin without racing the parser. #9189 must not treat this row as parity-proven."

[[route]]
generation = "provider_original"
family = "quickfix:diagnostic_routed"
disposition = "canonical_candidate"
notes = "Widest diagnostic-code coverage and the generation that also owns source and modernize families; the natural single publisher for #9189."
retirement_blockers = []
parity_fixtures = [
  "cac-parity-diagnostic-routed-quickfix-edit",
  "cac-parity-parse-error-recovery-keeps-ast-path",
]

[[route]]
generation = "provider_v2"
family = "quickfix:diagnostic_routed"
disposition = "unique_behavior"
notes = "Answers the same diagnostic codes as the canonical generation, but is the only generation ANSWERING THIS FAMILY that attaches the originating diagnostic to the emitted action: provider_original's mapping emits title, kind and edit only. (Other generations do attach diagnostics for their own families — the critic generations and source.fixAll both do — so the claim is scoped to quickfix:diagnostic_routed, not global.) Retiring provider_v2 before the canonical route emits CodeAction.diagnostics would silently break diagnostic-to-fix association for #4205 consumers."
retirement_blockers = ["canonical_route_omits_diagnostic_association"]
parity_fixtures = [
  "cac-parity-v2-attaches-originating-diagnostic",
  "cac-parity-parse-error-recovery-keeps-ast-path",
]

[[route]]
generation = "native_critic"
family = "quickfix:critic_finding"
disposition = "canonical_candidate"
notes = "Default engine. Only findings carrying a Safe non-empty fix become quick fixes."
retirement_blockers = []
parity_fixtures = ["cac-parity-critic-quickfix-safe-only"]

[[route]]
generation = "legacy_critic"
family = "quickfix:critic_finding"
disposition = "compatibility_only"
notes = "Mutually exclusive with the native engine, so the two never publish together. Reachable only through the trusted .perl-lsp.toml project channel: parse_lsp_critic_engine maps Legacy to None, so initializationOptions, didChangeConfiguration and workspace/configuration all reject critic.engine = \"legacy\". The project channel logs a deprecation naming #8253/#9072 as the owning migration."
retirement_blockers = ["opt_in_engine_has_no_canonical_equivalent"]
parity_fixtures = []
proof_gap = "The shared critic fixture exercises the default native engine only. Reaching this generation needs a workspace carrying a .perl-lsp.toml that selects the deprecated engine, which no corpus fixture sets up; the LSP settings channels cannot select it at all. #9190 should confirm whether #9072 retires the engine before this row needs parity evidence."

[[route]]
generation = "provider_original"
family = "quickfix:hardcoded_shebang"
disposition = "canonical_candidate"
notes = "Sole producer, via source_actions, and only when the requested range covers the first line."
retirement_blockers = []
parity_fixtures = ["cac-parity-legitimate-empty-out-of-range-source-action"]

[[route]]
generation = "provider_enhanced"
family = "refactor.extract:variable"
disposition = "canonical_candidate"
notes = "The implementation users actually receive."
retirement_blockers = []
parity_fixtures = ["cac-parity-extract-variable-requires-selection"]

[[route]]
generation = "provider_original"
family = "refactor.extract:variable"
disposition = "redundant_behavior"
notes = "provider_original does not implement extraction itself; refactors::get_refactoring_actions constructs EnhancedCodeActionsProvider and makes the identical call the orchestrator makes at stage 7, so the enhanced generation executes twice per request and dedupe_code_actions hides the duplicate."
retirement_blockers = []
parity_fixtures = ["cac-parity-duplicate-authority-collapsed"]

[[route]]
generation = "provider_enhanced"
family = "refactor.extract:subroutine"
disposition = "canonical_candidate"
notes = "Sole real implementation; reached twice for the same reason as extract:variable."
retirement_blockers = []
parity_fixtures = []
proof_gap = "No corpus fixture reaches it. Six range shapes were tried against the live server — whole sub body, sub braces, inner statement spans, if-block braces and body, and a for-block — and every one produced either an extract:variable action or nothing. The duplicate-authority fixture selects `2 + 3` and yields extract:variable, so citing it here would claim coverage this family does not have. #9190 must not treat subroutine extraction as parity-proven."

[[route]]
generation = "provider_original"
family = "refactor.extract:basic_fallback"
disposition = "shadow_only_candidate"
notes = "The literal 'Extract to variable' / 'Extract to function' arms in refactors.rs are guarded by `actions.is_empty()`, so they can only run when the nested enhanced generation returned nothing. They are not an independent production authority."
retirement_blockers = []
parity_fixtures = []
proof_gap = "Unreachable by construction from any fixture that also reaches the enhanced generation: the guard runs only when the nested enhanced call returned nothing, and on every selection that produces an extract action the enhanced generation answers first. Proving this arm needs a node shape the enhanced provider declines but refactors.rs accepts, which no corpus fixture has found. Being shadow_only_candidate, #9190 can delete it without parity evidence."

[[route]]
generation = "disabled_extract_placeholder"
family = "refactor.extract:disabled_placeholder"
disposition = "unique_behavior"
notes = "Only producer of a disabled action. Emitted for a zero-width selection and only when the client declared codeAction.disabledSupport; both refactor.extract generations are skipped in exactly that case."
retirement_blockers = ["capability_gated_disabled_state_has_no_other_producer"]
parity_fixtures = [
  "cac-parity-disabled-extract-requires-selection",
