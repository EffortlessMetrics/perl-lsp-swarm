# Checked public-surface and consumer disposition ledger for `perl-tdd-support`.
#
# Authority: this file. `docs/policy/TDD_SUPPORT_SURFACE.md` is a generated
# projection of it and must not be edited by hand.
#
# Checked by `cargo xtask tdd-support-surface`, which fails when a public item
# has no row, when a row no longer names a real symbol, when a row's `cfg` gate
# drifts from source, or when a row's `consumers` do not match the crates that
# actually reference it (derive them with `--emit-consumers`).
#
# Granularity: one row per named public export — item, module, re-export, or
# Cargo feature. Associated-item signatures (method signatures, struct field
# types, trait impls) are governed only through their owning type's row, not
# individually; the umbrella #8144 tracks method/field-level governance as a
# later step, and this schema's `api_kind` vocabulary can carry it when that
# lands. `consumers` is attributed at crate-root entry-segment granularity:
# an item under a module lists the crates that reach that module, not
# necessarily that exact item.
#
# This ledger classifies; it does not rule. A row whose fate a later train slot
# owns carries that slot's issue in `owner_issue`.
#
#   cargo xtask tdd-support-surface --propose        # rows for new items
#   cargo xtask tdd-support-surface --emit-consumers  # derived consumer sets

