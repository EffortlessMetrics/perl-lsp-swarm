# Sensitive Authority Review Surfaces — checked denominator and routing contract
#
# One stable programme-specific manifest identifying which semantic-control
# changes require independent current-head review evidence before merge, and
# which review machinery provides that evidence.
#
# Status boundary (issue #11793):
#   source routing declaration      != current-head review evidence
#                                   != live required-review enforcement
#
# This manifest is advisory classification metadata. It does not mutate branch
# protection, rulesets, required checks, issues, PRs, releases, or publications.
# Live-enforcement promotion belongs to #11796; advisory context publication to
# #11795. Reviewer packets remain owned by #11701 (generation) over the shared
# contract of #10881; current-head review semantics remain #3693/#6060.
#
# Checked by scripts/ci/validate_review_surfaces.py (--strict).
# Human projection: docs/policy/REVIEW_SURFACES.md (generated, byte-deterministic;
# regenerate with --write-projection, verify with --check-projection).

schema_version = 1
policy = "review-surfaces"
owner = "EffortlessMetrics"
status = "advisory"
updated = "2026-08-24"
issue = "11793"

classification_rule = "Every sensitive semantic-control authority on current main maps to exactly one stable surface row; every surface row binds exact current paths; every row carries exactly one review profile from the closed profile vocabulary."
enforcement_boundary = "This manifest is review-routing metadata until #11796 promotes rows into live required-review enforcement. A CODEOWNERS pattern or a manifest row is never itself proof that review happened."
successor_consumption = "#11795 consumes the generated projection (docs/policy/REVIEW_SURFACES.md) as the advisory Authority Transfer Review context. #11796 consumes each row's code_owner_route disposition, review profile, and enforcement_successor field as its promotion denominator; it must not promote any row whose owner identity lacks platform-valid status in [code_owner_identity]."
projection_doc = "docs/policy/REVIEW_SURFACES.md"
validator_script = "scripts/ci/validate_review_surfaces.py"
validator_test = "scripts/ci/test_validate_review_surfaces.py"

# ---------------------------------------------------------------------------
# Closed vocabularies (mirrored as constants in the validator; drift fails)
# ---------------------------------------------------------------------------

[families]
semantic_issue_completion = "Semantic issue completion: close-proof policy, issue contracts, containment, evidence registries, trusted close workflows, and the PR-template fields they consume."
configuration_authority = "Configuration authority: catalogs, public settings schema, observation/source adapters, and high-risk consumer authority adapters."
executable_policy_and_public_migration = "Executable policy and public migration: suppression policy, receipt schemas, public-API baselines, retirement ledgers, repository-managed settings, and this manifest."

# Closed review-profile vocabulary. Each profile reuses #10881's closed lens and
# role vocabulary and the #11701 packet/handoff authority; no new review kinds.
[profile.semantic_close_authority]
fresh_direction = "Challenge whether the changed close contract actually prevents a realistic false close: wrong-subject proofs, stale denominators, evaluator bypass, and label-or-colour substitutes for current-head evidence."
lenses = ["subject_evidence_identity", "lifecycle_currentness_concurrency", "spec_test_docs_consistency"]
required_roles = ["adversarial_challenger"]
packet_contract = "schemas/agent_review_packet.v1.schema.json"
handoff_authority = "#11701"

[profile.configuration_source_authority]
fresh_direction = "Challenge whether parsed settings stay registered exactly once, precedence and trust channels are unchanged, and no client channel newly reaches a restricted field."
lenses = ["semantic_correctness", "security_trust_boundary", "subject_evidence_identity"]
required_roles = ["adversarial_challenger"]
packet_contract = "schemas/agent_review_packet.v1.schema.json"
handoff_authority = "#11701"

[profile.configuration_generation_authority]
fresh_direction = "Challenge whether candidate and accepted generations stay distinguishable, derived values are recomputed rather than persisted, and no second effective-state store appears beside the catalog."
lenses = ["semantic_correctness", "architecture_authority_duplication", "spec_test_docs_consistency"]
required_roles = ["adversarial_challenger"]
packet_contract = "schemas/agent_review_packet.v1.schema.json"
handoff_authority = "#11701"

[profile.configuration_external_effect_authority]
fresh_direction = "Challenge the first external effect: spawned processes, probed environments, network endpoints, credential handling, and resource ceilings that degrade user-visible behavior."
lenses = ["security_trust_boundary", "release_external_boundary", "resource_retention_cleanup"]
required_roles = ["adversarial_challenger"]
packet_contract = "schemas/agent_review_packet.v1.schema.json"
handoff_authority = "#11701"

[profile.policy_lifecycle_authority]
fresh_direction = "Challenge whether suppression/receipt lifecycle changes weaken a ratchet, recycle a retired obligation, or let generated material move without its canonical input."
lenses = ["architecture_authority_duplication", "lifecycle_currentness_concurrency", "spec_test_docs_consistency"]
required_roles = ["adversarial_challenger"]
packet_contract = "schemas/agent_review_packet.v1.schema.json"
handoff_authority = "#11701"

[profile.public_api_or_retirement_authority]
fresh_direction = "Challenge whether the public denominator actually moved, whether retirement is unreachable-in-production rather than deleted-in-tests, and whether recurrence guards survive."
lenses = ["release_external_boundary", "architecture_authority_duplication", "subject_evidence_identity"]
required_roles = ["adversarial_challenger"]
packet_contract = "schemas/agent_review_packet.v1.schema.json"
handoff_authority = "#11701"

[profile.live_repository_policy_authority]
fresh_direction = "Challenge whether repository-managed policy files silently arm enforcement, whether review machinery duplicates an existing authority, and whether routing metadata was presented as review evidence."
lenses = ["security_trust_boundary", "architecture_authority_duplication", "lifecycle_currentness_concurrency"]
required_roles = ["adversarial_challenger"]
packet_contract = "schemas/agent_review_packet.v1.schema.json"
handoff_authority = "#11701"

