# Kwalitee/readiness namespace reference inventory
#
# Controlling issue #8752. Parent readiness train: #7192 (alias retirement),
# #8425 (canonical command), #8560 (native command), #8742 (canonical readiness).
# This ledger is the machine-readable zero-caller authority for the final
# Kwalitee/readiness namespace cutover: #7185/#7192 may reclaim the
# `perl-kwalitee` name and remove the compatibility alias only once the
# unresolved active population recorded here reaches zero.
#
# Read by `cargo xtask kwalitee-inventory`, which scans the working tree
# exhaustively for the namespace spellings (`perl-kwalitee`, `perl_kwalitee`,
# `PerlKwalitee`, `PERL_KWALITEE`) and reconciles every occurrence against the
# rows below. It fails closed on an unclassified new reference, a stale
# classification whose source line moved or vanished, a duplicate
# classification, and any closed-vocabulary violation. It never mutates a
# caller, a doc, or an alias (#8752 non-goals).
#
# Every occurrence of the namespace in the repository carries exactly one
# current classification. A row covers the occurrences in `path` whose trimmed
# source lines hash into `reference_hashes` (a multiset: one entry per
# occurrence). The digest covers the trimmed line text and nothing else, so
# editing, adding or deleting a classified reference fails the checker while
# moving one up or down its file does not. After a genuinely new or reworded
# reference, `cargo xtask kwalitee-inventory --scaffold` prints fresh hashes and
# the maintainer re-reviews the row before the check passes again.
#
# The digest used to include the one-based line number. That made every row a
# tripwire for unrelated edits in the same file: six rows here went stale
# because lines above them moved, reddening pull requests that never touched
# the namespace, while the references themselves were untouched. A reference is
# its text, not its coordinate.
#
# Classifications (closed vocabulary)
#   real_kwalitee        belongs to the real (CPANTS-compatible) Kwalitee domain
#                        or to this namespace authority itself; no migration owed
#   release_readiness    an active caller or surface feeding the release
#                        readiness decision through the legacy namespace
#   legacy_compatibility exists only to keep the frozen `perl_kwalitee.v1`
#                        contract and historical receipts readable
#   historical_prose     archived narrative that mentions the namespace as
#                        history; carries no authority and no execution
#   invalid_or_stale     a reference that should not exist and is pending removal
#
# Migration targets (closed vocabulary)
#   native_distribution_analyser  the reclaimed name's end state under #7185/#4745
#   perl_release_readiness        follows the moved evaluator/rename under #7166/#8425
#   independent_readiness_rails   migrates onto the rails under #7168/#7169/#7191
#   legacy_receipt_readability    dies with historical receipt retirement under #7192
#   none                          permanent (or removed outright for invalid_or_stale)
#
# Classification/target pairing is enforced: real_kwalitee targets
# native_distribution_analyser or none; release_readiness targets
# independent_readiness_rails or perl_release_readiness; legacy_compatibility
# targets legacy_receipt_readability or perl_release_readiness;
# historical_prose and invalid_or_stale target none.
#
# `allowed_to_remain` records the current occupancy verdict, not a perpetual
# right: release_readiness callers remain allowed until their target lands, and
# invalid_or_stale rows are never allowed. The report's unresolved active
# counts by migration target are the removal denominator, not a gate on
# remaining — the gate is exact classification coverage.
#
# Search-surface exclusions. The scanner walks every content file, tracked or
# not, so generated files and ignored-but-present files cannot hide callers.
# Only non-content surfaces may be excluded, and only through a reviewed row
# here with a reason and an owner issue.

schema_version = "kwalitee_namespace_inventory.v1"
controller_issue = 8752

[[excluded_surface]]
pattern = "target/**"
owner_issue = 8752
reason = "Ephemeral build output; generated receipts under target/ are artifacts of runs, never repository callers."

[[excluded_surface]]
pattern = ".worktrees"
owner_issue = 8752
reason = "Local claim worktrees; separate working trees, not content of this tree."

[[excluded_surface]]
pattern = ".wt-*"
owner_issue = 8752
reason = "Local claim worktrees; separate working trees, not content of this tree."

[[excluded_surface]]
pattern = "node_modules"
owner_issue = 8752
reason = "Third-party package cache restored by local tooling; never repository content."
