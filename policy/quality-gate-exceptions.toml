kind = "temporary_burndown"
scope = "ripr_plus_total"
owner = "proof-lane"
issue = "#3121"
reason = "Existing repo-wide RIPR+ gaps predate the transition gate. New gaps are blocked first while existing clusters are burned down with focused proof PRs."
final_target = "repo-wide ripr+ unresolved total = 0"
evidence = "repo-wide RIPR+ receipt at target/receipts/quality/ripr-plus.json; ripr run 33167457170 evaluated PR head 83d11026c08b648830cd199d2da16fc94346c896 as merge head 56ad152677dc072b2b2acba589596e21f908b051; measured active_unresolved=3021 and new_unresolved=0 in the accompanying exact-head quality-gate receipt; quality gate passed; reviewed under #6216"
removal_criteria = "quality-gate final mode requires unresolved total = 0 and no active ripr-total-burndown exception"
created = "2026-05-28"
review_after = "2026-09-09"
expires = "2026-09-30"

