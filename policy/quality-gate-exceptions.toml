# Quality Gate Exceptions
#
# Temporary debt ledger for proof-lane burn-down. These entries document why the
# transition gate can enforce new RIPR gaps and patch coverage before the repo
# reaches the final ripr+ zero and project coverage targets.

schema_version = 1
policy = "quality-gate-exceptions"
owner = "EffortlessMetrics"
status = "active"
updated = "2026-08-29"

[requirements]
required_active = [
  "ripr-total-burndown",
  "project-coverage-burndown",
]

[[exception]]
id = "ripr-total-burndown"
kind = "temporary_burndown"
scope = "ripr_plus_total"
owner = "proof-lane"
issue = "#3121"
reason = "Existing repo-wide RIPR+ gaps predate the transition gate. New gaps are blocked first while existing clusters are burned down with focused proof PRs."
final_target = "repo-wide ripr+ unresolved total = 0"
evidence = "repo-wide RIPR+ receipt at target/receipts/quality/ripr-plus.json; ripr run 33268945503 (push to main, 2026-08-29, artifact ripr-pr-evidence, schema v2) measured head f4dcd06876b48ebd1e336601f1565b906411cd4b at active_unresolved=3010, suppressed_unresolved=0, and the accompanying exact-head gate receipt decided pass in enforce-new-ripr mode with new gaps 0; measured trend 2775 (2026-08-21, archived receipt head 8d04e37c4), 2877 (2026-08-26, run 32938794374, head 64636ccfb), 3021 (run 33167457170, head 83d11026c evaluated as merge head 56ad15267), 3010 (2026-08-29): net +235 over 8 days, so the burndown regressed against its zero target and removal would fail final mode repo-wide; reviewed under #6216, dispositioned under #13704"
disposition = "renew_with_new_evidence"
falsifier = "A repo-wide ripr-plus receipt at or before review_after measuring active_unresolved = 0 (equivalently, quality-gate final mode passing with no active exception) falsifies this entry; the exception must then be removed at once instead of waiting for expiry."
removal_criteria = "quality-gate final mode requires unresolved total = 0 and no active ripr-total-burndown exception"
created = "2026-05-28"
review_after = "2026-09-09"
expires = "2026-09-30"

[[exception]]
id = "project-coverage-burndown"
kind = "temporary_burndown"
scope = "project_coverage"
owner = "proof-lane"
issue = "#3121"
reason = "Project coverage is below the final 95% floor while patch coverage becomes blocking first."
final_target = "workspace project coverage >= 95%"
evidence = "coverage baseline receipt at target/receipts/quality/coverage-baseline.json; the freshest measured baseline is still ci-nightly coverage lane run 33181432174 (workflow_dispatch, coverage-only) at head 8ed94907dfdbea705acaa5b9dcbec7a0f0096249: workspace project coverage 56.07%, patch coverage 100.0%, 1258 source files in scope; the scheduled ci-nightly lane on main stayed red through 2026-08-29 (for example run 33230657955 with the Codecov/Patch 95 job failing), so no fresh main baseline exists and project coverage remains unmeasured on main while the 95% final target is unmet; reviewed under #6216, dispositioned under #13704"
disposition = "renew_with_new_evidence"
falsifier = "A fresh ci-nightly coverage baseline on main (or a blocking Codecov project check) measuring workspace project coverage >= 95% falsifies this entry; the exception must then be removed at once instead of waiting for expiry."
removal_criteria = "Codecov project status is blocking at 95% and no active project-coverage-burndown exception remains"
created = "2026-05-28"
review_after = "2026-09-09"
expires = "2026-09-30"
