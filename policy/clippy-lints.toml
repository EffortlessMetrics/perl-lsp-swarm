schema = 2
msrv = "1.95"

[policy]
panic_free_tests = true
allow_test_carveouts = false
suppression_style = "expect-with-reason"
blanket_categories = false

# Lint entries are sharded by class under policy/clippy-lints.d. The checker loads
# those fragments in sorted path order and validates them as one logical ledger.

# This lint belongs to the Rust/Clippy 1.96 rail and must remain absent from the
# Rust 1.95 product policy until the synchronized product toolchain bump lands.
[[planned]]
name = "clippy::manual_pop_if"
level = "deny"
activate_when_msrv = "1.96"
class = "reviewability"
reason = "Activate after #9864 moves the product workspace to Rust 1.97.1 and #1803 proves predicate, mutation, ownership, and drop-order equivalence."

# These lints are already available at or below the current product MSRV. They
# retain named, review-dated owners instead of remaining silently planned.
[[deferred_due]]
name = "clippy::collapsible_if"
level = "deny"
activate_when_msrv = "1.95"
class = "style"
owner = "#6305"
reason = "The historical 293-site burn-down is complete; #6305 owns current all-target remeasurement and the explicit Cargo/ledger deny ratchet."
review_after = "2026-10-15"
next_status = "active"

