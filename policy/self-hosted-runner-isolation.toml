# Self-hosted runner isolation profiles
#
# Every job that can be started by pull-request-controlled activity AND routes
# to self-hosted runner capacity must appear here. `workflow-policy-lint`
# enforces that obligation job-driven: a self-hosted PR-controlled job with no
# `[[profile]]` entry fails the Workflow Policy gate closed
# (SELF_HOSTED_ISOLATION_UNDECLARED).
#
# Owner: #7414 (cross-run substrate isolation for persistent trusted-pr runners)
# Gate:  #15070 (this registry and its fail-closed check)
#
# ## What a profile does and does not establish
#
# A profile is a *declaration of observed substrate*, not a safety certificate.
#
#   lifecycle = "persistent"
#
# records that state survives between runs. It does NOT assert that the runner
# is decontaminated between candidates. Cross-run sentinel proof, cache
# promotion validation, network-egress containment, and teardown verification
# are runtime evidence that no repository-side static check can supply; they
# remain open on #7414 and are named per profile in `runtime_proof`.
#
# Downstream consumer: #10064 reads these profiles when qualifying a self-hosted
# integration route. A product-green bundle is not evidence that the isolation
# contract passed.
#
# ## Fields
#
#   workflow           exact `.github/workflows/<file>` path
#   job                exact job id in that workflow's `jobs:` map
#   runner             normalized runner token; must match the job's actual
#                      `runs-on:` (drift fails the gate)
#   lifecycle          disposable | reimaged | persistent
#   candidate_writable host paths a candidate job can write that outlive the
#                      job; empty list only when the substrate truly retains
#                      nothing
#   per_run_namespaced writable paths that are namespaced per run and therefore
#                      cannot carry state to the next candidate
#   runtime_proof      issue owning the cross-run/teardown/egress proof this
#                      static declaration does not establish
#   review_after       freshness boundary; a lapsed profile fails the gate

schema_version = 1
policy = "self-hosted-runner-isolation"
owner = "EffortlessMetrics"
updated = "2026-09-07"

# =============================================================================
# Rust small lanes on persistent CX53/CX43 capacity
#
# These four jobs check out the pull-request head and execute candidate build
# and test code inside Docker, with two host cache directories mounted
# read-write and shared across every run on the host. Those two mounts are the
# concrete cross-run channel #7414 exists to close: a candidate can write cargo
# registry/git content and sccache objects that a later candidate may read as
# build input.
#
# The workspace and scratch/target mounts are namespaced per run/attempt and
# torn down by an in-job cleanup step, so they are recorded separately.
# =============================================================================

[[profile]]
workflow = ".github/workflows/ripr.yml"
job = "ripr-cx53"
runner = "self_hosted_cx53"
lifecycle = "persistent"
candidate_writable = ["/mnt/ci-cache/cargo-home", "/mnt/ci-cache/sccache"]
per_run_namespaced = [
  "$GITHUB_WORKSPACE",
  "/mnt/ci-scratch/perl-lsp-swarm/ripr-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT",
  "/mnt/ci-scratch/tmp/ripr-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT",
]
runtime_proof = "#7414"
review_after = "2027-03-07"

