# =============================================================================
# Nano lanes on persistent workflow-nano capacity
#
# These jobs mount no host cache and run no container, but they do check out the
# pull-request head on a persistent host. The runner work directory and any
# state a candidate writes outside it are therefore still cross-run surfaces
# until #7414 proves teardown.
# =============================================================================

[[profile]]
workflow = ".github/workflows/policy-validators.yml"
job = "validate"
runner = "self_hosted_workflow_nano"
lifecycle = "persistent"
candidate_writable = ["runner work directory"]
per_run_namespaced = ["$GITHUB_WORKSPACE"]
runtime_proof = "#7414"
review_after = "2027-03-07"

[[profile]]
workflow = ".github/workflows/agent-capability-gate.yml"
job = "agent-capability-gate-self-hosted"
runner = "self_hosted_workflow_nano"
lifecycle = "persistent"
candidate_writable = ["runner work directory"]
per_run_namespaced = ["$GITHUB_WORKSPACE"]
runtime_proof = "#7414"
review_after = "2027-03-07"

# =============================================================================
# Droid review lane
#
# Recorded, not endorsed. #7414 explicitly does not rehabilitate Droid automatic
# execution; #6098 owns that lane's trust decision. This profile exists so the
# lane cannot be altered or duplicated silently, and so its secret exposure on a
# persistent host stays visible.
# =============================================================================

[[profile]]
workflow = ".github/workflows/droid.yml"
job = "droid"
runner = "self_hosted_droid_review"
lifecycle = "persistent"
candidate_writable = ["runner work directory"]
per_run_namespaced = ["$GITHUB_WORKSPACE"]
runtime_proof = "#6098"
review_after = "2027-03-07"
