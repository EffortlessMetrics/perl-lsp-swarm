# Live `textDocument/completion` candidate producer inventory
#
# Controlling issue #10949, programme #8969, identity controller #8963. This
# ledger is the denominator for completion candidate convergence: #10229 cannot
# claim one live application route, and #10230 cannot claim a complete outcome,
# without knowing every seam that can put a candidate in front of a user.
#
# Read by `cargo xtask completion-candidates check`, which reconciles every row
# against current source and fails closed on an uninventoried append or return
# seam, a stale row, a forbidden disposition, an unowned compatibility, a
# declared reach that disagrees with the call site, an append after
# finalization, or generated-projection drift.
#
# This ledger changes no completion behavior. Every row records what the source
# does today, not what it should do.
#
# Denominator
#   A producer is a function that carries candidates: it takes a
#   `&mut Vec<Candidate>` append channel, or returns a type containing
#   `Vec<Candidate>`, where a candidate is a `CompletionItem` (today's
#   compatibility shape) or a `CompletionCandidate` (the migration target).
#   `cargo xtask completion-candidates check` derives that set from source; the
#   dispositions below are the authored half.
#
# On `identity = legacy_label_compatibility` everywhere
#   That is not a placeholder. The candidate envelope landed with semantic and
#   source-anchored constructors in PR #10145, and no live producer uses them
#   yet: every candidate reaches merge identified by its label. Each row names
#   the issue that changes that.
#
# On `source_completeness = legacy_unreported` almost everywhere
#   One producer already reports whether it finished: `htmx::complete_header_names`
#   distinguishes "not my context" from "mine, and empty". Every other row is
#   `legacy_unreported`, and the one exception is discarded by the facade above
#   it, so no request outcome preserves the signal. Until that changes a
#   `Complete` completion outcome is not earned by any request, because an
#   empty result is indistinguishable from a producer that gave up. The gap is
#   propagation, not capability — which is what #10230 consumes.
#
# On the Dancer2 row
#   `add_dancer2_keyword_completions` is reached by `handle_completion_cancellable`
#   and not by `handle_completion`. That is a live behavior difference, not a
#   bookkeeping artifact, and it is recorded here rather than repaired: route
#   convergence is #10229's claim.


