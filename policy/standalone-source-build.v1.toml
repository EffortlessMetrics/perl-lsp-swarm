# Exact registry-source contract (#11514), extension of #10243.
# No resolver, executor, stage DAG, destination authority, or installer wiring is added.
schema_version = "standalone_source_build.v1"
policy_id = "standalone-source-build.v1"
owner = "#11514"
review_after = "2026-11-26"

[scope]
consumer = "no_executor_consumes_this_contract"
parent = "#10243"
parent_binding = "transaction_attempt_resolved_subject_target_product_roots_must_agree"
target_support = "owned_by_parent_subject_and_6067_not_this_schema"
actual_parent_integration = "not_proven"
immutable_plan = "requested_inputs_only_no_observations_or_self_digest"
supplied_evidence = "synthetic_contract_controls_only"
matching_supplied_digests = "internal_consistency_only"
authenticated_provenance = "not_proven"
actual_build_authorization = "not_proven"

[source_subject]
route_mode = "first_party_posix_or_powershell"
source_kind = "registry_package_only"
registry_identity = "crates.io"
sparse_index = "sparse+https://index.crates.io/"
git_index = "https://github.com/rust-lang/crates.io-index"
registry_authority = "https://doc.rust-lang.org/cargo/reference/registries.html"
index_authority = "https://doc.rust-lang.org/cargo/reference/registry-index.html"
package_name = "perllsp"
version_selector = "exact_semver_only"
profile = "release"
checksum_required = true
manifest_digest_required = true
lockfile_required = true
workspace_source_forbidden = true
path_source_forbidden = true
git_source_forbidden = true
mutable_branch_forbidden = true
missing_dependency_graph = "plan_valid_only_never_observed_or_build_ready"

[execution]
mode = "advanced_explicit_source"
archive_failure_fallback = "forbidden"
consent = "required_before_code_execution"
consent_event = "separate_evidence_binds_plan_digest_transaction_attempt_disclosure_policy"
disclosure = "Build scripts and proc-macros may execute with installer process authority; directory isolation is not a security sandbox."
disclosure_identity = "sha256_of_exact_UTF8_disclosure_bytes"
consent_policy_identity = "sha256_of_versioned_consent_policy_bytes"
build_scripts_and_proc_macros = "may_execute_with_installer_authority"
isolated_directory = "reproducibility_hygiene_only"
security_sandbox_claim = "not_proven_by_directory_isolation"
product_unit = "advanced_source_server_only"
expected_executable_role = "perllsp"
perl_dap_pair = "not_satisfied"
# The future executor must authenticate evidence, enforce ordering and obtain consent.
# Plan validity and synthetic internal consistency never permit code execution.

[network]
materialization = "canonical_registry_acquisition_for_resolved_subject_only"
build = "forbidden"
enforcement_by_contract = "not_proven"

[configuration]
policy = "closed_initial_v1"
cargo_home = "fresh_attempt_private"
rustup_home = "identified_toolchain_only"
cargo_config = "no_ambient_hierarchy"
registry_credentials = "forbidden"
proxies_and_ca = "forbidden_initial_policy"
rustflags = "forbidden"
rustdocflags = "forbidden"
rustc = "exact_version_and_binary_digest"
cargo = "exact_version_and_binary_digest"
rustc_wrapper = "forbidden"
rustc_workspace_wrapper = "forbidden"
linker = "platform_required_linker_in_identified_toolchain_prerequisite"
runner = "forbidden"
path = "identified_toolchain_lookup_digest_only"
git_config = "forbidden"
credential_helpers = "rejected_by_closed_shape"
shared_target_or_incremental_cache = "forbidden"
inherited_build_script_environment = "explicit_allowlist_only"
inherited_environment_allowlist = ["CARGO_HOME", "CARGO_TARGET_DIR", "PATH"]
inherited_environment_values = "derived_from_bound_private_roles_and_identified_toolchain_lookup"
cargo_derived_environment = "OUT_DIR_TARGET_HOST_CARGO_CFG_and_other_Cargo_generated_values_from_identified_toolchain_and_bound_source_target_only"
arbitrary_ambient_overrides = "forbidden"
environment_authority = "https://doc.rust-lang.org/cargo/reference/environment-variables.html"
unknown_or_unsupported_customization = "refuse_never_strengthen_exactness"
missing_enforcement_evidence = "not_proven"

[roots]
representation = "opaque_role_identities_never_private_paths"
roles = ["cargo_home", "build", "target", "staging", "destination"]
private_roles = "fresh_attempt_private_distinct_ids"
destination = "parent_owned_reference_only_no_promotion"
authority = "unelevated_user_only"
system_or_elevated_root = "unsupported"
cleanup = "attempt_private_only_preserve_destination"
deadline = "bounded_seconds_1_to_86400"
parallel_jobs = "bounded_1_to_64"
cancellation = "stop_children_then_cleanup_attempt_private_roles"
cleanup_enforcement = "future_executor_obligation_not_proven"

[validation]
shape = "closed_JSON_Schema_local_constraints_no_domain_reason_codes"
semantics = "cross_field_non_null_identity_and_typed_result_comparison"
planning_success = "plan_valid"
evidence_comparison_success = "internal_consistency_only"
missing_stale_cross_subject_or_failed_evidence = "never_observed_or_build_ready"
plan_digest_mismatch = "evidence_subject_mismatch"
lockfile = "non_null_expected_and_supplied_digest_and_source_subject_must_match"
parent_integration = "future_10243_consumer_must_authenticate_and_bind_parent_subject"
private_values_in_receipts = "forbidden"

[digest]
algorithm = "sha256"
domain_prefix = "standalone_source_build.v1\n"
input = "immutable_plan_only"
serialization = "compact_JSON_sorted_ASCII_object_keys_preserve_array_order_no_whitespace"
subset = "ASCII_strings_and_keys_unsigned_integer_numbers_booleans_null_arrays_objects"
string_encoding = "JSON_quote_backslash_and_short_b_f_n_r_t_escapes_other_controls_lowercase_u00xx_no_slash_escape"
unsupported_numeric_or_unicode_input = "rejected"
feature_order = "significant_preserve_requested_array_order"
self_digest = "excluded_by_closed_plan_schema"
consent = "event_references_computed_plan_digest_not_part_of_immutable_plan"

[result_vocabulary]
terminal_success = ["plan_valid"]
terminal_failure = ["invalid_or_ambiguous_subject", "source_unavailable", "source_checksum_mismatch", "lockfile_missing_or_mismatch", "dependency_graph_not_proven", "toolchain_unavailable_or_mismatch", "ambient_configuration_rejected", "consent_required", "resource_or_deadline_exhausted", "cancelled", "build_failed", "instrument_failure", "not_proven"]
# These remain distinct under #10243; this extension defines no transitions or success receipts.
parent_stages = ["planned", "materialized", "built", "observed", "promotable", "installed"]
structural_result = "schema_rejected"
semantic_reasons = ["parent_subject_mismatch", "evidence_subject_mismatch", "source_checksum_mismatch", "lockfile_missing_or_mismatch", "dependency_graph_not_proven", "toolchain_unavailable_or_mismatch", "ambient_configuration_rejected", "instrument_failure", "consent_required", "network_policy_contradiction", "root_role_alias", "not_proven"]

[receipt]
binds = ["transaction_id", "attempt_id", "resolved_subject_sha256", "resolved_source_sha256", "plan_sha256", "package_checksum", "manifest_sha256", "lockfile_sha256", "dependency_graph", "toolchain", "instrument", "configuration_enforcement", "consent"]
redacts = ["credentials", "tokens", "complete_environment", "private_paths"]
synthetic_controls = "do_not_establish_acquisition_execution_sandboxing_provenance_or_release_readiness"

[fixtures]
format = "one_full_synthetic_positive_packet_negative_vectors_name_that_base_and_one_pointer_value_mutation"
execution = "materialize_mutation_validate_schema_then_semantics_repair_same_field_and_require_positive"
configuration_evidence_identity = "sha256_canonical_configuration_with_standalone_source_build.configuration.v1_newline_domain"
