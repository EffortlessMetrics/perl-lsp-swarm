schema_version = 1
policy = "ga-evidence-policy"

# Governs which feature classes may claim `proven` and what evidence each
# requires (#6731). Runtime advertisement (`maturity`) is deliberately
# unchanged by this policy: it gates product behavior. This policy governs
# PUBLIC CLAIMS only.
#
# Every eligible class requires the full evidence set. A row may always claim
# less than it has earned; claiming more fails `catalog-authority check-catalog`.

default_class = "request_response"

[[class]]
id = 'request_response'
ga_eligible = true
required_evidence = [
  "capability_dispatch",
  "positive_behavior",
  "shape_schema",
  "real_process_wire",
  "negative_control",
]

# Resolve variants must earn their own receipts; a parent provider's proof
# never promotes its resolve variant (#8289/#8345 boundary).
[[class]]
id = 'resolve_variant'
ga_eligible = true
required_evidence = [
  "capability_dispatch",
  "positive_behavior",
  "shape_schema",
  "real_process_wire",
  "negative_control",
]

[[class]]
id = 'notification_event'
ga_eligible = true
required_evidence = [
  "capability_dispatch",
  "positive_behavior",
  "shape_schema",
  "real_process_wire",
  "negative_control",
]

# Server -> client requests cannot be GA while their client response outcome
# is unconsumed.
[[class]]
id = 'server_initiated_request'
ga_eligible = false
required_evidence = [
  "capability_dispatch",
  "positive_behavior",
  "shape_schema",
  "real_process_wire",
  "negative_control",
]
blocked_until = "#6722 #6724 own server-to-client request response consumption"

# Document/workspace features cannot be GA while retained-state lifecycles
# are unproven.
[[class]]
id = 'document_lifecycle'
ga_eligible = false
required_evidence = ["capability_dispatch", "positive_behavior", "negative_control"]
blocked_until = "#6726 #6728 own retained-state lifecycle matrices"

[[class]]
id = 'cancellation_progress'
ga_eligible = false
required_evidence = ["capability_dispatch", "positive_behavior", "negative_control"]
blocked_until = "#6729 owns cancellation/termination and token-lifetime contracts"

[[class]]
id = 'lifecycle_transport'
ga_eligible = false
required_evidence = ["capability_dispatch", "positive_behavior", "negative_control"]
blocked_until = "#6720 owns real-process transport/lifecycle substrate evidence"

# DAP behavior is a separate claim dimension; LSP evidence cannot promote it.
[[class]]
id = 'dap'
ga_eligible = false
required_evidence = ["capability_dispatch", "positive_behavior", "shape_schema", "real_process_wire", "negative_control"]
blocked_until = "DAP dimension owes its own evidence receipts (#6731 residual sweep)"

# Custom perl.* surfaces are a separate claim dimension from standard LSP.
[[class]]
id = 'custom_extension'
ga_eligible = false
required_evidence = ["capability_dispatch", "positive_behavior", "real_process_wire"]
blocked_until = "custom perl.* surface owns exact-process evidence (#6731 close boundary)"

