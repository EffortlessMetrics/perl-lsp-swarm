reason = "Futures must be awaited, spawned, or explicitly dropped by policy."

[[lint]]
name = "clippy::let_underscore_must_use"
level = "deny"
status = "tracked"
class = "silent-failure"
reason = "Must-use values cannot be discarded with let-underscore."

# The two let_underscore_lock identities partition one invariant across two
# tools; they do not overlap. Measured on the selected 1.95.0 toolchain
# (#14444): rustc fires on `std::sync` mutex and read/write guards and is silent
# on `parking_lot`; Clippy fires on borrowed `parking_lot` guards and is silent
# on the standard-library guards it uplifted to rustc. Removing either row
# therefore uncovers real lock types rather than duplicating the other row's
# coverage.
#
# Known gap, measured rather than assumed: both rows recognise exactly one
# shape, `let _ = <expr>` whose type is a known borrowed guard. Three discards
# with identical meaning fall outside it and are silently accepted --
# `let _ = m.lock_arc()` (owned ArcMutexGuard/ArcRwLock*Guard), `drop(m.lock())`
# for either family, and a discarded mapped guard. The owned family is
# production-reachable: the workspace enables `arc_lock` and perl-workspace's
# workspace_index holds an ArcMutexGuard. `drop(m.lock())` matters for a
# different reason -- it is the rewrite a blocked contributor reaches for, and
# #14444 already names it a dishonest repair. Owned by #14579; the boundary is
# asserted by xtask/src/tasks/check_lint_policy/tests/lock_partition.rs so it
# cannot drift unrecorded.
[[lint]]
name = "rust::let_underscore_lock"
level = "deny"
status = "active"
class = "silent-failure"
reason = "Standard-library lock acquisitions must be held by named guards with visible scope; stated explicitly so the contract does not depend on the rustc default level."

[[lint]]
name = "clippy::let_underscore_lock"
level = "deny"
status = "active"
class = "silent-failure"
reason = "Borrowed non-std lock acquisitions (parking_lot mutex and read/write guards) must be held by named guards with visible scope; rustc does not cover these types, and owned arc guards are covered by neither lint (#14579)."

