# `perl-tree-sitter-compat` consumer and behavior inventory
#
# Controlling issue #8880, train #8877 row PR-09. This ledger is the removal
# denominator for the duplicate Tree-sitter facade: #8889 migrates what must
# survive and #8890 deletes the crate. Neither can act without knowing what the
# crate owns and who actually depends on it.
#
# Read by `cargo xtask compat-inventory`, which reconciles every row against the
# crate's real surface and fails closed on an unexplained reference, a missing
# or stale row, a disagreeing item kind, a changed source digest, or a changed
# authority digest.
#
# Dispositions
#   already_equivalent             a canonical owner already provides the behavior
#   unique_and_required            exists only here and must survive migration
#   unique_but_invalid_or_obsolete exists only here but must not be carried across
#   migration_only_entry_point     reaches the crate but carries no authority of
#                                  its own; retires when the crate does
#   unused                         nothing consumes it and no product claim rests
#                                  on it
#   unknown_blocking               disposition not established; blocks the task
#
# Where the required/unused line falls
#   `docs/explanation/TREE_SITTER_COMPATIBILITY.md` names `parse_to_tree`,
#   `to_ts_node`, `highlights`, and `to_sexp` as the current Tier-A compatibility
#   surface. Those, and the types they return, carry a product claim and are
#   `unique_and_required` even though no in-tree caller links against them today.
#   Public surface outside that claim, with no consumer and no proof, is
#   `unused` — it is incidental API, not behavior the migration owes anything to.
#
# On `unused`: the crate currently has zero Cargo dependents, which is what
# permits that disposition at all. A text search could not establish it, because
# a manifest can declare a dependency that no `use` line ever names.
#
# Discovery boundary: rows are derived from `fn` / `struct` / `enum` declarations
# carrying `pub` or a restricted visibility, and their inherent methods. Trait
# implementations are public
# behaviour but are not separate rows, because a trait impl has no declaration
# of its own to disposition. The crate has two — `Display` and
# `std::error::Error` on `TreeError` — and they are recorded on that type's row
# so the migration owner still sees them.
#
# On #8880's "public/internal symbol": the internal population is empty, and that
# emptiness is checked rather than claimed. Discovery records `pub(crate)`,
# `pub(super)`, and `pub(in ...)` items alongside public ones and tags each row
# with its `visibility`; a discovered internal symbol with no row fails the task
# exactly as a public one does. The crate declares none today, so every row below
# omits `visibility` and takes the `public` default. What remains below `pub` is
# module-private, which by construction cannot be consumed from outside the crate
# and therefore cannot require migration — it is deleted with the crate under
# #8890, and carries no row. A symbol whose visibility changes also fails the
# task: its disposition was audited against the old reachability.
#
# On `reference_kind`: the kinds a path decides are enforced. A row under
# `crates/perl-tree-sitter-compat/` must be `own_crate`, `Cargo.lock` must be
# `lockfile`, and a manifest declaring a Cargo dependency must be
# `cargo_dependency` — that last one is load-bearing, because `unused` is
# permitted only when the Cargo population is empty. The remaining kinds
# (`documentation`, `policy`, `tooling`, `rust_import`) describe what a file
# DOES with the reference, which its path cannot settle, so they are an
# auditor's judgment and are not machine-checked. No reconciliation rule branches
# on them; for those rows the ledger proves the reference exists and carries
# exactly one disposition, not that its label is the best one.
#
# A row's disposition is about the BEHAVIOUR, not only the symbol. A symbol may
# be obsolete as an authority while the behaviour it produces is still required
# by another row; `pascal_to_snake` is exactly that case and carries a migration
# dependency despite being `unique_but_invalid_or_obsolete`.

schema_version = "tree_sitter_compat_inventory.v1"
package = "perl-tree-sitter-compat"
controlling_issue = "#8880"
migration_owner = "#8889"
removal_owner = "#8890"

# Digest over the crate's tracked `.rs` and `Cargo.toml` files. A source change
# invalidates every disposition below and fails the task until they are
# re-audited. Prose files are excluded so a README edit does not force a
# re-audit.
source_digest = "sha256:8808149a51e4a706dea655c3d7c4e015f3653746c3179d2777f62c68444d7590"

# Digest of the external documents that ADJUDICATE these dispositions, as
# distinct from the crate source they describe. `docs/explanation/
# TREE_SITTER_COMPATIBILITY.md` names the Tier-A compatibility surface, and the
# required/unused line below is drawn directly from that list. Editing the
# Tier-A set changes the reasoning behind several rows while leaving the crate
# source — and therefore `source_digest` — untouched, so that evidence is bound
# separately and a change to it fails the task until the affected rows are
# re-audited.
authority_digest = "sha256:9f481f0dd02f7b88ec1853059d28eb1fd13033bc0691b56770b6fb50aea03c5a"

