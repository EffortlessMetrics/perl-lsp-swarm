# Advisory framework fact adapter registry.
#
# This policy records reviewed framework adapter classes. It does not broaden
# provider behavior, generated-symbol behavior, rename, or safe delete.

schema_version = 1
policy = "framework-adapters"
owner = "perl-lsp maintainers"
status = "advisory"
updated = "2026-08-28"
spec = "docs/specs/PLSP-SPEC-0024-framework-fact-adapters.md"
fact_provenance_spec = "docs/specs/PLSP-SPEC-0017-fact-provenance-and-source-backing.md"
edit_authorization_spec = "docs/specs/PLSP-SPEC-0018-edit-authorization-contract.md"
workspace_symbol_spec = "docs/specs/PLSP-SPEC-0020-workspace-symbol-generated-label-contract.md"
support_tiers = "docs/project/status/SUPPORT_TIERS.md"
provider_promotion_ledger = "policy/provider-promotion-ledger.toml"

default_state = "blocked_unlisted"
default_generated_label = "[generated/framework]"
default_rename_policy = "blocked_without_class_specific_edit_proof"
default_safe_delete_policy = "blocked_without_class_specific_edit_proof"

receipt_sources = [
  "docs/project/status/provider_confidence_matrix.md",
  "docs/project/status/provider_cutover.md",
  "docs/project/status/semantic_shadow_compare.md",
  "docs/project/status/real_perl_editor_trust_v1.md",
]

[[adapter]]
framework = "Class::Tiny"
fact_class = "generated_member"
state = "planned"
fact_provenance = "SourceBackedGenerated"
source_anchor_required = true
generated_label_required = true
rename_policy = "block_generated_member_by_default"
safe_delete_policy = "block_generated_member_by_default"
provider_surfaces = [
  "completion",
  "hover",
  "document_symbols",
  "workspace_symbols",
  "rename",
  "safe_delete",
]
blocks = [
  "generated_no_source",
  "stale_fact",
  "dynamic_boundary",
  "low_confidence",
  "ambiguous_identity",
  "unsupported_fact_class",
]
claim_boundary = "Class::Tiny generated members require source declaration anchors and generated labels before provider use."

