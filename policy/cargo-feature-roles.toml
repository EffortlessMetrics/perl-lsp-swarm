# Cargo feature role registry (#8409)
#
# One classified role per governed Cargo feature, plus the consumer evidence
# discovered from current source. Validated by
# `python3 scripts/ci/validate_cargo_feature_roles.py`, which rediscovers every
# (crate, feature) pair and fails when a feature is unregistered, a row is
# stale, a declared consumer disposition no longer matches the source, a
# restricted role becomes reachable from a crate default, or a name asserts
# test/experimental/roadmap status that the role does not.
#
# This registry is NOT a second authority for:
#   * supported build-feature combinations  -> #3790
#   * product capability maturity/advertisement -> #6731
#   * public compatibility for renames/removals -> #8097
# Rows carry role and consumer evidence only; unknown keys are rejected.
#
# `consumers` records the exact SET of ways discovery observes the feature
# being consumed, not one winning label. A feature commonly carries several
# signals at once, so a single-valued field would hide the gain or loss of
# every signal but the highest-priority one:
#   cfg_gated          a `feature = "..."` predicate inside a real cfg form
#                      (comments and string literals do not count)
#   composition        the feature enables dependencies or other features
#   propagated         another feature enables this one
#   required_features  a Cargo target (lib/bin/test/example/bench) lists it in
#                      `required-features`, so it selects whether that target
#                      builds at all
# An empty list means nothing consumes the feature, which requires an explicit
# `migration` disposition.
#
# Regenerate the observed evidence with:
#   python3 scripts/ci/validate_cargo_feature_roles.py --explain

schema_version = 1
policy = "cargo-feature-roles"

roles = [
  "build_composition",
  "product_profile",
  "experimental_opt_in",
  "test_only",
  "legacy_alias",
  "aspirational_milestone",
]

consumer_signals = [
  "cfg_gated",
  "composition",
  "propagated",
  "required_features",
]

[authority]
classification = "#8409"
umbrella = "#8121"
migration = "#8411"
build_combinations = "#3790"
product_maturity = "#6731"
public_compatibility = "#8097"

