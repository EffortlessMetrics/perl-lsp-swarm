[[entries]]
class_id = "ambient_module_resolution"
owning_layer = "hir"
trigger_rule = "Module resolution depends on ambient search state (@INC contents, working directory, PERL5LIB) so the resolved file is not determined by source alone; a dynamic require-$expr alone is not this class."
compile_acceptance_blocks = false
downstream_blocks = true
allowed_provider_behaviors = ["fallback", "advisory"]
curated_gold_treatment = "Gold records the import as ambiently resolved with the candidate path set left open; gold never pins a resolved file."
oracle_result_class = "dynamic_or_unsupported"
oracle_promotion_effect = "blocks_promotion"
profile_boundary_behavior = "Profile-independent: ambient search state is outside every profile, so the boundary refuses regardless of profile."
owner_issue = "#4770"

[entries.distinctions]
not_dynamic_boundary = "The import edge is statically located; what is unsupported is which file it resolves to, not a runtime value crossing a boundary."
not_low_confidence = "Candidate files are enumerated from live search state, not scored; there is no confidence ranking to be low."
not_stale_evidence = "No cached resolution exists to go stale; the search state is read at observation time."
not_fallback = "Provider fallback is a consumer response to this class, not the class itself."
nearest_neighbor = "xs_native_dependency"

[entries.history]
introduced_in = "unsupported_fact_catalog.v1"
migrations = []

[[entries]]
class_id = "ambiguous_bareword"
owning_layer = "parser"
trigger_rule = "The parser encounters a bareword token where the sub-call, string-literal, and filehandle readings are all grammatically live and no disambiguating context resolves the intent."
compile_acceptance_blocks = false
downstream_blocks = true
allowed_provider_behaviors = ["fallback", "advisory"]
curated_gold_treatment = "Gold records the bareword as ambiguous with the live readings enumerated; gold never asserts a single resolved intent."
oracle_result_class = "dynamic_or_unsupported"
oracle_promotion_effect = "blocks_promotion"
profile_boundary_behavior = "Profile-independent: the ambiguity is syntactic and refuses exact facts in every profile."
owner_issue = "#4770"

[entries.distinctions]
not_dynamic_boundary = "The syntax tree is fully built without consulting any runtime value; nothing crosses a dynamic boundary."
not_low_confidence = "The readings are enumerated exactly from the grammar; the ambiguity is in the source, not in scorer certainty."
not_stale_evidence = "No cached fact is involved; the ambiguity is present in current source."
not_fallback = "No provider fallback has occurred; this classifies the parse, not a query outcome. It is also not the provider ambiguous_identity candidate-resolution outcome."
nearest_neighbor = "unsupported_parser_construct"

[entries.history]
introduced_in = "unsupported_fact_catalog.v1"
migrations = []

