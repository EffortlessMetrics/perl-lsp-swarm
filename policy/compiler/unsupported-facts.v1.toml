[[entries]]
class_id = "source_filter"
owning_layer = "parser"
trigger_rule = "A source filter (a Filter::* module, comment-driven rewriting, or equivalent pre-parse source transformation) rewrites the compilation unit before parsing, so the parsed text is not the authored text."
compile_acceptance_blocks = true
downstream_blocks = true
allowed_provider_behaviors = ["block", "require_confirmation"]
curated_gold_treatment = "Gold records the unit as filter-rewritten and expects blocked acceptance; gold never asserts facts over filtered source."
oracle_result_class = "dynamic_or_unsupported"
oracle_promotion_effect = "blocks_promotion"
profile_boundary_behavior = "Profile-independent: filtering precedes parsing in every profile, so acceptance cannot stand."
owner_issue = "#4770"

[entries.distinctions]
not_dynamic_boundary = "No runtime value is involved; the source text itself was rewritten before the parser ran."
not_low_confidence = "The rewrite is total, not a scored uncertainty; nothing about the filtered text can be confirmed from source."
not_stale_evidence = "No cached parse exists to go stale; the input to parsing differs from the authored file."
not_fallback = "Blocking is the required consumer response here; silent fallback over rewritten source would misrepresent it."
nearest_neighbor = "unsupported_parser_construct"

[entries.history]
introduced_in = "unsupported_fact_catalog.v1"
migrations = []

