[[entries]]
class_id = "unknown_boundary_evidence"
owning_layer = "semantic"
trigger_rule = "Boundary evidence is unknown or malformed (missing fields, unparsable payload, or unrecognized version), so no substantive class can be assigned; this is not the unknown schema escape hatch."
compile_acceptance_blocks = true
downstream_blocks = true
allowed_provider_behaviors = ["block", "require_confirmation"]
curated_gold_treatment = "Gold records the evidence as unknown and expects blocked promotion; unknown is never agreement, never support, and never a known limitation."
oracle_result_class = "unknown"
oracle_promotion_effect = "blocks_promotion"
profile_boundary_behavior = "Profile-independent: malformed evidence refuses in every profile."
owner_issue = "#4770"

[entries.distinctions]
not_dynamic_boundary = "No boundary disposition can be established at all; the evidence needed to classify one is missing or malformed."
not_low_confidence = "There is no evidence to score; low confidence presumes evidence that this class lacks."
not_stale_evidence = "Staleness presumes a well-formed cached fact; malformed evidence fails before freshness applies."
not_fallback = "Provider fallback presumes a classified cause; unknown evidence cannot select one, so consumers must block or confirm."
nearest_neighbor = "unsupported_parser_construct"

