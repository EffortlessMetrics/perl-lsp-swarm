[[entries]]
class_id = "compile_time_execution_outside_profile"
owning_layer = "semantic"
trigger_rule = "Compile-time execution (BEGIN, UNITCHECK, CHECK, INIT, use-import side effects, or constant folding over impure operations) runs outside the executable profile, so its effects are unobserved."
compile_acceptance_blocks = false
downstream_blocks = true
allowed_provider_behaviors = ["fallback", "advisory"]
curated_gold_treatment = "Gold records the phase-block effect as outside-profile and qualifies dependent facts; gold never asserts the unobserved effects."
oracle_result_class = "dynamic_or_unsupported"
oracle_promotion_effect = "blocks_promotion"
profile_boundary_behavior = "Outside the executable profile: the boundary refuses and stamps this class ID. Profile expansion retires the class; the ID never changes meaning."
owner_issue = "#4770"

[entries.distinctions]
not_dynamic_boundary = "The phase block is statically located; what is unsupported is observing its off-profile effects."
not_low_confidence = "The effects are unobserved by profile exclusion, not uncertainly scored."
not_stale_evidence = "No cached effect model exists to go stale; the execution is outside the observed profile."
not_fallback = "Provider fallback is a consumer response to this class, not the class itself."
nearest_neighbor = "runtime_builtin_outside_profile"

[entries.history]
introduced_in = "unsupported_fact_catalog.v1"
migrations = []

