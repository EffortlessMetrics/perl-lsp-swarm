[entries.distinctions]
not_dynamic_boundary = "The mutation site is statically located; what is unsupported is the resulting table state, not a value crossing a boundary."
not_low_confidence = "Post-mutation contents are computed at runtime, not scored from evidence."
not_stale_evidence = "No cached table snapshot is authoritative across the mutation; staleness does not apply."
