# Canonical inventory of fact reads performed by governed provider families.
#
# This inventory is evidence about current ownership and duplication. It does
# not promote a producer, change provider output, or authorize an edit.

schema_version = 1
policy = "provider-fact-reads"
owner_issue = 6815
generated_status = "docs/project/status/provider_fact_reads.md"

required_providers = [
  "completion",
  "definition",
  "references",
  "hover",
  "diagnostics",
  "rename",
  "safe_delete",
  "workspace_symbols",
  "document_symbols",
  "semantic_tokens",
]

allowed_producers = ["current_document", "workspace_index", "semantic_queries", "semantic_shadow", "runtime_mixed"]
allowed_proof_classes = ["mixed", "shadow", "edit_authorizing"]
allowed_dispositions = ["port_candidate", "intentional_provider_policy", "retire_after_parity"]

[[read]]
id = "completion.current_document_snapshot"
provider = "completion"
request_class = "textDocument/completion"
query = "current document AST, lexical declarations, and open-buffer source"
source_path = "crates/perl-lsp-rs/src/runtime/language/completion.rs"
source_anchors = ["handle_completion_cancellable"]
producer = "current_document"
proof_class = "mixed"
readiness_input = "document generation and parse availability"
fallback = "bounded legacy completion when current exact facts are unavailable"
duplicate_interpretation = "completion composes document syntax directly instead of one provider query port"
migration_disposition = "port_candidate"
replacement_owner = "#6816/#6817"

[[read]]
id = "completion.workspace_candidates"
provider = "completion"
request_class = "textDocument/completion"
query = "workspace declarations, packages, modules, imports, and generated candidates"
source_path = "crates/perl-lsp-rs/src/runtime/language/completion.rs"
source_anchors = ["route_index_access"]
producer = "workspace_index"
proof_class = "mixed"
readiness_input = "index readiness and workspace root"
fallback = "local and imported candidates remain available after bounded readiness handling"
duplicate_interpretation = "completion reads and ranks workspace candidates inside the request handler"
migration_disposition = "port_candidate"
replacement_owner = "#6816/#6817"

[[read]]
id = "completion.receiver_shadow"
provider = "completion"
request_class = "textDocument/completion"
query = "receiver visibility and source-backed completion shadow facts"
source_path = "crates/perl-lsp-rs/src/runtime/language/completion.rs"
source_anchors = ["completion_visibility_shadow"]
producer = "semantic_shadow"
proof_class = "shadow"
readiness_input = "current document and shadow budget"
fallback = "live completion remains authoritative"
duplicate_interpretation = "shadow comparison is completion-specific rather than using a shared provider port"
migration_disposition = "retire_after_parity"
replacement_owner = "#6818"

[[read]]
id = "definition.navigation_candidates"
provider = "definition"
request_class = "textDocument/definition"
query = "exact, imported, module, generated, and fallback definition candidates"
source_path = "crates/perl-lsp-rs/src/runtime/language/navigation.rs"
source_anchors = ["handle_definition"]
producer = "runtime_mixed"
proof_class = "mixed"
readiness_input = "document generation, root, and index readiness"
fallback = "legacy navigation for uncertain or unavailable facts"
duplicate_interpretation = "navigation composes several candidate sources and exactness rules locally"
migration_disposition = "port_candidate"
replacement_owner = "#6816/#6817"

[[read]]
id = "references.reference_candidates"
provider = "references"
request_class = "textDocument/references"
query = "lexical, package, imported, workspace, and textual reference occurrences"
source_path = "crates/perl-lsp-rs/src/runtime/language/references.rs"
source_anchors = ["handle_references"]
producer = "runtime_mixed"
proof_class = "mixed"
readiness_input = "document generation, include-declaration mode, root, and index readiness"
fallback = "legacy scan cascade for unpromoted reference classes"
duplicate_interpretation = "references owns a separate occurrence and fallback composition path"
migration_disposition = "port_candidate"
replacement_owner = "#6816/#6817"

[[read]]
id = "hover.semantic_and_fallback"
provider = "hover"
request_class = "textDocument/hover"
query = "source-backed, imported, generated, dynamic, documentation, and fallback hover facts"
source_path = "crates/perl-lsp-rs/src/runtime/language/hover.rs"
source_anchors = ["handle_hover"]
producer = "runtime_mixed"
proof_class = "mixed"
readiness_input = "document generation and available semantic snapshot"
