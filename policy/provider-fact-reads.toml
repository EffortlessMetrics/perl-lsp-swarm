# Canonical inventory of fact reads performed by governed provider families.
#
# This inventory is evidence about current ownership and duplication. It does
# not promote a producer, change provider output, or authorize an edit.

schema_version = 2
policy = "provider-fact-reads"
owner_issue = 6815
generated_status = "docs/project/status/provider_fact_reads.md"

required_providers = [
  "completion",
  "definition",
  "references",
  "hover",
  "diagnostics",
  "rename",
  "safe_delete",
  "workspace_symbols",
  "document_symbols",
  "semantic_tokens",
]

allowed_producers = ["current_document", "workspace_index", "semantic_queries", "semantic_shadow", "runtime_mixed"]
allowed_proof_classes = ["mixed", "shadow", "edit_authorizing"]
allowed_dispositions = ["port_candidate", "intentional_provider_policy", "retire_after_parity"]

[[read]]
