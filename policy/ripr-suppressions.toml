# RIPR Suppressions
#
# Suppressions for ripr static exposure analysis findings. Each suppression
# requires owner, reason, created, review_after, and expires. Suppressions
# are the documented exception path; the default is to leave findings
# advisory-visible.
#
# Read by .github/workflows/ripr.yml (PR 06+) and ripr.toml.

schema_version = 1
policy = "ripr-suppressions"
owner = "EffortlessMetrics"
status = "advisory"
updated = "2026-06-01"

# -----------------------------------------------------------------------------
# Generated status docs: validated through status-generation checks, not
# Rust test oracle exposure.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-generated-status-docs"
kind = "generated_or_non_production_surface"
paths = ["docs/project/status/**"]
classification = ["static_unknown", "no_static_path"]
owner = "repo-owner"
issue = "TODO"
reason = "Generated status docs are verified through status-generation checks, not Rust test oracle exposure."
created = "2026-05-07"
review_after = "2026-06-07"
expires = "2026-08-07"

# -----------------------------------------------------------------------------
# Archived source: retained historical code, not active workspace behavior.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-archive"
kind = "generated_or_non_production_surface"
paths = ["archive/**"]
owner = "proof-lane"
issue = "#8197"
reason = "Archived source is retained for historical reference and is excluded from active workspace proof targets; current behavior must be proven in live crates instead."
created = "2026-05-28"
review_after = "2026-06-28"
expires = "2026-09-30"

# -----------------------------------------------------------------------------
# UX receipt tests: executable proof artifacts, not production behavior seams.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-ux-receipt-tests"
kind = "test_receipt_surface"
paths = ["crates/perl-lsp-ux-tests/tests/*", "crates/perl-lsp-ux-tests/tests/**"]
owner = "editor-trust"
issue = "#8197"
reason = "Editor UX receipt tests are proof inputs validated by cargo/UX gates and fixture inventory; diff-scoped RIPR should not block on oracle gaps inside newly added receipt tests."
created = "2026-06-01"
review_after = "2026-07-01"
expires = "2026-09-30"

# -----------------------------------------------------------------------------
# Seam-proof test files: diff-scoped RIPR harness plumbing, not production seams.
# Tracks EffortlessMetrics/ripr#1428 (RIPR flags test-harness plumbing in newly
# added test files as production seams). Remove this suppression once #1428 lands.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-seam-proof-tests"
kind = "test_receipt_surface"
paths = ["crates/**/tests/ripr_seam_proof_*.rs"]
classification = ["call_deletion", "return_value", "error_path"]
owner = "proof-lane"
issue = "#1289"
reason = "Seam-proof test files (ripr_seam_proof_*.rs) are diff-scoped proof harnesses whose internal plumbing — Ok(()) returns, .contains() calls, ? operators — must not be treated as new production seams by diff-scoped RIPR analysis. This is the same class as ripr-suppress-ux-receipt-tests. Tracks EffortlessMetrics/ripr#1428; remove when fixed upstream."
created = "2026-06-10"
review_after = "2026-07-10"
expires = "2026-09-30"

# -----------------------------------------------------------------------------
# parse_qw_arg_list predicate seams — new unit tests in same diff not credited.
#
# Two `weakly_exposed` predicate seams at crates/perl-module/src/import/mod.rs
# (lines 626 and 640 in the production code, parse_qw_arg_list):
#   (A) `if delimiter.is_ascii_alphanumeric() || delimiter == '_'`
#   (B) `if inner_start > inner_end || !after_operator.ends_with(closing)`
#
# Direct unit tests in `mod tests` cover both seams:
#   parse_qw_arg_list_alphanumeric_delimiter_is_rejected (seam A)
#   parse_qw_arg_list_opening_only_returns_none           (seam B)
#   parse_qw_arg_list_mismatched_closing_returns_none     (seam B)
#
# RIPR's diff-scoped analysis does not credit newly-added `mod tests` unit
# tests as discriminating evidence for production code changed in the same
# diff. Because both the production fix and the unit tests are new in this PR,
# RIPR's test-correlation window finds only pre-existing integration tests
# (which call parse_qw_arg_list indirectly and lack boundary-discriminating
# inputs) rather than the direct unit tests that are the real proof.
#
# Tracks EffortlessMetrics/ripr#1429 (static analysis limitation: test
# correlation does not credit newly-added inline unit tests for newly-changed
# private functions in the same diff). Remove once #1429 is fixed upstream.
# -----------------------------------------------------------------------------
[[suppress]]
id = "ripr-suppress-parse-qw-arg-list-predicate-seams"
kind = "narrow_static_unknown"
paths = ["crates/perl-module/src/import/mod.rs"]
classification = ["weakly_exposed"]
owner = "proof-lane"
issue = "#1205"
reason = "parse_qw_arg_list predicate seams (alphanumeric-guard and inner-bounds-guard) are covered by direct unit tests in mod tests (parse_qw_arg_list_alphanumeric_delimiter_is_rejected, parse_qw_arg_list_opening_only_returns_none, parse_qw_arg_list_mismatched_closing_returns_none). RIPR diff-scoped analysis does not credit newly-added mod tests unit tests as discriminating evidence when both the production fix and the tests are new in the same diff. Tracks ripr#1429."
created = "2026-06-10"
review_after = "2026-07-10"
expires = "2026-09-30"
