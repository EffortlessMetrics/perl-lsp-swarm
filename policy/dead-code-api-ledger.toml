# --------------------------------------------------------------------------
# Result-state mapping. Every state the reachability programme distinguishes is
# dispositioned for both public entry points. A collapse is recorded as a defect
# with an owner; it is never silently accepted.
# --------------------------------------------------------------------------

[[result_state]]
id = "complete_canonical_local"
analyze_file = "represented_lossy"
analyze_workspace = "represented_lossy"
defect = ""
owner = ""
note = "Findings are returned, but they are text-scan heuristics rather than canonical local flow facts, and carry no generation or currentness identity."

[[result_state]]
id = "complete_canonical_workspace"
analyze_file = "not_reachable"
analyze_workspace = "represented_lossy"
defect = ""
owner = ""
note = "`analyze_workspace` returns a whole-workspace value, but with no root, component, SCC, production/test or interface identity. `analyze_file` has no workspace tier at all."

[[result_state]]
id = "complete_local_only_workspace_deferred"
analyze_file = "indistinguishable_from_complete"
analyze_workspace = "not_reachable"
defect = "`analyze_file` returns a local-only result with no marker saying the workspace tier was not consulted, so a caller cannot tell a local-only answer from a complete one."
owner = "#10941"
note = "Complete result identity is #10941's; this surface has no tier field to carry it."

[[result_state]]
id = "partial_or_degraded"
analyze_file = "not_reachable"
analyze_workspace = "indistinguishable_from_clean_empty"
defect = "Per-file errors are discarded by `analyze_workspace`, so a partially analysed workspace is byte-identical to a fully analysed one with fewer findings."
owner = "#10935"
note = "`files_analyzed` counts visited documents, not successful ones, so it cannot recover the difference."

[[result_state]]
id = "cancelled"
analyze_file = "not_reachable"
analyze_workspace = "not_reachable"
defect = ""
owner = ""
note = "The API is synchronous and takes no cancellation token, so the state cannot be entered. It is absent, not hidden."

[[result_state]]
id = "deadline_exceeded"
analyze_file = "not_reachable"
analyze_workspace = "not_reachable"
defect = ""
owner = ""
note = "No deadline input exists. A host-level timeout kills the caller without producing a value."

[[result_state]]
id = "resource_exhausted"
analyze_file = "not_reachable"
analyze_workspace = "not_reachable"
defect = ""
owner = ""
note = "No limit or profile input exists; `analyze_workspace` walks every document unbounded. Finite product profiles are #11590's."

[[result_state]]
id = "stale_or_superseded"
analyze_file = "indistinguishable_from_complete"
analyze_workspace = "indistinguishable_from_complete"
defect = "The detector owns one `WorkspaceIndex` snapshot taken at construction, and the returned values carry no generation or version, so a result computed from a stale snapshot is indistinguishable from a current one."
owner = "#10957"
note = "Currentness and result-ID eligibility are #10957's."

[[result_state]]
id = "product_failure"
analyze_file = "represented_lossy"
analyze_workspace = "indistinguishable_from_clean_empty"
defect = "`analyze_workspace` drops the error entirely. `analyze_file` reports one, but as an untyped `String` with no typed reason."
owner = "#10935"
note = ""

[[result_state]]
id = "instrument_failure"
analyze_file = "represented_lossy"
analyze_workspace = "indistinguishable_from_clean_empty"
defect = "Nothing separates an instrument failure from a product failure: both arrive as the same untyped `String` from `analyze_file`, and as silence from `analyze_workspace`."
owner = "#10935"
note = "Missing instrument evidence must not read as zero findings; today it does."

[[result_state]]
id = "complete_semantics_bounded_view"
analyze_file = "not_reachable"
analyze_workspace = "not_reachable"
defect = ""
owner = ""
note = "No truncation or bounded-view mechanism exists; output is unbounded. Bounded views are #10935's."

[[result_state]]
id = "incomplete_semantic_computation"
analyze_file = "indistinguishable_from_complete"
analyze_workspace = "indistinguishable_from_complete"
defect = "An incomplete computation returns the same shape as a complete one. This is the collapse the programme forbids: a consumer cannot refuse an incomplete result because it cannot see that it is incomplete."
owner = "#10935"
note = "Complete bounded view and incomplete semantics must stay distinct; this surface distinguishes neither."

