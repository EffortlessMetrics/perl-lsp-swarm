lossiness = "Reads the indexed document text and scans it line by line; it never parses. Its `Err` is an untyped `String`, so a missing document, a URI conversion failure and a genuine analysis failure are indistinguishable, as are product and instrument failures. A successful return is silently local-only: nothing in the value says the workspace tier was not consulted."
removal_condition = "Superseded by the typed local flow summaries landed under #8118."
fixtures = ["dcapi-import-export-never-produced", "dcapi-result-shape-cannot-represent-failure"]

[[item]]
id = "DeadCodeDetector::analyze_workspace"
kind = "method"
semantic_class = "workspace_liveness"
disposition = "typed_replacement"
producer = "produced"
proof_ceiling = "index_reference_count"
replacement_owner = "#10935"
edit_authority = "none"
lossiness = "Discards every per-file `analyze_file` error, so a file that failed to analyse contributes exactly what a clean file contributes: nothing. It walks every document with no limit, deadline or cancellation, and returns a value that cannot report a partial or terminal outcome. Its unused-symbol half is an index reference count, not reachability."
removal_condition = "Replaced by the bounded workspace queries owned by #10935 under the operation contract #11553; production selection moves under #9763."
fixtures = ["dcapi-import-export-never-produced", "dcapi-entry-point-is-inert", "dcapi-confidence-is-a-constant", "dcapi-result-shape-cannot-represent-failure"]

