
# Disposition ledger for the bounded `perl_parser::dead_code` compatibility
# surface (#9777, C00 under the #8062 reachability programme).
#
# This ledger is the canonical record. `docs/project/status/dead_code_api_ledger.md`
# is a projection of it and is not hand-edited; `cargo xtask check-dead-code-api-ledger`
# fails when the two disagree, when the ledger disagrees with the module source or
# the public-API baseline, or when a declared claim has no bound fixture.
#
# What this ledger is NOT: it is not a specification of desired behavior, not an
# implementation plan, and not authority to change analysis. It records, item by
# item, what the surface does today, what it cannot represent, which authority
# owns the replacement, and what must be true before an item may move.

schema_version = 1
policy = "policy/dead-code-api-ledger.toml"
human_ledger = "docs/project/status/dead_code_api_ledger.md"
module_source = "crates/perl-parser/src/dead_code/mod.rs"
public_api_baseline = ".ci/public-api-baselines/perl-parser.txt"
compat_corpus = "crates/perl-parser/tests/dead_code_api_compat.rs"
canonical_path = "perl_parser::dead_code"
controlling_issue = "#9777"
compatibility_controller = "#8135"

# --------------------------------------------------------------------------
# Closed vocabularies. The validator rejects any value outside these sets, so
# a new state cannot be introduced by prose alone.
# --------------------------------------------------------------------------

semantic_classes = [
  "local_cfg",
  "workspace_liveness",
  "configuration",
  "presentation_report",
  "compatibility_heuristic",
  "obsolete",
]

dispositions = [
  "retain_projection",
  "typed_replacement",
  "deprecate",
  "remove",
  "internalize",
]

# Whether any current code path constructs or consults this item.
#   produced       — a current producer constructs it
#   never_produced — advertised by the type/serde surface, constructed by nothing
#   inert          — accepted and stored, but never read by any code path
#   structural     — a container/definition that is not itself produced
producer_states = ["produced", "never_produced", "inert", "structural"]

# The strongest proposition an item's value can support. `none` means the value
# carries no proof at all and may not be read as evidence of anything.
proof_ceilings = ["index_reference_count", "heuristic_text_scan", "none"]

# How a result state is representable through this surface.
representations = [
  "represented",
  "represented_lossy",
  "indistinguishable_from_complete",
  "indistinguishable_from_clean_empty",
  "not_reachable",
]

# Representations that mean a real state is being hidden. A result-state row
# using one of these must name a defect and an owner; the validator enforces it.
defect_representations = [
  "indistinguishable_from_complete",
  "indistinguishable_from_clean_empty",
]

consumer_classes = ["production", "test", "reexport", "dormant", "independent_implementation"]

# Paths that name the surface because they *govern* it rather than consume it:
# the subject module itself and this ledger's own tooling. They are listed here,
# in the ledger, rather than hidden in the checker, so the exemption is
# reviewable and cannot quietly grow to cover a real consumer.
governance_paths = [
  "crates/perl-parser/src/dead_code/mod.rs",
  "xtask/src/tasks/dead_code_api_ledger.rs",
  "xtask/src/main.rs",
]

# --------------------------------------------------------------------------
# Governing laws, restated here because the validator enforces each one and the
# error messages point back at these names.
# --------------------------------------------------------------------------
#
#   L1  every public item in the module source has exactly one row, and every
#       row names a public item that exists
#   L2  every `perl_parser::dead_code` declaration in the public-API baseline is
#       covered by a row
#   L3  a `never_produced` item may not be dispositioned as if it worked, and
#       must carry a negative-control fixture
#   L4  no item carries edit authority; `edit_authority` is `none` everywhere
#   L5  all twelve result states are dispositioned, and every collapse is
#       recorded as a defect with an owner
#   L6  the entry-point API is recorded as inert and as non-root-identity
#   L7  the declared consumer inventory matches the tree; no undeclared
#       production consumer may appear
#   L8  the Markdown projection agrees with this file
#   L9  every fixture a row cites exists in the compatibility corpus
#   L10 every fixture in the corpus is cited by at least one row

# --------------------------------------------------------------------------
# Export paths. Three public paths reach one module; the module is dispositioned
# once and the other two are projections, not separate authorities.
# --------------------------------------------------------------------------

[[export_path]]
path = "perl_parser::dead_code"
role = "canonical"
declared_at = "crates/perl-parser/src/lib.rs"
note = "Gated `#[cfg(not(target_arch = \"wasm32\"))]`; absent on wasm32."

[[export_path]]
path = "perl_parser::dead_code_detector"
role = "compatibility_alias"
declared_at = "crates/perl-parser/src/lib.rs"
note = "Backwards-compatibility alias. `crates/perl-parser/src/compat.rs` re-exports the same alias."

[[export_path]]
path = "perl_parser::prelude"
role = "prelude_reexport"
declared_at = "crates/perl-parser/src/prelude.rs"
note = "Re-exports the five public types, not the two free/associated functions."

# --------------------------------------------------------------------------
# Item dispositions.
# --------------------------------------------------------------------------

