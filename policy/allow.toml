schema_version = "0.1"
policy = "cargo-allow"
owner = "core/maintainers"
status = "active"

[workspace]
root = "."
inventory = "git-tracked"
default_mode = "no-new"
ignored = [
  ".git/**",
  "target/**",
  # Workspace exclusions per CLAUDE.md
  "archive/**",          # archived/legacy crates — not governed production code
  "tree-sitter-perl/**", # legacy C tree-sitter grammar, not Rust production code
  "fuzz/**",             # fuzz build infrastructure and fuzz corpus data
  "test_corpus/**",      # Perl test corpus — .pm/.pl files; not production Rust source
  # Generated / vendor
  "vendor/**",
  "**/*.snap",           # insta snapshot files — generated test artifacts
]

[requirements]
owner_required = true
reason_required = true
classification_required = true
evidence_required = false
expires_or_review_after_required = true
allow_bare_allow_attributes = false
stale_entries_fail = false

[requirements.unsafe]
evidence_required = true
safety_comment_required = false

# ===========================================================================
# BASELINE LEDGER — Phase 1: no-new-debt floor (2026-06-22)
#
# All entries below are baseline_debt receipts. They establish the ratchet
# floor so new unreceipted exceptions fail CI. They are NOT approvals.
# owner = "unowned" is the baseline_debt convention per cargo-allow policy.
# expires within 120 days of creation (2026-10-20).
#
# Close debt by: fixing the exception, narrowing the selector, adding typed
# evidence, or deleting stale entries. See cargo-allow docs.
#
# After promotion: replace owner="unowned" with the responsible owner and
# change classification from baseline_debt to the reviewed classification.
# ===========================================================================

# ---------------------------------------------------------------------------
# 1. Test-file panic macros (assert!, assert_eq!, assert_ne!, panic! in tests)
#
# These dominate the count. Tests use panicking assertions by Rust convention.
# CLAUDE.md permits panics in test code.
# ---------------------------------------------------------------------------

[[allow]]
id = "allow-b0001"
kind = "panic"
family = "panic_macro"
glob = "crates/*/tests/**/*.rs"
owner = "unowned"
classification = "baseline_debt"
reason = "Test-file panic macros (assert!, assert_eq!, assert_ne!, unwrap_or_else panic) are Rust test convention. CLAUDE.md permits panics in tests. Baseline floor; tighten per-crate as debt is reviewed."
evidence = ["legacy-policy:no-panic-baseline"]
created = "2026-06-22"
expires = "2026-10-20"

[allow.selector]
ast_kind = "macro_call"
glob = "crates/*/tests/**/*.rs"

[[allow]]
id = "allow-b0003"
kind = "panic"
family = "panic_macro"
glob = "xtask/**/*.rs"
owner = "unowned"
classification = "baseline_debt"
reason = "xtask build/dev tooling panic macros (assert!, assert_eq! in xtask tests and tasks). xtask is internal build infrastructure, not published library code."
evidence = ["legacy-policy:no-panic-baseline"]
created = "2026-06-22"
expires = "2026-10-20"

[allow.selector]
ast_kind = "macro_call"
glob = "xtask/**/*.rs"

