# Machine-readable client-support claim authority.
#
# A setup document is not a real-client receipt. A synthetic capability profile
# is not an editor launch. Rows remain at their earned tier until the exact
# evidence required by issue #6739 exists and is current.

[meta]
schema = "lsp-client-support.v1"
source_document = "docs/how-to/EDITOR_SETUP.md"
owner_issue = 6739
allowed_tiers = [
  "packaged_product_proven",
  "real_generic_client_proven",
  "protocol_profile_proven",
  "configuration_documented",
  "bridge_or_plugin_dependency",
  "not_proven_unsupported",
]
allowed_evidence_kinds = [
  "documentation",
  "protocol_profile",
  "actual_client",
  "packaged_product",
]

