# ub-review advisory config for perl-lsp-swarm.
#
# This file configures the ub-review evidence packet for this repo.
# It is passed to the action via `config: policy/ub-review.toml`.
#
# Status: advisory — see docs/ci/review-gates.md and #3653.
# The action may produce findings or NOT_PROVEN evidence, but it is not a
# merge-required authority.

# Use the bun-ub profile as the closest available preset for Rust repos while
# retaining the perl-lsp-specific lanes below. The runtime profile is the local
# proof-enabled extension: the old gh-runner selection declared focused proof
# requirements but leased zero focused-build work, so the proof broker could
# never execute them.
review_profile = "bun-ub-v0"
profile = "gh-runner-proof"

[repo]
kind = "rust"
base = "origin/main"
head = "HEAD"

[review]
# The workflow posts on opened/reopened/ready_for_review and does not trigger a
# new full semantic review on every synchronize push.
posting_engine = "review"
ban_standalone_approval = false

# Actionable summary-only findings are reviewer value and must reach the PR;
# lane/status boilerplate remains artifact-only.
[review_body]
include_successful_lane_table = false
include_provider_table = "on_failure"
include_sensor_table = "on_failure"
include_execution_summary = "none"
summary_only_body = "post_substantive"

# Core sensors remain advisory. Missing/failed optional sensors reduce evidence
# coverage and are surfaced by the workflow truth receipt rather than being
# silently converted into a clean result.
[tools.tokmd]
enabled = true
required = false

[tools.cargo-allow]
enabled = true
required = false

# Standalone ripr+ is already a required, maintained PR gate in this repo. The
# bundled ub-review copy was both duplicate and historically schema-broken, so
# it is not a second authority here.
[tools.ripr]
enabled = false
required = false

[tools.unsafe-review]
enabled = true
required = false

[tools.ast-grep]
enabled = true
required = false

[tools.actionlint]
enabled = true
required = false

# Heavy witnesses stay off for the advisory lane. Focused proof is leased by
# gh-runner-proof below; broad workspace tests remain selected evidence rather
# than a default 900-second sensor tax.
[tools.coverage]
enabled = false

# perl-lsp-v0 lanes: tuned to the actual risk surfaces of this repo.
[[lanes]]
id = "tests-oracle"
role = "Test oracle strength and focused-test discrimination"
focus = "Check whether tests for changed code actually discriminate the patch. Identify the smallest focused test that would prove or refute the claim."

[[lanes]]
id = "source-route"
role = "Source routes from changed code to unchanged callers"
focus = "Trace source routes from each changed function to its callers including cross-crate boundaries. Identify broken callers or missing route updates."

[[lanes]]
id = "workspace-state"
role = "Workspace index lifecycle and incremental state"
focus = "Review workspace/index lifecycle, incremental state updates, file-watching triggers, and cache invalidation. Are there stale-state bugs or missing invalidation?"

[[lanes]]
id = "parser-edge-cases"
role = "Perl syntax edge cases and parser correctness"
focus = "Check parser behavior on edge cases: nested data structures, special variables, regex, heredocs. Does the change handle them correctly?"

[[lanes]]
id = "diagnostics-truth"
role = "Diagnostics accuracy"
focus = "Verify diagnostics accuracy. Are there false positives, false negatives, or missing diagnostics for common error patterns?"

[[lanes]]
id = "lsp-protocol-contract"
role = "LSP protocol compliance"
focus = "Check LSP protocol compliance: request/response pairing, cancellation, capability negotiation, transport lifecycle."

[[lanes]]
id = "opposition"
role = "Strongest substantiated objection"
focus = "Find the strongest objection grounded in code, tests, or protocol behavior. If none, state what you checked and residual risk."

[[lanes]]
id = "spec-honesty"
role = "Doc and spec honesty"
focus = "Check whether PR body, commits, docs, and specs accurately describe what the code does. Flag overclaims or stale docs."

[providers]
policy = "minimax-only"

[providers.minimax]
enabled = true
env = "MINIMAX_API_KEY"
model = "MiniMax-M3"
role = "primary"
prompt_cache = "explicit-anthropic"
max_concurrency = 6

[providers.opencode]
enabled = true
env = "OPENCODE"
role = "fallback"

# One bounded proof request. The proof-enabled runtime profile below gives the
# broker one focused-build lease; a missing or timed-out result remains visible
# evidence loss rather than being described as a clean review.
[[proof.required]]
command = "cargo check --package perl-core-test-runner --locked"
reason = "Focused build check for perl-core-test-runner crate."
cost = "focused-build"
timeout_sec = 180

[profiles.gh-runner-proof]
extends = "gh-runner"

[profiles.gh-runner-proof.budgets]
proof_max_focused_tests = 1
proof_command_timeout_sec = 120
proof_total_timeout_sec = 180