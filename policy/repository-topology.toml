# Canonical repository/package ownership authority for the repository-split programme.
#
# Controller: #7370 (repository topology + boundary checker)
# Programme:  #7369 (externalize parsers, prepare parser/LSP/corpus boundaries)
# This file:  #7675 (schema + seeded current ownership state)
#
# SCOPE. This is the DATA authority only. Static Cargo/dependency/metadata enforcement
# is #7683, package-isolation execution is #7688, and CI routing plus state promotion
# is #7695. Nothing here moves source or changes a dependency.
#
# SINGLE OWNERSHIP AUTHORITY. Package rows below are the only place a package is bound
# to a repository. Repository rows deliberately do NOT restate their owned packages, so
# ownership cannot disagree with itself. The generated projection renders per-repository
# ownership from these rows (see docs/architecture/repository-topology.md).
#
# CURRENT VS FUTURE. `current_owner` is a fact: every package listed here is still source
# in this repository, because no package has been externalized yet. `future_owner` is
# recorded only where a maintainer ruling exists. Everything still under review carries
# placement = "pending" with the owning issue and the exact open question, rather than a
# false final answer.
#
# CLOSED VS OPEN VOCABULARIES. Every classification field here is a closed set,
# validated at parse time: `role`, `history_transfer`, `placement`,
# `publish_disposition`, `metadata_authority`, and `excluded_trees.kind` are
# rejected outright if the value is not a recognised member. Adding a role or a
# transfer policy is therefore a code change in
# `xtask/src/tasks/repository_topology.rs`, on purpose — a new repository role is
# a governance decision that should be reviewed, not a string someone can coin in
# passing. The two genuinely open fields are `migration_state` and
# `current_integration_mode`, and neither is free text either: both are checked
# against the `[[migration_states]]` vocabulary declared below in this file, so
# they can be extended here without touching code.

schema_version = "repository_topology.v1"

# ---------------------------------------------------------------------------
# Migration states and the integration modes each state permits.
# ---------------------------------------------------------------------------

[[migration_states]]
state = "embedded"
description = "Source lives in this repository and no extraction work has started."
legal_integration_modes = ["workspace_path"]
allows_embedded_workspace_source = true
requires_immutable_consumption = false
accepts_future_packages = true

[[migration_states]]
state = "preparing"
description = "Extraction is being prepared. Source remains a workspace member and may stay a workspace path while isolation proof is red."
legal_integration_modes = ["workspace_path"]
allows_embedded_workspace_source = true
requires_immutable_consumption = false
accepts_future_packages = true

[[migration_states]]
state = "extracting"
description = "History and source are being transferred. A temporary exact Git bridge is permitted alongside the workspace path."
legal_integration_modes = ["workspace_path", "exact_git_bridge"]
allows_embedded_workspace_source = true
requires_immutable_consumption = false
accepts_future_packages = true

[[migration_states]]
state = "externalizing"
description = "Source ownership has moved out. Consumption is an immutable exact Git bridge or a released version; the bridge requires an owner and exit condition."
legal_integration_modes = ["exact_git_bridge", "released_registry"]
allows_embedded_workspace_source = false
requires_immutable_consumption = true
accepts_future_packages = true

[[migration_states]]
state = "external"
description = "The repository owns its source independently and is consumed as an immutable dependency. Embedded workspace source is not permitted."
legal_integration_modes = ["released_registry", "exact_git_bridge"]
allows_embedded_workspace_source = false
requires_immutable_consumption = true
accepts_future_packages = true

[[migration_states]]
state = "retired"
description = "No longer consumed by this repository."
legal_integration_modes = ["none", "repository_local_only"]
allows_embedded_workspace_source = false
requires_immutable_consumption = false
accepts_future_packages = false

