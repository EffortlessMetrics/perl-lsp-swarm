[[owner]]
prefix = "crates/perl-workspace/tests"
role = "explicit workspace fixture"
owner = "perl-workspace test fixtures"
successor = "index_initial_file or index_initial_files_batch"
removal_condition = "fixture is migrated when its test seam is next edited"

[[owner]]
prefix = "crates/perl-workspace/src"
role = "workspace implementation/profile fixture"
owner = "perl-workspace"
successor = "index_initial_file or index_initial_files_batch"
removal_condition = "initial profile and internal tests use canonical initial names"

[[owner]]
prefix = "crates/perl-workspace/benches"
role = "workspace benchmark fixture"
owner = "perl-workspace benchmark owner"
successor = "index_initial_file or index_initial_files_batch"
removal_condition = "benchmark contract is next revised"

[[owner]]
prefix = "crates/perl-parser"
role = "parser/refactor fixture or file-operation path"
owner = "perl-parser refactor authority"
successor = "initial API for fixtures; live API when file-operation currentness is settled"
removal_condition = "owning refactor/file-operation claim defines its source commit authority"

[[owner]]
prefix = "crates/perl-lsp-rs"
role = "LSP/provider or explicit test fixture"
owner = "perl-lsp-rs caller owner"
successor = "initial API for fixtures; live API for provider-owned currentness"
removal_condition = "owning lifecycle/provider claim defines the successor contract"

[[owner]]
prefix = "crates/perl-lsp-rs-core"
role = "provider shadow or explicit test fixture"
owner = "perl-lsp-rs-core provider owner"
successor = "initial API for fixtures; live API for provider-owned currentness"
removal_condition = "provider semantics claim supplies a non-zero source commit guard"

[[owner]]
prefix = "crates/perl-semantic-analyzer"
role = "semantic analyzer fixture"
owner = "perl-semantic-analyzer"
successor = "index_initial_file_str for fixture setup"
removal_condition = "fixture-only setup is migrated with the next semantic test edit"

[[owner]]
prefix = "xtask"
role = "repository validation and scorecard fixture"
owner = "xtask task owner"
successor = "index_initial_file_str for fixture setup"
removal_condition = "task fixture is migrated when its validation contract is next revised"
