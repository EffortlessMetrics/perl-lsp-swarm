[[owner]]
prefix = "crates/perl-lsp-rs/src/runtime/text_sync/lifecycle.rs"
# Since #11305 this file holds ZERO compatibility calls: the didSave
# reconciliation branches commit through index_live_file behind the
# document-instance/generation oracle, and the close-handoff reload below is
# the explicit initial-import role. This row remains only because lifecycle.rs
# still counts as a canonical caller file needing an owner anchor.
role = "#8041 close-handoff disk reload residual (canonical index_initial_file today)"
owner = "perl-lsp-rs text synchronization / #8041 open-buffer authority"
successor = "index_live_file when #8041 defines the closed-file source commit identity"
removal_condition = "#8041 lands its closed-file live commit identity"

