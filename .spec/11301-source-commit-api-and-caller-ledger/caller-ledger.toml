canonical_live_api = "index_live_file"
compatibility_apis = ["index_file", "index_file_str", "index_file_with_generation", "index_files_batch"]
compatibility_baseline = 689

# Live identity is the URI argument plus an owner-supplied non-zero NonZeroU32
# generation. #11305 migrated didOpen/didSave to index_live_file behind the
# text-sync currentness oracle; its former owner row is removed and the
# validator now bans compatibility APIs from text-sync handler files outright.
# Exact source paths are the ledger identity. A new caller must be deliberately
# added with an owner, role, successor, and removal condition; broad directory
# globs are intentionally not accepted by the validator.
