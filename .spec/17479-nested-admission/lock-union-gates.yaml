# Manual unactivated qualification; canonical gate policy is unchanged.
schema_version: 1
global:
  default_timeout_seconds: 3600
tiers:
  merge_gate:
    description: One lock-union fixture and exact owning test
    target_duration_seconds: 3600
    enforcement: required
gates:
  - name: lock_union_direct
    tier: merge_gate
    description: Four current borrowed-guard warnings with successful instrument
    required: true
    command: python3 -I scripts/ci/lock_union_prepare.py --direct
    timeout_seconds: 3600
    retry_count: 0
    tags: [compiler-fixture, narrow-qualification]
  - name: lock_union_owning
    tier: merge_gate
    description: Exact owning borrowed-guard union test
    required: true
    command: python3 -I scripts/ci/lock_union_prepare.py --test
    timeout_seconds: 3600
    retry_count: 0
    tags: [test, compiler-fixture, narrow-qualification]
  - name: lock_union_control
    tier: merge_gate
    description: Exact repaired preparation control on the same warm harness
    required: true
    command: python3 -I scripts/ci/lock_union_prepare.py --control
    timeout_seconds: 3600
    retry_count: 0
    tags: [test, narrow-qualification]
