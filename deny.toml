# cargo-deny configuration for perl-lsp
# https://embarkstudios.github.io/cargo-deny/
#
# Run: cargo deny check
# Lint levels: deny | warn | allow

# -- Dependency graph ----------------------------------------------------------

[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

# -- Advisories ----------------------------------------------------------------
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html

[advisories]
ignore = [
]

# -- Licenses ------------------------------------------------------------------
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# Ignore unpublished workspace crates -- they are internal
ignore = true
registries = []

# -- Bans ----------------------------------------------------------------------
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

# Known duplicate crates caused by transitive dependency version splits.
# These are expected and tracked for eventual deduplication when upstreams unify.
skip = [
    # bitflags 1.x pulled by fluent-uri (via lsp-types); 2.x used everywhere else
    { crate = "bitflags@1.3.2", reason = "fluent-uri (lsp-types transitive) pins bitflags 1.x" },

    # windows-sys ecosystem: three-way split across 0.52/0.60/0.61.
    # 0.52: ring/rustix/tempfile and older platform crates; 0.60: notify,
    # shared_child, stacker; 0.61: console, mio, tokio.
    { crate = "windows-sys@0.52.0", reason = "ring/rustix/tempfile and older platform transitives pin 0.52" },
    { crate = "windows-sys@0.60.2", reason = "notify/shared_child transitives pin 0.60" },
    { crate = "windows-targets@0.52.6", reason = "older windows-sys 0.52 transitive platform tree" },

    # rand ecosystem: 0.9 vs 0.10 split during major version transition
    { crate = "rand@0.9.4", reason = "proptest transitives remain on rand 0.9 during rand 0.9 -> 0.10 migration" },
    { crate = "rand_core@0.9.5", reason = "transitive dep version split during rand_core 0.9 -> 0.10 migration" },
    { crate = "getrandom@0.2.17", reason = "ring/rustls transitives remain on getrandom 0.2" },
    { crate = "getrandom@0.3.4", reason = "older getrandom pulled by rand 0.9 transitives" },

    # r-efi: 5.x vs 6.x split (platform-specific, UEFI target only)
    { crate = "r-efi@5.3.0", reason = "transitive dep version split, UEFI platform crate" },

    # Build and proc-macro toolchains retain older transitive versions.
    { crate = "shlex@1.3.0", reason = "bindgen 0.72 transitively pins shlex 1.x while cc uses 2.x" },
    { crate = "syn@3.0.2", reason = "thiserror 2 transitively pins syn 3 while workspace proc macros use syn 2" },
    { crate = "wit-bindgen@0.51.0", reason = "wasip3 transitively pins the older WIT bindings release" },
]

# Windows platform crate duplicates: windows-sys has a 0.52/0.60/0.61 three-way
# split across transitive deps (console, stacker, notify, shared_child, clap).
# Skip the older windows-targets tree to suppress all associated windows_*
# platform crate duplicates (0.52.x).
skip-tree = [
    { crate = "windows-targets@0.52.6", reason = "skip all windows_*@0.52.x platform crates under old windows-targets" },
]

# -- Sources -------------------------------------------------------------------
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html

[sources]
# All dependencies must come from crates.io. Unknown registries or git sources
# are denied to prevent supply chain attacks via source confusion.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
