# cargo-deny configuration for perl-lsp
# https://embarkstudios.github.io/cargo-deny/
#
# Run: cargo deny check
# Lint levels: deny | warn | allow

# -- Dependency graph ----------------------------------------------------------

[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

# -- Advisories ----------------------------------------------------------------
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html

[advisories]
ignore = [
]

# -- Licenses ------------------------------------------------------------------
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# Ignore unpublished workspace crates -- they are internal
ignore = true
registries = []

# -- Bans ----------------------------------------------------------------------
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

# Known duplicate crates caused by transitive dependency version splits.
# Each entry is justified from the current Cargo.lock dependency graph (verified
# via `cargo tree --target all -i <crate>@<version>`). These are expected and
# tracked for eventual deduplication when upstreams unify.
skip = [
    # bitflags: 1.x vs 2.x. fluent-uri (via lsp-types) pins bitflags 1.x; 2.x is
    # used everywhere else. Upstream lsp-types would need to upgrade fluent-uri.
    { crate = "bitflags@1.3.2", reason = "fluent-uri (lsp-types transitive) pins bitflags 1.x" },

    # windows-sys: three-way split across 0.52/0.60/0.61 (Windows-only).
    # 0.52.0 — ring 0.17 (rustls/ureq TLS) pins the old windows-sys 0.52.
    # 0.60.2 — notify and shared_child (duct) pin 0.60.
    # 0.61.2 — clap/anstyle, console, tokio/mio, errno/rustix (the current mainstream).
    { crate = "windows-sys@0.52.0", reason = "ring 0.17 (rustls/ureq TLS) pins old windows-sys 0.52" },
    { crate = "windows-sys@0.60.2", reason = "notify/shared_child (duct) transitives pin 0.60" },
    { crate = "windows-targets@0.52.6", reason = "older windows-sys 0.52 transitive (ring 0.17 tree)" },

    # getrandom: three-way split across 0.2/0.3/0.4.
    # 0.2.17 — ring 0.17 (TLS) pins getrandom 0.2.x.
    # 0.3.4  — rand_core 0.9.x (proptest's rand 0.9) and wasip2 (wit-bindgen 0.57) pin 0.3.x.
    # 0.4.2  — rand 0.10 (perl-corpus), tempfile, uuid, and wasip3 (wit-bindgen 0.51) use 0.4.x.
    { crate = "getrandom@0.2.17", reason = "ring 0.17 (rustls/ureq TLS) pins getrandom 0.2.x" },
    { crate = "getrandom@0.3.4", reason = "rand_core 0.9.x (proptest rand 0.9) and wasip2 pin getrandom 0.3.x" },

    # rand: 0.9 vs 0.10 split during major version transition.
    # 0.9.4 — proptest pins rand 0.9.x. 0.10.2 — perl-corpus uses rand 0.10.
    { crate = "rand@0.9.4", reason = "proptest pins rand 0.9.x; perl-corpus uses rand 0.10" },
    { crate = "rand_core@0.9.5", reason = "proptest's rand 0.9 pins rand_core 0.9.x; rand 0.10 uses 0.10" },

    # r-efi: 5.x vs 6.x split (platform-specific, UEFI target only).
    # 5.3.0 — getrandom 0.3.x (rand 0.9 tree) pulls r-efi 5.x. 6.0.0 — getrandom 0.4.x tree uses 6.x.
    { crate = "r-efi@5.3.0", reason = "getrandom 0.3.x (rand 0.9 tree) pulls r-efi 5.x; 0.4.x tree uses 6.x" },

    # shlex: 1.x vs 2.x split.
    # 1.3.0 — bindgen 0.72 (xtask codegen) pins shlex 1.x. 2.0.1 — cc 1.x (build scripts) uses 2.x.
    { crate = "shlex@1.3.0", reason = "bindgen 0.72 (xtask) pins shlex 1.x; cc 1.x build scripts use 2.x" },

    # wit-bindgen: 0.51 vs 0.57 split (WASI component model).
    # 0.51.0 — wasip3 (getrandom 0.4 tree) pins wit-bindgen 0.51. 0.57.1 — wasip2 (getrandom 0.3 tree) uses 0.57.
    { crate = "wit-bindgen@0.51.0", reason = "wasip3 (getrandom 0.4 tree) pins wit-bindgen 0.51; wasip2 uses 0.57" },
]

# Windows platform crate duplicates: windows-sys 0.52 (ring 0.17 tree) pulls in
# windows-targets 0.52.x, whose subtree includes many windows_* platform crates.
# Skip the older 0.52.x tree to suppress all associated platform crate duplicates
# without affecting the current 0.53.x tree used by windows-sys 0.60/0.61.
skip-tree = [
    { crate = "windows-targets@0.52.6", reason = "skip all windows_*@0.52.x platform crates under old windows-targets" },
]

# -- Sources -------------------------------------------------------------------
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html

[sources]
# All dependencies must come from crates.io. Unknown registries or git sources
# are denied to prevent supply chain attacks via source confusion.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
