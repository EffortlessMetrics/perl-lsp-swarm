[package]
name = "perl-tidy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Native Rust Perl formatter with source-bound byte edit plans"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-tidy"
keywords = ["perl", "formatter", "formatting", "native"]
categories = ["development-tools"]
publish = true

[dependencies]
perl-parser-core = { workspace = true }
perl-source-identity = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
perl-tdd-support = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "native_pipeline_benchmark"
harness = false

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
