[package]
name = "perl-lsp-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Perl Language Server (LSP) — Tree-sitter-compatible with comprehensive IDE features"
readme = "README.md"
documentation = "https://docs.rs/perl-lsp-rs"
keywords = ["perl", "lsp", "language-server", "ide", "tree-sitter"]
categories = ["development-tools", "text-editors"]
include = [
  "src/**",
  "build.rs",
  "features_sot.toml",
  "Cargo.toml",
  "README.md",
  "LICENSE*"
]

[lib]
name = "perl_lsp"
path = "src/lib.rs"

[dependencies]
perl-dap = { workspace = true, optional = true }
# perl-incremental-parsing absorbed into perl-parser::incremental (Wave 4-Completion)
perl-parser = { workspace = true }
# (perl-lsp-providers absorbed into perl-lsp-rs-core::providers::lsp_compat — Wave G1b)
# (perl-lsp-formatting absorbed into perl-lsp-rs-core::providers::formatting — Wave G1b)
# perl-lsp-uri absorbed into perl-lsp-rs-core::uri (Wave G3 step 3)
# perl-lsp-feature-governance absorbed into perl-lsp-rs-core::governance (Wave G3 step 1)
# perl-lsp-tooling absorbed into perl-lsp-rs-core::tooling (Wave G3 step 6)
perl-subprocess-runtime = { workspace = true }
# Wave Final PR B: perl-lsp-config absorbed into perl-lsp-rs-core::config; use perl_lsp_rs_core::config::* instead
# perl-lsp-protocol absorbed into perl-lsp-rs-core::protocol (Wave G3 step 2)
# perl-lsp-transport absorbed into perl-lsp-rs-core::transport (Wave G3 step 4)
# (perl-lsp-code-actions absorbed into perl-lsp-rs-core::providers::code_actions — Wave G1b)
# (perl-lsp-inline-completion absorbed into perl-lsp-rs-core::providers::inline_completion — Wave G1b)
# (perl-lsp-ai-provider absorbed into perl-lsp-rs-core::providers::ai — Wave G1b)
# (perl-lsp-completion absorbed into perl-lsp-rs-core::providers::completion — Wave G1b)
# (perl-lsp-diagnostics absorbed into perl-lsp-rs-core::providers::diagnostics — Wave G1b)
perl-diagnostics = { workspace = true }
# (perl-lsp-navigation absorbed into perl-lsp-rs-core::providers::navigation — Wave G1b)
# (perl-lsp-rename absorbed into perl-lsp-rs-core::providers::rename — Wave G1b)
# (perl-lsp-semantic-tokens absorbed into perl-lsp-rs-core::providers::semantic_tokens — Wave G1b)
# Provider crates absorbed into perl-lsp-rs-core (Wave G1a)
# perl-lsp-critic-parser absorbed into perl-lsp-rs-core::critic_parser (Wave G3 step 7)
perl-lsp-rs-core = { workspace = true, default-features = false, features = ["lsp-compat"] }
# perl-lsp-performance absorbed into perl-lsp-rs-core::performance (Wave G3 step 5)
perl-lsp-perltidy = { workspace = true, default-features = false }
perl-position-tracking = { workspace = true, features = ["lsp-compat"] }
perl-semantic-analyzer = { workspace = true }
perl-semantic-facts = { workspace = true }
perl-symbol = { workspace = true }
perl-module = { workspace = true }
perl-pod = { workspace = true }
perl-ripr-facts = { workspace = true, optional = true }
perl-ast = { workspace = true }
perl-parser-core = { workspace = true }
perl-tdd-support = { workspace = true, optional = true }
perl-source-identity.workspace = true
perl-workspace = { workspace = true }
perl-lexer = { workspace = true }
perl-uri = { workspace = true }
lsp-types.workspace = true
serde = { workspace = true }
serde_json.workspace = true
url.workspace = true
anyhow.workspace = true
regex.workspace = true
md5 = "0.8.0"
parking_lot.workspace = true
walkdir.workspace = true
uuid = { version = "1.23.2", features = ["v4"] }

# Core dependencies for position mapping
ropey.workspace = true
tokio = { workspace = true }
tracing.workspace = true
which = "8.0.2"

# Criterion stays out of ordinary focused test builds.
# Enable with --features benchmarks when selecting either bench target.
criterion = { workspace = true, optional = true }

[build-dependencies]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["workspace", "incremental"]  # Enable workspace indexing and incremental parsing by default
# AI inline-completion backend (ureq/rustls/ring TLS stack via core). Opt-in so
# size-capped builds can drop the whole TLS closure; no production channel
# currently admits trusted activation, so this is fail-closed surface today.
ai-provider = ["perl-lsp-rs-core/ai-provider"]
# Embedded DAP interpreter-discovery (perl-dap platform cache). Opt-in so
# size-capped builds can drop the perl-dap library; slim builds fall back to
# configured-path + PATH discovery in runtime::lifecycle::workspace.
dap = ["dep:perl-dap"]
# stderr/file logging (core tracing-subscriber stack). Full builds only.
logging = ["perl-lsp-rs-core/logging"]
# `perllsp ripr-facts` batch CLI (perl-ripr-facts). Full builds only; slim
# builds answer the subcommand with a not-compiled-in error.
ripr-facts = ["dep:perl-ripr-facts"]
# Legacy test execution/discovery (perl-tdd-support TestRunner) behind
# perl/runTest, perl/runTestFile and experimental/testDiscovery. Full builds
# only; slim builds answer METHOD_NOT_FOUND / empty discovery.
legacy-runner = ["dep:perl-tdd-support"]
# TCP socket transport (tokio::net listener in cli.rs). Full builds only;
# slim builds are stdio-only and reject socket mode with an error.
tcp = ["tokio/net"]
# Native perltidy formatting engine (core call sites). Full builds only.
native-formatting = ["perl-lsp-rs-core/native-formatting", "perl-lsp-perltidy/engine"]
workspace = []  # Workspace-wide indexing for cross-file features
incremental = ["perl-parser/incremental"]  # Incremental parsing support (perl-incremental-parsing absorbed into perl-parser)
test-performance = []  # Performance optimizations for test environments
test-fallbacks = []  # Gate LSP_TEST_FALLBACKS env var read behind this feature (issue #4628)
# When enabled, advertise *only* the conservative GA set (for emergency point releases).
lsp-ga-lock = [
  # perl-lsp-protocol/lsp-ga-lock removed — absorbed into perl-lsp-rs-core::protocol (Wave G3 step 2)
  # perl-lsp-feature-governance/lsp-ga-lock removed — absorbed into perl-lsp-rs-core::governance (Wave G3 step 1)
  "perl-lsp-rs-core/lsp-ga-lock",
]
experimental-features = []  # Experimental LSP features for testing
benchmarks = ["dep:criterion"]
stress-tests = []  # Enable stress tests that are too slow for CI

# Aspirational features for tests that should eventually pass
constant-advanced = []  # Advanced constant pragma parsing (hash form, qw form)
qw-variants = []  # Support for all qw delimiter variants
package-qualified = []  # Package-qualified subroutine resolution
error-classifier-v2 = []  # Next generation error classification
lsp-advanced = []  # Advanced LSP features (profiling, git integration, etc.)
expose_lsp_test_api = ["perl-parser/expose_lsp_test_api"]  # Expose test helpers for integration tests
lsp-extras = []  # Quarantined tests for unimplemented/aspirational LSP features
strict-jsonrpc = []  # Strict JSON-RPC 2.0 protocol validation tests
dap-phase3 = []  # DAP non-regression tests; no external runtime implementation is activated
utf16-complete = ["perl-parser/utf16-complete"]  # Complete UTF-16 round-trip support

[dev-dependencies]
perl-tdd-support = { workspace = true }
# Test builds only: turns on the core crate's proof-only native-critic rebuild
# counter (#7286). A production build of `perl-lsp-rs` links core without it.
perl-lsp-rs-core = { workspace = true, default-features = true, features = ["test-instrumentation"] }
assert_cmd = "2.2.2"
chrono = "0.4.43"
unicode-ident = "1.0.22"
insta = { workspace = true, features = ["yaml"] }
predicates = "3.1.3"
serial_test = "4.0.1"
tempfile.workspace = true
proptest.workspace = true
# Wave Final PR B: perl-content-length-framing absorbed into perl-lsp-rs-core::transport::framing
parking_lot.workspace = true
perl-corpus = { workspace = true }
# LSP stdio round-trip bench reuses the UX harness client (spawn + framing +
# event substrate) against the real perllsp binary instead of reinventing it.
perl-lsp-ux-tests.workspace = true
static_assertions.workspace = true
sha2.workspace = true
toml = "1.1.2"
tracing-subscriber = "0.3.22"

# Deliberately no [package.metadata.binstall].
#
# `perl-lsp-rs` is the implementation library behind the public `perllsp`
# product and intentionally publishes no executable target. Users who want the
# language-server command should install `perllsp`, whose release metadata maps
# to the actual cross-platform release assets.

[[bench]]
name = "rope_performance_benchmark"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "lsp_stdio_roundtrip_benchmark"
harness = false
required-features = ["benchmarks"]
