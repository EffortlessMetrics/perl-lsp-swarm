[package]
name = "perl-ripr-facts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Batch exporter for the ripr-perl-facts-v1 packet — deterministic test/oracle/relation/boundary facts over a Perl workspace"
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/perl-ripr-facts"
homepage.workspace = true
keywords = ["perl", "ripr", "facts", "test-oracle", "static-analysis"]
categories = ["development-tools", "development-tools::testing"]
include = ["src/**", "README.md", "LICENSE*", "Cargo.toml"]

[lib]
name = "perl_ripr_facts"
path = "src/lib.rs"

[[bin]]
name = "perl-ripr-facts"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
sha2.workspace = true
# Parser-backed fact extraction (#3293 PR 3). Both are leaf crates with no
# forbidden deps — perl-parser-core parses source and converts byte spans to
# line/column (LineIndex); perl-symbol projects the AST into declaration facts.
# perl-workspace is deliberately NOT used here (it transitively pulls lsp-types).
perl-parser-core.workspace = true
perl-symbol.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dev-dependencies]
perl-tdd-support = { path = "../perl-tdd-support" }
criterion.workspace = true
# Schema-conformance tests validate emitted packets against
# schemas/ripr-perl-facts-v1.schema.json; same pinned helper shape as
# perl-core-harness-types (jsonschema 0.55, no default features).
jsonschema = { version = "0.56", default-features = false }

# `harness = false` is REQUIRED: the nightly "Performance Benchmarks" job
# invokes every bench target with `-- --noplot` (a Criterion-only flag), and
# without an explicit [[bench]] stanza the target falls back to libtest
# autodiscovery (harness = true), which rejects the flag.
[[bench]]
name = "ripr_facts_benchmark"
harness = false
