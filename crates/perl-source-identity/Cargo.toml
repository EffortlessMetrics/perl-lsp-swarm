[package]
name = "perl-source-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Canonical source_identity.v1 core types for the Perl toolchain transport layer"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-source-identity"
readme = "README.md"
keywords = ["perl", "identity", "source", "content-addressable", "lsp"]
categories = ["data-structures", "development-tools"]
publish = true
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE*"]

[lib]
doctest = false

[dependencies]
# serde: stable serialization for all envelope/ID/origin types.
serde = { workspace = true }
# sha2: reviewed collision-resistant digest for durable cross-repository identity.
# The workspace pins sha2 0.11; this crate exposes no sha2 types in its public API.
sha2 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
