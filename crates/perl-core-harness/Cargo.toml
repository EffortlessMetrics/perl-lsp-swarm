[package]
name = "perl-core-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Private orchestration library for upstream Perl core harness receipts"
publish = false

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
color-eyre = "0.6.5"
perl-core-harness-types = { workspace = true }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["fileapi", "handleapi", "winnt"] }

[target.'cfg(unix)'.dependencies]
# Discovery capture isolates the upstream process tree and terminates it as a
# group so descendants cannot hold the captured pipes open past the deadline.
nix = { version = "0.31.3", features = ["signal", "process"] }

[dev-dependencies]
perl-tdd-support = { workspace = true }

[lints]
workspace = true
