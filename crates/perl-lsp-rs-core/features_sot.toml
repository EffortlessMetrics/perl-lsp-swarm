[meta]
version = "0.17.0"
lsp_version = "3.18"

# Minimum evidence per feature class before `proven` is allowed (#7029).
# The policy does not require the missing tests to exist yet; executable
# evidence validation belongs to the follow-up #6731 gate.

[[evidence_policy]]
class = "request_response"
min_behavior_tests = 1
description = "Proven requires at least one cited behavior test asserting the request/response surface; capability-gated rows additionally keep their gate receipts in the lsp-318-claim-guard seam."

[[evidence_policy]]
class = "server_request"
min_behavior_tests = 1
description = "Proven requires a positive wire receipt; client-capability-gated server requests additionally require a negative gate receipt."

[[evidence_policy]]
class = "document_workspace"
min_behavior_tests = 1
description = "Proven requires a behavior test of the notification effect (document state, configuration, or file-event handling), not mere protocol tolerance."

[[evidence_policy]]
class = "cancellation_progress"
min_behavior_tests = 1
description = "Proven requires a behavior test observing the cancellation or progress effect, not mere protocol tolerance."

[[evidence_policy]]
class = "editor_dependent"
min_behavior_tests = 1
description = "Proven additionally requires an editor receipt; without one the row stays preview or not_proven."

