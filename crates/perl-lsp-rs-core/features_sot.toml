# LSP/DAP Feature & Evidence Catalog - AUTHORITY
#
# Single human-edited authority for feature identity, claim maturity, and
# evidence ownership (#7029). Crate-local `features_sot.toml` files are
# DETERMINISTIC GENERATED PROJECTIONS of this file
# (cargo xtask features regen-vendored); never edit them by hand. Generated Rust modules and
# fenced Markdown blocks also derive from this file.
#
# Maturity is an EARNED-CLAIM label, independent of the `advertised` runtime
# fact: proven requires qualifying evidence plus complete ownership fields
# (validated fail-closed). Rows without them record `not_proven`; later PRs
# earn promotion (#6731 successor work). Advertisement never changes here
# without a matching runtime review.

[meta]
version = "0.17.0"
lsp_version = "3.18"

[[feature]]
id = "lsp.completion"
spec = "LSP 3.0"
area = "text_document"
policy_class = "request_response"
maturity = "proven"
advertised = true
direction = "client_to_server"
capability_gate = "completionProvider"
registration = "static_capabilities"
implementation_owner = "crates/perl-lsp-rs/src/runtime/language/completion.rs"
state_owner = "workspace_index"
tests = [
  "crates/perl-lsp-rs/tests/lsp_completion_tests.rs",
  "crates/perl-lsp-ux-tests/tests/ux_scenario_19_completion_core.rs",
]
evidence = [
  { class = "integration_test", id = "crates/perl-lsp-rs/tests/lsp_completion_tests.rs" },
  { class = "integration_test", id = "crates/perl-lsp-ux-tests/tests/ux_scenario_19_completion_core.rs" },
]
claim_boundary = "Resolve-dependent details require completionItem/resolve client support; snippet choice varies by client."
description = "Code completion with 150+ built-in functions, DBI type inference (db/st handle methods), Moo option-key completion, file-path completion, method completion from workspace symbols, auto-import suggestions, XS API completion, and test helper (Test::More) completions"

