[package]
name = "perl-lsp-rs-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
description = "Implementation core for perl-lsp-rs (Wave F: feature flags, contracts, capability mapping)"
documentation = "https://docs.rs/perl-lsp-rs-core"
readme = "README.md"
keywords = ["perl", "lsp", "features", "contracts", "capabilities"]
categories = ["development-tools", "development-tools::testing"]
include = [
    "src/**",
    "build.rs",
    "build_catalog.rs",
    "features_sot.toml",
    "protocol_schema_source.json",
    "Cargo.toml",
    "README.md",
]

[lib]
doctest = false

[dependencies]
perl-source-identity.workspace = true
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true
# Collision-resistant content digests for observation identity (#10813);
# also the EffectiveLspSurface input-digest receipt binding (#9665).
sha2.workspace = true

# Provider crate dependencies (Wave G1a: 15 providers absorbed)
perl-parser-core.workspace = true
perl-module.workspace = true
perl-position-tracking.workspace = true
perl-semantic-analyzer.workspace = true
perl-semantic-facts.workspace = true
perl-lexer.workspace = true
perl-ast.workspace = true
perl-test-facts.workspace = true
walkdir.workspace = true
regex.workspace = true
url.workspace = true

# Wave G1b additional dependencies (10 medium-risk providers absorbed)
# perl-lsp-tooling absorbed into perl-lsp-rs-core::tooling (Wave G3 step 7)
perl-subprocess-runtime.workspace = true
perl-lsp-perltidy.workspace = true
# perl-lsp-uri absorbed into perl-lsp-rs-core::uri (Wave G3 step 3)
perl-diagnostics.workspace = true
perl-workspace.workspace = true
perl-pragma.workspace = true
perl-symbol.workspace = true
perl-parser.workspace = true
rustc-hash = "2.1.2"
thiserror.workspace = true
toml = "1.1.2"
ureq = { version = "3", features = ["json"], optional = true }
# Wave G3 step 5: perl-lsp-performance absorbed
moka = { version = "0.12", features = ["sync"] }

# Wave G2 runtime crate dependencies (6 runtime crates absorbed)
anyhow.workspace = true
clap = { workspace = true }
# Wave Final PR B: perl-content-length-framing absorbed inline into transport::framing; dep removed
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[build-dependencies]
# Wave Final PR B: feature-catalog absorbed into feature_catalog.rs; build.rs uses inline catalog code
serde = { workspace = true, features = ["derive"] }
toml = "1.1.2"

[features]
default = ["ai-provider"]
lsp-ga-lock = []
lsp-compat = []
# AI completion backend (OpenAI-compatible). Pulls in ureq/rustls/ring.
# Enabled by default; library consumers can disable with --no-default-features
# to drop the TLS stack entirely.
ai-provider = ["dep:ureq"]
# Proof-only instrumentation (native-critic scope/pragma rebuild counter, #7286).
# Off by default so a production build carries neither the counter nor its
# accessors; `perl-lsp-rs` enables it through dev-dependencies so its tests can
# observe the critic stage, which its own `#[cfg(test)]` cannot reach across the
# crate boundary. Same shape as the DAP crate's `test-helpers` feature.
#
# That precedent is named without its crate name deliberately:
# `test_rs_core_has_no_dap_dependency` guards the cycle break by substring, over
# everything above `[dev-dependencies]`, so spelling the crate out even in a
# comment trips it. Leaving the gate exactly as strict is worth the awkward
# phrasing.
test-instrumentation = []

[dev-dependencies]
perl-test-must.workspace = true
perl-tdd-support.workspace = true
sha2.workspace = true
serde_json.workspace = true
perl-lsp-rs.workspace = true
perl-subprocess-runtime.workspace = true
tempfile.workspace = true
insta = { workspace = true, features = ["yaml"] }
proptest.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
