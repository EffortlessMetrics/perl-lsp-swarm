direction = "client_to_server"
capability_gate = "fixture"
registration = "static_capabilities"
implementation_owner = "test fixture (gating coverage only)"
state_owner = "test fixture"
claim_boundary = "Test fixture for feature-gating behavior; not a production claim."
tests = ["crates/perl-lsp-rs-core/src/feature_catalog.rs#checked_in_override_fixtures_parse_and_validate"]
evidence = [{ class = "integration_test", id = "feature_catalog override fixture proof" }]
spec = "3.0"
maturity = "ga"
advertised = true  # Keep enabled
description = "Error and warning diagnostics"

