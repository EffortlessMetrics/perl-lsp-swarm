# Minimal features catalog for negative testing
# This disables some normally advertised features to test gating

[meta]
version = "0.8.5"
lsp_version = "3.18.0"

# Minimal set with some features disabled for testing
[[feature]]
id = "lsp.completion"
area = "textDocument"
policy_class = "request_response"
direction = "client_to_server"
capability_gate = "completionProvider"
registration = "static_capabilities"
implementation_owner = "crates/perl-lsp-rs/src/runtime/language/completion.rs"
state_owner = "workspace_index"
claim_boundary = "Resolve-dependent details require completionItem/resolve client support; snippet choice varies by client."
tests = ["crates/perl-lsp-rs-core/src/feature_catalog.rs#checked_in_override_fixtures_parse_and_validate"]
evidence = [{ class = "integration_test", id = "feature_catalog override fixture proof" }]
spec = "3.0"
maturity = "ga"
advertised = true  # Keep enabled
description = "Code completion"

[[feature]]
id = "lsp.hover"
area = "textDocument"
policy_class = "request_response"
direction = "client_to_server"
capability_gate = "hoverProvider"
registration = "static_capabilities"
implementation_owner = "crates/perl-lsp-rs/src/runtime/language/hover.rs"
state_owner = "document_store"
claim_boundary = "Markdown rendering assumes client markdown support; content is POD/compiler-derived only."
tests = ["crates/perl-lsp-rs-core/src/feature_catalog.rs#checked_in_override_fixtures_parse_and_validate"]
evidence = [{ class = "integration_test", id = "feature_catalog override fixture proof" }]
spec = "3.0"
maturity = "ga"
advertised = false  # DISABLED for testing
description = "Hover information"

[[feature]]
id = "lsp.diagnostics"
area = "textDocument"
