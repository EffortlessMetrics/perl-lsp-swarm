# Test catalog with specific features disabled
# Used to verify that disabled features don't appear in capabilities

[meta]
version = "0.8.5-test"
lsp_version = "3.18.0"

# All the same features but with different advertised states for testing
[[feature]]
id = "lsp.completion"
area = "textDocument"
policy_class = "request_response"
direction = "client_to_server"
capability_gate = "completionProvider"
registration = "static_capabilities"
implementation_owner = "crates/perl-lsp-rs/src/runtime/language/completion.rs"
state_owner = "workspace_index"
claim_boundary = "Resolve-dependent details require completionItem/resolve client support; snippet choice varies by client."
tests = ["crates/perl-lsp-rs-core/src/feature_catalog.rs#checked_in_override_fixtures_parse_and_validate"]
evidence = [{ class = "integration_test", id = "feature_catalog override fixture proof" }]
spec = "3.0"
maturity = "ga"
advertised = true
description = "Code completion"

