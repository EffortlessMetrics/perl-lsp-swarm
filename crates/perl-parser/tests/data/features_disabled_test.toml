[evidence_policy]
request_response     = ["integration_test"]
document_sync        = ["protocol_lifecycle_test", "integration_test"]
server_request       = ["integration_test", "protocol_lifecycle_test"]
workspace            = ["integration_test"]
cancellation_progress= ["integration_test", "protocol_lifecycle_test"]
editor_dependent     = ["integration_test"]   # additionally requires a limitations note naming the editor dependency
protocol_lifecycle   = ["protocol_lifecycle_test", "integration_test"]
debug_adapter        = ["integration_test"]
experimental_extension = ["integration_test"]

[evidence_classes]
integration_test          = "qualifying"
protocol_lifecycle_test   = "qualifying"
unit_test                 = "non_qualifying_supporting_only"
source_presence           = "non_qualifying"
helper_presence           = "non_qualifying"
method_count              = "non_qualifying"
declaration_only          = "non_qualifying"
