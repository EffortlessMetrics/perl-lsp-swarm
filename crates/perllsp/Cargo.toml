[package]
name = "perllsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Public Cargo facade for the perl-lsp language server"
readme = "README.md"
documentation = "https://docs.rs/perllsp"
keywords = ["perl", "lsp", "language-server", "ide"]
categories = ["development-tools", "text-editors"]
include = [
  "src/**",
  "Cargo.toml",
  "README.md",
  "LICENSE*"
]

[lib]
name = "perllsp"
path = "src/lib.rs"

[[bin]]
name = "perllsp"
path = "src/main.rs"

[dependencies]
perl-lsp-rs = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
tempfile = { workspace = true }
perl-test-must.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# Keep in sync with the "Package binaries" step of .github/workflows/release.yml.
# `cargo xtask release-artifact-check` fails if these drift apart.
#
# That step builds PKG_NAME="perllsp-${VERSION}-${TARGET}", copies the binaries
# into a directory of that name, and then archives it. The two formats do not
# nest the same way:
#
#   tar czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"   -> entries are PKG_NAME/perllsp
#   7z a    "${PKG_NAME}.zip"    "${PKG_NAME}"/* -> entries are perllsp.exe
#
# so `bin-dir` differs per format and Windows needs its own override.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/perllsp-{ version }-{ target }{ archive-suffix }"
bin-dir = "perllsp-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

# Windows is the only target in the release matrix that ships a .zip, and 7z is
# invoked with a trailing /* so the archive has no top-level directory.
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"