[package]
name = "perl-kwalitee"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Legacy mixed repository/product release-readiness evaluator retained for perl_kwalitee.v1 compatibility"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords = ["perl", "release", "readiness", "evidence", "compatibility"]
categories = ["development-tools"]
# Historical compatibility crate. The canonical implementation moves to
# `perl-release-readiness`; the `perl-kwalitee` package name is reclaimed by
# the native distribution analyser only after the migration train completes.
publish = false
include = [
    "src/**",
    "legacy_indicator_migrations.toml",
    "README.md",
    "LICENSE*",
    "Cargo.toml",
]

[lib]
name = "perl_kwalitee"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
# Kept aligned with xtask. Used for legacy Cargo-manifest evidence and the
# checked-in migration ledger.
toml = "1.1.2"

[dev-dependencies]
perl-tdd-support = { workspace = true }
tempfile.workspace = true

[lints]
workspace = true
