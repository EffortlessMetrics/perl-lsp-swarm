[package]
name = "perl-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Perl module resolution, import analysis, and refactoring — unified facade"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-module"
readme = "README.md"
keywords = ["perl", "lsp", "module", "imports", "language-server"]
categories = ["development-tools", "data-structures", "text-editors"]
publish = true
include = [
    "src/**",
    "Cargo.toml",
    "LICENSE*",
    "README.md",
    "CLAUDE.md",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde.workspace = true
unicode-ident = "1.0.22"
url = { workspace = true }
perl-parser-core = { workspace = true }
perl-workspace = { workspace = true }
regex.workspace = true

[dev-dependencies]
proptest = { workspace = true }
serde_json.workspace = true
tempfile = { workspace = true }
perl-tdd-support = { workspace = true }

[lints]
workspace = true
