[package]
name = "perl-incremental-parsing"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compatibility adapter for the canonical perl-parser incremental API"
readme = "README.md"
documentation = "https://docs.rs/perl-incremental-parsing"
keywords = ["perl", "incremental", "parser", "compatibility"]
categories = ["parsing", "development-tools"]
include = [
  "src/**",
  "behavior_disposition.json",
  "Cargo.toml",
  "LICENSE*",
  "README.md"
]

[lib]
doctest = false

[dependencies]
perl-parser = { workspace = true, features = ["incremental"] }

[features]
default = []

[dev-dependencies]
perl-tdd-support = { workspace = true }
criterion.workspace = true
lsp-types.workspace = true
perl-lexer = { workspace = true }
ropey.workspace = true
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
