[package]
name = "perl-corpus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared Perl corpus generation, inventory, and validation library"
repository = "https://github.com/EffortlessMetrics/perl-lsp"
readme = "README.md"
keywords = ["perl", "corpus", "parser", "testing", "fuzzing"]
categories = ["development-tools::testing", "parsing"]

[dependencies]
anyhow.workspace = true
rand = { version = "0.10.0", features = ["std", "std_rng"] }
same-file = "1.0.6"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml = "1.0.3"

[dev-dependencies]
static_assertions = "1.1"
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.dist]
dist = false
