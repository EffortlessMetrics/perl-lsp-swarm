[package]
name = "perl-lsp-perltidy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Perl formatting integration with native contracts and perltidy compatibility"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-lsp-perltidy"
keywords = ["perl", "lsp", "perltidy", "formatting"]
categories = ["development-tools", "text-editors"]

[lib]
doctest = false

[dependencies]
perl-parser-core = { workspace = true }
perl-subprocess-runtime = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
perl-lsp-rs-core = { workspace = true }
perl-tdd-support = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "native_pipeline_benchmark"
harness = false

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
