[package]
name = "perl-workspace-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "LSP-free substrate of deterministic project-level Perl facts (files, packages, symbols, modules, POD, dist metadata)"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perl-workspace-core"
keywords = ["perl", "workspace", "facts", "index", "symbol"]
categories = ["development-tools"]
include = [
  "src/**",
  "Cargo.toml",
  "LICENSE*",
  "README.md",
]

[lib]
doctest = false

# Dependency contract (enforced by tests/dependency_contract.rs):
# perl-workspace-core is the substrate BELOW LSP, DAP, editor transport, and
# shipped-product runtime. It consumes parser/semantic/symbol/module/range
# primitives and produces stable project facts. It must NOT depend on any of:
#   perl-lsp-rs, perl-lsp-rs-core, perllsp, perl-dap, lsp-types, tokio,
#   tower-lsp, perltidy/perlcritic adapters, or editor runtime crates.
[dependencies]
perl-semantic-facts = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
