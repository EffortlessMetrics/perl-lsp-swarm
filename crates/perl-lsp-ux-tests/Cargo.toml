[package]
name = "perl-lsp-ux-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "UX regression test harness for perl-lsp — systematic first-5-minutes scenario testing"
publish = false

[lib]
name = "perl_lsp_ux_tests"
path = "src/lib.rs"

[[bin]]
name = "ux_reverse_request_fixture"
path = "src/bin/ux_reverse_request_fixture.rs"

[[bin]]
name = "ux-regression-receipt"
path = "src/bin/ux_regression_receipt.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
url.workspace = true
tempfile.workspace = true
chrono = { version = "0.4.43", features = ["serde"] }
regex.workspace = true
which = "8.0.2"

[dev-dependencies]
serde_json.workspace = true
anyhow.workspace = true
url.workspace = true
tempfile.workspace = true
sha2.workspace = true

[features]
# Gate slow/heavy integration tests behind this feature flag.
# Run with: cargo test -p perl-lsp-ux-tests --features integration-test
integration-test = []
# Deterministic real-stdio cold-index proof; requires the perllsp binary built
# with perl-lsp-rs/expose_lsp_test_api and explicit PERL_LSP_BIN plus
# PERL_LSP_PROOF_SHA256 identity.
cold-index-proof = []

[lints]
workspace = true
