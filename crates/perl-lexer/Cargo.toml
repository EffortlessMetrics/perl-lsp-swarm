[package]
name = "perl-lexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "High-performance Perl lexer with context-aware tokenization"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/perl-lexer"
keywords = ["perl", "lexer", "tokenizer", "parser", "syntax"]
categories = ["parsing", "text-processing"]
include = ["src/**", "tests/**", "examples/**", "benches/**", "README.md", "LICENSE*", "Cargo.toml"]

[dependencies]
# Core dependencies
unicode-ident = "1.0.22"
memchr = "2.8.1"
phf = { version = "0.14.0", features = ["macros"] }
tracing.workspace = true

# For better error handling
thiserror.workspace = true
perl-position-tracking = { workspace = true }

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true
proptest.workspace = true
perl-parser-core = { workspace = true }
perl-tdd-support = { workspace = true }
perl-token = { workspace = true }
perl-ast-v2 = { workspace = true }

[features]
default = []
# Deprecated compatibility no-op (since 0.17.0): the lexer selects no distinct
# No SIMD implementation is selected by the checked-in Rust sources. Build scripts
# are rejected closed because generated output is not inspectable by the contract.
# Keeping the empty feature is required so `--all-features` stays meaningful while
# #8229's deprecation window remains open. Removal is planned for a future semver
# boundary under open issue #8749 and program #6715; no SIMD performance claim is
# made or implied here.
simd = []
# Enable slow stress tests (regex fuzzing, etc.)
slow_tests = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[[bench]]
name = "lexer_benchmarks"
harness = false
