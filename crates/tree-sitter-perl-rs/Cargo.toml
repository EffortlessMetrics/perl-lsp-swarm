[package]
name = "tree-sitter-perl-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rust-native Perl parser with tree-sitter-style ergonomics and tree-sitter-compatible output over the native v3 parser."
readme = "README.md"
documentation = "https://docs.rs/tree-sitter-perl-rs"
categories = ["development-tools", "parser-implementations", "parsing"]
keywords = ["perl", "parser", "tree-sitter", "lsp", "ast"]
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "README.md",
    "ROADMAP.md",
    "CLAUDE.md",
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tree_sitter_perl_rs"
doctest = true

[features]
default = []
queries = ["dep:regex"]
# Experimental semantic overlay (#7603). Non-default: enabling it is what pulls
# the module/pragma/semantic-analyzer stack into a consumer's dependency graph.
# Default and `queries`-only consumers compile a parser-owned facade in which the
# overlay API does not exist, rather than one that degrades at runtime.
semantic-overlay = [
    "dep:perl-module",
    "dep:perl-pragma",
    "dep:perl-semantic-analyzer",
]

[[bin]]
name = "bench_facade"
path = "src/bin/bench_facade.rs"

[[test]]
name = "semantic_overlay_tests"
required-features = ["semantic-overlay"]

[[example]]
name = "semantic_overlay_queries"
required-features = ["semantic-overlay"]

[dependencies]
perl-parser-core = { workspace = true }
perl-ast = { workspace = true }
perl-module = { workspace = true, optional = true }
# Direct edge only for the overlay; `perl-parser-core` keeps its own transitive
# edge, so a parser-only graph still resolves perl-pragma.
perl-pragma = { workspace = true, optional = true }
perl-semantic-analyzer = { workspace = true, optional = true }
regex = { workspace = true, optional = true }

[dev-dependencies]
perl-tdd-support = { workspace = true }
insta = { workspace = true }
perl-position-tracking = { workspace = true }

[lints]
workspace = true
