# LSP/DAP Feature Catalog -- SINGLE AUTHORITY
#
# This file is the one authoritative catalog for feature IDs, spec versions,
# directions, capability routes, owners, advertisement state, evidence
# classes, and maturity. Nothing else in the repository may define these.
#
# Generated projections: the vendored packaging fallbacks
#   crates/perl-lsp-rs/features_sot.toml
#   crates/perl-lsp-rs-core/features_sot.toml
#   crates/perl-parser/features_sot.toml
#   crates/perl-dap/features_sot.toml
# are byte-copies of this file produced by
#   python scripts/ci/check_feature_catalog.py --fix
# and verified by the same script without --fix. Do not edit them.
#
# Maturity vocabulary (evidence-based, fail-closed):
#   proven      behavior/integration evidence currently on file qualifies
#   preview     usable and advertised as non-final; proof incomplete
#   planned     acknowledged surface, not implemented
#   unsupported explicitly not supported
#   not_proven  present/exposed, but required behavior evidence is absent,
#               non-qualifying, or unrecorded
# Advertisement (`advertised = true`) never implies `proven`.

[meta]
version = "0.17.0"
lsp_version = "3.18"

[policy.evidence]
qualifying_classes = ["behavior_test", "integration_test"]
non_qualifying_tests = [
  "crates/perl-lsp-rs/tests/lsp_3_17_compliance_tests.rs",
]

[policy.promotion.request_response]
minimum_evidence_class = "behavior_test"
notes = "Promotion to proven requires an existing behavioral test driving the request/response pair over the wire harness."

[policy.promotion.server_request]
minimum_evidence_class = "integration_test"
notes = "Server-originated requests need an integration test exercising the client-response path."

[policy.promotion.document_workspace]
minimum_evidence_class = "integration_test"
notes = "Sync/notification/state features need integration coverage of the state transition."

[policy.promotion.cancellation_progress]
minimum_evidence_class = "integration_test"
notes = "Cancellation/progress plumbing needs integration coverage of token flow."

[policy.promotion.editor_dependent]
minimum_evidence_class = "integration_test"
notes = "Editor-dependent features additionally require recorded limitations until a real-host journey exists; promotion beyond preview without one is not allowed."

