spec = "LSP 3.18"
area = "text_document"
direction = "server_to_client"
feature_class = "document_workspace"
capability_route = "diagnostic.messageMarkupSupport client capability"
implementation_owner = "perl-lsp-rs-core::providers::diagnostics"
state_owner = "server"
maturity = "proven"
advertised = true
evidence_class = "behavior_test"
counts_in_coverage = false
tests = [
  "crates/perl-lsp-rs/tests/lsp_diagnostic_enrichment_test.rs",
  "crates/perl-lsp-rs/tests/lsp_318_negative_claims.rs",
]
description = "Markdown-formatted pull diagnostic messages (textDocument.diagnostic.markupMessageSupport) - server emits standard Diagnostic.message MarkupContent and compatibility messageMarkup data only when the client opts in"

[[feature]]
id = "lsp.text_document_content"
spec = "LSP 3.18"
area = "workspace"
direction = "bidirectional"
feature_class = "request_response"
capability_route = "workspace.textDocumentContent client capability (LSP 3.18)"
implementation_owner = "perl-lsp-rs::runtime::client_requests"
state_owner = "shared"
maturity = "proven"
advertised = true
evidence_class = "behavior_test"
tests = [
  "crates/perl-lsp-rs/tests/lsp_virtual_content_tests.rs",
  "crates/perl-lsp-rs/tests/lsp_text_document_content_tests.rs",
]
description = "workspace/textDocumentContent request for perldoc:// virtual documents, preferring workspace POD for locally resolved modules, exposing bare/labeled POD module and section links, and falling back to external perldoc (@proposed)"

