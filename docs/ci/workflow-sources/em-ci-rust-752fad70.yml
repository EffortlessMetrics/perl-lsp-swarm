      - name: Validate Perl export custody
        id: perl_package_custody
        if: always() && !cancelled() && inputs.upload_artifacts && inputs.artifact_lane == 'perl-rust-small' && steps.proof.outputs.proof_entered_at != '' && steps.artifact_prepare.outcome == 'success'
        shell: bash
        env:
          PACKET_DIR: ${{ steps.artifact_prepare.outputs.path }}
          PACKET_CONTEXT: ${{ runner.temp }}/em-ci-job-context.json
          PACKET_PHASE: staging
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: &validate_perl_packet |
          set -euo pipefail
          python3 -I - <<'PYTHON'
          import datetime, hashlib, json, os, pathlib, re, stat, time

          RECEIPT = 'rust-small-proof.json'
          MANIFEST = 'perl-rust-small-export.json'

          def require(ok, message):
              if not ok:
                  raise ValueError(message)

          def document(raw):
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      require(key not in result, 'duplicate Perl JSON field')
                      result[key] = value
                  return result
              return json.loads(raw.decode('utf-8'), object_pairs_hook=unique,
                                parse_constant=lambda value: (_ for _ in ()).throw(ValueError('nonfinite Perl JSON')))

          def read(path, maximum):
              for parent in path.parents:
                  require(stat.S_ISDIR(parent.lstat().st_mode), 'linked Perl custody ancestor')
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  before = os.fstat(descriptor)
                  require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and 0 < before.st_size <= maximum,
                          'unsafe Perl custody member')
                  with os.fdopen(descriptor, 'rb', closefd=False) as stream:
                      raw = stream.read(maximum + 1)
                  after = os.fstat(descriptor)
                  keys = ('st_dev', 'st_ino', 'st_size', 'st_mtime_ns', 'st_ctime_ns', 'st_nlink')
                  require(len(raw) == before.st_size and all(getattr(before, key) == getattr(after, key) for key in keys),
                          'Perl custody member changed')
                  return raw, before
              finally:
                  os.close(descriptor)

          def validate():
              root = pathlib.Path(os.environ['PACKET_DIR'])
              context_path = pathlib.Path(os.environ['PACKET_CONTEXT'])
              phase = os.environ['PACKET_PHASE']
              require(phase in ('staging', 'imported') and root.is_absolute() and '..' not in root.parts,
                      'invalid Perl custody phase/path')
              for path in (root, *root.parents):
                  require(stat.S_ISDIR(path.lstat().st_mode), 'linked Perl custody root')
              expected_names = {RECEIPT, MANIFEST} | ({'em-ci-job-context.json'} if phase == 'imported' else set())
              require({p.name for p in root.iterdir()} == expected_names, 'Perl custody member set mismatch')
              require(stat.S_IMODE(root.stat().st_mode) & 0o077 == 0 and root.stat().st_uid == os.geteuid(),
                      'Perl custody root is not private')
              context_raw, _ = read(context_path, 16384)
              context = document(context_raw)
              expected = dict(schema='em-ci-job-context.v1', repository='EffortlessMetrics/perl-lsp-swarm',
                              sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                              run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], profile='standard',
                              workflow=os.environ['GITHUB_WORKFLOW'], workflow_ref=os.environ['GITHUB_WORKFLOW_REF'],
                              event=os.environ['GITHUB_EVENT_NAME'], ref=os.environ['GITHUB_REF'])
              require(os.environ['GITHUB_REPOSITORY'] == expected['repository'] and
                      all(type(context.get(k)) is type(v) and context[k] == v for k,v in expected.items()),
                      'Perl producer source/run mismatch')
              require(context.get('job') in ('standard', 'hosted', 'hosted-fallback'), 'wrong Perl producer profile')
              entered = context['proof_started_at']
              require(type(entered) is str and re.fullmatch(r'\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ', entered), 'missing Perl proof entry')
              start = datetime.datetime.strptime(entered, '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.timezone.utc).timestamp()
              receipt_raw, receipt_info = read(root / RECEIPT, 1024**2)
              manifest_raw, manifest_info = read(root / MANIFEST, 16384)
              if phase == 'staging':
                  require(all(start <= info.st_mtime <= time.time() + 2 for info in (receipt_info, manifest_info)),
                          'stale Perl custody data')
              receipt, manifest = document(receipt_raw), document(manifest_raw)
              require(type(receipt) is dict and receipt.get('schema_version') == 'rust_small_proof.v1' and
                      type(receipt.get('subject')) is dict and receipt['subject'].get('git_sha') == expected['sha'] and
                      receipt['subject'].get('worktree_dirty') is False, 'Perl canonical receipt source/schema mismatch')
              result = receipt.get('result')
              require(result in ('success', 'product_failure', 'not_completed', 'instrument_failure'), 'invalid Perl product result')
              if os.environ['PROOF_OUTCOME'] == 'success':
                  require(result == 'success' and context.get('job_status') == 'success', 'Perl diagnostic cannot certify success')
              keys = {'schema', 'repository', 'sha', 'run_id', 'run_attempt', 'profile', 'proof_started_at', 'result', 'member'}
              require(type(manifest) is dict and set(manifest) == keys and manifest['schema'] == 'perl-rust-small-export.v1',
                      'unknown Perl export schema/fields')
              require(all(type(manifest.get(k)) is str and manifest[k] == expected[k] for k in ('repository','sha','run_id','run_attempt','profile')) and
                      manifest['proof_started_at'] == entered and manifest['result'] == result, 'Perl export identity/outcome mismatch')
              member = manifest['member']
              require(type(member) is dict and set(member) == {'path', 'bytes', 'sha256'} and member['path'] == RECEIPT and
                      type(member['bytes']) is int and member['bytes'] == len(receipt_raw) and
                      member['sha256'] == hashlib.sha256(receipt_raw).hexdigest(), 'Perl exported bytes/digest mismatch')
              require(len(receipt_raw) + len(manifest_raw) + len(context_raw) <= 2 * 1024**2, 'Perl packet exceeds bound')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('validated=true\n')

          if __name__ == '__main__':
              validate()
          PYTHON
      - name: Validate bounded canonical RIPR package
