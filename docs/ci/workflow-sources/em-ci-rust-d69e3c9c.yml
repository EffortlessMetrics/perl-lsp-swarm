          except Exception:
              print('::error::absolute deadline supervision missing or refused', file=__import__('sys').stderr)
              raise SystemExit(78)
          DEADLINE_BOOTSTRAP
            status=$?
            exit "$status"
          fi
          # END DEADLINE WRAPPER
          # EM_CI_DEADLINE_SUPERVISED_BODY
          set -euo pipefail
          [[ "$EM_CI_PROOF_SCRIPT" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$EM_CI_PROOF_SCRIPT" != /* ]]
          [[ "$EM_CI_PROOF_SCRIPT" != *..* ]]
          [[ -f "$EM_CI_PROOF_SCRIPT" ]]
