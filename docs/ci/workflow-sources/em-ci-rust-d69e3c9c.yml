      - name: Verify canonical Perl product receipt
        id: perl_semantics
        env:
          PERL_PACKET_DIR: ${{ steps.artifact_prepare.outputs.path }}
          PERL_RECEIPT_VERIFIER: ${{ inputs.perl_receipt_verifier }}
        if: always() && !cancelled() && inputs.upload_artifacts && inputs.artifact_lane == 'perl-rust-small' && steps.proof.outputs.proof_entered_at != '' && (steps.proof.outcome == 'success' || steps.proof.outcome == 'failure')
        shell: bash
        run: |
          # EM_CI_DEADLINE_SUPERVISED_BODY
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          [[ "$EM_CI_LANE" == perl-rust-small && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          python3 -I - <<'PYTHON'
          import hashlib, os, pathlib, re, stat, subprocess

          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          sha = os.environ['GITHUB_SHA']
          if not re.fullmatch('[0-9a-f]{40}', sha):
              raise ValueError('missing immutable Perl source')
          # Ignore caller-provided Git environment, index bits, config and replace refs.
          git_env = dict(PATH='/usr/bin:/bin', GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_GLOBAL='/dev/null', GIT_NO_REPLACE_OBJECTS='1')
          def object_bytes(kind, oid):
              raw = subprocess.check_output(['/usr/bin/git', '--no-replace-objects', 'cat-file', kind, oid], cwd=root, env=git_env)
              actual = hashlib.sha1(kind.encode() + b' ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if actual != oid:
                  raise ValueError('immutable Perl Git object changed')
              return raw

          commit = object_bytes('commit', sha)
          first = commit.split(b'\n', 1)[0]
          if not re.fullmatch(b'tree [0-9a-f]{40}', first):
              raise ValueError('invalid immutable Perl commit')

          def tree(oid, directory):
              if not stat.S_ISDIR(directory.lstat().st_mode):
                  raise ValueError('linked Perl source directory')
              raw = object_bytes('tree', oid)
              cursor = 0
              while cursor < len(raw):
                  end = raw.index(b'\0', cursor)
                  mode, name = raw[cursor:end].split(b' ', 1)
                  child = raw[end + 1:end + 21]
                  if len(child) != 20 or name in (b'', b'.', b'..', b'.git') or b'/' in name:
                      raise ValueError('unsafe immutable Perl tree')
                  cursor = end + 21
                  path = directory / os.fsdecode(name)
                  info = path.lstat()
                  if mode == b'40000':
                      tree(child.hex(), path)
                      continue
                  digest = hashlib.sha1()
                  if mode == b'120000' and stat.S_ISLNK(info.st_mode):
                      data = os.readlink(os.fsencode(path))
                      digest.update(b'blob ' + str(len(data)).encode() + b'\0' + data)
                  elif mode in (b'100644', b'100755') and stat.S_ISREG(info.st_mode) and info.st_nlink == 1:
                      if bool(info.st_mode & stat.S_IXUSR) != (mode == b'100755'):
                          raise ValueError('Perl source mode changed')
                      digest.update(b'blob ' + str(info.st_size).encode() + b'\0')
                      with path.open('rb') as stream:
                          for block in iter(lambda: stream.read(1024**2), b''):
                              digest.update(block)
                  else:
                      raise ValueError('Perl source type changed or unsupported submodule')
                  if digest.digest() != child:
                      raise ValueError('Perl source differs from immutable commit')

          tree(first[5:].decode(), root)
          PYTHON
          git diff --quiet HEAD --
          [[ -z "$(git ls-files --others --exclude-standard)" ]]
          # Execute the owning validator with the proof's existing target/toolchain.
          # No duplicated Python implementation may certify product semantics.
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN EM_CI_ADMISSION_TOKEN
          # Closed selection; unsupported/missing packages fail without fallback.
          case "${PERL_RECEIPT_VERIFIER:-xtask}" in
            xtask) verifier=(-p xtask --locked -- rust-small-proof) ;;
            lightweight-v1) verifier=(--locked -p perl-rust-small-verifier --) ;;
            *) exit 64 ;;
          esac
          cargo run "${verifier[@]}" --verify-receipt "$PERL_PACKET_DIR/rust-small-proof.json"
