          # EM_CI_DEADLINE_SUPERVISED_BODY
          set -euo pipefail
          if ! mkdir -p "$RUNNER_TEMP/cargo-target" "$RUNNER_TEMP/tmp"; then
            echo 'infrastructure_failure=disposable_paths_unavailable' >> "$GITHUB_OUTPUT"
            echo '::warning::cannot create disposable runner paths; proof admission withdrawn'
            exit 0
          fi
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
      - name: Prepare canonical RIPR artifact root
        id: artifact_prepare
        if: inputs.upload_artifacts && (inputs.artifact_lane == 'ripr' || inputs.artifact_lane == 'perl-rust-small') && steps.toolchain.outcome == 'success' && steps.prepare.outcome == 'success' && steps.toolchain.outputs.infrastructure_failure == '' && steps.prepare.outputs.infrastructure_failure == ''
        shell: bash
        env:
          ARTIFACT_LANE: ${{ inputs.artifact_lane }}
          NATIVE_JOB: ${{ toJSON(job) }}
          NATIVE_OS: ${{ runner.os }}
          NATIVE_ARCH: ${{ runner.arch }}
        run: |
          # EM_CI_DEADLINE_SUPERVISED_BODY
          set -euo pipefail
          python3 -I - <<'PYTHON'
          import json, os, pathlib, re, stat

          def require(ok, message):
              if not ok:
                  raise ValueError(message)

          def directory(path):
              require(stat.S_ISDIR(path.lstat().st_mode), 'linked or non-directory artifact ancestor')

          def prepare():
              workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
              directory(workspace)
              lane = os.environ.get('ARTIFACT_LANE', 'ripr')
              require(lane in ('ripr', 'perl-rust-small'), 'unknown transport lane')
              root = workspace
              if lane == 'ripr':
                  for component in ('.ci', 'artifacts', 'ripr'):
                      root /= component
                      try:
                          directory(root)
                      except FileNotFoundError:
                          root.mkdir()
                          directory(root)
                  require(not any(root.iterdir()), 'artifact root is not fresh and empty')
              job = json.loads(os.environ['NATIVE_JOB'])
              require(type(job.get('check_run_id')) is int and job['check_run_id'] > 0, 'native producer identity missing')
              sha = job.get('workflow_sha')
              repository = job.get('workflow_repository')
              path = job.get('workflow_file_path')
              require(type(sha) is str and re.fullmatch('[0-9a-f]{40}', sha), 'defining workflow SHA missing')
              require(repository in ('EffortlessMetrics/em-ci-workflows', 'EffortlessMetrics/em-ci') and
                      path == '.github/workflows/rust.yml' and job.get('workflow_ref') == repository + '/' + path + '@' + sha,
                      'defining reusable workflow must use an exact full SHA')
              require(os.environ['NATIVE_OS'] == 'Linux' and os.environ['NATIVE_ARCH'] == 'X64', 'unsupported proof platform')
              context_path = pathlib.Path(os.environ['RUNNER_TEMP'], 'em-ci-job-context.json')
              require(stat.S_ISREG(context_path.lstat().st_mode) and context_path.stat().st_nlink == 1, 'unsafe job context')
              context = json.loads(context_path.read_text())
              context.update(producer_check_run_id=job['check_run_id'], defining_workflow_ref=job['workflow_ref'],
                             defining_workflow_sha=sha, defining_workflow_repository=repository,
                             defining_workflow_path=path, runner_os=os.environ['NATIVE_OS'], runner_arch=os.environ['NATIVE_ARCH'])
              context_path.write_text(json.dumps(context, sort_keys=True))
              name = 'em-ci-rust-' + lane + '-' + context['profile'] + '-' + str(job['check_run_id']) + '-' + context['run_id'] + '-' + context['run_attempt']
              if lane == 'perl-rust-small':
                  temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
                  for parent in (temporary, *temporary.parents):
                      directory(parent)
                  root = temporary / name
                  root.mkdir(mode=0o700)
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('EM_CI_LANE=' + lane + '\nEM_CI_ARTIFACT_DIR=' + str(root) + '\n')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('name=' + name + '\nproducer=' + str(job['check_run_id']) + '\npath=' + str(root) + '\n')

          if __name__ == '__main__':
              prepare()
          PYTHON
      - name: Recheck native proof admission
        id: admission
        if: always() && !cancelled() && inputs.proof_admission == 'native-review-v1' && steps.checkout.outcome == 'success'
        timeout-minutes: 5
        shell: bash
        env:
        # BEGIN DEADLINE ENV
          EM_CI_WHOLE_RUN_DEADLINE: ${{ inputs.whole_run_deadline }}
          EM_CI_DEADLINE_STATE_DIGEST: ${{ steps.deadline_init.outputs.state_digest }}
        # END DEADLINE ENV
          EM_CI_ADMISSION_TOKEN: ${{ github.token }}
        run: |
          # BEGIN DEADLINE WRAPPER
          if [[ -n "${EM_CI_WHOLE_RUN_DEADLINE:-}" ]]; then
            set +e
          python3 -I - exec setup "${BASH_SOURCE[0]}" <<'DEADLINE_BOOTSTRAP'
          try:
              import hashlib, os, pathlib, stat, sys
              p = pathlib.Path(os.environ['EM_CI_DEADLINE_PROGRAM'])
              fd = os.open(p, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, 'rb') as stream:
                  info = os.fstat(stream.fileno())
                  assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size <= 100000
                  raw = stream.read(100001)
              assert hashlib.sha256(raw).hexdigest() == '1912b44797b9e3a454b406083e5a5ee2f9b1bd5016c3237bc33e0cf91905e402', 'deadline supervisor changed'
              scope = {'__name__': 'deadline_supervisor'}
              exec(compile(raw, str(p), 'exec'), scope)
              raise SystemExit(scope['main'](sys.argv[1:], os.environ))
          except Exception:
              print('::error::absolute deadline supervision missing or refused', file=__import__('sys').stderr)
              raise SystemExit(78)
          DEADLINE_BOOTSTRAP
            status=$?
            exit "$status"
          fi
          # END DEADLINE WRAPPER
          # EM_CI_DEADLINE_SUPERVISED_BODY
          set -euo pipefail
          python3 -I - <<'PYTHON'
          import datetime as dt, hashlib, json, os, pathlib, re, shutil, signal, stat, subprocess, tempfile, time, urllib.request

          REPOSITORIES = ('EffortlessMetrics/perl-lsp-swarm', 'EffortlessMetrics/unsafe-review-swarm')
          OWNERS = ('scripts/ci/check-pr-semantic-review-currentness.py',
                    'scripts/ci/check-pr-review-convergence', 'scripts/ci/check-pr-review-convergence-core')
          SHA = re.compile('[0-9a-f]{40}')
          COORDINATOR = 'EffortlessSteven'


          def require(ok):
              if not ok:
                  raise ValueError('native proof admission refused')


          def pairs(rows):
              value = {}
              for key, item in rows:
                  require(key not in value)
                  value[key] = item
              return value


          def decode(raw):
              return json.loads(raw, object_pairs_hook=pairs, parse_constant=lambda value: require(False))


          def stamp(value):
              return dt.datetime.strptime(value, '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=dt.timezone.utc)


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError('native metadata redirect refused')


          class API:
              def __init__(self, token):
                  require(type(token) is str and token and '\n' not in token and '\r' not in token)
                  self.token, self.calls, self.bytes = token, 0, 0
                  self.opener = urllib.request.build_opener(NoRedirect)

              def request(self, path, payload=None):
                  self.calls += 1
                  require(self.calls <= 40 and path.startswith(('/repos/', '/graphql')) and '..' not in path)
                  data = None if payload is None else json.dumps(payload).encode()
                  request = urllib.request.Request('https://api.github.com' + path, data=data, headers={
                      'Authorization': 'Bearer ' + self.token, 'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
                  with self.opener.open(request, timeout=10) as response:
                      require(response.status == 200)
                      raw = response.read(1024**2 + 1)
                  self.bytes += len(raw)
                  require(len(raw) <= 1024**2 and self.bytes <= 16 * 1024**2)
                  value = decode(raw)
                  require(not (type(value) is dict and value.get('errors')))
                  return value

              def reviews(self, prefix):
                  result = []
                  for page in range(1, 6):
                      batch = self.request(prefix + '/reviews?per_page=100&page=' + str(page))
                      require(type(batch) is list)
                      result.extend(batch)
                      if len(batch) < 100:
                          return result
                  raise ValueError('review inventory exceeds bound')

              def auto_merge(self, repository, pr):
                  owner, repo = repository.split('/')
                  query = '''query($owner:String!,$repo:String!,$pr:Int!) {
                    repository(owner:$owner,name:$repo) { pullRequest(number:$pr) {
                      autoMergeRequest { enabledAt enabledBy { login __typename } mergeMethod } } } }'''
                  value = self.request('/graphql', dict(query=query, variables=dict(owner=owner, repo=repo, pr=pr)))
                  return value['data']['repository']['pullRequest']['autoMergeRequest']

              def threads(self, repository, pr):
                  owner, repo = repository.split('/')
                  query = '''query($owner:String!,$repo:String!,$pr:Int!,$after:String) {
                    repository(owner:$owner,name:$repo) { pullRequest(number:$pr) {
                      reviewThreads(first:100,after:$after) { nodes { id isResolved isOutdated comments(first:1) { totalCount } }
                        pageInfo { hasNextPage endCursor } } } } }'''
                  result, cursor = [], None
                  for _ in range(5):
                      value = self.request('/graphql', dict(query=query, variables=dict(owner=owner, repo=repo, pr=pr, after=cursor)))
                      connection = value['data']['repository']['pullRequest']['reviewThreads']
                      require(type(connection['nodes']) is list and type(connection['pageInfo']['hasNextPage']) is bool)
                      for thread in connection['nodes']:
                          require(thread['isResolved'] is True)
                      result.extend(connection['nodes'])
                      if not connection['pageInfo']['hasNextPage']:
                          return result
                      next_cursor = connection['pageInfo']['endCursor']
                      require(type(next_cursor) is str and next_cursor and next_cursor != cursor)
                      cursor = next_cursor
                  raise ValueError('thread inventory exceeds bound')


          def record(body):
              require(type(body) is str and len(body.encode('utf-8')) <= 65536)
              matches = re.findall(r'<!-- unsafe-review-admission-v1: (\{[^\n]*\}) -->', body)
              require(len(matches) == 1 and body.count('<!-- unsafe-review-admission-v1:') == 1)
              return decode(matches[0])


          def subject(pr, repository, repository_id):
              require(type(pr['number']) is int and pr['number'] > 0 and pr['state'] == 'open' and pr['draft'] is False)
              for side in ('head', 'base'):
                  require(pr[side]['repo']['full_name'] == repository and pr[side]['repo']['id'] == repository_id and
                          type(pr[side]['sha']) is str and SHA.fullmatch(pr[side]['sha']))
              require(pr['head']['repo']['fork'] is False and pr['base']['ref'] == 'main' and pr['user']['type'] == 'User')
              return dict(repository=repository, pr=pr['number'], head=pr['head']['sha'], base=pr['base']['sha'])


          def snapshot(event, env, api, now):
              repository = env['GITHUB_REPOSITORY']
              require(repository in REPOSITORIES and env['GITHUB_EVENT_NAME'] == 'pull_request' and env['GITHUB_RUN_ATTEMPT'] == '1')
              require(re.fullmatch('[1-9][0-9]{0,19}', env['GITHUB_RUN_ID']) and SHA.fullmatch(env['GITHUB_SHA']))
              require(env['GITHUB_ACTOR'] == env['GITHUB_TRIGGERING_ACTOR'] == event['sender']['login'] == COORDINATOR and
                      event['sender']['type'] == 'User')
              native_repository = event['repository']
              require(native_repository['full_name'] == repository and type(native_repository['id']) is int and native_repository['id'] > 0)
              expected = subject(event['pull_request'], repository, native_repository['id'])
              require(env['GITHUB_REF'] == 'refs/pull/' + str(expected['pr']) + '/merge')
              prefix = '/repos/' + repository
              repo = api.request(prefix)
              require(repo['id'] == native_repository['id'] and repo['full_name'] == repository and repo['private'] is False and repo['default_branch'] == 'main')
              run = api.request(prefix + '/actions/runs/' + env['GITHUB_RUN_ID'] + '/attempts/1')
              require(str(run['id']) == env['GITHUB_RUN_ID'] and run['run_attempt'] == 1 and run['event'] == 'pull_request' and
                      run['repository']['id'] == repo['id'] and run['head_repository']['id'] == repo['id'] and
                      run['head_sha'] == expected['head'] and run['status'] == 'in_progress' and run['conclusion'] is None and
                      run['actor']['login'] == run['triggering_actor']['login'] == COORDINATOR)
              permission = api.request(prefix + '/collaborators/' + COORDINATOR + '/permission')
              require(permission['permission'] == 'admin' and permission['user']['login'] == COORDINATOR)
              branch = api.request(prefix + '/branches/main')
              require(branch['protected'] is True and branch['commit']['sha'] == expected['base'])
              path = prefix + '/pulls/' + str(expected['pr'])
              current = api.request(path)
              require(subject(current, repository, repo['id']) == expected and current['mergeable'] is True and
                      current['merge_commit_sha'] == env['GITHUB_SHA'] and not current['requested_reviewers'] and not current['requested_teams'])
              integration = api.request(prefix + '/git/commits/' + env['GITHUB_SHA'])
              require(integration['sha'] == env['GITHUB_SHA'] and SHA.fullmatch(integration['tree']['sha']) and
                      [p['sha'] for p in integration['parents']] == [expected['base'], expected['head']])
              ref = api.request(prefix + '/git/ref/pull/' + str(expected['pr']) + '/merge')
              require(ref['object']['type'] == 'commit' and ref['object']['sha'] == env['GITHUB_SHA'])
              action = event['action']
              if action == 'auto_merge_enabled':
                  native = current['auto_merge']
                  prior = event['pull_request']['auto_merge']
                  require(type(native) is dict and type(prior) is dict and native['enabled_by']['login'] == COORDINATOR and
                          prior['enabled_by']['login'] == COORDINATOR and native['merge_method'] == prior['merge_method'] and
                          native['merge_method'] in ('merge', 'squash', 'rebase'))
                  # REST/event auto_merge has no timestamp. Use the native GraphQL
                  # request identity and bind its enabledAt to this original run.
                  request = api.auto_merge(repository, expected['pr'])
                  require(type(request) is dict and request['enabledBy'] == dict(login=COORDINATOR, __typename='User') and
                          request['mergeMethod'] == native['merge_method'].upper())
                  require(0 <= (stamp(run['created_at']) - stamp(request['enabledAt'])).total_seconds() <= 600)
              else:
                  require(repository == 'EffortlessMetrics/unsafe-review-swarm' and action == 'edited')
                  request = record(current['body'])
                  require(current['body'] == event['pull_request']['body'])
                  previous = event['changes']['body']['from']
                  require(type(previous) is str and ('<!-- unsafe-review-admission-v1:' not in previous or
                          record(previous)['request_id'] != request['request_id']))
                  require(set(request) == set(expected) | {'integration', 'tree', 'coordinator', 'request_id', 'review_id', 'issued_at'})
                  require(all(request[k] == v for k, v in expected.items()) and request['integration'] == env['GITHUB_SHA'] and
                          request['tree'] == integration['tree']['sha'] and request['coordinator'] == COORDINATOR and
                          re.fullmatch('[0-9a-f]{32}', request['request_id']) and type(request['review_id']) is int and request['review_id'] > 0)
                  require(0 <= (stamp(event['pull_request']['updated_at']) - stamp(request['issued_at'])).total_seconds() <= 60 and
                          0 <= (now - stamp(request['issued_at'])).total_seconds() <= 600)
              reviews = api.reviews(path)
              if action == 'edited':
                  require(any(row.get('id') == request['review_id'] and row.get('commit_id') == expected['head'] and
                              row.get('state') in ('APPROVED', 'COMMENTED') and row.get('user', {}).get('login') == COORDINATOR and
                              stamp(row['submitted_at']) <= stamp(request['issued_at']) for row in reviews))
              threads = api.threads(repository, expected['pr'])
              return dict(subject=expected, integration=env['GITHUB_SHA'], tree=integration['tree']['sha'], request=request,
                          reviews=reviews, threads=threads, actor=COORDINATOR, run=env['GITHUB_RUN_ID'], attempt='1')


          def execute(argv, cwd, env, limit=1024**2):
              # Bound child wall time and captured output; never print raw API/owner text.
              with tempfile.TemporaryFile() as out, tempfile.TemporaryFile() as err:
                  process = subprocess.Popen(argv, cwd=cwd, env=env, stdout=out, stderr=err, start_new_session=True)
                  deadline = time.monotonic() + 90
                  try:
                      while process.poll() is None:
                          require(time.monotonic() < deadline and os.fstat(out.fileno()).st_size <= limit and
                                  os.fstat(err.fileno()).st_size <= 65536)
                          time.sleep(0.05)
                      require(process.returncode == 0 and os.fstat(out.fileno()).st_size <= limit and os.fstat(err.fileno()).st_size <= 65536)
                      out.seek(0)
                      return out.read(limit + 1)
                  finally:
                      if process.poll() is None:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait()


          def owner_results(semantic, convergence, expected):
              require(semantic.get('schema_version') == 'semantic_review_currentness.v1' and semantic.get('classification') == 'REVIEW_CURRENT' and
                      semantic.get('acquisition_mode') == 'gh_live' and semantic.get('repo') == expected['repository'] and
                      semantic.get('pr') == expected['pr'] and semantic.get('current_head') == expected['head'])
              require(convergence.get('schema_version') == 'convergence_core.v1' and
                      convergence.get('wrapper_schema_version') == 'pr_review_convergence.v2' and
                      convergence.get('pr') == expected['pr'] and convergence.get('headRefOid') == expected['head'] and
                      convergence.get('converged') is True and convergence.get('native_review_facts_converged') is True)


          def owners(expected, env, directory, run=execute):
              # No candidate checkout or global/user Git configuration reaches these tools.
              home = directory / 'home'; home.mkdir(mode=0o700)
              objects = pathlib.Path(env['GITHUB_WORKSPACE']) / '.git/objects'
              require(objects.is_absolute() and '\n' not in str(objects) and '\r' not in str(objects) and '..' not in objects.parts and
                      stat.S_ISDIR(objects.lstat().st_mode) and not objects.is_symlink())
              child = dict(PATH='/usr/local/bin:/usr/bin:/bin', HOME=str(home), XDG_CONFIG_HOME=str(home),
                           TMPDIR=str(directory), LANG='C.UTF-8', PYTHONIOENCODING='utf-8',
                           GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_GLOBAL='/dev/null', GIT_TERMINAL_PROMPT='0',
                           GIT_NO_REPLACE_OBJECTS='1', GH_TOKEN=env['EM_CI_ADMISSION_TOKEN'], GH_HOST='github.com', GH_PROMPT_DISABLED='1')
              # A missing immutable-image tool is an admission refusal, never typed fallback.
              require(all(shutil.which(tool, path=child['PATH']) for tool in ('git', 'gh', 'jq', 'bash', 'python3')))
              root = directory / 'source'; root.mkdir(mode=0o700)
              run(['git', 'init', '--quiet', str(root)], directory, child)
              (root / '.git/objects/info/alternates').write_text(str(objects.resolve()) + '\n')
              run(['git', 'config', 'core.hooksPath', '/dev/null'], root, child)
              run(['git', 'config', 'core.attributesFile', '/dev/null'], root, child)
              run(['git', 'remote', 'add', 'origin', 'https://github.com/' + expected['repository'] + '.git'], root, child)
              trusted = directory / 'owners'; trusted.mkdir(mode=0o700)
              for path in OWNERS:
                  row = run(['git', 'ls-tree', expected['base'], '--', path], root, child, 4096).decode().strip()
                  match = re.fullmatch(r'(100644|100755) blob ([0-9a-f]{40})\t' + re.escape(path), row)
                  require(match)
                  raw = run(['git', 'cat-file', 'blob', match[2]], root, child, 512 * 1024)
                  require(hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == match[2])
                  (trusted / pathlib.Path(path).name).write_bytes(raw)
              semantic = decode(run(['python3', '-I', str(trusted / pathlib.Path(OWNERS[0]).name), str(expected['pr']), expected['repository'],
                                     '--root', str(root), '--expected-head', expected['head']], root, child))
              raw = run(['bash', str(trusted / pathlib.Path(OWNERS[1]).name), str(expected['pr']), expected['repository']], root, child).decode()
              convergence = decode(raw[raw.index('{'):])
              owner_results(semantic, convergence, expected)


          def admit(event, env, api, now, invoke=owners):
              before = snapshot(event, env, api, now)
              temporary = pathlib.Path(env['RUNNER_TEMP'])
              require(temporary.is_absolute() and '\n' not in str(temporary) and '..' not in temporary.parts)
              with tempfile.TemporaryDirectory(prefix='em-ci-native-admission-', dir=temporary) as path:
                  invoke(before['subject'], env, pathlib.Path(path))
              # Repeat authenticated native authority after the owning checks, immediately
              # before emitting proof-entry eligibility. These reads are not an atomic lock.
              after = snapshot(event, env, api, dt.datetime.now(dt.timezone.utc))
              require(before == after)
              return dict(schema='em-ci-native-proof-admission.v1', repository=env['GITHUB_REPOSITORY'],
                          run_id=env['GITHUB_RUN_ID'], run_attempt=env['GITHUB_RUN_ATTEMPT'], sha=env['GITHUB_SHA'],
                          head=before['subject']['head'], base=before['subject']['base'], tree=before['tree'])


          if __name__ == '__main__':
              try:
                  event_path = pathlib.Path(os.environ['GITHUB_EVENT_PATH'])
                  require(event_path.stat().st_size <= 1024**2)
                  event = decode(event_path.read_bytes())
                  receipt = admit(event, os.environ, API(os.environ['EM_CI_ADMISSION_TOKEN']), dt.datetime.now(dt.timezone.utc))
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      output.write('admitted=true\n')
                  print(json.dumps(receipt, sort_keys=True))
              except Exception:
                  print('::error::native proof admission refused or unavailable')
                  raise SystemExit(1)
          PYTHON
      - name: Run repository proof
        id: proof
        if: (inputs.proof_admission == '' || (steps.admission.outcome == 'success' && steps.admission.outputs.admitted == 'true')) && steps.toolchain.outcome == 'success' && steps.prepare.outcome == 'success' && steps.toolchain.outputs.infrastructure_failure == '' && steps.prepare.outputs.infrastructure_failure == '' && (!inputs.upload_artifacts || (inputs.artifact_lane != 'ripr' && inputs.artifact_lane != 'perl-rust-small') || steps.artifact_prepare.outcome == 'success')
        shell: bash
        env:
        # BEGIN DEADLINE ENV
          EM_CI_WHOLE_RUN_DEADLINE: ${{ inputs.whole_run_deadline }}
          EM_CI_DEADLINE_STATE_DIGEST: ${{ steps.deadline_init.outputs.state_digest }}
        # END DEADLINE ENV
          EM_CI_PROOF_SCRIPT: ${{ inputs.script }}
        run: |
          # BEGIN DEADLINE WRAPPER
          if [[ -n "${EM_CI_WHOLE_RUN_DEADLINE:-}" ]]; then
            set +e
          python3 -I - exec proof "${BASH_SOURCE[0]}" <<'DEADLINE_BOOTSTRAP'
          try:
              import hashlib, os, pathlib, stat, sys
              p = pathlib.Path(os.environ['EM_CI_DEADLINE_PROGRAM'])
              fd = os.open(p, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, 'rb') as stream:
                  info = os.fstat(stream.fileno())
                  assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size <= 100000
                  raw = stream.read(100001)
              assert hashlib.sha256(raw).hexdigest() == '1912b44797b9e3a454b406083e5a5ee2f9b1bd5016c3237bc33e0cf91905e402', 'deadline supervisor changed'
              scope = {'__name__': 'deadline_supervisor'}
              exec(compile(raw, str(p), 'exec'), scope)
