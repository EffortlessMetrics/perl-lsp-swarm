        # BEGIN DEADLINE ENV
          EM_CI_WHOLE_RUN_DEADLINE: ${{ inputs.whole_run_deadline }}
          EM_CI_DEADLINE_STATE_DIGEST: ${{ steps.deadline_init.outputs.state_digest }}
        # END DEADLINE ENV
        shell: bash
        run: |
          python3 -I - budget diagnostics 2 <<'DEADLINE_BOOTSTRAP'
          try:
              import hashlib, os, pathlib, stat, sys
              p = pathlib.Path(os.environ['EM_CI_DEADLINE_PROGRAM'])
              fd = os.open(p, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, 'rb') as stream:
                  info = os.fstat(stream.fileno())
                  assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size <= 100000
                  raw = stream.read(100001)
              assert hashlib.sha256(raw).hexdigest() == '1912b44797b9e3a454b406083e5a5ee2f9b1bd5016c3237bc33e0cf91905e402', 'deadline supervisor changed'
              scope = {'__name__': 'deadline_supervisor'}
              exec(compile(raw, str(p), 'exec'), scope)
              raise SystemExit(scope['main'](sys.argv[1:], os.environ))
          except Exception:
              print('::error::absolute deadline supervision missing or refused', file=__import__('sys').stderr)
              raise SystemExit(78)
          DEADLINE_BOOTSTRAP
      - name: Upload bounded failure diagnostics
        if: always() && !cancelled() && inputs.upload_artifacts && inputs.artifact_lane == 'failure-diagnostics' && steps.proof.outcome == 'failure' && steps.failure_diagnostics.outcome == 'success' && steps.failure_diagnostics.outputs.upload == 'true' && (inputs.whole_run_deadline == '' || steps.deadline_action_2.outcome == 'success')
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.failure_diagnostics.outputs.name }}
          path: ${{ steps.failure_diagnostics.outputs.path }}
          if-no-files-found: error
          retention-days: 7


      # END ABSOLUTE DEADLINE
      # BEGIN ABSOLUTE DEADLINE
      - name: Confirm supervised execution finished inside the deadline
        if: always() && !cancelled() && inputs.whole_run_deadline != ''
        env:
        # BEGIN DEADLINE ENV
          EM_CI_WHOLE_RUN_DEADLINE: ${{ inputs.whole_run_deadline }}
          EM_CI_DEADLINE_STATE_DIGEST: ${{ steps.deadline_init.outputs.state_digest }}
        # END DEADLINE ENV
        shell: bash
        run: |
          python3 -I - check finish <<'DEADLINE_BOOTSTRAP'
          try:
              import hashlib, os, pathlib, stat, sys
              p = pathlib.Path(os.environ['EM_CI_DEADLINE_PROGRAM'])
              fd = os.open(p, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, 'rb') as stream:
                  info = os.fstat(stream.fileno())
                  assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size <= 100000
                  raw = stream.read(100001)
              assert hashlib.sha256(raw).hexdigest() == '1912b44797b9e3a454b406083e5a5ee2f9b1bd5016c3237bc33e0cf91905e402', 'deadline supervisor changed'
              scope = {'__name__': 'deadline_supervisor'}
              exec(compile(raw, str(p), 'exec'), scope)
              raise SystemExit(scope['main'](sys.argv[1:], os.environ))
          except Exception:
              print('::error::absolute deadline supervision missing or refused', file=__import__('sys').stderr)
