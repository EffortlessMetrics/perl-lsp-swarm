# Advisory ownership boundaries for repository surfaces where concurrent
# lanes have already risked (or produced) same-seam writes. Each row records
# which durable claim owns a surface's NEXT change. It never records lane
# liveness, topology, wake events, queue order, retries, or task state —
# root AGENTS.md keeps those runtime-local, expressed through issue/PR
# comments at lane-brief time, not tracked files.
#
# Status vocabulary (closed set):
#   open   - the listed issues hold live claims on this surface's next change
#   landed - the governing claim has landed; new work extends the landed
#            contract instead of forking it
#
# Every path existed at main 296ae9bb4141 on 2026-08-26.
last_verified = 2026-08-26

