project: product
component: Developer experience
kind: Fixed
body: >-
  The one-shot binary identity surface is now discoverable and honest about a
  rejected mix. `perllsp --identity`, `perllsp --identity-json`, and the composed
  `perllsp --info --json` form now appear in `perllsp --help`, in the generated
  bash/zsh/fish/powershell completions, and in `man/perl-lsp.1`, each in that
  surface's own spelling. Asking for identity alongside other operands no longer
  falls through to the ordinary parser: `perllsp --identity --log` used to deny a
  real, supported flag as an unknown option, and `perllsp --info --json --log` used
  to answer a requested JSON packet with the human `--info` projection, dropping
  the request without a word. Both are now rejected with a message naming the flag,
  which is the behaviour the identity resolver's own documentation already claimed.
  The rejection covers the whole command line, so a valued option such as
  `perllsp --info --json --feature-profile prod` is refused rather than answered with
  human text, and extra operands after a bare `--` still count as extra. Operands
  after a bare `--` are still read as file paths, so checking a file named
  `--identity` is unaffected.
