project: product
component: CI and developer tooling
kind: Fixed
body: "The lane-history readers now honour the artifact's own version. `.ci/metrics/ci-lane-history.json` is written with a `schema_version` and the repository already gates the checked-in payload on it, but `learned_estimate.py` and `pr_plan.py` loaded the file and reached for `lanes`, `p50` and `static_floor` by name without checking it. A future version that renames one of those fields was therefore not refused, it was read with the wrong spellings: a renamed `static_floor` fell out of its guard and the planner priced a lane at a bare `p50 * 1.15`, dropping a 45-minute static floor to 4.6 while still reporting the estimate as learned. Both readers now bound to the producer's `SCHEMA_VERSION` authority and refuse a payload whose version they do not understand, so the affected lanes fall back to their static floors instead of being silently under-priced."
time: 2026-09-27T21:15:00Z
