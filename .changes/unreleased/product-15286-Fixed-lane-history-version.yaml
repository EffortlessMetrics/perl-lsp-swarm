project: product
component: CI and developer tooling
kind: Fixed
body: "The lane-history readers now honour the artifact's own version. `.ci/metrics/ci-lane-history.json` is written with a `schema_version` and the repository already gates the checked-in payload on it, but `learned_estimate.py` and `pr_plan.py` loaded the file and reached for `lanes`, `p50` and `static_floor` by name without checking it. A future version that renames one of those fields was therefore not refused, it was read with the wrong spellings: a renamed `static_floor` fell out of its guard and the planner priced a lane at a bare `p50 * 1.15`, dropping a 45-minute static floor to 4.6 while still reporting the estimate as learned. Each reader now pins the history version its own parser can read -- `learned_estimate.py`'s `SUPPORTED_SCHEMA_VERSION` and `pr_plan.py`'s `HISTORY_SCHEMA_VERSION`, both requiring an exact integer (JSON `true` and `1.0` are refused) -- and refuses a payload whose version it does not understand. On that refusal `learned_estimate.py` emits a null estimate with `learned: false`, and `pr_plan.py` raises `SystemExit` instead of producing a plan; neither silently falls back to static floors on an unfamiliar version."
time: 2026-09-27T21:15:00Z
