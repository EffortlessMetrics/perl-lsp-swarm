project: product
component: Packaging and distribution
kind: Changed
body: >-
  Future releases publish only the perllsp runtime Docker image. Unsuffixed
  builder tags stop receiving new releases; existing registry tags are not
  rewritten. Use the documented runtime image references to run perllsp.
  The Rust toolchain Dockerfile remains a local CI scan input.
