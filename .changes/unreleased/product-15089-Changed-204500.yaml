kind: Changed
body: >-
  Publish only the perllsp runtime Docker image. The unsuffixed
  `perl-lsp:<version>` tags previously carried the Rust build toolchain, which
  ships no `perllsp`; that image is retired from product publication and the
  `-perl` runtime tags are the supported reference.
