project: vscode
component: Editor behavior
kind: Security
body: "The extension now forwards external include roots to the server only from the user/machine-scoped externalIncludePaths setting (inspect().globalValue), never from workspace- or folder-scoped values, so a checked-in .vscode/settings.json can no longer widen the server's include path on behalf of the user."
