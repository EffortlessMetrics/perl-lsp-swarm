kind: Added
body: "Add a new Tier-1 leaf crate, perl-operation-trace, owning the versioned operation_trace.v1 contract: ephemeral, session-scoped operation identity (SessionId, OperationId, OperationIdAllocator) that deliberately never uses perl-source-identity's sha256: durable-identity wire prefix and depends on no hash function at all; closed OperationKind and OperationEventKind vocabularies that fail closed on unknown wire input; OperationContext, the one value a caller threads across a call/async/background boundary instead of a hand-wired (OperationId, parent) pair -- bundling an operation's id, optional parent (root()/child() constructors, where child always derives its parent from the context it is called on so an unrelated parent cannot be passed by mistake), OperationKind, and up to MAX_ATTACHED_IDENTITY_REFS opaque IdentityRefs tagged by the closed IdentityRefKind (Source/Environment/Fact/Process/Receipt/Generation); a three-tier privacy model (Public, Private redacted-with-length, Secret redacted-with-nothing) modeled on perl-subprocess-runtime's process-identity module; an EventRegistry validating required/allowed fields and their declared privacy tier; and an in-memory OperationRecorder, keyed on &OperationContext, enforcing exactly-one-terminal-event, no-event-after-terminal, no self-parent, no parent cycle, one kind and one parent per operation (KindConflict/ParentConflict reject disagreement rather than silently overwriting), and explicit observable truncation markers on RecorderBounds violation instead of silent drops -- including a deliberate, tested rule that a Terminal event arriving at the max_events cap is truncated like any other event rather than given priority. No subsystem is instrumented by this PR: the five independent operation-identity vocabularies already on main (perl-subprocess-runtime's OperationId, perl-parser-core's ParserOperationId, perl-workspace's WorkspaceRuntimeOperationId, perl-semantic-facts's ReachabilityOperationKind, and perl-dap's wire operationId) are unchanged; this crate only defines the vocabulary they could later be correlated through."
