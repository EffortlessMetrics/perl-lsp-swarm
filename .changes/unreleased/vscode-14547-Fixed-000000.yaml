project: vscode
component: Editor behavior
kind: Fixed
body: "`perl-lsp.autoPopulateNewFiles` now honours the per-folder scope it is contributed with. The setting is declared `resource`, so the settings UI offers it per workspace folder, but the file-creation listener read it once without a resource before looking at the created files — a read with no resource cannot see a folder value, so in a multi-root workspace the global or workspace-wide value decided the behaviour for every folder. The gate is now resolved against each created file's own URI: a folder that sets the value to `false` no longer has new `.pm` and `.t` files auto-populated even when the workspace-wide value is `true`, and a folder that sets it to `true` gets population even when the workspace-wide value is `false`. A workspace opened as a single folder has no per-folder layer and behaves exactly as before, as do files created outside any workspace folder and workspaces that never set the value. A `.code-workspace` listing exactly one folder is multi-root for this purpose: a value set on that folder now takes effect where it previously did not."
time: 2026-09-02T00:00:00Z
