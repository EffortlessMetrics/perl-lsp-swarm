project: product
component: Editor integration
kind: Fixed
body: VS Code inline completion now runs through one provider owner instead of two competing registrations, and forwards the editor's actual trigger kind, selected completion, and cancellation. Explicit invocations previously reached the server labelled as automatic, which the server refuses before any backend call, so streamed AI suggestions could never appear.
