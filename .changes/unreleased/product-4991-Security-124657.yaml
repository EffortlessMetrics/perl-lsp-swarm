body: "include_paths set via a workspace's own .perl-lsp.toml are now rejected (with a visible warning) when absolute or when they resolve outside the workspace, instead of being silently honored — closing a path-traversal vector where a hostile cloned repository could redirect module resolution to read files outside the workspace during hover/go-to-definition."
