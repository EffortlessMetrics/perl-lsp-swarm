body: "Carmel R1 root/state leaf of the S8 research contract (#13642). perl-workspace-core gains an additive `BuildSystemKind::Carmel` identity (key `carmel`) and a bounded, non-executing detection module (`carmel`): marker facts for `cpanfile`, `cpanfile.snapshot`, `.carmel/MySetup.pm`, and the `local/.carmel` rollout sentinel; the post-rollout `local/lib/perl5` root candidate admitted only through the sentinel at WorkspaceConvention authority; dev-mode artifact roots parsed from the generated MySetup environment block (source-receipt-pinned to Carmel::App::dump_bootstrap's Data::Dumper shape) in producer order at Ambient authority with explicit `carmel_artifact_unverified`, `carmel_base_mismatch`, and `carmel_dev_state_unparsable` limitations; the Carton/Carmel `manager_ambiguous` lock window that attributes no roots; and the five relative watcher inputs for #13640 (ambient repository deliberately unwatched; interpreter identity is an invalidation event, not a glob). The dependency detector retires the baseless `vendor/lib/perl5` Carmel marker (no such path in Carmel source; `vendor/cache` is a tarball dir), admits the shared install-base root through the rollout sentinel, keeps Carmel dev-mode out of the relative-literal detector, and preserves the #4998 workspace-contained recurrence gate."
