body: "Add the pr_fast leg for the four healthy `required-features = [\"test-helpers\"]` perl-dap integration targets (eval_ref_cache_miss_resume_tests, dap_evaluate_comprehensive_tests, dap_variable_reference_hardening_tests, pause_signal_delivery_tests). A regression in any of these targets can now be caught on the pr_fast lane whenever the PR diff touches perl-dap, closing the #14458 residual left after #14334 closed the merge-gate leg via `unit_dap_support_full`. The new `unit_routed_full_dap_test_helpers` gate is `rust_package_scoped` to `perl-dap` and runs a single `cargo test --locked --features test-helpers -p perl-dap --test <target>...` invocation that mirrors the merge-gate leg's exact selector set, so the existing `dap_helper_command_error` contract governs both gates."
