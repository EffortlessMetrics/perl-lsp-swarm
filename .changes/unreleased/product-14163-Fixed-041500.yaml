body: The references provider-decision receipt now tells the truth about how current its answer is. Its `freshness` field is derived from the tier that answered and the workspace index state actually observed, instead of always reporting `fresh`; and an empty "no references" result now reports the index state it was really computed over instead of always reporting `none`. A complete index that finds no references is reported as a fresh, trustworthy negative, while an empty result over a stale, partial, or absent index reports `unknown`. Receipt/observability fields only; no change to references results.
