body: "Operation execution authorization for the project environment model (#11095). perl-workspace-core gains a pure, versioned vocabulary that answers whether a specific user- or CI-requested operation may execute now, with these inputs, under this scope and authority: nine capability axes, a reviewed 15-entry operation registry mapping each profile to its exact required capabilities and scope class, an 11-class input-risk vocabulary, and a total evaluator compiling ExecutionIntent plus AuthorizationEvidence into an ExecutionAuthorizationDecision. Workspace source trust, environment input authority, input risk, user intent, capability requirement, policy denial, and execution authorization stay distinct facts; no boolean or enum ordinal stands in for the decision. Evaluation fails closed: every non-permitting outcome grants exactly nothing, the decision has no public constructor and no capability-set mutation, so an allowed-limited grant cannot be widened downstream, and a decision that is re-dated to another generation, widened in transit, or presented under a foreign schema version fails revalidation. Ambient PATH and Perl-environment inputs, and paths escaping the workspace root, are evaluated whether or not an intent declares them, so narrowing a declaration cannot buy authority; a disqualifying tool input is found before an enabling one, so a verified interpreter cannot mask a project-supplied wrapper beside it, nor a peer tool the user refused. Most-restrictive-wins holds within an input class as well as across classes, so enabling a cadence in one user setting does not override disabling it in another. Public explanations carry only stable classes, digests, generations, and reason codes while still naming the blocked capability and the authority a user can act on. No configuration read, trust transition, process spawn, product behavior, or client UI is introduced, and no production surface consumes it yet."
