body: "The AI completion toggles (perl-lsp.aiCompletion.enabled and aiCompletion.streaming.enabled) are now machine-scoped, so a checked-in .vscode/settings.json can no longer turn AI completion on for a cloned repository; the first-run \"Enable\" prompt now writes to your user settings instead of workspace settings, and the extension forwards only those machine-scoped values to the server."
