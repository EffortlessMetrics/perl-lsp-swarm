project: product
component: Developer experience
kind: Fixed
body: "`perllsp --doctor` no longer contradicts itself or leaks raw child stderr when an external tool's version probe fails. A line now names the step that failed and its exit code, and points at re-running with `--json` added for probe detail. The exit status is reported once instead of composing two status phrasings (`exited with status exit code: 29`). The JSON `error` field keeps its string shape and still carries the full stderr, with the same doubled status phrasing normalized inside it."
