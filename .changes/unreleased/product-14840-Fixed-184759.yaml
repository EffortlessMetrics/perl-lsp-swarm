body: "Scope diagnostics defer new `my` and `state` bindings until the whole modified statement ends. Both `print $x if my $x = 1;` and `my $x = 1 if $x;` now report `UndeclaredVariable` under `use strict`, matching Perl. Existing and outer bindings remain visible, `our` retains immediate visibility, and completed nested blocks expose only their own declarations. The deferred bindings become available to following statements while retaining redeclaration, shadowing, and unused-variable diagnostics."
