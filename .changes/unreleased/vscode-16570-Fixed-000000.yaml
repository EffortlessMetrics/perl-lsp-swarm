project: vscode
component: Developer experience
kind: Fixed
body: "A failing VSIX packaging step now says what failed instead of exiting 1 with no output. `packageVsix()` no longer returns a bare `false` that the caller could only turn into an exit code; each failing stage (vsce packaging, prebuilt payload member, prebuilt inventory SHA, and the inventory ratchet) throws a reason naming the stage and the artifact, so the existing CLI `catch` reports it on stderr. The inventory ratchet also writes its violations to stderr, naming the offending file with its baseline and actual sizes, and the missing-file case names the file. What the ratchet rejects is unchanged."
