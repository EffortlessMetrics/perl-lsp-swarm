body: >-
  The Cargo Deny policy-enforcement lane is green again on main: RUSTSEC-2026-0543
  marks chrono as unmaintained with all versions affected and no safe upgrade
  available, so the advisory is disposed explicitly in deny.toml with an accurate
  reachability statement rather than by a dependency bump. chrono stays a direct
  dependency of six workspace crates; the published exposure is one runtime call
  site in the published perl-corpus crate plus two dev-target sites in
  perl-lsp-rs, and the remaining call sites are in publish = false workspace
  tooling. The disposition records bounded maintenance-abandonment exposure
  rather than claiming no risk, and the durable chrono migration to jiff or
  time is tracked separately (#19542)
