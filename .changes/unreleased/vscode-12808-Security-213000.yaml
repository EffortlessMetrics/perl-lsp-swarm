project: vscode
component: Packaging and distribution
kind: Security
body: Managed binary archive downloads are bounded independently of timeout, and extraction inspects the archive then installs only the unique perllsp executable and optional perl-dap. Oversized, traversing, linked, or ambiguous archives are rejected and leave no partial candidate.
