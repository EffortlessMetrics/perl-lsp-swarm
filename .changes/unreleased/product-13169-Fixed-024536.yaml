body: >-
  Recognize Perl's contiguous string-repetition assignment operator (`x=`) as
  a right-associative assignment in direct expressions, variable-declaration
  initializers, and the `pos` named-unary call path. Spaced `x =` is never
  normalized into the operator; the same-line leftover parses as ordinary
  tokens without a repetition diagnostic.
