kind: Fixed
body: >-
  Document-symbol children no longer order nondeterministically across
  processes. Child symbols previously fell through a complete
  (priority, start, end, name) sort-key tie to the symbol table's
  HashMap bucket order, which permutes between runs; a final `kind`
  tiebreak now decides those ties, so repeated outline requests return a
  byte-identical tree.
