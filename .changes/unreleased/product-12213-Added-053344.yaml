body: >-
  Add the pure #11179 standalone install contract: an immutable candidate
  manifest whose domain-separated identity is recomputed over canonical bytes,
  a current-selection record with monotonic generations and governed
  previous-known-good semantics, a closed transition record keeping product,
  cleanup, startup, and PATH outcomes independent, three closed JSON schemas
