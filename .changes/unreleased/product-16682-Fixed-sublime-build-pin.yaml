project: product
component: Developer experience
kind: Fixed
body: >-
  The Sublime real-host exact-source lane now runs on digest-verified Sublime
  Text build 4200 on all three platforms. A controlled 4200/4213 comparison
  traced the newer host's zero-test failure to pinned typing_extensions 4.7.1:
  under Python 3.14, its ParamSpec initialization raises an AttributeError
  before LSP enables the window registry (#16388). The setup action still
  downloads the latest ST4 build before the workflow replaces that install;
  this pin fixes the build used for the test journey.
