project: product
component: Continuous integration
kind: Fixed
body: "ci.yml's `merge-gate` job now exercises the 12 `xtask/src/tasks/ci_subject_materializer.rs` unit tests and the 3 `xtask/src/tasks/file_policy.rs` preapproval unit tests on every PR that lands in the merge surface. Previously no workflow named either target — `xtask` is a bin target so the merge gate's `cargo test --workspace --lib` never compiled them — which let a future revert of `deterministic_git_command`'s `-c core.autocrlf=false -c merge.renormalize=false` git wrapper flags, a bump of `PREAPPROVED_SUBJECT_CONTRACT_VERSION` without retargeting the live workflow contract-version, or a relaxation of `validate_preapproved_subject_workflow`'s structural rules land without the merge surface ever failing. Same defect shape as #13484, which is the precedent for keeping the test gating co-located with the existing required `cargo test -p xtask --bin xtask` invocations."
time: 2026-09-22T03:00:00Z
